        "没奈何，只得将言又问他说：陛下，你说的这话，全不在理。那人说：师父呵，说起他的本事，果然世间罕有。自从害了朕，他当时在花园内摇身一变，就变做朕的模样，更无差别。唐僧说：陛下，那妖怪倒有些神通，变作你的模样，侵占你的乾坤，文武不能识，后妃不能晓，只有你死的明白，你为什么不在地府阎王处具告，把你的屈情伸诉伸诉？那人说：他的神通广大，官吏情熟：都城隍常与他会酒，海龙王尽与他有亲，东岳齐天是他的好朋友，十代阎罗是他的异兄弟。唐僧说：陛下，你地府里既没本事告他，却来我阳世间作甚？那人说：师父呵，我这一点冤魂，怎敢上你的门来？",
        "他说你手下有一个大徒弟，是齐天悟空，极能斩怪降魔。唐僧说：陛下，你此来是请我徒弟与你去除却那妖怪么？唐僧说：我徒弟干别的事不济，但说降妖捉怪，正合他宜。陛下呵，虽是着他拿怪，但恐理上难行。唐僧说：那妖怪既神通广大，变得与你相同；满朝文武，一个个言和心顺；三宫妃嫔，一个个意合情投。倘被多官抓住，说我们欺邦灭国，问一款大逆之罪，困陷城中，却不是画虎刻鹄也？唐僧说：你的灾屯，想应天付，却与我相类。我在水中逃了性命，幸金山寺恩师救养成人。又问：你纵有太子在朝，我怎么与他相见？唐僧说：他被妖魔拘辖，连一个生身之母尚不得见，我一个和尚，欲见何由？",
        "唐僧说：也罢，等我留下，着徒弟与你处置。我这去，还央求夜游神，再使一阵神风，把我送进皇宫内院，托一梦与我那正宫皇后，让他母子们合意，你师徒们同心。那冤魂磕头拜别，举步相送，不知怎么踢了脚，跌了一个筋斗，把唐僧惊醒，却原来是南柯一梦。原说只做和尚，如今拿做奴才，日间挑包袱、牵马，夜间提尿瓶、务脚！唐僧说：徒弟，我刚才伏在案上打盹，做了一个怪梦。悟空跳将起来说：师父，梦从想中来。唐僧说：徒弟，我这一梦，不是思乡之梦。才然合眼，见一阵狂风过处，禅房门外有一朝皇帝，自言是乌鸡国王。这等这等，如此如此，将那梦中话一一的说与悟空。",
        "悟空说：明日要你顶缸、受气、遭瘟。八戒笑说：一桩儿也是难的，三桩儿却怎么耽得？唐僧是个聪明的唐僧，就问：徒弟呵，此三事怎么讲？悟空说：也不消讲，等我先与你二件物。好悟空，拔了一根毫毛，吹口仙气，叫声：变！变做一个红金漆匣儿，把白玉珪放在内盛着，说：师父，你将此物捧在手中，到天晓时，穿上锦襴袈裟，去在正殿坐着念经，等我去看看他那城池。端的是个妖怪，就打杀他，也在这里立个功绩；假若不是，且休撞祸。悟空说：那太子不出城就罢，若真个应梦出城来，我定引他来见你。你把那匣盖儿扯开些，等我变作二寸长的一个小和尚，放在匣儿里，你连我捧在手中。",
        "却又一变，变做二寸长的小和尚儿，钻在红匣之内。那太子跳下马来，正要进去，只见那保驾的官将与三千人马追上，簇簇拥拥，都入山门里面。却才举目观瞻，又欲游廊玩景，忽见正当中坐着一个和尚，太子大怒说：这个和尚无礼！说声拿字，两边校尉一齐下手，把唐僧抓将下来，急理绳索就捆。悟空在匣里默默的念咒，教说：护法诸天、 六丁六甲，我今设法降妖，这太子不能知识，将绳要捆我师父，你们就早护持；若真捆了，你们都该有罪。那悟空暗中吩咐，谁敢不遵，却将唐僧护持定了，那些人摸也摸不着他光头，好似一壁墙挡住，难拢其身。那太子说：你是那方来的，使这般隐身法欺我？",
        "唐僧上前施礼说：贫僧无隐身法，原来是东土唐僧，上雷音寺拜佛求经进宝的和尚。唐僧说：我身上穿的这袈裟，是第三样宝贝。太子听完，心中大怒说：这泼和尚胡说！唐僧进前一步，合掌问：殿下，为人生在天地之间，能有几恩？太子说：感天地盖载之恩，日月照临之恩，国王水土之恩，父母养育之恩。太子怒说：和尚是那游手游食削发逆君之徒。但只这红匣内有一件宝贝，叫做立帝货，他上知五百年，中知五百年，下知五百年，共知一千五百年过去未来之事，就知无父母养育之恩，令贫僧在此久等多时矣。唐僧扯开匣盖儿，那悟空跳将出来，呀的两边乱走。",
        "悟空近前一齐拦住说：休嚷，不要走了风！悟空说：我是那唐僧的大徒弟，名唤悟空悟空。梦见你父王道，他被那全真欺害，推在御花园八角琉璃井内，全真变作他的模样。那太子听完，心中惨戚，暗自伤愁说：若不信此言语，他却有三分儿真实；若信了，怎奈殿上见是我父王？这才是进退两难心问口，三思忍耐口问心。悟空见他疑惑不定，又上前说：殿下不必心疑，请殿下驾回本国，问你国母娘娘一声，看他夫妻恩爱之情，比三年前怎么。悟空扯住说：你这些人马都回，却不走漏消息？恐那妖怪神通广大，一时走了消息，你娘儿们性命具难保也。看他：指挥号令屯军士，上马如飞就转城。"
      ],
      "38": [
        "再说那乌鸡国王太子自别悟空，不多时，回至城中。太子磕头说：母亲，我问你：就位登龙是那个？太子磕头说：还请母亲赦子无罪，敢问；不赦，不敢问。太子说：母亲，我问你三年前夫妻宫里之事，与后三年恩爱同否怎么？娘娘见说，魂飘魄散，急下亭抱起，紧搂在怀，眼中滴泪说：孩儿，我与你久不相见，怎么今日来宫问此？太子发怒说：母亲有话早说；不说时，且误了大事。娘娘才喝退左右，泪眼低声说：这桩事，孩儿不问，我到九泉之下，也不得明白。既问时，听我说：三载之前温又暖，三年之后冷如冰。枕边切切将言问，他说老迈身衰事不兴。",
        "那娘娘说：儿呵，外人之言，你怎么就信为实？太子说：儿还不敢认实，父王遗下表记与他了。娘娘问是何物，太子袖中拿出那金厢白玉珪，递与娘娘。那娘娘认得是当时国王之宝，止不住泪如泉涌。娘娘说：儿呵，我四更时分，也做了一梦，梦见你父王水淋淋的站在我跟前，亲说他死了，鬼魂儿拜请了唐僧，降假皇帝，救他前身。正在这里狐疑，怎知今日你又来说这话，又将宝贝拿出。真个是噙泪磕头辞国母，含悲顿首复唐僧。只见那猴王从正殿摇摇摆摆走来，那太子双膝跪下说：师父，我来了。悟空微微笑说：若是那般冷呵，想是个什么冰冷的东西变的。",
        "问你们讨个人情，快将獐鹿兔、走兽飞禽，各寻些来，打发他回去。山神、土地听完，敢不承命，又问各要几何。那各神就着本处阴兵，刮一阵聚兽阴风，捉了些野鸡山雉、角鹿肥獐、狐獾狢兔、虎豹狼虫，共有百千余只，献与悟空。悟空说：我不要，你可把他都捻就了觔，单摆在那四十里路上两旁边，教那些人不放鹰犬，拿回城去，算了你们之功。悟空才按云头，对太子说：殿下请回，路上已有物了，你自收去。只见那路旁边果然有无限的野物，军士们不放鹰犬，一个个具着手擒捉喝采，具道是千岁殿下的洪福，怎知是我的神功。却又安排斋供，管待了唐僧，依然还歇在禅堂里。",
        "悟空说：他就是个没嘴的葫芦，也与你滚上几滚。他敢说：我是乌鸡国王，有甚逆天之事，你来拿我？悟空说：八戒生得夯，你有一些偏向他。悟空说：你若不向他呵，且如今把胆放大些，与沙僧只在这里。待我与八戒趁此时先入那乌鸡国城中，寻着御花园，打开琉璃井，把那皇帝倒下的人捞将上来，包在我们包袱里。明日进城，且不管什么倒换文牒，见了那妖怪，抽出棍来就打。他但有言语，就将骨衬与他看，说：你杀的是这个人。唐僧听完，暗喜说：只怕八戒不肯去。你只像我叫你时不答应，半个时辰就了。我这去，但凭三寸不烂之舌，不要说是猪八戒，就是猪九戒，也有本事让他跟着我走。",
        "那八戒听见说都与他，他就心里高兴极了，一毂辘爬将起来，套上衣服，就和悟空走路。两个密密的开了门，躲离唐僧，纵祥光，径奔那城。八戒说：正好，正好，人都在头觉里正浓睡也。悟空说：兄弟，前后门皆紧急，怎么得入？八戒说：那见做贼的从门里走么，瞒墙跳过就罢。悟空依言，将身一纵，跳上里罗城墙。悟空近前看了，有几重封皮，公然将锁门锈住了，就命八戒动手。那八戒抽出铁钯，尽力一筑，把门筑得粉碎。悟空先举步入，忍不住跳将起来，大呼小叫。吓得八戒上前扯住说：哥呀，害杀我也。悟空说：兄弟呵，你说我发急为什么？",
        "悟空说：宝贝沉在水底下哩，你下去摸一摸来。八戒真个深知水性，却就打个猛子，淬将下去。八戒大惊说：罢了，罢了，错走了路了，蹡下海来也。原来八戒不知此是井龙王的水晶宫。八戒正叙话处，早有一个巡水的夜叉开了门，看见他的模样，急抽身进去报说：大王，祸事了，井上落一个长嘴大耳的和尚来了，赤淋淋的，衣服全无，还不死，逼法说话哩。那井龙王忽闻此言，心中大惊说：这是天蓬元帅来也。昨夜夜游神奉上敕旨，来取乌鸡国王魂灵去拜见唐僧，请齐天悟空降妖。这怕是齐天悟空、天蓬元帅来了，却不可怠慢他，快接他去也。那龙王整衣冠，领众水族，出门来大声说：天蓬元帅，请里面坐。",
        "你若肯驮他出去，见了齐天悟空，假有起死回生之意呵，不要说宝贝，凭你要什么东西都有。八戒说：既这样看来，我与你驮出去，只说把多少烧埋钱与我？龙王差两个有力量的夜叉，把尸抬将出去，送到水晶宫门外，丢在那厢，摘了辟水珠，就有水响。八戒急回头看，不见水晶宫门，一把摸着那皇帝的倒下的人，慌忙他脚软筋麻，撺出水面，扳着井墙，叫说：师兄，伸下棒来救我一救。八戒说：哪里有，只是水底下有一个井龙王，让我驮死人，我没有驮，他就把我送出门来，就不见那水晶宫了，只摸着那个倒下的人。悟空说：那个就是宝贝，如为什么不驮上来？",
        "八戒说：不羞，连你穿的也没有，又替我换？悟空说：就伸过孤拐来，打二十棒。八戒慌了说：哥哥，那棒子重，若是打上二十，我与这皇帝一般了。悟空说：怕打时，趁早儿驮着走路。八戒果然怕打，没好气，把倒下的人拽将过来，背在身上，拽步出园就走。那唐僧睡不着，正与沙僧讲悟空哄了八戒去久不回之事。忽听得他来叫了一声，唐僧连忙起身说：徒弟，看什么？八戒说：悟空的外公，教八戒驮将来了。悟空说：你这馕糟的八戒，我哪里有什么外公？八戒说：哥，不是你外公，却教八戒驮他来怎么？那唐僧与沙僧开门看处，那皇帝容颜未改，似活的一般。"
      ],
      "39": [
        "八戒说：不要住，只管念，只管念。悟空骂说：你这呆孽畜，撺道师父咒我哩。八戒笑得打跌说：哥耶，哥耶，你只晓得捉弄我，不晓得我也捉弄你捉弄。悟空说：师父不要念，不要念，待我阳世间医罢。悟空说：我如今一筋斗云，撞入南天门里，不进斗牛宫，不入灵霄殿，径到那三十三天之上，离恨天宫兜率院内，见太上老君，把他九转还魂丹求得一粒来，管取救活他也。八戒说：不消讲，这猴子一定是要我哭哩。八戒说：哥哥，你自去，我自哭罢了。悟空说：哭有几样：若干着口喊，谓之嚎；扭搜出些眼泪儿来，谓之啕，又要哭得有眼泪，又要哭得有心肠，才算着嚎啕痛哭哩。",
        "悟空笑说：真个没有，我问别处去求罢。老君忽的寻思说：这猴子惫懒哩，说去就去，只怕溜进来就偷。就命仙童叫回来说：你这猴子，手脚不稳，我把这还魂丹送你一丸罢。悟空说：老官儿，既然晓得我的手段，快把金丹拿出来，与我四六分分，还是你的好运气哩；不然，就送你个皮笊篱──一捞个罄尽。那老祖取过葫芦来，倒吊过底子，倾出一粒金丹，递与悟空说：止有此了，拿去，拿去。悟空接了说：且休忙，等我尝尝看，只怕是假的，不要被他哄了。慌忙那老祖上前扯住，一把揪着顶瓜皮，揝着拳头，骂说：这泼猴若要咽下去，就直打杀了。",
        "悟空接了水，口中吐出丹来，安在那皇帝唇里。悟空说：师父，弄我金丹也不能救活，可是掯杀我么？那八戒上前就要度气，唐僧一把扯住说：使不得，还教悟空来。那师父甚有主张：原来猪八戒自幼儿伤生作孽害人，是一口浊气。惟悟空从小修持，咬松嚼柏，吃桃果为生，是一口清气。这悟空上前，把个雷公嘴，噙着那皇帝口唇，呼的一口气吹入咽喉，度下重楼，转明堂，径至丹田，从涌泉倒返泥垣宫。双膝跪在尘埃说：记得昨夜鬼魂拜谒，怎知道今朝天晓返阳神。唐僧慌忙搀起说：陛下，不干我事，你且谢我徒弟。悟空笑说：师父说什么话，常言说：家无二主。",
        "悟空说：你把那一担儿分为两担：将一担儿你挑着，将一担儿与这皇帝挑。那八戒就弄玄虚，将行李分开，就问寺中取条匾担，轻些的自己挑了，重些的教那皇帝挑着。悟空笑说：陛下，着你那般打扮，挑着担子，跟我们走走，可亏你么？那国王慌忙跪下说：师父，你是我重生父母一般，不要说挑担，情愿执鞭坠镫，伏侍老爷，同行上西天去也。悟空说：不要你去西天，我内中有个缘故。八戒听言说：这样看来，他只挑四十里路，我八戒还是长工。悟空说：兄弟，不要胡说，趁早外边引路。真个八戒领那皇帝前行，沙僧伏侍师父上马，悟空随后。只见那本寺五百僧人齐齐整整，吹打着细乐，都送出山门之外。",
        "悟空说：陛下切不要伤感，恐走漏消息。这棍子在我耳朵里跳哩，如今决要见功，管取打杀妖魔，扫荡邪物。这悟空引唐僧站站在白玉阶前，挺身不动。那阶下众官无不悚惧说：这和尚十分愚浊，怎么见我王就不下拜？说不了，只听得那魔王开口问：那和尚是那方来的？悟空昂然答说：我是南赡部洲东土大唐国奉钦差前往西域天竺国大雷音寺拜活佛求真经者。那魔王闻说，心中作怒说：你东土就怎么？悟空笑说：我东土古立天朝，久称上国，你们原来下土边邦。自古说：上邦皇帝，为父为君；下邦皇帝，为臣为子。那魔王大怒，教文武官：拿下这野和尚去！",
        "悟空昂然而答说：我师父原来唐王唐僧，号说：唐僧。因我师父敷演经文，广运慈悲，忽得南海观世音菩萨指教来西。前至两界山，收了我做大徒弟，姓孙，名悟空悟空；又到乌斯国界高家庄，收了二徒弟，姓猪，名悟能八戒；流沙河界，又收了三徒弟，姓沙，名沙僧和尚；前日在敕建宝林寺，又新收个挑担的行童道人。魔王闻说，又没法搜检那唐僧，弄巧语盘诘悟空，怒目问：那和尚，你起初时，一个人离东土，又收了师徒四人，那三僧可让，这一道难容。悟空捻他一把说：你休怕，等我替你供。好悟空，趋步上前，对怪物大声说：陛下，这老道是一个瘖哑之人，却又",
        "一样两个唐僧，实难辨认：倘若一棒打杀妖怪变的唐僧，这个也成了功果；假若一棒打杀我的真实师父，却怎么好？只得停手，叫八戒、沙僧问：果然那一个是怪，那一个是我的师父？八戒说：你在半空中相打相嚷，我瞥瞥眼就见两个师父，也不知谁真谁假。悟空听完，捻诀念声咒语，叫那护法诸天、六丁六甲、五方揭谛、四值功曹、一十八位护驾伽蓝、当坊土地、本境山神说：我至此降妖，妖魔变作我师父，气体相同，实难辨认。原来那妖怪善腾云雾，听得悟空言语，急撒手跳上金銮宝殿。若不是唤那几位神来，这一下，就是二十个唐僧，也打为肉酱！",
        "那魔王被八戒、沙僧使钉钯、宝杖左右攻住了。悟空笑说：我要再去，当面打他，他却有些怕我，只恐他又走了。等我跳高些，与他个捣蒜打，结果了他罢。这悟空纵祥光，起在九霄，正欲下个切手，只见那东北上，一朵彩云里面，厉声叫说：孙悟空，且休下手。急收棒，上前施礼说：菩萨，哪里去？那菩萨袖中拿出照妖镜，照住了那妖怪的原身。悟空才招呼八戒、沙僧齐来见了菩萨。悟空说：菩萨，这是你坐下的一个青毛狮子，却怎么走将来成精，你就不收服他？菩萨说：悟空，他没有走，他是佛旨差来的。悟空说：这畜类成精，侵夺帝位，还奉佛旨差来。"
      ],
      "40": [
        "悟空将菩萨降魔收怪的那一节，陈诉与他君臣听了，一个个顶礼不尽。八戒慌了说：哥哥，不要是妖精弄法，假捏文殊菩萨，哄了我们，却又变作和尚，来与我们斗智哩？悟空看时，原来是那宝林寺僧人，捧着那冲天冠、碧玉带、赭黄袍、无忧履进得来也。且教道人过来，摘下包巾，戴上冲天冠；脱了布衣，穿上赭黄袍；解了绦子，系上碧玉带；褪了僧鞋，登上无忧履；教太子拿出白玉珪来，与他执在手里：早请上殿称孤。那皇帝哪里肯坐，哭起来啼，跪在阶心说：我已死三年，今蒙师父救我回生，怎么又敢妄自称尊；请那一位师父为君，我情愿领妻子城外为民足矣。",
        "悟空笑说：只管走路，不要再多心，我自有防护。又见那跳天搠地献果猿，丫丫叉叉带角鹿，呢呢痴痴看人獐。登得洞门唿喇的响，惊得飞禽扑鲁的起。悟空大惊，走近前，把唐僧搊着脚，推下马来，叫：兄弟们，不要走了，妖怪来矣。慌忙个八戒急抽出钉钯，沙僧忙抡宝杖，把唐僧围护在当中。去那山坡里，摇身一变，变作七岁顽童，赤条条的身上无衣，将麻绳捆了手足，高吊在那松树梢头，口口声声只叫：救人，救人！再说那孙悟空忽抬头再看处，只见那红云散尽，火气全无。唐僧说：你说妖怪来了，怎么又敢走路？悟空说：我才然间见一朵红云从地而起，到空中结做一团火气，一定是妖精。",
        "唐僧说：徒弟呀，那有难的人大没缘法，没有得遇着我们，我们走过他了。八戒说：在就还在山前，只是如今风转了也。悟空说：管他什么转风不转风，且走路。他心中思量说：我们唐僧在此，望见他离不上三里，却怎么这半晌还不到？不觉孙悟空仰面回观，识得是妖怪，又把唐僧撮着脚推下马来说：兄弟们，仔细，仔细，那妖精又来也。慌忙那八戒、沙僧各持钯、棍，将唐僧又围护在中间。那精灵见了，在半空中称羡不已说：好和尚！先把那有眼力的弄倒了，才捉得唐僧，不然呵，徒费心机难获物，枉劳情兴总成空。却又按下云头，恰似前番变化，高吊在松树梢头等候。",
        "唐僧大怒，哏哏的，要念紧箍儿咒。还未曾坐得稳，只听又叫：师父救人呵！唐僧抬头看时，原来是个小孩童，赤条条的吊在树上。兜住缰，就骂悟空说：这泼猴多大惫懒，全无有一一些善良之意，心心只是要撒泼行凶哩！我那般说叫唤的是个人声，他就千言万语，只嚷是妖怪。悟空见师父怪下来了，却又觌面看见模样，一则做不得手脚，二来又怕念紧箍儿咒，低着头，再也不敢回言，让唐僧到了树下。那唐僧将鞭梢指着问：你是那家孩儿？分明他是个精灵，变化得这等，那师父却是个肉眼凡胎，不能相识。怎知那无籍之人，设骗了去呵，本利无归。",
        "那妖怪对唐僧马下泪汪汪，只情磕头。唐僧心慈，就叫：孩儿，你上马来，我带你去。那妖怪说：师父呵，我手脚都吊麻了，腰胯疼痛；一则是乡下人家，不惯骑马。那妖怪抹了一眼说：师父，我的皮肤都冻熟了，不敢要这位师父驮。那妖怪也抹了一眼说：师父，那些贼来打劫我家时，一个个都搽了花脸，带假胡子，拿刀弄杖的。那妖怪物暗自欢喜，顺顺当当的要悟空驮他。悟空把他扯在路旁边，试了一试，只好有三斤十来两重。悟空笑说：你这个泼怪物，今日该死了，怎么在我面前捣鬼？妖怪说：我是好人家儿女，不幸遭此大难，怎么是个什么那话儿？",
        "孙悟空驮着妖魔，心中埋怨唐僧不知艰苦：行此险峻山场，空身也难走，却让我驮人。这个家伙不要说他是妖怪，就是好人，他没了父母，不知将他驮与谁，倒不如掼杀他罢。那妖怪物却早知觉了，就就使个神通，往四下里吸了四口气，吹在悟空背上，就觉重有千斤。悟空笑说：我儿呵，你弄重身法压我老爷哩。猴王发怒，抓过他来，往那路旁边赖石头上滑辣的一掼，将倒下的人掼得像个肉饼一般。那物在空中明明看着，忍不住心头火起说：这猴和尚十分惫懒，就作我是个妖魔，要害你师父，却还没有见怎么下手哩，你怎么就把我这等伤损？若不趁此时拿了唐僧，再让一番，越让他停留长智。",
        "悟空说：兄弟，你说的也是，奈何师父不听人说。八戒说：我才自失口乱说了几句，其实也不该散。哥哥，没及奈何，还信沙弟之言，去寻那妖怪救师父去。悟空却回嗔作喜说：兄弟们，还要来结同心，收拾了行李、马匹，上山找寻怪物，搭救师父去。那山上飞禽走兽全无，老柏乔松常见。孙悟空着实心焦，将身一纵，跳上那巅崄峰头，喝一声叫：变！变作三头六臂，似那大闹天宫的本像。将金箍棒幌一幌，变作三根金箍棒，劈哩扑辣的，往东打一路，往西打一路，两边不住的乱打。八戒见了说：沙僧，不好了，师兄是寻不着师父，恼出气心风来了。",
        "悟空说：你们原来是阴鬼之仙，有何钱钞？还请悟空与我们剿除此怪，拯救山上生灵。悟空说：你们既受他节制，常在他洞下，可知他是哪里妖精，叫做什么名字？神仙们说：说起他来，或者悟空也知道。喝退了土地、山神，却现了本像，跳下峰头，对八戒、沙僧说：兄弟们放心，再不须思念，师父决不伤生，妖精与我有亲。悟空说：刚才这伙人都是本境土地、 山神，我问他妖怪的原因，他道是牛魔王的儿子，罗刹女养的，名字唤做红孩儿，号圣婴大王。沙僧笑说：哥呵，常言说：三年不上门，当亲也不亲哩。常言说：一叶浮萍归大海，为人哪里不相逢。"
      ],
      "41": [
        "孙悟空大声说：那小妖们，趁早去报与洞主知道，让他送出我唐僧师父来，免你这一洞精灵的性命；牙迸半个不字，我就掀翻了你的山场，屣平了你的洞府。再说那妖怪自把唐僧拿到洞中，选剥了衣服，四马攒蹄捆在后院里，着小妖打干净水刷洗，要上笼蒸吃哩。忽听得报声祸事，且不刷洗，就来前庭上问：有何祸事？小妖说：有个毛脸雷公嘴的和尚，带一个长嘴大耳的和尚，在门前要什么唐僧师父哩。魔王微微冷笑说：这是悟空与猪八戒，他却也会寻哩。我拿他师父，自半山中到此，有百五十里，却怎么就寻上门来？那一班几个小妖，推出五辆小车儿来，开了前门。八戒望见说：哥哥，这妖精想是怕我们，推出车子，往那厢搬哩。",
        "一个是混元真悟空，一个是正果善财郎。二人努力争强胜，只为唐僧拜法王。那妖魔与孙悟空战经二十合，不分胜败。猪八戒在旁边看得明白：妖精虽不败阵，却只是遮拦隔架，全无攻杀之能；悟空纵不赢他，棒法精强，来往只在那妖精头上，不离了左右。八戒暗想说：不好呵，悟空溜撒，一时间丢个破绽，哄那妖魔钻进来，一铁棒打倒，就没了我的功劳。那妖怪见了心惊，急拖枪败下阵来。那妖魔捶了两拳，念个咒语，口里喷出火来，鼻子里浓烟迸出，闸闸眼，火焰齐生，那五辆车子上火光涌出。八戒慌了说：哥哥，不停当，这一钻在火里，不要想得活。",
        "悟空被他烟火飞腾，不能寻怪，看不见他洞门前路径，抽身跳出火中。那妖精在门首看得明白，他见悟空走了，却才收了火具，帅群妖，转于洞内，闭了石门，以为得胜，着小的排宴奏乐，欢笑暂且不说。再说悟空跳过枯松涧，按下云头，只听得八戒与沙僧朗朗的在松间讲话。悟空上前喝八戒说：你这八戒，全无人气。八戒笑说：哥呵，你被那妖精说着了，果然不达时务。悟空说：那妖怪物的手段比我何如？八戒见他撑持不住，却来助你一钯，不期他不识耍，就败下阵来，没天理，就放火了。你若拿得妖魔，救了师父，也是你的一件大功绩。沙僧说：我也没甚手段，也不能降妖。",
        "正行时，见一个巡海夜叉相撞，看见是孙悟空，急回到水晶宫里，报知那老龙王。悟空说：不劳茶，有一事相烦：我因师父唐僧往西天拜佛取经，经过号山枯松涧火云洞，有个红孩儿妖精，号圣婴大王，把我师父拿了去。我们禁不得他，想着水能克火，特来问你求些水去，与我下场大雨，泼灭了那火，救唐僧一难。那龙王说：悟空差了，若要求取雨水，不该来问我。须得玉帝旨意，吩咐在那地方，要几尺几寸，什么时辰起住，还要三官举笔，太乙移文，会令了雷公、电母、风伯、云童。悟空说：我也不用着风云雷电，只是要些雨水灭火。龙王说：悟空不用风云雷电，但我一人也不能助力。",
        "他出门前，对悟空说：你又来怎么？那唐僧与你做得师父，也与我做得按酒，你还思量要他哩，不要想，不要想。悟空听完，十分恼怒，抽出金箍棒，劈头就打；那妖精使火尖枪，急架相迎。这一个专救取经僧，那一个要吃唐僧。这个恨不得捉住活剥皮，那个恨不得拿来生蘸酱。那妖王与悟空战经二十回合，见得不能取胜，虚幌一枪，急抽身，捏着拳头，又将鼻子捶了两下，却就喷出火来，那门前车子上烟火迸起，口眼中赤焰飞腾。那龙王兄弟帅众水族，望妖精火光里喷下雨来。沟壑水飞千丈玉，涧泉波涨万条银。这个是唐僧有难神龙助，扳倒天河往下倾。",
        "八戒与沙僧听得呼他圣号，急忙解了马，挑着担，奔出林来，也不顾泥泞，顺涧边找寻。沙僧见了，连衣跳下水中，抱上岸来，却是孙悟空身躯。沙僧满眼垂泪说：师兄，可惜了你，亿万年不老长生客，如今化作个中途短命人。沙僧说：浑身都冷了，就有一点儿热气，怎么就得回生？八戒说：他有七十二般变化，就有七十二条性命。真个那沙僧扯着脚，八戒扶着头，把他拽个直，推上脚来，盘膝坐好。八戒将两手搓热，仵住他的七窍，使一个按摩禅法。却幸得八戒按摸揉擦，过了一会儿，气透三关，转明堂，冲开孔窍，叫了一声：师父呵！沙僧说：哥呵，你生为师父，死也还在口里。",
        "妖怪们开了门，妖精就跑在空里观看，只见八戒往南去了。妖精想着南边再无他处，一定是请观音菩萨。众小妖拿出来，换了口绳，安于洞门内暂且不说。他从那近路上，一驾云头，赶过了八戒，端坐在壁岩之上，变作一个假观世音模样，等候着八戒。那八戒正纵云行处，忽然望见菩萨。八戒停云下拜说：菩萨，弟子八戒磕头。妖精说：你不保唐僧去取经，却见我有何事干？八戒说：弟子因与师父行至中途，遇着号山枯松涧火云洞有个红孩儿妖精，他把我师父摄了去。第二阵，请龙王助雨，也不能灭火。师兄被他烧坏了，不能行动，着弟子来请菩萨。",
        "如今拿你，吊得三五日，蒸熟了赏赐小妖，权为案酒。若论你百计千方，骗了我吃，管让你一个个遭肿头天瘟。再说孙悟空与沙僧正坐，只见一阵腥风，刮面而过，他就打了一个喷嚏说：不好，不好！这阵风凶多吉少，想是猪八戒走错路也。你坐在这里看守，等我跑过涧去打听打听。沙僧说：师兄腰疼，只恐又着他手，等小弟去罢。好悟空，咬着牙，忍着疼，捻着铁棒，走过涧，到那火云洞前，叫声：泼怪！那把门的小妖又急入里报：悟空又在门首叫哩。那伙小妖枪刀簇拥，齐声呐喊，就开门，都说：抓住，抓住。悟空果然疲倦，不敢相迎，将身钻在路旁边，念个咒语，叫：变！"
      ],
      "42": [
        "好悟空，躲离了六个小妖，展开翅，飞向前边，离小妖有十数里远近，摇身一变，变作个牛魔王；拔下几根毫毛，叫：变！那一伙厮拖厮扯正行时，忽然看见牛魔王坐在中间，慌忙兴烘掀、掀烘兴扑的跪下说：老大王爷爷在这里也。那云里雾、雾里云、急如火、快如风都是肉眼凡胎，哪里认得真假，也就一同跪倒，磕头说：爷爷，小妖们是火云洞圣婴大王处差来，请老大王爷爷去吃唐僧肉，寿延千纪哩。悟空借口答说：孩儿们起来，同我回家去，换了衣服来也。小妖磕头说：望爷爷方就，不消回府罢。妖王欢喜说：你们却中用，这等来的快。这悟空昂昂烈烈，挺着胸脯，把身子抖了一抖，却将那架鹰犬的毫毛都收回身上。",
        "那悟空今早又来我的门首吆喝，我传令教拿他，慌忙他把包袱都丢下走了。却才去请父王来看看唐僧活像，方可蒸与你吃，延寿长生不老也。悟空笑说：我贤郎呵，你只知有三昧火赢得他，不知他有七十二般变化哩。妖王说：凭他怎么变化，我也认得，谅他决不敢进我门来。悟空说：我儿，你虽然认得他，他却不变大的，如狼犺大象，恐进不得你门；他若变作小的，你却难认。妖王说：凭他变甚小的，我这里每一层门上有四五个小妖把守，他怎生得入？他会变苍蝇、蚊子、虼蚤，或是蜜蜂、蝴蝶并蟭蟟虫等项，又会变我模样，你却哪里认得？妖王说：勿虑，他就是铁胆铜心，也不敢近我门来也。",
        "妖王伏于地下说：愚男一则请来奉献唐僧之肉，二来有句话儿上请：我前日闲行，驾祥光，直至九霄空内，忽逢着祖庭道龄张先生。妖王说：他见孩儿生得五官周正，三停平等，他问我是几年那月那日那时出世。悟空听完，坐在上面暗笑说：好妖怪哑！他问我什么家长礼短、少米无柴的话说，我也好信口捏脓答他。他如今问我生年月日，我却怎么知道？好猴王，也十分乖巧：巍巍端坐中间，也无一一些惧色，面上反喜盈盈的笑说：贤郎请起。我因年老，连日有事不于是心怀，把你生时果偶然忘了，且等到明日回家，问你母亲就知。妖王说：父王把我八个字时常不离口论说，说我有同天不老之寿，怎么今日一旦忘了？",
        "急上东洋大海，请到四海龙王，施雨水，又不能胜火，把弟子都熏坏了，几乎丧了残生。菩萨说：既他是三昧火，神通广大，怎么去请龙王，不来请我？悟空说：本欲来的，只是弟子被烟熏了，不能驾云，却教猪八戒来请菩萨。未曾到得宝山，被那妖精假变做菩萨模样，把猪八戒又赚入洞中，现吊在一个皮袋里，也要蒸吃哩。菩萨听说，心中大怒说：那泼妖敢变我的模样？吓得那悟空毛骨竦然，就起身侍立下面，说：这菩萨火性不退，好是怪我说的话不好，坏了他的德行，就把净瓶掼了，可惜，可惜。那龟驮着净瓶，爬上崖边，对菩萨点头二十四点，权为二十四拜。悟空见了，暗笑说：原来是看瓶的。",
        "菩萨听完，就着善财龙女去莲花池里劈一瓣莲花，放在石岩下边水上。教悟空：你上那莲花瓣儿，我渡你过海。悟空见了说：菩萨，这花瓣儿又轻又薄，怎么载得我起？菩萨说：既载得，如为什么不过去？悟空说：又没了篙、桨、篷、桅，怎生得过？悟空却脚屣实地，笑说：这菩萨卖弄神通，把我这等呼来喝去，全不费力也。那菩萨吩咐概众诸天各守仙境，着善财龙女闭了洞门。他却纵祥云，躲离普陀岩，到那边叫：惠岸何在？）原来菩萨亲传授的徒弟，不离左右，称为护法惠岸悟空。菩萨说：你快上界去，见你父王，问他借天罡刀来一用。木叉说：师父是孙悟空请来降妖，着儿拜上父王，将天罡刀借了一用。",
        "木叉对哪咤说：兄弟，你回去多拜上母亲：我事紧急，等送刀来再磕头罢。菩萨接在手中，抛将去，念个咒语，只见那刀化作一座千叶莲台。悟空在旁边暗笑说：这菩萨省使俭用。那莲花池里有五色宝莲台，舍不得坐将来，却又问别人去借。菩萨说：悟空，休言语，跟我来也。白鹦哥展翅前飞，孙悟空与惠岸随后。菩萨听完，就命住下祥云，在那山头上念一声唵字咒语。只见那山左山右，走出许多神鬼，却原来是本山土地神仙们，都到菩萨宝莲座下磕头。我今来擒此魔王，你与我把这团围打扫干净，要三百里远近地方，不许一个生灵在地。菩萨大展降魔法，袖中拿出定身禅。",
        "小妖又报说：悟空骂出那话儿来了。慌忙那小妖跌将进去说：悟空打破门了。妖王见报几次，又听说打破前门，急纵身，跳将出去，挺长枪，对悟空骂说：这猴子，老大不识起倒。悟空说：我儿，你赶老子出门，你该个什么罪名？那妖王羞怒，绰长枪，劈胸就刺；这悟空，举铁棒，架隔相还。一番搭上手，斗经四五个回合，悟空捏着拳头，拖着棒，败将下来。那妖王站在山前说：我要刷洗唐僧去哩。那妖精听完，愈加嗔怒，喝一声，赶到面前，挺枪又刺；这悟空抡棒，又战几合，败阵又走。那妖王骂说：猴子，你在前有二三十合的本事，你怎么如今正斗时就要走了，何也？",
        "悟空再说：菩萨呵，那妖怪物不怕痛，还拔刀哩。菩萨见了，唤上木叉：且不要伤他生命。却又把杨柳枝垂下，念声唵字咒语，那天罡刀都变做倒须钩儿，狼牙一般，不要能褪得。那妖精却才慌了，扳着刀尖，痛声苦告说：菩萨，我弟子有眼无珠，不识你广大法力。菩萨听完，却与二悟空、白鹦哥低下金光，到了妖精面前，问：你可受我戒行么？妖王点头滴泪说：若饶性命，愿受戒行。菩萨说：既如此，我与你摩顶受戒。就袖中拿出一把金剃头刀儿，近过去，把那妖怪分顶剃了几刀，剃作一个太山压顶，与他留下三个顶搭，挽起三个窝角揪儿。悟空在旁边笑说：这妖精大晦气，弄得不男不女，不知像个什么东西。"
      ],
      "43": [
        "再说那菩萨念了几遍，却才住口，那妖精就不疼了。悟空笑说：我那乖乖，菩萨恐你养不大，与你戴个颈圈镯头哩。那童子闻此言，又生烦恼，就此绰起枪来，望悟空乱刺。悟空急闪身，站在菩萨后面，叫：念咒，念咒。那菩萨将杨柳枝儿蘸了一点甘露，洒将去，叫声：合！那童子开不得手，拿不得枪，方知是法力深微，没奈何，才纳头下拜。菩萨念动真言，把净瓶攲倒，将那一海水依然收去，更无半点存留。对悟空说：悟空，这妖精已是降了，却只是野心不定。你如今快早去洞中，救你师父去来。悟空转身磕头说：有劳菩萨远涉，弟子当送一程。菩萨说：你不消送，恐怕误了你师父性命。",
        "悟空说：不消谢他，转是我们与他作福，收了一个童子。那唐僧得性命，全亏孙悟空；取真经，只靠美猴精。唐僧大惊说：徒弟哑，又是哪里水声？悟空笑说：你这老师父忒也多疑，做不得和尚。我们一同师徒四人，偏你听见什么水声。唐僧说：《多心经》原来浮屠山乌巢禅师口授，共五十四句，二百七十个字。悟空说：老师父，你忘了无眼耳鼻舌身意。你如今为求经，念念在意；怕妖魔，不肯舍身；要斋吃，动舌；喜香甜，触鼻；闻声音，惊耳；睹事物，凝眸；招来这六贼纷纷，怎生得西天见佛？唐僧听完，默然沉虑说：徒弟呵，我一自当年别圣君，奔波昼夜甚殷勤。",
        "沙僧大声说：棹船的，来渡人，来渡人。船上人说：我不是渡船，怎么渡人？你虽不是渡船，我们也不是常来打搅你的。那人听完，却把船儿棹近岸边，扶着桨说：师父呵，我这船小，你们人多，怎能全渡？唐僧近前看了，那船儿原来是一段木头刻的，中间只有一个舱口，只好坐下两个人。八戒就使心术，要躲懒讨乖，说：沙僧，你与大哥在这边看着行李、马匹，等我保师父先过去，却再来渡马。眼看着那唐僧与猪八戒，连船儿淬在水里，无影无形，不知摄了那方去也。这岸上沙僧与悟空心慌说：怎么好？悟空说：不是翻船，若翻船，八戒会水，他必然保师父，负水而出。",
        "悟空说：这水色不正，恐你不能去。那妖怪喝说：是甚人在此打我门哩？你怎么弄玄虚，变作梢公，架船将我师父摄来？那妖怪呵呵笑说：这和尚不知死活。你师父是我拿了，如今要蒸熟了请人哩。沙僧听完大怒，抡宝杖，劈头就打；那妖怪举钢鞭，急架相迎。那个因贪唐僧肉中吃，这个为保唐僧命可怜。杀得虾鱼对对摇头躲，蟹鳖双双缩首潜。好个沙门真沙僧，单身独力展威权。沙僧暗想说：这怪物是我的对手，枉自不能取胜，且引他出去，教师兄打他。这沙僧虚丢了个架子，拖着宝杖就走。那妖精更不赶来，说：你去罢，我不与你斗了，我且具柬帖儿去请客哩。",
        "那妖怪物提一条竹节钢鞭走出来，与我斗了这半日，约有三十合，不分胜负。那妖怪物乖得紧，他不来赶我，只要回去具柬请客。沙僧说：那模样象像个大鳖；不然，就是个鼍龙也。说不了，只见那下湾里走出一个老人，远远的跪下，叫：悟空，黑水河河神磕头。悟空说：你不要是那棹船的妖邪，又来骗我么？那老人磕头滴泪说：悟空，我不是妖邪，我是这河内真神。原来西海龙王是他的母舅，不准我的状子，让我让与他住。悟空听完说：这样看来，西海龙王都该有罪。这等，河神你陪着沙僧在此看守，等我去海中，先把那龙王捉来，让他擒此怪物。",
        "敖顺就唤太子摩昂：快点五百虾鱼壮兵，将小鼍捉来问罪。悟空说：龙王再勿多心，既讲开饶了你就罢，又何须办酒？悟空立饮他一盏香茶，别了老龙，随与摩昂领兵，离了西海，早到黑水河中。悟空说：贤太子，好生捉怪，我上岸去也。摩昂说：悟空宽心，小龙子将他拿上来先见了悟空，惩治了他罪名，把师父送上来，才敢带回海内，见我家父。悟空欣然相别，捏了避水诀，跳出波津，径到了东边崖上。沙僧与那河神迎着说：师兄，你去时从空而去，怎么回来却自河内而回？悟空把那打死鱼精，得简帖，怪龙王，与太子同领兵来之事，备陈了一遍。",
        "太子按一按顶上金盔，束一束腰间宝带，手提一根三棱简，拽开步，跑出营去，说：你来请我怎么？鼍龙进礼说：小弟今早有简帖拜请舅爷，想是舅爷见弃，着表兄来的。昨日捉得一个东土僧人，我闻他是十世修行的元体，人吃了他，可以延寿，欲请舅爷看过，上铁笼蒸熟，与舅爷暖寿哩。妖怪说：他是唐朝来的僧人，往西天取经的和尚。太子说：你只知他是唐僧，不知他手下徒弟利害哩。妖怪说：他有一个长嘴的和尚，唤做个猪八戒，我也把他捉住了，要与唐和尚一同蒸吃。还有一个徒弟，唤做沙僧，原来是一条黑汉子，晦气色脸，使一根宝杖，昨日在这门外与我讨师父，被我帅出河兵，一顿钢鞭，战得他败阵逃生，也不见怎么利害。",
        "这太子将三棱简闪了一个破绽，那妖精不知是诈，钻将进来，被他使个解数，把妖精右臂只一简，打了个躘踵。众海兵一拥上前，揪翻住，将绳子背绑了双手，将铁索穿了琵琶骨，拿上岸来。押至悟空面前说：悟空，小龙子捉住妖鼍，请悟空定夺。悟空与沙僧见了说：你这个家伙不遵旨令。我待要打你这一棒，奈何我这棒子甚重，略打打儿就了了性命。那妖怪磕头不住说：悟空，小鼍不知悟空大名。今见悟空，幸蒙悟空不杀之恩，感谢不尽。你师父还捆在那水府之间，望悟空解了我的铁索，放了我手，等我到河中送他出来。摩昂在旁边说：悟空，这个家伙是个逆怪，他极奸诈，若放了他，恐生恶念。"
      ],
      "44": [
        "话说唐僧幸亏龙子降妖，黑水河神开路，师徒们过了黑水河，找大路一直西来。唐僧心中害怕，兜住马不能前进，急回头说：悟空，是哪里这等响振？悟空笑说：你们都猜不着，且住，待我看是何如。好悟空，将身一纵，踏云光，起在空中，睁眼观看，远见一座城池。悟空暗自沉吟说：好地方，怎么有响声振耳？原来是一齐着力打号，齐喊大力王菩萨，所以惊动唐僧。悟空心疑说：想是修盖寺院，他这里五谷丰登，寻不出杂工人来，所以这和尚亲自努力。",
        "好悟空，按落云头，去郡城脚下，摇身一变，变做个游方的云水全真，左臂上挂着一个水火篮儿，手敲着渔鼓，口唱着道情词，近城门，迎着两个道士，当面躬身说：道长，贫道有礼了。悟空说：我弟子云游于海角，浪荡在天涯。动问二位道长：这城中那条街上好道？那道士笑说：你这先生，怎么说这等败兴的话？道士说：你要化些斋吃，却不是败兴？悟空说：出家人以乞化为由，却不化斋吃，怎生有钱买？道士笑说：你是远方来的，不知我这城中之事。我这城中，且休说文武官员好道，富民长者爱贤，大男小女见我们拜请奉斋，这般都不须挂齿，头一等就是万岁君王好道爱贤。",
        "只恐他贪顽躲懒，不肯拽车，所以着我两个去查点查点。悟空听完，扯住道士滴泪说：我说我无缘，真个无缘，不得见老师父尊面。悟空说：我贫道在方上云游，一则是为性命，二则也为寻亲。过了双关，转下夹脊，那和尚一齐跪下磕头说：爷爷，我们没有躲懒，五百名半个不少，都在此扯车哩。悟空看见，暗笑说：这些和尚被道士打怕了，见我这假道士就这般悚惧。和尚们们听说认亲，就把他圈子阵围将上来，一个个出头露面，咳嗽打响，巴不得要认出去。和尚们说：老爷不认亲，怎么发笑？悟空说：果是外方来的，其实不知你这里有甚利害。和尚们滴泪说：我们这一国君王偏心无道，只喜得是老爷等辈，恼的是我们佛子。",
        "和尚们说：他在梦寐中劝解我们，教不要寻死，且苦捱着，等那东土大唐圣僧往西天取经的罗汉。他手下有个徒弟，原来齐天悟空，神通广大，专秉忠良之心，与人间报不平之事，济困扶危，恤孤念寡。那滩上僧人远远望见他打杀了两个道士，丢了车儿，跑将上来说：不好了，不好了，打杀皇亲了。和尚们把他簸箕阵围了，说：他师父上殿不参王，下殿不辞主，朝廷常称做国师兄长先生。他徒弟出来监工，与你无干，你怎么把他来打死？那仙长不说是你来打杀，只说是来此监工，我们害了他性命，我们怎了？我不是云水全真，我是来救你们的。悟空说：我是大唐圣僧徒弟孙悟空悟空，特特来此救你们性命。",
        "和尚们说：不是，不是，那老爷我们认得他。和尚们说：我们梦中尝见一个老者，自言太白金星，常教诲我们，说那悟空的模样，不要教错认了。和尚们说：他说那悟空：磕额金睛晃亮，圆头毛脸无腮。嗔说：那老贼惫懒，把我的元身都说与这伙凡人。忽失声说：大家诚然认我不是悟空，我是悟空的门人，来这里学闯祸耍子的。和尚们们才认得，一个个倒身下拜说：爷爷，我们凡胎肉眼，不知是爷爷显化。那悟空径至沙滩上，使个神通，将车儿拽过两关，穿过夹脊，提起来，摔得粉碎。和尚们说：爷爷哑，我们不敢远走，但恐在官人抓住解来，却又吃打发赎，反又生灾。",
        "唐僧勒马说：悟空，你怎么来打听个响声，许久不回？悟空引了十数个和尚，对唐僧马前施礼，将上项事说了一遍。那十数个和尚说：老爷放心，孙悟空爷爷原来天神降的，神通广大，定保老爷无虞。我们请老爷赶早进城，到我荒山安下，待明日早朝，孙悟空必有处置。悟空说：你们说得是，也罢，趁早进城去来。和尚们推开门，穿过金刚殿，把正殿门开了。唐僧取袈裟披起，拜毕金身，方入。老和尚走出来，看见悟空，就拜说：爷爷，你来了？悟空说：你认得我是那个爷爷，就是这等呼拜？那和尚说：我认得你是齐天悟空孙爷爷。二更时候，孙悟空心中有事，偏睡不着，只听得哪里吹打。",
        "好悟空，捻着诀，念个咒语，往巽地上吸一口气，呼的吹去，就是一阵狂风，一直卷进那三清殿上，把他些花瓶、烛台，四壁上悬挂的功德，一齐刮倒，于是而灯火无光。这悟空却引八戒、沙僧，按落云头，闯上三清殿。八戒不论生熟，拿过烧果来，张口就啃。八戒缩手躲过说：还没有尝着什么滋味，就打。悟空说：不要小家子行，且叙礼坐下受用。八戒说：不羞，偷东西吃，还要叙礼。八戒笑说：三清也认不得，却认做什么菩萨。八戒说：中间的是元始天尊，左边的是灵宝道君，右边的是太上老君。悟空说：都要变得这般模样，才吃得安稳哩。那八戒急了，听见那香喷喷供养，要吃，爬上高台，把老君一嘴拱下去说：老官儿，你也坐得勾了，让我八戒坐坐。",
        "八戒变做太上老君，悟空变做元始天尊，沙僧变作灵宝道君。八戒说：哥哥，变得如此，还不吃等甚？悟空说：兄弟呀，吃东西事小，泄漏天机事大。这圣像都推在地下，倘有起早的道士来撞钟扫地，或绊一个根头，却不走漏消息？八戒说：这里路生，摸门不着，却哪里藏他？悟空说：我才进来时，那右手下有一重小门儿，哪里面秽气畜人，想必是个五谷轮回之所。这八戒有些夯力量，跳下来，把三个圣像拿在肩膊上，扛将出来。笑说：这个弼马温着然会弄嘴弄舌，把个毛坑也与他起个道号，叫做什么五谷轮回之所。那八戒扛在肩上且不丢了去，口里嘓嘓哝哝的祷说：三清，三清，我说你听：远方到此，惯灭妖精。"
      ],
      "45": [
        "悟空又捻一把，忽地开口，叫声：晚辈小仙，且休拜祝。那些大小道士听见说出话来，一个个抖衣而战说：爷爷呀，活天尊临凡，是必不要放，好歹求个长生的法儿。沙僧捻着悟空，默默的说：哥哑，要得紧，又来祷告了。悟空说：你只看着我，我有时，你们也都有了。那道士吹打已毕，悟空开言说：那晚辈小仙，不须拜伏。众道听完，一齐俯伏磕头说：还请天尊念弟子恭敬之意，千乞喜赐些须。我弟子广宣道德，奏国王普敬玄门。虎力大仙爱强，就抬一口大缸，放在殿上；鹿力大仙端一砂盆，安在供桌之上；羊力大仙把花瓶摘了花，移在中间。悟空说：你们都出殿前，掩上格子，不可泄了天机，好留与你些圣水。",
        "依旧整衣端坐在上，说：小仙领圣水。那些道士推开格子，磕头礼拜谢恩，抬出缸去，将那瓶、盆总归一处，吩咐：徒弟，取个钟子来尝尝。小道士就拿了一个茶钟，递与老道士。老道士努着嘴说：不甚好吃，有些酣之味。悟空坐在上面，听见说出这话儿来，已此识破了，说：我弄个手段，索性留个名罢。那道士听见此言，拦住门，一齐动叉钯、扫帚、瓦块、石头，没头没脸，往里面乱打。好悟空，左手挟了沙僧，右手挟了八戒，闯出门，驾着云光，径转智渊寺方丈。此时唐僧醒来，叫：徒弟，徒弟，伏侍我倒换关文去来。悟空与沙僧、八戒急起身，穿了衣服，侍立左右说：上告师父。",
        "我们被他蒙蔽了，只道是天尊下降，求些圣水金丹，进与陛下，指望延寿长生；不期他遗些小就，哄瞒我们。我们各喝了一口，尝出滋味，正欲下手擒拿，他却走了。孙悟空合掌开言，大声说：陛下暂息雷霆之怒，容僧等启奏。国王说：你冲撞了国师，国师之言，岂有差谬？悟空说：他说我昨日到城外打杀他两个徒弟，是谁知证？悟空说：我僧原来东土之人，乍来这里，街道尚且不通，怎么夜里就知他观中之事？那国王本来昏乱，被悟空说了一遍，他就决断不定。宣至殿前，有三四十名乡老，朝上磕头说：万岁，今年一春无雨，但恐夏月干荒，特来启奏，请那位国师爷爷祈一场甘雨，普济黎民。",
        "你今远来，冒犯国师，本当就时问罪，姑且恕你，敢与我国师赌胜求雨么？若祈得一场甘雨，济度万民，朕就饶你罪名，倒换关文，放你西去，若赌不过，无雨，就将你们推赴杀场，典刑示众。悟空笑说：小和尚也晓得一些求祷。唐僧随着悟空、沙僧、八戒，侍立楼下。少时间，一员官飞马来报：坛场诸色皆备，请国师爷爷登坛。悟空说：你也忒自重了，更不让我远乡之僧。悟空说：我与你都上坛祈雨，知雨是你的，是我的？国王在上听见，心中暗喜说：那小和尚说话，倒有些筋节。沙僧听见，暗笑说：不知他一肚子筋节，还没有拿出来哩。悟空说：虽然知之，奈我远来之僧，未曾与你相会。",
        "八戒忍不住乱嚷说：那先生请退，令牌已响，怎么不见一些风儿？那道士又执令牌，烧了符檄，扑的又打了一下，只见那空中云雾遮满。孙悟空又当头叫说：布云的是那个？慌忙那推云童子、布雾郎君当面施礼。八戒笑说：这先儿只好哄这皇帝，搪塞黎民，全没些真实本事。那道士心中焦躁，仗宝剑，解散了头发，念着咒，烧了符，再一令牌打将下去。只见那南天门里，邓天君领着雷公、电母到当空，迎着悟空进礼。悟空又将前项事说了一遍，说：你们怎么来的志诚？天君说：那道士五雷法是个真的，他发了文书，烧了文檄，惊动玉帝，玉帝掷下旨意，径至九天应元雷声普化天尊府下。",
        "悟空又将前项事说了一遍，说：向日有劳，未曾成功；今日之事，望为助力。悟空又谢了敖顺说：前日亏令郎缚怪，搭救师父。龙王说：那个家伙还锁在海中，未敢擅就，正欲请悟空发落。但我不会发符、烧檄，打甚令牌，你大家却要助我行行。但只是得一个号令，方敢依令而行；不然，雷雨乱了，显得悟空无款也。那雷公大惊说：爷爷哑，我们怎吃得这棍子？悟空说：不是打你们，但看我这棍子往上一指，就要刮风。那风婆婆、巽二郎没口的答应说：就放风。那推云童子、布雾郎君说：就布云，就布云。悟空于是在旁边高叫说：先生请了。悟空说：等我跟他去，看他说些甚的。",
        "金銮殿瓦走砖飞，锦云堂门歪槅碎。悟空又显神通，把金箍棒钻一钻，望空又一指。推云童子显神威，骨都都触石垂天；布雾郎君施法力，浓漠漠飞烟盖地。悟空又把金箍棒钻一钻，望空又一指。唿喇喇施霹雳，振碎了铁叉山；淅沥沥闪红绡，飞出了东洋海。悟空高呼：老邓，仔细替我看那贪赃坏法之官、忤逆不孝之子，多打死几个示众。真个桑田变沧海，霎时陆岸滚波涛。那国王传旨说：雨彀了，雨彀了；十分再多，又渰坏了禾苗，反为不美。",
        "想是别方召请，风、云、雷、雨五司具不在，一闻我令，随赶而来，适遇着我下他上，一时撞着这个机会，所以就雨。那国王昏乱，听此言，却又疑惑未定。悟空近前一步，合掌奏说：陛下，这些旁边门法术，也不成个功果，算不得我的他的。如今有四海龙王现在空中，我僧未曾发放，他还不敢遽退。那国师若能叫得龙王现身，就算他的功劳。国王大喜说：我做了二十三年皇帝，更没有看见活龙是怎么模样。就叫，那龙王见悟空在此，也不敢出头。那悟空仰面朝空，大声说：敖广何在？那龙王听唤，就忙现了本身，四条龙。在半空中度雾穿云，飞舞向金銮殿上。"
      ],
      "46": [
        "唐僧说：我幼年遇方上禅僧讲道，那性命根本上，定性存神，在死生关里，也坐二三个年头。悟空说：师父若坐二三年，我们就不取经罢。悟空说：你上前答应，我送你上去。那唐僧果然合掌当胸说：贫僧会坐禅。悟空拔一根毫毛，变做假像，陪着八戒、沙僧，立于下面；他却作五色祥云，把唐僧撮起空中，径至东边台上坐下；他又敛祥光，变作一个蟭蟟虫，飞在八戒耳朵边说：兄弟，仔细看着师父，再不要与我替身说话。再说那鹿力大仙在绣墩上坐看多时，他两个在高台上不分胜负，这道士就助他师兄一功：将脑后短发拔了一根，捻着一团，弹将上去，径至唐僧头上，变作一个大臭虫，咬住唐僧。",
        "八戒说：不好了，师父羊儿风发了。悟空听见说：我师父原来志诚君子，他说会坐禅，一定会坐；说不会，只是不会。好悟空，嘤的一声，飞在唐僧头上，只见有豆粒大小一个臭虫叮他师父，慌忙用手捻下，替师父挠挠摸摸。悟空暗想说：和尚头光，虱子也安不得一个，怎么有此臭虫？这悟空飞将上去，金殿兽头上落下，摇身一变，变作一条七寸长的蜈蚣，径来道士鼻凹里叮了一下。国王大惊，就着当驾太师领他往文华殿里梳洗去了。悟空仍驾祥云，将师父驮下阶前，已是唐僧得胜。鹿力大仙又奏说：陛下，我师兄原有暗风疾，因到了高处，冒了天风，旧疾举发，故令和尚得胜。",
        "唐僧进前一步，正要猜，那鹿力大仙说：我先猜，那柜里是山河社稷袄、乾坤地理裙。唐僧说：不是，不是，柜里是件破烂流丢一口钟。国王说：这和尚无礼，敢笑我国中无宝，猜什么流丢一口钟。慌忙唐僧合掌高呼：陛下，且赦贫僧一时，待打开柜看。龙座后面闪上三宫皇后说：我主，是梓童亲手放的山河社稷袄、乾坤地理裙，却不知怎么变成此物？那皇帝就转后宫，把御花园里仙桃树上结得一个大桃子，有碗来大小，摘下，放在柜内，又抬下叫猜。又嘤的一声，飞将去，还从板缝儿钻进去，见是一个桃子，正合他意。仍变蟭蟟虫，飞将出去，钉在唐僧耳朵上说：师父，只猜是个桃核子。",
        "八戒听说，与沙僧微微冷笑说：还不知他是会吃桃子的积年哩。正话间，只见那虎力大仙从文华殿梳洗了，走上殿说：陛下，这和尚有搬运抵物之术。虎力说：术法只抵得物件，却抵不得人身。嘤的又飞去，钻入里面，见是一个小童儿。好悟空，他却有见识，果然是腾那天下少，似这伶俐世间稀。他就摇身一变，变作个老道士一般容貌，进柜里，叫声：徒弟。悟空说：那和尚看见你进柜来了，他若猜个道童，却不又输了？童儿说：但凭师父处治，只要我们赢他就了；若是再输与他，不但低了声名，又恐朝廷不敬重了。将金箍棒就变作一把剃头刀，搂抱着那童儿，口里叫说：乖乖，忍着疼，不要放声，等我与你剃头。",
        "虎力说：弟兄三个，都有些神通：会打倒在地，又能安上；剖腹伤害，还再长完；滚油锅里，又能洗澡。国王大惊说：此三事都是寻死之路。虎力说：我们有此法力，才敢出此朗言，断要与他赌个才休。那国王叫说：东土的和尚，我国师不肯放你，还要与你赌砍头、剖腹、下滚油锅洗澡哩。说：好运气，好运气，买卖上门了。八戒说：这三件都是丧性命的事，怎么说悟空上前说：陛下，小和尚会砍头。悟空说：我当年在寺里修行，曾遇着一个方上禅和子，让我一个砍头法，不知好也不好，如今且试试新。国王笑说：那和尚年幼不知事，砍头哪里好试新？虎力说：陛下，正要他如此，才出得我们之气。",
        "慌忙鹿力大仙见有这般手段，就念咒语，教本坊土地、神祗：将人头扯住，待我赢了和尚，奏了国王，与你把小祠堂盖作大庙宇，泥塑像改作正金身。原来那些土地、神祗因他有五雷法，也服他使唤，暗中真个把悟空头按住了。悟空心焦，捻着拳，挣了一挣，将捆的绳子就皆挣断，喝声：长！那监斩官急走入朝奏说：万岁，那小和尚砍了头，又长出一颗来了。八戒冷笑说：沙僧，那知哥哥还有这般手段。沙僧说：他有七十二般变化，就有七十二个头哩。那八戒伸手一摸，就笑得呆呆睁睁说：妙哉，妙哉！兄弟们正都欢喜，又听得国王叫领关文：赦你无罪。",
        "这都是那和尚惫懒，使的掩样法儿，将我师兄变作畜类。那刽子手将一条绳套在他膊项上，一条绳扎住他腿足，把一口牛耳短刀幌一幌，着肚皮下一割，搠个窟窿。这悟空双手爬开肚腹，拿出肠脏来，一条条理勾多时，依然安在里面，照旧盘曲。国王大惊，将他那关文捧在手中说：圣僧不要误西行，与你关文去罢。悟空笑说：关文小可，也请二国师剖剖剜剜，何如？国王对鹿力说：这事不与我相干，是你要与他做对头的，请去，请去。悟空又上前说：恕大胆，屡次占先了。八戒见了，咬着指头对沙僧说：我们也错看了这猴子了。悟空望见，心疑说：那八戒笑我哩。",
        "两边校尉见八戒面凶，先揪翻，把背心捆了。慌忙唐僧高叫：陛下，赦贫僧一时。只望宽恩，赐我半盏凉浆水饭、三张纸马，容到油锅前，烧此一陌纸，也表我师徒一念，那时再领罪也。国王听完说：也是，那中华人多有义气。八戒听见说：师父，不是这般祝了。──沙僧，你替我奠浆饭，等我祷。那八戒捆在地下，气呼呼的说：闯祸的泼猴子，无知的弼马温；该死的泼猴子，油烹的弼马温。悟空在油锅底上，听得那八戒乱骂，忍不住现了本相，赤淋淋的站在油锅底说：馕糟的夯货！慌忙那两班文武上过来奏说：万岁，那和尚没有死，又在油锅里钻出来了。"
      ],
      "47": [
        "再说那国王倚着龙床，泪如泉涌，只哭到天晚不住。悟空上前高呼说：你怎么这等昏乱？那文武多官具奏说：死者果然是白鹿、黄虎，油锅里果是羊骨。一那边大排筵宴，摆驾出朝，至智渊寺门外，请了唐僧等，共入东阁赴宴，不在话下。再说那脱命的和尚闻有招僧榜，个个欣然，都入城来寻孙悟空，交纳毫毛谢恩。这唐僧散了宴，那国王换了关文，同皇后嫔妃、两班文武，送出朝门。只见那些和尚跪拜道旁边，口称：齐天悟空爷爷，我们是沙滩上脱命僧人。闻知爷爷扫除妖孽，救拔我们，又蒙我王出榜招僧，特来交纳毫毛，叩谢天恩。对君臣僧俗人说说：这些和尚，实是我放了；车辆是我运转双关，穿夹脊，捽碎了；那两个妖道也是我打死了。",
        "八戒说：寻一个鹅卵石，抛在当中。那八戒摸了一块石头，望水中抛去，只听得骨都都泛起鱼津，沉下水底。唐僧说：你虽试得深浅，却不知有多少宽阔。急收云头，按落河边说：师父，宽哩，宽哩，去不得！唐僧大惊，口不能言，声音哽咽说：徒弟呵，似这等怎了？悟空说：想是扳脍的渔人，等我问他去来。拿了铁棒，两三步，跑到面前看处，呀！唐僧看见，滴泪说：徒弟呀，我当年别了长安，只说西天易走，那知道妖魔阻隔，山水迢遥。八戒说：师父，你且听，是哪里鼓钹声音？我们且去赶些斋饭吃，问个渡口寻舡，明日过去罢。唐僧马上听得，果然有鼓钹之声：却不是道家乐器，足是我僧家举事。",
        "你们脸嘴丑陋，只恐吓了人，闯出祸来，却倒无住矣。那唐僧才摘了斗笠，光着头，抖抖褊衫，拖着锡杖，径来到人家门外。慌忙这唐僧合掌高叫：老施主，贫僧行礼问候了。那老者还礼说：你这和尚，却来迟了。唐僧躬身说：老施主，贫僧不是赶斋的。唐僧说：我是东土大唐钦差往西天取经者，今到贵处，天色已晚。那老者摇手说：和尚，出家人休打诳语。老者说：既有徒弟，为什么不同来？唐僧搀起说：施主不要怕，不是妖怪，是我老者战兢兢说：这般好俊师父，怎么寻这样丑徒弟。经，八戒掬着长嘴喝说：那和尚，念的是什么经？这兄弟三人见那些人跌跌爬爬，鼓着掌哈哈大笑。",
        "忽抬头见八戒、沙僧，慌忙丢了火把，忽抽身关了中门。悟空拿起火把，点上灯烛，扯过一张交椅，请唐僧坐在上面；他兄弟们坐在两旁边，那老者坐在前面。正叙坐间，只听得里面门开处，又走出一个老者，拄着拐杖说：是什么邪魔，黑夜里来我善门之家？前面坐的老者，急起身迎到屏门后说：哥哥不要嚷，不是邪魔，原来东土大唐取经的罗汉。八戒忍不住问：老者，你这盛价两边走怎么？八戒说：那白面师父只消一个人，毛脸雷公嘴的只消两个人，那晦气脸的要八个人，我得二十个人伏侍方勾。老者说：这样看来，想是你的食肠大些。那和尚与老者一问一答的讲话，众人才不怕。",
        "悟空叫说：贤弟，少吃些罢，也强似在山凹里忍饿，将就彀得半饱也好了。常言说：给和尚饭吃不饱，不如活埋哩。二老者躬身说：不瞒老爷说，白日里倒也不怕，似这大肚子唐僧，也斋得起百十众。不期你大家来，吓得和尚们跑了，连亲邻也没有敢请，尽数都供奉了大家。唐僧拱身，谢了斋供，才问：老施主高姓？八戒笑说：师父问他怎么，岂不知道？悟空听完，暗喜说：这八戒乖了些也。那二位欠身说：你们取经，怎么不走正路，却蹡到我这里来？悟空说：走的是正路，只见一股水挡住，不能得渡，因闻鼓钹之声，特来造府借宿。老者说：你们到水边，可曾见些什么？",
        "老者说：家下供养关圣爷爷，因在关爷之位下求得这个儿子，故名关保。二老说：颇有一些：水田有四五十顷，旱田有六七十顷，草场有八九十处；水黄牛有二三百头，驴马有三二十匹，猪羊鸡鹅无数。悟空说：你这等家业，也亏你省将起来的。悟空说：既有这家私，怎么舍得亲生儿女祭赛？悟空说：他来行走，你们看见他是什么嘴脸？二老说：不见其形，只听见一阵香风，就知是大王爷爷来了，就忙满斗焚香，老少望风下拜。小孩儿那知死活，笼着两袖果子，跳跳舞舞的吃着耍子。悟空见了，默默念声咒语，摇身一变，变作那关保儿一般模样。唐僧说：老爷，不敢当子，不敢当子。",
        "你我进门，感承盛斋，你还嚷吃不饱哩，怎么就不与人家救些患难？八戒说：哥呵，变化的事情，我却不会哩。悟空说：你也有三十六般变化，怎么不会？唐僧叫：悟能，你师兄说得最是，处得甚当。八戒说：你看师父说的话，我只会变山，变树，变石头，变癞象，变水牛，变大胖汉还可；若变小女儿，有几分难哩。悟空说：老大不要信他，抱出你令爱来看。一家子妻妾大小，不分老幼内外，都出来磕头礼拜，只请救孩儿性命。那女儿头上戴一个八宝垂珠的花翠箍；身上穿一件红闪黄的纻丝袄，上套着一件官绿缎子棋盘领的披风；腰间系一条大红花绢裙；脚下踏一双虾蟆头浅红纻丝鞋；腿上穿两只绡金膝裤儿。",
        "八戒说：哥哑，似这般小巧俊秀，怎变？八戒慌了说：哥哥不要打，等我变了看。这八戒念动咒语，把头摇了几摇，叫：变！真个变过头来，就也像女孩儿面目，只是肚子胖大，郎伉不像。八戒说：凭你打了罢，变不过来，奈何？悟空说：不要成是丫头的头，和尚的身子？他就吹他一口仙气，果然就时把身子变过，与那孩儿一般。一会家，我兄弟躲懒讨乖，走进去，转难识认。好悟空，吩咐沙僧保护唐僧：我变作陈关保，八戒变作一秤金。八戒说：哥哥，不要弄我，我没这个手段。悟空说：好好好，拿盘子出来，我们试试。那老者就拿出两个丹盘，悟空与八戒坐上。"
      ],
      "48": [
        "众信摆列停当，一齐朝上磕头说：大王爷爷，今年今月今日今时，陈家庄祭主陈澄等众信，年甲不齐，谨遵年例，供献童男一名陈关保、童女一名陈一秤金，猪羊牲醴如数，奉上大王享用。那八戒见人散了，对悟空说：我们家去罢。八戒说：你倒不是八戒，反说我是八戒。八戒说：不好了，风响是那话儿来了。那妖怪物拦住庙门问：今年祭祀的是那家？悟空笑吟吟的答说：承下问，庄头是陈澄、陈清家。那妖怪闻答，心中疑似说：这童男胆大，言谈伶俐。常来供养受用的，问一声不言语；再问声，吓了魂；用手去捉，已是死人。怪物不敢来拿，又问：童男女叫甚名字？",
        "那妖怪物因来赴会，没有带得兵器，空手在云端里问：你是那方和尚，到此欺人，破了我的香火，坏了我的名声？我们原来东土大唐圣僧唐僧奉钦差西天取经之徒弟。是我们慈悲，拯救生灵，捉你这泼物。那妖怪听完就走，被八戒又一钉钯，未曾打着，他化一阵狂风，钻入通天河内。悟空说：不消赶他了，这怪想是河中之物。且待明日设法拿他，送我师父过河。八戒依言，直接回到庙里，把那猪羊祭醴，连桌面一齐搬到陈家。此时唐僧、沙僧，共陈家兄弟，正在厅中候信，忽见他二人将猪羊等物都丢在天井里。唐僧迎来问：悟空，祭赛之事何如？悟空将那称名赶怪钻入河中之事，说了一遍。",
        "再说唐僧师徒四人歇在陈家，将近天晓，师徒们衾寒枕冷。八戒咳歌打战睡不得，叫说：师兄，冷呵。悟空说：怪道你们害冷哩，却是这般大雪。真个是：六出花，片片飞琼；千林树，株株带玉。却就似战退玉龙三百万，果然如败鳞残甲满天飞。那场雪，纷纷洒洒，果如剪玉飞绵。唐僧问：老施主，贵处时令，不知可分春夏秋冬？陈老笑说：这里虽是僻地，但只风俗人物，与上国不同；至于诸凡谷苗牲畜，都是同天共日，岂有不分四时之理？唐僧说：既分四时，怎么如今就有这般大雪，这般寒冷？",
        "陈老说：此时虽是七月，昨日已交白露，就是八月节了。唐僧说：甚比我东土不同，我哪里交冬节方有之。陈老说：老爷放心，不要见雪深忧虑。我当年蒙圣恩赐了旨意，摆大驾亲送出关，唐王御手擎杯奉饯，问：几时可回？今日有缘得寓潭府，昨夜愚徒们略施小惠报答，实指望求一船只渡河。唐僧见品物丰盛，再四不安说：既蒙见留，只可以家常相待。陈老说：老爷，感蒙替祭救命之恩，虽逐日设筵奉款，也难酬难谢。陈老见唐僧不快，又打扫花园，大盆架火，请去雪洞里闲耍散闷。",
        "四壁上挂几轴名公古画，却是那：七贤过关，寒江独钓，叠嶂层峦团雪景；苏武餐毡，折梅逢使，琼林玉树写寒文。唐僧说：贫僧不饮，小徒略饮几杯素酒。只听得街上行人都说：好冷天呵，把通天河冻住了。唐僧听完说：悟空，冻住河，我们怎生是好？陈老说：乍寒乍冷，想是近河边浅水处冻结。那行人说：把八百里都冻的似镜面一般，路口上有人走哩。及次日天晓，八戒起来说：师兄，今夜更冷，想必河冻住也。唐僧迎着门，朝天礼拜说：众位护教大神，弟子一向西来，虔心拜佛，苦历山川，更无一声报怨。礼拜毕，于是教沙僧背马，趁冰过河。",
        "唐僧与一行人到了河边，勒马观看，真个那路口上有人行走。唐僧问：施主，那些人上冰往哪里去？吩咐：悟空，快回施主家收拾行囊，叩背马匹，趁此层冰，早奔西方去也。沙僧说：师父呵，常言说：千日吃了千升米。八戒跳下马来：你们且休讲闲口，等八戒试看有多少厚薄。悟空说：八戒，前夜试水，能去抛石；如今冰冻重漫，怎生试得？八戒笑说：去得，去得，连底都锢住了。唐僧听完，十分欢喜，与众同回陈家，只教收拾走路。",
        "唐僧摆手摇头，只是不受说：贫僧出家人，财帛何用？就途中也不敢拿出，只是以化斋度日为正事。二老又再三央求，悟空用指尖儿捻了一小块，约有四五钱重，递与唐僧说：师父，也只当些衬钱，不要教空负二老之意。于是此相向而别，径至河边冰上，那马蹄滑了一滑，险一些把唐僧跌下马来。八戒说：且住，问陈老官讨个稻草来我用。陈老在岸上听言，急命人家中取一束稻草，却请唐僧上岸下马。八戒将草包裹马足，然后踏冰而行。别陈老离河边，行有三四里远近，八戒把九环锡杖递与唐僧说：师父，你横此在马上。锡杖原是你挑的，怎么又叫师父拿着？",
        "鳜婆说：大王，且休吃他，恐他徒弟们寻来吵闹。且宁耐两日，让那个家伙不来寻，然后剖开，请大王上坐，众眷族环列，吹弹歌舞，奉上大王，从容自在享用，却不好也？那妖怪依言，把唐僧藏于宫后，使一个六尺长的石匣盖在中间暂且不说。再说八戒、沙僧在水里捞着行囊，放在白马身上驮了，分开水路，涌浪翻波，负水而出。只见悟空在半空中看见，问：师父何在？原来八戒本是天蓬元帅临凡，他当年掌管天河八万水兵大众；沙僧是流沙河内出身；白马本是西海龙孙：故此能知水性。悟空在空中指引，过了一会儿，回转东崖，晒刷了马匹，紾掠了衣裳。悟空云头按落，一同到于陈家庄上。"
      ],
      "49": [
        "沙僧说：哥呵，小弟虽是去得，但不知水底怎么。哥哥变作什么模样，或是我驮着你，分开水道，寻着妖怪的巢穴，你先进去打听打听。若是师父没有伤损，还在哪里，我们好努力征讨；假若不是这怪弄法，或者渰死师父，或者被妖吃了，我们不须苦求，早早的别寻道路何如？八戒暗喜说：这猴子不知捉弄了我多少，今番原来不会水，等八戒驮他，也捉弄他捉弄。八戒笑嘻嘻的叫说：哥哥，我驮你。悟空就知有意，却就将计就计说：是，也好，你比沙僧还有些膂力。沙僧剖开水路，弟兄们同入通天河内。向水底下行有百十里远近，那八戒要捉弄悟空。",
        "沙僧说：这厢想是妖精住处，我两个不知虚实，怎么上门索战？悟空说：沙僧，那门里外可有水么？悟空说：既无水，你再藏隐在左右，待我去打听打听。好悟空，爬离了八戒耳朵里，却又摇身一变，变作个长脚虾婆，两三跳跳到门里。睁眼看时，只见那妖怪坐在上面，众水族摆列两边，有个斑衣鳜婆坐于侧手，都商议要吃唐僧。忽看见一个大肚虾婆走将来，径往西廊下立定。悟空跳到面前，称呼说：姆姆，大王与众商议要吃唐僧，唐僧却在哪里？虾婆说：唐僧被大王降雪结冰，昨日拿在宫后石匣中间。悟空忍不住叫说：师父不要恨水灾。悟空说：你且放心，待我们擒住妖精，管让你脱难。",
        "八戒喝说：我把你这打不死的泼物！你前夜与我顶嘴，今日怎么推不知来问我？你变做一秤金，该一个冒名顶替之罪。八戒说：你既让我，却怎么又弄冷风，下大雪，冻结坚冰，害我师父？妖邪听完，微微冷笑说：这和尚卖此长舌，胡夸大口。你今嚷上门来，思量取讨，只怕这一番不比那一番了：那时节，我因赴会，没有带得兵器，误中你伤；你如今且不要走，我与你交敌三合。八戒说：我的儿，你真个有些灵感，怎么就晓得我是半路出家妖邪说：你会使钯，想是雇在哪里种园，把他钉钯拐将来也。说：儿子，我这钯，不是那筑地之钯。那个妖邪哪里肯信，举铜锤劈头就打。",
        "攒簇五行皆别异，故然变脸各争差。猪八戒料道不得赢他，对沙僧丢了个眼色。那妖怪物吩咐：小妖们，扎住在此，等我追追上这个家伙，捉将来与你们凑吃哑。你看他如风吹败叶，似雨打残花，将他两个赶出水面。那孙悟空在东岸上眼不转睛，只望着河边水势。忽然见波浪翻腾，喊声号吼，八戒先跳上岸说：来了，来了。那妖邪闪身躲过，使铜锤急架相还。搭上手未经三合，那妖遮架不住，打个花，又淬于水里，于是此风平浪息。悟空回转高崖说：兄弟们，辛苦呵。沙僧说：哥呵，这妖精他在岸上觉得不济，在水底也尽利害哩，我与二哥左右齐攻，只战得个两平。",
        "他两个跳上岸去，那帮手抡一条铁棒打我，我闪过与他相持。鳜婆说：大王，可记得那帮手是甚相貌？妖邪说：是一个毛脸雷公嘴、查耳朵、折鼻梁、火眼金睛和尚。鳜婆闻说，打了一个寒噤说：大王呵，亏了你识俊，逃了性命；若再三合，决然不得全生。鳜婆说：我当年在东洋海内，曾听见老龙王说他的名誉，原来是五百年前大闹天宫混元一气上方太乙金仙美猴王齐天悟空。如今归依佛教，保唐僧往西天取经，改名唤做孙悟空悟空。他的神通广大，变化多端，大王你怎么惹他？让他缠两日，性摊了回去时，我们却不自在受用唐僧也？八戒与沙僧连叫不出，八戒心焦，就使钉钯筑门。",
        "悟空说：我上普陀岩拜问菩萨，看这妖怪是哪里出身，姓甚名谁。寻着他的祖居，拿了他的家属，捉了他的四邻，却来此擒怪救师。八戒笑说：哥呵，这等干，只是忒费事，担搁了时辰了。悟空说：管你不费事，不担搁，我去就来。只见那二十四路诸天与守山大神、木叉悟空、善财童子、捧珠龙女，一齐上前，迎着施礼说：悟空何来？神仙们说：菩萨今早出洞，不许人随，自入竹林里观玩。知悟空今日必来，吩咐我们在此候接悟空，不可就见。请在翠岩前聊坐片时，待菩萨出来。悟空依言，还未坐下，又见那善财童子上前施礼说：孙悟空，前蒙盛意，幸菩萨不弃收留，早晚不离左右，专侍莲台之下，甚得善慈。",
        "菩萨就解下一根束袄的丝绦，将篮儿拴定，提着丝绦，半踏云彩，抛在河中，往上溜头扯着，口念颂子说：死的去，活的住。菩萨叫：悟空，快下水救你师父耶。悟空说：未曾抓住妖邪，怎么救得师父？八戒与沙僧拜问：这鱼儿怎生有那等手段。菩萨说：他本是我莲花池里养大的金鱼，每日浮头听经，修成手段。悟空说：菩萨，既然如此，且待片时，我们叫陈家庄众信人等，看看菩萨的金面：一则留恩；二来说此收怪之事，好教凡人信心供养。那八戒与沙僧一齐飞跑至庄前，高呼说：都来看活观音菩萨，都来看活观音菩萨。八戒与沙僧分开水道，径往那水鼋之第找寻师父。",
        "悟空听完，心中暗喜，收了铁棒说：你端的是真实之情么？老鼋说：因悟空恩德洪深，怎敢虚谬？那老鼋张着红口，朝天发誓说：我若真情不送唐僧过此通天河，将身化为血水。悟空说：师父，我们上他身，渡过去也。悟空说：师父呵，凡诸众生，会说人话，决不打诳语。悟空教把马牵在白鼋盖上，请唐僧站在马的颈项左边，沙僧站在右边，八戒站在马后，悟空站在马前。一只手扯着缰绳；叫说：老鼋，慢慢走呵，歪一歪儿，就照头一下。唐僧上崖，合手称谢说：老鼋累你，无物可赠，待我取经回谢你罢。我听见西天佛祖无灭无生，能知过去未来之事。"
      ],
      "50": [
        "时有悟空引猪八戒、沙僧近前侍立说：师父，有何吩咐？唐僧说：你看那前面山高，恐有虎狼作怪，妖兽伤人，今番是必仔细！到于谷口，促马登崖，抬头仔细观看，好山：嵯峨矗矗，变削巍巍。嵯峨矗矗冲霄汉，变削巍巍碍碧空。怪石乱堆如坐虎，苍松斜挂似飞龙。唐僧马上欣然说：徒弟呵，这一日又饥又寒，幸得那山凹里有楼台房舍，断乎是庄户人家，菴观寺院；且去化些斋饭，吃了再走。悟空听完，急睁睛看，只见那那边凶云隐隐，恶气纷纷。回首对唐僧说：师父，那厢不是好处。唐僧说：见有楼台亭宇，如为什么不是好处？西方路上多有妖怪邪魔，善能点化庄宅。",
        "悟空随步观看庄景，只听得呀的一声，柴扉响处，走出一个老者，手拖藜杖，头顶羊裘，身穿破衲，足踏蒲鞋，拄着杖，仰身朝天说：西北风起，明日晴了。说不了，后边跑出一个哈巴狗儿来，望着悟空，汪汪的乱吠。老者却才转过头来，看见悟空捧着钵盂。打个行礼问候说：老施主，我和尚是东土大唐钦差上西天拜佛求经者，适路过宝方，我师父腹中饥馁，特造尊府募化一斋。老者听完，点头顿杖说：唐僧，你且休化斋，你走错路了。老者说：往西天大路，在那直北下。你师父在大路上等你化斋，似这千里之遥，就会走路，也须得六七日，走回去又要六七日，却不饿坏他也？悟空笑说：不瞒老施主说，我才然离了师父，还不上一盏热茶之时，却就走到这里。",
        "那老者说：实不瞒你说，我家老小六七口，才淘了三升米下锅，还未曾煮熟。悟空说：古人云：走三家不如坐一家。那老者见缠得紧，恼了，举藜杖就打。悟空公然不惧，被他照光头上打了七八下，只当与他拂痒。悟空笑说：老官儿，凭你怎么打，只要记得杖数明白：一杖一升米，慢慢量来。那老者听完，急丢了藜杖，跑进去把门关了，只嚷：有鬼，有鬼。悟空见他关了门，心中暗想：这老贼才说淘米下锅，不知是虚是实？好悟空，捻着诀，使个隐身遁法，径走入厨中看处，果然那锅里气腾腾的，煮了半锅干饭。再说唐僧坐在圈子里，等待多时，不见悟空回来，欠身怅望说：这猴子往哪里化斋去了？",
        "那八戒把钉钯撒在腰里，整一整青锦直裰，斯斯文文，走入门里。用手掀开看时，把八戒吓了一个躘踵。那八戒定了性，止不住腮边泪落，对骷髅点头叹云：你不知是：那代那朝元帅体，何邦何国大将军。八戒刚才感叹，只见那帐幔后有火光一幌。八戒说：想是有侍奉香火之人在后面哩。八戒提起来看时，却是三件纳锦背心儿。他也不管好歹，拿下楼来，出厅房，径到门外说：师父，这里全没人烟，是一所亡灵之宅。八戒走进里面，直至高楼之上，黄绫帐内，有一堆骸骨。串楼旁边有三件纳锦的背心，被我拿来了，也是我们一程儿好运气。我们在此避风坐一坐，等悟空来时走路。",
        "那八戒不要想肯听，对唐僧笑说：师父呵，我自为人，也穿了几件背心，没有见这等纳锦的。你不穿，且待八戒穿一穿，试试新，晤晤脊背。沙僧说：既如此说，我也穿一件儿。慌忙个唐僧跌足报怨，急忙来解，哪里就解得开。原来那座楼房果是妖精点化的，终日在此拿人。他在洞里正坐，忽听见怨恨之声，急出门来看，果见捆住几个人了。老妖魔登台高坐，众小妖把唐僧推近台边，跪伏于地。唐僧滴泪告说：贫僧是东土大唐钦差往西天取经的。不期我这两个徒弟爱小，拿出这衣物来。他不听我言，要穿此晤晤脊背，不料中了大王机会，把贫僧拿来。",
        "再说悟空自南庄人家摄了一钵盂斋饭，驾云回返旧路，径至山坡平处，按下云头，早已不见唐僧，不知何往，棍划的圈子还在，只是人马都不见了。悟空心惊说：不消说了，他们定是遭那毒手也。行有五六里，正在凄怆之际，只听见北坡外有人言语。悟空放下钵盂，觌面道个行礼问候，叫：老公公，贫僧行礼问候了。悟空说：我们东土来的，往西天拜佛求经，一行师徒师徒四人。老者听完，呵呵冷笑说：你那三众，可有一个长嘴大耳的么？老翁说：你们走错路了，你休寻他，各人顾命去也。悟空说：那白脸者是我师父，那妖怪样者是我师弟。老翁说：我才然从此过时，看见他们错走了路径，闯入妖魔口里去了。",
        "土地说：悟空性急，小神不敢造次，恐犯威颜，故此隐像告知。好生与我收着钵盂，待我拿那妖精去来。这悟空却才束一束虎筋绦，拽起虎皮裙，执着金箍棒，径奔山前，找寻妖洞。猿啸鸟啼风景丽，鸾飞凤舞若蓬瀛。这悟空观看不尽，拽开步径至门前，大声说：那小妖，你快进去与你那洞主说，我本是唐朝圣僧徒弟齐天悟空孙悟空。那伙小妖急入洞里报说：大王，前面有一个毛脸勾嘴的和尚，称是齐天悟空孙悟空，来要他师父哩。那魔王听见此言，心里高兴极了说：正要他来哩。悟空在旁边闪过，见那魔王生得好不凶丑：独角参差，双眸晃亮。孙悟空上前说：你孙外公在这里也。",
        "妖魔说：我在山路边点化一座仙庄，你师父潜入里面，心爱情欲，将我三领纳锦绵装背心儿偷穿在身，见有赃证，故此我才拿他。那妖怪物那怕什么赌斗，挺钢枪劈面迎来。那门前小妖擂鼓，排开阵势助威风；这那边悟空施功，使出纵横逞本事。那魔王口喷紫气盘烟雾，这悟空眼放光华结绣云。只为大唐僧有难，两家无义苦争论。那魔王见孙悟空棍法齐整，一往一来，全无些破绽，喜得他连声喝采说：好猴儿，好猴儿，真个是那闹天宫的本事。那些泼怪一个个拿刀弄杖，执剑抡枪，把个孙悟空围在中间。悟空公然不惧，只叫：来得好，来得好，正合我意。悟空忍不住焦躁，把金箍棒丢将起去，喝声：变！就变作千百条铁棒，好就似飞蛇走蟒，盈空里乱落下来。"
      ],
      "51": [
        "悟空这才是以心问心，自张自主，急翻身，纵起祥云，直至南天门外。忽抬头见广目天王，当面迎着长揖说：悟空何往？说未了，又见那马、赵、温、关四大元帅作礼说：悟空，没有远迎。于是辞了广目并四元帅，直接走进南天门里，直至灵霄殿外，果又见张道陵、葛仙翁、许旌阳、丘弘济四天师，并南斗六司、北斗七元，都在殿前迎着悟空，一齐有礼了说：悟空怎么到此？悟空说：早哩，早哩，路遥魔广，才有一半之功。有一个兕怪，把唐师父拿于洞里，是我寻上门与他交战一场，那个家伙神通广大，把我的金箍棒抢去了，因此难缚魔王。疑是上界那个凶星思凡下界，又不知是哪里降来的魔头，我因此来寻寻玉帝，问他个钳束不严。",
        "彼时玉皇天尊听完禀报，就忙降旨可韩司知说：既如悟空所奏，可随查诸天星斗、 各宿神王，有无思凡下界，随就覆奏施行，以闻。可韩丈人真君领旨，当时就同悟空去查。悟空说：既是如此，我也不消上那灵霄宝殿。悟空等候良久，作诗纪兴说：风清云霁乐升平，神静星明显瑞祯。那可韩司丈人真君历历查勘，回奏玉帝说：满天星宿不少，各方神将皆存，并无思凡下界者。玉帝听完禀报：着孙悟空挑选几员天将，下界擒魔去也。四大天师奉旨意，就出灵霄宝殿，对悟空说：悟空呵，玉帝宽恩，言天宫无神思凡，着你挑选几员天将，擒魔去哩。悟空低头暗想说：天上将不如我者多，胜似我者少。",
        "天师又奏玉帝，传旨教九天府下点邓化、张蕃二雷公，与天王合力缚妖救难。于是与天王、孙悟空径下南天门外。天王停下云头，扎住天兵在于山南坡下说：悟空素知小儿哪咤，曾降九十六洞妖魔，善能变化，随身有降妖兵器，须让他先去出阵。悟空说：既如此，等我引太子去来。说：大王，悟空领着一个小童男，在门前叫战哩。棒被我夺了，空手难争，想是请得救兵来也。魔王笑说：你是李天王第三个孩儿，名唤做哪咤太子，却怎么到我这门前呼喝？太子说：因你这泼魔作乱，困害东土圣僧，奉玉帝金旨，特来拿你。魔王大怒说：你想是孙悟空请来的。",
        "星君说：那哪咤原来三坛海会大神，他出身时，曾降九十六洞妖魔，神通广大，若他不能，小神又怎敢望也？悟空说：因与李天王计议，天地间至利者，惟水火也。那妖怪物有一个圈子，善能套人的物件，不知是什么宝贝，故此说火能灭诸物，特请星君领火部到下方纵火烧那妖魔，救我师父一难。火德星君听完，就点本部神兵，同悟空到金山南坡下，与天王、雷公等相见了。天王说：孙悟空，你还去叫那个家伙出来，等我与他交战，待他拿动圈子，我却闪过，教火德帅众烧他。那小怪又急通报说：孙悟空又来了。那魔帅众出洞，见了悟空说：你这泼猴，又请了什么兵来耶？这那边转上托塔天王喝说：泼魔头！",
        "那一个因欺禅性施威武，这一个为救师灾展大伦。天王使法飞沙石，魔怪争强播土尘。播土能教天地暗，飞沙善着海江浑。两家努力争功绩，皆为唐僧拜世尊。那孙悟空见他两个交战，就转身跳上高峰，对火德星君说：三用心者。你看那个妖魔与天王正斗到好处，却又拿出圈子来。将圈子望空抛起，喇一声，把这火龙、火马、火鸦、火鼠、火枪、火刀、火弓、火箭，一圈子又套将下去，转回本洞，得胜收兵。这火德星君手执着一杆空旗，招回众将，会合天王等，坐于山南坡下，对悟空说：悟空呵，这个凶魔真是罕见。悟空说：那妖怪物既不怕火，一定怕水。",
        "悟空说：有一事要入乌浩宫见水德星君。神仙们报说：齐天悟空孙悟空来了。水德星君听完，就将查点四海、五湖、八河、四渎、三江、九派并各处龙王具遣退。整冠束带，接出宫门，迎进宫内说：昨日可韩司查勘小宫，恐有本部之神思凡作怪，正在此点查江海河渎之神，尚未完也。悟空说：那魔王不是江河之神，此原来广大之精。先蒙玉帝差李天王父子并两个雷公下界擒拿，被他弄个圈子，将六件神兵套去。我想此物既不怕火，必然怕水，特来告请星君施水势，与我捉那妖精，取兵器归还天将，我师之难，亦可救也。水德听完，就令黄河水伯神王：随悟空去助功。",
        "水伯说：小神只会放水，却不会收水。又只见那洞外跳出几个小妖，在外边吆吆喝喝，伸拳逻袖，弄棒拈枪，依旧喜喜欢欢耍子。天王说：这水原来没有灌入洞内，枉费一场之功也。悟空忍不住心中怒发，双手抡拳，闯至妖魔门首，喝说：哪里走！吓得那几个小妖丢了枪棒，跑入洞里，战兢兢的报说：大王，不好了，打将来了！那魔王挺长枪，迎出门前说：这泼猴老大惫懒！那妖撩衣进步，丢了个架子，举起两个拳来，真似打油的铁锤模样。这悟空展足挪身，摆开解数，在那洞门前，与那魔王递走拳势。魔王使个蟒翻身，悟空却施鹿解角。妖精就使观音掌，悟空就对罗汉脚。",
        "就变做三五十个小猴，一拥上前，把那妖缠住，抱腿的抱腿，扯腰的扯腰，抓眼的抓眼，挦毛的挦毛。那妖怪物慌了，急把圈子拿将出来。悟空与天王等见他弄出圈套，拨转云头，走上高峰逃阵。那妖把圈子往上抛起，喇的一声，把那三五十个毫毛变的小猴，收为本相，套入洞中，得了胜，领兵闭门，贺喜而去。悟空笑说：大家在此远观，那妖怪的本事，比我怎么？李天王说：他拳松脚慢，不如悟空的紧疾。悟空说：魔王好治，只是套子难降。火德与水伯说：若还取胜，除非得了他那宝贝，然后可擒。邓、张二公笑说：若要行偷礼，除悟空再无能者。"
      ],
      "52": [
        "悟空说：我变化进他洞去，那妖怪物越发唱唱舞舞的吃得胜酒哩。东那边靠着我的金箍棒，是我拿在手中，一路打将出来也。神仙们说：你的宝贝得了，我们的宝贝何时到手？我有了这根铁棒，不管怎么，也要打倒他，取宝贝还你。正讲处，只听得那山坡下锣鼓齐鸣，喊声振地。悟空见了，叫说：好好好，正合我意。好悟空，举铁棒劈面迎来，喝说：泼魔哪里走！悟空说：我把你这个不知死的孽畜！这一场好战：悟空施威猛，妖魔不顺柔。满空飞鸟皆停翅，四野狼虫尽缩头。那阵上小妖呐喊，这那边悟空抖搜。一条铁棒无人敌，打遍西方万里游。那魔王与孙悟空战经三个时辰，不分胜败，早又见天色将晚。",
        "约摸有一更时分，悟空才到他后边房里，只听那老魔传令，吩咐：各门上小的醒睡，恐孙悟空又变什么，私入家偷盗。钻入房门，见有一架石床，左右列几个抹粉搽胭的山精树鬼，展铺盖伏侍老魔，脱脚的脱脚，解衣的解衣。悟空见了，将身又变，变作一个黄皮虼蚤，跳上石床，钻入被里，爬在那妖怪的肐膊上，着实一口。叮的那妖怪翻身骂说：这些少打的奴才！那妖怪睡不得，又翻过身来说：刺闹杀我也！悟空见他关防得紧，宝贝又随身，不肯除下，料偷他的不得。悟空现了原身，走近门前，使个解锁法，念动咒语，用手一抹，扢扠一声，那锁双錤具就脱落。",
        "妖魔于是恨说：不知是那个小妖不仔细，失了火，致令如此。旁边有近侍的告说：大王，这火不干本家之事。老魔方然省悟说：没有别人，断乎是孙悟空那贼。想是那贼猴变化进来，在我这肐膊叮了两口。一定是要偷我的宝贝，见我抹勒得紧，不能下手，故此盗了兵器，纵着火龙，放此狠毒之心，想要烧杀我也。那高峰上太子得了六件兵器，对悟空说：悟空，天色已明，不须怠慢，我们趁那妖魔挫了锐气，与火部等扶助你，再去力战，庶几这次可擒拿也。学成变化无量法，宇宙长空任我狂。御赐齐天名悟空，敕封又赠美猴王。暗闯瑶池偷玉液，私行宝阁饮琼浆。",
        "相持七十单二变，各弄精神个个强。老君又使金刚套，把我擒拿到上方。七七数完开鼎看，我身跳出又凶张。金蝉唐僧临凡世，东土差他拜佛乡。泼魔休弄獐狐智，还我唐僧拜法王。那妖怪听完，指着悟空说：你原来是个偷天的大贼。两个正自相持，这那边哪咤太子生嗔，火德星君发狠，就将那六件神兵、火部等物，望妖魔身上抛来。那魔头巍巍冷笑，袖子中暗暗将宝贝拿出，撒手抛起空中，叫声：着！喇的一下，把六件神兵、火部等物、雷公、天王刀、悟空棒，尽情又都捞去。神仙们灵依然赤手，孙悟空仍是空拳。待齐备了，杀唐僧三众来谢土，大家散福受用。",
        "好悟空，说声去，就纵筋斗云，早至灵山。元气流通天地远，威风飞彻满台花。那悟空正然点看山景，忽听得有人叫说：孙悟空，从哪里来？悟空作礼说：正有一事，欲见如来。这悟空紧随至雷音寺山门下，又见那八大金刚雄纠纠的，两边挡住。比丘尼说：悟空，暂候片时，等我与你奏上去来。那比丘尼至佛前合掌说：孙悟空有事，要见如来。悟空低头礼拜毕，如来问：悟空，前听见观音尊者解脱你身，皈依释教，保唐僧来此求经，你怎么独自到此？弟子自秉迦持，与唐朝师父西来，行至金山金洞，遇着一个恶魔头，名唤兕大王，神通广大，把师父与师弟等摄入洞中。",
        "对悟空说：那妖怪物我虽知之，但不可与你说。悟空再拜称谢说：如来助我什么法力？如来就令十八尊罗汉开宝库，取十八粒金丹砂，与悟空助力。如来说：你去洞外，叫那妖魔比试。演他出来，却教罗汉放砂，陷住他，使他动不得身，拔不得脚，凭你揪打就了。一路查看，止有十六尊罗汉，悟空嚷说：这是那个地方，却卖放人。悟空说：原差十八尊，今怎么只得十六尊？说不了，里边走出降龙、伏虎二尊，上前说：悟空，怎么就这等放刁？罗汉说：不必絮繁，快去叫他出来。这悟空捻着拳头，来于洞口，骂说：腯泼怪物，快出来与你孙外公见个上下。",
        "此砂本是无情物，盖地遮天把怪拿。那妖魔见飞砂迷目，把头低了一低，足下就有三尺余深。那妖怪急了，拔出脚来，就忙取圈子，往上一撇，叫声：着！悟空近前问：众罗汉，怎么不下砂了？罗汉说：适才响了一声，金丹砂就不见矣。天王等众说：这般难伏呵，却怎么捉得他？旁有降龙、伏虎二罗汉对悟空说：悟空，你晓得我两个出门迟滞何也？悟空说：我只怪你躲避不来，却不知有甚话说。罗汉说：如来吩咐我两个说：那妖魔神通广大，如失了金丹砂，就教孙悟空上离恨天兜率宫太上老君处寻他的踪迹，庶几可一鼓而擒也。李天王说：既是如来有此明示，悟空就当早起。",
        "悟空说：无甚宝贝，只见他有一个圈子，甚是利害。老君说：这孽畜偷了我金刚琢去了！他捉了我唐僧进去，抢了我金箍棒。老君说：我那金刚琢，原来是我过函关化胡之器，自幼炼成之宝。老君说：孙悟空还去诱他出来，我好收他。这悟空跳下峰头，又高声骂说：腯泼孽畜！悟空骂说：你这泼魔，今番坐好是死了！急纵身跳个满怀，劈脸打了一个耳括子，回头就跑。只听得高峰上叫说：那牛儿还不归家，更待何日？那魔抬头，看见是太上老君，就吓得心惊胆战说：这贼猴真个是个地里鬼，却怎么就访得我的陛下来也？老君念个咒语，将扇子扇了一下，那妖怪将圈子丢来，被老君一把接住。"
      ],
      "53": [
        "因你们不听良言，误入妖魔之手，致令悟空劳苦万端，今日方救得出。且来吃了饭，再去走路，不要孤负孙悟空一片恭孝之心也。唐僧说：徒弟，万分亏你，言谢不尽。悟空说：不瞒师父说，只因你不信我的圈子，却让你受别人的圈子。悟空说：都是你这孽嘴孽舌的夯货，弄师父遭此一场大难，着我翻天覆地，请天兵、水火与佛祖丹砂，尽被他使一个白森森的圈子套去。唐僧听完，感激不尽说：贤徒，今番经此，下次定然听你吩咐。悟空说：这饭多时了，却怎么还热？土地跪下说：是小神知悟空功完，才自热来伺候。唐僧勒过马观看，远见河那边有柳阴垂碧，微露着茅屋几椽。",
        "唐僧见那水清，一时口渴，就着八戒：取钵盂，舀些水来我吃。师徒们找路西行，不上半个时辰，那唐僧在马上呻吟说：腹痛。唐僧正不稳就，忽然见那路旁边有一村舍，树梢头挑着两个草把。悟空说：师父，好了，那厢是个卖酒的人家。我们且去化他些热汤与你吃，就问可有卖药的，讨贴药，与你治治腹痛。悟空上前，打个行礼问候说：婆婆，贫僧是东土大唐来的。我师父原来唐朝唐僧，因为过河吃了河水，觉肚腹疼痛。那婆婆喜哈哈的说：你们在那边河里吃水来？那婆婆欣欣的笑说：好耍子，好耍子。悟空就搀唐僧，沙僧就扶八戒，两人声声唤唤，腆着肚子，一个个只疼得面黄眉皱，入草舍坐下。",
        "唐僧听完，大惊失色说：徒弟呵，似此怎了？八戒扭腰撒胯的哼说：爷爷呀，要生孩子，我们却是男身，哪里开得产门？八戒见说，战兢兢，忍不得疼痛说：罢了，罢了，死了，死了。沙僧笑说：二哥不要扭，不要扭，只怕错了养儿肠，弄做个胎前病。那八戒越发慌了，眼中噙泪，扯着悟空说：哥哥，你问这婆婆，看哪里有手轻的稳婆，预先寻下几个。沙僧又笑说：二哥既知摧阵疼，不要扭动，只恐挤破浆包耳。唐僧哼着说：婆婆呵，你这里可有医家？让我徒弟去买一贴堕胎药吃了，打下胎来罢。悟空听见此言，心里高兴极了说：婆婆，你这里到那解阳山有几多路程？",
        "悟空说：我是个过路的挂搭僧，没有办得来。道人笑说：你好痴哑，我老师父护住山泉，并没有白送与人。却见那真仙抚琴，只待他琴终，才说说：师父，外面有个和尚，口称是唐僧大徒弟孙悟空，欲求落胎泉水，救他师父。悟空见了，合掌作礼说：贫僧就是孙悟空。那先生笑说：你真个是孙悟空，却是假名托姓者？常言说：君子行不更名，坐不改姓。悟空说：我因归正释门，秉诚僧教，这一向登山涉水，把我那幼时的朋友也都疏失，未及拜访，少识尊颜。适间问道子母河西乡人家，言及先生原来如意真仙，故此知之。那先生说：你走你的路，我修我的真，你来访我怎么？",
        "悟空使铁棒架住说：先生不要说打的话，且与些泉水去也。悟空骂说：我把你不识起倒的孽障！二人在聚仙庵好杀：圣僧误食成胎水，悟空来寻如意仙。钩挛棒打无前后，不见输赢在那边。那先生与悟空战经十数合，敌不得悟空。这悟空越加猛烈，一条棒似滚滚流星，着头乱打。悟空拿着瓦钵，追到门前，尽力气一脚，踢破庵门，闯将进去。见那道人伏在井栏上，被悟空喝了一声，举棒要打，那道人往后跑了。却才寻出吊桶来，正要打水，又被那先生赶到前边，使如意钩子把悟空钩着脚一跌，跌了个嘴硍地。他却闪在旁边，执着钩子说：看你可取得我的水去？",
        "好悟空，拨转云头，径至村舍门首，叫一声：沙僧。哪里边唐僧忍痛呻吟，猪八戒哼声不绝。听得叫唤，二人欢喜说：沙僧呵，悟空来也。沙僧连忙出门接着说：大哥，取水来了？悟空说：我来叫沙兄弟与我同去，到那庵边，等我和那个家伙敌斗，教沙僧乘就取水来救你。唐僧说：两个没病的都去了，丢下我两个有病的，教谁伏侍？那个老婆婆在旁边说：老罗汉只管放心，不须要你徒弟，我家自然看顾伏侍你。却才见这位菩萨云来雾去，方知你是罗汉菩萨，我家决不敢复害你。悟空咄的一声说：你们女流之辈，敢伤那个？老婆子笑说：爷爷呀，还是你们有好运气，来到我家！",
        "再说那沙僧提着吊桶，闯进门去，只见那道人在井边挡住说：你是甚人，敢来取水？沙僧放下吊桶，拿出降妖宝杖，不对话，着头就打。那道人躲闪不及，把左臂膊打折，道人倒在地下挣命。沙僧骂说：我要打杀你这孽畜，怎奈你是个人身，我还怜你，饶你去罢。沙僧却才将吊桶向井中满满的打了一吊桶水，走出庵门，驾起云雾，望着悟空喊说：大哥，我已取了水去也。悟空听得，才使铁棒支住钩子说：我本待斩尽杀绝，争奈你没有犯法；我若肯拿出本事来打你，不要说你是一个什么如意真仙，就是再有几个，也打死了。被悟空闪过钩头，追上前，喝声：休走！",
        "只见猪八戒腆着肚子，倚在门枋上哼哩。悟空悄悄上前说：八戒，几时占房的？悟空还要耍他，沙僧随后就到，笑说：水来了，水来了。唐僧忍痛欠身说：徒弟呵，累了你们也。那婆婆却也欢喜，几口儿都出礼拜说：菩萨呀，却是难得，难得。就忙取个花磁盏子，舀了半盏儿，递与唐僧说：老师父，细细的吃，只消一口，就解了胎气。八戒说：我不用盏子，连吊桶等我喝了罢。吓得八戒不敢胡为，也只吃了半盏。肠鸣之后，那八戒忍不住，大小就齐流。悟空说：师父呵，切不要出风地里去，怕人子，一时冒了风，弄做个产后之疾。八戒说：婆婆，我的身子实落，不用补虚。"
      ],
      "54": [
        "唐僧在马上指说：悟空，前面城池相近，市井上人语喧哗，想是西梁女国。正在两街上做买做卖，忽见他师徒四人来时，一齐都鼓掌呵呵，整容欢笑着说﹕ 人种来了，人种来了。过了一会儿就塞满街道，只听见笑语。八戒口里乱嚷说：我是个销猪，我是个销猪。悟空说：八戒，不要胡谈，拿出旧嘴脸就是。八戒真个把头摇上两摇，竖起一双蒲扇耳，扭动莲蓬吊搭唇，发一声喊，把那些妇女们吓得跌跌爬爬。师徒们转弯抹角，忽见有一女官侍立街下，高声叫说：远来的使客，不可擅入城门。唐僧听完下马，观看那衙门上有一匾，上书迎阳驿三字。唐僧说：悟空，那村舍人家传言是实，果然有迎阳之驿。",
        "说：爷爷们宽坐一时，待下官进城启奏我王，倒换关文，打发领给，送老爷们西进。驿丞又奏说：陛下之论，原来万代传家之好。驿丞说：唐僧相貌堂堂，丰姿英俊，诚是天朝上国之男儿，南赡中华之人物。女王说：既如此，把他徒弟与他领给，倒换关文，打发他往西天，只留下唐僧，有为什么不可？众官拜奏说：陛下之言极当，臣等钦此钦遵。自古说：姻缘配合凭红叶，月老夫妻系赤绳。女王说：依卿所奏，就着当驾太师作媒，迎阳驿丞主婚，先去驿中与唐僧求亲。说不了，二女官早至，对唐僧下拜。唐僧一一还礼说：贫僧出家人，有何德能，敢劳大人下拜？",
        "我王旨意，原只教求唐僧为亲，让你三位徒弟赴了会亲筵宴，发付领给，倒换关文，往西天取经去哩。那太师与驿丞对悟空作礼说：多谢老师玉成之恩。八戒说：太师，切不要口里摆菜碟儿。太师说：有有有，就教摆设筵宴来也。再说唐僧一把扯住悟空，骂说：你这猴头，弄杀我也，怎么说出这般话来，让我在此招婚，你们西天拜佛？悟空说：师父放心，我岂不知你性情，但只是到此地，遇此人，不得不将计就计。悟空说：你若使住法儿不允他，他就不肯倒换关文，不放我们走路。一定要使出降魔荡怪的神通，你知我们的手脚又重，器械又凶，但动动手儿，这一国的人，尽打杀了。",
        "问女王拿出御宝印信来，宣我们兄弟进朝，把通关文牒用了印，再请女王写个手字花押，佥押了交付与我们。却待送出城外，你下了龙车凤辇，教沙僧伺候左右，伏侍你骑上白马；再说那太师与驿丞不等宣诏，直入朝门白玉阶前，奏说：陛下佳梦最准，鱼水之欢就矣。女王听完禀报，卷珠帘，下龙床，启樱唇，露银齿，笑盈盈娇声问：贤卿见唐僧，怎么说来？太师说：臣等到驿，拜见唐僧毕，就备言求亲之事。唐僧还有推托之辞，幸亏他大徒弟慨然见允，愿留他师父与我王为夫，面南称帝。只教先倒换关文，打发他三人西去；",
        "唐僧听完，就与三徒整衣出厅迎驾。女王卷帘下辇说：那一位是唐朝唐僧？太师指说：那驿门外香案前穿襴衣者就是。猪八戒在旁边，掬着嘴，饧眼观看那女王，却也袅娜。那八戒看到好处，忍不住口嘴流涎，心头撞鹿，一时间骨软筋麻，好就似雪狮子向火，不觉的都化去也。只见那女王走近过来，一把扯住唐僧，俏语娇声，叫说：唐僧哥哥，请上龙车，和我同上金銮宝殿，匹配夫妇去来。这唐僧战兢兢立站不住，似醉如痴。悟空在侧教说：师父不必太谦，请共师娘上辇。唐僧不敢回言，把悟空抹了两抹，止不住落下泪来。",
        "那女主喜孜孜欲配夫妻，这唐僧忧惶惶只思拜佛。二人和会同登辇，岂料唐僧各有心。那些文武官见陛下与唐僧同登凤辇，并肩而坐，一个个眉花眼笑，拨转仪从，复入城中。孙悟空才教沙僧挑着行李，牵着白马，随大驾后边同行。猪八戒往前乱跑，先到五凤楼前，嚷说：好自在，好现成呀。吓得些执仪从引导的女官，一个个回至驾边说：陛下，那一个长嘴大耳的，在五凤楼前嚷道要喜酒吃哩。女主听完禀报，与唐僧倚香肩，偎并桃腮，开檀口，俏声叫说：唐僧哥哥，长嘴大耳的是你那个高徒？女主急问：光禄寺安排筵宴，完否？女官奏说：已完，设了荤素两样，在东阁上哩。",
        "悟空近前说：我师徒都是吃素，先请师父坐了左手素席，转下三席，分左右，我兄弟们好坐。悟空又与唐僧丢个眼色，教师父回礼。唐僧下来，却也擎玉杯，与女王安席。也不管什么玉屑、米饭、蒸饼、糖糕、 蘑菇、香蕈、笋芽，木耳、黄花菜、石花菜、紫菜、蔓菁、芋头、萝菔、山药、 黄精，一骨辣了个罄尽。沙僧问：好筵席不吃，还要干甚事？八戒笑说：古人云：造弓的造弓，造箭的造箭。近侍官连忙取几个鹦鹉杯、鸬鶿杓、金叵罗、银凿落、玻璃盏、水晶盆、蓬莱碗、琥珀钟，满斟玉液，连注琼浆，果然都各饮一巡。唐僧欠身而起，对女王合掌说：陛下，多蒙盛设，酒已勾了。",
        "女王不知是计，就传旨摆驾，与唐僧并倚香肌，同登凤辇，出西城而去。满城中都盏添净水，炉降真香：一则看女王銮驾，二来看唐僧男身。悟空、八戒、沙僧同心合意，结束整齐，径迎着銮舆，大声说：那女王不必远送，我们就此拜别。唐僧慢下龙车，对女王拱手说：陛下请回，让贫僧取经去也。女王听完，大惊失色，扯住唐僧说：唐僧哥哥，我愿将一国之富，招你为夫，明日高登宝位，就位称君，我愿为君之后，喜筵通皆吃了，怎么却又变卦？那女王见他那等撒泼弄丑，吓得魂飞魄散，跌入辇驾之中。沙僧却把唐僧抢出人丛，伏侍上马。只见那路旁边闪出一个女子，喝说：唐僧，哪里走？"
      ],
      "55": [
        "再说孙悟空兄弟三人腾空踏雾，望着那阵旋风，一直赶来。你两个且牵了马，还转石屏前立等片时，待我进去打听打听，察个有无虚实，却好行事。悟空自门瑕处钻将进去，飞过二层门里。只见正当中花亭子上端坐着一个女妖，左右列几个彩衣绣服、丫髻两揫的女童，都欢天喜地，正不知讲论什么。这悟空轻轻的飞上去，钉在那花亭格子上，侧耳才听，又见两个总角蓬头女子，捧两盘热腾腾的面食，上亭来说：奶奶，一盘是人肉馅的荤，一盘是邓沙馅的素。那女怪笑说：小妖们，搀出唐僧来。几个彩衣绣服的女童走向后房，把唐僧扶出。那妖怪走下亭，露春葱十指纤纤，扯住唐僧说：唐僧宽心。",
        "那女怪说：你出家人不敢破荤，怎么前日在子母河边吃水高，今日又好吃邓沙馅？唐僧说：水高船去急，沙陷马行迟。悟空在格子眼听着两个言语相攀，恐怕师父乱了真性，忍不住，现了本相，抽出铁棒喝说：孽畜无礼！那女怪见了，口喷一道烟光，把花亭子罩住，吩咐：小妖们，收了唐僧。他却拿一柄三股钢叉，跳出亭门，骂说：泼猴惫懒！这悟空使铁棒架住，且战且退，二人打出洞外。那八戒、沙僧正在石屏前等候，忽见他两人争持，慌忙八戒将白马牵过说：沙僧，你只管看守行李、马匹，等八戒去帮打帮打。好八戒，双手举钯，追上前叫说：师兄靠后，让我打这泼贱。那妖怪说：孙悟空，你好不识进退。",
        "那一个喜得唐僧谐凤侣，这两个必随唐僧取真经。那女怪将身一纵，使出个倒马毒桩，不觉的把悟空头皮上扎了一下。悟空抱头，皱眉苦面，叫声：利害！八戒到跟前问：哥哥，你怎么正战到好处，却就叫苦连天的走了？八戒说：哥哥，我没有见你受伤，却头疼，何也？我与他正然打处，他见我破了他的叉势，他就把身子一纵，不知是件什么兵器，着我头上扎了一下，就这般头疼难禁，故此败了阵来。八戒笑说：只这等静处常夸口，说你的头是修炼过的。我这头，自从修炼成真，盗食了蟠桃仙酒、老子金丹，大闹天宫时，又被玉帝差大力鬼王、 二十八宿，押赴斗牛宫处处斩，那些神将使刀斧锤剑，雷打火烧；",
        "八戒说：这样看来，就我们安歇不成。沙僧说：不须索战﹕一则师兄头痛；他两个散言碎语的，直斗到更深，唐僧全不动念。那女怪扯扯拉拉的不放，这师父只是老老成成的不肯。直缠到有半夜时候，把那妖怪弄得恼了，叫：小妖们，拿绳来。那山坡下孙悟空欠身说：我这头疼了一会，到如今也不疼不麻，只是有些作痒。八戒笑说：痒就再让他扎一下，何如？八戒又笑说：放放放，我师父这一夜倒浪浪浪。悟空说：兄弟，你只管在此守马，不许动身。那八戒抖搜精神，束一束皂锦直裰，相随悟空，各带了兵器，跳上山崖，径至石屏之下。只怕这怪物夜里伤了师父，先等我进去打听打听。",
        "一觉翻身，只听见取经去也一句，他就滚下床来，大声说：好夫妻不做，却取什么经去？悟空慌了，撇却师父，急展翅，飞将出去，现了本相，叫声：八戒。那八戒转过石屏说：那话儿成了否？正与我诉说前情，那妖怪惊醒了，我慌忙出来也。悟空说：他只说衣不解带，身未沾床。八戒笑说：好好好，还是个真和尚！八戒粗卤，不容分说，举钉钯，望他那石头门上尽力气一钯，喇喇筑做几块。吓得那几个枕梆铃睡的丫鬟跑至二层门外，叫声：开门，前门被昨日那两个丑男人打破了！那女怪正出房门，只见四五个丫鬟跑进去报说：奶奶，昨日那两个丑男人又来把前门已打碎矣。",
        "那妖怪又弄神通，也不知是几只手，左右遮拦。交锋三五个回合，不知是甚兵器，把八戒嘴唇上也扎了一下。那八戒拖着钯，侮着嘴，负痛逃生。那妖怪得胜而回，叫小妖们搬石块垒叠了前门暂且不说。再说那沙僧正在坡前放马，只听得哪里猪哼。说不了，悟空也到跟前，笑说：好八戒呵，昨日咒我是脑门痈，今日却也弄做个嘴瘟了。八戒哼说：难忍难忍，疼得紧，利害利害。沙僧说：大哥，那妈妈来得近了，等我问他个信儿，看这个是甚妖精，是甚兵器，这般伤人？悟空急睁睛看，只见头直上有祥云盖顶，左右有香雾笼身。悟空认得，就叫：兄弟们，还不来磕头，那妈妈是菩萨来也。",
        "悟空说：才然菩萨指示，让我告请昴日星官。八戒侮着嘴哼说：哥呵，就问星官讨些止疼的药饵来。悟空笑说：不须用药，只似我昨日疼过夜就好了。好悟空，急忙驾筋斗云，过了一会儿到东天门外。忽见增长天王当面作礼说：悟空何往？悟空说：因保唐僧西方取经，路遇魔障缠身，要到光明宫见昴日星官走走。忽又见陶、张、辛、邓四大元帅，也问何往。悟空说：要寻昴日星官去降妖救师。四元帅说：星官今早奉玉帝旨意，上观星台巡查去了。辛天君说：小将等与他同下斗牛宫，岂敢说假？悟空还先去光明宫，如未回，再去观星台可也。前行的兵士看见悟空立于光明宫外，急转身报说：陛下，孙悟空在这里也。",
        "悟空笑说：烦星官也把我头上摸摸。悟空说：昨日也曾遭过，只是过了夜，才不疼。八戒发狠说：哥哥，去打那泼贱去。悟空与八戒跳上山坡，又至石屏之后。八戒口里乱骂手似捞钩，一顿钉钯，把那洞门外垒叠的石块爬开。闯至一层门，又一钉钯，将二门筑得粉碎。慌忙那门里小妖飞报：奶奶，那两个丑男人又把二层门也打破了。那妖怪正教解放唐僧，讨素茶饭与他吃哩。听见打破二门，就跳出花亭子，抡叉来刺八戒；那妖怪赶过石屏之后，悟空叫声：昴宿何在？八戒上前，一只脚屣住那妖怪的胸背说：孽畜！那妖怪动也不动，被八戒一顿钉钯，捣作一团烂酱。"
      ],
      "56": [
        "唐僧勒马回头叫说：悟空，前面有山，恐又生妖怪，是必谨防。猪八戒卖弄精神，教沙僧挑着担子，他双手举钯，上前赶马。那马更不惧他，凭那八戒嗒笞笞的，还只是缓行不紧。八戒说：天色将晚，自上山行了这一日，肚里饿了，大家走动些，寻个人家，化些斋吃。悟空听完说：既如此，等我让他快走。把金箍棒幌一幌，喝了一声，那马溜了缰，如飞似箭，顺平路往过去了。悟空五百年前曾受玉帝封在大罗天御马监养马，官名弼马温，故此传留至今，是马皆惧猴子。正走处，忽听得一棒锣声，路两边闪出三十多人，一个个枪刀棍棒，拦住路口说：和尚，哪里？",
        "那贼那容分说，举着棒，没头没脸的打来。唐僧一生不会说谎，遇着这急难处，没奈何，只得打个诳语说：二位大王且不要动手。那贼说：这和尚是也吃不得亏，且捆起来。八戒呵呵大笑说：师父去得好快，不知在哪里等我们哩。忽见唐僧在树上，他又说：你看师父，等就罢了，却又有这般心肠，爬上树去，扯着藤儿打秋千耍子哩。好悟空，急登高坡细看，认得是伙强人，心中暗喜说：好运气，好运气，买卖上门了。就转步，摇身一变，变做个干干净净的小和尚，穿一领缁衣，年纪只有二八，肩上背着一个蓝布包袱。拽开步，来到前边，叫说：师父，这是怎么说话？",
        "那伙贼见悟空与他师父讲话，撒开势，围将上来说：小和尚，你师父说你腰里有盘缠，趁早拿出来，饶你们性命；悟空放下包袱说：大家长官，不要嚷。要时就连包儿拿去，切不要打我师父。那伙贼听完，都甚欢喜说：这老和尚悭吝，这小和尚倒还慷慨。那唐僧得了性命，跳上马，顾不得悟空，操着鞭，一直跑回旧路。悟空笑说：说开，盘缠须三分分之。那贼头说：这小和尚忒乖，就要瞒着他师父留起一些。也罢，拿出来看，若多时，也分些与你背地里买果子吃。悟空说：哥哑，不是这样看来，我哪里有甚盘缠？说你两个打劫别人的金银，是必分些与我。",
        "悟空走上前，轻轻的拿起，丢一个蟒翻身拗步势，指着强人说：你都好运气低，遇着我了。悟空笑说：你也打得手困了，且让我打一棒儿，却休当真。你看他展开棍子幌一幌，有井栏粗细，七八丈长短，荡的一棍，把一个打倒在地，嘴唇土，再不做声。那一个开言骂说：这秃厮老大无礼！悟空笑说：且消停，且消停，待我一个个打来，一发让你断了根罢。再说唐僧骑着马，往东正跑，八戒、沙僧拦住说：师父往哪里去？唐僧兜马说：徒弟呵，趁早去与你师兄说，让他棍下留情，不要打杀那些强盗。八戒一路跑到前边，大声说：哥哥，师父让你不要打人哩。",
        "悟空努着嘴说：好不知趣，这半山之中，前不巴村，后不着店，那讨香烛？唐僧恨恨的说：猴头过去，等我撮土焚香祷告。这是唐僧离鞍悲野冢，圣僧善念祝荒坟。唐僧真个又撮土祷告说：好汉告状，只告悟空，也不干八戒、沙僧之事。悟空听完，忍不住笑说：师父，你老人家忒没情义。为你取经，我费了多少殷勤劳苦，如今打死这两个毛贼，你倒让他去告我。你不往西天取经，我不与你做徒弟，怎么会来这里，会打杀人？揝着铁棒，望那坟上捣了三下说：遭瘟的强盗，你听着：我被你前七八棍，后七八棍，打得我不疼不痒的，触恼了性子，一差二误，将你打死了。",
        "老者猛抬头，看见他们面貌丑陋，急回身往里就走。被唐僧扯住说：老施主，千万慈悲，告借一宿！老者战兢兢拑口难言，摇着头，摆着手说：不、不、不、不像人模样！悟空听完，大声说：雷公是我孙子，夜叉是我重孙，马面是我玄孙哩。唐僧搀住他，同到草堂，陪笑说：老施主，不要怕他，他都是这等粗鲁，不会说话。正劝解处，只见后面走出一个婆婆，携着五六岁的一个小孩儿，说：爷爷，为什么这般惊恐？茶罢，唐僧却转下来，对婆婆作礼说：贫僧是东土大唐差往西天取经的。婆婆说：见貌丑的就这等虚惊，若见了老虎豺狼，却怎么好？老者说：妈妈哑，人面丑陋还可，只是言语一发吓人。",
        "那个家伙专生恶念，不务本等，专好打家截道，杀人放火。唐僧闻说，不敢言喘，心中暗想说：或者悟空打杀的就是也。自天早在山前被悟空打死两个贼首，他们都四奔逃生。约摸到四更时候，又结成一伙，在门前打门。老者听得门响，就披衣说：妈妈，那个家伙们来也。妈妈说：既来，你去开门，放他来家。老者才开门，只见那一伙贼都嚷说：饿了，饿了。这老杨的儿子忙入里面，叫起他妻来，打米煮饭。却厨下无柴，往后园里拿柴，到厨房里问妻说：后园里白马是哪里的？其妻说：是东土取经的和尚，昨晚至此借宿，公公、婆婆管待他一顿晚斋，让他在草团瓢内睡哩。",
        "乖些的跑脱几个，痴些的都见阎王。唐僧在马上见打倒许多人，慌的放马奔西。悟空问那不死带伤的贼人说：那个是那杨老人家的儿子？那贼哼哼的告说：爷爷，那穿黄的是。悟空上前，夺过刀来，把个穿黄的打倒在地，血淋淋提在手中，收了铁棒，拽开云步，赶到唐僧马前，提着头说：师父，这是杨老人家的逆子，被我取将首级来也。唐僧见了，大惊失色，慌忙跌下马来，骂说：这泼猢狲吓杀我也！八戒上前，将人头一脚踢下路旁边，使钉钯筑些土盖了。沙僧放下担子，搀着唐僧说：师父请起。那唐僧在地下正了性，口中念起紧箍儿咒来，把个悟空勒得耳红面赤，眼胀头昏，在地下打滚，只吩咐：不要念，不要念。"
      ],
      "57": [
        "苦自忖量说：罢罢罢，我还去见我师父，还是正果。好悟空，拨回筋斗，那消一个时辰，早至南洋大海。住下祥光，直至落伽山上，撞入紫竹林中，忽见木叉悟空迎面作礼说：悟空何往？木叉就引悟空至潮音洞口，又见善财童子作礼说：悟空何来？善财听见一个告字，笑说：好刁嘴猴儿，还像当时我抓住唐僧被你欺哩。我菩萨是个大慈大悲、大愿大乘、救苦救难、无边无量的圣善菩萨，有甚不是处，你要告他？你那时节作怪成精，我请菩萨收了你，皈正迦持，如今得这等极乐长生，自在逍遥，与天同寿，还不拜谢我，转倒这般侮慢。我是有事来告求菩萨，却怎么说我刁嘴要告菩萨？",
        "上天无路，入地无门，特来告诉菩萨。菩萨说：唐僧奉旨投西，一心要秉善为僧，决不轻伤性命。似你有无量神通，何苦打许多草寇？草寇虽是不良，到底是个人身，不该打死。悟空噙泪磕头说：纵是弟子不善，也当将功折罪，不该这般逐我。还请菩萨舍大慈悲，将松箍儿咒念念，褪下金箍，交还与你，放我仍往水帘洞逃生去罢菩萨笑说：紧箍儿咒，本是如来传我的。悟空说：既如此，我告辞菩萨去也。悟空说：我上西天，拜告如来，求念松箍儿咒去也。菩萨说：你且住，我与你看看祥晦怎么。悟空说：不消看，只这样不祥也勾了。菩萨说：我不看你，看唐僧的祥晦。",
        "那悟空变了脸，发怒生嗔，喝骂唐僧说：你这个狠心的泼秃！抡铁棒，丢了磁杯，望唐僧脊背上砑了一下。那唐僧昏晕在地，不能言语，被他把两个青毡包袱提在手中，驾筋斗云，不知去向。再说八戒托着钵盂，只奔山南坡下，忽见山凹之间有一座草舍人家。好八戒，捻着诀，念个咒，把身摇了七八摇，变作一个食痨病黄胖和尚，口里哼哼唧唧的挨近门前，叫说：施主，厨中有剩饭，路上有饥人。我师父在路饥渴了，家中有锅巴冷饭，千万化一些救口。八戒拿转来，现了本像，直接回到旧路。八戒抬头看时，却是沙僧站在山崖上喊说：这里来，这里来。",
        "慌忙八戒跌脚捶胸，大呼小叫说：不消讲，不消讲，这还是悟空赶走的余党，来此打杀师父，抢了行李去了。你看着师父的尸灵，等我把马骑到那个府州县乡村店集卖几两银子，买口棺木，把师父埋了，我两个各寻道路散伙。沙僧实不忍舍，将唐僧扳转身体，以脸温脸，哭一声：苦命的师父！只见那唐僧口鼻中吐出热气，胸前温暖，连叫：八戒，你来，师父未伤命哩。甦醒呻吟一会，骂说：好泼猢狲，打杀我也。却讨水吃了几口，才说：徒弟，你们刚去，那悟空更来缠我。是我坚执不收，他于是将我打了一棒，青毡包袱都抢去了。八戒听说，咬响口中牙，发起心头火说：叵耐这泼猴子！",
        "师父吃了几口，定性多时说：那个去讨行李？八戒说：我前年因师父赶他回去，我曾寻他一次，认得他花果山水帘洞。那猢狲原与你不和，你又说话粗鲁，或一言两句之间，有些差池，他就要打你。唐僧又吩咐沙僧说：你到哪里，须看个头势。他若肯与你包袱，你就假谢谢拿来；若不肯，切不要与他争竞，径至南海菩萨处，将此情告诉，请菩萨去问他要。向八戒说：我今寻他去，你千万不要僝僽，好生供养师父。沙僧于是捻了诀，驾起云光，直奔东胜神洲而去。真个是：身在神飞不守舍，有炉无火怎烧丹。那沙僧在半空里，行经三昼夜，方到了东洋大海，忽闻波浪之声。",
        "自别大国以来，经度诸邦，中途收得大徒弟孙悟空悟空、二徒弟八戒八戒、三徒弟沙僧和尚。沙僧听得是通关文牒，止不住近前大声说：师兄，师父的关文你念他怎么？那悟空听完，急抬头，不认得是沙僧，叫：拿来，拿来。众猴一齐围绕，把沙僧拖拖扯扯，拿近过来，喝说：你是谁，擅敢近我仙洞？沙僧见他变了脸，不肯相认，只得朝上行礼说：上告师兄：前者实是师父性暴，错怪了师兄，把师兄咒了几遍，逐赶回家。不意师兄好意复来，又怪师父执法不留，于是把师父打倒，昏晕在地。悟空听完，呵呵冷笑说：贤弟，此论甚不合我意。我打唐僧，抢行李，不因我不上西方，亦不因我爱居此地。",
        "果跑进去，牵出一匹白马，请出一个唐僧；这沙僧见了，大怒说：我老沙行不更名，坐不改姓，哪里又有一个沙僧？好沙僧，双手举降妖杖，把一个假沙僧劈头一下打死，原来这是一个猴精。那悟空恼了，抡金箍棒，帅众猴，把沙僧围了。沙僧东冲西撞，打出路口，纵云雾逃生说：这泼猴如此惫懒，我告菩萨去来。那悟空见沙僧打死一个猴精，把沙僧逼得走了，他也不来追赶。回洞教小妖们把打死的妖尸拖在一边，剥了皮，取肉煎炒，将椰子酒、葡萄酒，同群猴都吃了。另选一个会变化的妖猴，还变一个沙僧，从新教导，要上西方暂且不说。沙僧一驾云离了东海，行经一昼夜，到了南海。",
        "悟空在台下听见，笑说：这定是唐僧有难，沙僧来请菩萨的。这沙僧倒身下拜，拜罢，抬头正欲告诉前事，忽见悟空站在旁边，等不得说话，就抽出降妖杖望悟空劈脸就打。沙僧口里乱骂说：我把你个犯十恶造反的泼猴！菩萨喝说：沙僧不要动手，有甚事先与我说。沙僧收了宝杖，再拜台下，气冲冲的对菩萨说：这猴一路行凶，不可数计。前日在山坡下打杀两个剪路的强人，师父怪他。不期晚间就宿在贼窝主家里，又把一伙贼人尽情打死，又血淋淋提一个人头来与师父看。分别之后，师父饥渴太甚，教八戒去寻水。不期悟空见我二人不在，复回来把师父打一铁棍，将两个青毡包袱抢去。"
      ],
      "58": [
        "原来悟空筋斗云快，沙僧仙云觉迟，悟空就要先行。沙僧扯住说：大哥不必这等藏头露尾，先去安根。按下云头，二人洞外细看，果见一个悟空，高坐石台之上，与群猴饮酒作乐。模样与悟空无异：也是黄发金箍，金睛火眼；这悟空怒发，一撒手，撇了沙僧，抽出铁棒上前骂说：你是何等妖邪，敢变我的相貌，敢占我的儿孙，擅居我仙洞，擅作这威福？那悟空见了，公然不答，也使铁棒来迎。二悟空在一处，果是不分真假，好打哑：两条棒，二猴精，这场相敌实非轻。盖为神通多变化，无真无假两相平。忍耐良久，且纵身跳下山崖，使降妖宝杖，打近水帘洞外，惊散群妖，掀翻石凳，把饮酒食肉的器皿尽情打碎。",
        "菩萨无计奈何，就令诸天、木叉上前助力。菩萨说：你当年官拜弼马温，大闹天宫时，神将皆认得你，你且上界去分辨回话。二人扯扯拉拉，口里不住的嚷斗，径至南天门外。慌忙那广目天王帅马、赵、 温、关四大天将，及把门大小神仙们，各使兵器挡住说：哪里走？悟空说：我因保护唐僧往西天取经，在路上打杀贼徒，那唐僧赶我回去，我径到普陀崖见观音菩萨诉苦。有沙僧至花果山寻讨，只见这妖精占了我的巢穴。后到普陀崖告请菩萨，又见我侍立台下，沙僧诳说是我驾筋斗云，又先在菩萨处遮饰。菩萨却是个正明，不听沙僧之言，命我同他到花果山看验。",
        "唐僧自家悔恨说：当时只说是孙悟空打我一棍，抢去包袱，岂知却是妖精假变的悟空。沙僧又告说：这妖又假变一个唐僧，一匹白马；又有一个八戒挑着我们包袱，又有一个变作是我。我忍不住恼怒，一杖打死，原是一个猴精。菩萨着我与师兄又同去识认，那妖果与师兄一般模样。八戒哈哈大笑说：好好好，应了这施主家婆婆之言了：他说有几起取经的，这却不又是一起？那家老老小小的都来问沙僧说：你这几日往哪里讨盘缠去的？沙僧笑说：我往东胜神洲花果山寻大师兄取讨行李，又到南海普陀山拜见观音菩萨，却又到花果山，才转回至此。老者说：爷爷哑，似这几日，就走了这许多路，只除是驾云，方能勾得到！",
        "沙僧说：我们那算得走路，若是我大师兄，只消一二日，可往回也。八戒说：我们虽不是神仙，神仙还是我们的晚辈哩！慌忙都出来看，却是两个悟空打将来。八戒见了，忍不住手痒说：等我去认认看。好八戒，急纵身跳起，望空高叫说：师兄不要嚷，我八戒来也！那两个一齐应说：兄弟，来打妖精，来打妖精。那家子又惊又喜说：是几位腾云驾雾的罗汉歇在我家，就是发愿给和尚饭吃的，也斋不着这等好人。又说：这两个悟空只怕斗出不好来，地覆天翻，作祸在哪里！唐僧见那老者当面是喜，背后是忧，就开言说：老施主放心，不要生忧叹。师父可坐在这里，等我和二哥去，一家扯一个来到你面前，你就念念那话儿，看那个害疼的就是真的，不疼的就是假的。",
        "后被我说泛了他，他就跳下，去洞里换衣来时，我看见他将身往水里一钻。想必那妖怪将我们包袱收在哪里面也。唐僧说：你既知此门，你可趁他都不在，可先到他洞里拿出包袱，我们往西天去罢。沙僧说：二哥，他那洞前有千数小猴，你一人恐弄他不过，反为不美。再说那两个悟空又打嚷到阴山背后，吓得那满山鬼战战兢兢，藏藏躲躲。有先跑的，撞入地府门里，报上森罗宝殿说：大王，背阴山上有两个齐天悟空打将来也。慌忙那第一殿秦广王传报与二殿楚江王、三殿宋帝王、四殿卞城王、五殿阎罗王、六殿平等王、七殿泰山王、八殿都市王、九殿忤官王、十殿转轮王：一殿转一殿，霎时间，十王会齐，又着人飞报与地藏王。",
        "早见那四大菩萨、八大金刚、五百阿罗、三千揭谛、比丘尼、比丘僧、优婆塞、优婆夷诸悟空众，都到七宝莲台之下，净听如来说法。概众稽首皈依，流通诵读之际，如来降天花普散缤纷，就离宝座，对大众说：你们具是一心，且看二心竞斗而来也。大众举目看之，果是两个悟空，吆天喝地，打至雷音胜境。慌忙那八大金刚上前挡住说：你们欲往哪里去？这悟空说：妖精变作我的模样，欲至宝莲台下，烦如来为我辨个虚实也。众金刚抵挡不住，直嚷至台下，跪于佛祖之前，拜告说：弟子保护唐僧，来造宝山，求取真经，一路上炼魔缚怪，不知费了多少精神。前至中途，偶遇强徒劫掳，委是弟子二次打伤几人。",
        "师弟沙僧寻至我山，被这妖假捏巧言，说有真僧取经之故。观音知之，于是令弟子同沙僧再至我山。因此，两人比并真假，打至南海，又打到天宫，又曾打见唐僧，打见冥府，具不要能辨认。故此大胆轻造，千乞大开方就之门，广垂慈悯之念，与弟子辨明邪正，庶好保护唐僧亲拜金身，取经回东土，永扬大教。我佛合掌说：观音尊者，你看那两个悟空，谁是真假？菩萨说：前日在弟子荒境，委不能辨。如来笑说：你们法力广大，只能普阅周天之事，不能遍识周天之物，亦不能广会周天之种类也。如来才说：周天之内有五仙：原来天、地、神、人、鬼。",
        "他打伤我师父，抢夺我包袱，依律问他个得财伤人，白昼抢夺，也该个斩罪哩。如来说：你自快去保护唐僧来此求经罢。悟空磕头谢说：上告如来得知：那师父定是不要我，我此去，若不收留，却不又劳一番神思？那观音在旁边听说，就合掌谢了圣恩，领悟空，辄驾云而去。菩萨说：唐僧，前日打你的，原来假悟空六耳猕猴也。你今须是收留悟空，一路上魔障未消，必得他保护你，才得到灵山，见佛取经。正拜谢时，只听得正东上狂风滚滚，猪八戒背着两个包袱，驾风而至。八戒见了菩萨，倒身下拜说：弟子前日别了师父，至花果山水帘洞寻取包袱，果见一个假唐僧、假八戒，都被弟子打死，原是两个猴身。"
      ],
      "59": [
        "话表唐僧遵菩萨教旨，收了悟空，与八戒、沙僧剪断二心，锁猿马，同心戮力，赶奔西天。若到申酉时，国王差人上城，擂鼓吹角，混杂海沸之声。悟空听说，忍不住笑说：八戒不要乱谈。八戒说：哥呵，据你说，不是日落之处，为什么这等酷热？沙僧说：想是天时不正，秋行夏令故也。他三个正都争讲，只见那路旁边有座庄院，原来是红瓦盖的房舍，红砖砌的垣墙，红油门扇，红漆板榻，一片都是红的。唐僧下马说：悟空，你去那人家问个消息，看那炎热之故何也？悟空收了金箍棒，整肃衣裳，扭捏作个斯文气象，绰下大路，径至门前观看。悟空答礼说：老施主休怕我，我不是什么怪人。",
        "唐僧听完，起身称谢说：敢问公公：贵处遇秋，何返炎热？只见门外一个少年男子，推一辆红车儿，住在门旁边，叫声：卖糕。悟空拔根毫毛，变个铜钱，问那人买糕。那人接了钱，不论好歹，揭开车儿上衣裹，热气腾腾，拿出一块糕，递与悟空。悟空托在手中，好似火里烧的灼炭，煤炉内的红钉。你看他左手倒在右手，右手换在左手，只说：热热热，难吃难吃！那男子笑说：怕热，不要来这里，这里是这等热。那人说：若知糕粉米，敬求铁扇仙。那人说：铁扇仙有柄芭蕉扇，求得来，一扇息火，二扇生风，三扇下雨。悟空听完，急抽身走入里面，将糕递与唐僧说：师父放心，且不要隔年焦着。",
        "那老者慌张说：爷爷哑，原来是腾云驾雾的神人也。再说那悟空霎时径到翠云山，按住祥光，正自找寻洞口，只听见丁丁之声，原来是山林内一个樵夫伐木。悟空就趋步至前，又听见他说：云际依依认旧林，断崖荒草路难寻。悟空近前作礼说：樵哥，行礼问候了。那樵子撇了柯斧，答礼说：唐僧何往？悟空说：敢问樵哥，这可是翠云山？悟空说：有个铁扇仙的芭蕉洞，在哪里？樵子笑说：这芭蕉洞虽有，却无个铁扇仙，只有个铁扇公主，又名罗刹女。悟空说：人言他有一柄芭蕉扇，能熄得火焰山，敢是他么？悟空听完，大惊失色，心中暗想说：又是冤家了。",
        "那罗刹出门，高叫说：孙悟空何在？悟空上前，躬身施礼说：嫂嫂，我在此奉揖。悟空说：尊府牛魔王，当初曾与我结义，原来七兄弟之亲。罗刹说：我儿是号山枯松涧火云洞圣婴大王红孩儿。悟空满脸陪笑说：嫂嫂原来不察理，错怪了我。你令郎因是捉了师父，要蒸要煮，幸亏了观音菩萨收他去，救出我师。他如今现在菩萨处做善财童子，实受了菩萨正果，不生不灭，不垢不净，与天地同寿，日月同庚。悟空笑说：嫂嫂要见令郎，有何难处？你且把扇子借我，扇息了火，送我师父过去，我就到南海菩萨处请他来见你，就送扇子还你，有为什么不可？",
        "劈面打，照头丢，恨苦相持不罢休。那罗刹女与悟空相持到晚，见悟空棒重，却又解数周密，料斗他不过，就拿出芭蕉扇，幌一幌，一扇阴风，把悟空扇得无影无形，不要想收留得住。那悟空飘飘荡荡，左沉不能落地，右坠不得存身。我当年曾记得在这里告求灵吉菩萨降黄风怪救我师父。等我下去问灵吉菩萨一个消息，好回旧路。那门前道人认得悟空的形容，就入里面报说：前年来请菩萨去降黄风怪的那个毛脸悟空又来了。菩萨知是悟空，连忙下宝座相迎，入内施礼说：恭喜，取经来耶？悟空答说：正好未到，早哩，早哩。灵吉说：既未曾得到雷音，何以回顾荒山？",
        "悟空辞了灵吉，驾筋斗云，径返翠云山，转眼间而至。使铁棒打着洞门叫说：开门，开门！罗刹听完，心中悚惧说：这泼猴真有本事。急纵身，结束整齐，双手提剑，走出门来说：悟空，你不怕我，又来寻死？悟空笑说：嫂嫂勿得悭吝，是必借我使使，保得唐僧过山，就送还你。他两个往往来来，战经五七回合，罗刹女手软难抡，悟空身强善敌。他见事势不谐，就取扇子，望悟空扇了一扇，悟空巍然不动。悟空收了铁棒，笑吟吟的说：这番不比那番，任你怎么扇来，我若动一动，就不算汉子。悟空见他闭了门，却就弄个手段，拆开衣领，把定风丹噙在口中。",
        "只见罗刹叫说：渴了，渴了，快拿茶来。悟空见了欢喜，嘤的一翅，飞在茶沫之下。悟空已到他肚腹之内，现原身，大声说：嫂嫂，借扇子我使使。他又说：既关了门，悟空怎么在家里叫唤？悟空说：我一生不会弄术，都是些真手段，实本事，已在尊嫂尊腹之内耍子，已见其肺肝矣。悟空说：嫂嫂不许推辞，我再送你个点心填填肚子。那罗刹心痛难禁，只在地上打滚，疼得他面黄唇白，只叫：孙叔叔饶命。悟空却才收了手脚说：你才认得叔叔么？罗刹说：叔叔，有扇，有扇，你出来拿了去。罗刹就叫女童拿一柄芭蕉扇，执在旁边。悟空探到喉咙之上见了说：嫂嫂，我既饶你性命，不在腰肋之下搠个窟窿出来，还自口出。",
        "径跑至唐僧面前叫：快回去，快回去。那师父爬上马，与八戒、沙僧，复东来有二十余里，才歇下，说：悟空，怎么了呀？悟空丢下扇子说：不停当，不停当，被那个家伙哄了。八戒说：哥哥，你急急忙忙叫回去是怎么说？悟空说：我将扇子扇了一下，火光烘烘；八戒笑说：你常说雷打不伤，火烧不损，如今何又怕火？沙僧说：似这般火盛，无路通西，怎生是好？八戒说：东方、南方、北方具无火。沙僧说：有经处有火，无火处无经，诚是进退两难。师徒们正自胡谈乱讲，只听得有人叫说：悟空不须烦恼，且来吃些斋饭再议。在于西路下躬身说：我本是火焰山土地，知悟空保护圣僧，不能前进，特献一斋。"
      ],
      "60": [
        "悟空说：这山本是牛魔王放的火，假名火焰山？因悟空五百年前大闹天宫时，被显圣擒了，压赴老君，将悟空安于八卦炉内。猪八戒听完，恨说：怪道你这等打扮，原来是道士变的土地。悟空半信不信说：你且说，早寻大力王何故？若悟空寻着牛王，拜求来此，方借得真扇：一则扇息火焰，可保师父前进；悟空听完，就吩咐沙僧、八戒保护师父，又教土地陪伴勿回。水流千派似飞琼，花放一心如布锦。悟空看勾多时，步下尖峰，入深山，找寻路径。悟空闪在怪石之旁边，定睛观看，那女子怎生模样：娇娇倾国色，缓缓步移莲。",
        "那女子渐渐走近石边，悟空躬身施礼，缓缓而言说：女菩萨何往？悟空沉思说：我若说出取经求扇之事，恐这个家伙与牛王有亲。且只以假亲托意，来请魔王之言而答方可。那女子见他不语，变了颜色，怒声喝说：你是谁，敢来问我？悟空躬身陪笑说：我是翠云山来的，初到贵处，不知路径。悟空说：我是翠云山芭蕉洞铁扇公主央来请牛魔王的。那女子一听铁扇公主请牛魔王之言，心中大怒，彻耳根子通红，泼口骂说：这贱婢，着实无知。牛王自到我家，未及二载，也不知送了他多少珠翠金银、绫罗缎疋，年供柴，月供米，自自在在受用，还不识羞，又来请他怎么？",
        "这想是哪里来的妖怪，或者假绰名声，至此访我。拿了一条混铁棍，出门高叫说：是谁人在我这里无状？悟空在旁边，见他那模样，与五百年前又大不同。这悟空整衣上前，深深的唱个大喏说：长兄，还认得小弟么？牛王答礼说：你是齐天悟空孙悟空么？我闻你闹了天宫，被佛祖降压在五行山下，近解脱天灾，保护唐僧西天见佛求经，怎么在号山枯松涧火云洞把我小儿牛圣婴害了？当时令郎捉住我师，要食其肉，小弟近他不得，幸观音菩萨欲救我师，劝他归正。悟空笑说：我因拜谒长兄不见，向那女子拜问，不知就是二嫂嫂。牛王说：既如此说，我看故旧之情，饶你去罢。",
        "这悟空与那牛王斗经百十回合，不分胜负。正在难解难分之际，只听得山峰上有人叫说：牛爷爷，我大王多多拜上，幸赐早临，好安座也。牛王闻说，使混铁棍支住金箍棒，叫说：猢狲，你且住了，等我去一个朋友家赴会来者。言毕，按下云头，径至洞里，对玉面公主说：美人，才那雷公嘴的男子原来孙悟空猢狲，被我一顿棍打走了，再不敢来。他才卸了盔甲，穿一领鸦青剪绒袄子，走出门，跨上辟水金睛兽，着小妖们看守门庭，半云半雾，一直向西北方而去。悟空在高峰上看着，心中暗想说：这老牛不知又结识了什么朋友，往哪里去赴会。好悟空，将身幌一幌，变作一阵清风追上，随着同走。",
        "悟空爬进去，仔细看时，只见那那边一派音乐之声。那上面坐的是牛魔王，左右有三四个蛟精，前面坐着一个老龙精，两边原来龙子、龙孙、龙婆、龙女。正在哪里觥筹交错之际，孙悟空一直走将上去，被老龙看见，就命：拿下那个野蟹来。龙子、龙孙一拥上前，把悟空抓住。好悟空，假捏虚言，对众供说：生自湖中为活，旁边崖作窟权居。座上众精听完，都拱身对老龙作礼说：蟹介士初入瑶宫，不知王礼，望尊公饶他去罢。众精就吩咐：放了那个家伙，且记打，外面伺候。悟空应了一声，往外逃命，径至牌楼之下。心中暗想说：这牛王在此贪杯，哪里等得他散？",
        "过了一会儿叙及寒温，牛王说：夫人久阔。悟空笑说：非敢抛撇，只因玉面公主招后，家事繁冗，朋友多顾，是以稽留在外，却也又治得一个家当了。又说：近闻悟空那个家伙保唐僧，将近火焰山界，恐他来问你借扇子。我恨那个家伙害子之仇未报，但来时，可差人报我，等我拿他，分尸万段，以雪我夫妻之恨。罗刹听完，滴泪告说：大王，常言说：男儿无妇财无主，女子无夫身无主。悟空听得，故意发怒，骂说：那泼猴几时过去了？悟空说：是五百年前曾拜为七弟兄。罗刹说：被我骂也不敢回言，砍也不敢动手。于是擎杯奉上说：大王，燕尔新婚，千万不要忘结发，且吃一杯乡中之水。",
        "男儿立节放襟怀，女子忘情开笑口。悟空见他这等酣然，暗自留心，挑斗说：夫人，真扇子你收在哪里？早晚仔细，但恐悟空变化多端，却又来骗去。罗刹笑嘻嘻的，口中吐出，只有一个杏叶儿大小，递与悟空说：这个不是宝贝？悟空接在手中，却又不信，暗想着：这些一些，怎生扇得火灭？罗刹见他看着宝贝沉思，忍不住上前，将粉面揾在悟空脸上，叫说：亲亲，你收了宝贝吃酒罢，只管出神想什么哩？悟空就趁脚儿跷，问他一句说：这般小小之物，怎么扇得八百里火焰？罗刹酒陶真性，无忌惮，就说出方法说：大王，与你别了二载，你想是昼夜贪欢，被那玉面公主弄伤了神思，怎么自家的宝贝事情，也都忘了？",
        "原来悟空只讨了个长的方法，没有讨他个小的口诀，左右只是那等长短。老龙王聚众精问：是谁偷放牛爷的金睛兽也？老龙说：家乐儿断乎不敢，可曾有甚生人进来？龙子、龙孙说：适才安座之时，有个蟹精到此，那个就是生人。牛王闻说，顿然省悟说：不消讲了。早间贤友着人邀我时，有个孙悟空保唐僧取经，路遇火焰山难过，曾问我求借芭蕉扇。那猴子千般伶俐，万样机关，断乎是那个家伙变作蟹精，来此打探消息，偷了我兽，去山妻处骗了那一把芭蕉扇儿也。众精见说，一个个胆战心惊，问：可是那大闹天宫的孙悟空么？列公若在西天路上，有不是处，切要躲避他一些。"
      ],
      "61": [
        "好魔王，他也有七十二变，武艺也与悟空一般，只是身子狼犺些。抄下路，当面迎着悟空，叫说：师兄，我来也。见是个八戒的模样，就就叫说：兄弟，你往哪里去？牛魔王绰着经儿说：师父见你许久不回，恐牛魔王手段大，你斗他不过，难得他的宝贝，让我来迎你的。悟空笑说：不必费心，我已得了手了。悟空说：那老牛与我战经百十合，不分胜负。是我暗跟他去，变作个螃蟹，偷了他所骑的辟水金睛兽，变了老牛的模样，径至芭蕉洞哄那罗刹女。那女子与我结了一场干夫妻，是我设法骗将来的。孙悟空那知真假，也虑不及此，于是将扇子递与他。",
        "那个说：你哄人妻女真该死，告到官司有罪殃。棒打剑迎齐努力，有些松慢见阎王。却表唐僧坐在途中，一则火气蒸人，二来心焦口渴，对火焰山土地说：敢问尊神，那牛魔王法力怎么？唐僧说：悟空是个会走路的，往常家二千里路，一霎时就回，怎么如今去了一日？叫：悟能、沙僧，你两个，那一个去迎你师兄一迎？八戒说：今日天晚，我想着要去接他，但只是不认得积雷山路。土地说：小神认得，且教卷帘将军与你师父做伴，我与你去来。唐僧大喜说：有劳尊神，功成再谢。那八戒抖搜精神，束一束皂锦直裰，搴着钯，就与土地纵起云雾，直接回到东方而去。",
        "只见守门小妖来报：是我家爷爷与昨日那雷公嘴汉子，并一个长嘴大耳的和尚，同火焰山土地等众厮杀哩。悟空说：这个家伙骁勇，自昨日申时前后与我战起，直到今夜，未定输赢。八戒说：哥哥，你昨日巳时离了师父，怎么到申时才与他斗起？悟空说：别你后，转眼间就到这座山上，见一个女子，行礼问候，原来就是他爱妾玉面公主。被我使铁棒吓他一吓，他就跑进洞，叫出那牛王来。是我跟他到那乱石山碧波潭底，变作一个螃蟹，探了消息，偷了他辟水金睛兽，假变牛王模样，复至翠云山芭蕉洞，骗了罗刹女，哄得他扇子。正掮了走处，被他假变做你的嘴脸，返骗了去。",
        "我们正要与他：赌输赢，弄手段，等我施为地煞变。自到西方无对头，牛王本是心猿变。趁清凉，息火焰，打破顽空参佛面。殷勤说：是是是，去去去，管甚牛王会不会。他两个领着土地、阴兵一齐上前，使钉钯，抡铁棒，乒乒乓乓，把一座摩云洞的前门打得粉碎。吓得那外护头目战战兢兢，闯入里边报说：大王，孙悟空率众打破前门也。那牛王正与玉面公主备言其事，懊恨悟空哩。听说打破前门，十分发怒，急披挂，拿了铁棍，从里边骂出来说：泼猢狲！你是多大个人儿，敢这等上门撒泼，打破我门扇？牛王喝说：你这个囔糟食的夯货不见怎么，快叫那猴儿上来。",
        "八戒发起呆性，仗着悟空神通，举钯乱筑。却被土地、阴兵拦住洞门，喝说：大力王，哪里走？又见八戒、悟空赶来，慌忙卸了盔甲，丢了铁棍，摇身一变，变做一只天鹅，望空飞走。悟空看见，笑说：八戒，老牛去了。那八戒漠然不知，土地亦不能晓，一个个东张西觑，只在积雷山前后乱找。悟空说：你两个打进此门，把群妖尽情剿除，拆了他的窝巢，绝了他的归路。那八戒与土地，依言攻破洞门暂且不说。飕的一翅，钻在云眼里，倒飞下来，落在天鹅身上，抱住颈项嗛眼。那牛王也知是悟空变化，急忙抖抖翅，变作一只黄鹰，返来嗛海东青。悟空又变作一个乌凤，专一赶黄鹰。",
        "正都上门攻打，忽听得八戒与土地、阴兵嚷嚷而至。悟空见了，问：那摩云洞事体怎么？八戒笑说：那老牛的娘子，被我一钯筑死，剥开衣看，原来是个玉面狸精。他变做无大不大的白牛，我变了法天象地的身量。八戒发狠说：既是这般，怎么不打进去，剿除那个家伙，问他要扇子，倒让他停留长智，两口儿叙情？好八戒，抖搜威风，举钯照门一筑，忽辣的一声，将那石崖连门筑倒了一边。慌忙那女童忙报：爷爷，不知甚人把前门都打坏了。牛王方跑进去，喘嘘嘘的，正告诉罗刹女与悟空夺扇子赌斗之事。罗刹女接扇在手，满眼垂泪说：大王，把这扇子送与那猢狲，让他退兵去罢。",
        "却好有托塔李天王并哪咤太子，领鱼肚药叉、巨灵神将，幔住空中，叫说：慢来，慢来。牛王急了，依前摇身一变，还变做一只大白牛，使两只铁角去触天王。哪咤太子大声说：悟空，衣甲在身，不能为礼。愚父子昨日见佛如来发檄奏闻玉帝，言唐僧路阻火焰山，孙悟空难伏牛魔王，玉帝传旨，特差我父王领众助力。悟空说：这个家伙神通不小，又变作这等身躯，却怎奈何？太子笑说：悟空勿疑，你看我擒他。变得三头六臂，飞身跳在牛王背上，使斩妖剑望颈项上一挥，不觉得把个牛头斩下。哪咤拿出火轮儿挂在那老牛的角上，就吹真火，焰焰烘烘，把牛王烧得张狂哮吼，摇头摆尾。",
        "四大金刚说：圣僧喜了，十分功行将完。悟空说：那罗刹，你不走路，还站在此等甚？罗刹跪说：还请悟空垂慈，将扇子还了我罢。我们拿过山去，不会卖钱买点心吃？罗刹再拜说：悟空原说扇息了火还我，今此一场，诚悔之晚矣。土地说：悟空，趁此女深知息火之法，断绝火根，还他扇子，小神居此苟安，拯救这方生民，求些血食，诚为恩就。悟空说：我当时问着乡人说：这山扇息火，只收得一年五谷，就又火发。罗刹说：要是断绝火根，只消连扇四十九扇，永远再不发了。悟空听完，执扇子，使尽筋力，望山头连扇四十九扇，那山上大雨淙淙。又说：我若不与你，恐人说我言而无信。"
      ],
      "62": [
        "这一篇词，牌名《临江仙》，单道唐僧师徒师徒四人水火既济，本性清凉。唐僧勒住马，叫徒弟：悟空，你看那厢楼阁峥嵘，是个什么地方？悟空说：师父，那座城池是一国帝王之所。八戒笑说：天下府有府城，县有县城，怎么就见是帝王之所？悟空说：你不知帝王之居，与府县自是不同。沙僧说：哥哥眼明，虽识得是帝王之处，却唤做什么名色？悟空说：又无牌匾旌号，何以知之？叫：悟空，你上过去问他一声，为什么这等遭罪？悟空依言，就叫：那和尚，你是那寺里的？和尚们跪倒说：爷爷，我们是金光寺负屈的和尚。悟空将他带在唐僧前，问：怎生负屈，你说我听。",
        "和尚们们顶着枷锁，将正殿推开，请唐僧上殿拜佛。却转于后面，见那方丈檐柱上又锁着六七个小和尚，唐僧甚不忍见。及到方丈，和尚们具来磕头，问：大家老爷像貌不一，可是东土大唐来的么？悟空笑说：这和尚有甚未卜先知之法？和尚们说：爷爷，我们有甚未卜先知之法？想是惊动天神，昨日夜间，各人都得一梦：说有个东土大唐来的圣僧，救得我们性命，庶此冤苦可伸。唐僧听完，大喜说：你这里是何地方？唐僧说：既拜为上邦，想是你这国王有道，文武贤良。和尚们说：爷爷，文也不贤，武也不良，国君也不是有道。众公卿奏上国王，不知天公甚事见责。",
        "和尚们说：爷爷，我们凡人，怎知天意？唐僧说：我欲面君倒换关文，奈何这和尚们之事不得明白，难以对君奏言。你与我办一把新笤帚，待我沐浴了，上去扫扫，就看这污秽之事何如，不放光之故何如，访着端的，方好面君奏言，解救他们这苦难也。这些枷锁的和尚听说，连忙去厨房取把厨刀，递与八戒说：爷爷，你将此刀打开那柱子上锁的小和尚铁锁，放他去安排斋饭香汤，伏侍老爷进斋沐浴。悟空真个近前，使个解锁法，用手一抹，几把锁具退落下。只见那枷锁的和尚拿了两把笤帚进来，唐僧甚喜。唐僧沐浴毕，穿了小袖褊衫，束了环绦，足下换一双软公鞋，手里拿一把新笤帚，对和尚们说：你们安寝，待我扫塔去来。",
        "又扫了三层，腰酸腿痛，就于十层上坐倒说：悟空，你替我把那三层扫净下来罢。悟空抖擞精神，登上第十一层，霎时又上到第十二层。悟空使个神通，丢了笤帚，抽出出金箍棒，拦住塔门，喝说：好怪物，偷塔上宝贝的原来是你。两个怪物慌了，急起身，拿壶拿碗乱掼。被悟空横铁棒拦住说：我若打死你，没人供状。那妖怪贴在壁上，不要想挣扎得动。悟空使个拿法，一只手抓将过来，径拿下第十层塔中，报说：师父，抓住个偷宝贝之贼了。唐僧正自盹睡，忽闻此言，又惊又喜说：是哪里拿来的？悟空把怪物揪到面前跪下说：他在塔顶上猜拳吃酒耍子，是我听得喧哗，一纵云，跳到顶上拦住。",
        "悟空听完，嘻嘻冷笑说：那孽畜等这等无礼，怪道前日请牛魔王在哪里赴会，原来他结交这伙泼魔，专干不良之事。说未了，只见八戒与两三个小和尚自塔下提着两个灯笼，走上来说：师父，扫了塔不去睡觉，在这里讲什么哩？悟空说：才然供了口词，一个叫做奔波儿灞，一个叫做灞波儿奔；八戒抽出钯就打，说：既是妖精，取了口词，不打死待何待？悟空说：你不知，且留着活的，好去见皇帝讲话，又好做凿眼去寻贼追宝。好八戒，真个收了钯，一家一个，都抓下塔来。八戒说：正要你鱼、黑鱼做些鲜汤，与那负冤屈的和尚吃哩。两三个小和尚喜喜欢欢，提着灯笼，引唐僧下了塔。",
        "那国王听完大喜，传旨教宣唐朝圣僧上金銮殿，安绣墩赐坐。唐僧独自上殿，先将关文捧上，然后谢恩敢坐。那国王将关文看了一遍，心中喜悦说：似你大唐王有疾，能选高僧，不避路途遥远，拜佛取经；国王说：我这国，原来是西域上邦，常有四夷朝贡，皆因国内有个金光寺，寺内有座黄金宝塔，塔上有光彩冲天。唐僧合掌笑说：万岁，差之毫厘，失之千里矣。问及何罪，他道是金光寺负冤屈者。那国王急降金牌：着锦衣卫快到金光寺取妖贼来，我亲审。唐僧又奏说：万岁，虽有锦衣卫，还得小徒去方可。唐僧用手指说：那玉阶旁立者就是。国王见了，大惊说：圣僧如此丰姿，高徒怎么这等像貌？",
        "八戒说：你打着黄伞，抬着八人轿，却不是猴王之职分？悟空说：你只在此看守行李、 马匹。那枷锁之僧说：爷爷们都去承受皇恩，等我们在此看守。悟空说：既如此，等我去奏过国王，却来放你。八戒揪着一个妖贼，沙僧揪着一个妖贼，孙悟空依旧坐了轿，摆开头搭，将两个妖怪押赴当朝。过了一会儿，至白玉阶对国王说：那妖贼已取来了。国王下降龙床，与唐僧及文武多官，同目视之。那妖怪一个是暴腮乌甲，尖嘴利牙；虽然是有足能行，大抵是变成的人像。国王问：你是何方贼怪，那处妖精？供说：三载之外，七月初一，有个万圣龙王，帅领许多亲戚，住居在本国东南，离这里路有百十。",
        "国王又留住说：这一席聊表圣僧获怪之功。唐僧说：既要捕贼取宝，不劳再宴。贫僧等就此辞王，就擒捉妖怪去也。国王不肯，一定请到建章宫，又吃了一席。国王举酒说：那位圣僧帅众出师，降妖捕怪？国王说：孙唐僧既去，用多少人马？八戒忍不住高声叫说：哪里用什么人马？悟空说：既如此，着沙僧弟保护师父，我两个去来。那国王说：二位唐僧既不用人马，可用兵器？八戒笑说：你家的兵器，我们用不得，我弟兄自有随身器械。国王闻说，就取大觥来，与二位唐僧送行。孙悟空说：酒不吃了，只教锦衣卫把两个小妖拿来，我们带了他去做凿眼。"
      ],
      "63": [
        "愚弟兄若干别事无能，若说擒妖缚怪、拿贼捕亡、伏虎降龙、踢天弄井，以至搅海翻江之类，略通一二。国王闻说，愈十分加敬，请唐僧上坐，口口称为老佛，将沙僧等皆称为菩萨。再说孙悟空与八戒驾着狂风，把两个小妖摄到乱石山碧波潭，住定云头。变作一把戒刀，将一个黑鱼怪割了耳朵，鱼精割了下唇，撇在水里，喝说：快早去对那万圣龙王报知，说我齐天悟空孙爷爷在此，着他就送祭赛国金光寺塔上的原宝出来，免他一家性命；吓得那些鼋鼍龟鳖，虾蟹鱼精，都来围住问：你两个为什么拖绳带索？都嚷嚷闹闹，径上龙王宫殿：报大王，祸事了。",
        "好妖怪，急纵身披挂了，使一般兵器，叫做月牙铲，步出宫，分开水道，在水面上叫说：是什么齐天悟空？悟空与八戒站在岸边，观看那妖精怎生打扮：戴一顶烂银盔，光欺白雪；一声吆喝长空振，似鹤飞鸣贯九宸。他见无人对答，又叫一声：那个是齐天悟空？国，与那国王守塔，却大胆获我头目，又敢行凶，上我宝山索战？说：你这贼怪，原来不识你孙爷爷哩。那驸马听完，微微冷笑说：你原来是取经的和尚，没要紧罗织管事。我虽不受国王的恩惠，不食他的水米，不该与他出力；但是你偷他的宝贝，污他的宝塔，屡年屈苦金光寺僧人，他是我一门同气，我怎么不与他出力，辨明冤枉？",
        "原来那妖怪九个头，转转都是眼睛，看得明白。见八戒在背后来时，就使铲鐏架着钉钯，铲头抵着铁棒。又耐战五七合，挡不得前后齐抡，他却打个滚，腾空跳起，现了本像，原来是一个九头虫。展开翅极善飞扬，纵大鹏无他力气；猪八戒看见心惊说：哥呵，我自为人，也没有见这等个恶物。好悟空，急纵祥云，跳在空中，使铁棒照头就打。那妖怪物大显身，展翅斜飞，飕的打个转身，掠到山前，半腰里又伸出一个头来，张开口如血盆相似，把八戒一口咬着鬃，半拖半扯，捉下碧波潭水内而去。及至龙宫外，还变作前番模样，将八戒掷之于地，叫：小妖们何在？",
        "且等我变化了进去，看那妖怪把八戒怎生摆布。好悟空，捻着诀，摇身一变，还变做一个螃蟹，淬于水内，径至牌楼之前。直至那宫阙之下，横爬过去，又见那老龙王与九头虫合家儿欢喜饮酒。悟空不敢相近，爬过东廊之下，见几个虾精蟹精纷纷纭纭耍子。悟空听了一会言谈，却就学语学话，问：驸马爷爷拿来的那长嘴和尚，这会死了没有？众精说：没有死，缚在那西廊下哼的不是？悟空听说，又轻轻的爬过西廊，真个那八戒绑在柱上哼哩。八戒听得声音，知是悟空，说：哥哥，怎么了？悟空四顾无人，将拑咬断索子叫走。那八戒脱了手说：哥哥，我的兵器被他收了，又奈何？",
        "这场不干我事，是你请我来家打的。那妖怪那肯容情，咬定牙齿，与八戒交锋。再说悟空立于潭岸等候，忽见他们追赶八戒，出离水中，就半踏云雾，抽出铁棒，喝声：休走！悟空与八戒且不追袭，回上岸，备言前事。八戒说：这个家伙锐气挫了，被我那一路钯打进去时，打得落花流水，魂散魄飞。正与那驸马厮斗，却被老龙王赶着，却亏了你打死。悟空说：管什么天晚，乘此机会，你还下去攻战。悟空催逼说：兄弟不必多疑，还像刚才引出来，等我打他。悟空仔细观看，原来二郎显圣，领梅山六兄弟，架着鹰犬，挑着狐兔，抬着獐鹿，一个个腰挎弯弓，手持利刃，纵风雾踊跃而来。",
        "悟空上前，对众作礼，于是同上山。今因路遇祭赛国，答救僧灾，在此擒妖索宝。二郎笑说：我因闲暇无事，同众兄弟采猎而回。幸蒙悟空不弃留会，足感故旧之情。二郎惊讶说：万圣老龙却不生事，怎么敢偷塔宝？悟空说：他近日招了一个驸马，原来是九头虫成精。那国王不解其意，苦拿着僧人拷打。那国王就请我师收降，师命我们到此。先一场战，被九头虫腰里伸出一个头来，把八戒啣了去。才然大战一场，是我把老龙打死，那个家伙们收尸挂孝去了。二郎说：既伤了老龙，正好与他攻击，使那个家伙不能措手，却不连窝巢都灭绝了？孙二哥也是贵客，猪刚鬣又归了正果，我们营内有随带的酒肴，教小妖们取火，就此铺设：一则与二位贺喜，二来也当叙情。",
        "那宫主急忙难识真假，就于后殿里拿出一个浑金匣子来，递与悟空说：这是佛宝。又拿出一个白玉匣子，也递与悟空说：这是九叶灵芝。你拿这宝贝藏去，等我与猪八戒斗上两三合，挡住他。悟空将两个匣儿收在身边，把脸一抹，现了本像说：宫主，你看我可是驸马么？还有一个老龙婆彻身就走，被八戒扯住，举钯才筑，悟空说：且住，不要打死他，留个活的，好去国内见功。悟空随后捧着两个匣子上岸，对二郎说：感兄长威力，得了宝贝，扫净妖贼也。二郎说：一则是那国王洪福齐天，二则是贤昆玉神通无量，我何功之有？兄弟们一起说：孙二哥既已功成，我们就此告别。",
        "唐僧又问悟空说：你们昨日离国，怎么今日才来？悟空把那战驸马，打龙王，逢真君，败妖精，及变作诈宝贝之事，细说了一遍。唐僧与国王、大小文武，具喜之非常。八戒说：原来是龙王之妻，生了许多龙子、龙孙，岂不知人言？国王说：既知人言，快早说前后做贼之事。龙婆说：偷佛宝，我全不知，都是我那夫君龙鬼与那驸马九头虫，知你塔上之光原来是佛家舍利子，三年前下了血雨，乘机盗去。龙婆说：只是小女万圣宫主私入大罗天上灵霄殿前，偷的王母娘娘九叶灵芝草。那国王就忙排驾，于是同唐僧携手出朝，并文武多官，随至金光寺。悟空上塔，将舍利子安在第十三层塔顶宝瓶中间，把龙婆锁在塔心柱上。"
      ],
      "64": [
        "悟空见都不肯回去，于是弄个手段，把毫毛拔了三四十根，吹口仙气，叫：变！悟空才引师父策马而去，少时间去得远了。和尚们人放声大哭，都喊：有恩有义的老爷！唐僧勒马观看，那岭上荆棘丫叉，薜萝牵绕，虽是有道路的痕迹，左右却都是荆刺棘针。又说：徒弟呵，路痕在下，荆棘在上，只除是蛇虫伏地而游，方可去了；八戒说：不打紧，等我使出钯柴手来，把钉钯分开荆棘，不要说骑马，就抬轿也包你过去。唐僧说：你虽有力，长远难熬，却不知有多少远近，怎生费得这许多精神？将身一纵，跳在半空看时，一望无际。悟空看勾多时，将云头按下说：师父，这地方远哩。悟空说：一望无际，似有千里之遥。",
        "沙僧笑说：师父不要愁，我们也学烧荒的，放上一把火，烧绝了荆棘过去。好八戒，捻个诀，念个咒语，把腰躬一躬，叫：长！八戒见了，笑说：等我八戒与他添上两句：自今八戒能开破，直透西方路尽平。唐僧欣然下马说：徒弟呵，累了你也。八戒说：师父不要住，趁此天色晴明，我们有兴，连夜搂开路走他娘。悟空看了说：此地少吉多凶，不宜久坐。跪下说：悟空，小神原来荆棘岭土地。知悟空到此，无以接待，特备蒸饼一盘，奉上老师父，各请一餐。不知悟空端详已久，喝一声：且住，这个家伙不是好人。那老者见他打来，将身一转，化作一阵阴风，呼的一声，把个唐僧摄将起去，飘飘荡荡，不知摄去何所。",
        "唐僧正自点看，渐觉月明星朗，只听得人语相谈。唐僧抬头观看，原来是三个老者：前一个霜姿丰采，第二个绿鬓婆娑，第三个虚心黛色。各各面貌、衣服具不相同，都来与唐僧作礼。唐僧还了礼，说：弟子有何德行，敢劳大家仙翁下爱？十八公说：霜姿者号孤直公，绿鬓者号凌空子，虚心者号拂云叟，老拙号说：劲节。孤直公说：我岁今经千岁古，撑天叶茂四时春。唐僧称谢说：四位仙翁，具享高寿，但劲节翁又千岁余矣。四老具称说：圣僧自出娘胎，就从佛教，果然是从小修行，真中正有道之上僧也。",
        "唐僧听完，慨然不惧，就对众言说：禅者，静也；一个个稽首皈依，躬身拜谢说：圣僧原来禅机之悟本也。拂云叟说：禅虽静，法虽度，须要性定心诚。唐僧云：道原来非常，体用合一，如为什么不同？拂云叟笑云：我们生来坚实，体用比尔不同。十八公用手搀扶，孤直公将身扯起，凌空子打个哈哈说：拂云之言，分明漏泄。拂云叟笑指石屋说：若要吟哦，且入小庵一茶，何如？那四老一齐享用，唐僧却才吃了两块。",
        "唐僧留心偷看，只见哪里玲珑光彩，如月下一般：水自石边流出，香从花里飘来。唐僧说：弟子一时失口，胡谈几字，诚所谓班门弄斧。劲节老说：圣僧不必闲叙，出家人全始全终，既有起句，何无结句？唐僧说：弟子不能，烦十八公结而成篇为妙。劲节说：你好心肠，你起的句，如为什么不肯结果？唐僧只得续后二句云：半枕松风茶未熟，吟怀潇洒满腔春。孤直公说：劲节，你深知诗味，所以只管咀嚼。十八公亦慨然不辞说：我却是顶针字起：春不荣华冬不枯，云来雾往只如无。唐僧听了，赞叹不已说：真是阳春白雪，浩气冲霄，弟子不才，敢再起两句。",
        "孤直公说：此诗起句豪雄，联句有力，但结句自谦太过矣。凌空子笑而言说：好诗，好诗，真个是月胁天心。唐僧说：众仙老之诗，真个是吐凤喷珠，游夏不要赞。我们也是千载奇逢，况天光晴爽，虽夜深却月明如昼，再宽坐坐，待天晓自当远送过岭，高徒一定可相会也。那仙女捻着一枝杏花，笑吟吟进门相见。那女子对众道了万福，说：知有佳客在此赓酬，特来相访，敢求一见。十八公指着唐僧说：佳客在此，何劳求见？",
        "茶毕，欠身问：仙翁今宵盛乐，佳句请教一二怎么？拂云叟说：我们皆鄙俚之言，惟圣僧真盛唐之作，甚可嘉羡。四老就以唐僧前诗后诗并禅法论，宣了一遍。那女子满面春风，对众说：妾身不才，不当献丑。于是朗吟说：上盖留名汉武王，周时孔子立坛扬。四老闻诗，人人称贺，都说：清雅脱尘，句内包含春意。十八公说：杏仙尽有仰高之情，圣僧岂可无俯就之意？孤直公说：圣僧原来有道有名之士，决不苟且行事。唐僧听言，于是变了颜色，跳起来高叫说：你们皆是一类怪物，这般诱我。四老见唐僧发怒，一个个咬指担惊，再不复言。那赤身鬼使暴躁如雷说：这和尚好不识抬举。",
        "原来那孙悟空与八戒、沙僧牵着马，挑着担，一夜没有住脚，穿荆度棘，东寻西找。却好半云半雾的过了八百里荆棘岭西下，听得唐僧吆喝，却就喊了一声。那唐僧挣出门来，叫声：悟空，我在这里哩。过了一会儿，八戒、沙僧具到边前说：师父，你怎么得到此也？唐僧扯住悟空说：徒弟呵，多累了你们了。昨日晚间见的那个老者，言说土地送斋一事，是你喝声要打，他就把我抬到此方。我与他赓和相攀，觉有夜半时候，又见一个美貌女子执灯火，也来这里会我，吟了一首诗，称我做佳客。悟空说：你既与他叙话谈诗，就没有问他个名字？唐僧说：我曾问他之号：那老者唤做十八公，号劲节；"
      ],
      "65": [
        "话表唐僧一念虔诚，且休言天神保护，似这草木之灵，尚来引送，雅会一宵，脱出荆棘针刺，再无萝蓏攀缠。唐僧扬鞭指说：悟空，那座山也不知有多少高，可就似接着青天，透冲碧汉。悟空说：古诗不云：只有天在上，更无山与齐。八戒说：若不接天，怎么把昆仑山号为天柱？沙僧笑说：大哥把这好话儿不要与他说，他听了去，又降别人。悟空神通广大，你看他一条金箍棒，哮吼一声，吓过了狼虫虎豹，剖开路，引师父直上高山。",
        "悟空抬头，用手搭凉篷，仔细观看，那那边好个所在。悟空看完，回复说：师父，那地方就是座寺院，却不知禅光瑞蔼之中，又有些凶气何也。唐僧说：既有雷音之景，不要不就是灵山？八戒说：纵然不是，也必有个好人居住。沙僧说：不必多疑，此条路未免从那门首过，是不是一见可知也。那唐僧策马加鞭，至山门前，见雷音寺三个大字，慌忙滚下马来，倒在地下，口里骂说：泼猢狲！悟空陪笑说：师父不要恼，你再看看。唐僧战兢兢的爬起来再看，真个是四个字，原来小雷音寺。唐僧说：就是小雷音寺，必定也有个佛祖在内。悟空说：不可进去，这里少吉多凶。唐僧说：就是无佛，也必有个佛像。",
        "只听得山门里有人叫说：唐僧，你自东土来拜见我佛，怎么还这等怠慢？殿门外宝台之下，摆列着五百罗汉、三千揭谛、四金刚、八菩萨、比丘尼、优婆塞，无数的圣僧、道者。慌忙那唐僧与八戒、沙僧一步一拜，拜上灵台之间。又听见莲台座上大声说：那孙悟空，见如来怎么不拜？不知悟空又仔细观看，见得是假，于是丢了马匹、行囊，抽出棒在手，喝说：你这伙孽畜，十分胆大，怎么假倚佛名，败坏如来清德？只听得半空中叮当一声，撇下一副金铙，把悟空连头带足，合在金铙之内。慌忙个猪八戒、沙僧连忙使起钯杖，就被些阿罗、揭谛、圣僧、道者一拥近前围绕，他两个措手不及，尽被拿了。",
        "不待宣召，直上灵霄宝殿之下，见玉帝，俯伏启奏说：陛下，臣原来五方揭谛使。今有齐天悟空保唐僧取经，路遇一山，名小雷音寺。唐僧错认灵山进拜，原来是妖魔假设，困陷他师徒，将悟空合在一副金铙之内，进退无门，看看至死，特来启奏。那些大小妖精，因获了唐僧，老妖具犒赏了，各去睡觉。众星宿更不惊张，都到铙钹之外，报说：悟空，我们是玉帝差来二十八宿，到此救你。悟空听说大喜，就吩咐：动兵器打破，我就出来了。此物原来浑金之宝，打着必响，响时惊动妖魔，却难救拔。那悟空在里边东张张，西望望，爬过来，滚过去，不要想看见一些光亮。",
        "悟空摸着他的角，叫说：不济事，上下没有一毫松处。好悟空，就将金箍棒变作一把钢钻儿，将他那角尖上钻了一个孔窍，把身子变得似个芥菜子儿，拱在那钻眼里蹲着，叫：扯出角去，扯出角去。悟空却自他角尖钻眼里钻出，现了原身，抽出出铁棒，照铙钹当的一声打去，就如崩倒铜山，咋开金矿。可惜把个佛门之器，打做个千百块散碎之金。一拥赶到宝台之下，只见悟空与列宿围在碎破金铙之外，大惊失色。悟空听说，就携星众，驾云跳在九霄空里。妖王怀恨，没奈何披挂了，使一根短软狼牙棒，出营高叫：悟空，好男子不可远走高飞，快向前与我交战三合。",
        "如若不能，将你们打死，等我去见如来取经，果正中华也。悟空笑说：妖精，不必海口，既要赌，快上来领棒。都有随心变化功，今番相遇争强壮。猴与魔，齐打仗，这场真个无虚诳。那一个当头手起不放松，这一个架丢劈面难推让。棒来棒去两相迎，忘生忘死因唐僧。那山门口鸣锣擂鼓，妖怪们精呐喊摇旗。这那边有二十八宿天兵共五方揭谛众圣，各掮器械，吆喝一声，把那魔头围在中间，吓得那山门外群妖难擂鼓，战兢兢手软不敲锣。一只手去腰间解下一条旧白布搭包儿，往上一抛，滑的一声响亮，把孙悟空、二十八宿与五方揭谛，一搭包儿通装将去，挎在肩上，拽步回身。",
        "唐僧认得声音，叫说：你为什么到此？悟空才动手，先解了师父，放了八戒、沙僧。既救了你师父就勾了，又还寻甚行李？八戒说：哥哥，你去找寻，我们先去路上等你。他半飞半跳，近于窗前看时，却是包袱放光。那妖精把唐僧的袈裟脱了，没有折，就乱乱的揌在包袱之内。他见了此衣钵，心中一喜，就现了本像，拿将过来，也不管担绳偏正，抬上肩，往下就走。有这般事：可可的老妖精在楼下睡觉，一声响，把他惊醒，跳起来，乱叫说：有人了，有人了！悟空听言，恐又遭他罗网，挑不成包袱，纵筋斗，就跳出楼窗外走了。那妖精前前后后寻不着唐僧等，又见天色将明，取了棒，帅众来赶，只见那二十八宿与五方揭谛等神云雾腾腾，屯住山坡之下。",
        "那那边摇旗呐喊，这那边擂鼓筛锣。苦掤苦拽来相战，皆因唐僧拜弥陀。正在那不分胜败之际，只听见悟空叱一声说：我来了。悟空说：我的性命几乎难免，却就说什么行李！沙僧执着宝杖说：且休叙话，快去打妖精也。那星宿、揭谛、丁甲等神，被群妖围在垓心浑杀，老妖使棒来打他三个。这悟空、八戒、沙僧丢开棍杖，抡着钉钯抵住。那妖见天晚，打个哨子，教群妖各各留心，他却拿出宝贝。悟空看得分明：那妖怪解下搭包，拿在手中。他就顾不得八戒、沙僧、诸天等众，一路筋斗，跳上九霄空里。神仙们、八戒、沙僧不解其意，被他抛起去，又都装在里面，只是悟空走了。"
      ],
      "66": [
        "话表孙悟空无计可施，纵一朵祥云，驾筋斗，径转南赡部洲去拜武当山，参请荡魔天尊，解释唐僧、八戒、沙僧、天兵等众之灾。他在半空里无停止，不一日，早望见祖师仙境，轻轻按落云头，定睛观看，好地方：巨镇东南，中天神岳。孙悟空玩着仙境景致，早来到一天门、二天门、三天门。悟空说：我原来齐天悟空孙悟空，要见师相。悟空说：保唐僧西天取经，路遭险难。幸得亢金龙将角透入铙内，将我度出，被我打碎金铙，惊醒怪物。是我当夜脱逃，救了星辰等众与我唐僧等。后为找寻衣钵，又惊醒那妖怪，与天兵赶战。那妖怪又拿出搭包儿，理弄之时，我却知道前音，于是走了。",
        "祖师说：我当年威镇北方，统摄真武之位，剪伐天下妖邪，原来奉玉帝敕旨。后又披发跣足，踏腾蛇神龟，领五雷神将、巨虬狮子、猛兽毒龙，收降东北方黑气妖氛，原来奉元始天尊符召。我今着龟、蛇二将并五大神龙与你助力，管教擒妖精，救你师之难。悟空拜谢了祖师，就同龟、蛇、龙神各带精锐之兵，复转西洲之界。再说那黄眉大王聚众怪在宝阁下说：悟空这两日不来，又不知往何方去借兵也。说不了，只见前门上小妖报说：悟空引几个龙、蛇、龟相，在门外叫战。妖魔说：这猴儿怎么得个龙、蛇、龟相？五龙、二将相貌峥嵘，精神抖搜，喝说：那泼怪！",
        "悟空帅五龙、二将，与妖魔战经半个时辰，那妖精就解下搭包在手。孙悟空顾不得五龙、二将，驾筋斗，跳在九霄逃脱。你看那悟空落下云头，斜欹在山巅之上，没精没采，懊恨说：这怪物十分利害。猛听得有人叫说：悟空，休推睡，快早上紧求救，你师父性命只在过了一会儿矣。悟空急睁睛跳起来看，原来是日值功曹。悟空喝说：你这毛神，一向在那方贪图血食，不来点卯，今日却来惊我。功曹慌忙施礼说：悟空，你是人间之喜仙，何闷之有？我们早奉菩萨旨令，让我们暗中护佑唐僧，原来同土地等神，不敢暂离左右，是以不得常来参见，怎么反见责也？",
        "才拿去者，原来真武师相之龟、蛇、五龙圣众。功曹笑说：悟空宽怀，小神想起一处精兵，请来一定可降。适才悟空至武当，是南赡部洲之地。哪里有个悟空国师王菩萨，神通广大；你今亲去请他，他来施恩相助，准可捉怪救师也。悟空心喜说：你且去保护我师父，勿令伤他，待我去请也。悟空纵起筋斗云，躲离怪处，直奔盱眙山，不一日早到。那国师王菩萨早已知之，就与小张太子出门迎迓。相见叙礼毕，悟空说：我保唐僧西天取经，路上有个小雷音寺，哪里有个黄眉怪，假充佛祖。我师父不辨真伪，就下拜，被他拿了。又将金铙把我罩住，幸亏天降星辰救出。",
        "国师王说：你今日之事，诚我佛教之兴隆，理当亲去。新收了水猿悟空，那个家伙遇水就兴，恐我去后，他乘空生顽，无神可治。复帅群妖鼓噪而出说：猢狲，你今又请得谁来也？太子说：我原来泗州悟空国师王菩萨弟子，帅领四大妖王笑说：你这孩儿有甚武艺，擅敢到此轻薄？妖王听说，微微冷笑说：那太子，你舍了国家，从那国师王菩萨，修的是什么长生不老之术？只好收捕淮河水怪，却怎么听信悟空诳谬之言，千山万水，来此纳命？悟空又使金箍棒，齐心围绕杀妖王。那妖怪滑的一声，把四大将与太子，一搭包又装将进去。",
        "百计千方难救你，东求西告枉劳心。悟空正当凄惨之时，忽见那西南上一朵彩云坠地，满山头大雨缤纷，有人叫说：悟空见了，连忙下拜说：东来佛祖，哪里去？佛祖说：我此来，专为这小雷音妖怪也。佛祖说：他是我面前司磬的一个黄眉童儿。悟空听说，高叫一声说：好个笑和尚，你走了这童儿，让他诳称佛祖，陷害我，未免有个家法不谨之过。弥勒说：一则是我不谨，走失人口；悟空说：这妖精神通广大，你又无些兵器，何以收之？弥勒笑说：我在这山坡下设一草庵，种一田瓜果在此。我别的瓜都是生的，你却变做一个大熟瓜。悟空说：此计虽妙，你却怎么认得变的熟瓜？",
        "随又结束整齐，带了宝贝，举着那轻软狼牙棒，走出门来，叫说：孙悟空，今番挣挫不得了。悟空骂说：泼怪物，我怎么挣挫不得？妖王说：我见你计穷力竭，无处求人，独自个强来支持，如今抓住，再没个什么神兵救拔，此所以说你挣挫不得也。那妖王见他一只手抡棒，忍不住笑说：这猴儿，你看他弄巧，怎么一只手使棒支我？悟空说：儿子，你禁不得我两只手打；若是不使搭包子，再着三五个，也打不过我这一只手。妖王听完，说：也罢，也罢，我如今不使宝贝，只与你实打，比个雌雄。悟空迎着面，把拳头一放，双手抡棒。悟空见有瓜田，打个滚，钻入里面，就变做一个大熟瓜，又熟又甜。",
        "悟空十分恨苦，却又左一拳，右一脚，在里面乱掏乱捣。弥勒又说：悟空，他也勾了，你饶他罢。悟空才跳出，现了本像，急抽出棒还要打时，早被佛祖把妖精装在袋里，斜跨在腰间。那妖怪却只要怜生，在后天袋内哼哼嗔嗔的说：金铙是孙悟空打破了。悟空见此法力，怎敢违误，只得引佛上山，回至寺内，收取碎金。被悟空见一个打一个，见两个打两个，把五七百个小妖尽皆打死。别了悟空，驾祥云，径转极乐世界。这悟空却才解下唐僧、八戒、沙僧。那八戒吊了几日，饿得慌了，且不谢悟空，却就虾着腰，跑到厨房寻饭吃。原来那妖怪正安排了午饭，因悟空索战，还未得吃。"
      ],
      "67": [
        "话说唐僧师徒四人躲离了小西天，欣然上路。唐僧勒马说：徒弟呵，天色晚矣，往那条路上求宿去？若是没有借宿处，我三人都有些本事，叫八戒砍草，沙僧扳松，我会做木匠，就在那路上搭个蓬庵，好道也住得年把，你忙怎么？八戒说：哥呀，这个所在岂是住场？唐僧欣然促马，至庄门外下马，只见那柴扉紧闭。唐僧合掌当胸，躬身施礼说：老施主，贫僧原来东土差往西天取经者。老者说：和尚，你要西行，却是去不得呵。老者用手指说：我这庄村西去三十余里，有一条稀柿衕，山名七绝。老者说：这山径过有八百里，满山尽是柿果。每年家熟烂柿子落在路上，将一条夹石胡同尽皆填满，又被雨露雪霜经霉过夏，作成一路污秽，这方人家俗呼为稀屎衕。",
        "那老者见了他相貌丑陋，就也拧住口，惊嘬嘬的硬着胆，喝了一声，用藜杖指定说：你这个家伙骨挝脸，磕额头，塌鼻子，凹颉腮，毛眼毛睛，痨病鬼，不知高低，尖着个嘴，敢来冲撞我老人家？悟空陪笑说：老官儿，你原来有眼无珠，不识我这痨病鬼哩。悟空笑说：我祖居东胜大神洲，花果山前自幼修。偷天转地英名大，我是变化无穷美石猴。少顷，移过桌子，摆着许多面觔、豆腐、芋苗、萝白、辣芥、蔓菁、香稻米饭、醋烧葵汤，师徒们尽饱一餐。吃毕，八戒扯过悟空，背云：师兄，这老人家始初不肯留宿，今返设此盛斋，何也？八戒说：不羞，凭你那几句大话，哄他一顿饭吃了，明日却要跑路，他又管待送你怎么？",
        "倘或那妖精神通广大，你拿他不住，可不是我出家人打诳语么？悟空笑说：师父不要怪，等我再问了看。悟空说：你这贵处，地势清平，又许多人家居住，更不是偏僻之方，有什么妖精敢上你这高门大户？老者说：实不瞒你说，我这里久矣康宁。那时人家甚忙，打麦的在场上，插秧的在田里，具着了忙，只说是天变了。初见时夸口弄舌，说会换斗移星，降妖缚怪，及说起此事，就推却难拿。悟空说：老人家，妖精好拿，只是你这方人家不齐心，所以难拿。悟空说：妖精搅扰了三年，也不知伤害了多少生灵。我想着每家只出银一两，五百家可凑五百两银子，不拘到哪里，也寻一个法官把妖拿了，却怎么就甘受他三年磨折？",
        "那老者心里高兴极了，就命家僮请几个左邻、右舍、表弟、姨兄、亲家、朋友，共有八九位老者，都来相见，会了唐僧，言及拿妖一事，无不欣然。你这个唐僧瘦瘦小小，还不勾他填牙齿缝哩。悟空笑说：老官儿，你估不出人来。众老见说，只得依从说：唐僧，抓住妖精，你要多少谢礼？众老说：既如此说，都是受戒的高僧。我们各家具以鱼田为活，若果降了妖孽，净了地方，我们每家送你两亩良田，共凑一千亩，坐落一处，你师徒们在上起盖寺院，打坐参禅，强似方上云游。悟空说：我出家人，但只是一茶一饭，就是谢了。众老说：那妖大著哩：上拄天，下拄地；",
        "慌忙那八戒战战兢兢，伏之于地，把嘴拱开土，埋在地下，却如钉了钉一般。悟空闻风认怪，一霎时，风头过处，只见那半空中隐隐的两盏灯来，就低头叫说：兄弟们，风过了，起来看。那八戒扯出嘴来，抖抖灰土，仰着脸，朝天一望，见有两盏灯光，忽失声笑说：好耍子，好耍子，原来是个有行止的妖精，该和他做朋友。沙僧说：这般黑夜，又没有觌面相逢，怎么就知好歹？八戒说：古人云：夜行以烛，无烛则止。你看他打一对灯笼引路，必定是个好的。沙僧说：你错看了，那不是一对灯笼，是妖精的两只眼亮。这八戒就吓矮了三寸，说：爷爷呀，眼有这般大呵，不知口有多少大哩。",
        "悟空侮着鼻子，只叫：快赶妖精，快赶妖精。那妖怪物撺过山去，现了本像，原来是一条红鳞大蟒。盘地只疑为锦被，飞空错认作虹霓。那妖怪物一头钻进窟里，还有七八尺长尾巴丢在外边。八戒放下钯，一把挝住说：着手,着手。悟空笑说：八戒，放他进去，自有处置，不要这等倒扯蛇。八戒真个撒了手，那妖怪缩进去了。八戒怨说：才不放手时，半截子已是我们的了；悟空说：这个家伙身体狼犺，窟穴窄小，一定转身不得，一定是个照直撺的，定有个后门出头。你快去后门外拦住，等我在前门外打。那八戒真个一溜烟跑过山去，果见有个孔窟，他就扎定脚。",
        "八戒捶胸跌脚，大叫说：哥耶，倾了你也。悟空在妖精肚里支着铁棒说：八戒不要愁，我叫他搭个桥儿你看。那妖怪物躬起腰来，就似一道路东虹。八戒说：虽是像桥，只是没人敢走。悟空说：我再叫他变做个船儿你看。那妖怪物肚皮贴地，翘起头来，就似一只赣保船，八戒说：虽是像船，只是没有桅篷，不好使风。悟空说：你让开路，等我叫他使个风你看。那个家伙忍疼挣命，往前一撺，比使风更快，撺回旧路，下了山，有二十余里，却才倒在尘埃，动荡不得，呜呼丧矣。悟空把那物穿了一个大洞，钻将出来说：八戒，他死也死了，你还筑他怎么？",
        "悟空笑说：你这老人家，具言之欠当。唐僧下马，说：悟空，怎生着力么？悟空笑说：眼下就要过山，却也是难；李老人家说：唐僧说什么话，凭你四位担搁多少时，我们具养得起，怎么说无人管饭。悟空说：既如此，你们去办得两石米的干饭，再做些蒸饼、来。八戒听完说：哥哥，你们都要图个干净，怎么独教八戒出臭？唐僧说：悟能，你果然有本事拱开胡同，领我过山，注你这场头功。八戒笑说：师父在上，大家施主们都在此，休笑话。我八戒本来有三十六般变化，若说变轻巧华丽飞腾之物，委实不能；若说变山，变树，变石块，变土墩，变赖象、科猪、水牛、骆驼，真个全会。"
      ],
      "68": [
        "话表唐僧师徒洗污秽之胡同，上逍遥之道路，光阴迅速，又值炎天。唐僧勒马叫：徒弟们，你看那是什么地方？悟空说：师父原来不识字，亏你怎么领唐王旨意离朝也？唐僧说：我自幼为僧，千经万典皆通，怎么说我不识字？悟空说：既识字，怎么那城头上杏黄旗，明书三个大字，就不认得，却问是甚地方何也？八戒、沙僧说：师父，不要听师兄捣鬼。唐僧说：朱紫国必是西邦王位，却要倒换关文。那两边做买做卖的，忽见猪八戒相貌丑陋，沙僧面黑身长，悟空脸毛额廓，丢了买卖，都来争看。有那游手好闲的，并那顽童们，烘烘笑笑，都上前抛瓦丢砖，与八戒作戏。",
        "唐僧说：他这里不服我大唐管属，又不与我国相连，况不时又有上司过客来往，所以不好留此相待。悟空说：这样看来，我偏要他相待。正说处，有管事的送支应来，原来是一盘白米、一盘白面、两把青菜、四块豆腐、 两个面觔、一盘干笋、一盘木耳。管事的说：西房里有干净锅灶，柴火方就，请自去做饭。唐僧说：我问你一声：国王可在殿上么？管事的说：我万岁爷爷久不上朝，今日原来黄道良辰，正与文武多官议出黄榜。你若要倒换关文，趁此急去，还追上；唐僧说：悟空，你们在此安排斋饭，等我急急去验了关文回来，吃了走路。唐僧整束了进朝，只是吩咐徒弟，不可出外去生事。",
        "这唐僧因问，就欠身合掌说：贫僧哪里：三皇治世，五帝分伦。国王听完，忽作呻吟之声，问：法师，那贤臣是那邦来者？唐僧说：就是我王驾前丞相，姓魏名征。因他梦斩了泾河龙王，那龙王告到地府，说我王许救又杀之，故我王于是得促病，渐觉身危。今要做水陆大会，故遣贫僧远涉道途，询求诸国，拜佛祖，取《大乘经》唐僧，超度孽苦升天也。那国王又呻吟叹说：诚原来是天朝大国，君正臣贤。唐僧听说，偷睛观看，见那皇帝面黄肌瘦，形脱神衰。唐僧正欲启问，有光禄寺官奏请唐僧奉斋。唐僧谢了恩，与王同进膳进斋暂且不说。再说悟空在会同馆中，着沙僧安排茶饭，并整治素菜。",
        "那八戒闻说，口内流涎，喉咙里嘓嘓的咽唾，跳起来说：哥哥，这遭我扰你，待下次趱钱，我也请你回席。悟空暗笑说：沙僧，好生煮饭，等我们去买调和来。沙僧也知是耍八戒，只得顺口应承说：你们去，须是多买些，吃饱了来。那八戒捞个碗盏拿了，就跟悟空出门。那人说：这条街往西去，转过拐角鼓楼，那郑家杂货店，凭你买多少，油、盐、酱、醋、姜、椒、茶叶具全。悟空过了几处茶房，几家饭店，当买的不买，当吃的不吃。八戒叫说：师兄，这里将就买些用罢。那悟空原是耍他，哪里肯买，说：贤弟，你好不经纪，再走走，拣大的买吃。哪里人嚷得紧，只怕是拿和尚的，又况是面生可疑之人，拿了去，怎么了？",
        "这八戒立定脚，就如生了根一般，十来个人也弄他不动。八戒说：你们不知高低，再扯一会，扯得我呆性子发了，你却休怪。内有两个年老的太监说：你这相貌稀奇，声音不对，是哪里来的，这般村强？八戒说：我们是东土差往西天取经的。我师父原来唐王唐僧法师，却才入朝，倒换关文去了。那太监说：我先前见个白面胖和尚，径奔朝门而去，想就是你师父？八戒说：我们一行师徒四人，师父去倒换关文，我三众并行囊、马匹具歇在会同馆。太监说：校尉不要扯他，我们同到馆中，就知端的。众校尉说：这和尚委不识货，怎么赶着公公叫起奶奶来耶？八戒笑说：不羞，你这反了阴阳的。",
        "众太监、 校尉一起说：你师兄果然有手段，医好国王，他也该有一半江山，我们合该下拜。八戒领着一行太监、校尉，直接走进馆中。只听得悟空与沙僧在客房里正说那揭榜之事耍笑哩。八戒上前扯住，乱嚷说：你可成个人？又弄旋风，揭了什么皇榜，暗暗的揣在我怀里，拿我装胖。悟空笑说：你这八戒，想是错了路，走向别处去。说不了，只见那几个太监、校尉朝上礼拜说：孙老爷，今日我王有缘，天遣老爷下降。悟空听完，正了声色，接了八戒的榜文，对众说：你们想是看榜的官么？太监磕头说：奴婢原来司礼监内臣。悟空说：这招医榜，委是我揭的，故遣我师弟引见。",
        "国王听完，心里高兴极了，就问唐僧说：法师有几位高徒？唐僧说：实不瞒陛下说，我那顽徒，具是山野庸才，只会挑包背马，转涧寻波，带领贫僧登山涉岭，或者到峻险之处，可以伏魔擒怪，捉虎降龙而已，更无一个能知药性者。你们可替我，具到朝外，敦请孙唐僧，看朕之病。你们见他，切不可轻慢，称他做神僧孙唐僧，皆以君臣之礼相见。吓得那八戒躲在厢房，沙僧闪于壁下。八戒暗地里怨恶说：这猢狲活活的折杀也。不多时，礼拜毕，分班启奏说：上告神僧孙唐僧：我们具朱紫国王之臣，今奉王旨，敬以洁礼参请神僧，入朝看病。悟空才立起身来，对众说：你王如为什么不来？",
        "望闻问切四般事，缺一之时不备全：我不望闻并问切，今生不要想得安然。那两班文武丛中，有太医院官，一闻此言，对众称扬说：这和尚也说得有理。就是神仙看病，也须望、闻、问、切，谨合著神圣功巧也。众官依此言，着近侍传奏说：唐僧要用望、闻、问、切之理，方可认病用药。那国王睡在龙床上，声声唤说：叫他去罢，我见不得生人面了。近侍的出宫来说：那和尚，我王旨意，让你去罢，见不得生人面哩。悟空说：若见不得生人面呵，我会悬丝诊脉。那近侍的又入宫奏说：陛下，那孙唐僧不见陛下之面，他会悬丝诊脉。近侍的就忙传出说：陛下已许他悬丝诊脉，快宣孙唐僧进宫诊视。"
      ],
      "69": [
        "那国王在内听完，心里高兴极了，打起精神，高声应说：指下明白，指下明白，果是此疾。早有在旁边听见的太监，已先对众报知。过了一会儿，悟空出来，唐僧就问怎么。悟空说：诊了脉，如今对症制药哩。众官上前说：神僧唐僧适才说双鸟失群之症，何也？悟空笑说：有雌雄二鸟，原在一处同飞，忽被暴风骤雨惊散，雌不能见雄，雄不能见雌，雌原来想雄，雄亦想雌：这不是双鸟失群也？众官闻说，齐声喝采说：真是神僧！当有太医官问：病势已看出矣，但不知用何药治之？医官说：经云：药有八百八味，人有四百四病。悟空说：古人云：药不执方，合宜而用。",
        "悟空说：这里不是制药处，可将诸药之数并制药一应器皿，都送入会同馆，交与我师弟二人收下。医官听命，就将八百八味每味三斤及药碾、药磨、药罗、药乳并乳钵、乳槌之类都送至馆中，一一交付收讫。那唐僧正自起身，忽见内宫传旨，教阁下留住法师，同宿文华殿。唐僧大惊说：徒弟呵，此意是留我做当头哩。悟空笑说：师父放心在此受用，我自有医国之手。八戒迎着笑说：师兄，我知道你了。八戒说：知你取经之事不果，欲作生涯无本，今日见这里富庶，设法要开药铺哩。悟空喝说：不要胡说，医好国王，得意处辞朝走路，开什么药铺？八戒说：终不然，这八百八味药，每味三斤，共计二千四百二十四斤，只医一人，能用多少？",
        "他二人就时将二药碾细说：师兄，还用那几十味？八戒说：八百八味，每味三斤，只用此二两，诚为起夺人了。悟空将一个花磁盏子，说：贤弟不要讲，你拿这个盏儿，将锅脐灰刮半盏过来。悟空又将盏子递与他说：你再去把我们的马尿等半盏来。沙僧又笑说：哥哥，这事不是耍子。八戒听完，真个去到边前，那马斜伏地下睡哩。他跑将来，对悟空说：哥呵，且不要去医皇帝，且快去医医马来。三人都到马边，那马跳将起来，口吐人言，大声说：师兄，你岂不知？我本是西海飞龙，因为犯了天条，观音菩萨救了我，将我锯了角，退了鳞，变作马，驮师父往西天取经，将功折罪。",
        "八戒说：只有核桃大，若论我吃，还不勾一口哩。多官随至馆中，对悟空拜伏于地说：我王特命臣等拜领妙剂。八戒二人暗中作笑说：锅灰拌的，怎么不是乌金？悟空说：半空飞的老鸦屁，紧水负的鲤鱼尿，王母娘娘搽脸粉，老君炉里炼丹灰，玉皇戴破的头巾要三块，还要五根困龙须。多官听完说：此物原来世间所无者。多官说：我这里人家俗论：若用无根水，将一个碗盏，到井边或河下，舀了水，急转步，更不落地，亦不回头，到家与病人吃药，就是。悟空说：井中河内之水，具是有根的。国王大喜，就命近侍接上来，看了说：此是甚么丸子？多官说：神僧说是乌金丹，用无根水送下。",
        "悟空说：如今用不着风云雷电，亦不须多雨，只要些须引药之水就了。龙王说：既如此，待我打两个喷涕，吐些涎津溢，与他吃药罢。那满朝官齐声喝采说：我主万千之喜，天公降下甘雨来也。国王就传旨，吩咐：取器皿盛着，不拘宫内外及官大小，都要等贮仙水，拯救我。将有一个时辰，龙王辞了悟空回海。众臣将杯盂碗盏收来，也有等着一点两点者，也有等着三点五点者，也有一点没有等著者，共合一处，约有三盏之多，总献至御案。那国王辞了法师，将着乌金丹并甘雨至宫中，先吞了一丸，吃了一盏甘雨；国王闻此言，甚喜，又进一次米饭。再说八戒见官投简，高兴极了说：哥呵，果是好妙药。",
        "国王说：素酒，法师饮此一杯何如？国王甚不过意说：法师戒饮，却以何物为敬？国王却才欢喜，转金卮，递与悟空。八戒在旁，见酒不到他，忍得他嘓嘓咽唾。又见那国王苦劝悟空，他就叫将起来说：陛下，吃的药也亏了我，那药里有马……这悟空听说，恐怕八戒走了消息，却将手中酒递与八戒。国王问：神僧说药里有马，是什么马？悟空接过口来说：我这兄弟是这般口敞，他有个经验的好方儿，他就要说与人。时有太医院官在旁说：陛下：兜铃味苦寒无毒，定喘消痰大有功。八戒亦不言语，却也吃了个三宝钟。国王又递了沙僧酒，也吃了三杯，却具叙坐。",
        "悟空听见此言，满心喜悦，将那巨觥之酒，两口吞之，笑问国王说：陛下原来是这般惊忧。那国王滴泪说：朕切切思思，无昼无夜，但只是没一个能获得妖精的，岂有不要他回国之理？国王跪下说：若救得朕后，朕愿领三宫九嫔，出城为民，将一国江山，尽付神僧，让你为帝。八戒在旁，见出此言，行此礼，忍不住呵呵大笑说：这皇帝失了体统，怎么为老婆就不要江山，跪着和尚？悟空急上前，将国王搀起说：陛下，那妖精自得金圣宫去后，这一向可曾再来？国王说：他前年五月节摄了金圣宫，至十月间，来要两个宫娥，说是伏侍娘娘，朕就献出两个；",
        "旧年四月内，是朕命工起了一座避妖楼，但闻风响，知是他来，就与二后、九嫔入楼躲避。悟空说：陛下不弃，可携我去看那避妖楼一番，何如？国王闻说，情知八戒是为嘴，就命当驾官抬两张素桌面看酒，在避妖楼外伺候。八戒却才不嚷，同师父、沙僧笑说：翻席去也。一行文武官引导，那国王并悟空相搀，穿过皇宫，到了御花园后，更不见楼台殿阁。说不了，只见两个太监拿两根红漆扛子，往那空地上掬起一块四方石板。我听得风响，就入里边躲避，外面着人盖上石板。吓得那多官齐声报怨说：这和尚盐酱口，讲什么妖精，妖精就来了。慌忙那国王丢了悟空，就钻入地穴；"
      ],
      "70": [
        "悟空说：我原来齐天悟空孙悟空，因保东土唐僧西天拜佛，路过此国，知你这伙邪魔欺主，特展雄才，治国祛邪。那妖怪听完，不知好歹，展长枪就刺悟空；悟空原来太乙仙，妖精本是邪魔孽。还是齐天悟空能，乒乓一棍枪先折。悟空且不赶他，按下云头，来至避妖楼地穴之外，叫说：师父，请同陛下出来，怪物已赶去矣。那皇帝就至酒席前，自己拿壶把盏，满斟金杯，奉与悟空说：神僧，权谢，权谢。这悟空接杯在手，还未回言，只听得朝门外有官来报：西门上火起了。悟空闻说，将金杯连酒望空一撇，当的一声响亮，那个金杯落地。君王着了忙，躬身施礼说：神僧，恕罪，恕罪，是我不是了。悟空又笑说：陛下，你见我撇杯，疑有见怪之意，非也。",
        "国王说：神僧，你不要怪我说，你这尊貌，却像个猿猴一般，怎生有这我身虽是猿猴数，自幼打开生死路。只因变化没遮拦，一打十万八千路！那国王见说，又惊又喜，笑吟吟捧着一杯御酒递与悟空说：神僧远劳，进此一杯引意。这悟空一心要去降妖，哪里有心吃酒，只叫：且放下，等我去了回来再饮。好悟空，说声去，哨一声，寂然不见。再说悟空将身一纵，早见一座高山阻住雾角。这悟空看看不厌，正欲找寻洞口，只见那山凹里烘烘火光飞出，霎时间，扑天红焰，红焰之中冒出一股恶烟，比火更毒。烧得那窝中走兽连皮烂，林内飞禽羽尽光。孙悟空正自恐惧，又见那山中迸出一道沙来。",
        "悟空听了，暗喜说：妖精也有存心好的。嘤的一声，一翅飞离了妖精，转向前路，有十数里地，摇身一变，又变做一个道童：头挽双丫髻，身穿百衲衣。转山坡，迎着小妖，打个有礼了说：长官，哪里去？那妖物就像认得他的一般，住了锣槌，笑嘻嘻的还礼说：我大王差我到朱紫国下战书的。悟空接口问：朱紫国那话儿，可曾与大王配合哩？小妖说：自前年摄得来，当时就有一个神仙，送一件五彩仙衣与金圣宫妆新。早间差先锋去要宫女伏侍，被一个什么悟空战败了。悟空就行起凶来，抽出出棒，复转身，望小妖脑后一下，可怜，就打得头烂血流浆迸出，皮开颈折命倾之。",
        "牌上有字，写说：心腹小校一名，有来有去。悟空笑说：这个家伙名字叫做有来有去，这一棍子，打得有去无来！且不敢寻他洞府，就将棍子举起，着小妖胸前捣了一下，挑在空中，直接回到本国，且当报一个头功。那八戒在金銮殿前正护持着王、师，忽回头看见悟空半空中将个妖精挑来，他却怨说：嗳！说未毕，悟空按落云头，将妖精捽在阶下。八戒跑上去，就筑了一钯说：此是八戒之功。八戒说：不要赖我，我有证见，你不看一钯筑了九个眼子哩。八戒笑说：原来是没头的，我道怎么筑他也不动动儿？悟空将一封战书揣在唐僧袖里说：师父收下，且不要与国王看见。",
        "正欲看看洞景，只听见猩猩出语说：有来有去，你回来了？猩猩说：快走，大王爷爷正在剥皮亭上等你回话哩。悟空见了，公然傲慢那妖精，更不循一一些礼法：调转脸，朝着外，只管敲锣。妖王上前扯住说：你怎么到了家还筛锣，问之又不答，何也？悟空把锣往地下一掼说：什么何也、何也？行到那厢，只见无数的人马列成阵势，见了我，就都叫：拿妖精，拿妖精。幸亏那两班谋士说：两家相争，不斩来使。收了战书，又押出城外，对军前打了三十顺腿，放我来回话。妖王说：这样看来，是你吃亏了，怪不道问你更不言语。悟空说：我也吓昏了，又吃他打怕了，哪里会查他人马数目？",
        "打扮得鞋护顶并胖袄，简鞭神弹与铜锤。今早他听见我发狠，要去战斗，他就眼泪汪汪的不干。悟空听完，十分欢喜说：正中我之意。悟空上前打了个行礼问候说：接喏。娘娘听说，忍怒问：你下战书，可曾到朱紫国界？悟空说：我持书直至城里，到于金銮殿，面见君王，已讨回音来也。悟空说：那君王敌战之言，与排兵布阵之事，才与大王说了。我会降龙伏虎，特请我来捉怪，救你回国。那战败先锋是我，打死小妖也是我。我见他门外凶狂，是我变作有来有去模样，舍身到此，与你通信。悟空拿出宝串，双手奉上说：你若不信，看此物何来？",
        "娘娘一见垂泪，下座拜谢说：唐僧，你果是救得我回朝，没齿不忘大恩。悟空说：我且问你，他那放火、放烟、放沙的，是件什么宝贝？娘娘说：哪里是甚宝贝，原来是三个金铃。烟火还不打紧，只是黄沙最毒，若钻入人鼻孔，就伤了性命。悟空说：你若有意于朱紫国，还要相会国王，把那烦恼忧愁，都且权解，使出个风流喜悦之容，与他叙个夫妻之情，让他把铃儿与你收贮。待我取就偷了，降了这妖怪，那时节，好带你回去，重谐鸾凤，共享安宁也。这悟空还变作心腹小校，开了宫门，唤进左右侍婢。好悟空，应了一声，就至剥皮亭，对妖精说：大王，圣宫娘娘有请。",
        "妖王上前喝说：好贱奴，怎么偷了我的金铃宝贝，在此胡弄？那门前虎将、熊师、豹头、彪帅、獭象、苍狼、乖獐、狡兔、长蛇、大蟒、猩猩，帅妖怪们一齐攒簇。妖怪们听了，关门的关门，打仗的打仗。那悟空难得脱身，收了棒，摇身一变，变作个痴苍蝇儿，钉在那无火石壁上。妖怪们寻不见，报说：大王，走了贼也，走了贼也。妖怪们都说：前门紧锁牢拴在此，没有走出。好大胆，变作有来有去的模样，进来见我回话，又跟在身边，乘机盗我宝贝。若拿出山头，见了天风，怎生是好？虎将上前说：大王的洪福齐天，我们的气数不尽，故此知觉了。"
      ],
      "71": [
        "我还是你国差来的神僧孙唐僧，未曾伤命。只因自家性急，近妆台偷了金铃，你与妖王吃酒之时，我却脱身私出了前亭，忍不住打开看看。我就慌了手脚，把金铃丢了，现出原身，使铁棒，苦战不出，恐遭毒手，故变作一个苍蝇儿，钉在门枢上，躲到如今。你可再以夫妻之礼，哄他进来安寝，我好脱身行事，别作区处救你也。悟空说：我也不是人，我也不是鬼，如今变作个苍蝇儿在此。娘娘不信，泪滴滴，悄语低声说：你不要魇寐我。你若不信，展开手，等我跳下来你看。那娘娘真个把左手张开，悟空轻轻飞下。悄悄的说：我去请那妖王来时，你却怎生行事？",
        "那春娇就转前面，叫了七八个怪鹿妖狐，打着两对灯笼、一对提炉，摆列左右。好悟空，展开翅，径飞到那玉面狐狸头上，拔下一根毫毛，吹口仙气，叫：变！变作一个瞌睡虫，轻轻的放在他脸上。悟空跳下来，摇身一变，变做那春娇一般模样，转屏风，与众排立暂且不说。再说那金圣宫娘娘往前正走，有小妖看见，就报赛太岁说：大王，娘娘来了。假春娇在旁，执着酒壶说：大王、与娘娘今夜才递交杯盏，请各饮干，穿个双喜杯儿。假春娇又说：大王娘娘喜会，众侍婢会唱的供唱，善舞的起舞来耶。叙了一会，笑了一会，娘娘问：大王，宝贝没有伤损么？",
        "假春娇在旁边，着意看着那妖王身上衣服，层层皆有虼蚤跳，件件皆排大臭虫；假春娇说：大王，拿铃子来，等我也与你捉捉虱子。他就将金铃藏了，拔下一根毫毛，变作三个铃儿，一般无二，拿向灯前翻检。却又把身子扭扭捏捏的抖了一抖，将那虱子、臭虫、虼蚤，收了归在身上，把假金铃儿递与那妖怪。那妖怪接在手中，一发朦胧无措，哪里认得什么真假，双手托着那铃儿，递与娘娘说：今番你却收好了，却要仔细仔细，不要像前一番。那妖王诺诺连声说：没福，没福，不敢奉陪。好悟空，捏着诀，念动真言，使个隐身法，直至门边，又见那门上拴锁甚密。却就拿出金箍棒，望门一指，使出那解锁之法，那门就轻轻开了。",
        "娘娘说：在朝有四十八卫人马，良将千员；娘娘说：我在宫，只知内里辅助君王，早晚教诲妃嫔，外事无边，我怎记得名姓？妖王说：这来者称为外公，我想着《百家姓》上，更无个姓外的。娘娘说：止《千字文》上有句外受傅训，想必就是此矣。悟空把金箍棒揝在右手，将左手指定说：贤甥，叫我怎么？那妖王见了，心中大怒说：你这个家伙：相貌若猴子，嘴脸似猢狲。悟空笑说：你这个诳上欺君的泼怪，原来没眼。王喝说：快早说出姓甚名谁，有些什么武艺，敢到我这里猖獗！你若不问姓名犹可，若要我说出姓名，只怕你立身无地。西方路上降妖怪，那个妖邪不惧哉！",
        "那妖王听他说出悟空悟空，于是说：你原来是大闹天宫的那个家伙。你既脱身保唐僧西去，你走你的路去就罢了，怎么罗织管事，替那朱紫国为奴，却到我这里寻死？我受朱紫国拜请之礼，又蒙他称呼管待之恩，我比那王位还高千倍，他敬之如父母，事之如神明，你怎么说出为奴二字？那妖慌了手脚，就闪身躲过，使宣花斧劈面相迎。这个是齐天悟空降临凡，那个是作怪妖王来下土。那妖王见悟空手段高强，料不能取胜，将斧架住他的铁棒说：悟空，你且住了。悟空情知是要取铃铛，收了铁棒说：好汉子不赶乏兔儿。那妖急转身闯入里边，对娘娘说：快将宝贝拿来。",
        "纵然是一个模子铸的，好道打磨不到，也有多个瘢儿，少个蒂儿，却怎么这等一毫不差？悟空说：贤甥，你那铃儿却是哪里来的？妖王老实，就就说说：我这铃儿是：太清仙君道源深，八卦炉中久炼金。悟空笑说：我的铃儿，也是那时来的。妖王说：铃儿原来金丹之宝，又不是飞禽走兽，怎么辨得雌雄？世情变了，这铃儿想是惧内，雄见了雌，所以不出来了。悟空说：贤甥，住了手，等我也摇摇你看。悟空口里又念个咒语，望巽地上叫：风来！把那赛太岁吓得魄散魂飞，走头无路，在那火当中，怎逃性命？只听见半空中大声说：孙悟空，我来也。悟空急回头上望，原来是观音菩萨，左手托着净瓶，右手拿着杨柳，洒下甘露救火哩。",
        "因牧童盹睡，失于防守，这孽畜咬断铁索走来，却与朱紫国王消灾也。悟空听完，急欠身说：菩萨反说了，他在这里欺君骗后，败俗伤风，与那国王生灾，再说是消灾，何也？他率领人马，纵放鹰犬，正来到落凤坡前，有西方佛母孔雀大明王菩萨所生二子，原来雌雄两个雀雏，停翅在山坡之下，被此王弓开处，射伤了雄孔雀，那雌孔雀也带箭归西。不期这孽畜留心，故来骗了皇后，与王消灾。至今三年，冤愆满足，幸你来救治王患。悟空说：菩萨，虽是这般故事，奈何他玷污了皇后，败俗伤风，坏伦乱法，却是该他死罪。今蒙菩萨亲临，饶得他死罪，却饶不得他活罪。",
        "悟空说：娘娘身上生了毒刺，手上有蜇阳之毒。具正在仓皇之际，忽听得那半空中有人叫说：悟空，我来也。悟空抬头观看，只见那：肃肃冲天鹤唳，飘飘径至朝前。紫阳真人直至殿前，躬身施礼说：悟空，小仙张伯端有礼了。真人说：小仙三年前曾赴佛会，因打这里经过，见朱紫国王有拆凤之忧，我恐那妖将皇后玷辱，有坏人伦，后日难与国王复合，是我将一件旧棕衣变作一领新霞裳，光生五彩，进与妖王，教皇后穿了装新。悟空说：既如此，累你远来，且快解脱。真人将衣抖一抖，披在身上，对悟空说：悟空勿罪，小仙告辞。正当欢宴时，悟空叫：师父，拿那战书来。"
      ],
      "72": [
        "话表唐僧别了朱紫国王，整顿鞍马西进。悟空问：师父，这条路平坦无邪，因为什么不走？唐僧说：不是关风，我看哪里是个人家，想要自去化些斋吃。悟空笑说：你看师父说的是什么话，你要吃斋，我自去化。唐僧说：徒弟呵，今日天气晴明，与那风雨之时不同。沙僧在旁边笑说：师兄，不必多讲，师父的心性如此，不必违背。八戒依言，就拿出钵盂，与他换了衣帽。",
        "自家思虑说：我若没本事化顿斋饭，也惹那徒弟笑我：敢道为师的化不出斋来，为徒的怎能去拜佛？唐僧没有别的办法，也带了几分不是，趋步上桥。拿头过论有高低，张泛送来真又楷。那个错认是头儿，这个转身就打拐。唐僧看得时辰久了，只得走上桥头，应声高叫说：女菩萨，贫僧这里随缘布施一些斋吃。那些女子听见，一个个喜喜欢欢抛了针线，撇了气球，都笑笑吟吟的接出门来说：唐僧，没有远迎了。唐僧听完，心中暗说：好极了，好极了！唐僧向前行礼问候了，相随众女入茅屋。",
        "有一女子上前，把石头门推开两扇，请唐僧里面坐。唐僧心惊，暗自思忖说：这地方少吉多凶，一定不善。众女子喜笑吟吟，都说：唐僧请坐。唐僧说：我是东土大唐差去西天大雷音求经者。两盘儿捧到石桌上放下，对唐僧说：请了。众女子说：唐僧，你出家人，切不要拣人布施。众女子笑说：唐僧虽不拣人布施，却只有些上门怪人。望菩萨养生不若放生，放我和尚出去罢。那唐僧挣着要走，那女子拦住门，怎么肯放，一起说：上门的买卖，倒不好做。他一个个都会些武艺，手脚又活，把唐僧扯住，顺手牵羊，扑的掼倒在地。两只脚向后，一条绳吊起：三条绳把唐僧吊在梁上，却是脊背朝上，肚皮朝下。",
        "再说那悟空、八戒、沙僧都在大道之旁边，他二人都放马看担，惟悟空是个顽皮，他且跳树攀枝，摘叶寻果。忽回头，只见一片光亮，慌忙跳下树来，吆喝说：不好，不好，师父好运气低了。八戒、 沙僧共目视之，那一片如雪又亮如雪，似银又光似银。八戒说：罢了，罢了，师父遇着妖精了，我们快去救他也。好悟空，束一束虎皮裙，抽出出金箍棒，拽开脚，两三步跑到前边，看见那丝绳缠了有千百层厚，穿穿道道，却似经纬之势。他就举棒说：这一棒，不要说是几千层，就有几万层，也打断了。正欲打，又停住手说：若是硬的就可打断，这个软的，只好打匾罢了。",
        "悟空听言说：土地，你且回去，等我自家拿他罢。这悟空独显神通，摇身一变，变作个麻苍蝇儿，钉在路旁边草梢上等待。又听得呀的一声，柴扉响处，里边笑语諠哗，走出七个女子。悟空在暗中细看，见他一个个携手相搀，挨肩执袂，有说有笑的走过桥来，果是标致。悟空笑说：怪不得我师父要来化斋，原来是这一般好物。来呼说：姐姐，我们洗了澡，来蒸那胖和尚吃去。个女子走上前，哨的一声，把两扇门儿推开，那中间果然有一塘热水。悟空暗中喜嘤嘤的，一翅飞在那衣架头上钉住。",
        "不要打他，只送他一个绝后计，让他动不得身，多少是好？好悟空，捏着诀，念个咒，摇身一变，变作一个饿老鹰。会使老拳供口腹，不辞亲手逐飞腾。呼的一翅，飞向前，抡开利爪，把他那衣架上搭的七套衣服，尽情叼去，径转岭头，现出本相，来见八戒、沙僧。那妖怪见了，心惊胆战，对八戒说：你先来是个和尚，到水里变作鱼，及拿你不住，却又这般打扮，你端的是从何到此？八戒说：这伙泼怪当真的不认得我。我是东土大唐取经的唐僧之徒弟，原来天蓬元帅悟能八戒是也。那些妖闻此言，魂飞魄散，就在水中跪拜说：望老爷方就方就！八戒一味粗夯，显手段，那有怜香惜玉之心，举着钯，不分好歹，追上前乱筑。",
        "有名叫做蜜、蚂、蠦、班、蜢、蜡、蜻：蜜是蜜蜂，蚂是蚂蜂，蠦是蠦蜂，班是班毛，蜢是牛蜢，蜡是抹蜡，蜻是蜻蜓。忽闻一声呼唤，都到面前，问：母亲有何使令？众怪说：儿呵，早间我们错惹了唐朝来的和尚，才然被他徒弟拦在池里，出了多少丑，几乎丧了性命。再说八戒跌得昏头昏脑，猛抬头，见丝篷丝索具无，他才一步一探，爬将起来，忍着疼，找回原路。见了悟空，用手扯住说：哥哥，我的头可肿，脸可青么？八戒说：我被那个家伙将丝绳罩住，放了绊脚索，不知跌了多少跟头，跌得我腰驼背折，寸步难移。沙僧见了说：罢了，罢了，你闯下祸来也，那妖怪一定往洞里去伤害师父。悟空看了说：好笑，干净都是些小人儿。",
        "八戒本是跌恼了的性子，又见那伙虫蛭小巧，就发狠举钯来筑。那些怪见八戒凶猛，一个个现了本像，飞将起去，叫声：变！过了一会儿，一个变十个，十个变百个，百个变千个，千个变万个，个个都变成无穷之数。八戒慌了说：哥呵，只说经好取，西方路上，虫儿也欺负人哩。悟空说：兄弟，不要怕，快上前打。八戒说：扑头扑脸，浑身上下，都叮有十数层厚，却怎么打？悟空说：没事，没事，我自有手段。沙僧说：哥呵，有甚手段，快使出来罢，一会子光头上都叮肿了。八戒说：师兄，又打什么市语，黄呵、麻呵哩？三兄弟才闯过桥去，直接走进洞里，只见老师父吊在哪里哼哼的哭哩。"
      ],
      "73": [
        "唐僧勒马说：徒弟，你看那是个什么地方？悟空举头观看，忽然见：山环楼阁，溪遶亭台。悟空报说：师父，那所在也不是王侯第宅，也不是豪富人家，却像一个庵观寺院。八戒说：黄花观原来道士之家，我们进去会他一会也好，他与我们衣冠虽别，修行一般。悟空笑说：这个是烧茅炼药，弄炉火，提罐子的道士。你看他怎生打扮：戴一顶红艳艳戗金冠，穿一领黑淄淄乌皂服，踏一双绿阵阵云头履，系一条黄拂拂吕公绦。唐僧见了，大声说：老神仙，贫僧行礼问候了。那道士猛抬头，一见心惊，丢了手中之药，按簪儿，整衣服，降阶迎接说：老师父，没有远迎了。",
        "女怪说：你快去递了茶，对你师父丢个眼色，着他进来，我有要紧的话说。果然那仙童将五杯茶拿出去，道士敛衣，双手拿一杯递与唐僧，然后与八戒、沙僧、 悟空。小童丢个眼色，那道士就欠身说：大家请坐。此时唐僧与徒弟们并一个小童，出殿上观玩暂且不说。道士用手搀起说：你们早间来时，要与我说什么话，可可的今日丸药，这枝药忌见阴人，所以没有答你。众怪说：告禀师兄：这桩事，专为客来，方敢告诉；道士笑说：你看贤妹说话，怎么专为客来才说？众怪说：才小童进来取茶，我听见他说，是四个和尚。众怪说：四个和尚，内有一个白面胖的，有一个长嘴大耳的，师兄可曾问他是哪里来的？",
        "道士听完，满面生春说：老师原来忠诚大德之佛，小道不知，失于远候，恕罪，恕罪。那小童走将进去，众女子招呼他来说：这里有现成好茶，拿出去。道士连忙双手拿一个红枣儿茶钟奉与唐僧。悟空眼乖，接了茶钟，早已见盘子里那茶钟是两个黑枣儿。道士笑说：不瞒唐僧说，山野中贫道士，茶果一时不备，才然在后面亲自寻果子，止有这十二个红枣，做四钟茶奉敬。唐僧听完说：悟空，这仙长实原来爱客之意，你吃了罢，换怎么？再说那八戒一则饥，二则渴，原来是食肠大大的，见那钟子里有三个红枣儿，拿起来嘓的都咽在肚里。一霎时，只见八戒脸上变色，沙僧满眼流泪，唐僧口中吐沫。",
        "悟空见事不谐，就翻身念声咒语，打个筋斗，扑的撞破天篷走了。忍着性气，淤淤的站在空中看处，见那妖怪丝绳晃亮，穿穿道道，却是穿梭的经纬，转眼间间，把黄花观的楼台殿阁都遮得无影无形。这伙怪合意同心，却不知是个甚来历，待我还去问那土地神也。好悟空，按落云头，捻着诀，念声唵字真言，把个土地老人家又拘来了。战兢兢跪下路旁，磕头说：悟空，你去救你师父的，为什么又转来也？悟空说：早间救了师父，过去不远，遇一座黄花观，我与师父等进去看看，那观主迎接。才举手相敌，只见那七个女子跑出，吐放丝绳，我亏有见识走了。土地磕头说：那妖精到此，住不上十年。",
        "那道士见他打死了师妹，心甚不忍，就发狠举剑来迎。这一场好杀：妖精抡宝剑，悟空举金箍。杀得风响沙飞狼虎怕，天昏地暗斗星无。那道士与悟空战经五六十合，渐觉手软。悟空笑说：我儿子，打不过人，就脱剥了也是不能勾的。原来这道士剥了衣裳，把手一齐抬起，只见那两胁下有一千只眼，眼中迸放金光，十分利害：森森黄雾，艳艳金光。把个齐天孙悟空，困在金光黄雾中。悟空慌了手脚，只在那金光影里乱转，向前不能举步，退后不能动脚，却就似在个桶里转的一般。无奈又爆燥不过，他急了，往上着实一跳，却撞破金光，扑的跌了一个倒栽葱，觉道撞的头疼。",
        "美猴王正当悲切，忽听得山背后有人啼哭，就欠身揩了眼泪，回头观看。那妇人不一时走上过来，迎着悟空。悟空躬身问：女菩萨，你哭的是甚人？妇人噙泪说：我丈夫因与黄花观观主买竹竿争讲，被他将毒药茶药死，我将这陌纸钱烧化，以报夫妇之情。那女子见了，作怒说：你甚无知，我为丈夫烦恼生悲，你怎么泪眼愁眉，欺心戏我？我本是东土大唐钦差唐僧唐僧大徒弟孙悟空悟空。蜘蛛精在盘丝洞要害我师父，是我与师弟八戒、沙僧救解得脱。那蜘蛛精走到他这里，背了是非，说我们有欺骗之意。惟我没有吃他茶，将茶钟掼碎，他就与我相打。正嚷时，那七个蜘蛛精跑出来吐放丝绳，将我网住，是我使法力走脱。",
