<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e53b3b">
  <title>亲子故事书架</title>
  <style>
    :root {
      --red: #e53b3b;
      --red-deep: #b8202e;
      --blue: #2f72c8;
      --yellow: #ffd84d;
      --green: #38a96b;
      --ink: #172033;
      --muted: #667085;
      --paper: #fffdf7;
      --card: #fff;
      --line: rgba(23, 32, 51, .14);
      --shadow: 0 16px 40px rgba(23, 32, 51, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      letter-spacing: 0;
    }
    body[data-library="journey"] {
      --red: #c53a32;
      --red-deep: #8f241f;
      --blue: #287a5b;
      --yellow: #f2c14e;
      --green: #287a5b;
      --ink: #24211d;
      --muted: #6f6558;
      --paper: #fffaf0;
      --line: rgba(62, 48, 34, .16);
      --shadow: 0 16px 40px rgba(62, 48, 34, .12);
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 370px minmax(0, 1fr);
    }

    .catalog {
      height: 100vh;
      overflow: auto;
      padding: 20px 16px 28px;
      background: rgba(255, 255, 255, .94);
      border-right: 1px solid var(--line);
    }

    .librarySwitch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 16px;
      padding: 4px;
      background: #eef1f5;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .libraryTab {
      min-height: 40px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      background: transparent;
      border: 0;
      border-radius: 6px;
    }
    .libraryTab.active {
      color: var(--ink);
      background: #fff;
      box-shadow: 0 2px 8px rgba(23, 32, 51, .1);
    }

    .brand {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .storyMark {
      width: 56px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .ball {
      border: 4px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle, #fff 0 17%, var(--ink) 18% 25%, transparent 26%),
        linear-gradient(to bottom, var(--red) 0 45%, var(--ink) 46% 55%, #fff 56% 100%);
      box-shadow: 0 7px 0 rgba(23, 32, 51, .08);
    }
    .ball span { display: none; }
    .journeyMark {
      color: #ffe7a1;
      font-family: "Songti SC", "STSong", serif;
      font-size: 30px;
      font-weight: 900;
      background: #b92f2a;
      border: 4px solid #24211d;
      border-radius: 7px;
      box-shadow: inset 0 0 0 3px #e5b94f, 0 7px 0 rgba(62, 48, 34, .1);
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.16;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .search {
      width: 100%;
      height: 44px;
      margin-bottom: 10px;
      padding: 0 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }
    .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 114, 200, .12); }

    .progress {
      padding: 13px;
      margin-bottom: 12px;
      color: #fff;
      background: var(--ink);
      border-radius: 8px;
    }
    .progressTop { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .progress strong { font-size: 14px; }
    .progress span { color: rgba(255,255,255,.72); font-size: 12px; }
    .meter { height: 7px; margin-top: 10px; overflow: hidden; background: rgba(255,255,255,.18); border-radius: 999px; }
    .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), #61dc8d); }

    .continueBtn {
      width: 100%;
      min-height: 43px;
      margin-bottom: 12px;
      padding: 9px 13px;
      color: #fff;
      font-weight: 800;
      background: var(--red);
      border: 0;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(229, 59, 59, .2);
    }

    .episodeList { display: grid; gap: 8px; }
    .episodeCard {
      width: 100%;
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 11px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .episodeCard.active { border-color: var(--red); box-shadow: 0 8px 20px rgba(23, 32, 51, .08); }
    .episodeCard.done .episodeNo { color: #fff; background: var(--green); }
    .episodeNo {
      width: 43px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 900;
      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 50%;
    }
    .episodeTitle { display: block; font-size: 15px; font-weight: 850; line-height: 1.35; }
    .episodeSummary {
      display: -webkit-box;
      margin-top: 4px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; }

    .readerPane {
      min-width: 0;
      min-height: 100vh;
      padding: 28px clamp(20px, 5vw, 70px) 52px;
      background:
        linear-gradient(90deg, rgba(47,114,200,.06) 1px, transparent 1px),
        linear-gradient(rgba(47,114,200,.06) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
    }

    .reader { width: min(860px, 100%); margin: 0 auto; }
    .mobileBack {
      display: none;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      padding: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 22px;
    }
    .kicker { margin: 0 0 8px; color: var(--red-deep); font-size: 13px; font-weight: 900; }
    .readerTitle { margin: 0; font-size: clamp(27px, 4vw, 42px); line-height: 1.18; }
    .originalTitle { margin: 8px 0 0; color: var(--blue); font-family: "Songti SC", "STSong", serif; font-size: 14px; line-height: 1.55; }
    .readerSummary { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }

    .metaRow {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0 24px;
    }
    .meta {
      padding: 12px 14px;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .meta strong { display: block; margin-bottom: 4px; font-size: 12px; color: var(--blue); }
    .meta span { font-size: 14px; line-height: 1.55; }

    .story { display: grid; gap: 12px; }
    .paragraph {
      position: relative;
      padding: 19px 18px 18px 54px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(23,32,51,.045);
    }
    .paragraph.current { border-color: var(--red); box-shadow: 0 0 0 3px rgba(229,59,59,.1); }
    .paraNo {
      position: absolute;
      top: 18px;
      left: 16px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 900;
    }
    .paragraph p { margin: 0; font-family: "Songti SC", "STSong", serif; font-size: 18px; line-height: 1.95; }
    .markBtn {
      margin-top: 12px;
      padding: 6px 0;
      color: var(--red-deep);
      background: transparent;
      border: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .navRow { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-top: 20px; }
    .navBtn {
      min-height: 44px;
      padding: 9px 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 800;
    }
    .navBtn.primary { color: #fff; background: var(--red); border-color: var(--red); }
    .sourceNote { margin: 22px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .sourceNote a { color: var(--blue); }

    body[data-library="journey"] .catalog { background: rgba(255, 252, 244, .96); }
    body[data-library="journey"] .readerPane {
      background:
        linear-gradient(90deg, rgba(40, 122, 91, .055) 1px, transparent 1px),
        linear-gradient(rgba(197, 58, 50, .045) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
    }
    body[data-library="journey"] .episodeNo {
      color: #fff7dc;
      background: #287a5b;
      border-radius: 7px;
    }

    @media (max-width: 760px) {
      .app { display: block; }
      .catalog { height: auto; min-height: 100vh; border-right: 0; }
      .readerPane { display: none; min-height: 100vh; padding: 18px 14px 40px; }
      body.reading .catalog { display: none; }
      body.reading .readerPane { display: block; }
      .mobileBack { display: grid; place-items: center; }
      .readerTitle { font-size: 30px; }
      .metaRow { grid-template-columns: 1fr; }
      .paragraph { padding: 17px 14px 16px 46px; }
      .paraNo { top: 17px; left: 12px; }
      .paragraph p { font-size: 18px; line-height: 1.9; }
      .navRow { grid-template-columns: 1fr 1fr; }
      .navRow .primary { grid-column: 1 / -1; grid-row: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="catalog">
      <nav class="librarySwitch" aria-label="选择故事">
        <button class="libraryTab active" data-library="pokemon">宝可梦</button>
        <button class="libraryTab" data-library="journey">西游记</button>
      </nav>
      <header class="brand">
        <div class="storyMark ball" id="storyMark" aria-hidden="true"><span>游</span></div>
        <div>
          <h1 id="libraryTitle">宝可梦逐集剧情</h1>
          <p class="subtitle" id="librarySubtitle">无印篇 · 关都篇＋橘子群岛篇 · 第1—116集</p>
        </div>
      </header>
      <input class="search" id="search" type="search" placeholder="搜索标题、地点、人物或宝可梦" aria-label="搜索">
      <section class="progress" aria-label="阅读进度">
        <div class="progressTop"><strong id="progressTitle">准备出发</strong><span id="progressCount">0/116</span></div>
        <div class="meter"><i id="progressMeter"></i></div>
      </section>
      <button class="continueBtn" id="continueBtn">继续上次看到的位置</button>
      <div class="episodeList" id="episodeList"></div>
    </aside>

    <main class="readerPane">
      <div class="reader" id="reader"></div>
    </main>
  </div>

  <script>
    const episodes = [
      {
        no: 1,
        title: "宝可梦！就决定是你了！",
        locations: "真新镇、大木研究所、真新镇郊外、常磐市郊外",
        people: "小智、花子、大木博士、小茂、小霞",
        pokemon: "皮卡丘、波波、小拉达、烈雀、凤王",
        summary: "小智得到不肯听话的皮卡丘，在烈雀群的追击中第一次用行动赢得伙伴的信任。",
        paragraphs: [
          "小智到了可以领取初始宝可梦、独自外出旅行的年纪。出发前一晚，他正在电视里观看一场宝可梦比赛。赛场上，耿鬼迎战尼多力诺。尼多力诺低下头，用头顶的尖角发动角撞，耿鬼灵活地闪到一旁，随后使用催眠术，让尼多力诺陷入沉睡。训练家只好收回尼多力诺，换上体型巨大的大岩蛇。看到这里，小智更加期待自己的旅程，想象着有一天自己也能站在这样的赛场上，成为宝可梦大师。",
          "可是第二天早晨，小智睡过了头。他匆匆赶到大木研究所时，妙蛙种子、小火龙和杰尼龟都已经被其他新人训练家领走。大木博士只好把一只不太愿意亲近人、也不喜欢进入精灵球的皮卡丘交给他，同时给了他宝可梦图鉴和精灵球。",
          "小智很喜欢皮卡丘，刚见面就兴奋地把它抱了起来。皮卡丘却并不信任这个冒失的新主人，立刻释放电击，把小智和大木博士电得浑身发麻。离开研究所后，小智希望皮卡丘进入精灵球，皮卡丘一次次把球拍开，坚持走在外面。小智只好戴上橡胶手套，用绳子拉着不肯配合的皮卡丘上路。",
          "来到真新镇郊外，小智遇见了一只波波。他没有先让宝可梦削弱波波的体力，就直接扔出精灵球，因此捕捉失败。小智请求皮卡丘出战，皮卡丘却坐在一旁，完全不听指挥。途中还有一只小拉达钻进小智的背包寻找食物，让小智第一次意识到，野外旅行远没有自己想象中轻松。",
          "捕捉波波失败后，小智不小心用石头击中了一只烈雀。烈雀受到攻击后立刻俯冲下来，用尖嘴连续袭击小智和皮卡丘。皮卡丘被惹怒了，释放电击，把这只烈雀从空中击落。受伤的烈雀随即呼唤同伴，大群烈雀从天空追来。皮卡丘在围攻中不断受伤，已经没有力气再次释放电击。",
          "小智抱着皮卡丘跳进河里，随后被正在钓鱼的小霞拉上岸。小霞看到皮卡丘伤势严重，告诉小智附近的常磐市有宝可梦中心。烈雀群再次出现后，小智骑走小霞的自行车，载着皮卡丘向常磐市逃去，并答应以后归还。",
          "天空下起暴雨，道路很快变得泥泞不堪。自行车最终失去平衡，小智和皮卡丘一起摔在地上。小智拿出精灵球，请虚弱的皮卡丘先躲进去，但皮卡丘仍然不愿进入精灵球。面对逼近的烈雀群，小智不再逃跑，而是站到皮卡丘前面，张开双臂保护它。",
          "皮卡丘第一次真正感受到，小智虽然冒失，却愿意在危险时挡在自己前面。就在烈雀群即将扑来时，皮卡丘跳上小智的肩膀，又迎着暴雨跃向空中。一道闪电落下，强大的电流汇聚在皮卡丘身上。皮卡丘随即释放出威力巨大的电击，将烈雀群全部击退，也把小霞的自行车烧坏了。",
          "雨停以后，小智和皮卡丘从地上醒来。经过这场危险，他们之间终于建立起最初的信任。此时，一只金色的神秘宝可梦从彩虹前飞过，小智的图鉴无法识别它；这只宝可梦后来被确认是凤王。远方已经能够看见常磐市，小智抱起受伤的皮卡丘，继续向宝可梦中心前进。"
        ]
      },
      {
        no: 2,
        title: "宝可梦中心大对决",
        locations: "常磐市、常磐市宝可梦中心、常磐森林入口",
        people: "小智、小霞、君莎、乔伊、武藏、小次郎",
        pokemon: "皮卡丘、角金鱼、阿柏蛇、瓦斯弹、喵喵、绿毛虫",
        summary: "小智把皮卡丘送进宝可梦中心，并第一次正面遭遇火箭队三人组。",
        paragraphs: [
          "小智抱着重伤的皮卡丘赶到常磐市。由于城里正在警戒偷盗宝可梦的可疑人物，君莎起初把衣服破烂、又带着受伤宝可梦的小智当成嫌疑人。小智出示大木博士交给他的图鉴，身份得到确认后，君莎驾驶摩托车把他送到宝可梦中心。",
          "乔伊立刻把皮卡丘推进治疗室。小智只能在门外等待，这时小霞也追到了宝可梦中心。她本来是来追究自行车被毁的事情，看见皮卡丘还在抢救后，暂时放下了责备。小智也第一次认真意识到，自己的莽撞差一点让伙伴付出很大的代价。",
          "宝可梦中心突然响起警报。火箭队的武藏、小次郎和会说人话的喵喵从屋顶闯入，准备抢走中心里正在治疗的宝可梦。武藏派出阿柏蛇，小次郎派出瓦斯弹；瓦斯弹首先释放浓烟遮住视线，阿柏蛇则在烟雾中向储存精灵球的区域逼近。乔伊启动传送设备，把能够转移的宝可梦送往尼比市。",
          "小智身边没有能够正常战斗的伙伴，只能接连扔出中心里的精灵球。出现的波波和小拉达都不是他的宝可梦，自然不会听从指挥。小霞派出角金鱼，但这里没有足够的水，角金鱼落在地面上无法行动，只能被立刻收回。阿柏蛇和瓦斯弹继续破坏大门，局面越来越危险。",
          "治疗尚未完全结束的皮卡丘在混乱中醒来。中心里其他皮卡丘围到它身边，把电力传给它。小智又踩动小霞那辆已经烧焦的自行车，让车灯的发电装置继续补充电能。皮卡丘吸收电力后使用强力电击，电流与瓦斯弹散布的气体接触，引发巨大爆炸，把武藏、小次郎和喵喵一起炸飞出去。",
          "火箭队虽然失败，却认定这只皮卡丘拥有不同寻常的力量，从此把捕捉它当成长期目标。第二天，恢复精神的皮卡丘与小智离开常磐市，小霞则以要求赔偿自行车为理由跟了上来。三人进入常磐森林不久，小智发现了一只绿毛虫，并拿出精灵球准备进行旅程中的第一次正式收服。"
        ]
      },
      {
        no: 3,
        title: "终于捉到宝可梦了",
        locations: "常磐森林",
        people: "小智、小霞、武藏、小次郎",
        pokemon: "皮卡丘、绿毛虫、比比鸟、阿柏蛇、瓦斯弹、喵喵、铁甲蛹",
        summary: "小智收服绿毛虫和比比鸟；最不起眼的绿毛虫在火箭队面前完成逆转。",
        paragraphs: [

        "群猴为他准备木筏和果子。美猴王独自漂洋过海，学着人类穿衣说话，走过许多城镇和山林。最后，他在西牛贺洲听见樵夫唱仙家歌谣，顺着指引找到灵台方寸山、斜月三星洞，并在洞门外耐心等候菩提祖师。"
      ]],
      [2, "悟空学艺，筋斗云成", "悟彻菩提真妙理，断魔归本合元神", "灵台方寸山、斜月三星洞", "孙悟空、菩提祖师、众师兄", "石猴得名孙悟空，学会七十二般变化和筋斗云，却因炫耀本领被祖师送回花果山。", [
        "菩提祖师见石猴心意坚定，收他做徒弟。祖师问他从哪里来，石猴说自己从花果山水帘洞远渡重洋而来。祖师看他像猢狲，便取一个“孙”姓，又给他起名“悟空”，意思是要他明白世间事物的真正道理。",
        "悟空每天扫地、挑水、听课，从不偷懒。祖师暗中考察他，后来在深夜单独传授长生修炼之法。为了让悟空躲过将来的灾难，祖师又教他七十二般变化。悟空能变飞鸟、树木和各种模样，只是变成大树时，尾巴常常藏不好。",
        "祖师还教悟空驾筋斗云。别人腾云要慢慢升空，悟空翻一个筋斗，便能飞出十万八千里。他高兴极了，日日认真练习，很快把这些本领学得熟练。师兄们请他表演时，悟空一时得意，当众变成一棵松树，引来满堂喝彩。",
        "菩提祖师却严肃地告诉悟空，本领不是用来炫耀的。祖师命他立刻回花果山，并叮嘱他以后不可说出师父姓名。悟空含泪拜别，一个筋斗回到阔别多年的故乡。他不知道，花果山正有一场麻烦等着自己。"
      ]],
      [3, "金箍棒到手，生死簿除名", "四海千山皆拱伏，九幽十类尽除名", "花果山、水帘洞、东海龙宫、幽冥地府", "孙悟空、混世魔王、东海龙王、阎王、牛魔王等", "悟空夺回花果山，得到如意金箍棒，又在地府划去猴类名字，从此声名传遍三界。", [
        "悟空回到花果山，发现混世魔王欺负猴群，还抢走不少小猴。他闯进魔王洞府，先拔一把毫毛变成许多小猴救出伙伴，再打败混世魔王。为了保护家园，悟空教群猴操练，也意识到自己需要一件合手的兵器。",
        "悟空来到东海龙宫。普通刀枪在他手里都太轻，东海龙王只好带他去看定海神针。这根神铁原本用来测量海水，重一万三千五百斤。悟空一握，它便按照心意变成一根金箍棒；想大就大，想小就小，最后还能缩成绣花针藏进耳朵。",
        "几位龙王又送来金冠、金甲和云履。悟空回山后结识牛魔王等六位朋友，大家称兄道弟。一天夜里，地府差人勾走悟空的魂。悟空醒来后十分生气，提着金箍棒闯进幽冥界，问阎王为什么自己学了长生术还会被带来。",
        "悟空翻出生死簿，找到猴属名字，把自己和花果山猴群的姓名全都划掉。龙王和阎王先后到天庭告状，玉皇大帝得知下界出了一个本领高强的猴王。太白金星建议先把他请上天做官，以免立刻发生更大的冲突。"
      ]],
      [4, "弼马温不干了", "官封弼马心何足，名注齐天意未宁", "天宫御马监、南天门、花果山", "孙悟空、玉皇大帝、太白金星、天兵天将、独角鬼王", "悟空得知弼马温只是小官，返回花果山自称齐天大圣；天庭招安后给了他一个有名无职的称号。", [
        "太白金星把悟空请上天庭。玉皇大帝见他会养马，封他做弼马温，管理天马。悟空起初十分高兴，每天查看草料、放马奔跑，把御马监整理得井井有条，所有天马也被养得精神健壮。",
        "一次饮酒时，悟空问同僚弼马温究竟是多大的官，才知道这是个很小的职位。他觉得天庭轻看自己，一怒之下推倒桌案，打出南天门，回到花果山。独角鬼王来投奔，还送他一面写着“齐天大圣”的旗子。",
        "玉帝派托塔天王和哪吒领兵捉拿。巨灵神先来挑战，被悟空一棒打退；哪吒变出三头六臂，悟空也变成三头六臂与他交锋。两人斗得难分高下，悟空用毫毛变出分身迷惑哪吒，随后返回水帘洞。",
        "太白金星再次主张招安。玉帝同意承认“齐天大圣”的名号，在天宫建一座大圣府，却不给悟空具体事务。悟空以为自己真的与天齐高，天天拜访各路神仙，日子过得悠闲，却也为下一场风波埋下了种子。"
      ]],
      [5, "蟠桃园里闯大祸", "乱蟠桃大圣偷丹，反天宫诸神捉怪", "天宫蟠桃园、瑶池、兜率宫、花果山", "孙悟空、王母娘娘、七仙女、太上老君、天兵天将", "悟空偷吃蟠桃、御酒和仙丹，回花果山后与前来捉拿的天兵大战。", [
        "玉帝见悟空闲得四处结交，便让他看守蟠桃园。园中桃树分成三千年、六千年和九千年成熟的品种。悟空听土地介绍后馋得直咽口水，常变成小人躲在树叶间，挑最熟的大桃吃。",
        "王母娘娘准备蟠桃盛会，七仙女来摘桃。悟空得知宴会请了许多神仙，却没有请齐天大圣，心里十分不服。他定住仙女，变成赤脚大仙的样子混入瑶池，先吃仙果，又喝光不少御酒。",
        "酒意上来后，悟空误入太上老君的兜率宫，看见葫芦里装着金丹。他把仙丹当豆子一样吃下，清醒后才知道闯了大祸，连忙逃回花果山。天庭发现蟠桃、御酒和金丹都少了，玉帝命托塔天王率领大军围住花果山。",
        "悟空举起金箍棒迎战，七十二变和毫毛分身让天兵难以靠近。花果山的小猴也守住洞口。天庭众将轮番出战仍拿不下他，只好继续寻找更有办法的帮手。悟空虽然赢了眼前几场，却已惊动整个天宫。"
      ]],
      [6, "二郎神大战孙悟空", "观音赴会问原因，小圣施威降大圣", "花果山、灌江口、天宫", "孙悟空、二郎神、梅山六兄弟、观音菩萨、太上老君", "二郎神与悟空比武又比变化；悟空最终被金刚琢击中，在众神合力下被擒。", [
        "观音菩萨参加蟠桃会时，发现天宫一片混乱。她听完经过，推荐玉帝的外甥二郎神前去捉拿悟空。二郎神带着梅山六兄弟来到花果山，先让伙伴守住水帘洞，自己与悟空在山前交手。",
        "悟空和二郎神都能变出巨大身形，两件兵器撞得山谷回响。悟空见猴群受到惊吓，便缩小身体离开战场。二郎神紧追不放，两人开始比变化：悟空变麻雀，二郎神变鹰；悟空变鱼儿，二郎神又变水鸟追赶。",
        "悟空还变成一座小庙，嘴巴变成庙门，眼睛变成窗户，却不知把尾巴藏在哪里，只好变成旗杆竖在后面。二郎神看出破绽，悟空又逃到灌江口，变成二郎神模样坐在庙里，差一点骗过众人。",
        "太上老君从空中抛下金刚琢，击中悟空。二郎神的细犬也赶来帮忙，众神终于把悟空捉住。刀砍、火烧和雷击都伤不了他，玉帝决定把这个铜头铁臂的猴王交给太上老君，用八卦炉来炼。"
      ]],
      [7, "火眼金睛与五行山", "八卦炉中逃大圣，五行山下定心猿", "兜率宫八卦炉、凌霄殿、五行山", "孙悟空、太上老君、玉皇大帝、如来佛祖", "悟空从八卦炉中炼出火眼金睛，大闹天宫，最终被如来压在五行山下。", [
        "悟空被放进八卦炉，太上老君用神火炼了七七四十九天。悟空躲在炉中风位，性命无碍，烟却把眼睛熏得又红又亮。从此，他能看破许多变化，这双眼睛便被称作火眼金睛。",
        "炉盖一开，悟空跳出来踢倒丹炉，挥舞金箍棒一路打到凌霄殿外。天宫众神拦不住他，玉帝请西天如来佛祖前来。如来问悟空为何争闹，悟空说自己本领高强，也能坐玉帝的位置。",
        "如来请悟空跳出自己的手掌。悟空翻一个筋斗，看见五根大柱，以为到了天边，便在柱上留下记号。等他返回，才发现所谓大柱只是如来的五根手指，自己根本没有离开手掌。",
        "如来翻掌化成五行山，把悟空压在山下，只让头和手露在外面。悟空仍不服气，山顶又多了一道封印。他只能等待愿意带他走上正路的人。花果山的喧闹暂时结束，一场更长的西行故事却正在准备。"
      ]],
      [8, "观音寻找取经人", "我佛造经传极乐，观音奉旨上长安", "西天灵山、流沙河、福陵山、鹰愁涧、五行山、长安", "如来佛祖、观音菩萨、木叉、沙悟净、猪悟能、小白龙、孙悟空", "如来决定把真经传往东土，观音沿途安排取经人的几位未来徒弟。", [
        "五百年后，如来佛祖在灵山讲法，说东土需要能劝人向善的真经。他请观音菩萨寻找一位意志坚定的取经人，让他从长安一路走到西天，用亲身经历证明诚心。观音带着木叉出发，沿途观察合适的护送者。",
        "在流沙河，观音遇见被贬下界的卷帘大将，为他取名沙悟净，约定将来保护取经人。在福陵山，她又点化错投猪胎的天蓬元帅，给他法名猪悟能，让他等待师父。",
        "到了鹰愁涧，西海龙王三太子因犯错等候处罚。观音答应给他改过机会，将来化作白马驮取经人。在五行山下，悟空也愿意护送取经人，以此离开山下、修正自己的急躁和骄傲。",
        "观音最终来到长安，暂时化作普通僧人寻找最合适的人。她带着锦襕袈裟和九环锡杖，等待水陆大会举行。取经队伍的成员虽还没有见面，他们的命运已经被一条通向西方的道路连在一起。"
      ]],
      [9, "江流儿长大成玄奘", "陈光蕊赴任逢灾，江流僧复仇报本", "长安、洪江渡口、金山寺、江州", "陈光蕊、殷温娇、刘洪、法明长老、江流儿", "陈光蕊赴任途中遭人暗算，幼子江流儿被寺院救下，长大后查清身世、让家人团聚。", [
        "长安才子陈光蕊高中状元，与殷温娇成亲后前往江州任职。渡过洪江时，船夫刘洪起了坏心，暗算陈光蕊，又冒充他的身份去做官。殷温娇为了保护腹中孩子，只得暂时忍耐，寻找揭开真相的机会。",
        "孩子出生后，殷温娇担心刘洪伤害他，便留下血书和信物，把婴儿放在木板上送入江中。金山寺法明长老发现孩子，把他救起，取名江流儿。江流儿在寺中长大，聪明好学，十八岁时出家，法名玄奘。",
        "法明长老把当年的血书交给玄奘。玄奘找到母亲，又前往长安求助外祖父殷开山。官兵赶到江州，刘洪的冒名骗局终于被揭穿。洪江龙王也救护了当年落水的陈光蕊，使他有机会重回家人身边。",
        "一家人经历许多波折后终于相认。玄奘没有留恋安稳富贵，仍回到寺中认真修行。他懂得失散和团聚的珍贵，也愿意用一生帮助别人。后来，他被选中主持长安水陆大会，新的使命即将到来。"
      ]],
      [10, "泾河龙王犯天条", "老龙王拙计犯天条，魏丞相遗书托冥吏", "长安城、泾河龙宫、皇宫", "袁守诚、泾河龙王、唐太宗、魏征", "泾河龙王为赌胜私改降雨时辰和数量，违反天条，只得向唐太宗求救。", [
        "长安城里有位算卦先生袁守诚，能准确告诉渔夫哪里容易捕鱼。泾河龙王担心水族被捉光，化成人形找他理论。两人打赌第二天何时下雨、下多少雨，龙王认为雨归自己管，一定能赢。",
        "没想到龙王回宫后就接到天庭命令，时辰和雨量与袁守诚说得分毫不差。为了面子，龙王故意改了下雨的时间和数量。赌虽然看似赢了，他却违反天条，将由大臣魏征在梦中执行处罚。",
        "龙王害怕了，再次求袁守诚指点。袁守诚告诉他，只有请唐太宗拖住魏征，或许能躲过一劫。龙王夜里进入太宗梦中哀求，太宗答应第二天把魏征留在身边，不让他离开。",
        "第二天，太宗请魏征下棋。魏征下着下着睡着了，神思却在梦中完成天命。龙王没有逃过结果，怨自己求救未成。太宗虽然没有故意失信，心中仍十分不安，夜里开始听见宫门外的呼喊。"
      ]],
      [11, "唐太宗地府还魂", "游地府太宗还魂，进瓜果刘全续配", "长安皇宫、幽冥地府、还阳路", "唐太宗、魏征、崔判官、阎王、刘全", "唐太宗因泾河龙王之事游历地府，在崔判官帮助下还魂，并决定举办水陆大会。", [
        "泾河龙王的魂魄夜夜来找唐太宗，太宗受到惊吓，病得越来越重。一天，他的魂魄离开身体来到幽冥地府。龙王迎面指责他没有救自己，幸好判官和阴差查明，魏征执行的是天命，太宗并未故意害他。",
        "崔判官查看生死簿，发现太宗阳寿未尽，便暗中添上年数，护送他还阳。路上，太宗看见许多因生前做错事而后悔的魂魄，也明白在世时每一个选择都会留下结果。",
        "经过枉死城时，许多魂魄拦路求助。太宗答应回到人间后做法事、施舍钱粮，请他们让出道路。过奈河桥、还魂关后，他终于在宫中醒来，群臣又惊又喜。",
        "太宗遵守承诺，安葬无主遗骨，帮助贫苦百姓，并准备举行盛大的水陆大会，为亡者祈福。他还需要一位德行和学问都出众的高僧主持法会，玄奘的名字因此被推举出来。"
      ]],
      [12, "玄奘奉旨去西天", "玄奘秉诚建大会，观音显象化金蝉", "长安化生寺、皇宫、洪福寺、长安城外", "玄奘、唐太宗、观音菩萨、木叉", "观音在水陆大会上说明大乘真经所在，玄奘发愿西行，唐太宗与他结为兄弟并赐号三藏。", [
        "玄奘被选为水陆大会的主讲高僧。法会开始后，一位看似普通的僧人拿来锦襕袈裟和九环锡杖。唐太宗买下两件宝物送给玄奘，城中百姓纷纷来看披上袈裟的高僧。",
        "那位僧人正是观音所化。她登上高台告诉众人，眼前所讲只是小乘法门，西天灵山有能劝人向善、解开心结的大乘真经。说完，观音与木叉显出真身，乘祥云而去。",
        "玄奘当众发愿，无论路有多远、山有多高，都愿前往西天求取真经。唐太宗深受感动，与玄奘结为兄弟，赐他“三藏”称号，又交给通关文牒和一只紫金钵盂。",
        "出发那天，太宗在长安城外为三藏送行。他从地上捻起一撮故乡泥土放进酒里，提醒三藏宁可留恋故乡一把土，也不要贪图异乡万两金。三藏饮下送行酒，带着两名随从和一匹白马向西而去。"
      ]],
      [13, "双叉岭上的第一难", "陷虎穴金星解厄，双叉岭伯钦留僧", "巩州城、双叉岭、镇山太保庄院", "唐三藏、两名随从、寅将军、太白金星、刘伯钦", "三藏刚离开大唐便在双叉岭遇险，失去随从后得到太白金星和猎户刘伯钦帮助。", [
        "三藏一行天还没亮便赶路，不料连人带马跌入山中陷坑。寅将军和两个妖怪出现，抓住三人。三藏眼看两名随从遇害，自己吓得几乎说不出话来，第一次明白西行绝不是一趟普通旅行。",
        "危急时，一位白胡子老人赶走妖怪，解开绳索。老人转眼乘光而去，留下字条说明自己是太白金星。三藏独自牵马前行，山中又有猛虎和长蛇靠近。",
        "镇山太保刘伯钦赶来，挥叉赶走猛虎，把三藏接回家中。刘家人为三藏准备素饭，请他为去世的父亲诵经。夜里，刘家人梦见老人道谢，知道三藏的诵经带来了安慰。",
        "第二天，刘伯钦护送三藏来到大唐边界，再往前便是鞑靼地界。伯钦不能离国，只能在山口告别。三藏正为独行担忧，忽然听见山脚下有人高声喊：“师父，快来救我出去！”"
      ]],
      [14, "五行山下收悟空", "心猿归正，六贼无踪", "五行山、山间道路、农家", "唐三藏、孙悟空、观音菩萨、六名强盗", "三藏揭下封印救出悟空；悟空戴上紧箍，正式成为保护师父的大徒弟。", [
        "压在五行山下的正是孙悟空。他告诉三藏，观音曾答应让自己保护取经人，只要师父揭下山顶封印，他就能出来。三藏爬上山顶拜告，封印随风飞走。悟空让师父退远，接着一声巨响跳出山来。",
        "悟空拜三藏为师，收起从前的张扬，牵马护送他西行。他打死一只扑来的猛虎，用虎皮做成短裙。途中六名强盗拦路，悟空出手太重，三藏责怪他没有慈悲心。悟空受不了唠叨，一气之下离开。",
        "观音化作老妇人，把一顶花帽和紧箍咒教给三藏。悟空冷静后回来，看见花帽漂亮便戴在头上。三藏念起咒语，帽中金箍立刻收紧。悟空疼得翻滚，这才知道师父有办法约束自己。",
        "悟空虽然生气，听说是观音安排，也明白这是对急躁性情的提醒。他答应以后保护师父，不再随意离队。师徒两人重新上路，从这一天起，“孙悟空”不仅是花果山大王，也成了取经队伍的行者。"
      ]],
      [15, "鹰愁涧里白龙化马", "蛇盘山诸神暗佑，鹰愁涧意马收缰", "蛇盘山、鹰愁涧", "唐三藏、孙悟空、小白龙、观音菩萨", "白龙吞掉三藏的马，得知取经使命后化作白马，成为一路驮负师父的伙伴。", [
        "师徒来到蛇盘山鹰愁涧，一条白龙突然冲出水面，一口吞掉三藏的马。悟空把师父安置在安全处，钻进深涧挑战。白龙与悟空交手几次，知道不是对手，缩小身体藏进水底。",
        "悟空找不到白龙，只得请土地和山神打听。众神告诉他，这条龙也是观音为取经人安排的伙伴。悟空唤来观音，才知道白龙原是西海龙王三太子，因犯错被罚，在这里等候取经人。",
        "白龙不知道眼前和尚就是师父，才误吞坐骑。他向三藏赔礼，随后收起龙角和鳞片，变成一匹毛色雪白、四蹄稳健的白马。观音还摘下柳叶，变成鞍辔套在马身上。",
        "三藏骑上白龙马，悟空提棒随行。白龙马不会多说话，却从此踏过山岭、河谷、风雪和沙漠，安静地驮着经书与师父。取经队伍有了第二位伙伴，西方的路也显得更清楚了。"
      ]],
      [16, "一件袈裟引来的大火", "观音院僧谋宝贝，黑风山怪窃袈裟", "观音禅院、黑风山", "唐三藏、孙悟空、金池长老、黑熊精、广智和尚", "金池长老因贪看锦襕袈裟而纵火，黑熊精趁乱偷走袈裟。", [
        "三藏与悟空借宿观音禅院。院主金池长老收藏了许多袈裟，听说三藏有观音所赠的锦襕袈裟，便一定要看。袈裟展开后满室生光，金池又羡慕又不舍，竟想把宝物永远留下。",
        "几名和尚想趁夜放火，假装意外烧掉客房。悟空听见动静，借来避火罩保护师父，却没有顾全整座寺院。风一吹，火越烧越旺。黑风山的黑熊精看见火光，本来想来救火，却发现锦襕袈裟，便偷偷带走。",
        "第二天，寺院化为灰烬，三藏虽平安，袈裟却不见了。悟空追问后找到黑风洞。黑熊精承认自己拿了袈裟，还邀请朋友举办“佛衣会”，要把宝贝拿出来观赏。",
        "悟空与黑熊精从山洞打到云端，对方力气很大，天黑后又关门不出。悟空知道硬打不容易，决定去南海请观音帮助。三藏留在寺院等待，也从这场大火明白，炫耀珍宝常会引出不必要的麻烦。"
      ]],
      [17, "观音收服黑熊精", "孙行者大闹黑风山，观世音收伏熊罴怪", "黑风山黑风洞、南海紫竹林", "孙悟空、观音菩萨、黑熊精、凌虚子", "悟空与观音巧设办法，让黑熊精吞下仙丹变成的悟空，最终归还袈裟、皈依南海。", [
        "悟空再次来到黑风洞，先打败赴宴的蛇精，又变成他的模样混入洞中。黑熊精谈起袈裟时发现来客答非所问，认出悟空，双方又斗起来。悟空虽能取胜，却很难在洞门紧闭时把袈裟拿回。",
        "观音随悟空来到黑风山。她变成黑熊精的朋友凌虚子，悟空则缩小成一粒仙丹。黑熊精见“凌虚子”送来贺礼，毫不怀疑地把仙丹吞进肚子。",
        "悟空在黑熊精肚里翻腾，还用金箍棒轻轻抵住他的心口。黑熊精疼得满地打滚，只得求饶。观音现出真身，给他戴上禁箍，命他归还锦襕袈裟。",
        "袈裟失而复得，三藏终于安心。观音见黑熊精守山有些本领，带他去南海看守落伽山后院，让他用力量做正事。悟空也吸取教训：保护师父不能只顾眼前，更要想到事情可能带来的后果。"
      ]],
      [18, "高老庄来了猪八戒", "观音院唐僧脱难，高老庄行者降魔", "高老庄、高家后院、云栈洞", "唐三藏、孙悟空、猪刚鬣、高太公、高翠兰", "悟空在高老庄识破猪刚鬣，得知他也在等待取经人。", [
        "师徒来到高老庄，听见高太公为女儿发愁。三年前，一位能干的女婿来到家中，耕田收粮样样都会，后来却露出长嘴大耳的模样，把高翠兰关在后院。高家请过许多人，都赶不走他。",
        "悟空变成高翠兰坐在房里等候。夜里，猪刚鬣回来，没看出眼前人是悟空。悟空故意问东问西，得知他虽模样奇怪，却一直干活养家，并没有吃掉谁，只是脾气粗、方法也不对。",
        "悟空现出本相，追着猪刚鬣来到云栈洞。两人从夜里打到天亮。猪刚鬣听见“取经人”三个字，立刻放下钉耙，说观音早给他取名猪悟能，让他在这里等候师父。",
        "三藏为他剃度，又取了容易记的别名“八戒”，提醒他改掉贪吃、贪睡和冲动。八戒向高家道别，挑起行李跟随师父。队伍从两人一马变成三人一马，一路上也多了许多热闹。"
      ]],
      [19, "八戒入队，乌巢传经", "云栈洞悟空收八戒，浮屠山玄奘受心经", "云栈洞、浮屠山乌巢", "唐三藏、孙悟空、猪八戒、乌巢禅师", "八戒正式拜师并承担行李；乌巢禅师传给三藏《心经》，提醒他们前路要守住本心。", [
        "八戒收拾云栈洞的东西，把一部分粮食送还高家，正式随三藏上路。悟空担心他半途而废，一路故意拿话试探。八戒嘴上抱怨行李重，遇到陡坡却仍老老实实挑着担子。",
        "他们来到浮屠山，见一位乌巢禅师住在树上的草窝里。禅师认得三藏，也知道悟空和八戒的来历。他传给三藏一篇简短的《心经》，告诉他遇到恐惧和迷惑时，要看清自己的心。",
        "八戒听见禅师说前路有妖怪，连忙追问能不能换条轻松的路。禅师只说道路虽难，只要师徒同心便能通过。悟空觉得禅师话中有话，想追上去问，对方却化作金光消失。",
        "三藏把《心经》牢记在心。悟空负责探路和降妖，八戒挑担并协助，白龙马驮着师父。大家性格不同，常会争吵，但共同目标越来越清楚：不是谁一个人逞强，而是一起把这条路走完。"
      ]],
      [20, "黄风岭上怪风起", "黄风岭唐僧有难，半山中八戒争先", "黄风岭、黄风洞", "唐三藏、孙悟空、猪八戒、虎先锋、黄风怪", "黄风怪的虎先锋抓走三藏；悟空和八戒追到黄风洞，却遇上能吹怪风的强敌。", [
        "师徒走进黄风岭，山间忽然刮起怪风。一只虎妖变作受伤的普通老虎躺在路旁，趁大家分神时卷走三藏。悟空和八戒追上去，八戒抢先挥动九齿钉耙，与虎先锋大战。",
        "虎先锋抵挡不住，使用金蝉脱壳之法，把一张虎皮留在原地，真身逃回黄风洞。悟空和八戒根据山神指引找到洞口，高声叫阵。虎先锋再次出洞，被八戒拦住，最终无法继续作恶。",
        "黄风怪亲自出来。他手持三股钢叉，与悟空斗了许久仍不分胜负。眼看难以取胜，黄风怪张口吹出三昧神风，天地立刻昏黄一片，砂石像雨点一样飞舞。",
        "悟空用手遮眼仍被风吹伤，只好退到背风处。八戒守着师父可能被关押的方向，不敢乱闯。悟空听土地说，这种怪风只有灵吉菩萨的定风丹和飞龙杖能克制，便决定前往须弥山求助。"
      ]],
      [21, "灵吉菩萨定住黄风", "护法设庄留大圣，须弥灵吉定风魔", "黄风岭、须弥山", "孙悟空、猪八戒、灵吉菩萨、黄风怪、护法伽蓝", "灵吉菩萨用定风丹保护悟空，以飞龙杖收服黄风怪，救出三藏。", [
        "悟空眼睛受伤，在山路上遇见一户人家。主人用清凉药水替他洗眼，疼痛很快减轻。天亮后，屋舍化为树林，悟空才知道昨夜是护法神变成庄院，特意来帮助取经人。",
        "悟空赶到须弥山，请灵吉菩萨出手。灵吉给他一粒定风丹，让他含在口中，黄风再大也吹不动身体。两人返回黄风岭，悟空重新在洞外叫阵。",
        "黄风怪果然又吹三昧神风。悟空这次稳稳站在风中，一步步向前。灵吉从空中抛出飞龙杖，化成金龙抓住妖怪。原来黄风怪本是一只黄毛貂鼠，偷吃灵山灯油后逃到这里。",
        "黄风怪被带回灵山，三藏也从洞中获救。八戒忙着说明自己一直守在附近，悟空则笑他没少打瞌睡。师徒重整行李继续赶路，悟空的眼睛恢复明亮，也更懂得遇到特殊本领时不能只靠硬拼。"
      ]],
      [22, "流沙河收下沙悟净", "八戒大战流沙河，木叉奉法收悟净", "流沙河、河岸石碑", "唐三藏、孙悟空、猪八戒、沙悟净、木叉、观音菩萨", "八戒下水大战流沙河怪，木叉说明其身份；沙悟净拜师后，取经四人终于聚齐。", [
        "前方出现一条八百里宽的流沙河，河水翻滚，连鹅毛都浮不起来。一个红发蓝脸的水怪冲出河面，扑向三藏。八戒挡住他，两人从岸上打进水中，又从水底打回浪头。",
        "悟空水中本领不如八戒，便让八戒把妖怪引上岸。水怪十分谨慎，一见悟空举棒就钻回深水。师兄弟试了几次都不成功，只得请观音菩萨派来的木叉帮忙。",
        "木叉叫出水怪的法名“悟净”。原来他曾是天宫卷帘大将，被贬到流沙河后一直等待取经人。悟净颈上挂着九个取经人的旧骷髅，只有这些骷髅不会沉入河底。",
        "观音用葫芦和骷髅结成法船，让三藏安全渡河。悟净拜三藏为师，大家称他沙和尚。他接过行李担子，八戒顿时轻松不少。至此，悟空、八戒、沙僧和白龙马都已到齐，真正的取经队伍完整了。"
      ]],
      [23, "四位菩萨试真心", "三藏不忘本，四圣试禅心", "山中庄院", "唐三藏、孙悟空、猪八戒、沙悟净、观音菩萨等四圣", "四位菩萨化成母女试探师徒是否贪恋富贵；八戒心动受罚，其余三人守住取经心愿。", [
        "师徒在山中看见一座富丽庄院，女主人带着三个女儿热情招待。她说家中有田地财宝，却没有男子照管，愿意从四位师徒中挑选夫婿，让他们从此过安稳富贵的生活。",
        "三藏低头不答，悟空早看出其中不寻常，只在旁边微笑。沙僧明确说自己已经答应保护师父去西天。只有八戒越听越心动，夜里悄悄找到女主人，说自己愿意留下。",
        "女主人让八戒蒙住眼睛，在三个女儿中抓一个。八戒追来追去谁也抓不住，最后撞得头晕。等他摘下布，庄院和母女都不见了，自己被绑在树上，面前留下一张字条。",
        "原来观音、文殊、普贤和黎山老母化作母女，专门试探他们的心。悟空救下八戒，大家没有一直嘲笑他，只提醒他别再轻易被好吃、舒服和漂亮迷住。八戒羞红了脸，重新挑起行李上路。"
      ]],
      [24, "五庄观偷吃人参果", "万寿山大仙留故友，五庄观行者窃人参", "万寿山五庄观", "唐三藏、孙悟空、猪八戒、沙悟净、清风、明月、镇元大仙", "悟空三人偷吃人参果，又因误会与清风明月争执。", [
        "师徒来到万寿山五庄观。观主镇元大仙外出前，吩咐童子清风、明月用两枚人参果招待故友唐三藏。这种果子三千年开花、三千年结果，长得像小娃娃，闻一闻都能延年益寿。",
        "三藏见果子像婴儿，怎么也不肯吃。清风明月只好自己吃掉。八戒听见消息，馋得坐立不安，央求悟空去园里看看。悟空拿金击子打下果子，第一枚落地即钻入土中，后来才知道必须用丝帕接住。",
        "悟空、八戒和沙僧分吃三枚人参果。八戒吞得太快，几乎没尝到味道，还想再要。清风明月清点果子后发现少了，来质问师徒。悟空起初不承认，童子气急说出许多难听的话。",
        "悟空最受不了辱骂，深夜来到果园，一棒推倒人参果树。大树连根倒下，满树果子遇土而消失。悟空冷静后也知道闯祸不小，连夜叫醒师父和师弟，大家匆匆离开五庄观。"
      ]],
      [25, "镇元大仙追上来了", "镇元仙赶捉取经僧，孙行者大闹五庄观", "万寿山、五庄观", "唐三藏、孙悟空、猪八戒、沙悟净、镇元大仙", "镇元大仙用袖里乾坤捉回师徒；悟空几次逃脱仍失败，只得答应寻找救树办法。", [
        "镇元大仙回到五庄观，看见人参果树倒了，立刻追赶取经队伍。他展开衣袖，使出袖里乾坤，把师徒四人连人带马全部收入袖中，转眼带回观里。",
        "大仙命童子把悟空绑在柱上责罚。悟空拔毫毛变出替身，真身躲到一旁；第二次又把石狮子变成自己的样子。大仙每次都能看出端倪，却也发现这只猴子虽顽皮，确实很有本领。",
        "悟空带大家连夜逃跑，镇元大仙再次追上。他的拂尘和悟空的金箍棒斗得难分高下，最后又用袖子收走众人。三藏劝悟空不要再一味逃避，推倒别人的宝树，就应该想办法弥补。",
        "悟空答应三天内找到救活果树的方法。镇元大仙暂时放开师徒，却留下三藏、八戒和沙僧作保证。悟空翻筋斗离开万寿山，开始到海上仙山拜访各位神仙，寻找能让仙树重新生长的药方。"
      ]],
      [26, "甘泉救活人参果树", "孙悟空三岛求方，观世音甘泉活树", "蓬莱、方丈、瀛洲、南海、五庄观", "孙悟空、福禄寿三星、观音菩萨、镇元大仙", "悟空四处求方，观音用净瓶甘露救活宝树；镇元大仙与悟空结为兄弟。", [
        "悟空先后到蓬莱、方丈和瀛洲三座仙山，向福禄寿三星和各位仙人求助。大家都愿意去五庄观替他多争取时间，却没有谁能救活遇土即入的人参果树。",
        "悟空赶到南海，观音告诉他，净瓶里的甘露水能医仙树。观音带着悟空返回五庄观，先让众人退开，再把柳枝蘸上甘露，一滴滴洒在枯根和断枝上。",
        "人参果树慢慢立起，枝叶重新变绿，地下消失的果子也回到树上。镇元大仙清点后，果子一个不少。他设宴感谢观音，又拿出人参果请师徒和众仙品尝。",
        "三藏这次亲眼看见果子从树上长出，终于放心尝了一口。镇元大仙佩服悟空肯为错误奔走补救，与他结为兄弟。师徒离开五庄观时，悟空也记住：真正的本领不只是打赢对手，还包括把自己弄坏的事情修好。"
      ]],
      [27, "三打白骨精", "尸魔三戏唐三藏，圣僧恨逐美猴王", "白虎岭、山间树林", "唐三藏、孙悟空、猪八戒、沙悟净、白骨精", "白骨精三次变化接近三藏；悟空看破伪装，却因师父误会而被赶回花果山。", [
        "师徒走到白虎岭，悟空去远处摘果子。白骨精想抓三藏，先变成提着斋饭的年轻女子。悟空用火眼金睛认出妖气，一棒打散假身，妖怪却留下躯壳逃走。三藏只看见悟空打人，十分生气。",
        "白骨精第二次变成寻找女儿的老妇人，第三次又变成白发老公公。悟空每次都能识破，八戒却在旁边说是悟空故意伤人。第三次，悟空终于打散妖怪真身，地上留下写着“白骨夫人”的白骨。",
        "三藏没有看清变化，只觉得悟空接连不听劝告，念起紧箍咒，要赶他离开。悟空苦苦说明妖怪会再来，三藏仍写下贬书。悟空含泪拜别，又拔下毫毛送给师父，告诉他有危险时喊自己的名字。",
        "悟空回到花果山，群猴欢喜迎接。三藏带着八戒、沙僧继续西行，队伍却失去了最善于识破变化的人。白骨精虽然已经被除掉，这场误会带来的后果才刚刚开始。"
      ]],
      [28, "黑松林里师父又遇险", "花果山群妖聚义，黑松林三藏逢魔", "花果山、黑松林、碗子山波月洞", "孙悟空、唐三藏、猪八戒、沙悟净、黄袍怪", "悟空留在花果山；三藏独自化斋时误入波月洞，被黄袍怪捉住。", [
        "悟空回到花果山，赶走占山的小妖，重新整理水帘洞。猴群劝他从此别再去受紧箍咒的气，可悟空看着西方，心里仍惦记师父有没有安全过山。",
        "另一边，三藏让八戒去化斋。八戒走累后躲进草丛睡觉，三藏久等不回，决定自己找些吃的。他穿过黑松林，看见一座漂亮石塔，以为是寺院，进去后才发现是黄袍怪的波月洞。",
        "黄袍怪把三藏关起来。洞中的百花羞公主其实是宝象国国王的女儿，十三年前被妖怪带来。她不愿三藏受害，写下一封家书，请他若能脱身，代自己送回父母手中。",
        "八戒和沙僧找到洞口，与黄袍怪交战。公主暗中说情，黄袍怪假装守信，放三藏离开。师徒带着家书走向宝象国，却不知道黄袍怪并不打算让这件事就此结束。"
      ]],
      [29, "宝象国求救", "脱难江流来国土，承恩八戒转山林", "宝象国王宫、波月洞、黑松林", "唐三藏、猪八戒、沙悟净、百花羞、黄袍怪、宝象国国王", "三藏替百花羞送信，国王请求救回公主；八戒与沙僧再战黄袍怪。", [
        "三藏来到宝象国，把百花羞的家书交给国王。国王得知失踪十三年的女儿仍活着，既惊喜又难过，请三藏的徒弟降服妖怪、接公主回家。八戒一口答应，沙僧也随他返回波月洞。",
        "八戒和沙僧联手迎战黄袍怪。起初两人还能互相照应，八戒打久了却胆怯逃走，只剩沙僧坚持。黄袍怪捉住沙僧，又知道三藏已经把信送到宝象国，便化作英俊男子前往王宫。",
        "黄袍怪自称是公主的丈夫，说三藏才是危险的妖怪。为了让谎话像真的，他在宴会上施法，把三藏变成一只斑斓猛虎，关进铁笼。国王和大臣都被眼前景象骗住。",
        "白龙马看见师父受困，夜里变成宫女刺探黄袍怪，又拔剑相斗，却因力量不敌受了伤。他回到马厩，催八戒赶快去花果山请悟空。八戒虽然害怕见师兄，也知道只有悟空能解开这场危机。"
      ]],
      [30, "白龙马智斗黄袍怪", "邪魔侵正法，意马忆心猿", "宝象国王宫、花果山", "白龙马、猪八戒、孙悟空、黄袍怪、唐三藏", "白龙马为救师父显出人形迎战；八戒赶往花果山请悟空归队。", [
        "黄袍怪在宝象国饮酒庆贺，白龙马担心三藏被一直关着，便变成一位宫女上前献舞。趁妖怪放松时，他抽出宝剑进攻。黄袍怪很快认出白龙，举刀迎战。",
        "白龙马奋力抵挡，仍被打伤，只得恢复马身逃回马厩。他告诉八戒，沙僧被捉、师父变虎，自己也无力再战，必须请大师兄回来。八戒想起是自己常在师父面前说悟空坏话，心里很惭愧。",
        "八戒来到花果山，先好声好气邀请，悟空故意说自己已经被逐出师门。八戒为了激他，谎称黄袍怪在背后骂他胆小。悟空果然跳起来，要亲自去问个明白。",
        "走到半路，八戒才承认是为了救师父才这样说。悟空没有真生气，他其实早就挂念三藏。两人一同赶往宝象国。悟空先看望受伤的白龙马，又仔细询问事情经过，准备从妖怪的来历下手。"
      ]],
      [31, "悟空归队降黄袍", "猪八戒义激猴王，孙行者智降妖怪", "宝象国、波月洞、天宫", "孙悟空、猪八戒、沙悟净、黄袍怪、百花羞、奎木狼", "悟空查出黄袍怪是奎木狼星下凡，救出师父和公主，并重新回到取经队伍。", [
        "悟空变成公主模样进入波月洞，骗黄袍怪拿出宝物，又在近处突然动手。黄袍怪逃到天宫躲藏，悟空查点星宿，发现二十八宿中少了奎木狼。",
        "玉帝派星官把奎木狼召回。原来他私自下界化作黄袍怪，与百花羞有一段前缘，却用强迫的方式把她留在洞中。奎木狼被带回天庭受罚，沙僧和公主得到自由。",
        "悟空回到宝象国，吹一口仙气让三藏恢复人形。国王终于认回女儿，对师徒连连道谢。三藏知道自己误会了悟空，既羞愧又高兴，请他继续留下。",
        "悟空没有抓着旧事不放，只叫师父以后遇见变化先听他解释。八戒也承认自己曾搬弄是非。四位师徒重新站在一起，白龙马的伤逐渐恢复，队伍带着比从前更多的一点信任再次西行。"
      ]],
      [32, "平顶山两位魔王", "平顶山功曹传信，莲花洞木母逢灾", "平顶山、莲花洞", "唐三藏、孙悟空、猪八戒、沙悟净、金角大王、银角大王、日值功曹", "金角银角得到消息，派小妖巡山；八戒偷懒被抓，悟空开始试探妖怪的宝贝。", [
        "师徒来到平顶山，日值功曹变成樵夫提醒悟空，山中莲花洞有金角大王和银角大王，手里有五件厉害宝贝。悟空担心师父，让八戒先去巡山。",
        "八戒走出不远就钻进草丛睡觉，还编好一套假话准备回去交差。悟空变成小虫听见，故意先回去揭穿他。八戒只好重新巡山，正遇见银角大王。",
        "银角变化成普通人试探八戒，又带小妖围住他。八戒挥钉耙抵抗，最终被捉进莲花洞。妖怪从他口中得知唐僧就在后面，准备亲自去抓。",
        "悟空让沙僧保护师父，自己变化成小妖探查。他听说紫金红葫芦和羊脂玉净瓶只要叫人名字、对方答应，就能把人装进去；还有七星宝剑、芭蕉扇和幌金绳。悟空决定不能硬闯，要先想办法骗走宝物。"
      ]],
      [33, "银角大王搬来三座山", "外道迷真性，元神助本心", "平顶山、莲花洞、压龙山", "孙悟空、银角大王、山神土地、唐三藏、沙悟净", "银角用三座大山压住悟空并抓走三藏；山神救出悟空后，他化身小妖准备换宝。", [
        "银角大王变成受伤老人躺在路边，请三藏背他。悟空知道有诈，却不能丢下师父，只好把老人背起。银角暗中调来须弥山、峨眉山和泰山，一座接一座压在悟空背上。",
        "悟空被压得动弹不得。银角趁机抓走三藏和沙僧。当地山神、土地发现压住的是齐天大圣，赶紧移开山峰。悟空脱身后没有立刻追打，而是变成银角派去请老母亲的小妖。",
        "真正的小妖带着幌金绳去压龙山，悟空半路拦住，换上他的衣服。他来到压龙洞，发现所谓老母亲是一只九尾狐狸，手里掌管幌金绳。",
        "悟空骗到宝绳，又变成九尾狐狸的模样前往莲花洞。途中，他担心金角银角太熟悉母亲，会被看穿，于是继续观察妖怪的口令和习惯，准备在洞中随机应变。"
      ]],
      [34, "悟空巧骗葫芦宝瓶", "魔王巧算困心猿，大圣腾挪骗宝贝", "莲花洞、平顶山", "孙悟空、金角大王、银角大王、猪八戒、沙悟净", "悟空假扮小妖与魔王斗智，几次被宝物装入，又设法逃脱并换走葫芦和净瓶。", [
        "悟空变成老母亲到莲花洞，险些骗过金角银角。小妖报告真老母亲没有到来，魔王起了疑心。悟空立刻现出本相救人，却被叫中名字，答应一声后收进紫金红葫芦。",
        "妖怪以为悟空很快会化成水，晃了晃葫芦。悟空拔毫毛变成自己留在里面，真身变成小虫，从盖子缝隙钻出。他又变成小妖，谎称自己的假葫芦能把天装进去。",
        "金角想看看奇事，悟空请日游神等把天空暂时遮暗，魔王果然相信。双方交换葫芦，悟空得到了真宝贝。后来他又用相似办法骗走羊脂玉净瓶。",
        "银角发现受骗，带宝剑和芭蕉扇追赶。悟空一边躲避扇出的烈火，一边寻找叫对方名字的机会。八戒和沙僧仍被绑在洞中，悟空知道必须尽快把两个魔王分开，才能逐个收服。"
      ]],
      [35, "老君领回金角银角", "外道施威欺正性，心猿获宝伏邪魔", "平顶山莲花洞、天宫", "孙悟空、金角大王、银角大王、太上老君、唐三藏", "悟空用夺来的宝物收服二魔；太上老君说明他们是看炉童子，取回五件法宝。", [
        "银角拿幌金绳捆住悟空，却不知道悟空已经学会松绳咒。悟空脱身后反用绳子困住银角，又叫他名字。银角答应一声，被收入葫芦。",
        "金角拿着芭蕉扇和七星剑拼命抵抗。悟空与八戒、沙僧里应外合，救出三藏，再用玉净瓶收住金角。洞中小妖四散，莲花洞终于安静下来。",
        "太上老君从天而降，说金角银角原是兜率宫看守金炉、银炉的童子。他们带着五件法宝下界，是取经路上的一次考验。悟空确认师父安全后，把葫芦、净瓶、宝剑、宝扇和宝绳全部归还。",
        "金角银角恢复童子模样，随老君回宫。八戒看着宝物被带走很舍不得，悟空笑他什么都想留。三藏则提醒大家，法宝本身没有好坏，落在不同的人手里，就会带来完全不同的结果。"
      ]],
      [36, "宝林寺夜半来客", "心猿正处诸缘伏，劈破旁门见月明", "乌鸡国宝林寺", "唐三藏、孙悟空、猪八戒、沙悟净、寺中僧人、乌鸡国王魂魄", "宝林寺僧人先拒绝借宿，悟空争得住处；夜里，一位国王的魂魄来向三藏求助。", [
        "师徒来到乌鸡国宝林寺，僧人见他们风尘仆仆，不愿接待。三藏客气请求仍被拒绝，悟空便把锡杖变得又粗又重，轻轻放在地上，告诉众僧若连一根杖都抬不动，就别小看远道而来的客人。",
        "僧人们这才安排房间和斋饭。夜深后，三藏独自诵经，一阵冷风吹过，一位浑身湿漉漉的国王魂魄走进房中，请他不要害怕。",
        "国王说，三年前有位道士帮乌鸡国求来雨水，取得自己信任，后来却把他推进御花园井中，变成他的模样做了国王。真正的王后和太子至今都不知道身边的人是假冒的。",
        "国王留下金厢白玉圭作为证据，请三藏救自己国家。天亮后，三藏把梦中经过告诉悟空。悟空判断妖怪变化高明，决定先让太子知道真相，再去井中寻找国王身体。"
      ]],
      [37, "太子发现真假国王", "鬼王夜谒唐三藏，悟空神化引婴儿", "乌鸡国王宫、宝林寺", "孙悟空、唐三藏、乌鸡国太子、王后、假国王", "悟空化作小兔把太子引到寺中，以玉圭和往事让他相信王宫里的国王是假冒者。", [
        "乌鸡国太子带人出城打猎。悟空变成一只白兔，把太子一步步引到宝林寺，随后恢复原形，请他单独听三藏说话。太子起初不相信父王已经被妖怪替代。",
        "三藏拿出金厢白玉圭，又说出国王魂魄提到的家中旧事。太子认出这是父王从不离身的宝物，心里开始动摇。悟空让他回宫悄悄询问母后，不可惊动假国王。",
        "太子回宫问起三年前的变化。王后想起国王从那以后性情、习惯都与从前不同，也不再亲近家人，终于相信其中有问题。母子二人商定暗中配合取经人。",
        "与此同时，悟空让八戒陪自己去御花园。八戒听说井中可能有宝贝，立即来了精神。两人趁夜进入王宫，找到长满青苔的八角琉璃井，准备下去寻找真正的国王。"
      ]],
      [38, "井底寻回乌鸡国王", "婴儿问母知邪正，金木参玄见假真", "乌鸡国御花园、井龙王水晶宫、宝林寺", "孙悟空、猪八戒、井龙王、乌鸡国王、唐三藏", "八戒下井背出国王身体；悟空前往兜率宫求得还魂丹。", [
        "八戒下到井底，发现水下还有井龙王的水晶宫。井龙王说明自己一直保护国王身体，使它三年没有损坏。八戒把国王背出井口，一路嫌重，却没有把人丢下。",
        "三藏看见国王仍无呼吸，难过得落泪。悟空说身体保存完好，只要有仙丹便可能救活。他翻筋斗来到兜率宫，向太上老君请求一粒九转还魂丹。",
        "老君起初说丹药珍贵，悟空便装作要自己寻找。老君知道拦不住这只猴子，只好亲手取出一粒，并叮嘱他别再乱翻葫芦。悟空道谢后立刻返回。",
        "三藏把丹药放进国王口中，悟空又吹入一口仙气。国王慢慢醒来，认出太子和白玉圭。大家商量第二天一同进宫，在文武百官面前揭穿假国王，不能让妖怪再用变化逃过。"
      ]],
      [39, "文殊菩萨收回青毛狮", "一粒金丹天上得，三年故主世间生", "乌鸡国金殿", "孙悟空、真国王、假国王、文殊菩萨、唐三藏师徒", "真假国王在金殿相见，悟空逼出青毛狮真身；文殊菩萨前来将坐骑收回。", [
        "第二天，三藏师徒带真国王进入金殿。两个模样完全相同的国王站在百官面前，连王后和太子一时也难分真假。悟空故意提问，假国王处处模仿，仍不露破绽。",
        "悟空举棒逼近，假国王终于跳上云头，现出青毛狮子模样。八戒和沙僧保护真国王，悟空追到空中。青毛狮力气不小，却抵挡不住悟空连续进攻。",
        "文殊菩萨赶来，叫住悟空。原来青毛狮是他的坐骑，下界是为了完成一段因果考验。悟空仍追问妖怪有没有伤害百姓，确认王宫中没有更大灾祸后，才让文殊把它带走。",
        "真国王重新坐上王位，与王后、太子团聚。他感谢师徒救命，整顿国事，也不再轻易被陌生本领迷惑。三藏谢绝厚礼，只补充粮水，带着徒弟继续向西。"
      ]],
      [40, "红孩儿假装求救", "婴儿戏化禅心乱，猿马刀归木母空", "号山枯松涧、火云洞", "唐三藏、孙悟空、猪八戒、沙悟净、红孩儿", "红孩儿变成受困孩子骗取三藏同情，趁悟空背他时抓走三藏。", [
        "号山深处住着红孩儿，自称圣婴大王，是牛魔王和铁扇公主的儿子。他听说唐僧经过，便变成一个被绑在树上的孩子，高声呼救。悟空看出风中有妖气，劝师父不要靠近。",
        "三藏却不忍心把孩子留在荒山，坚持让悟空救下。红孩儿假装腿伤，要求人背。悟空让八戒背，红孩儿嫌弃；最后悟空亲自背他，暗中掂量，发现身体轻得不正常。",
        "红孩儿知道悟空已经怀疑，便使出重身法压住他，又借风把三藏卷走。悟空挣脱后只看见空担子，八戒和沙僧也追赶不及。",
        "土地告诉悟空，红孩儿住在火云洞，最擅长三昧真火。悟空听说对方是牛魔王的儿子，想先用旧日结拜情分劝他放人。可红孩儿根本不认这个远房叔叔，已经在洞前摆好火枪车等候。"
      ]],
      [41, "三昧真火烧悟空", "心猿遭火败，木母被魔擒", "火云洞、枯松涧", "孙悟空、猪八戒、沙悟净、红孩儿、龙王", "红孩儿用三昧真火击退悟空，龙王之水也不能扑灭；八戒又被假观音骗进洞。", [
        "悟空在火云洞外叫阵，红孩儿推出五辆小车，自己站在中间捶打鼻子，喷出三昧真火。火不是普通柴火点燃的，越烧越旺。悟空在烟火中难以睁眼，只得跳进溪水。",
        "八戒把悟空救上岸。悟空请四海龙王降雨，以为能浇灭火焰。谁知雨水落下，三昧真火反而化成更浓的烟，悟空又被熏得昏过去。八戒和沙僧忙着把他救醒。",
        "悟空准备去南海请观音。红孩儿听见后，抢先变成观音模样等在路上。八戒不辨真假，高兴地跟着“菩萨”进入山洞，立刻被小妖捆住。",
        "沙僧独自守在山外，悟空回来才知道八戒也失踪了。他没有责怪师弟，而是确认这妖怪既会火又善变化，必须请真正的观音亲自来收服。"
      ]],
      [42, "观音收红孩儿", "大圣殷勤拜南海，观音慈善缚红孩", "南海紫竹林、火云洞", "孙悟空、观音菩萨、红孩儿、猪八戒、沙悟净", "观音设下莲台与金箍收服红孩儿，让他成为善财童子。", [
        "悟空赶到南海，把红孩儿的三昧真火和假扮观音的事一一说明。观音带着净瓶来到火云洞，先把一海之水装入瓶中，又让悟空把红孩儿引出。",
        "红孩儿追来时，看见观音留下的莲台，以为是什么宝座，得意地坐了上去。莲瓣立刻变成尖尖的刀锋围住他，却没有真的伤害，只让他不能乱动。",
        "红孩儿不肯认输，观音把五个金箍变成一个箍在头上、四个套住手脚。她一念咒，红孩儿便只能合掌低头。观音告诉他，真正厉害不是随意用火欺负人，而是能控制自己的力量。",
        "红孩儿答应改过，随观音去南海做善财童子。悟空救出三藏和八戒，八戒这才知道自己跟错了假菩萨。师徒整理行李继续上路，火云洞的烟也渐渐散去。"
      ]],
      [43, "黑水河里遇鼍龙", "黑河妖孽擒僧去，西洋龙子捉鼍回", "黑水河、衡阳峪黑水河神府、西海龙宫", "唐三藏、孙悟空、猪八戒、沙悟净、鼍龙、摩昂太子", "鼍龙变船夫把三藏和八戒带入水府，西海摩昂太子前来将他收回。", [
        "师徒来到黑水河，看见一位船夫划来小船。悟空觉得船太轻，不肯上去，三藏和八戒却已坐进船中。船到河心忽然翻转，船夫现出鼍龙模样，把两人拖入水府。",
        "沙僧熟悉水性，下河挑战，悟空则找到真正的河神问明情况。原来鼍龙强占了河神府邸，还冒充船夫抓人。河神说他与西海龙族有亲，悟空立刻前往西海。",
        "西海龙王听说外甥作乱，派大太子摩昂带兵处理。摩昂与鼍龙在水下交战，最终用宝剑和水族军阵将他擒住，押回龙宫听候管教。",
        "三藏和八戒被救上岸。河神送来一只大龟，驮师徒渡过黑水河。悟空提醒八戒以后别看见小船就急着抢座，八戒摸着湿透的衣服，只好连连点头。"
      ]],
      [44, "车迟国里解救和尚", "法身元运逢车力，心正妖邪度脊关", "车迟国、三清观", "唐三藏、孙悟空、猪八戒、沙悟净、虎力大仙、鹿力大仙、羊力大仙", "三位国师排斥僧人，悟空三兄弟救下苦役，并夜入三清观戏弄国师。", [
        "车迟国连年少雨，虎力、鹿力、羊力三位大仙曾求来雨水，因此被国王尊为国师。他们让和尚做苦役，许多人在烈日下推车搬石。悟空看见后，用法术解开锁链，让受苦的人逃走。",
        "三清观里，道士们正为三位国师准备丰盛供品。夜里，悟空、八戒和沙僧悄悄进入，把三清塑像搬到安全处，自己变成三清模样坐在神台上。",
        "道士进来祈求仙水。悟空三人故意捉弄他们，八戒差点笑出声。国师发现供品被吃、神像会说话，既惊又怕，最后认出是取经人的徒弟变化。",
        "三藏第二天入城换取通关文牒，三位国师却拦住不放，要求与师徒比试法术。悟空知道只有在国王面前证明国师并非真心护国，才能让受压迫的和尚得到长久自由。"
      ]],
      [45, "悟空与国师比求雨", "三清观大圣留名，车迟国猴王显法", "车迟国金殿、祈雨台", "孙悟空、唐三藏、三位国师、车迟国国王、风雨雷电诸神", "虎力大仙与三藏比求雨，悟空暗中请诸神听自己号令，让国王看清真相。", [
        "虎力大仙提出先比求雨。他登上高台挥剑念咒，风婆婆、云童子、雷公电母刚要行动，悟空跳到空中请他们暂停。台下只见乌云聚了又散，始终没有雨点。",
        "轮到三藏登台诵经，悟空依次发出暗号，风起、云聚、雷鸣、电闪，大雨很快落满全城。虎力大仙不服，说风雨本来就是自己请来的。",
        "悟空让国王问清下一场雨的时辰和雨量，又命龙王严格按照自己的口令收雨。结果每个变化都与悟空所说一致，国王开始怀疑三位国师夸大了本领。",
        "国师仍不认输，又提出比坐禅。三藏坐上高台，鹿力大仙暗中变出臭虫叮咬他。悟空看见后变成蜈蚣去咬鹿力，使他先跌下高台。双方的比试越来越危险，悟空决定让骗局彻底显形。"
      ]],
      [46, "三位国师现原形", "外道弄强欺正法，心猿显圣灭诸邪", "车迟国王宫、比试场", "孙悟空、虎力大仙、鹿力大仙、羊力大仙、唐三藏", "三位国师接连提出危险比试，悟空凭变化取胜，最终让他们露出虎、鹿、羊的原形。", [
        "虎力大仙提出比砍头后还能接回。悟空让自己的头滚到远处，又故意叫它回来，轻松复原。轮到虎力时，悟空变出一只狗叼走他的头，虎力再也无法恢复，现出黄毛虎原形。",
        "鹿力大仙要比剖开肚子后再恢复。悟空用法术平安完成，鹿力却在施法时失败，最终现出白鹿原形。",
        "羊力大仙最后要求下滚油锅。悟空在锅里像洗热水澡一样自在，因为暗中有冷龙护住。羊力让道士放入冷龙使油降温，悟空捉走冷龙，油立刻沸腾，羊力也现出羚羊原形。",
        "国王终于明白三位国师虽会一些法术，却用本领欺压别人。他下令释放僧人，也让不同修行者彼此尊重。三藏拿回通关文牒，师徒没有留下享受感谢，继续踏上西行道路。"
      ]],
      [47, "通天河边救童男童女", "圣僧夜阻通天水，金木垂慈救小童", "陈家庄、通天河、灵感大王庙", "唐三藏、孙悟空、猪八戒、陈澄一家、灵感大王", "灵感大王每年索要童男童女，悟空和八戒变成孩子代替他们赴祭。", [
        "师徒来到陈家庄，家家户户都愁眉不展。原来通天河里的灵感大王自称能保风调雨顺，每年却要村民送一名男孩和一名女孩。正好轮到陈澄家的孩子，父母哭得十分伤心。",
        "悟空决定救人，变成男孩陈关保；八戒变成女孩一秤金。两人坐进祭台上的红灯笼屋，真正的孩子被藏到安全处。三藏和沙僧陪家人等待。",
        "夜里，灵感大王从河中出现，伸手来抓。八戒忍不住先举钉耙，悟空也现出本相。妖怪没想到祭品会还手，转身逃入通天河。",
        "村民见孩子平安，都来感谢师徒。悟空知道妖怪不会轻易罢休，决定下河追查。灵感大王则在水府想出新办法，要借寒风冻结河面，引取经人自己走进陷阱。"
      ]],
      [48, "冰封通天河", "魔弄寒风飘大雪，僧思拜佛履层冰", "通天河、陈家庄、河心冰面", "唐三藏、孙悟空、猪八戒、沙悟净、灵感大王", "灵感大王冻住河面诱骗师徒过河，冰层在河心裂开，三藏落入水府。", [
        "一夜之间大雪纷飞，通天河结成厚冰。有人在冰面上行走做生意，看起来十分安全。三藏急着赶路，认为这是天赐道路。悟空敲了敲冰面，仍觉得来得蹊跷。",
        "八戒和沙僧搬运行李，白龙马小心踏上冰面。走到河心时，灵感大王从水下施法，冰层突然裂开。悟空腾空而起，八戒、沙僧和白马退到裂缝边，三藏却连人带包袱落进河中。",
        "灵感大王把三藏关进水府，准备选日子吃掉。八戒和沙僧下水叫阵，悟空在水面接应。妖怪躲在宫中不出，只派水族拖延。",
        "悟空向河神询问来历，得知灵感大王使用一柄九瓣铜锤，似乎与莲花有关。他想起观音的莲池，决定去南海查问。八戒和沙僧留在河边守候，不让妖怪把师父转移。"
      ]],
      [49, "观音鱼篮收灵感", "三藏有灾沉水宅，观音救难现鱼篮", "南海莲花池、通天河", "孙悟空、观音菩萨、灵感大王、老鼋、唐三藏", "观音说明灵感大王是莲池金鱼，以鱼篮将其收回；老鼋驮师徒过河并托问寿数。", [
        "悟空赶到南海时，观音正在编一只竹篮。她听说通天河之事，立刻与悟空同行。原来灵感大王是莲花池里每天听经的金鱼，趁海潮来到人间，拿一枝未开的莲花变成铜锤。",
        "观音站在河边，把竹篮放入水中，念动真言。金鱼精无法抵挡，变回原形游进篮里。水府大门打开，悟空、八戒和沙僧救出冻得发抖的三藏。",
        "住在河中的老鼋感谢师徒赶走妖怪，愿意驮他们过河。巨大的龟背像一只平稳小船，白马和行李都能放上去。过河途中，老鼋托三藏到西天后替自己问问还有多少寿数、何时能修成人形。",
        "三藏认真答应。到了对岸，陈家庄百姓为师徒立下生祠，感谢他们救回孩子。师徒辞别众人继续西行，三藏把老鼋的托付记在心里，却不知道多年以后自己会差一点忘记这件事。"
      ]],
      [50, "金兜洞里法宝失踪", "情乱性从因爱欲，神昏心动遇魔头", "金兜山、悟空画的保护圈、金兜洞", "唐三藏、孙悟空、猪八戒、沙悟净、独角兕大王", "悟空外出化斋前画圈护住众人，八戒却带大家离圈取衣，三人和兵器都被妖怪收走。", [
        "大雪山中，悟空要去远处化斋。他怕妖怪靠近，便用金箍棒在地上画了一个圆圈，请师父、八戒和沙僧待在圈内，不论看见什么都不要出去。",
        "八戒等得不耐烦，看见不远处有座无人宅院，里面挂着漂亮棉衣。他劝三藏离圈避寒，三人刚拿起衣服，宅院便变成洞府，小妖一拥而上，把他们抓进金兜洞。",
        "悟空回来只见空圈，循着气味找到洞口。独角兕大王拿点钢枪迎战。悟空一棒打去，妖怪举起白亮圆环，金箍棒竟被吸了进去。",
        "悟空失去兵器，只能先退开。他从八戒遗落的痕迹判断师父还活着，决定上天请帮手。独角兕大王把金箍棒与三藏的行李摆在洞中，得意地等待下一批送上门的兵器。"
      ]],
      [51, "金刚琢收尽天兵法宝", "心猿空用千般计，水火无功难炼魔", "金兜山、天宫、金兜洞", "孙悟空、独角兕大王、托塔天王、哪吒、火德星君、水德星君", "悟空请来天兵和水火诸神，兵器与法宝却都被白色圆环收走。", [
        "悟空先请托塔天王和哪吒来帮忙。哪吒使出六般兵器，众天将也一起围攻。独角兕大王举起白色圆环一晃，刀枪剑戟像被大风卷走，全都飞进环中。",
        "悟空又请火德星君带来火龙、火马和许多火器。烈火烧向洞口，妖怪仍举圆环，把火器全部收走。水德星君放出大水，妖怪躲进洞中，水也没能伤到他。",
        "悟空夜里变成小虫钻进洞府，拿回金箍棒和一些兵器。妖怪醒来追赶，又用圆环把它们重新吸走。悟空发现只要那只环还在，来多少帮手都难取胜。",
        "他到天宫查问谁家少了坐骑或宝物，众神都说没有。悟空只得前往灵山求如来指点。如来没有直接说出名字，只让十八罗汉带金丹砂相助，并暗示真正主人住在兜率宫。"
      ]],
      [52, "太上老君降服青牛", "悟空大闹金兜洞，如来暗示主人公", "金兜洞、兜率宫", "孙悟空、独角兕大王、十八罗汉、太上老君", "如来暗示妖怪来历，悟空请来太上老君；老君用芭蕉扇收回青牛和金刚琢。", [
        "十八罗汉把金丹砂撒在地上，想让妖怪陷进去。独角兕大王又用圆环把金砂收走。悟空想起如来的暗示，立刻赶到兜率宫，问太上老君有没有丢失什么。",
        "老君查看牛栏，发现青牛和金刚琢都不见了，看牛童子正在睡觉。原来青牛趁童子疏忽，偷走老君当年过函谷关时使用的金刚琢，下界变成独角兕大王。",
        "老君来到金兜山，手持芭蕉扇轻轻一扇。妖怪浑身无力，现出青牛原形。老君穿上它的鼻环，骑到牛背上，又把吸走的各种兵器全部归还。",
        "悟空冲进洞中救出师父和师弟。八戒看见自己的钉耙失而复得，高兴得抱在怀里。三藏感谢众神相助，师徒继续上路，也更清楚有些看似无敌的法宝，往往要找到源头才能解决。"
      ]],
      [53, "子母河水带来怪病", "禅主吞餐怀鬼孕，黄婆运水解邪胎", "西梁女国子母河、迎阳驿、解阳山聚仙庵", "唐三藏、猪八戒、孙悟空、沙悟净、如意真仙", "三藏和八戒误饮子母河水腹痛，悟空前往解阳山取得落胎泉水。", [
        "师徒进入西梁女国地界，三藏和八戒口渴，喝了子母河的水。不久，两人肚子越来越大，疼得直冒汗。当地人解释，女国没有男子，喝下子母河水便会孕育孩子。",
        "悟空听说解阳山有一眼落胎泉，泉水能解除这种状况，便带沙僧前往。守泉的如意真仙是牛魔王的兄弟，因为悟空请观音收走红孩儿，对他心怀不满。",
        "如意真仙举钩阻拦，悟空与他交战，沙僧趁机打水。两人带回泉水，三藏和八戒喝下后疼痛渐止，身体恢复正常。八戒摸摸肚子，庆幸自己不用在赶路时照顾小娃娃。",
        "驿站女官得知他们来自东土，赶紧向女王报告：国中第一次来了四位男子，其中还有大唐御弟。女王听后十分好奇，决定亲自召见三藏。"
      ]],
      [54, "女儿国王真心留三藏", "法性西来逢女国，心猿定计脱烟花", "西梁女国都城、王宫、城外驿站", "唐三藏、孙悟空、猪八戒、沙悟净、女儿国国王", "女王愿把王位和婚姻都交给三藏；悟空定下假意答应、换好文牒再离开的办法。", [
        "女儿国国王见到三藏，觉得他温和端正，提出愿意与他成亲，还愿把王位相让。八戒听见满桌宴席和富贵生活，觉得留下也不错；三藏却牢记取经誓愿，左右为难。",
        "悟空悄悄告诉师父，可以先假装答应，让女王在通关文牒上盖印，再以送徒弟出城为由一同离开。三藏不愿欺骗别人，但也不能让整支队伍困在王宫，只得采用这个办法。",
        "女王设下盛宴，亲自陪三藏游览御花园。她的感情真诚，并非妖怪变化。三藏心中不忍，始终以礼相待，没有说伤人的话。文牒盖印后，女王送他们到城外。",
        "悟空给出暗号，师徒准备告辞。女王虽然失望，仍没有强行阻拦。就在此时，一阵怪风卷来，把三藏从马旁带走。悟空抬头追看，发现真正的妖怪一直躲在城外等待机会。"
      ]],
      [55, "蝎子精与昴日星官", "色邪淫戏唐三藏，性正修持不坏身", "毒敌山琵琶洞、女儿国城外", "唐三藏、孙悟空、猪八戒、蝎子精、昴日星官", "蝎子精抓走三藏并用倒马毒桩伤悟空；昴日星官现出大公鸡原形将她降服。", [
        "抓走三藏的是毒敌山琵琶洞蝎子精。她想让三藏留下，准备漂亮食物和衣服。三藏不为所动，只请求她放自己继续西行。蝎子精恼怒，把他关进后洞。",
        "悟空和八戒找到洞口。蝎子精手持三股钢叉迎战，尾巴上的倒马毒桩突然刺中悟空头部。悟空铜头铁臂也疼得难忍，只能暂退；观音告诉他，这妖怪曾在灵山听经，连如来都被她刺痛过。",
        "观音指点悟空去请昴日星官。星官来到山前，现出巨大公鸡原形，对着蝎子精连叫几声。蝎子最怕鸡鸣，妖怪立刻浑身发软，再也不能施展毒桩。",
        "悟空救出三藏，向女儿国国王正式告别。女王站在城门边目送白马远去。三藏心里也有感触，却仍选择完成答应天下人的取经使命。"
      ]],
      [56, "强盗再来，师徒再起争执", "神狂诛草寇，道昧放心猿", "山间杨老者家、树林", "唐三藏、孙悟空、猪八戒、沙悟净、杨老者、强盗", "悟空出手惩戒强盗过重，三藏再次把他逐走，师徒之间的误解重新出现。", [
        "师徒借宿杨老者家，夜里一群强盗闯入。悟空吓退他们，却发现其中一个年轻人是杨老者走上歧路的儿子。老者恳求悟空给孩子改过机会。",
        "第二天，强盗又在路上拦截。悟空被激怒，出手太重。三藏认为即使对方犯错，也不该随意决定他们的生死，严厉责备悟空。悟空觉得自己是为大家清除危险，心中也很委屈。",
        "两人越说越僵。三藏念紧箍咒，并再次写下贬书。悟空赌气离开，心里却并不平静：他能一棒打散妖怪，却总学不会怎样让师父理解自己。",
        "悟空去南海向观音诉苦。另一边，三藏带八戒、沙僧继续赶路。他们不知道，一个与悟空一模一样的身影已经出现，新的真假难题即将让三界都难分辨。"
      ]],
      [57, "两个孙悟空出现了", "真行者落伽山诉苦，假猴王水帘洞誊文", "南海、取经路、花果山水帘洞", "真悟空、六耳猕猴、唐三藏、沙悟净、观音菩萨", "六耳猕猴假扮悟空打伤师父、抢走行李，还在花果山组织一支假取经队伍。", [
        "三藏休息时，一个“悟空”突然回来索要行李。三藏不肯收回他，对方恼怒地抢走包袱，还打伤师父。沙僧追到花果山，看见水帘洞里竟有另一个自己、另一个八戒和另一匹白马。",
        "沙僧无法分辨，先去南海找真悟空。此时真悟空一直待在观音身边，证明抢行李的不是他。两人返回花果山，真假悟空一见面便打得难分难解。",
        "假悟空想带着假队伍自己去西天取经，换取功名。真悟空气愤他伤害师父又冒用伙伴身份。两根金箍棒从花果山打到空中，旁人只看见两个一模一样的身影。",
        "沙僧回去保护三藏，八戒也被召来帮忙。两个悟空决定找能辨认真假的人评理。他们先去见观音，又去天庭、地府和谛听面前，真假之谜却依然没有解开。"
      ]],
      [58, "真假美猴王", "二心搅乱大乾坤，一体难修真寂灭", "南海、天宫、地府、灵山", "孙悟空、六耳猕猴、唐三藏、观音、谛听、如来佛祖", "三界众神都难辨真假，如来认出六耳猕猴；悟空回到三藏身边，师徒重新和好。", [
        "真假悟空先后让紧箍咒、照妖镜和谛听来分辨。两人一起喊痛，镜中模样也完全相同。谛听其实听出了真相，却担心说破后地府无人能制服假猴，只建议他们去灵山。",
        "如来告诉众人，假悟空是善听万物声音、懂得变化的六耳猕猴。他听见取经队伍的矛盾，便趁机模仿悟空，想取代真正的取经人。",
        "如来用金钵罩住六耳猕猴，假身终于现出原形。悟空结束这场争斗，不再有另一个身影冒用他的名字。观音带他回到三藏面前，说明先前伤人的不是悟空。",
        "三藏收回贬书，师徒再次和好。这次悟空不再轻易说走，三藏也承认自己判断太快。经历真假难辨的一关后，他们明白信任不是永远不出错，而是在误会后愿意重新了解彼此。"
      ]],
      [59, "一借芭蕉扇", "唐三藏路阻火焰山，孙行者一调芭蕉扇", "火焰山、翠云山芭蕉洞", "唐三藏、孙悟空、猪八戒、铁扇公主、土地", "火焰山挡路，悟空向铁扇公主借扇；公主因红孩儿之事拒绝，并用假扇使火势更旺。", [
        "前方八百里火焰山终年烈火，普通人无法通过。土地告诉悟空，只有铁扇公主的芭蕉扇能一扇灭火、二扇生风、三扇降雨。悟空便前往翠云山借扇。",
        "铁扇公主是红孩儿的母亲。她认为悟空害自己与儿子分离，不肯借扇，一扇把悟空吹到远方。悟空借来定风丹，再次来到洞前，这次稳稳站住。",
        "悟空变成小虫钻进铁扇公主的茶里，在她肚中翻腾。公主疼得只得交出一把扇子。悟空高兴地回到火焰山，用力一扇，谁知火焰反而蹿得更高。",
        "土地认出那是把假扇。悟空救下被火燎到的八戒，明白只靠威逼换不来真宝贝。他打听到铁扇公主的丈夫牛魔王住在积雷山，决定去找这位昔日结拜兄长想办法。"
      ]],
      [60, "二借芭蕉扇", "牛魔王罢战赴华筵，孙行者二调芭蕉扇", "积雷山摩云洞、翠云山芭蕉洞", "孙悟空、牛魔王、铁扇公主、玉面狐狸、猪八戒", "悟空找牛魔王说情不成，变化成牛魔王骗得真扇，却被真正的牛魔王识破夺回。", [
        "悟空来到积雷山，见牛魔王住在玉面狐狸的摩云洞。牛魔王听说红孩儿被观音收走，也对悟空有怨，不肯帮忙。两人打了起来，牛魔王中途受邀赴宴，骑着避水金睛兽离开。",
        "悟空变成牛魔王的模样，骑着避水金睛兽来到芭蕉洞。铁扇公主没有识破，把真扇拿出来，又说出把扇子变大变小的口诀。悟空拿到扇子后立刻离开。",
        "真正的牛魔王回家得知被骗，也变成八戒模样追上悟空。他假装来帮师兄拿扇，悟空没有提防，把扇子交给了他。牛魔王现出本相，带扇返回。",
        "悟空懊恼自己也会被变化骗过。八戒赶来后没有取笑，反而举起钉耙说一起再战。师兄弟决定正面请牛魔王归还宝扇，让火焰山百姓和过路人不再受苦。"
      ]],
      [61, "三借芭蕉扇", "猪八戒助力败魔王，孙行者三调芭蕉扇", "翠云山、火焰山", "孙悟空、猪八戒、牛魔王、铁扇公主、哪吒、托塔天王", "悟空八戒与牛魔王大战，天兵合力收服；铁扇公主交出真扇，火焰山终于降雨。", [
        "牛魔王现出大白牛原形，身形像小山一样。悟空变成巨人拦住牛角，八戒从旁挥耙。牛魔王又变化成天鹅、黄鹰和猛兽，悟空一一变化追赶。",
        "托塔天王、哪吒和四方神将赶来相助。哪吒站在牛背上，用风火轮困住他；众神封住去路。牛魔王终于停手，答应接受管教。",
        "铁扇公主见丈夫被围，只得交出真芭蕉扇。悟空来到火焰山连扇四十九下，大火熄灭，清风吹过，乌云聚拢，久旱的土地落下雨水。",
        "百姓欢呼着播种耕田。悟空把扇子归还铁扇公主，没有据为己有。师徒平安走过火焰山，回头只见从前红通通的天空变得清澈，取经路上又少了一道阻隔。"
      ]],
      [62, "祭赛国宝塔失宝", "涤垢洗心惟扫塔，缚魔归正乃修身", "祭赛国、金光寺宝塔、乱石山碧波潭", "唐三藏、孙悟空、猪八戒、金光寺僧人、九头虫、万圣龙王", "宝塔舍利失窃，僧人蒙冤；悟空扫塔查到妖怪，追往碧波潭寻宝。", [
        "祭赛国金光寺宝塔从前夜夜放光，后来塔顶佛宝舍利失踪，光芒消失。国王误以为寺中僧人偷宝，把他们罚做苦役。三藏见僧人受冤，决定进塔扫尘祈福。",
        "悟空陪师父一层层扫到塔顶，夜里听见小妖喝酒说话。他抓住两只小妖询问，得知万圣龙王的女婿九头虫偷走舍利，藏在乱石山碧波潭。",
        "悟空把证据交给国王，请求给僧人洗清罪名。他与八戒来到碧波潭叫阵，万圣龙王和九头虫带水族迎战。八戒熟悉水战，挥钉耙打散虾兵蟹将。",
        "九头虫有九个脑袋，能从不同方向进攻，还偷走王母的九叶灵芝草养护舍利。悟空意识到必须既取回佛宝，又保护它不被争斗损坏，于是请八戒把妖怪引出水面再想办法。"
      ]],
      [63, "二郎神助取舍利", "二僧荡怪闹龙宫，群圣除邪获宝贝", "碧波潭、祭赛国金光寺", "孙悟空、猪八戒、二郎神、九头虫、万圣公主", "二郎神和梅山兄弟帮助悟空击退九头虫，师徒取回舍利与灵芝草，宝塔重放光明。", [
        "悟空在潭边遇见二郎神和梅山兄弟，便请他们相助。二郎神放出细犬，咬住九头虫一个脑袋。九头虫负伤逃向远方，不敢再回碧波潭。",
        "悟空和八戒进入龙宫，找到装舍利的金匣和九叶灵芝草。万圣公主承认参与偷宝，把藏处说出。八戒想把龙宫宝物都带走，悟空只取属于祭赛国和王母的东西。",
        "舍利重新放回宝塔顶，灵芝草安置在旁，塔身当夜又放出金光。国王明白寺僧一直被冤枉，立刻释放众人，并改寺名为伏龙寺。",
        "三藏不愿接受国王重金，只请他今后查明事实再处罚人。师徒带着盖好印章的文牒出城，金光在身后越来越远，却仍为蒙冤多年的僧人照亮了新生活。"
      ]],
      [64, "荆棘岭上与树精谈诗", "荆棘岭悟能努力，木仙庵三藏谈诗", "荆棘岭、木仙庵", "唐三藏、孙悟空、猪八戒、沙悟净、十八公等树精、杏仙", "八戒开路穿越荆棘岭；树精邀请三藏谈诗，杏仙想留他，被悟空识破。", [
        "荆棘岭藤蔓交错，没有可走的路。八戒变成长嘴大猪，拱开荆棘和枯根，为白马清出一条窄道。大家走了一整天，衣服上仍挂满刺。",
        "夜里，几位白发文士邀请三藏到木仙庵谈诗。他们说话文雅，自称十八公、孤直公、凌空子和拂云叟。三藏与他们吟诗论道，一时忘了夜深。",
        "一位杏仙来到席间，唱歌跳舞，想与三藏结亲。三藏拒绝，她仍不肯放行。悟空循气味赶来，喝破众人都是松、柏、桧、竹和杏树成精。",
        "树精没有伤人，悟空赶散他们，八戒却把几棵老树连根拱倒，免得再迷惑路人。三藏觉得可惜，提醒徒弟即使对方有错，也不要多做无关破坏。师徒走出荆棘岭，前方出现一座金光闪闪的寺院。"
      ]],
      [65, "假雷音寺金钹困悟空", "妖邪假设小雷音，四众皆遭大厄难", "小西天、小雷音寺", "唐三藏、孙悟空、猪八戒、沙悟净、黄眉怪", "黄眉怪假扮佛祖骗师徒入寺，用金铙困住悟空，并把三藏等人捉住。", [
        "三藏看见“小雷音寺”匾额，以为提前到了灵山，坚持下马礼拜。悟空看出殿内祥云不正，劝师父小心。三藏刚走进大殿，满堂佛像便变成小妖，宝座上的假佛也现出黄眉怪模样。",
        "悟空举棒冲上去，黄眉怪抛出一副金铙，把悟空合在里面。八戒和沙僧保护师父，却被小妖围住。金铙越合越紧，悟空使尽变化也找不到缝隙。",
        "值日功曹上天求援，亢金龙把尖角伸进金铙，悟空缩小后沿角钻出。悟空打碎金铙，再次挑战黄眉怪。",
        "黄眉怪又抛出一个人种袋，天兵、八戒、沙僧连同兵器全被装进去。悟空独自逃开，发现这妖怪的宝物比力量更难应付，只得四处求助，寻找宝物真正的主人。"
      ]],
      [66, "弥勒佛收黄眉童子", "诸神遭毒手，弥勒缚妖魔", "小雷音寺、瓜田", "孙悟空、黄眉怪、弥勒佛、众天神", "弥勒佛以瓜田巧计让黄眉怪吞下悟空，收回人种袋并救出师徒。", [
        "悟空请来多位星宿和神将，仍被人种袋一批批装走。正发愁时，一个笑呵呵的大肚和尚来到山坡。原来他是弥勒佛，黄眉怪是敲磬童子，趁主人不在偷走金铙和人种袋。",
        "弥勒在路边变出瓜田，自己化作种瓜老人。悟空变成一只熟瓜。黄眉怪追来后又热又渴，拿起瓜便吃，把变小的悟空一口吞下。",
        "悟空在妖怪肚里踢打翻滚。黄眉怪疼得求饶，弥勒趁机取走人种袋和金铙。悟空出来后仍想再打，弥勒已经让童子恢复原形，把他装进袋中带回。",
        "被袋子收走的三藏、八戒、沙僧和众神全部获救。三藏回望假寺，殿阁转眼化成荒山。真正的灵山不会靠漂亮匾额证明自己，师徒只能继续一步一步向西走。"
      ]],
      [67, "七绝山上除巨蟒", "拯救驼罗禅性稳，脱离秽污道心清", "驼罗庄、七绝山稀柿衕", "唐三藏、孙悟空、猪八戒、沙悟净、巨蟒精", "悟空消灭危害村庄的巨蟒，八戒变巨猪拱开堵塞多年的稀柿衕。", [
        "驼罗庄村民说，七绝山每年都有一条巨大红鳞蟒蛇来吞食牲畜。悟空答应除害，夜里站在村口等待。巨蟒张口扑来，悟空故意钻进它肚中，再从里面制服它。",
        "村民设宴感谢，说明通往西方的道路被烂柿子堵住多年，臭气难闻，谁也过不去。八戒听说又要自己开路，虽然满嘴抱怨，还是变成一头巨大的猪。",
        "他用长嘴一路拱开腐烂果泥，悟空和沙僧在后面垫土铺草，给白龙马清出落脚处。三藏捂着鼻子前行，仍不停向辛苦的徒弟道谢。",
        "众人终于穿过七绝山，八戒累得躺在溪边不肯起来。悟空给他摘来干净果子，师兄弟笑着和好。最难走的路不一定有厉害妖怪，有时只是又脏又累，却也需要大家一起完成。"
      ]],
      [68, "悟空悬丝诊国王", "朱紫国唐僧论前世，孙行者施为三折肱", "朱紫国会同馆、王宫", "唐三藏、孙悟空、猪八戒、朱紫国王、太医", "朱紫国王久病，悟空揭榜行医，用悬丝诊脉查出病因。", [
        "师徒来到朱紫国，悟空看见宫门张贴皇榜：国王病了三年，谁能治好便有重谢。他揭下榜文，八戒却说猴子从没学过行医。悟空笑说先看看病因再决定。",
        "宫中太医不相信他，悟空要求用金线系在国王手腕上，隔着帘子悬丝诊脉。国王还故意让内侍把线系到柱子和动物身上，都被悟空一一识破。",
        "悟空诊出国王心中长期忧愁，又受惊吓，体内气息不顺。三年前金圣宫娘娘被妖怪带走，国王从此思念成病。悟空说只吃普通补药不够，必须先解开心结。",
        "他让八戒和沙僧寻找药材，自己准备配制“乌金丹”。国王看见这位毛脸医生说话有趣，第一次露出笑容。悟空也从宫人处打听到，抓走娘娘的妖怪叫赛太岁，住在麒麟山獬豸洞。"
      ]],
      [69, "乌金丹治病，国王说旧事", "心主夜间修药物，君王筵上论妖邪", "朱紫国王宫、麒麟山", "孙悟空、朱紫国王、猪八戒、沙悟净、金圣宫娘娘、赛太岁", "悟空配药治好国王，听完金圣宫被掳经过，决定前往麒麟山救人。", [
        "悟空把大黄、巴豆等药材调和，又悄悄加进白龙马的尿液和锅底灰，做成几粒乌金丹。国王服药后把积在体内的糯米饭团吐出，胸口顿时轻松，精神也恢复许多。",
        "国王设宴感谢，讲起三年前端午节时，赛太岁驾怪风掳走金圣宫娘娘。娘娘身上有紫阳真人送的五彩仙衣，妖怪只要靠近便会被尖刺刺痛，因此一直无法伤害她。",
        "悟空答应救回娘娘，变成小妖潜入麒麟山。途中抓住来有去无的小妖，得知赛太岁有三个紫金铃，摇一摇喷火，再摇喷烟，第三个能放黄沙。",
        "悟空来到獬豸洞，先与金圣宫娘娘暗中相认，告诉她国王已经康复。娘娘把妖怪的习惯和铃铛藏处告诉悟空。两人商量用假铃换真铃，让赛太岁失去最厉害的依仗。"
      ]],
      [70, "悟空计盗紫金铃", "妖魔宝放烟沙火，悟空计盗紫金铃", "麒麟山獬豸洞", "孙悟空、赛太岁、金圣宫娘娘、小妖有来有去", "悟空变作小妖进入洞府，几次设法调换紫金铃，却因细节露出破绽。", [
        "悟空变成小妖有来有去，向赛太岁报告朱紫国请来孙悟空的消息。妖怪有些害怕，拿出紫金铃演示。悟空近距离看清铃铛，却没有机会立刻拿走。",
        "金圣宫娘娘假装为妖怪整理衣服，悄悄把铃铛换给悟空。悟空用毫毛做了三个一模一样的假铃放回去，真铃藏在身上。",
        "赛太岁突然想试铃，假铃没有任何反应。悟空只得变回小妖解释是没塞好棉花。妖怪起疑，悟空又故意在洞外叫阵，把注意力引开。",
        "双方交战时，赛太岁拿回了真铃，放出烈火、浓烟和黄沙。悟空用分身扰乱视线，再次钻入洞中寻找机会。他知道仅偷到铃铛还不够，还要让妖怪亲口承认过错并放回娘娘。"
      ]],
      [71, "观音收回金毛犼", "行者假名降怪犼，观音现象伏妖王", "麒麟山、朱紫国王宫", "孙悟空、赛太岁、观音菩萨、金圣宫娘娘、朱紫国王", "悟空用真紫金铃反制赛太岁；观音说明妖怪是金毛犼，将其收回，娘娘与国王团聚。", [
        "悟空终于拿到真紫金铃，在洞外依次摇动。大火、浓烟和黄沙反过来围住赛太岁。妖怪失去宝贝，只能左躲右闪，再也无法逞威。",
        "观音菩萨赶来，让悟空停手。原来赛太岁是她的坐骑金毛犼，紫金铃本是坐骑颈上的铃铛。金毛犼趁看守童子打盹，咬断锁链来到人间。",
        "金毛犼现出原形，伏在观音脚边。观音取回铃铛，把它带回南海。悟空护送金圣宫娘娘回到朱紫国，国王在宫门外亲自迎接。",
        "娘娘脱下紫阳真人所赠的仙衣，终于与家人团聚。国王感谢悟空既治好了自己的身体，也解开了三年的心病。师徒盖好文牒，谢绝挽留，继续向西。"
      ]],
      [72, "盘丝洞七个蜘蛛精", "盘丝洞七情迷本，濯垢泉八戒忘形", "盘丝岭盘丝洞、濯垢泉", "唐三藏、孙悟空、猪八戒、沙悟净、七个蜘蛛精", "三藏独自化斋被蜘蛛精捉住；八戒追到濯垢泉，悟空救出师父。", [
        "三藏见一户人家，独自前去化斋。屋中七位女子热情留他吃饭，转眼却吐出长长蛛丝，把他缠住。原来这里是盘丝洞，七位女子都是蜘蛛精。",
        "蜘蛛精去濯垢泉洗澡，让小妖看守三藏。悟空变成小虫跟踪，八戒听说后急着去救，却在泉边和妖怪打闹起来，反被蛛丝绊得东倒西歪。",
        "悟空没有伤害泉中的蜘蛛精，只变出许多小鹰叼走她们的衣服，逼她们赶回洞中。沙僧守住出口，悟空和八戒趁机打散蛛网，救出三藏。",
        "七个蜘蛛精逃往师兄蜈蚣精的黄花观求助。师徒不知前方道观与她们有关，仍沿路前进。悟空闻到空气里有一股甜中带苦的茶香，心中暗暗提高警惕。"
      ]],
      [73, "蜈蚣精的千眼金光", "情因旧恨生灾毒，心主遭魔幸破光", "黄花观、紫云山千花洞", "唐三藏、孙悟空、猪八戒、沙悟净、蜈蚣精、毗蓝婆菩萨", "蜈蚣精在茶中下毒，又以千眼金光困住悟空；毗蓝婆菩萨用昴日星官眼中炼成的针破法。", [
        "黄花观道士正是七个蜘蛛精的师兄蜈蚣精。他假装热情，在红枣茶中下毒。三藏、八戒和沙僧喝后腹痛倒地，悟空看出茶色不对，没有入口。",
        "蜈蚣精脱下道袍，肋下长出许多眼睛，同时放出耀眼金光。悟空冲进光阵便像撞上无形高墙，眼睛也睁不开，只好翻筋斗退出。",
        "黎山老母化作妇人指点悟空去紫云山请毗蓝婆菩萨。菩萨拿出一根绣花针，那是用昴日星官眼中日光炼成，专破千眼金光。",
        "金针一照，蜈蚣精立刻失去法力，现出大蜈蚣原形。毗蓝婆将他带回修行，又给三藏三人服下解药。七个蜘蛛精不再阻路，师徒离开黄花观，继续向狮驼岭前进。"
      ]],
      [74, "狮驼岭三魔王", "长庚传报魔头狠，行者施为变化能", "狮驼岭、狮驼洞", "唐三藏、孙悟空、猪八戒、沙悟净、青狮、白象、大鹏、太白金星", "太白金星警告狮驼岭有三位魔王，悟空变小妖探洞，却被大鹏识破。", [
        "太白金星在山路上提醒师徒，狮驼岭有青狮、白象和大鹏三个魔王，手下小妖成千上万。三藏听得心惊，悟空让八戒、沙僧守护师父，自己先去打探。",
        "悟空变成小妖混进队伍，向小钻风打听洞内规矩。小钻风越说越夸张，把三个魔王讲得能一口吞城。悟空故意跟着喊威风，把巡山小旗骗到手。",
        "他进入狮驼洞，看见层层门岗和许多小妖。青狮、白象一时没有看穿，大鹏却心思敏锐，问了几个只有本洞小妖才知道的问题。",
        "悟空答错后现出原形，在洞中挥棒冲突。小妖虽多，拦不住他的分身。三位魔王亲自围上来，悟空边战边退，准备把他们引离洞府，免得师父被大队小妖包围。"
      ]],
      [75, "悟空钻进青狮肚子", "心猿钻透阴阳窍，魔王还归大道真", "狮驼洞、狮驼岭", "孙悟空、青狮、白象、大鹏、猪八戒、沙悟净", "青狮一口吞下悟空，悟空在他肚中折腾脱身；三魔继续用阴阳二气瓶困他。", [
        "青狮张开大口，像城门一样，一口把悟空吞进肚子。小妖欢呼，青狮也得意。悟空却在里面竖起金箍棒，先捅喉咙，又挠肚皮，疼得青狮满地翻滚。",
        "青狮答应放他出来，悟空怕妖怪咬人，先在腰间系绳，再从鼻孔钻出。刚出来，白象用长鼻卷住悟空。悟空把金箍棒变粗，撑得象鼻无法收紧，随后逃脱。",
        "大鹏拿出阴阳二气瓶，把悟空装入其中。瓶内一会儿烈火，一会儿寒气，若是普通人早已受不了。悟空用观音送的三根救命毫毛变成钻子，钻破瓶底。",
        "悟空逃回师父身边，发现这三位魔王各有本领又会配合，不能只凭一人进洞。他与八戒、沙僧商量分头牵制，再设法查清三个妖怪各自的来历。"
      ]],
      [76, "师兄弟合力战三魔", "心神居舍魔归性，木母同降怪体真", "狮驼岭、狮驼洞", "孙悟空、猪八戒、沙悟净、青狮、白象、大鹏", "悟空和八戒合力捉住青狮白象，却被大鹏设计，取经队伍全数落入洞中。", [
        "悟空先挑战青狮，故意假装败退，把他引到八戒埋伏处。八戒一钉耙打来，青狮措手不及，被师兄弟合力制住。白象出洞救援，又被沙僧拦住。",
        "白象用长鼻卷人，悟空变小钻进鼻孔，逼他投降。青狮和白象表面答应送师徒过山，大鹏却暗中提出假装抬轿、途中再下手的计策。",
        "三藏坐进妖怪准备的轿子，以为终于能平安过岭。走到半路，小妖突然翻脸。悟空三人护住师父交战，却被三位魔王分开包围。",
        "大鹏速度极快，悟空一个筋斗也甩不开他。最终三藏、八戒、沙僧都被抓走，悟空也被逼退。妖怪放出假消息说师父已经遇害，想让悟空彻底失去希望。"
      ]],
      [77, "如来降服狮驼岭", "群魔欺本性，一体拜真如", "狮驼国、灵山、狮驼岭", "孙悟空、青狮、白象、大鹏、如来佛祖、文殊菩萨、普贤菩萨", "悟空得知师父仍活着，前往灵山求助；三位魔王各归主人，取经队伍脱险。", [
        "悟空听说师父没了，难过得落泪。后来他变成小虫潜入洞中，发现三藏等人仍被关着，才重新振作。他知道大鹏与灵山有关，直接去见如来。",
        "如来说明青狮是文殊菩萨坐骑，白象是普贤菩萨坐骑；大鹏与佛母孔雀大明王有亲缘，自恃速度和背景强大。三位菩萨一同来到狮驼岭。",
        "文殊、普贤念动真言，青狮白象恢复坐骑原形。大鹏展翅想逃，如来张开手掌，四周护法围住去路，最终让他停下，答应留在灵山修行。",
        "悟空救出师父和师弟，狮驼国被妖气笼罩的天空重新明亮。三藏感谢悟空没有因假消息放弃。师徒走过这段最让人害怕的山岭，更懂得希望常常藏在确认事实之后。"
      ]],
      [78, "比丘国要取小儿心", "比丘怜子遣阴神，金殿识魔谈道德", "比丘国、驿馆、王宫", "唐三藏、孙悟空、比丘国王、国丈、美后、城中儿童", "妖道国丈要用一千一百一十一个孩子的心做药引，悟空藏起孩子并在金殿揭穿谎言。", [
        "比丘国街上摆着许多鹅笼，每个笼里都关着一个孩子。三藏问明原因，得知国王听信国丈，竟想伤害一千一百一十一个孩子来制作长寿药。",
        "三藏听得落泪。悟空趁夜拔毫毛变出护法，把所有孩子悄悄藏到安全地方。第二天，官兵发现鹅笼全空，只好向国丈报告。",
        "国丈又说唐僧的心效果更好，要国王取三藏的心。悟空变成三藏进入金殿，故意从衣中掏出许多颗不同颜色的假心，问国丈究竟要哪一颗。",
        "国丈知道身份败露，带美后逃走。悟空追赶，发现他们分别是白鹿和白面狐狸变化。南极寿星从天而降，说明白鹿是自己的坐骑，请悟空先救孩子和国王。"
      ]],
      [79, "寿星收回白鹿", "寻洞擒妖逢老寿，当朝正主救婴儿", "柳林坡清华洞、比丘国王宫", "孙悟空、猪八戒、白鹿精、南极寿星、比丘国王", "悟空八戒追到清华洞，寿星收回白鹿；孩子们回家，国王服药恢复清醒。", [
        "悟空和八戒找到柳林坡清华洞。白鹿精手持蟠龙拐杖迎战，狐狸精在洞中想逃，被八戒拦住。白鹿精跳上云头，正遇见赶来的南极寿星。",
        "寿星叫一声，白鹿立即丢下兵器，恢复温顺坐骑模样。原来它偷走寿星拐杖下界，又用美色和长生谎言迷惑国王。寿星把白鹿牵回身边。",
        "悟空请寿星赐几枚枣子给国王调养。国王服下后神智清醒，想起自己差点伤害全城孩子，十分后悔。他下令拆掉鹅笼，让父母接孩子回家。",
        "城中哭声变成欢笑。国王向三藏保证以后不再相信用别人生命换自己长寿的邪说。师徒离开比丘国时，孩子们站在街边挥手，悟空也难得安静地向他们点头告别。"
      ]],
      [80, "黑松林救下陌生女子", "姹女育阳求配偶，心猿护主识妖邪", "黑松林、镇海禅林寺", "唐三藏、孙悟空、猪八戒、沙悟净、金鼻白毛老鼠精", "三藏坚持救下一名被绑女子，悟空怀疑她是妖怪；当夜寺中僧人接连生病。", [
        "师徒经过黑松林，看见一名女子被绑在树上呼救。悟空闻到妖气，劝师父别管。三藏认为即使可能有危险，也不能见人受困不救，坚持让八戒解开绳索。",
        "女子说自己被强盗掳来，无处可去。师徒把她带到镇海禅林寺，请僧人暂时收留。悟空一直留心观察，发现她脚步很轻，夜里还悄悄离开房间。",
        "第二天，寺里几位僧人无故昏倒。悟空变成小虫跟踪女子，看见她现出妖怪模样吸取人的精气。他立即追击，妖怪却借地洞逃走。",
        "三藏因旅途劳累也病倒，只能留在寺中休养。悟空告诉八戒和沙僧严守门窗，自己寻找妖怪洞口。那女子正是陷空山无底洞的金鼻白毛老鼠精，她已经把目标转向三藏。"
      ]],
      [81, "无底洞里师父失踪", "镇海寺心猿知怪，黑松林三众寻师", "镇海禅林寺、黑松林、陷空山无底洞", "唐三藏、孙悟空、猪八戒、沙悟净、老鼠精", "老鼠精趁夜掳走三藏，悟空三兄弟在黑松林寻找无底洞入口。", [
        "悟空在寺中守夜，老鼠精先用替身引他离开，又从另一边钻入三藏房间，卷起师父逃走。悟空回来只见空床，知道中了调虎离山之计。",
        "三兄弟沿气味进入黑松林。八戒在草丛里乱拱，沙僧查看树根，终于发现一块写着“陷空山无底洞”的石碑。洞口很深，风从地下吹上来。",
        "悟空让八戒和沙僧守住外面，自己变成小虫飞下。洞中道路纵横，屋舍像地下宫殿。老鼠精为三藏准备素斋和新衣，假装温柔地劝他留下。",
        "三藏拒绝，老鼠精便把他藏到更深处。悟空听见声音却找不到准确位置，只好抓住小妖打听。小妖说大王有许多藏身洞室，明天还要举行婚宴。"
      ]],
      [82, "悟空变果子潜入洞房", "姹女求阳，元神护道", "陷空山无底洞", "唐三藏、孙悟空、猪八戒、老鼠精", "悟空变成果子让三藏吃下，藏进师父腹中传话，再寻找妖怪弱点。", [
        "悟空找不到师父，便变成一颗鲜红桃子放在盘中。老鼠精把果盘端给三藏，三藏一眼认出桃子上暗藏的猴毛，放心地吃了下去。",
        "悟空在师父腹中小声说明计划，让三藏假装答应婚宴，拖住妖怪。三藏虽然不喜欢说假话，为了让徒弟找到出口，只得暂时配合。",
        "夜里，悟空从三藏耳中钻出，变成小妖在洞中搜查。他发现一间香火堂，供着托塔天王李靖和哪吒的牌位，上面写着“父亲”和“兄长”。",
        "悟空猜到老鼠精与天庭有旧关系，先救三藏离开洞房，再把牌位带作证据。老鼠精发现后挥双剑追来，八戒从洞口赶下助战，双方在地下层层通道中展开追逐。"
      ]],
      [83, "托塔天王收义女", "心猿识得丹头，姹女还归本性", "无底洞、天宫", "孙悟空、老鼠精、托塔天王、哪吒、唐三藏", "悟空拿牌位上天对证，李靖和哪吒下界收回曾被饶命的老鼠精。", [
        "悟空带牌位到天宫找李靖。李靖起初说自己没有妖怪女儿，悟空拿出证据，哪吒提醒父亲：三百年前，他们曾在灵山捉到一只偷香花宝烛的金鼻白毛老鼠，饶她性命后，她认李靖为义父、哪吒为义兄。",
        "李靖带哪吒和天兵来到陷空山。哪吒用风火轮封住地面出口，悟空和八戒从洞内驱赶。老鼠精无路可逃，现出白毛老鼠原形。",
        "李靖用玲珑宝塔将她收住，带回天庭管教。悟空和八戒在洞中找到三藏与失落的行李，沙僧牵着白龙马在外接应。",
        "三藏承认自己这次太容易相信外表可怜的人。悟空也说，救人没有错，只是救助时要多观察、多保护自己。师徒离开黑松林，前方来到一个名字听起来就不欢迎和尚的国家。"
      ]],
      [84, "灭法国一夜全城光头", "难灭伽持圆大觉，法王成正体天然", "灭法国都城、客栈、王宫", "唐三藏、孙悟空、猪八戒、沙悟净、灭法国王", "国王发誓捉满一万名和尚，悟空施法剃去全城头发，让国王醒悟并改国名。", [
        "灭法国王曾发誓要捉一万名和尚，只差四人便满数。师徒不敢直接入城，便装成马商，把行李藏进大柜子。夜里强盗搬走柜子，官兵又把它当赃物抬进王宫。",
        "悟空从柜中钻出，听见国王和大臣商量第二天处置僧人。他没有挥棒打人，而是拔下毫毛变出无数小剃刀，一夜之间剃光国王、王后、官员和全城百姓的头发。",
        "清晨，人人看见镜中光头，都以为是神灵警告。悟空现身说明，外表相同并不能决定谁好谁坏，用身份惩罚无辜更不公平。国王想起自己多年的偏执，十分羞愧。",
        "国王向三藏道歉，撤销禁令，并把国名改为钦法国，表示尊重不同信仰。师徒取回柜子和白马，平安出城。八戒摸着自己本来就稀少的头发，庆幸悟空没再给他多剃一次。"
      ]],
      [85, "隐雾山假人头", "心猿妒木母，魔主计吞禅", "隐雾山折岳连环洞", "唐三藏、孙悟空、猪八戒、沙悟净、南山大王", "豹子精用假人头骗得悟空等人以为师父遇害，随后准备转移三藏。", [
        "隐雾山南山大王是一只豹子精。他知道悟空难对付，先派小妖用分瓣梅花计把师兄弟引开，再趁空抓走三藏。悟空回头寻找，只看见拖行痕迹。",
        "豹子精用柳木刻成三藏头形，涂上颜色，抛到洞外。悟空和八戒看到“人头”，以为师父真的遇害。悟空悲愤，八戒也收起平时的玩笑。",
        "沙僧仔细查看，发现切口没有血迹，怀疑是假。悟空用火眼金睛再看，认出是木头变化。三兄弟重新有了希望，决定夜探洞府。",
        "悟空变成小妖进入洞中，听见三藏仍在后洞诵经。豹子精正计划趁夜把他运走。悟空暗中放出毫毛守住各条山路，再回去通知八戒和沙僧同时进攻。"
      ]],
      [86, "八戒挥耙开隐雾山", "木母助威征怪物，金公施法灭妖邪", "隐雾山折岳连环洞", "孙悟空、猪八戒、沙悟净、南山大王、唐三藏", "悟空三兄弟里应外合攻破洞府，八戒清除拦路妖怪，救出三藏。", [
        "悟空在洞内现出本相，打散看守；八戒和沙僧从洞外攻入。豹子精挥铁杵抵抗，又让小妖放烟遮路。悟空吹散烟雾，把妖怪逼回主洞。",
        "豹子精变出多个假身逃跑，悟空用火眼金睛锁定真身。八戒从侧面一耙拦住退路，沙僧保护被解救的三藏。三兄弟终于制服南山大王。",
        "洞中还关着一些过路百姓，师徒一并放他们回家。八戒把挡路的石门和妖洞拱开，免得剩余小妖再占山害人。",
        "三藏得知徒弟曾被假人头骗得伤心，安慰他们自己安然无恙。悟空嘴上说早知道是假的，眼睛却避开师父。队伍重新上路，这场虚惊反而让彼此的牵挂更清楚。"
      ]],
      [87, "凤仙郡诚心求雨", "凤仙郡冒天止雨，孙大圣劝善施霖", "凤仙郡、天宫", "唐三藏、孙悟空、凤仙郡侯、玉皇大帝、龙王", "凤仙郡三年大旱，悟空查明郡侯曾冒犯上天；全城真心改过行善后，甘雨降临。", [
        "凤仙郡三年没下雨，田地干裂，百姓缺水。郡侯听说悟空会求雨，恳请师徒相助。悟空到天宫询问，才知道三年前郡侯因家庭争执推倒供桌，还说了冒犯天地的话。",
        "玉帝设下三件难题：鸡啄完米山、狗舔完面山、灯火烧断金锁，才准降雨。这些事看似永远做不完。悟空返回凤仙郡，没有假装自己立刻能解决。",
        "三藏劝郡侯先真心承认错误，善待百姓，而不是只做表面仪式。郡侯开仓放粮、节省用水，带领全城互相帮助，并日日反省。大家的善意逐渐汇聚。",
        "天宫中的米山、面山和金锁竟很快消失。玉帝命龙王降下甘雨，雨水浸润田地，孩子们在街上欢呼。悟空告诉郡侯，改变不是为了交换一场雨，而是以后每一天都要记得尊重和责任。"
      ]],
      [88, "玉华州三王子拜师", "禅到玉华施法会，心猿木母授门人", "玉华州王府、城外校场", "唐三藏、孙悟空、猪八戒、沙悟净、玉华王与三位王子", "三位王子分别拜悟空、八戒、沙僧学艺，照样打造的三件兵器却在夜里失窃。", [
        "玉华州三位王子喜欢武艺，见悟空三兄弟兵器不凡，提出比试。悟空轻松举起千钧石狮，八戒展示钉耙，沙僧挥动宝杖，三位王子心服口服。",
        "大王子拜悟空为师，二王子拜八戒，三王子拜沙僧。三位师父教他们先练脚步、呼吸和耐心，不许一开始只追求威风。王子们认真学习，进步很快。",
        "工匠按照金箍棒、九齿钉耙和降妖宝杖的样子打造新兵器。原兵器放在工坊作样板，夜里放出霞光，惊动附近豹头山虎口洞的黄狮精。",
        "黄狮精带小妖趁夜偷走三件神兵。第二天，悟空等人看见空架子，王子们十分自责。悟空安慰他们，真正学到的本领并没有被偷走，随后带八戒、沙僧追向豹头山。"
      ]],
      [89, "黄狮精要办钉耙宴", "黄狮精虚设钉钯宴，金木土计闹豹头山", "豹头山虎口洞、玉华州", "孙悟空、猪八戒、沙悟净、黄狮精、九灵元圣", "黄狮精偷兵器只为开宴炫耀；悟空三兄弟变化潜入，夺回兵器并追查他的祖翁。", [
        "悟空抓住买猪羊的小妖，得知黄狮精准备举办“钉耙宴”，向伙伴炫耀三件兵器。黄狮精还认真给商贩付钱，并没有随意抢夺百姓，这让悟空觉得他与其他妖怪有些不同。",
        "悟空三兄弟变成小妖和商贩混进宴席，趁众妖喝酒时各自拿回兵器。黄狮精发现后追赶，双方打到虎口洞外。黄狮精不敌，只得去竹节山请祖翁九灵元圣。",
        "九灵元圣是一只九头狮子，张开九张大口，能同时擒人。他听说徒孙受欺，带领许多狮子精来到玉华州，连王子和部分师徒都被抓走。",
        "悟空避开九张大口，查问土地后得知九灵元圣来自东极妙岩宫，是太乙救苦天尊的坐骑。悟空立即前往求助，希望在更多人受伤前结束这场争斗。"
      ]],
      [90, "九灵元圣归东极", "师狮授受同归一，盗道缠禅静九灵", "竹节山、东极妙岩宫、玉华州", "孙悟空、九灵元圣、太乙救苦天尊、黄狮精、三位王子", "太乙救苦天尊收回九灵元圣，玉华州恢复安宁，三位王子继续练习守护百姓。", [
        "太乙救苦天尊查看狮奴，发现他偷喝仙酒睡着，九灵元圣才得以下界。天尊与悟空来到竹节山，摇动铃铛，九头狮子立刻收起凶相，伏在主人面前。",
        "九灵元圣回归坐骑，洞中被抓的人全部获救。黄狮精和其他狮子精失去依仗，不再作乱。悟空没有追打已经放下兵器的小妖，只把它们驱散。",
        "三件神兵回到主人手中，王子们的新兵器也打造完成。悟空、八戒和沙僧各自检验徒弟，提醒他们武艺越强，越要先保护弱小、遵守分寸。",
        "三位王子在城外恭送师父。八戒很舍不得王府的好饭菜，仍挑起行李追上队伍。师徒离灵山越来越近，但前方元宵灯会的热闹背后，又藏着三个冒充神灵的妖怪。"
      ]],
      [91, "金平府三盏酥合香油灯", "金平府元夜观灯，玄英洞唐僧供状", "金平府、青龙山玄英洞", "唐三藏、孙悟空、猪八戒、沙悟净、辟寒辟暑辟尘三大王", "三只犀牛精假扮佛爷收取香油，在元宵灯会上抓走三藏。", [
        "金平府元宵节张灯结彩，三座大灯缸里装满珍贵酥合香油。当地人说每年都有佛爷来收油，家家愿意出钱供奉。三藏想亲眼礼佛，随众人来到灯桥。",
        "半夜，三位“佛爷”乘风而来。悟空看出云气不正，刚要提醒，三藏已经被卷走。所谓佛爷其实是辟寒、辟暑、辟尘三只犀牛精，住在青龙山玄英洞。",
        "悟空三兄弟追到洞口。犀牛精的角能放寒气、热气和烟尘，三种力量交替出现，洞前一会儿结霜，一会儿灼热，一会儿什么也看不见。",

      ],
      24: [
        "清风端来人参果时，三藏吓得连连摆手：“好端端的娃娃，怎能入口？”童子解释半天也没用，只好关门分吃。八戒贴在门外听见咀嚼声，口水几乎滴到鞋面。",
        "悟空第一次敲下果子，只听“扑”的一声，地面连个坑也没有。他趴在土上找，八戒还以为果子会挖洞。土地现身说此果遇金落、遇木枯、遇水化、遇火焦、遇土入，必须用丝帕接。",
        "三兄弟分果时，沙僧慢慢品尝，悟空两三口吃完，八戒却一口吞下。他看看别人手里空空的果核都没有，急道：“方才只觉得喉咙一滑，到底什么味？”",
        "清风明月数果发现少了，话越说越难听。悟空原本想赔礼，听到他们连师父也骂，怒火一下冲上来。金箍棒推倒果树后，八戒看着满园震动，悄声说：“这回比偷果子严重多了。”"
      ],
      25: [
        "镇元大仙在云头展开衣袖，袖口像一片黑云罩下。师徒还没看清，已经连白马一起落入袖中。八戒摸着四周叹道：“这衣袖比客店还大，只是没有饭桌。”",
        "悟空让毫毛替身受罚，自己躲在梁上。童子打了半天发现木桩不会喊疼，镇元大仙抬头道：“大圣，梁上灰多，下来坐坐吧。”悟空只好嘿嘿一笑跳下。",
        "第二次逃跑前，悟空把柳树变成师徒模样。众人刚走出几十里，镇元大仙已从后面追来。悟空这才承认，对方的袖里乾坤不是单靠跑得快能躲开。",
        "三藏说愿与果树一起受罚，悟空听了反而更难受。他拍胸口答应三日找方，却没有把握。飞离五庄观时，他第一次不是为争胜去求仙，而是为弥补自己闯下的祸。"
      ],
      26: [
        `悟空先上蓬莱仙岛求福禄寿三星。三星听说他推倒了人参果树，都摇头道：“那是天地灵根，我们只能替你说情，不能让枯木回春。”悟空虽着急，仍请三星去五庄观稳住镇元大仙，自己继续寻找办法。`,
        `他又走遍方丈、瀛洲，问过许多老神仙，得到的回答都一样。悟空第一次发现，有些祸不能靠一棒子打过去。他抓抓耳朵，自言自语：“既是我闯的祸，翻遍三岛十洲，我也得把树救活。”`,
        `最后，他来到南海紫竹林。观音菩萨听完经过，责备道：“人参果何等珍贵，你怎么又使性子？”悟空低头认错。菩萨见他肯担当，便取净瓶甘露，与他一同赶往五庄观。`,
        `菩萨用杨柳枝蘸起甘露，轻轻洒向树根。倒伏的大树慢慢立直，枝叶重新舒展，树上竟又结出二十三个果子。镇元大仙心服口服，与悟空结为兄弟，还摆下果会。八戒盯着果子咽口水，逗得众人都笑了。`,
      ],
      27: [
        `师徒走进白虎岭，悟空去远处化斋，临走画了一个金光闪闪的圆圈，叮嘱大家别出去。白骨精闻到唐僧气息，变成提着饭篮的年轻女子，柔声说是来送斋饭。八戒闻见米香，早把悟空的叮嘱忘了一半。`,
        `悟空踏云回来，一眼看穿妖气，举棒便打。妖怪使出“解尸法”逃走，只留下一具假身。唐僧以为悟空伤了无辜，气得念紧箍咒。悟空疼得满地打滚，却仍指着山风说：“师父，她根本不是人！”`,
        `白骨精不甘心，又先后变成寻找女儿的老婆婆和拄杖的老公公。悟空一次次识破，第三次终于打散妖怪真身，地上现出一堆白骨。可妖怪留下的假象太真，唐僧和八戒都以为悟空连伤三人。`,
        `唐僧写下贬书，要赶悟空走。悟空含泪给师父磕头，又拔下一把毫毛留给沙僧：“真遇到难处，就叫我。”他驾云离去时还回头望了几次。山路上少了那个吵吵闹闹的身影，忽然安静得让人心里发空。`,
      ],
      28: [
        `悟空回到花果山，看到水帘洞荒草丛生、小猴四散，心里又酸又怒。他赶走占山猎户，重新召集猴群，修整洞府。众猴欢呼“大王回来了”，可夜深时，悟空总会望着西方，猜师父走到了哪里。`,
        `唐僧三人来到黑松林。八戒和沙僧去化斋，唐僧独自走出保护圈，误入碗子山波月洞。黄袍怪把他捉住，却因洞中的百花羞公主暗中求情，暂时没有伤他。`,
        `百花羞原是宝象国公主，十三年前被妖怪掳来。她悄悄交给唐僧一封家书，请他带回王宫。黄袍怪装作大方放走唐僧，唐僧答应无论如何都要替公主送信。`,
        `宝象国王读信痛哭，请八戒、沙僧救女。二人回洞挑战，黄袍怪现出神通，把他们打得节节后退。更糟的是，妖怪随后变成俊俏驸马进宫，反咬一口，说唐僧才是老虎精。`,
      ],
      29: [
        `八戒和沙僧再闯波月洞。八戒钉耙挥得呼呼作响，沙僧宝杖守得稳稳当当，可黄袍怪刀法凶猛，还叫出小妖围攻。八戒见势不妙先钻进草丛，沙僧独力支撑，最后也被捉进洞里。`,
        `宝象国宫中，黄袍怪当着国王和群臣的面施法，把唐僧变成一只斑斓猛虎，关进铁笼。唐僧明明想说话，出口却只剩低沉吼声。国王又怕又伤心，一时分不清谁真谁假。`,
        `白龙马夜里挣断缰绳，化作一位宫女潜入宴席。他捧剑起舞，忽然刺向妖怪。黄袍怪识破后举刀便砍，小白龙受伤逃回马厩，伏在槽边喘气，却仍惦记着如何救师父。`,
        `八戒从草丛回来，看见白龙马流血，终于慌了。小白龙劝他：“只有大师兄能救师父。”八戒嘴上嘟囔怕挨骂，脚下却不敢耽搁，连夜往花果山赶去。`,
      ],
      30: [
        `八戒到了花果山，不肯直说求救，先夸悟空日子自在。悟空听出不对，追问师父情况。八戒故意说黄袍怪骂他是“弼马温”，悟空气得跳起来：“他敢骂我？带路！”其实他最放心不下的，还是被变成老虎的师父。`,
        `悟空先潜入波月洞，变成百花羞公主的模样哄骗妖怪。黄袍怪拿出舍利子玲珑内丹，悟空一口吞下，现出本相在他肚里翻腾。妖怪疼得求饶，悟空跳出来又与他打到云端。`,
        `两人大战许久，悟空看出妖怪并非凡间精怪，便上天查问。玉帝点查星宿，发现二十八宿少了奎木狼。原来黄袍怪正是奎木狼私自下界，与披香殿侍女转世的百花羞续缘。`,
        `众星官收回奎木狼，悟空救出沙僧，又让唐僧恢复人身。唐僧看着风尘仆仆的悟空，既羞愧又欢喜。悟空只说：“师父，路还长，往后可得听老孙一句。”师徒重新上路，队伍终于又完整了。`,
      ],
      31: [
        `宝象国王见女儿平安归来，亲自向师徒道谢。百花羞望着阔别十三年的宫殿，像从一场长梦中醒来。她也替唐僧说明真相，群臣这才知道，那只笼中的老虎原来是受了妖法。`,
        `唐僧向悟空认错，悟空却没有趁机摆架子。他把行李重新挑好，又检查白龙马的伤。八戒在旁边说：“这回多亏我把猴哥请来。”悟空笑道：“你那张嘴虽然贪吃，偶尔也能办件正事。”`,
        `沙僧把波月洞中经过细细说出，提醒师父妖怪最会利用人的眼睛和耳朵。唐僧点头道：“看见的未必全是真的，认定别人有错以前，也该多听一句解释。”这句话，是他用一场大难换来的明白。`,
        `临行前，国王送来金银和车马，唐僧一概谢绝，只收了些干粮清水。师徒四人踏出城门，悟空走在最前面探路，八戒在后面哼着小调，西行的脚步又变得热闹起来。`,
      ],
      32: [
        `平顶山莲花洞里住着金角大王、银角大王。他们听说唐僧经过，拿出五件厉害宝贝，又命小妖画下师徒画像。悟空刚进山便觉妖气冲天，催大家快走，八戒却嚷着肚饿。`,
        `悟空让八戒先去巡山。八戒走到背风处便躺下睡觉，醒来后编了一套“前面太平无事”的话。悟空变成小虫藏在他衣领里，把谎话听得清清楚楚，回去故意让他再巡一次。`,
        `这一次，银角大王亲自出山，变成一个跌伤腿的老人。唐僧心软，要悟空背他。妖怪趴在悟空背上暗念咒语，搬来须弥山、峨眉山压住悟空，又搬来泰山，终于把他压得动弹不得。`,
        `妖怪趁机捉走唐僧、八戒和沙僧。山神土地赶来搬开三座山，悟空抖落泥土，眼里冒火。他没有急着冲进洞，而是变成小妖，准备先探清那些宝贝究竟怎样使用。`,
      ],
      33: [
        `悟空装成送信的小妖混进莲花洞，听见金角、银角商量：紫金红葫芦和羊脂玉净瓶只要叫出名字，对方一答应就会被吸进去。他暗暗记住规则，决定让妖怪先尝尝自己的法宝。`,
        `银角大王派精细鬼、伶俐虫拿葫芦去装悟空。悟空拔毫毛变出一个能“装天”的假葫芦，骗得两个小妖目瞪口呆。双方交换宝贝后，悟空抱着真葫芦笑道：“聪明反被聪明误。”`,
        `另一边，妖怪又让九尾狐狸派人送幌金绳。悟空半路变成老狐狸模样，把抬轿小妖支开，夺到绳子。可金角念动松绳咒，绳子反把悟空捆得结结实实。`,
        `悟空趁看守不注意，变成小锉刀磨断绳子，再把替身留下。他一会儿扮小妖，一会儿化老道，把莲花洞搅得真假难分。被绑着的八戒看得眼花，只盼猴哥别把自己也忘在洞里。`,
      ],
      34: [
        `悟空与银角交战，故意叫出妖怪名字。银角顺口答应，立刻被吸进红葫芦。悟空摇了摇葫芦，学着妖怪口气说：“进去容易，出来可难。”洞中小妖见二大王不见了，顿时乱作一团。`,
        `金角拿七星剑、芭蕉扇来战，又放出幌金绳。悟空一面闪避火焰，一面设法夺宝。谁知他稍一疏忽，也被净瓶吸了进去。妖怪塞紧瓶口，得意地等他化成水。`,
        `悟空在瓶中拔毫毛变成小钻，钻开一道细缝逃出，又留下假身。他变作道士，声称能“移山换海”，把净瓶骗到手。金角发现上当，气得举剑乱砍。`,
        `最后，悟空用葫芦收了金角，救出师父师弟。正要毁掉宝贝时，天边传来一声：“大圣，手下留情。”太上老君骑着青牛赶到，原来两个妖王竟是他看炉的童子。`,
      ],
      35: [
        `太上老君说，童子趁他不备偷走五件宝物下凡。悟空却眯眼问：“怎么连扇火、装丹、束袍的家什全都偷得这么齐？”老君只笑着收回法宝，把金角银角唤回童子模样。`,
        `唐僧被救出后，见洞中满地绳索和空瓶，才知道悟空经历了多少险境。八戒忙说自己也和妖怪大战过，悟空揭穿道：“你先在山沟里睡了一觉。”大家笑得八戒耳朵都红了。`,
        `经过这场磨难，悟空告诉师弟：“法宝再厉害，也得先弄清规矩。只凭力气冲上去，正好钻进人家的瓶子。”沙僧点头，八戒则摸着肚子说：“我记住了，先吃饱再想规矩。”`,
        `师徒离开平顶山，回头只见莲花洞门紧闭，妖气已经散尽。唐僧催马向西，悟空扛棒走在山梁上。阳光照亮前路，又一段险途终于被他们甩在身后。`,
      ],
      36: [
        `一行人夜宿敕建宝林寺。寺中僧人嫌他们风尘仆仆，不肯开门。悟空现出金箍棒轻轻往地上一顿，石板裂开细纹，僧人才慌忙迎接。唐僧责怪他吓人，悟空却说：“有时讲理，也得先让人肯听。”`,
        `夜里月色明亮，唐僧在院中赏月，与悟空谈起心中的思乡之情。悟空说，月亮照得到东土，也照得到西天；只要脚下不停，总会走到。师徒难得安静地说了一番心里话。`,
        `三更时，唐僧梦见一个浑身湿淋淋的国王。国王哭诉自己是乌鸡国真王，三年前被一个道士推入井中，妖道变成他的模样占了王位。说完，他留下白玉圭作为证物。`,
        `唐僧惊醒，果然在枕边摸到玉圭。悟空听完，决定先去井边查证。他叫八戒同行，还故意说井底藏着许多宝贝。八戒立刻精神百倍，扛起钉耙便跟了出去。`,
      ],
      37: [
        `悟空来到乌鸡国，变成一只小兔引太子追进宝林寺。他恢复本相，把白玉圭和国王托梦之事告诉太子。太子半信半疑，因为宫中那位“父王”的样貌、声音都毫无破绽。`,
        `悟空提醒他回去问母后：三年来，国王的脾气、习惯是否改变。太子藏好玉圭，假装打猎归宫。王后看见玉圭脸色大变，又说国王三年没有踏进后宫，太子这才相信父亲真的遇害。`,
        `夜里，悟空和八戒来到御花园八角琉璃井。井龙王领他们找到沉在水晶宫中的国王遗体。八戒背着国王往上爬，一路抱怨“宝贝怎么这么沉”，到了井口才知道自己背的是个人。`,
        `遗体虽然三年不坏，却没有气息。悟空让八戒、沙僧守护，自己直奔兜率宫求太上老君。老君不肯轻易给仙丹，悟空便赖在丹房不走，最后讨得一粒九转还魂丹。`,
      ],
      38: [
        `悟空把还魂丹塞进国王口中，又吹一口仙气。国王先咳出井水，随后慢慢睁开眼。他看见太子和王后，泪流满面，却怕贸然进宫会打草惊蛇。`,
        `第二天，唐僧师徒入朝倒换关文。假国王坐在殿上，悟空故意问他许多只有真王才知道的旧事。妖怪答得支支吾吾，忽然发怒，命武士捉拿师徒。`,
        `太子扶着真国王走上大殿，两个一模一样的国王同时出现。群臣惊得不知跪谁。妖怪抢先说悟空用变化术造假，悟空笑道：“那就请你们的王后认一认，谁还记得从前的家事。”`,
        `妖怪见身份将破，拔剑冲出宫门。悟空追到云端与他交战，正要一棒打下，文殊菩萨赶来收住妖怪。原来它是文殊座下的青毛狮子，奉命下界考验国王。`,
      ],
      39: [
        `文殊菩萨解释，乌鸡国王从前曾冒犯前来度化他的菩萨，所以要在井中受三年之难。悟空听后仍替国王不平：“考验归考验，可百姓也跟着受苦。”菩萨没有争辩，只把青狮带走。`,
        `真国王重新登位，王后和太子陪在身边，满朝文武终于分清真假。国王重谢师徒，又整顿朝政，免去妖道留下的苛刻规矩。城中百姓敲锣打鼓，庆祝久违的真王归来。`,
        `八戒回想自己背尸体的经历，越想越觉得吃亏，追着悟空要井底宝贝。悟空笑得直不起腰：“你背回来的不是金银，却救活了一国之主，这不是更大的宝贝？”`,
        `唐僧在关文上盖好宝印，领着徒弟离开乌鸡国。他叮嘱大家，世间最难识破的并不是凶恶面孔，而是披着熟悉外表的假象。悟空点点头，把金箍棒扛得更稳。`,
      ],
      40: [
        `号山枯松涧的红孩儿听说唐僧肉能长生，便变成一个被吊在树上的孩子，高声呼救。悟空看出附近有妖气，不许师父靠近。唐僧却见孩子哭得可怜，坚持让悟空把他放下来。`,
        `红孩儿趴到悟空背上，暗暗使出千斤之力。悟空故意把他摔向石头，妖怪却借风逃走。接着一阵旋风卷来，吹得沙石漫天，唐僧就在混乱中被摄进火云洞。`,
        `悟空追到洞前叫阵。红孩儿手持火尖枪，鼻子里喷烟，口中吐火，与悟空战了几十回合。八戒赶来助阵，红孩儿忽然退到门前，用拳头猛击鼻子，喷出三昧真火。`,
        `这火不是普通水能浇灭的。悟空招来龙王降雨，雨水反被烧得滚烫，烟火把悟空熏得昏了过去。八戒和沙僧把他救醒，悟空咳着说：“这孩子年纪不大，火气倒真不小。”`,
      ],
      41: [
        `八戒说自己去南海请观音。红孩儿听见后，变成观音模样在半路等他。八戒看见“菩萨”便倒头就拜，跟着走进山洞才发现上当，被小妖捆得像一只大粽子。`,
        `悟空变成红孩儿的父亲牛魔王，进洞假装探望。红孩儿问起家中旧事，悟空答错了母亲铁扇公主的生辰。红孩儿立刻翻脸：“你这父亲是假的！”两人又从洞里打到洞外。`,
        `悟空只好亲赴南海。观音听说红孩儿假扮自己，脸色严肃起来。她把净瓶抛入海中装满一海之水，又让木叉借来天罡刀，准备给这个顽劣的孩子一场真正的教训。`,
        `来到火云洞前，观音让悟空把红孩儿引出来。悟空故意在门口大笑：“你的火也不过如此！”红孩儿果然提枪追来，却没看见云端上已经布好了一座莲花宝座。`,
      ],
      42: [
        `红孩儿坐上莲台，莲瓣忽然化成锋利天罡刀，把他牢牢围住。他挣扎着跳下，观音又抛出五个金箍，套住他的手脚和头。红孩儿每动一下，箍便收紧，只得跪地求饶。`,
        `观音没有立刻相信，故意转身离开。红孩儿又抓起长枪偷袭，观音念动真言，他顿时双手合十、一步一拜，再也逞不了凶。这个火气冲天的小妖王，终于学会了低头。`,
        `观音给他法名善财童子，带回南海修行。悟空闯入火云洞，解开八戒和唐僧的绳索。八戒一见悟空就抱怨假观音害苦了自己，悟空笑道：“谁让你见了便拜，连真假都不看。”`,
        `唐僧得知红孩儿没有被打死，而是有了改过的去处，心里十分安慰。师徒离开枯松涧时，天边的火云已经散去，只剩清凉山风吹过松林。`,
      ],
      43: [
        `师徒来到黑水河，见河面平静，便搭上一只小船。船夫其实是鼍龙变化，船到河心突然翻转，把唐僧和八戒捉进水府。沙僧水性好，举宝杖追入河底。`,
        `沙僧与鼍龙在水中大战，悟空则守在岸边。鼍龙写请帖，要请西海龙王来吃唐僧。悟空拿到请帖，发现妖怪竟与龙宫有亲，立刻赶往西海问罪。`,
        `西海龙王大惊，原来鼍龙是泾河龙王的儿子，寄养在他这里，却偷偷占了黑水河。太子摩昂披挂出战，用三棱锏与鼍龙斗在水底，最终把他锁住带回。`,
        `唐僧和八戒被救上岸，浑身湿透。八戒一边拧衣服一边埋怨：“看着越平静的水，越会藏事。”悟空答道：“所以过河不能只看水面，也要问清水底住着谁。”`,
      ],
      44: [
        `车迟国尊奉三位道士国师，却把和尚都抓去做苦役。悟空听见哭声，变成道士去查看，发现几百名和尚正拖着沉重木车。他拔一把毫毛变成小悟空，悄悄解开绳索，吓跑监工。`,
        `和尚们说，三位国师能呼风唤雨，因此国王对他们言听计从。悟空把师徒姓名告诉众人，叫他们夜里若遇危险便念“齐天大圣”。那一夜，真的有小和尚梦见一位金光闪闪的猴王来救他们。`,
        `悟空、八戒、沙僧夜闯三清观。供桌上摆满馒头、鲜果和油炸点心，八戒两眼放光。三人把神像藏起，自己变成三清模样坐上神台，大吃供品。`,
        `三位国师回来祈求圣水。悟空三人暗中捉弄，让他们喝了怪味“仙水”，随后现出声音大笑。国师们发现受骗，气得追出道观。第二天，双方在朝堂上正式较量。`,
      ],
      45: [
        `虎力大仙先与悟空比赛求雨。他登坛舞剑、烧符念咒，半空果然聚起云来。悟空飞上天询问，才知道风婆、雷公和龙王只是按虎力的号令办事，便命他们先别落雨。`,
        `虎力折腾半天，一滴雨也没有。轮到悟空，他只把金箍棒朝天一指，风雷云雨依次来到，大雨正好下满规定时辰。百姓欢呼，三位国师却说这只是碰巧。`,
        `接着比赛坐禅。鹿力大仙坐上高台，悟空变成小虫钻进他鼻孔，咬得他喷嚏不断，摔下台去。羊力大仙又变出蜈蚣咬唐僧，悟空化作公鸡把蜈蚣啄走。`,
        `国王已经看出师徒本领，却仍被国师逼着继续。悟空望着三位道士说：“比本事可以，可若只为争面子，越比越会露出真相。”更危险的三场赌赛，随即摆到了众人面前。`,
      ],
      46: [
        `虎力大仙要比赛砍头。悟空先让刽子手一刀砍下自己的脑袋，头颅滚到远处还喊：“头来！”虎力暗中派土地按住，悟空便从腔子里重新长出一个头，惊得满城百姓齐声叫好。`,
        `轮到虎力，他的头被砍下后也能召回。悟空变成黄犬，把那颗头叼走。虎力再也唤不回来，只好现出无头黄毛虎的原形。国王这才知道，国师果然不是人。`,
        `鹿力大仙比赛剖腹挖心，悟空打开肚皮，在里面随手翻找，还掏出一堆奇奇怪怪的东西逗大家笑。鹿力刚剖开肚腹，悟空变成鹰叼走他的五脏，他便现出白鹿原形。`,
        `羊力大仙要下滚油锅。悟空发现有冷龙暗中护住油温，便让北海龙王收走冷龙。油锅立刻沸腾，羊力现出羚羊原形。三妖尽除，国王释放和尚，从此不再因衣着和门派欺压百姓。`,
      ],
      47: [
        `通天河边的陈家庄每年都要给灵感大王献上一对童男童女，否则妖怪便不降雨。师徒借宿时，正遇陈家哭着准备送走一秤金和陈关保两个孩子。唐僧听得心痛，悟空和八戒决定代替他们。`,
        `悟空变成小男孩陈关保，八戒变成女孩一秤金。八戒嫌女孩衣裳紧、头花扎得痒，悟空警告他别露馅。两人坐进供桌上的红柜子，被村民抬到河边庙中。`,
        `灵感大王夜里来吃祭品，悟空突然抽出金箍棒，八戒也举起钉耙。妖怪没想到“点心”会还手，慌忙逃回水府。悟空追到河边，只见浪花合拢，不见踪影。`,
        `第二天，灵感大王听说唐僧就在庄中，更想得到他。他命令河面结冰，做出一条闪亮宽阔的冰路。悟空看见寒冬里的冰面，心中起疑，唐僧却觉得这是上天赐路。`,
      ],
      48: [
        `通天河冰面上人来车往，看似十分结实。唐僧催马过河，悟空用棒敲了敲冰层，总觉得底下有空响。八戒却滑得兴起，张开双臂说这条路比走山坡轻松多了。`,
        `走到河心，灵感大王突然从水底施法。冰层“咔嚓”裂开，白龙马腾身跳开，唐僧却连人带马落入水中。妖怪把他捉进水府，冰面随后又重新封住。`,
        `悟空、八戒和沙僧在岸边凿冰寻找。八戒下水叫阵，沙僧从另一侧包抄，妖怪却闭门不出，只派鱼虾搅起浑水。三兄弟忙了一夜，也没能救出师父。`,
        `悟空想到妖怪自称“灵感大王”，庙中又供着观音画像，猜它或许来自南海。他让沙僧守河，自己一个筋斗赶往紫竹林。观音正在编竹篮，听完便立刻起身。`,
      ],
      49: [
        `观音没有换盛装，只提着刚编好的紫竹篮来到河边。她把篮子放入水中，念道：“死的去，活的住。”河中鱼虾纷纷散开，只有一条金鱼跳进篮里。`,
        `原来灵感大王是观音莲花池中的金鱼，每日听经有了灵性，趁涨潮逃到通天河作怪。观音收回金鱼，河底宫殿随即崩散，悟空等人救出唐僧。`,
        `陈家庄百姓得知再也不用献孩子，家家点灯庆贺。为了报恩，他们连夜修建一座救生寺。唐僧却提醒众人，真正值得庆祝的，是从此每个孩子都能平安长大。`,
        `过河时，一只巨大老鼋浮出水面，愿驮师徒到对岸。他请唐僧到西天后替自己问佛祖：修行多年，何时能脱去龟壳化成人身？唐僧认真答应，把这件事记在心里。`,
      ],
      50: [
        `悟空外出化斋前，用金箍棒在地上画了一个大圆圈，严肃叮嘱：“不论看见什么，都别跨出去。”唐僧答应得好好的，可八戒很快就嫌圈里无聊，还看见不远处有座漂亮楼阁。`,
        `楼里没人，桌上却摆着绸衣和背心。八戒穿上一件，唐僧和沙僧也想拿来御寒。谁知衣服一上身便越收越紧，三人动弹不得。独角兕大王带着小妖出现，把他们连同行李一并抓走。`,
        `悟空回来只见空圈，顺着脚印找到金兜洞。他与独角兕大战，对方取出白森森的金刚琢，只一晃便把金箍棒吸走。悟空手中一空，惊得翻身退开。`,
        `悟空不肯认输，先后请来托塔天王、哪吒和火德星君。刀枪剑戟、风火轮、烈焰兵器刚一使出，全被金刚琢收得干干净净。满天神将面面相觑：这妖怪究竟从哪里得到如此厉害的圈子？`,
      ],
      51: [
        `悟空又请水德星君和黄河水伯放水淹洞。独角兕抛出金刚琢，连水伯的盛水法器也吸走了。悟空气得抓耳挠腮，却发现妖怪每次取圈时，都十分小心地护着右臂。`,
        `如来佛祖知道妖怪来历，却没有直接说明，只给悟空十八粒金丹砂作提示。十八罗汉把金丹砂铺成一片金色沙海，想把妖怪困住，不料金刚琢一转，连金砂也被收走。`,
        `悟空追到天庭四处查访，最后来到兜率宫。太上老君一摸座前，发现青牛不见了；再查宝库，金刚琢也少了。看牛童子承认自己打瞌睡，青牛咬断缰绳逃下凡间。`,
        `老君拿着芭蕉扇赶到金兜洞。青牛见主人出现，立刻现出原形。老君用扇一扇，它便软了双腿，乖乖让老君骑走。洞中所有兵器法宝哗啦啦落了一地，众神终于各自领回东西。`,
      ],
      52: [
        `悟空冲进洞里给师父松绑。八戒看见满地兵器，先抢回钉耙，又想顺手拿几件别人的宝贝，被哪吒一把按住。悟空笑道：“咱们是来救人的，可不是来分赃的。”`,
        `唐僧听说妖怪竟是太上老君的青牛，感叹一路上许多妖怪都有来处。悟空却说，有主人不等于可以胡作非为；看管不严的人，也应当知道自己惹出了多大麻烦。`,
        `师徒离开金兜山时，八戒回头看那座楼阁，仍觉得那件绸背心可惜。沙僧提醒他，若不是贪图衣物，也不会落进圈套。八戒嘴硬道：“我那是替师父试衣裳。”`,
        `前方春水渐暖，路旁村舍升起炊烟。经历了金刚琢的怪事，悟空把金箍棒握得格外紧。他明白，再强的兵器也可能被克制，真正不能丢的是临危不乱的脑子。`,
      ],
      53: [
        `师徒来到西梁女国地界，唐僧和八戒口渴，喝了子母河的水。没走多远，两人肚子便一阵阵疼，还能感觉里面像有小东西在动。八戒吓得脸色发白：“我老猪难道真要生娃娃？”`,
        `村中老婆婆告诉他们，女儿国没有男子，喝了子母河水便会怀胎，只有解阳山落胎泉能解。悟空扶着笑弯腰的沙僧说：“你守好师父，我去给这两位准妈妈讨泉水。”`,
        `落胎泉被如意真仙霸占，他正是红孩儿的叔叔。听说悟空曾让红孩儿被观音收走，他提起如意钩便打，不肯给水。悟空与他交战，沙僧趁机取到一罐泉水。`,
        `唐僧和八戒喝下泉水，腹痛渐渐消失。八戒抱着空罐长出一口气，又小声问能不能带一点防身。悟空打趣：“你只要别再见河水就喝，什么防身水都用不着。”`,
      ],
      54: [
        `女儿国王听说东土来了一位俊雅圣僧，亲自在大殿接见。她愿把王位和全国财富都交给唐僧，只求与他结为夫妻。八戒听得心动，悄悄对悟空说：“师父当国王，咱们也能做大官。”`,
        `唐僧一心取经，却又怕当面拒绝会引起麻烦。悟空让他暂且应允，等换好关文、送徒弟出城时再脱身。唐僧明知是计，面对国王真诚的目光，仍觉得十分为难。`,
        `国王设下盛宴，宫中张灯结彩。她不谈法术，也不施威逼，只温柔地描绘安稳生活。唐僧沉默片刻，郑重说明自己已经许下西行誓愿，不能因为富贵与情意停步。`,
        `国王最终为关文盖印，亲自送他们出城。就在众人以为风波过去时，路旁突然卷起一阵怪风，蝎子精伸出钢叉般的手臂，一把摄走唐僧，只留下国王和徒弟们惊呼。`,
      ],
      55: [
        `蝎子精把唐僧带到毒敌山琵琶洞，摆酒劝他成亲。唐僧闭目念经，不吃不喝。妖怪恼怒又不舍得伤他，只能命小妖看守，自己出洞迎战追来的悟空和八戒。`,
        `蝎子精手持三股钢叉，尾巴上还有一枚厉害倒马毒桩。悟空一棒打来，她转身一刺，毒桩正中悟空额头。悟空疼得连连后退，额上肿起大包，连金刚之躯都难以忍受。`,
        `观音告诉悟空，这蝎子曾在灵山听经，连如来伸手推她时也被蜇过。世间只有昴日星官能制住她。悟空立刻飞到天庭，把像大公鸡一样威武的星官请来。`,
        `昴日星官对着洞门高鸣两声，蝎子精浑身发软，现出巨大蝎子原形。悟空救出唐僧，八戒看着妖怪尾针心有余悸：“难怪说小小一根刺，也能让猴哥吃大亏。”`,
      ],
      56: [
        `山路上，几个强盗拦住师徒，抢走行李。悟空夺回东西，又用重手惩治了为首者。唐僧见他毫不退让，责怪他杀心太重；悟空觉得自己保护师父反被责骂，师徒越说越僵。`,
        `夜宿杨老者家时，强盗再次纠集同伴追来，其中竟有老者的儿子。悟空变出许多分身吓散众人，仍把那个屡教不改的首领打倒。唐僧难过得念起紧箍咒。`,
        `悟空忍痛解释：“若让他们继续害人，后来路过的百姓怎么办？”唐僧却坚持慈悲不能靠伤害实现。两人都有自己的道理，却都在气头上，谁也听不进对方的话。`,
        `唐僧再次赶悟空离开。悟空这次没有争辩，只向沙僧交代保护师父，驾云去了南海。队伍少了他以后，八戒原本暗暗轻松，却没想到一个更难分辨的“悟空”很快出现。`,
      ],
      57: [
        `唐僧正休息时，一个悟空突然回来，夺走行李，还把师父推倒。沙僧追到花果山，看见“悟空”竟组织了一支假取经队：猴子变的唐僧、八戒、沙僧一个不少，打算自己去西天取经。`,
        `沙僧气得打散假沙僧，随后去南海告状。真正的悟空一直在观音身边，听说此事大惊，与沙僧一同赶回花果山。两个一模一样的悟空迎面相见，连声音、金箍棒和旧事都完全相同。`,
        `真假悟空从花果山打到南海。观音念紧箍咒，两人同时抱头；照妖镜中也是一样；天庭众神、谛听都看出端倪，却一时不敢明说。八戒围着他们转了几圈，彻底看晕了。`,
        `两个悟空又打到幽冥界，十殿阎王翻遍生死簿也找不到答案。地藏王的神兽谛听听出了真假，却说那妖怪本领太强，地府无人能制，只能让他们去灵山请如来判断。`,
      ],
      58: [
        `如来让众佛安静，指出假悟空是世间少见的六耳猕猴，善于聆听万物、模仿本领。六耳猕猴见身份暴露，变成蜜蜂想逃，被如来用金钵罩在地上。`,
        `悟空掀开金钵，看见对方终于现出原形。他打败六耳猕猴，取回行李，心中的委屈却没有立刻消失。如来劝他回去保护唐僧，并说取经成功后自有正果。`,
        `观音把悟空送回唐僧身边，说明先前伤人的并非他。唐僧想起自己又一次误会徒弟，亲手替悟空扶正帽子。悟空没有多说，只把包袱重新背好：“师父，上路吧。”`,
        `这一难让师徒明白，假的东西有时会模仿外表、声音，甚至记忆，却模仿不了一路共同承担的真心。从此唐僧再遇疑惑，也愿意多给悟空一次解释的机会。`,
      ],
      59: [
        `前方火焰山八百里烈火不息，铜脑袋靠近也会烤软。当地人说，只有铁扇公主的芭蕉扇能扇灭火焰。悟空听说她是红孩儿的母亲，便知道这把扇子不会容易借到。`,
        `铁扇公主住在芭蕉洞，一见悟空便想起儿子被收走的事，拔出双剑来战。打不过时，她取出芭蕉扇猛扇一下，悟空竟被吹出五万多里，像一颗小星星飞得没了影。`,
        `灵吉菩萨送给悟空一颗定风丹。悟空含在口中再去叫阵，铁扇公主连扇几次，他都稳稳站在原地。悟空又变成小虫钻进她喝茶的杯子，到了她肚里翻腾。`,
        `铁扇公主疼得答应借扇，却给了他一把假扇。悟空回到火焰山用力一扇，火不但没灭，反而蹿得更高，烧焦了他的眉毛。八戒赶紧扑火，边扑边喊：“借东西也得先验真假呀！”`,
      ],
      60: [
        `悟空得知牛魔王住在积雷山，便登门借扇。牛魔王正陪玉面公主饮酒，听说悟空来意，想起红孩儿旧怨，抡起混铁棍便打。两位结拜兄弟如今打得山摇地动。`,
        `牛魔王途中受邀赴宴，把坐骑辟水金睛兽留在岸边。悟空偷骑坐骑来到芭蕉洞，变成牛魔王模样。铁扇公主毫无防备，把真扇交给“丈夫”，还说出把扇子变大变小的口诀。`,
        `真牛魔王回来发现坐骑被偷，也变成八戒模样追上悟空。他装作来帮忙，三言两语骗回芭蕉扇。悟空这才明白，自己会变化，别人同样会将计就计。`,
        `真假计谋用尽，双方只能正面决战。八戒举钉耙赶来，与悟空前后夹攻。牛魔王现出大白牛原形，体形如山，低头一顶便把巨石撞得四处飞散。`,
      ],
      61: [
        `牛魔王神通广大，变化成天鹅、黄鹰、白鹤，悟空便变成海东青、乌凤、丹凤追击；他变成香獐，悟空就变成猛虎。两人一路变化，谁也甩不开谁。`,
        `托塔天王、哪吒和四方神兵赶来围住牛魔王。哪吒踏着风火轮，砍下牛头，牛魔王又长出一个；照妖镜从空中照下，使他再也无法变化逃脱。`,
        `铁扇公主见丈夫被擒，终于交出真扇。悟空在火焰山连扇四十九下：第一扇火熄，第二扇风起，第三扇乌云聚集，大雨哗啦啦落下，燃烧多年的山谷终于冷却。`,
        `当地百姓捧着瓜果来谢师徒。悟空归还芭蕉扇，铁扇公主也答应从此修行。师徒踩着还带温热的山路西行，八戒闻见烤熟的庄稼香，险些又忘了赶路。`,
      ],
      62: [
        `祭赛国金光寺原有一颗佛宝舍利，夜里能照亮全城。三年前天降血雨，宝珠突然丢失，寺中和尚被当作盗贼，天天挨罚。唐僧扫塔时听见他们哭诉，答应查明真相。`,
        `悟空陪唐僧从塔底一层层扫到塔顶。半夜，两个小妖来喝酒，说起宝珠被乱石山碧波潭的九头虫驸马偷走。悟空捉住他们问明路线，和八戒直奔碧波潭。`,
        `万圣龙王不肯交珠，派九头虫出战。九头虫有九颗脑袋，前后左右都能咬人，悟空从正面进攻，八戒想从背后偷袭，反被其中一颗头叼住衣领甩进水里。`,
        `悟空想到九头虫飞得快、看得广，普通围攻难以奏效。恰巧二郎神和梅山兄弟打猎经过，悟空上前请他们相助。昔日对手再次并肩站到一起，准备夜袭碧波潭。`,
      ],
      63: [
        `二郎神放出细犬追咬九头虫，细犬猛地跃起，咬掉他一颗脑袋。九头虫疼得冲出包围，逃往北海深处，再不敢回来。万圣龙王和小妖也被制服。`,
        `八戒潜入水府寻找舍利，却发现万圣公主又从王母的灵芝园偷来九叶灵芝草，用来温养宝珠。悟空把宝珠和灵芝一并取回，还让龙婆说出全部经过。`,
        `宝珠重新安放塔顶，夜色中立刻放出万道霞光。国王释放受冤和尚，将金光寺改名伏龙寺。那些被鞭打三年的僧人抬头看见光芒，终于露出笑容。`,
        `悟空把九叶灵芝放在宝珠下，让光辉长久不灭。他对国王说：“宝物丢了应当查证，不能因为守宝人离得最近，就先认定是他们偷的。”国王惭愧地点头。`,
      ],
      64: [
        `荆棘岭上藤蔓密布，八戒挥钉耙开路，一天也走不了多远。夜里，一群树木成精的老者把唐僧请进木仙庵，礼貌地谈诗论道，并无凶恶模样。`,
        `唐僧见他们谈吐文雅，渐渐放下戒心。杏仙出现后，以歌舞和诗句表达倾慕，希望唐僧留下。唐僧严词拒绝，说交流诗文可以，阻拦取经却万万不能。`,
        `悟空三人寻找一夜，天亮才发现唐僧。八戒见树精围着师父，抡起钉耙便筑。唐僧阻止他乱伤，树精们趁机化作清风散去，只留下几株古松、老柏和杏树。`,
        `离开荆棘岭时，唐僧仍觉得那些诗句颇有意思。悟空提醒他，美好的言语也可能让人忘记原本方向。八戒则说自己只记得木仙庵的点心，惹得沙僧摇头。`,
      ],
      65: [
        `师徒忽见一座“小雷音寺”，殿中坐着一尊金光闪闪的“佛祖”。唐僧急忙跪拜，悟空却闻到妖气，高声喝问。假佛祖翻脸，抛下一对金铙，把悟空严严实实合在里面。`,
        `金铙越合越紧，悟空变大它也变大，变小它也跟着缩小。他在里面叫天天不应，最后由亢金龙把角伸进缝隙，悟空变小钻入角中，才被带出。`,
        `黄眉大王又拿出人种袋。二十八星宿、五方揭谛和前来助战的神将，只要靠近便被一阵风吸进袋里。八戒在袋中抱怨太挤，哪吒的兵器还硌着他的背。`,
        `悟空独自逃脱，四处搬救兵，却来一批被收一批。他望着紧闭的寺门，终于意识到妖怪的宝贝不是凡物。就在他无计可施时，一个笑眯眯的大肚和尚从田间走来。`,
      ],
      66: [
        `来者正是弥勒佛。黄眉原是他敲磬的童子，趁主人不在偷走金铙和人种袋。弥勒让悟空变成一只熟透的大西瓜，自己装作瓜农，坐在妖怪必经的瓜田边。`,
        `黄眉追来又渴又累，抢过西瓜便吃。悟空顺着瓜瓤钻进他肚里，翻跟头、踢肋骨，疼得妖怪满地打滚。弥勒趁机收走人种袋和金铙。`,
        `黄眉仍想反抗，弥勒伸手一招，他便恢复童子模样，只得低头跟主人回去。悟空打开人种袋，众神和师徒像倒豆子一样滚出来，八戒出来第一句话便是：“总算能伸直腰了！”`,
        `真正的小雷音寺幻象消失，只剩荒山乱石。唐僧想起自己一见“佛”字便跪，险些害了众人，明白虔诚信念也需要清醒判断。师徒整理衣冠，继续寻找真正的灵山。`,
      ],
      67: [
        `七绝山驼罗庄被一条红鳞大蟒占据，村民不敢上山。悟空和八戒夜里守候，大蟒张开血盆大口冲来。悟空故意缩小钻进它腹中，八戒在外挥耙拦住尾巴。`,
        `悟空在蛇腹里撑起金箍棒，大蟒疼得翻滚；他又从脊背破开一道口子跳出。妖怪没有复杂法宝，靠的只是巨大身躯，可越是庞大，翻身越慢，最终被八戒一耙制住。`,
        `妖怪虽除，前方稀柿衕却堆满多年腐烂的柿子，臭气熏天，马也无法落脚。村民说这是唯一西行道路，谁都清不干净。八戒捏着鼻子看向自己的大肚子，忽然有了办法。`,
        `他变成巨猪模样，用长嘴拱开烂柿，硬生生开出一条通道。悟空难得认真夸他：“这回你的鼻子立了大功。”八戒虽然熏得眼泪直流，听见夸奖还是得意地翘起耳朵。`,
      ],
      68: [
        `朱紫国王身患怪病，宫门张榜求医。悟空揭下皇榜，变成一位神气十足的医生进宫。他先悬丝诊脉，让三根金线系在国王手腕上，隔着帘子也说准了病情。`,
        `国王的病既有惊恐忧思，也有饮食阻塞。悟空要配一丸“乌金丹”，让八戒找大黄，沙僧取锅底灰，又偷偷加上一点白龙马的尿。八戒听完直咧嘴，悟空却说良药不看名字。`,
        `国王服药后吐出多年积滞，身体立刻轻快许多。悟空继续追问病根，国王才说三年前赛太岁掳走金圣宫娘娘，他从此日夜忧愁。`,
        `悟空答应救人，却先要弄清赛太岁的本领。他变成小妖混入麒麟山獬豸洞，听说妖怪有三个紫金铃，一个放火，一个冒烟，一个扬沙，谁也近不得身。`,
      ],
      69: [
        `配药时，八戒看见大黄和锅底灰直皱眉，悟空又叫白龙马帮忙。乌金丹样子虽不起眼，国王服下后吐出积在腹中的糯米团，胸口顿时舒展，终于能安稳喘气。`,
        `身体好转后，国王说出心病：三年前端午，赛太岁乘怪风掳走金圣宫娘娘。幸有紫阳真人暗赠五彩仙衣，妖怪一靠近便被尖刺扎痛，娘娘才一直平安。`,
        `悟空变成小妖“有来有去”潜入麒麟山，故意和守门妖怪闲聊。他得知赛太岁有三个紫金铃，分别能放出烈火、浓烟和黄沙，铃中还塞着棉花，免得平日误响。`,
        `悟空找到金圣宫娘娘，低声告诉她国王已经康复。娘娘又惊又喜，擦去眼泪与悟空商量：她负责哄妖怪取出铃铛，悟空负责做假铃调换，里应外合救她回家。`,
      ],
      70: [
        `悟空冒充小妖禀报，说孙悟空已经打上门。赛太岁果然紧张，取出紫金铃查看。悟空站在近处把铃铛形状、塞棉方法全记在眼里，却仍找不到伸手的机会。`,
        `金圣宫娘娘假装替妖怪整理衣服，趁他得意时取下铃铛交给悟空。悟空拔毫毛变出三个一模一样的假铃，又小心塞好棉花，把真铃藏在耳中。`,
        `赛太岁忽然要试铃，假铃摇不出动静。悟空赶紧装作殷勤小妖，说是棉花塞得太紧，随后跑到洞外用自己的声音叫阵，把妖怪注意力引开。`,
        `争斗中赛太岁意外夺回真铃，火、烟、黄沙一齐涌来。悟空借分身遮住视线，再次潜入洞内。他明白偷一次不成便要更耐心，下一次必须让妖怪再也拿不回去。`,
      ],
      71: [
        `悟空终于把真铃握在手中，在洞外依次摇动。烈火先截住去路，浓烟遮住天空，黄沙又卷得赛太岁睁不开眼。妖怪第一次尝到自己法宝的滋味。`,
        `观音赶来制止最后一棒，唤出赛太岁的真名。妖怪立刻现出金毛犼原形，原来它是观音坐骑，趁看守童子打盹咬断锁链，连颈下紫金铃也一同带走。`,
        `金毛犼伏在观音脚边，三个铃铛重新套回颈下。悟空护送金圣宫娘娘回朱紫国。国王奔下宫阶，两人相见时谁也顾不上说话，只是紧紧握住彼此的手。`,
        `娘娘脱下护身仙衣，国王的身体与心病都彻底痊愈。唐僧谢绝重礼，只请他们珍惜团聚。八戒远远躲着紫金铃，生怕悟空再摇一下烧焦他的耳朵。`,
      ],
      72: [
        `盘丝岭一户人家里住着七个蜘蛛精。唐僧独自进去化斋，刚坐下便被雪白蛛丝缠住手脚。妖怪们留下小妖看守，结伴去濯垢泉洗浴。`,
        `悟空变成小虫探明情况，让八戒守住泉边回路。八戒却一头扎进水里变成鲇鱼乱钻，把计划搅得乱七八糟。蜘蛛精又羞又怒，披衣冲回盘丝洞。`,
        `七妖从肚脐放出长丝，眨眼织成铺天盖地的大网。悟空拔毫毛变出许多小鹰和小猴，一个啄丝、一个扯网，终于救出被层层缠住的唐僧。`,
        `蜘蛛精们逃往师兄百眼魔君的黄花观。师徒随后来到观中，悟空闻见枣茶甜香里混着苦味，暗中没有入口；唐僧三人却不知道主人正准备替师妹报仇。`,
      ],
      73: [
        `百眼魔君在红枣茶中下毒，唐僧、八戒、沙僧喝下后腹痛倒地。悟空看出茶色不对，掀翻茶碗。道士见计谋败露，脱下外袍露出肋下密密麻麻的眼睛。`,
        `千只眼同时放出金光，像一面没有缝的光墙把悟空困住。他变大冲不破，变小钻不出，只好化作穿山甲从地底逃走，眼睛仍被照得发疼。`,
        `黎山老母指点他去紫云山请毗蓝婆菩萨。菩萨取出一枚昴日星官日光炼成的绣花针，迎着金光一照，耀眼光阵立刻像薄冰一样裂开。`,
        `百眼魔君现出大蜈蚣原形，被毗蓝婆收去看守门户。菩萨给唐僧三人服下解药。八戒醒来先找茶喝，悟空赶紧把有毒茶壶踢得远远的。`,
      ],
      74: [
        `太白金星警告，狮驼岭上有青狮、白象、大鹏三位魔王，手下小妖多得站满山谷。唐僧听得心惊，悟空让师弟守住师父，自己先摸清洞中虚实。`,
        `悟空变成巡山小妖，跟着小钻风敲梆子。他故意装作新来的，三言两语便套出情报：青狮能一口吞人，白象长鼻卷人，大鹏一翅便是九万里。`,
        `他拿到巡山小旗混入狮驼洞。青狮白象没有起疑，大鹏却追问只有本洞小妖才知道的暗号。悟空把暗号说反了，洞中立刻响起警钟。`,
        `悟空扔下小旗现出本相，毫毛变的小猴在各处敲锣放火，把成千小妖搅得互相碰撞。三位魔王亲自围上，他边战边退，想把妖怪引离唐僧所在山路。`,
      ],
      75: [
        `悟空在阴阳二气瓶里四处碰壁，想起观音送的三根救命毫毛。他拔下一根变成金刚钻，在瓶底钻开小孔，缩成细虫逃了出去。瓶子漏气裂开，大鹏气得连连跺脚。`,
        `悟空救出八戒，三兄弟护着师父闯岭。三个魔王领数万小妖追来，漫山旌旗像乌云压顶。沙僧守住唐僧，悟空和八戒轮番迎敌，仍被层层围住。`,
        `大鹏速度快得惊人，悟空一个筋斗也甩不开。他先追上唐僧，把师徒全部抓进狮驼城，又散布假消息说唐僧已经被吃掉。悟空听见后心如刀割，第一次在山头放声大哭。`,
        `他擦干眼泪赶往灵山求如来。如来告诉他，大鹏与佛门有很深渊源，青狮白象也各有主人。悟空压住怒气问：“既然有主人，为何让他们在这里害人？”如来随即召集众佛前往收妖。`,
      ],
      76: [
        `悟空故意败退，把青狮引到八戒埋伏处。八戒从石后跳出，一耙打得青狮踉跄；沙僧同时拦住白象。三兄弟第一次把各自本领配合起来，让两位魔王顾前顾不了后。`,
        `白象长鼻卷来，悟空缩成豆粒钻进鼻孔，在里面又踢又蹬，逼得白象连声答应放行。青狮、白象表面投降，大鹏却低声献计：假装用轿子送唐僧，半路再一网打尽。`,
        `唐僧坐上轿子，八戒还夸妖怪终于懂礼。走到山坳，抬轿小妖突然把轿子掀翻，漫山妖兵一齐冲出。悟空三兄弟被分开包围，刚刚得到的优势转眼消失。`,
        `悟空冲出重围，却发现大鹏一振翅就追到身后。妖怪抓走唐僧等人，还故意放出“唐僧已被吃掉”的假消息。悟空强忍悲痛，决定潜回洞中亲眼确认，绝不只听敌人的一句话。`,
      ],
      77: [
        `悟空变成小虫飞进狮驼城，终于听见师父在铁柜里念经。他悄声安慰唐僧，再去灵山求助。如来没有否认三妖背景，亲自带文殊、普贤和众护法来到岭上。`,
        `文殊念动真言，青狮低头现出坐骑原形；普贤一声召唤，白象也伏下身子。大鹏见势不妙，张开双翅便逃，速度快得像一道金光。`,
        `如来伸开手掌，大鹏飞了许久，以为早已逃出十万八千里，落下时却仍在佛祖掌中。他不服气地喊饿，如来答应让他留在灵山听经受供，不许再害生灵。`,
        `铁柜打开，唐僧看见悟空，第一句话便是“我知道你会回来”。悟空故作轻松地说自己只是去请了几位帮手。狮驼岭云开雾散，师徒终于走出这段最沉重的山路。`,
      ],
      78: [
        `比丘国街道两旁摆着一千多个鹅笼，每个笼中都坐着一个孩子。孩子们不哭不闹，只睁着害怕的眼睛。唐僧听说国丈要取他们的心做药，眼泪当场落了下来。`,
        `悟空夜里拔出毫毛，变成无数温和护法，把孩子们悄悄送到安全地方。清晨官兵打开鹅笼，只见空笼整整齐齐，城中父母却在暗处抱回孩子，激动得不敢出声。`,
        `国丈找不到孩子，便说唐僧的心更好。悟空变成唐僧走上金殿，伸手往衣襟里一掏，接连拿出贪心、黑心、偏心等一堆彩色假心，问：“国丈要的是哪一颗？”`,
        `国丈见法术被破，带着美后逃走。悟空追到云端，看见国丈化作白鹿，美后化作白面狐狸。南极寿星赶来认出自己的坐骑，悟空却要求先救醒国王、安顿所有孩子。`,
      ],
      79: [
        `白鹿精逃进柳林坡清华洞，举着从寿星处偷来的蟠龙拐杖抵抗。八戒守住洞门，悟空从空中追击。白鹿左冲右突，忽听寿星一声呼唤，四腿便不由自主地软了。`,
        `它现出温顺白鹿原形，伏到主人脚边。寿星说明看守童子醉酒，白鹿才有机会下凡。悟空把拐杖还给寿星，又请他赐几枚火枣医治被邪说迷惑的国王。`,
        `国王服下火枣，混乱的神志渐渐清明。他走出宫门，看见父母抱着失而复得的孩子，想到自己差点酿成大错，羞愧得摘下王冠向百姓道歉。`,
        `所有鹅笼都被拆掉，木料改做孩子们读书的桌椅。唐僧告诉国王，长寿不能用别人的生命交换。师徒离城时，成群孩子追着白龙马挥手，笑声一直送到城外。`,
      ],
      80: [
        `黑松林中，一名女子被绑在树上哭喊。悟空嗅到妖气，唐僧却说不能因怀疑便见死不救。悟空同意救人，但让八戒走前、沙僧守后，自己始终盯着女子的脚步。`,
        `女子自称被强盗掳来，师徒把她送到镇海禅林寺。她在人前柔弱安静，夜里却轻得像影子，在回廊间穿行。悟空变成小虫跟随，亲眼看见她吸走僧人的精气。`,
        `悟空举棒追赶，女子钻入地缝不见。寺中僧人接连昏倒，唐僧也因疲累发起高热。悟空一边照料师父，一边查看地面气味，确定妖怪就在附近。`,
        `原来她是金鼻白毛老鼠精，住在陷空山无底洞。她故意用替身把悟空引到寺外，又从另一条地道卷走唐僧。悟空回来看到空床，只捡到一只绣鞋。`,
      ],
      81: [
        `三兄弟沿绣鞋上的气味搜索。八戒用长嘴拱草，沙僧敲击树根，终于找到深不见底的洞口。冷风从地下涌出，扔下一块石头，许久都听不见落地声。`,
        `悟空变成小虫飞入洞中，发现地下竟有亭台楼阁和无数岔路。老鼠精给唐僧摆满素斋，软声劝他成亲；唐僧闭眼念经，连筷子也不碰。`,
        `悟空抓住两个小妖问路，小妖却只知道“大王把圣僧藏到后院”，后院又有几十扇一样的门。悟空每推开一扇，里面不是空房就是陷阱。`,
        `老鼠精察觉有人潜入，把唐僧转移到更深洞房，准备第二天办婚宴。悟空听见师父咳嗽，却隔着石壁找不到入口，只得换一种办法，让自己被端到唐僧面前。`,
      ],
      82: [
        `悟空变成一颗鲜红桃子，滚进小妖准备的果盘。唐僧看见桃上有一根熟悉猴毛，立刻明白，把桃子一口吃下。悟空藏在师父腹中轻声说：“别怕，老孙来了。”`,
        `老鼠精催唐僧喝酒，唐僧按照悟空吩咐假装答应，趁她靠近时大声咳嗽。悟空从耳中跳出，现出本相挥棒便打。妖怪用双股剑招架，又化作清风逃入岔洞。`,
        `悟空在洞中发现一间香火堂，牌位上写着“尊父李天王之位、尊兄哪吒三太子之位”。他没有立刻打碎，而是取下牌位作为证据，判断妖怪与天庭有旧关系。`,
        `八戒下洞接应，误把妖怪变的唐僧背起来。假唐僧一路责骂，悟空问了一个师父才知道的问题，妖怪答不上来，丢下伪装逃走。师兄弟这才找到真正关押唐僧的石室。`,
      ],
      83: [
        `悟空拿着牌位来到天庭，当面问托塔天王为何纵女为妖。李靖起初大怒，举剑要抓悟空。哪吒看见牌位，提醒父亲三百年前曾饶过一只偷香烛的金鼻白毛老鼠。`,
        `那老鼠为报不杀之恩，私自认李靖为义父、哪吒为义兄。李靖这才明白来历，立即点起天兵。哪吒踏风火轮封住地面，悟空和八戒从洞底向上驱赶。`,
        `老鼠精变出许多一模一样的女子四处逃。哪吒用照妖镜照住真身，李靖祭起玲珑宝塔，把她收入塔中。洞内妖风停止，所有岔路也恢复清楚。`,
        `师徒带着行李离开无底洞。唐僧承认自己救人时防备不足，悟空也说善心本身没有错，重要的是救助时让伙伴知道、做好保护。四人继续向灭法国前进。`,
      ],
      84: [
        `灭法国王发誓要抓满一万名和尚，如今只差四人。师徒装成马商，把袈裟和行李藏进大柜子。谁知强盗夜里搬走柜子，官兵又把柜子当赃物抬进王宫。`,
        `悟空从柜缝钻出，听见国王说明早便要处置最后四名僧人。他没有动棒，而是拔毫毛变出无数小剃刀。剃刀飞遍全城，悄无声息地剃光国王、王后和百姓的头发。`,
        `清晨人人摸着光头惊慌失措。悟空现身道：“今日大家外表都像和尚，难道全城都该受罚？”国王终于看见自己誓言的荒唐，请唐僧进殿认错。`,
        `国王撤销禁令，把国名改为钦法国，表示从此尊重不同信仰。八戒摸摸自己本就稀疏的头发，问悟空是否趁乱多剃了几根，惹得紧张一夜的众人终于笑起来。`,
      ],
      85: [
        `隐雾山豹子精号称南山大王，知道悟空难惹，便使“分瓣梅花计”：几处同时呼救，把三兄弟分别引开，再趁唐僧独处时卷入洞中。`,
        `妖怪用柳木刻成唐僧头形，涂上颜色抛到洞外。悟空和八戒看见后如遭雷击，八戒连平日最爱说的话也说不出来。沙僧却发现木头切口没有血迹，提醒大家再看清楚。`,
        `悟空用火眼金睛细看，果然发现假头上还有淡淡树纹。他从悲痛中猛地振作，变成小妖潜入折岳连环洞，听见真正的唐僧仍在后洞念经。`,
        `豹子精准备夜里转移唐僧。悟空拔毫毛守住各条山路，又在洞门做下暗号，通知八戒和沙僧同时进攻。假消息没有击垮他们，反而让三兄弟配合得更加谨慎。`,
      ],
      86: [
        `悟空在洞内打翻守卫，八戒从正门挥耙冲入，沙僧从后山堵住暗道。豹子精放出浓烟，悟空张口一吹，烟雾倒卷回去，小妖们呛得四处逃散。`,
        `豹子精变出几个假身分别逃跑。悟空闭眼不追影子，只看地上真实脚印，终于锁定真身。八戒一耙拦路，沙僧趁机救出被绑的唐僧。`,
        `洞里还关着许多过路百姓，众人一起获救。八戒变成大猪拱塌妖洞入口，清开堵路巨石。悟空打趣说这一路最擅长修路的，其实不是土地神而是二师弟。`,
        `唐僧听说徒弟曾为假人头伤心，轻轻拍了拍悟空肩膀。悟空嘴上说自己早看出是木头，八戒立刻拆穿：“刚才哭得最大声的可不是我。”师徒在笑声中重新启程。`,
      ],
      87: [
        `凤仙郡三年无雨，井底干裂，庄稼枯黄。悟空上天查问，看到披香殿前摆着米山、面山和一把被灯火慢慢烧的金锁：必须鸡啄完米、狗舔完面、火烧断锁，才准下雨。`,
        `原来郡侯三年前因家中争执推翻供桌，又说了冒犯天地的话。悟空回去把真相如实相告，没有假装自己无所不能。郡侯低头承认，自己一时怒气却让全城百姓跟着受苦。`,
        `唐僧劝他开仓放粮、照顾病弱、真心改过。全城人也互相分水、修井、帮助邻里。随着善念聚集，天宫里鸡犬忽然加快，米面山很快消失，金锁“啪”地断开。`,
        `龙王奉旨降雨，第一滴雨落在孩子手心，随后大雨倾盆。百姓在雨中欢呼，郡侯却没有只顾庆祝，而是继续兑现照顾百姓的承诺。唐僧说，这才是真正的“求到雨”。`,
      ],
      88: [
        `玉华州三位王子爱好武艺，要与悟空三兄弟比试。悟空轻轻举起千钧石狮，八戒把钉耙舞得风声呼呼，沙僧的宝杖则沉稳得滴水不漏，王子们看得心服口服。`,
        `大王子拜悟空，二王子拜八戒，三王子拜沙僧。三位师父没有先教花哨招式，而是让徒弟扎马步、练呼吸。八戒自己站了一会儿便偷懒，还被二王子认真提醒。`,
        `工匠照三件神兵打造新兵器，原兵器夜里放出霞光。豹头山黄狮精远远看见，带小妖潜入工坊，把金箍棒、钉耙和宝杖全偷走了。`,
        `第二天只剩三个空架子，王子们十分自责。悟空却说：“兵器能偷走，练进身上的本领偷不走。”他循着小妖脚印，与八戒、沙僧追向虎口洞。`,
      ],
      89: [
        `悟空抓到两个下山买猪羊的小妖，听说黄狮精准备开“钉耙宴”，炫耀三件兵器。奇怪的是，黄狮精还给了买货银子，并不许小妖白抢百姓。`,
        `三兄弟变成商贩和小妖混进宴席。等众妖喝得高兴，他们同时现身，各自夺回兵器。黄狮精又惊又怒，提四明铲追到洞外，却敌不过三兄弟联手。`,
        `黄狮精逃到竹节山，请祖翁九灵元圣出头。九灵元圣有九颗狮头，九张大口同时张开，能从不同方向擒人，连悟空也不敢正面靠得太近。`,
        `土地告诉悟空，九灵元圣是太乙救苦天尊的坐骑。悟空赶往东极妙岩宫，发现看守狮奴醉酒睡着。天尊得知坐骑下界，立刻带铃铛前去收服。`,
      ],
      90: [
        `太乙救苦天尊来到竹节山，只轻轻摇响九环锡杖上的铃。刚才还威风凛凛的九头狮子立刻收起九张大口，伏到主人脚边，像做错事的大猫般不敢抬头。`,
        `被抓的王子和百姓全部获救，三件神兵也回到主人手中。黄狮精失去依仗，放下兵器。悟空没有追赶已经散去的小妖，只毁掉害人的机关。`,
        `王子们的新兵器终于打造完成。悟空提醒他们，厉害武器最先考验的不是力气，而是使用者是否懂得克制；八戒也难得认真地说，不能拿钉耙去欺负比自己弱的人。`,
        `三位王子一直送到城外。八戒频频回头看王府宴席，悟空催他快走。前方金平府正值元宵，满城灯火像星河落地，谁也没想到最亮的三盏灯正等着唐僧。`,
      ],
      91: [
        `金平府元宵夜热闹非凡，三座大灯缸装满昂贵酥合香油。百姓说每年都有三位“佛爷”来收油。唐僧想近前礼拜，悟空却看见云头带着寒气和尘烟。`,
        `三位佛爷一到灯桥，忽然卷走唐僧。它们原是辟寒、辟暑、辟尘三只犀牛精，多年来借神佛名义骗取香油，住在青龙山玄英洞。`,
        `悟空、八戒、沙僧攻到洞前，三只犀牛角分别喷出寒气、热气和烟尘。山谷一会儿结冰，一会儿灼烫，一会儿伸手不见五指，三兄弟难以靠近。`,
        `太白金星指点悟空去请四木禽星。角木蛟、斗木獬、奎木狼、井木犴各自披挂出发，因为他们的星宿本相正能克制犀牛。`,
      ],
      92: [
        `四木禽星从四面围住青龙山。三只犀牛精一见天敌便慌了阵脚，辟寒、辟暑逃向西海，辟尘被堵在洞前。悟空和八戒乘势追击。`,
        `西海龙族封住水路，星官从海面压下，悟空从水底赶上，三妖再也无处可逃。玄英洞门打开，唐僧和多年堆积的香油、金银一并被找到。`,
        `金平府百姓这才明白，华丽光影和“佛爷”名号都可能是假。悟空把财物归还原主，唐僧则劝大家，行善重在真心，不必靠昂贵供品证明。`,
        `元宵灯重新点亮，这次灯油只用来照亮街道。师徒在万家灯火中离城，远处已是天竺国地界。终点越来越近，四人反而走得更加谨慎。`,
      ],
      93: [
        `师徒借宿布金禅寺，听说附近收留了一位失去记忆的女子。她虽衣衫普通，举止却像在宫中长大。悟空从她随身旧物上看到天竺王室纹样，把疑问记在心里。`,
        `入天竺国都城时，公主正在彩楼抛绣球选驸马。唐僧只想从人群边经过，红绣球却不偏不倚落在他帽上。百姓欢呼，官兵立刻把他请入驿馆。`,
        `八戒偷偷笑说师父一路总有人要成亲，唐僧急得瞪他。悟空望向彩楼，发现那位“公主”身旁飘着一丝月宫般的冷光，眼神也总躲着自己。`,
        `国王十分满意这位东土驸马，命人准备婚礼。悟空劝师父先稳住局面，自己进宫查明真假；他怀疑布金寺的女子才是真公主，而楼上的公主另有来历。`,
      ],
      94: [
        `御花园宴席上，假公主频频给唐僧敬酒，却始终避开悟空目光。悟空故意走近，她袖中香气立刻化成细细妖雾。她越装得镇定，悟空越确定其中有鬼。`,
        `假公主催国王先把三个徒弟送出城，说婚后不便留客。悟空笑着提出表演变化助兴，拔毫毛变出许多小猴围着花园翻跟头，堵住每一条退路。`,
        `一只小猴突然去扯公主裙角，她受惊跳起，头上差点露出两只长耳朵。悟空当众喝问：“月宫来的妖怪，还要装到什么时候？”`,
        `假公主掀翻桌案，取出捣药杵冲上云头。悟空紧追，八戒和沙僧护住唐僧、国王。宫人去布金寺接来那名女子，国王一见她熟悉的眉眼，泪水立刻涌出。`,
      ],
      95: [
        `妖怪逃到毛颖山，与悟空挥杵大战。捣药杵看似不大，落下却重若山岳。八戒堵住洞门，悟空从云头压下，让她无法再回王宫。`,
        `太阴星君带着月宫仙子赶来，唤出“玉兔”。妖怪听见主人声音，手中药杵落地，恢复成一只雪白兔子。原来她私自下界，把真公主吹到布金禅寺，自己顶替身份。`,
        `真公主回宫与父母相认，国王向唐僧郑重道歉，取消婚事并盖好关文。布金寺照顾公主有功，也得到妥善修缮，而不是只收一时赏赐。`,
        `太阴星君抱玉兔返回月宫。师徒出城时，路人说灵山已不远。唐僧提醒徒弟不要因看见终点便松懈，悟空也把前路看得更加仔细。`,
      ],
      96: [
