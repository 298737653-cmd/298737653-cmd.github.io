        `寇员外发愿供养一万名过路僧人，正好还差四位。师徒到来，他欢喜得亲自迎出门，安排洁净客房和丰盛素斋。八戒听说要留半个月，笑得耳朵直晃。`,
        `寇员外送来金银衣料，唐僧一件不收，只取少量干粮。他说一路受人帮助已经很多，不能把取经变成积攒财富的旅程。寇家只好把礼物重新收好。`,
        `送行那天声势很大，被附近强盗看见。他们误以为师徒带走重宝，夜袭寇家。混乱中寇员外倒地，强盗又把部分赃物藏到西行路边，嫁祸给师徒。`,
        `官差顺着赃物追上唐僧，将四人带回县衙。唐僧请县官耐心查证，悟空则闻出财物上有陌生人的汗味，确定真正强盗还没走远。`,
      ],
      97: [
        `夜里，悟空缩小钻出牢房，循脚印找到分赃的强盗。他没有让他们逃散，而是变出一圈高墙，把众人困住，命他们带齐剩余财物到衙门说明真相。`,
        `寇员外已经没有气息，悟空又赶往地府查问。生死簿上写着他阳寿未尽，鬼差只是误勾魂魄。悟空把魂带回，寇员外咳嗽一声，重新睁开眼睛。`,
        `寇员外亲口证明，唐僧拒绝了所有厚礼；强盗也供认嫁祸经过。县官放出师徒，为自己只凭表面证据下判断而道歉，并把财物归还寇家。`,
        `唐僧劝寇家不要因受害便停止行善，也请县官依法处置，给真心悔过者改正机会。再次告别时，寇员外不再铺张送行，只在门前安静合掌。`,
      ],
      98: [
        `金顶大仙在玉真观迎接师徒，说灵山只剩八九里。凌云渡前只有一根滑溜独木桥，桥下云水翻腾。唐僧不敢迈步，接引佛祖便划来一只没有船底的小船。`,
        `唐僧战战兢兢上船，忽见水中漂过一个与自己相同的身体。悟空扶住他说，那是一路恐惧和执着留下的旧壳。小船靠岸时，四人终于踏上灵鹫峰。`,
        `雷音寺中，如来命阿傩、伽叶取经。他们先给了一包无字经，回程时经卷被风吹开，悟空发现满纸空白，立刻带大家返回理论。`,
        `如来重新让他们领取有字真经。唐僧把一路随身的紫金钵盂作为纪念留下，接过沉甸甸的经包。八大金刚奉命护送他们东归，十三年西行终于开始走回家的路。`,
      ],
      99: [
        `观音查看师徒经历，发现九九八十一难还差一难，便让八大金刚把他们暂放通天河西岸。老鼋再次浮出水面，仍愿驮他们过河。`,
        `到了河心，老鼋问唐僧是否替自己询问何时能脱壳成人。唐僧这才想起自己忘了承诺，只能诚实回答。老鼋又失望又生气，身子一翻，把人、马、经书都掀进水里。`,
        `众人爬上岸，赶紧把经卷摊在石头上晾晒。几页纸粘住石面，揭下时留下缺口。唐僧心疼，悟空说世间难有十全十美，但忘记承诺这件事必须牢牢记住。`,
        `陈家庄百姓认出他们，欢喜地迎进村。深夜八大金刚催促赶路，师徒没惊动熟睡的人，只留下谢信便乘云东去。最后一难过去，长安灯火已在东方。`,
      ],
      100: [
        `八大金刚把师徒送到长安上空。唐太宗率百官出城，认出十三年前离开的御弟。唐僧献上真经和盖满各国印章的关文，把一路功劳更多归给徒弟和所有伸手相助的人。`,
        `雁塔寺中，真经被郑重安放。悟空望着经包，想起花果山；八戒想起高老庄；沙僧想起流沙河；白龙马也想起自己从前犯下的错。漫长旅程让每个人都不再是出发时的自己。`,
        `回到灵山复命后，如来封唐僧为旃檀功德佛，悟空为斗战胜佛。悟空摸摸额头，紧箍已经自然消失，因为他学会了自己约束力量，不再需要外面的咒语提醒。`,
        `八戒成为净坛使者，沙僧成为金身罗汉，白龙马恢复龙身成为八部天龙马。四位伙伴各有归处，也永远共享那条一步步走完的西行路。一百讲在这里结束，勇气、信任和坚持却会在下一次讲述时再次启程。`,
      ],
    };
    
    for (const lecture of journeyLectures) {
      const details = journeyExpansionDetails[lecture.no];
      if (!details || details.length !== lecture.paragraphs.length) continue;
      lecture.paragraphs = lecture.paragraphs.flatMap((paragraph, index) => [paragraph, details[index]]);
    }
    
    const journeyLongformDetails = {
      "1": [
        "过了一会儿回报说：臣奉旨观听金光之处，原来东胜神洲海东傲来小国之界，有一座花果山，山上有一仙石，石产一卵，见风化一石猴，在哪里拜四方，眼运金光，射冲斗府。玉帝听完后说：下方之物，原来天地精华所生，不必惊讶。那猴在山中，却会行走跳跃，食草木，饮涧泉，采山花，觅树果；与狼虫为伴，虎豹为群，獐鹿为友，猕猿为亲；夜宿石崖之下，朝游峰洞之中。你看他一个个：跳树攀枝，采花觅果；抛弹子，做游戏；跑沙窝，砌宝塔；赶蜻蜓，追蝴蝶；学着拜天，拜菩萨；扯葛藤，编草；捉虱子，咬又掐；理毛衣，剔指甲。挨的挨，擦的擦；推的推，压的压；扯的扯，拉的拉：青松林下任他顽，绿水涧边随意玩水。众猴都说：这股水不知是哪里的水。",
        "连呼了三声，忽见丛杂中跳出一个石猴，应声高叫说：我进去，我进去。你看他闭眼蹲下，将身一纵，一下跳入瀑布泉中，忽睁睛抬头观看，哪里边却无水无波，明明朗朗的一架桥梁。看完多时，跳过桥中间，左右观看。石猿高兴极了，急抽身往外就走，复闭眼蹲下，跳出水外，打了两个呵呵说：好地方！石猴笑说：这股水原来是桥下冲贯石桥，倒挂下来遮闭门户的。这里边：刮风有处躲，下雨好存身。都说：你还先走，带我们进去，进去。",
        "我们日日欢会，在仙山福地，古老洞府，不受麒麟、凤凰和人间国王管束，自由自在，原来很大的福气，为什么还要担心呢？猴王说：今日虽不受人间法律约束，不惧猛兽威胁，将来年纪大了，暗中有阎王管着，有一天离开世间，可不白白来过世界之中，还是不能长久活下去？只见猴群中，忽跳出一个通背猿猴，大声说：大王若是这般担忧，真的开始思考大事情了也。猿猴说：原来是佛与仙与神圣三者，躲过轮回，不生不灭，与天地山川齐寿。猿猴说：他只在阎浮世界之中，古洞仙山之内。猴王听见这话，心里高兴极了说：我明日就辞你们下山，走遍海角，远涉天涯，一定要访此三者，学一个不老长生，常躲过阎王之难。",
        "这句话，顿教寻找长生的道路，致使齐天悟空成。众猴鼓掌称扬，都说：好极了，好极了！次日，美猴王早起，吩咐：小妖们，替我折些枯松，编成木筏，取个竹竿作篙，只见海边有人捕鱼、打雁、穵蛤、淘盐。他走近前，弄个把戏，妆个虎，吓得那些人丢筐弃网，四散奔跑。将那跑不动的抓住一个，剥了他衣裳，也学人穿在身上。",
        "美猴王听得此言，心里高兴极了说：神仙原来藏在这里！就忙跳入里面，仔细再看，原来是一个樵子，在哪里举斧砍柴。",
        "猴王近前叫说：老神仙，弟子有礼了。那樵汉慌忙丢了斧，转身答礼说：不敢当，不敢当。猴王说：你不是神仙，怎么说出神仙的话来？猴王说：我才来至林边，只听的你说：相逢处，非仙就道，静坐讲《黄庭》。樵夫笑说：实不瞒你说，这个词名做《满庭芳》，是一位神仙让我的。那神仙与我家相邻，他见我家事劳苦，日常烦恼，让我遇烦恼时，就把这词儿念念，一则散心，二则解困。猴王说：你家既与神仙相邻，为什么不从他修行？樵夫说：我一生命苦：自幼由父母养大至八九岁，才知人事，不幸父亲去世，母亲独自生活。却又田园荒芜，衣食不足，只得斫两束柴薪，挑向市廛之间，货几文钱，籴几升米，自炊自造，安排些茶饭，供养老母。",
        "忽回头，见崖头立一石碑，约有三丈余高，八尺余阔，上有一行十个大字，原来是灵台方寸山，斜月三星洞。美猴王十分欢喜说：这里人果是朴实，果然有此山此洞。且去跳上松枝梢头，摘松子吃了玩耍。那童子出得门来，高叫说：什么人在此打扰？猴王扑的跳下树来，上前躬身说：仙童，我是个访道学仙之弟子，更不敢在此打扰。童子说：我家师父刚才下榻，登坛讲道，还未说出缘由，就让我出来开门。说：外面有个修行的来了，可去接待接待。这猴王整衣站端正，随童子直接走进洞天深处观看：一层层深阁琼楼，一进进珠宫贝阙，说不尽那静室幽居。",
        "猴王说：弟子原来东胜神洲傲来国花果山水帘洞人氏。猴王慌忙磕头不住说：弟子是老实之言，决无虚诈。祖师说：你既老实，怎么说东胜神洲？人若骂我，我也不生气；若打我，我也不发火。祖师说：既无父母，想是树上生的？猴王说：我虽不是树上生，却是石里长的。祖师听完暗喜，说：这样看来，却是个天地生成的。猴王纵身跳起，拐呀拐的走了两遍。祖师笑说：你身躯虽是普通，却像个食松果的猢狲。猴王听说，心里高兴极了，朝上磕头说：好！祖师说：我门中有十二个字，分派起名，到你原来第十辈之徒弟。祖师说：原来广、大、智、慧、真、如、 性、海、颖、悟、圆、觉十二字。"
      ],
      "2": [
        "话表美猴王得了姓名，怡然踊跃，对菩提前作礼启谢。那祖师就命大众引孙悟空出二门外，让他洒扫应对、进退周旋之节。悟空到门外，又拜了大众师兄，就于廊庑之间安排寝处。孙悟空在旁边闻讲，喜得他抓耳挠腮，眉花眼笑，忍不住手之舞之，足之蹈之。忽被祖师看见，叫孙悟空说：你在班中，怎么颠狂跃舞，不听我讲？悟空说：弟子诚心听讲，听到老师父妙音处，高兴极了，故不觉作此踊跃之状。祖师说：你既识妙音，我且问你，你到洞中多少时了？悟空说：弟子本来懵懂，不知多少时节。只记得灶下无火，常去山后打柴，见一山好桃树，我在哪里吃了七次饱桃矣。",
        "祖师说：若要长生，也似壁里安柱。悟空说：师父，我是个老实人，不晓得打市语。祖师说：人家盖房，欲图坚固，将墙壁之间立一顶柱，有日大厦将颓，他必朽矣。祖师说：让你静字门中之道，怎么？祖师说：此是休粮守谷、清静无为、参禅打坐、戒语持斋，或睡功，或立功，并入定、坐关之类。祖师说：就如那头上造成砖瓦之坯，虽已成形，尚未经水火锻炼，一朝大雨滂沱，他必滥矣。吓得那一班听讲的人人惊惧，皆怨悟空说：你这泼猴，十分无状。悟空一一些也不生气，只是满脸陪笑。原来那猴王已打破盘中之谜，暗暗在心，所以不与众人争竞，只是忍耐无言。",
        "那大众还正睡哩，不知悟空已得了好事。却早过了三年，祖师复登宝座，与众说法。悟空说：弟子近来法性颇通，根源亦渐坚固矣。悟空听说，沉吟良久说：师父之言谬矣。祖师说：此原来非常之说：夺天地之好运气，侵日月之玄机；丹成之后，鬼神难容。虽驻颜益寿，但到了五百年后，天降雷灾打你，须要见性明心，预先躲避。躲得过，寿与天齐；躲不过，就此绝命。悟空闻说，毛骨悚然，磕头礼拜说：还请老爷垂悯，传与躲避三灾之法，到底不敢忘恩。祖师说：此亦无难，只是你比他人不同，故传不得。悟空说：我也头圆顶天，足方履地，一般有九窍四肢，五脏六腑，何以比人不同？",
        "祖师说：既如此，上过来，传与你口诀。这猴王也是他一窍通时百窍通，当时习了口诀，自修自炼，将七十二般变化都学成了。忽一日，祖师与众门人在三星洞前戏玩晚景。悟空说：多蒙师父海恩，弟子功果完备，已能霞举飞升也。悟空弄本事，将身一耸，打了个连扯跟头，跳离地有五六丈，踏云霞去勾有顿饭之时，返复不上三里远近，落在面前，扠手说：师父，这就是飞举腾云了。祖师笑说：这个算不得腾云，只算得爬云而已。祖师说：凡腾云之辈，早辰起自北海，游过东海、西海、南海，复转苍梧。祖师说：世上无难事，只怕有心人。悟空听见此言，磕头礼拜，启说：师父，为人须为彻，索性舍个大慈悲，将此腾云之法，一发传与我罢，决不敢忘恩。",
        "大众说：悟空，你是那世修来的缘法？前日老师父附耳低言，传与你的躲三灾变化之法，可都会么？悟空笑说：不瞒诸兄长说，一则是师父传授，二来也是我昼夜殷勤，那几般儿都会了。大众说：趁此良时，你试演演，让我们看看。悟空闻说，抖搜精神，卖弄手段说：众师兄请出个题目。大众见了鼓掌，呵呵大笑，都说：好猴儿，好猴儿！祖师急拽杖出门来问：是谁在此喧哗？悟空也现了本相，杂在丛中说：启上尊师：我们在此会讲，更无外姓喧哗。祖师怒喝说：你们大呼小叫，全不像个修行的体段！修行的人，口开神气散，舌动是非生，怎么在此嚷笑？",
        "悟空领罪，上告尊师：我也离家有二十年矣，虽是回顾旧日儿孙，但念师父厚恩未报，不敢去。祖师说：哪里什么恩义，你只是不惹祸，不牵带我就罢了。悟空说：决不敢提起师父一字，只说是我自家会的就罢。悟空按下云头，直至花果山，找路而走。那崖下石坎边，花草中，树木里，若大若小之猴，跳出千千万万，把个美猴王围在当中，磕头叫说：大王，你好宽心，怎么一去许久？悟空闻说，心中大怒，说：是什么妖魔，辄敢无状？悟空说：这里到他哪里，有多少路程？众猴说：他来时云，去时雾，或风或雨，或电或雷，我们不知有多少路。悟空说：既如此，你们休怕，且自玩耍，等我寻他去来。",
        "小妖说：洞外有猴头称为花果山水帘洞洞主，他说你屡次欺他儿孙，特来寻你，见个上下哩。魔王笑说：我常听见那些猴精说他有个大王，出家修行去，想是今番来了。小妖说：他也没什么器械，光着个头，穿一领红色衣，勒一条黄绦，足下踏一对乌靴，不僧不俗，又不像道士、神仙，赤手空拳，在门外叫哩。那魔王穿了甲冑，绰刀在手，与妖怪们出得门来，就高声叫说：那个是水帘洞洞主？悟空急睁睛观看，只见那魔王：头戴乌金盔，映日光明；身挂皂罗袍，迎风飘荡。猴王喝说：这泼魔这般眼大，看不见我。魔王见了，笑说：你身不满四尺，年不过三旬，手内又无兵器，怎么大胆猖狂，要寻我见什么上下？",
        "悟空说：这是他弄的个术法儿，有何难也？安排酒果，接风贺喜，启问降魔救子之事。悟空备细言了一遍，众猴称扬不尽说：大王去到那方，不意学得这般手段。悟空又说：我当年别你们，随波逐流，飘过东洋大海，到西牛贺洲地界，径至南赡部洲，学成人像，着此衣，穿此履，摆摆摇摇，云游了八九年余，更没有有道。又渡西洋大海，到西牛贺洲地界，寻找多时，幸遇一老祖，传了我与天同寿的真功果，不死长生的大法门。悟空又笑说：小妖们，又喜我这一门皆有姓氏。众猴闻说，鼓掌忻然说：大王是我，我们都是二孙、三孙、细孙、小孙……一家孙、一国孙、一窝孙矣！"
      ],
      "3": [
        "众猴闻说，个个惊恐说：大王所见甚长，只是无处可取。正说间，转上四个老猴，两个是赤尻马猴，两个是通背猿猴，走在面前说：大王，若要治锋利器械，甚是容易。四猴说：我们这山向东去，有二百里水面，那厢原来傲来国界。悟空闻说，心里高兴极了说：你们在此玩耍，待我去来。动咒语，向巽地上吸一口气，呼的吹将去，就是一阵风，飞沙走石，好惊人也：悟空才按下云头，径闯入朝门里，直寻到兵器馆、武库中，打开门扇看时，哪里面无数器械：刀、枪、剑、戟、斧、钺、毛、镰、鞭、钯、挝、简、弓、弩、叉、矛，件件具备。变做千百个小猴，都乱搬乱抢，有力的拿五七件，力小的拿三二件，尽数搬个罄净。",
        "美猴王正喜间，忽对众说说：你们弓弩熟谙，兵器精通，奈我这口刀着实榔 ，不于是我意，奈何？四老猴上前启奏说：大王原来是仙圣，凡兵是不堪用。悟空说：我自闻道之后，有七十二般地煞变化之功，筋斗云有不要大的神通；善能隐身遁身，起法摄法。四猴说：大王既有此神通，我们这铁板桥下，水通东海龙宫。大王若肯下去，寻着老龙王，问他要件什么兵器，却不趁心？好猴王，跳至桥头，使一个闭水法，捻着诀，扑的钻入波中，分开水路，直接走进东洋海底。正行间，忽见一个巡海的夜叉，挡住问：那推水来的，是何神圣？悟空说：我原来花果山天生圣人孙悟空，是你老龙王的紧邻，为什么不识？",
        "他尽力两手挝过说：忒粗忒长些，再短细些方可用。悟空十分欢喜，拿出海藏看时，原来两头是两个金箍，中间原来一段乌铁。一边走，一边心思口念，手颠着说：再短细些更妙。拿出外面，只有二丈长短，碗口粗细。你看他弄神通，丢开解数，打转水晶宫里。吓得老龙王胆战心惊，小龙子魂飞魄散，龟鳖鼋鼍皆缩颈，鱼虾鳌蟹尽藏头。悟空将宝贝执在手中，坐在水晶宫殿上，对龙王笑说：多谢贤邻厚意。悟空说：这块铁虽然好用，还有一说。悟空说：当时若无此铁，倒也罢了；如今手中既拿着他，身上更无衣服相趁，奈何？龙王说：烦上仙再转一海，或者有之。龙王说：委的没有，如有就当奉承。",
        "后要求一件兵器，献钢叉嫌小，奉画戟嫌轻；将一块天河定底神珍铁，自己拿出手，丢了些解数。你们可有什么披挂，送他一副，打发出门去罢了。敖钦听完，大怒说：我兄弟们点起兵拿他不是？西海龙王敖闰说：二哥不可与他动手。且只凑副披挂与他，打发他出了门，启表奏上上天，天自诛也。西海龙王敖闰说：我带了一副锁子黄金甲哩。南海龙王敖钦说：我有一顶凤翅紫金冠哩。悟空将金冠、金甲、云履都穿戴停当，使动如意棒，一路打出去，对众龙说：聒噪，聒噪。四海龙王甚是不平，一边商议进表上奏暂且不说。你看这猴王，分开水道，直接回到铁板桥头，撺将上去。",
        "忽然见悟空跳出波外，身上更无一点水湿，金灿灿的走上桥来。吓得众猴一齐跪下说：大王好华彩耶！悟空满面春风，高登宝座，将铁棒竖在当中。那些猴不知好歹，都来拿那宝贝，却就似蜻蜓撼铁树，分毫也不能禁动。悟空近前，舒开手，一把挝起，对众笑说：物各有主。龙王只认做是块黑铁，又唤做天河镇底神珍。那个家伙每都扛抬不动，请我亲去拿之。众猴骇然，叫说：大王，还拿出来耍耍。猴王真个去耳朵里拿出，托放掌上叫：大！他弄到欢喜处，跳上桥，走出洞外，将宝贝揝在手中，使一个法天像地的神通，把腰一躬，叫声：长！把些虎豹狼虫、满山群怪、七十二洞妖王，都吓得磕头礼拜，战兢兢魄散魂飞。",
        "只见那美猴王睡里，见两人拿一张批文，上有孙悟空三字，走近身，不容分说，套上绳，就把美猴王的魂灵儿索了去，踉踉跄跄，直带到一座城边。猴王渐觉酒醒，忽抬头观看，那城上有一铁牌，牌上有三个大字，原来幽冥界。美猴王顿然醒悟说：幽冥界原来阎王所居，何为到此？那两人说：你今阳寿该终，我两人领批，勾你来也。猴王听说，说：我超出三界之外，不在五行之中，已不伏他管辖，怎么朦胧，又敢来勾我？那两个勾死人，只管扯扯拉拉，定要拖他进去。这猴王恼起性来，耳朵中抽出出宝贝，幌一幌，碗来粗细。自解其索，丢开手，抡着棒，打入城中。",
        "是我显神通，直嚷到森罗殿，与那十王争吵，将我们的生死簿子看了，但有我们名号，具是我勾了，都不伏那个家伙所辖也。美猴王言毕前事，四健将报知各洞妖王，都来贺喜。却表启那个高天上圣大慈仁者玉皇大天尊玄穹高上帝，一日驾坐金阙云宫灵霄宝殿，聚集文武仙卿早朝之际，忽有丘弘济真人启奏说：万岁，通明殿外有东海龙王敖广进表，听天尊宣诏。表说：水元下界东胜神洲东海小龙臣敖广启奏大天圣主玄穹高上帝君：近因花果山生 、水帘洞住妖仙孙悟空者，欺虐小龙，强坐水宅，索兵器，施法施威；要披挂，骋凶骋势。圣帝览毕，传旨：着龙神回海，朕就遣将擒拿。",
        "臣启陛下，可念生化之慈恩，降一道招安圣旨，把他宣来上界，授他一个大小官职，与他籍名在箓，拘束这里。若受天命，后再升赏；若违天命，就此擒拿。金星领了旨，出南天门外，按下祥云，直至花果山水帘洞，对众小猴说：我原来天差天使，有圣旨在此，请你大王上界。洞外小猴一层层传至洞天深处，说：大王，外面有一老人，背着一角文书，言是上天差来的天使，有圣旨请你也。美猴王听得大喜，说：我这两日正思量要上天走走，却就有天使来请。金星直接走进当中，面南立定说：我是西方太白金星，奉玉帝招安圣旨，下界请你上天，拜受仙箓。这猴王与金星纵起云头，升在空霄之上。"
      ],
      "4": [
        "那太白金星与美猴王同出了洞天深处，一齐驾云而起。原来悟空筋斗云比众不同，十分快疾，把个金星撇在脑后，先至南天门外。正欲收云前进，被增长天王领着庞、刘、苟、毕、邓、辛、张、陶一路大力天丁，枪刀剑戟，挡住天门，不肯放进。猴王说：这个金星老人家原来奸诈之徒，既请我，怎么教人动刀动枪，阻塞门路？悟空就觌面发狠说：你这老人家，怎么哄我？悟空说：这样看来，也罢，我不进去了。金星又用手扯住说：你还同我进去。将近天门，金星高叫说：那天门天将、大小吏兵，放开路者。猴王始信其言，同金星缓步入里观看。两边摆数十员镇天元帅，一员员顶梁靠柱，持铣拥旄；四下列十数个金甲神人，一个个执戟悬鞭，持刀仗剑。",
        "猴王有分来天境，不堕人间点污泥。太白金星领着美猴王，到于灵霄殿外，不等宣诏，直至御前，朝上礼拜。悟空挺身在旁边，且不朝礼，但侧耳以听金星启奏。金星奏说：臣领圣旨，已宣妖仙到了。仙卿们都大惊失色说：这个野猴，怎么不拜伏参见，辄敢这等答应说：我就是。玉帝传旨说：那孙悟空原来下界妖仙，初得人身，不知朝礼，且姑恕罪。玉帝宣文选武选仙卿，看那处少甚官职，着孙悟空去除授。旁边转过武曲星君启奏说：天宫里各宫各殿，各方各处，都不少官，只是御马监缺个正堂管事。玉帝传旨说：就除他做个弼马温罢。当时猴王欢欢喜喜，与木德星官径去到任。",
        "正在欢饮之间，猴王忽停杯问：我这弼马温是个什么官衔？众说：不大，不大，只唤做未入流。猴王闻此，不觉心头火起，咬牙大怒说：这般藐视我！忽喇的一声，把公案推倒，耳中拿出宝贝，幌一幌，碗来粗细，一路解数，直打出御马监，径至南天门。众天丁知他受了仙箓，原来是个弼马温，不敢阻当，让他打出天门去了。一群猴都来磕头，迎接进洞天深处，请猴王高登宝位，一那边办酒接风。都说：恭喜大王，上界去十数年，想必得意荣归也？猴王说：我才半月有余，哪里有十数年？众猴说：大王，你在天上不觉时辰。猴王摇手说：不好说，不好说，活活的羞杀人。",
        "鬼王听言，又奏说：大王有此神通，怎么与他养马？猴王闻说，欢喜非常，连道几个好！教四健将：就替我快置个旌旗，旗上写齐天悟空四大字，立竿张挂。自此以后，只称我为齐天悟空，不许再称大王。再说那玉帝次日设朝，只见张天师引御马监监丞、监副在丹墀下拜奏说：万岁，新任弼马温孙悟空，因嫌官小，昨日反下天宫去了。正说间，又见南天门外增长天王领众天丁，亦奏说：弼马温不知何故，走出天门去了。班部中闪上托塔李天王与哪咤三太子，越班奏上说：万岁，我不才，请旨降此妖怪。只见小洞门外许多妖魔，都是些狼虫虎豹之类，丫丫叉叉，抡枪舞剑，在哪里跳斗咆哮。",
        "且留你性命，快早回天，对玉皇说：他甚不用贤。你看我这旌旗上字号，若依此字号升官，我就不动刀兵，自然的天地清泰；如若不依，时间就打上灵霄宝殿，让他龙床定坐不成。这巨灵神闻此言，急睁睛迎风观看，果见门外竖一高竿，竿上有旌旗一面，上写着齐天悟空四大字。巨灵神冷笑三声说：这泼猴，这等不知人事，辄敢无状，你就要做齐天悟空。天将神通就有道，猴王变化实无涯。巨灵名望传天下，原来本事不如他：悟空轻轻抡铁棒，着头一下满身麻。巨灵神抵敌他不住，被猴王劈头一棒，慌忙将斧架隔，扢扠的一声，把个斧柄打做两截，急撤身败阵逃生。",
        "身带六般神器械，飞腾变化广无边。悟空笑说：小太子，你的嬭牙尚未退，胎毛尚未干，怎敢说这般大话？你只看我旌旗上是什么字号，拜上玉帝：是这般官衔，再也不须动众，我自皈依；若是不于是我心，定要打上灵霄宝殿。哪咤抬头看处，原来齐天悟空四字。哪咤说：这妖猴能有多大神通，就敢称此名号？悟空说：我只站下不动，任你砍几剑罢。就变做三头六臂，恶狠狠，手持着六般兵器，原来是斩妖剑、砍妖刀、缚妖索、降妖杵、绣球儿、火轮儿，丫丫叉叉，扑面来打。悟空见了，心惊说：这小哥倒也会弄些手段。也变做三头六臂；把金箍棒幌一幌，也变作三条。",
        "天王说：既然如此，且不要与他相持，且去上界，将此言回奏，再多遣天兵，围捉这个家伙，未为迟也。你看那猴王得胜归山，那七十二洞妖王与那六弟兄，具来贺喜，在洞天福地，饮乐无比。他却对六弟兄说：小弟既称齐天悟空，你们亦可以悟空称之。内有牛魔王忽然高叫说：贤弟言之有理，我就称做平天悟空。再说那李天王与三太子领着众将，直至灵霄宝殿，启奏说：臣等奉圣旨出师下界，收伏妖仙孙悟空，不期他神通广大，不能取胜，仍望万岁添兵剿除。玉帝说：谅一妖猴，有多少本事，还要添兵？太子又近前奏说：望万岁赦臣死罪。那妖猴使一条铁棒，先败了巨灵神，又打伤臣臂膊。",
        "金星说：那众头目来，累你去报你悟空知之：我原来上帝遣来天使，有圣旨在此请他。妖怪们就跑入报说：外面有一老者，他说是上界天使，有旨意请你。悟空就带引群猴，顶冠贯甲，甲上罩了赭黄袍，足踏云履，急出洞门，躬身施礼，高叫说：老星请进，恕我没有远迎之罪。金星趋步向前，直接走进洞内，面南立着说：今告悟空：前者因悟空嫌恶官小，躲离御马监，当有本监中大小官员奏了玉帝。玉帝传旨说：凡授官职，皆由卑而尊，为什么嫌小？不知悟空神通，故遭败北，回天奏说：悟空立一竿旗，要做齐天悟空。众武将还要支我，是老汉力为悟空冒罪奏闻，免兴师旅，请大王授箓。"
      ],
      "5": [
        "与那九曜星、五方将、二十八宿、四大天王、十二元辰、五方五老 、普天星相、河汉群神，具只以弟兄相待，彼此称呼。一日，玉帝早朝，班部中闪出许旌阳真人，頫启奏说：今有齐天悟空无事闲游，结交天上众星宿，不论高低，具称朋友，恐后闲中生事。那猴王欣欣然而至，说：陛下，诏我有何升赏？玉帝说：朕见你身闲无事，与你件执事：你且权管那蟠桃园，早晚好生在意。本园中有个土地拦住问：悟空何往？悟空说：我奉玉帝点差，代管蟠桃园，今来查勘也。那土地连忙施礼，就呼那一班锄树力士、运水力士、修桃力士、打扫力士都来见悟空磕头，引他进去。悟空看玩多时，问土地说：此树有多少株数？",
        "仙女说：既如此，寻他去来，不可迟误。原来悟空耍了一会，吃了几个桃子，变做二寸长的个人儿，在那大树梢头浓叶之下睡着了。七衣仙女说：我们奉旨过来，寻不见悟空，怎敢空回？旁边有仙使说：仙娥既奉旨来，不必迟疑。我悟空闲游惯了，想是出园会友去了。那仙女依言，入树林之下摘桃：先在前树摘了二篮，又在中树摘了三篮，到后树上摘取，只见那树上花果稀疏，止有几个毛蒂青皮的。原来那悟空变化了，正睡在此枝，被他惊醒。悟空就现本相，耳朵内抽出出金箍棒，幌一幌，碗来粗细，咄的一声说：你是那方怪物，敢大胆偷摘我桃。慌忙那七仙女一齐跪下说：悟空息怒。",
        "还有五斗星君，上八洞三清、四帝、太乙天仙等众，中八洞玉皇 、九垒、海嶽神仙，下八洞幽冥教主、注世地仙，各宫各殿大小尊神，具一齐赴蟠桃嘉会。悟空说：我原来齐天悟空，就请我做个席尊，有为什么不可？仙女说：此是上会旧规，今会不知怎么。你且立下，待我先去打听个消息，看可请我不请。好悟空，捻着诀，念声咒语，对众仙女说：住！悟空纵朵祥云，跳出园内，竟奔瑶池路上而去。正行时，只见那那边：一天瑞霭光摇曳，五色祥云飞不绝。那赤脚大仙觌面撞见悟空，悟空低头定计，赚哄真仙，他要暗去赴会，却问：老道何往？大仙说：蒙王母见招，去赴蟠桃嘉会。大仙是个光明正大之人，就以他的诳语作真，说：常年就在瑶池演礼谢恩，怎么先去通明殿演礼，方去瑶池赴会？",
        "他就弄个神通，把毫毛拔下几根，丢入口中嚼碎，喷将出去，念声咒语，叫：变！就变做几个瞌睡虫，奔在众人脸上。悟空却拿了些百味八珍，佳殽异品，走入长廊里面，就着缸，挨着瓮，放开量，痛饮一番。好悟空，摇摇摆摆，仗着酒，任情乱撞。一见了，顿然醒悟说：兜率宫是三十三天之上，原来离恨天太上老君之处，怎么错到这里？众怪丢了器械，跪倒说：悟空好宽心，丢下我们许久，不来相顾。四健将打扫安歇，磕头礼拜毕，一起说：悟空在天这百十年，实受何职？悟空笑说：我记得才半年光景，怎么就说百十年话？健将说：在天一日，就在下方一年也。",
        "悟空说：且喜这番玉帝相爱，果封做齐天悟空，起一座齐天府，又设安静、宁神二司，司设仙吏侍卫。近因王母娘娘设蟠桃大会，未曾请我，是我不待他请，先赴瑶池，把他那仙品、仙酒，都是我偷吃了。悟空喝了一口，就咨牙嘴说：不好吃，不好吃。崩、芭二将说：悟空在天宫吃了仙酒、 仙殽，是以椰酒不甚美口。悟空说：你们就是亲不亲，故乡人。悟空就出洞门，又翻一筋斗，使个隐身法，径至蟠桃会上，进瑶池宫阙，只见那几个造酒、盘糟、运水、烧火的还鼾睡未醒。他将大的从左右胁下挟了两个，两手提了两个，就拨转云头回来，会众猴在于洞中，就做个仙酒会，各饮了几杯，快乐暂且不说。",
        "只见那赤脚大仙又頫上奏说：臣蒙王母诏，昨日赴会，偶遇齐天悟空，对臣言万岁有旨，着他邀臣等先赴通明殿演礼，方去赴会。玉帝越发大惊说：这个家伙假传旨意，赚哄贤卿。灵官领旨，就出殿遍访，尽得其详细，回奏说：搅乱天宫者，原来齐天悟空也。玉帝大恼，就差四大天王，协同李天王并哪咤太子，点二十八宿、九曜星官、十二元辰、五方揭谛、四值功曹、东西星斗、南北二神、五岳四渎、普天星相，共十万天兵，布一十八架天罗地网，下界去花果山围困，定捉获那个家伙处治。当时李天王传了令，着众天兵扎了营，把那花果山围得水泄不通，上下布了十八架天罗地网，先差九曜恶星出战。",
        "诗酒且图今日乐，功名休问几时成。那九个凶神已把门打破，杀进来也。正嚷间，悟空到了，叫一声：开路！那九曜星立住阵势说：你这不知死活的弼马温，你犯了十恶之罪：先偷桃，后偷酒，搅乱了蟠桃大会，又窃了老君仙丹，又将御酒偷来这里享乐。悟空笑说：这几桩事，实有，实有。九曜星说：我奉玉帝金旨，帅众到此收降你。这九曜星一齐踊跃；那美猴王不惧分毫，抡起金箍棒，左遮右挡。把那九曜星战得筋疲力软，一个个倒拖器械，败阵而走，急入中军帐下，对托塔天王说：那猴王果十分骁勇，我们战他不过，败阵来了。悟空也公然不惧，调出独角鬼王、七十二洞妖王与四个健将，就于洞门外列成阵势。",
        "这悟空一条棒，抵住了四大天神与李托塔、哪咤太子，具在半空中，杀勾多时，悟空见天色将晚，就拔毫毛一把，丢在口中，嚼碎了，喷将出去，叫声：变！就变了千百个悟空，都使的是金箍棒，打退了哪咤太子，战败了五个天王。悟空得胜，收了毫毛，急转身回洞，早又见铁板桥头，四个健将领众叩迎，那大众，哽哽咽咽大哭三声，又唏唏哈哈大笑三声。悟空说：你们见了我，又哭又笑，何也？四健将说：今早帅众将与天王交战，把七十二洞妖王与独角鬼王尽被神仙们捉了，我们逃生，故此该哭。天明看我使个大神通，拿这些天将，与众报仇。当时果又安辕营，下大寨，赏了得功之将，吩咐了天罗地网之兵，各各提铃喝号，围困了花果山，专待明早大战。"
      ],
      "6": [
        "玉帝说：每年请会，喜喜欢欢；今年被妖猴作乱，甚是虚邀也。玉帝说：妖猴原来东胜神洲傲来国花果山石卵化生的。朕欲擒拿，是长庚星启奏说：三界之间，凡有九窍者，可以成仙。就差李天王与哪咤太子收降，又降诏抚安，宣至上界，就封他做个齐天悟空，只是有官无禄。他就设计赚哄赤脚大仙，却自变他相貌入会，将仙殽仙酒尽偷吃了，又偷老君仙丹，又偷御酒若干，去与本山众猴享乐。菩萨听完，就命惠岸悟空说：你可快下天宫，到花果山，打探军情怎么。惠岸立住叫：把营门的天丁，烦你传报：我原来李天王二太子木咤──南海观音大徒弟惠岸，特来打探军情。",
        "玉帝备言父王等下界收伏妖猴，一日不见回报，胜负未知，菩萨因命愚男到此打听虚实。李天王说：昨日到此安营下寨，着九曜星挑战，被这个家伙大弄神通，九曜星具败走而回。说不了，只见辕门外有人来报说：那悟空引一群猴精，在外面叫战。四大天王与李天王并太子正议出兵，木叉说：父王，愚男蒙菩萨吩咐，下来打探消息，就说若遇战时，可助一功。天王说：孩儿，你随菩萨修行这几年，想必也有些神通，切须在意。好太子，双手抡着铁棍，束一束绣衣，跳出辕门，高叫：那个是齐天悟空？木叉说：我原来李天王第二太子木叉，今在观音菩萨宝座前为徒弟护教，法名惠岸是也。",
        "只见天王营门外，大小天兵接住了太子，让开大路，直接走进辕门，对四天王、李托塔、哪咤，气哈哈的喘息未定：好悟空，好悟空！二人当时不敢停留，闯出天罗地网，驾起瑞霭祥云。惠岸说：始领命到花果山，叫开天罗地网门，见了父亲，道师父差命之意。父王说：昨日与那猴王战了一场，止捉得他虎豹狮象之类，更未捉他一个猴精。再说玉帝拆开表章，见有求助之言，笑说：叵耐这个猴精，能有多大手段，就敢敌过十万天兵？菩萨说：原来陛下令甥显圣二郎真君，见居灌洲灌江口，享受下方香火。早有把门的鬼判传报至里说：外有天使，捧旨而至。",
        "旨意上云：花果山妖猴齐天悟空作乱：因在宫偷桃、偷酒、偷丹，搅乱蟠桃大会，见着十万天兵、一十八架天罗地网，围山收伏，未曾得胜。真君大喜说：天使请回，我当就去拔刀相助也。这真君就唤梅山六兄弟原来康、张、姚、李四太尉，郭申、直健二将军，聚集殿前说：适才玉帝调遣我们往花果山收降妖猴，同去去来。见那天罗地网密密层层，不能前进，因叫说：把天罗地网的神将听着：我原来二郎显圣真君，蒙玉帝调来，擒拿妖猴者，快开营门放行。相见毕，问及胜败之事，天王将上项事备陈一遍。真君笑说：小圣来此，必须与他斗个变化。中军里立一竿旗，上书齐天悟空四字。",
        "悟空见了，笑嘻嘻的将金箍棒抽出起，高叫说：你是何方小将，辄敢大胆到此挑战？真君喝说：你这个家伙有眼无珠，认不得我么？悟空说：我记得当年玉帝妹子思凡下界，配合杨君，生一男子，曾使斧劈桃山的，是你么？我行要骂你几声，曾奈无甚冤仇；待要打你一棒，可惜了你的性命。悟空侧身躲过，疾举金箍棒，劈手相还。他两个这场好杀：昭惠二郎神，齐天孙悟空。这个心高欺敌美猴王，那个面生压伏真梁栋。摇旗擂鼓各齐心，呐喊筛锣都助兴。金箍棒是海中珍，变化飞腾能取胜。真君与悟空斗经三百余合，不知胜负。那真君抖搜神威，摇身一变，变得身高万丈，两只手举着三尖两刃神锋，好就似华山顶上之峰，青脸獠牙，朱红头发，恶狠狠，望悟空着头就砍。",
        "心中暗想说：这猢狲必然下水去也，定变作鱼虾之类。果一变，变作个鱼鹰儿，飘荡在下溜头波面上，等待片时。那悟空变鱼儿，顺水正游，忽见一只飞禽：似青鹞，毛片不青；似鹭鸶，顶上无缨；似老鹳，腿又不红：想是二郎变化了等我哩！二郎看见说：打花的鱼儿：似鲤鱼，尾巴不红；似鳜鱼，花鳞不见；似黑鱼，头上无星；似鲂鱼，鳃上无针。那悟空就撺出水中，一变，变作一条水蛇，游近岸，钻入草中。二郎因嗛他不着，他见水响中，见一条蛇撺出去，认得是悟空。急转身，又变了一只朱绣顶的灰鹤，伸着一个长嘴，与一把尖头铁钳子相似，径来吃这水蛇。",
        "急睁凤眼，仔细看之，见旗竿站在后面，笑说：是这猢狲了，他今又在哪里哄我。门扇是我牙齿，窗棂是我眼睛，若打了牙，捣了眼，却怎么是好？真君前前后后乱赶，只见四太尉、二将军一齐拥至，说：兄长，抓住悟空了么？真君笑说：那猴儿才自变座庙宇哄我。真君说：兄弟们在此看守巡逻，等我上去寻他。见那李天王高擎照妖镜，与哪咤住立云端，真君说：天王，曾见那猴王么？天王说：没有上来，我这里照着他哩。真君把那赌变化，弄神通，拿群猴一事说毕。再说：他变庙宇，正打处，就走了。李天王听完，又把照妖镜四方一照，呵呵的笑说：真君，快去，快去。",
        "只见众天丁布罗网，围住四面；李天王与哪咤擎照妖镜，站在空中；真君把悟空围绕中间，纷纷赌斗哩。菩萨开口对老君说：贫僧所举二郎神怎么？果然有神通，已把那悟空围困，只是未得擒拿。菩萨说：我将那净瓶杨柳抛下去，打那猴头，就不能打死，也打个一跌，教二郎小圣好去拿他。老君说：你这瓶是个磁器，能打着他就好，如打不着他的头，或撞着他的铁棒，却不打碎了？捋起衣袖，左膊上取下一个圈子，说说：这件兵器，原来锟钢抟炼的，被我将还丹点成，养就一身灵气，善能变化，水火不侵，又能套诸物。话毕，自天门上往下一掼，滴流流，径落花果山营盘里，可可的着猴王头上一下。"
      ],
      "7": [
        "话表齐天悟空被众天兵押去斩妖台下，绑在降妖柱上，刀砍斧剁，枪刺剑刳，不要想伤及其身。又着雷部神仙们以雷屑钉打，越发不能伤损一毫。那大力鬼王与众启奏说：万岁，这悟空不知是哪里学得这护身之法，臣等用刀砍斧剁，雷打火烧，一毫不能伤损，却如之何？玉帝听完说：这个家伙这等这等，如哪里治？太上老君就奏说：那猴吃了蟠桃，饮了御酒，又盗了仙丹。",
        "那老君到兜率宫，将悟空解去绳索，放了穿琵琶骨之器，推入八卦炉中，命看炉的道人、架火的童子，将火扇起锻炼。这一番，那猴王不分上下，使铁棒东打西敌，更无一神可挡，只打到通明殿里，灵霄殿外。幸有佑圣真君的佐使王灵官执殿，他看悟空纵横，抽出金鞭近前挡住说：泼猴何往？这悟空不由分说，举棒就打；那灵官鞭起相迎。这个是太乙雷声应化尊，那个是齐天悟空猿猴怪。",
        "那悟空全无一毫惧色，使一条如意棒，左遮右挡，后架前迎。一时见那众雷将的刀枪剑戟、鞭简挝锤、钺斧金瓜、旄镰月铲来的甚紧，他就摇身一变：变做三头六臂；把如意棒幌一幌，变作三条；六只手使开三条棒，好就似纺车儿一般，滴流流，在那垓心里飞舞。无穷变化闹天宫，雷将神兵不可捉。当时神仙们把悟空攒在一处，却不能近身，乱嚷乱斗。那二圣得了旨，径到灵山胜境雷音宝刹之前，对四金刚、八菩萨礼毕，就烦转达。二圣就启说：向时花果山产一猴，在哪里弄神通，聚众猴搅乱世界。当遣李天王、哪咤太子擒拿未获，复招安他，封做齐天悟空，先有官无禄。",
        "着他代管蟠桃园，他就偷桃；又走至瑶池，偷殽、偷酒，搅乱大会；仗酒又暗入兜率宫，偷老君仙丹，反出天宫。后观世音举二郎真君同他义兄弟追杀，他变化多端，亏老君抛金钢琢打中，二郎方得抓住。四十九日开鼎，他却又跳出八卦炉，打退天丁，直接走进通明殿里，灵霄殿外。事在紧急，因此玉帝特请如来救驾。如来闻说，就对众菩萨说：你们在此稳坐法堂，不许乱了禅位，待我炼魔救驾去来。叫那悟空出来，等我问他有何法力。身近前，怒气昂昂，大声说：你是那方善士，敢来止住刀兵问我？来笑说：我是西方极乐世界释迦牟尼尊者。佛祖听言，呵呵冷笑说：你那个家伙原来是个猴子成精，焉敢欺心，要夺玉皇上帝尊位？",
        "悟空说：他虽年幼修长，也不应久占在此。常言说：皇帝轮流做，明年到我家。佛祖说：你除了长生变化之法，再有何能，敢占天宫胜境？悟空说：我的手段多哩：我有七十二般变化，万劫不老长生；会驾筋斗云，一纵十万八千里。佛祖说：我与你打个赌赛：你若有本事，一筋斗打出我这右手掌中，算你赢，再不用动刀兵，苦争战，就请玉帝到西方居住，把天宫让你；若不能打出手掌，你还下界为妖，再修几劫，却来争吵。那悟空听完，暗笑说：这如来十分好呆。我一筋斗去十万八千里，他那手掌方圆不满一尺，怎么跳不出去？急发声说：既如此说，你可做得主张？",
        "悟空行时，忽见有五根肉红柱子，撑着一股青气。又思量说：且住，等我留下些记号，方好与如来说话。拔下一根毫毛，吹口仙气，叫：变！变作一管浓墨双毫笔，在那中间柱子上写一行大字云：齐天悟空，到此一游。翻转筋斗云，直接回到本处，站在如来掌内说：我已去，今来了。如来骂说：我把你这个尿精猴子，你正好没有离了我掌哩。如来说：不消去，你只自低头看看。那悟空睁圆火眼金睛，低头看时，原来佛祖右手中指写着齐天悟空，到此一游。神与阿傩、迦叶一个个合掌称扬说：好极了，好极了！",
        "时有天蓬、天佑急出灵霄宝殿说：请如来少待，我主大驾来也。过了一会儿，果见八景鸾舆，九光宝盖，声奏玄歌妙乐，咏哦无量神章，散宝花，喷真香，直至佛前谢说：多蒙大法收殄妖邪，望如来少停一日，请诸仙做一会筵奉谢。如来不敢违悖，就合掌谢说：老僧承大天尊宣命来此，有何法力？玉帝传旨，就着雷部神仙们，分头请三清、四御、五老、六司、七元、八极、九曜、十都、千真、万圣来此赴会，同谢佛恩。又命四大天师、九天仙女，大开玉京金阙、太玄宝宫、洞阳玉馆，请如来高座七宝灵台，调设各班坐位，安排龙肝凤髓，玉液蟠桃。",
        "霄汉中间现老人，手捧灵芝飞蔼绣。见玉帝礼毕，又见如来，申谢说：始闻那妖猴被老君引至兜率宫锻毕，又对佛祖谢说：深感法力，降伏妖猴。只见个巡视灵官来报说：那悟空伸出头来了。袖中只拿出一张帖子，上有六个金字：唵嘛呢叭吽。这尊者就领帖子，拿出天门，到那五行山顶上，紧紧的贴在一块四方石上，那座山就生根合缝。"
      ],
      "8": [
        "试问禅关，参求无数，往往到头虚老。毛吞大海，芥纳须弥，金色头陀微笑。那时节，识破源流，就见龙王三宝。如来驾住祥云，对众说：我以甚深般若，遍观三界。那三千诸佛、五百罗汉、八金刚、四菩萨，合掌近前礼毕，问：闹天宫搅乱蟠桃者，何也？如来说：那个家伙原来花果山产的一妖猴，罪恶滔天，不可名状。他言有神通，会变化，又驾筋斗云，一去十万八千里。我与他打了个赌赛，他出不得我手，却将他一把抓住，指化五行山，封压他在哪里。",
        "丘僧尼等众说：自伏乖猿安天之后，我处不知年月，料凡间有半千年矣。众菩萨献毕，因请如来明示根本，指解源流。如来见了，心中大喜说：别个是也去不得。菩萨说：弟子此去东土，有甚言语吩咐？如来说：这一去，要踏看路道，不许在霄汉中行。就命阿傩、迦叶拿出锦襴袈裟一领。九环锡杖一根，对菩萨言说：这袈裟、锡杖，可与那取经人亲用。如来又拿出三个箍儿，递与菩萨说：此宝唤做紧箍儿，虽是一样三个，但只是用各不同。那惠岸使一条浑铁棍，重有千斤，只在菩萨左右作一个降魔的大力士。菩萨于是将锦襴袈裟，作一个包裹，令他背了。",
        "这一去，有分教：佛子还来归本愿，金蝉唐僧裹栴檀。说：今领如来法旨，上东土寻取经人去。菩萨说：未定，约摸二三年间，或可至此。那菩萨停立云步看时，只见：东连沙碛，西抵诸番，南达乌戈，北通鞑靼。菩萨正然点看，只见那河中泼剌一声响亮，水波里跳出一个妖魔来，十分丑恶。那妖怪物手执一根宝杖，走上岸就捉菩萨，却被惠岸抽出浑铁棒挡住，喝声：休走！",
        "那妖怪物架住了铁棒说：你是哪里和尚，敢来与我抵敌？木叉说：我是托塔天王二太子木叉惠岸悟空，今保我师父往东土寻取经人去。那妖怪才醒悟说：我记得你跟南海观音在紫竹林中修行，你为什么来此？让木叉揪了去见观音，纳头下拜，告说：菩萨，恕我之罪，待我诉告：我不是妖邪，我是灵霄殿下侍銮舆的卷帘大将。只因在蟠桃会上失手打碎了玻璃盏，玉帝把我打了八百，贬下界来，变得这般模样。又叫七日一次，将飞剑来穿我胸胁百余下方回。菩萨说：你在天有罪，既贬下来，今又这等伤生，正所谓罪上加罪。又向前说：菩萨，我在这里害人无数，向来有几次取经人来，都被我吃了。",
        "菩萨方与他摩顶受戒，指沙为姓，就姓了沙；起个法名，叫做个沙僧。当时入了沙门，送菩萨过了河，他洗心涤虑，再不伤生，专等取经人。他撞上来，不分好歹，望菩萨举钉钯就筑。被木叉悟空挡住，大喝一声说：那泼怪，不许无礼，看棒。播土扬尘天地暗，飞砂走石鬼神惊。九齿钯，光耀耀，双环响亮；一条棒，黑悠悠，两手飞腾。怪物见了心惊，就问：你是哪里和尚，敢弄什么眼前花儿哄我？木叉说：我把你个肉眼凡胎的泼物！那妖怪说：南海菩萨，可是扫三灾救八难的观世音么？怪物撇了钉钯，纳头下礼说：老兄，菩萨在哪里？怪物朝上磕头，大声说：菩萨，恕罪，恕罪。",
        "观音按下云头，过来问：你是哪里成精的野豕，何方作怪的老彘，敢在这里挡我？那妖怪说：我不是野豕，亦不是老彘，我本是天河里天蓬元帅。只因带酒戏弄嫦娥，玉帝把我打了二千锤，贬下尘凡。一灵真性，径来夺舍投胎，不期错了道路，投在个母猪胎里，变得这般模样。是我咬杀母猪，打死群彘，在这里占了山场，害人度日。菩萨说：古人云，若要有前程，不要做没前程。那妖怪说：前程，前程，若依你，让我喝风？常言说：依着官法打杀，依着佛法饿杀。怪物听完，似梦方觉，向菩萨说：我欲从正，奈何获罪于天，无所祷也。菩萨说：我领了佛旨，上东土寻取经人。",
        "菩萨把他送在深涧之中，只等取经人来，变做白马，上西方立功。菩萨带引木叉悟空过了此山，又奔东土。木叉说：师父，那放光之处，原来是五行山了，见有如来的压帖在哪里。菩萨说：此却是那搅乱蟠桃会、大闹天宫的齐天悟空，今原来压在此也。师徒们正说话处，早惊动了那悟空。悟空在山根下高叫说：是那个在山上吟诗，揭我的短哩？只见那石崖之下，有土地、山神、 监押悟空的天将，都来拜接了菩萨，引至那悟空面前。悟空睁开火眼金睛，点着头儿高叫说：我怎么不认得你，你好的是那南海普陀落伽山救苦救难大慈大悲南无观世音菩萨。",
        "菩萨说：我奉佛旨，上东土寻取经人去，从此经过，特留残步看你。悟空说：如来哄了我，把我压在此山，五百余年了，不能展挣。菩萨说：你这个家伙罪业弥深，救你出来，恐你又生祸害，反为不美。悟空说：我已知悔了，但愿大慈悲指条门路，情愿修行。那菩萨听见此言，心里高兴极了，对悟空说：圣经云：出其言善，则千里之外应之；出其言不善，则千里之外违之。你既有此心，待我到了东土大唐国寻一个取经的人来，让他救你。菩萨说：既有善果，我与你起个法名。悟空说：我已有名了，叫做孙悟空。那悟空见性明心归佛教，这菩萨留情在意访神僧。"
      ],
      "9": [
        "就传招贤文榜，颁布天下：各府州县，不拘军民人等，但有读书儒流，文义明畅，三场精通者，前赴长安应试。此榜行至海州地方，有一人，姓陈名萼，表字光蕊，见了此榜，就时回家，对母张氏说：朝廷颁下黄榜，诏开南省，考取贤才，孩儿想要过去应试。张氏说：我儿读书人，幼而学，壮而行，正该如此。不期游到丞相殷开山门首，有丞相所生一女，名唤温娇，又名满堂娇，未曾婚配，正高结彩楼，抛打绣球卜婿。小姐一见光蕊人材出众，知是新科状元，心内十分欢喜，就将绣球抛下，恰打着光蕊的乌纱帽。太宗问：新科状元陈光蕊应授何官？魏征丞相奏说：臣查所属州郡，有江州缺官，乞我主授他此职。张氏说：恭喜我儿，且又娶亲回来。",
        "张氏身体忽然染病，与光蕊说：我身上不安，且在店中调养两日再去。光蕊惊异说：闻说鱼蛇眼，必不是等闲之物。渔人说：离府十五里洪江内打来的。光蕊说：此店已住三日了，钦限紧急，孩儿想要明日起身，不知母亲身体好否？张氏说：我身子不快，此时路上炎热，恐添疾病。光蕊令家僮将行李搬上船去，夫妻正齐齐上船，那刘洪睁眼看见殷小姐面如满月，眼似秋波，樱桃小口，绿柳蛮腰，真个有沉鱼落雁之容，闭月羞花之貌，陡起狼心。候至夜静三更，先将家僮杀死，次将光蕊打死，把倒下的人都推在水里去了。小姐见他打死了丈夫，也就将身赴水。",
        "有洪江口巡海夜叉见了，星飞报入龙宫，正值龙王升殿，夜叉报说：今洪江口不知甚人把一个读书士子打死，将尸撇在水底。龙王叫将尸抬来，放在面前，仔细一看说：此人正是救我的恩人，怎么被人谋死？我今日须索救他性命，以报日前之恩。就写下牒文一道，差夜叉径往洪州城隍、土地处投下，要取秀才魂魄来，救他的性命。夜叉带了魂魄到水晶宫，禀见了龙王。光蕊施礼说：小生陈萼，表字光蕊，系海州弘农县人。行至江边上船，不料稍子刘洪贪谋我妻，将我打死抛尸。你是救我的恩人，你今有难，我岂有不救你之理？又说：你今真魂，权且在我水府中做个都领。",
        "唐僧慌忙救起，见了怀中血书，方知来历。唐僧就叫他削发修行，取法名为玄奘，摩顶受戒，坚心修道。和尚大怒，骂说：你这业畜，姓名也不知，父母也不识，还在此捣什么鬼？玄奘被他骂出这般言语，入寺跪告师父，眼泪双流说：人生于天地之间，禀阴阳而资五行，尽由父生母养，岂有为人在世而无父母者乎？唐僧说：你真个要寻父母，可随我到方丈里来。唐僧到重梁之上，取下一个小匣儿，打开来，拿出血书一纸、汗衫一件，付与玄奘。玄奘读罢，不觉哭倒在地说：父母之仇，不能报复，何以为人？此身若非师父捞救抚养，安有今日？容弟子去寻见母亲，然后头顶香盆，重建殿宇，报答师父之深恩也。",
        "正沉吟间，忽听私衙前有人念经，连叫抄化，小姐又乘就出来问：你是哪里来的？玄奘答说：贫僧原来是金山寺法明唐僧的徒弟。小姐说：你既是金山寺唐僧的徒弟……叫进衙来，将斋饭与玄奘吃。小姐将从婢打发开去，问：你这小师父，还是自幼出家的，还是中年出家的？玄奘答说：我也不是自幼出家，我也不是中年出家，我说起来，冤有天来大，仇有海样深：我父被人谋死，我母却被贼人占了。我师父法明唐僧让我在江州衙内寻取母亲。玄奘说：十八年不识生身父母，今朝才见母亲，教孩儿怎么割舍？小姐说：我幼时曾许下一愿，许舍僧鞋一百双。",
        "当时两个又抱住而哭，拜谢唐僧养育之恩。法明说：你今母子相会，恐奸贼知之，可速速抽身回去，庶免其祸。小姐说：我儿，我与你一只香环，你径到洪州西北地方，约有一千五百里之程，哪里有个万花店，当时留下婆婆张氏在哪里，是你父亲生身之母。你将我的书递与外公，叫外公奏上唐王，统领人马，擒杀此贼，与父报仇，那时才救得老娘的身子出来。来到万花店，问那店主刘小二说：昔年江州陈客官有一母亲住在你店中，如今好么？玄奘听完，就时问到南门头破瓦，寻着婆婆。玄奘说：我不是陈光蕊，我是陈光蕊的儿子。玄奘说：我爹爹被强盗打死了，我娘被强盗霸占为妻。",
        "夫人说：我昨夜梦见我女儿满堂娇来家，不要不是女婿有书信回来也？小和尚见了丞相与夫人，哭拜在地，就怀中拿出一封书来，递与丞相。丞相说：夫人不许烦恼，来朝奏知主上，亲自统兵，定要与女婿报仇。次日，丞相入朝，启奏唐王说：今有臣婿状元陈光蕊，带领家小江州赴任，被稍水刘洪打死，占女为妻；假冒臣婿，为官多年。事属异变，乞陛下立发人马，剿除贼寇。晓行夜宿，星落鸟飞，不觉已到江州，殷丞相兵马具在北岸下了营寨。玄奘闻知，急急将母解救，双膝跪下，对母说：儿与外公统兵至此，与父报仇。丞相说：此非我儿以盛衰改节，皆因出乎不得已，何得为耻？",
        "三人望江痛哭，早已惊动水府，有巡海夜叉将祭文呈与龙王。龙王看完，就差鳖元帅去请光蕊来到，说：先生，恭喜，恭喜。龙王就令夜叉将光蕊身尸送出江口还魂。小姐说：因你被贼人打死，后来妾身生下此子，幸遇金山寺唐僧抚养长大，寻我相会，我让他去寻外公。光蕊说：皆因我与你昔年在万花店时，买放了那尾金色鲤鱼，谁知那鲤鱼就是这里龙王。后来逆贼把我推在水中，全亏得他救我。丞相就令安排酒席，答谢所属官员。那婆婆当夜得了一梦，梦见枯木开花，屋后喜鹊频频喧噪，想说：不要不是我孙儿来也？丞相说：今日此宴，可取名为团圆会。"
      ],
      "10": [
        "张稍说：李兄，我想那争名的，因名丧体；夺利李定说：你的水秀，不如我的山青。渔翁说：你山青不如我水秀，受用些好物。樵夫说：你水秀不如我山青，受用些好物。渔翁说：你山青真个不如我的水秀。渔翁说：李兄，你山中不如我水上生意快活。樵夫说：张兄，你水上还不如我山中的生意快活。渔翁说：你山中虽可比过，还不如我水秀的幽雅。樵夫说：你水秀的幽雅，还不如我山青更幽雅。渔翁说：这都是我两个生意，赡身的勾当，你却没有我闲时节的好处。樵夫说：你那闲时又不如我的闲时好也。张稍说：李定，我两个真是微吟可相狎，不须檀板共金樽。",
        "小舟仰卧观飞雁，草径斜欹听唳鸿。张稍说：李兄，我才僭先起句，今到我兄，也先起一联，小弟亦当续之。",
        "张稍说：李兄呵，途中保重，上山仔细看虎。李定听完，大怒说：你这个家伙惫懒！李定说：天有不测风云，人有暂时祸福。张稍说：李兄，你虽这样看来，你还没捉摸；不若我的生意有捉摸，定不遭此等事。原来这泾河水府有一个巡水的夜叉，听见了百下百着之言，急转水晶宫，慌忙报与龙王说：祸事了！夜叉说：臣巡水去到河边，只听得两个渔、樵攀话，相别时，言语甚是利害。那渔翁说：长安城里，西门街上，有个卖卦先生，算得最准。若依此等算准，却不将水族尽情打了？龙王甚怒，急提了剑，就要上长安城，诛灭这卖卦的。旁边闪过龙子、龙孙、虾臣、蟹士、鲥军师 、鳜少卿、鲤太宰，一齐启奏说：大王且息怒。",
        "我与他打了个赌赛：若果如他言，送他谢金五十两；如略差些，就打破他门面，赶他起身，不许在长安惑众。众水族笑说：大王是八河都总管，司雨大龙神，有雨无雨，惟大王知之。此时龙子、龙孙与那鱼卿、蟹士正欢笑谈此事未毕，只听得半空中叫：泾河龙王接旨。慌忙龙王整衣站端正，焚香接了旨。龙王谢恩，拆封看时，上写着：敕命八河总，驱雷抽出电行：明朝施雨泽，普济长安城。少顷甦醒，对众水族说：尘世上有此灵人，真个是能通天地理，却不输与他呵！龙王问计，军师说：行雨差了时辰，少些点数，就是那个家伙断卦不准，怕不赢他？那时捽碎招牌，赶他跑路，果何难也？",
        "他又按落云头，还变作白衣秀士，到那西门里大街上，撞入袁守诚卦铺，不容分说，就把他招牌、笔、砚等一齐捽碎。这龙王又抡起门板就打，骂说：这妄言祸福的妖人，擅惑众心的泼汉！守诚犹公然不惧分毫，仰面朝天冷笑说：我不怕，我不怕。我认得你，你不是秀士，原来是泾河龙王。急丢了门板，整衣伏礼，向先生跪下说：先生休怪。望先生救我一救；不然，我死也不放你。守诚说：我救你不得，只是指条生路与你投生就了。先生说：你明日午时三刻，该赴人曹官魏征处听斩。这泾河龙王也不回水府，只在空中。忽然龙王变作人相，上前跪拜，口叫：陛下，救我，救我。",
        "唐王闪凤目龙睛，一一从头观看，只见那文官内是房玄龄、杜如晦、徐世勣、许敬宗、王珪等，武官内是马三宝、段志玄、殷开山、 程咬金、刘洪纪、胡敬德、秦叔宝等，一个个威仪站端正，却不见魏征丞相。唐王召徐世勣上殿说：朕夜间得一怪梦：梦见一人，迎面拜谒，口称是泾河龙王，犯了天条，该人曹官魏征处斩，拜告我救他，朕已许诺。须唤魏征来朝，陛下不要放他出门，过此一日，可救梦中之龙。凡敌无事而自补者，有侵绝之意；弃小而不救者，有图大之心；随手而下者，无谋之人；不思而应者，取败之道。太宗笑说：贤卿真是匡扶社稷之心劳，创立江山之力倦，所以不觉盹睡。",
        "正朦胧睡间，又见那泾河龙王手提着一颗血淋淋的首级，高叫：唐太宗，还我命来！你昨夜满口许诺救我，怎么天明时反宣人曹官来斩我？正在那难分难解之时，只见正南上香云缭绕，彩雾飘飘，有一个女真人上前，将杨柳枝用手一摆，那没头的龙悲悲啼啼，径往西北而去。原来这是观音菩萨领佛旨，上东土寻取经人，住此长安城都土地庙里，夜闻鬼泣神号，特来喝退业龙，救脱皇帝。及日上三竿，方有旨意出来说：朕心不快，众官免朝。不觉倏五七日，众官忧惶，都正要撞门见驾问安，只见太后有旨，召医官入宫用药。拜毕，太宗正色强言说：贤卿，我十九岁领兵，南征北伐，东挡西除，苦历数载，更没有见半点邪祟，今日却反见鬼。",
        "你看他怎生打扮：头戴金盔光烁烁，身披铠甲龙鳞。晓来宣二将军，重重赏劳说：朕自得疾，数日不能得睡，今夜仗二将军威势甚安。太宗又不忍二将辛苦，又宣叔宝、敬德与杜、房诸公入宫，吩咐说：这两日朕虽得安，却只难为秦、胡二将军彻夜辛苦。晓来就宣众臣说：连日前门幸喜无事，今夜后门又响，却不又惊杀我也。茂公进前奏说：前门不安，是敬德、叔宝护卫；后门不安，该着魏征护卫。他怎生打扮：熟绢青巾抹额，锦袍玉带垂腰。旁边闪魏征，手扯龙衣，奏说：陛下宽心，臣有一事，管保陛下长生。太宗说：病势已入膏肓，命将危矣，怎么保得？"
      ],
      "11": [
        "正惊惶难寻道路，只见那一边，有一人高声大叫说：大唐皇帝，往这里来，往这里来。鬓发蓬松飘耳上，胡须飞舞绕腮旁。那人说：我半月前在森罗殿上，见泾河鬼龙告陛下许救反诛之故，第一殿秦广大王就差鬼使催请陛下，要三曹对案。那人说：我存日，在阳曹侍先君驾前，为兹洲令，后拜礼部侍郎，姓崔名。太宗大喜，就近前，御手忙搀说：先生远劳。其书说：辱爱弟魏征顿首书拜大都案契兄崔老先生台下：忆昔交游，音容如在。那判官看了书，心里高兴极了说：魏人曹前日梦斩老龙一事，臣已早知，甚是夸奖不尽。二人正说间，只见那边有一对青衣童子执幢幡、宝盖，高叫说：阎王有请，有",
        "太宗正在外面观看，只见那那边环珮叮当，仙香奇异，外有两对提烛，后面却是十代阎王降阶而至，是那十代阎王：秦广王、初江王、宋帝王、仵官王、阎罗王 、平等王、泰山王、都市王、卞城王、转轮王。十王说：陛下是阳间人王，我们是阴间鬼王，分所当然，何须过让？太宗说：朕得罪麾下，岂敢论阴阳人鬼之道？约有片时，秦广王拱手而进言说：泾河鬼龙告陛下许救而反杀之，何也？太宗说：朕曾夜梦老龙求救，实是允他无事。这是那人曹官出没神机，又是那龙王犯罪当死，岂是朕之过也？十王听完，伏礼说：自那龙未生之前，南斗星死簿上已注定该遭杀于人曹之手，我们早已知之。",
        "太宗出森罗殿，又有礼了问十王说：朕宫中老少安否怎么？十王说：具安，但恐御妹寿似不永。太宗又再拜启谢：朕回阳世，无物可酬谢，惟答瓜果而已。十王喜说：我处颇有东瓜、西瓜，只少南瓜。太宗举目而看，不是旧路，问判官说：此路差矣？哪里山也有，峰也有，岭也有，洞也有，涧也有；只是山不生草，峰不插天，岭不行客，洞不纳云，涧不流水。催命的判官，急急忙忙传信票；追魂的太尉，吆吆喝喝趱公文。判官说：此是阴山背后一十八层地狱。判官说：你听我说：吊筋狱、幽枉狱、火坑狱，寂寂寥寥，烦烦恼恼，尽皆是生前作下千般业，死后通来受罪名。",
        "血池狱、阿鼻狱、秤杆狱，脱皮露骨，折臂断筋，也只为谋财害命，宰畜屠生，堕落千年难解释，沉沦永世不翻身。差些赤发鬼、黑脸鬼，长枪短剑；牛头鬼 、马面鬼，铁简铜锤：只打得皱眉苦面血淋淋，叫地叫天无救应。进前又走不多时，见一伙鬼卒各执幢幡，路旁边跪下说：桥梁使者来接。太宗又见那一边有一座银桥，桥上行几个忠孝贤良之辈，公平正大之人，亦有幢幡接引；那那边又有一桥，寒风滚滚，血浪滔滔，号泣之声不绝。前又到枉死城，只听哄哄人嚷，分明说：李世民来了，李世民来了。见一伙拖腰折臂 、有足无头的鬼魅，上前拦住；都叫说：还我命来！",
        "判官说：陛下，那些人都是那六十四处烟尘、七十二处草寇众王子、众头目的鬼魂，尽是枉死的冤业，无收无管，不得超生，又无钱钞盘缠，都是孤寒饿鬼。太宗说：我空身到此，却哪里得有钱钞？判官说：陛下，阳间有一人，金银若干，在我这地府里寄放。判官说：他是河南开封府人氏，姓相名良，他有十三库金银在此。判官复吩咐说：这些金银，你们可均分用度，放你大唐爷爷过去，他的阳寿还早哩。判官说：陛下明心见性，是必记了，传与阳间人知。这唤做六道轮回：那行善的，升化仙道；尽忠的，超生贵道；行孝的，再生福道；公平的，还生人道；积德的，转生富道；恶毒的，沉沦鬼道。",
        "再说那唐朝驾下有徐茂公、秦叔宝、胡敬德、段志玄、马三宝、程咬金、高士廉 、李世勣、房玄龄、杜如晦、萧瑀、傅奕、张道源、张士衡、王珪等两班文武，具保着那东宫太子与皇后、嫔妃、宫娥、侍长，都在那白虎殿上举哀。时有魏征在旁边说：大家且住，不可，不可。下边闪上许敬宗说：魏丞相言之甚谬。魏征说：不瞒许先生说，下官自幼得授仙术，推算最明，管取陛下不死。正讲处，只听得棺中连声大叫说：渰杀我耶！储君脚软，难扶丧杖尽哀仪；侍长魂飞，怎戴梁冠遵孝礼。嫔妃打跌，却如狂风吹倒败芙蓉；彩女欹斜，好似骤雨冲歪娇菡萏。",
        "再说太宗自服了安神定魄之剂，连进了数次粥汤，被众臣扶入寝室，一夜稳睡，保养精神，直至天明方起，抖擞威仪，你看他怎生打扮：戴一顶冲天冠，穿一领赭黄袍。只听得传旨说：有事出班来奏，无事退朝。那东厢闪过徐茂公、魏征、王珪、杜如晦、房玄龄、袁天罡、李淳风、许敬宗等；西厢闪过殷开山、刘洪基、马三宝、段志玄、程咬金 、秦叔宝、胡敬德、薛仁贵等，一齐上前，在白玉阶前俯伏启奏说：陛下前朝一梦，怎么许久方觉？太宗说：日前接得魏征书，朕觉神魂出殿，只见羽林军请朕出猎。他说那泾河龙诬告我许救转杀之事，是朕将前言陈具一遍。",
        "分别出了那六道轮回之下，有朱太尉请朕上马，飞也相似，行到渭水河边，我看见那水面上有双头鱼戏。正欢喜处，他将我撮着脚，推下水中，朕方得还魂也。榜说：乾坤浩大，日月照鉴分明；宇宙宽洪，天地不容奸党。一那边又出招贤榜，招人进瓜果到地府里去；一那边将宝藏库金银一库，差尉迟恭、胡敬德上河南开封府，访相良还债。刘全又不忍见，无奈，于是舍了性命，弃了家缘，撇了儿女，情愿以死进瓜，将皇榜揭了，来见唐王。把门的鬼使喝说：你是甚人，敢来这里？刘全说：我奉大唐太宗皇帝钦差，特进瓜果与十代阎王受用的。刘全径至森罗宝殿，见了阎王，将瓜果进上说：奉唐王旨意，远进瓜果，以谢十王宽宥之恩。"
      ],
      "12": [
        "因为我三个月前拔金钗在门首给和尚饭吃，我丈夫怪我擅出内门，不遵妇道，骂了我几句，是我气塞胸堂，将白绫带悬梁缢死，撇下一双儿女，昼夜悲啼。太宗听完，与众宫人说：想是御妹跌昏了，胡说哩。唐王当殿，忽有当驾官奏说：万岁，今有进瓜果人刘全还魂，在朝门外等旨。刘全说：臣顶瓜果，径至鬼门关，引上森罗殿，见了那十代阎王，将瓜果奉上，备言我王殷勤致谢之意。阎王甚喜，多多拜上我王说：真是个有信有德的太宗皇帝！刘全说：臣没有远行，没见甚的，只听见阎王问臣乡贯、姓名。唐王惊问：那阎王可曾说你妻什么？刘全说：阎王没有说什么，只听得鬼使说：李翠莲归阴日久，倒下的人无存。阎王说：唐御妹李玉英今该促死，教翠莲就借玉英尸还魂去罢。",
        "唐王听完禀报，心里高兴极了，当对多官说：朕别阎王，曾问宫中之事。又问他详细，他说的话，与刘全一般。魏征奏说：御妹偶尔寿促，少甦醒就说此言，此是刘全妻借尸还魂之事。唐王说：朕才命太医院去进药，不知何如。那宫主在里面乱嚷说：我吃什么药？玉英说：说什么话，我两个从小儿的结发夫妻，与他生男育女，怎么不认得？那宫主下了宝殿，直至白玉阶前，见了刘全，一把扯住说：丈夫，你往哪里去，就不等我一等？再说那尉迟恭将金银一库，上河南开封府访看，相良原来卖水为活，同妻张氏在门首贩卖乌盆瓦器营生，但赚得些钱儿，只以盘缠为足，其多少给和尚饭吃布施，买金银纸锭，记库焚烧，故有此善果臻身。",
        "说：小的若受了这些金银，就死得快了。尉迟恭说：陛下说，借你的东西，有崔判官作保可证。尉迟恭见他苦苦推辞，只得具本差人启奏。太宗见了本，知相良不受金银，说：此诚为善良长者。于是将金银买到城里军民无碍的地基一段，周围有五十亩宽阔，在上兴工，起盖寺院，名敕建相国寺，左有相公、相婆的生祠，镌碑刻石，上写着尉迟恭监造，就今大相国寺是也。榜行天下，着各处官员推选有道的高僧，上长安做会。表说：西域之法，无君臣父子，以三涂六道，蒙诱愚蠢。时有宰相萧瑀，出班俯奏说：佛法兴自屡朝，弘善遏恶，冥助国家，理无废弃。",
        "拜罢奏说：臣瑀等蒙圣旨，选得高僧一名陈玄奘。太宗闻其名，沉思良久说：可是学士陈光蕊之儿玄奘否？太宗喜说：果然举之不错，诚为有德行有禅心的和尚。幢幡飘舞，凝空道道彩霞摇；宝盖飞辉，映日翩翩红电彻。",
        "再说南海普陀山观世音菩萨，自领了如来佛旨，在长安城访察取经的善人，日久未逢真实有德悟空。菩萨十分欢喜，就将佛赐的宝贝捧上长街，与木叉货卖。菩萨说：袈裟价值五千两，锡杖价值二千两。那愚僧笑说：这两个癞和尚是疯子！菩萨欣然从之，拽转步，径进东华门里。见萧瑀引着两个疥癞僧人，立于阶下，唐王问：萧瑀来奏何事？萧瑀俯伏阶前说：臣出了东华门前，偶遇二僧，原来卖袈裟与锡杖者。菩萨与木叉侍立阶下，更不行礼，因问袈裟之价，答说：袈裟五千两，锡杖二千两。太宗说：那袈裟有何好处，就值许多？菩萨说：这袈裟，龙披一缕，免大鹏吞噬之灾；鹤挂一丝，得超凡入圣之妙。穿上满身红雾遶，脱来一段彩云飞。",
        "菩萨有礼了说：贫僧有愿在前，原说果然有敬重三宝，见善随喜，皈依我佛，不要钱，愿送与他。菩萨又坚辞不受，畅然而去，依旧望都土地庙中隐避暂且不说。太宗说：求证善事，有劳法师，无物太宗说：法师如不弃，可穿上与朕看看。太宗喜之非常，就着法师穿了袈裟，持了宝杖；又赐两队仪从，着多官送出朝门，让他上大街行道，往寺里去，就如中状元夸官的一般。你看那长安城里，行商坐贾、公子王孙、墨客文人、大男小女，无不争看夸奖，一起说：好个法师，真是个活罗汉下降，活菩萨临凡。当有菩萨与木叉说：今日是水陆正会，以一七继七七，可矣了。",
        "这菩萨近过来，拍着宝台，大声说：那和尚，你只会谈小乘教法，可会谈大乘么？玄奘听完，心中大喜，翻身跳下台来，对菩萨有礼了说：老师父，弟子失瞻多罪。菩萨说：你这小乘教法，度不得亡者超升，只可浑俗和光而已。我有大乘佛法唐僧，能超亡者升天，能度难人脱苦，能修无量寿身，能作无来无去。正讲处，有那司香巡堂官急奏唐王说：法师正讲谈妙法，被两个疥癞游僧扯下来乱说胡话。只见许多人将二僧推拥进后法堂，见了太宗，那僧人手也不起，拜也不拜，仰面说：陛下问我何事？唐王却认得他，说：你是前日送袈裟的和尚？太宗说：你既来这里听讲，只该吃些斋就了，为什么与我法师乱讲，扰乱经堂，误我佛事？",
        "随就宣上宝殿说：唐僧，今日是出行吉日。太宗说：当时菩萨说，西天有经唐僧。玄奘又谢恩，接了御酒说：陛下，酒原来僧家头一戒，贫僧自为人，不会饮酒。太宗说：今日之行，比他事不同，此原来素酒，只饮此一杯，以尽朕奉饯之意。唐僧不敢不受，接了酒，方待要饮，只见太宗低头，将御指拾一撮尘土，弹入酒中。唐僧不解其意，太宗笑说：唐僧呵，这一去，到西天，几时可回？唐僧说：只在三年，直接回到上国。太宗说：日久年深，山遥路远，唐僧可进此酒：宁恋本乡一捻土，不要爱他乡万两金。唐僧方悟捻土之意，复谢恩饮尽，辞谢出关而去。"
      ],
      "13": [
        "和尚们们灯下议论佛门定旨，上西天取经的缘由：有的说水远山高，有的说路多虎豹；有的说峻岭陡崖难度，有的说毒魔恶怪难降。唐僧钳口不言，但以手指自心，点头几度。和尚们们不要解其意，合掌请问：法师指心点头者，何也？唐僧答说：心生，种种魔生；心灭，种种魔灭。玄奘于是穿了袈裟，上正殿，佛前礼拜说：弟子陈玄奘，前往西天取经，但肉眼愚迷，不识活佛真形。依稀黯淡野云飞，玄鸟去，宾鸿至,嘹嘹呖呖声宵碎。早有镇边的总兵与本处僧道，听见是钦差唐僧法师上西方见佛，无不恭敬。",
        "唐僧听完，抬头观看，前走的是一条黑汉。熊山君说：寅将军一向得意，可贺，可贺。特处士说：寅将军丰姿胜常，真可喜，真可喜。山君说：不可尽用，食其二，留其一可也。魔王领诺，就呼左右，将二从者剖腹伤害，剁碎其尸：将首级与性命奉献二客，将四肢自食，其余骨肉分给各妖。那二怪至天晓方散，一起说：今日厚扰，容日竭诚奉酬。不一时，红日高升，唐僧昏昏沉沉，也辨不得东西南北。对面吹了一口气，唐僧方甦，跪拜于地说：多谢老公公，搭救贫僧性命。唐僧说：贫僧的从人已是被怪食了。老叟用杖指说：那厢不是一匹马、两个包袱？",
        "唐僧回头看时，果是他的物件，并没有失落，心才略放下些。问老叟说：老公公，这里是甚所在？老叟说：此是双叉岭，原来虎狼巢穴处。唐僧说：贫僧鸡鸣时，出河州卫界，不料起得早了，冒霜拨露，忽失落此地。不想我是哪里有这大缘大分，感得老公公来此救我？唐僧非常感激，将包袱捎在马上，牵着缰绳，相随老叟径出了坑坎之中，走上大路。颂子云：我原来西天太白星，特来搭救你生灵。唐僧看了，对天礼拜说：多谢金星，度脱此难。唐僧孤身无策，只得放下身心，听天所命。又无奈那马腰软蹄弯，就跪下，伏倒在地，打又打不起，牵又牵不动。",
        "正在那不得命处，忽然见毒虫奔走，妖兽飞逃，猛虎潜踪，长蛇隐迹。你看他：头上戴一顶艾叶花斑豹皮帽，身上穿一领羊绒织锦叵罗衣，腰间束一条狮蛮带，脚下屣一对麂皮靴。悬一囊毒药弓矢，拿一杆点钢大叉。唐僧见他来得渐近，跪在路旁边，合掌高叫说：大王救命！那条汉到边前，放下钢叉，用手搀起说：唐僧休怕。唐僧说：贫僧是大唐驾下钦差，往西天拜佛求经的和尚。忽见太保来，众兽皆走，救了贫僧性命，多谢，多谢。伯钦说：我在这里住人，专倚打些狼虎为生，捉些蛇虫过活，故此众兽怕我走了。风响处，是个山猫来了，等我拿他家去管待你。",
        "三股叉擎天幌日，千花尾扰雾云飞。好男子，气不连喘，面不改色，对唐僧说：好运气，好运气。",
        "伯钦说：母亲呵，他是唐王驾下，差往西天见佛求经者。老妪听完，十分懽喜说：好，好，好。明日你父亲周忌，就浼唐僧做些好事，念卷经文，到后日送他去罢。听见母言，就要安排香纸，留住唐僧。小妖们排开桌凳，拿几盘烂熟虎肉，热腾腾的放在上面。伯钦听见此说，沉吟了半晌说：唐僧，寒家历代以来，不晓得吃素。唐僧说：太保不必多心，请自受用。唐僧说：感得太保天恩，搭救出虎狼丛里，就是饿死，也强如喂虎。伯钦的母亲闻说，叫说：孩儿不要与唐僧闲讲，我自有素物，可以管待。母亲说：你不要管我，我自有素的。那伯钦另设一处，铺排些没盐没酱的老虎肉、香獐肉、蟒蛇肉、狐狸肉、兔肉，点剁鹿肉干巴，满盘满碗的陪着唐僧吃斋。",
        "方坐下，心欲举箸，只见唐僧合掌诵经，吓得个伯钦不敢动箸，急起身站在旁边。唐僧说：此非是经，原来是一卷揭斋之咒。伯钦说：你们出家人，偏有许多计较，吃饭就也念诵念诵。伯钦引着唐僧出中宅，到后边走走。只见那四壁上挂几张强弓硬弩，插几壶箭；过梁上搭两块血腥的虎皮；墙根头插着许多枪刀叉棒；正中间设两张坐器。唐僧见这般凶险腌臜，不敢久坐，于是出了草亭。又见呼的一声，跑出十来只肥鹿，一大阵黄獐，见了人，呢呢痴痴，更不恐惧。唐僧说：这獐鹿想是太保养家了的？伯钦说：似你那长安城中人家，有钱的集财宝，有庄的集聚稻粮。",
        "伯钦说：我也是那等一梦，与你一般。他两口子正欲去说，只见老母叫说：伯钦孩儿，你来，我与你说话。二人至前，老母坐在床上说：儿呵，我今夜得了个喜梦，梦见你父亲来家，说多亏了唐僧超度，已消了罪业，上中华富地，长者家去托生。夫妻们具呵呵大笑说：我与媳妇皆有此梦，正来告禀，不期母亲呼唤，也是此梦。于是叫一家大小起来，安排谢意，替他收拾马匹，都至前拜谢说：多谢唐僧超荐我亡父脱难超生，报答不尽。唐僧说：贫僧有何能处，敢劳致谢？伯钦把三口儿的梦话对唐僧陈诉一遍，唐僧也喜。一家儿又恳恳拜央，唐僧毕竟分文未受。"
      ],
      "14": [
        "那猴说：我是五百年前大闹天宫的齐天悟空，只因犯了诳上之罪，被佛祖压于这里。前者有个观音菩萨，领佛旨意，上东土寻取经人。我让他救我一救，他劝我再不要行凶，归依佛法，尽殷勤保护取经人，往西方拜佛，功成后自有好处。故此昼夜提心，晨昏吊胆，只等师父来救我脱身。唐僧听完，心里高兴极了说：你虽有此善心，又蒙菩萨教诲，愿入沙门，只是我又没斧凿，怎么救得你出？那猴说：不用斧凿，你但肯救我，我自出来也。那猴说：这山顶上有我佛如来的金字压帖，你只上山去将帖儿揭起，我就出来了。唐僧依言，回头央浼刘伯钦说：太保呵，我与你上山走一遭。",
        "那伯钦见悟空一心收拾要行，却转身对唐僧唱个喏说：唐僧，你幸这里收得个好徒，甚喜，甚喜。唐僧躬身作礼相谢说：多有拖步，感激非常。悟空拖将虎来说：师父略坐一坐，等我脱下他的衣服来，穿了走路。悟空说：师父不要管我，我自有处置。好猴王，把毫毛拔下一根，吹口仙气，叫：变！变作一把牛耳尖刀，从那虎腹上挑开皮，往下一剥，剥下个囫囵皮来。剁去了爪甲，打倒在地，割个四四方方一块虎皮。提起来，量了一量说：阔了一些，一幅可作两幅。路旁边揪了一条葛藤，紧紧束定，遮了下体说：师父，且去，且去。两个前进，唐僧在马上问：悟空，你才打虎的铁棒，如为什么不见？刚才变做一个绣花针儿模样，收在耳内矣。",
        "又问：才那虎见了你，怎么就不动动？悟空说：不瞒师父说，不要道是只虎，就是一条龙，见了我也不敢无礼。唐僧听见此言，愈加放怀无虑，策马前行。唐僧果策马而行，径奔人家，到了庄院前下马。悟空撇了行李，走上前，叫声：开门！看见悟空这般恶相，腰系着一块虎皮，好似个雷公模样，吓得脚软身麻，口出谵语说：鬼来了！唐僧近前搀住，叫说：老施主休怕。老者抬头，见了唐僧的面貌清奇，才立定，问：你是那寺里来的和尚，带这恶人上我门来？唐僧说：我贫僧是唐朝来的，往西天拜佛求经。老者说：你虽是个唐人，那个恶的却非唐人。",
        "唐僧听完，就下来有礼了说：老施主与贫僧是华宗。悟空说：师父，你是唐姓，怎么和他是华宗？唐僧说：我俗家也姓陈，原来是唐朝海州弘农郡聚贤庄人氏。只因我大唐太宗皇帝赐我做唐僧唐僧，指唐为姓，故名唐僧也。悟空说：老陈，左右打搅你家，我有五百多年不洗澡了，你可去烧些汤来，与我师徒们洗浴洗浴，一发临行谢你。那老人家就令烧汤拿盆，掌上灯火。悟空说：老陈，还有一事累你：有针线借我用用。悟空又有眼色，见师父洗浴，脱下一件白布短小直裰未穿，他就扯过来披在身上。唐僧说：徒弟，你不嫌残旧，那件直裰儿，你就穿了罢。",
        "剥了他的衣服，夺了他的盘缠，笑吟吟走将来说：师父请行，那贼已被我剿了。他虽是剪径的强徒，就是拿到官司，也不该死罪；你纵有手段，只可退他去就了，怎么就都打死？出家人扫地恐伤蝼蚁命，爱惜飞蛾纱罩灯。若到城市，倘有人一时冲撞了你，你也行凶，执着棍子乱打伤人，我可做得白客，怎能脱身？悟空说：师父，我若不打死他，他却要打死你哩。唐僧说：我这出家人宁死，决不敢行凶。悟空说：不瞒师父说，我五百年前，据花果山称王为怪的时节，也不知打死多少人。他见唐僧只管绪绪叨叨，按不住心头火发说：你既是这等，说我做不得和尚，上不得西天，不必恁般絮聒恶我，我回去就了。",
        "撇得那唐僧孤孤零零，点头自叹，悲怨不已说：这个家伙这等不受教诲，我但说他几句，他怎么就无形无影的直接回到去了？唐僧见他来得至近，慌忙牵马，立于右侧让行。那老母问：你是哪里来的唐僧，孤孤恓恓独行于此？唐僧说：弟子原来东土大唐奉差往西天拜活佛求真经者。老母说：西方佛原来大雷音寺天竺国界，此去有十万八千里路。唐僧说：弟子日前收得一个徒弟，他性泼凶顽，是我说了他几句，他不受教，于是渺然而去也。老母说：我有这一领绵布直裰、一顶嵌金花帽，原是我儿子用的，他只做了三日和尚，不幸命短身亡。我才去他寺里哭了一场，辞了他师父，将这两件衣、帽拿来，做个忆念。",
        "龙王说：悟空自当裁处，不可图自在，误了前程。悟空说：不要多话，我还去保他就了。龙王忻喜说：既如此，不敢久留，请悟空早发慈悲，不要疏久了你师父。悟空见他催促请行，急纵身，出离海藏，驾着云，别了龙王。菩萨说：孙悟空，你怎么不受教诲，不保唐僧，来这里何干？慌忙个悟空在云端里施礼说：向蒙菩萨善言，果然有唐朝僧到，揭了压帖，救了我命，跟他做了徒弟。菩萨说：赶早去，不要错过了念头。这悟空过了一会儿看见唐僧在路旁边闷坐。悟空说：我往东洋大海老龙王家讨茶吃吃。唐僧说：徒弟呵，出家人不要说谎。你离了我没多一个时辰，就说到龙王家吃茶？",
        "唐僧说：不用化斋，我那包袱里还有些干粮，是刘太保母亲送的。你去拿钵盂寻些水来，等我吃一些走路罢。悟空去解开包袱，在那包裹中间见有几个粗面烧饼，拿出来递与师父。唐僧就顺口儿答应说：是我小时穿戴的。悟空说：好师父，把与我穿戴了罢。悟空于是脱下旧白布直裰，将绵布直裰穿上，也就是比量着身体裁的一般。唐僧见他戴上帽子，就不吃干粮，却默默的念那紧箍咒一遍。那师父不住的又念了几遍，把个悟空痛得打滚，抓破了嵌金的花帽。唐僧又恐怕扯断金箍，住了口不念。唐僧又恐怕他捎断了，口中又念起来。悟空说：我这头，原来是师父咒我的？"
      ],
      "15": [
        "按落云头，报说：师父，我们的马断乎O那龙吃了，四下里再看不见。唐僧说：徒弟呀，那个家伙能有多大口，却将那匹大马连鞍辔都吃了？像那千里之内，蜻蜓儿展翅，我也看见，何期那匹大马，我就不见？唐僧说：既是他吃了，我怎么前进？悟空见他哭将起来，他哪里忍得住暴燥，发声喊说：师父不要这等脓包形么，你坐着，坐着，等我去寻着那个家伙，让他还我马匹就了。唐僧却才扯住说：徒弟呵，你哪里去寻他？悟空听见这话，越加嗔怒，就叫喊如雷说：你忒不济，不济！哏哏的吆喝，正难息怒，只听得空中有人言语，叫说：孙悟空不要恼，唐僧休哭。",
        "好猴王，束一束绵布直裰，撩起虎皮裙子，揝着金箍铁棒，抖擞精神，径临涧壑，半云半雾的，在那水面上高叫说：泼泥鳅，还我马来！再说那龙吃了唐僧的白马，伏在那涧底中间，潜灵养性，只听得有人叫骂索马。他按不住心中火发，急纵身跃浪翻波，跳将上来说：是那个敢在这里海口伤我？悟空见了他，大一声休走，还我马来！悟空没及奈何，只得回见唐僧说：师父，这个怪被我骂将出来，他与我赌斗多时，怯战而走，只躲在水中间，再不出来了。唐僧说：不知端的可是他吃了我马？悟空说：你看你说的话，不是他吃了，他还肯出来招声，与我犯对？唐僧说：你前日打虎时，曾说有降龙伏虎的手段，今日怎么就不能降他？",
        "那龙说：你的马是我吞下肚去，怎么吐得出来？悟空道不还马时看棍，只打杀你，偿了我马的性命就罢。斗不数合，小龙委实难搪，将身一幌，变作一条水蛇儿，钻入草科中去了。急得他三尸神咋，七窍烟生，念了一声唵字咒语，就唤出当坊土地、本处山神，一齐来跪下说：山神 、土地来见。悟空说：伸过孤拐来，各打五棍见面，与我散散心。二神磕头哀告说：望悟空方就，容小神诉告。二神说：悟空一向久困，小神不知几时出来，所以没有接得，还请恕罪。我问你：鹰愁涧里，是那方来的怪龙？二神说：悟空自来没有有师父，原来是个不伏天不伏地混元上真，怎么得有什么师父的马来？",
        "那菩萨降莲台，径离仙洞，与揭谛驾着祥光，过了南海而来。那菩萨与揭谛不多时到了蛇盘山，却在那半空里留住祥云，低头观看，只见悟空正在涧边叫骂。那揭谛按落云头，不经由唐僧，直至涧边，对悟空说：菩萨来也。悟空听见，急纵云跳到空中，对他大叫说：你这个七佛之师，慈悲的教主，你怎么生方法儿害我？菩萨说：我把你这个大胆的马流，村愚的赤尻。我倒再三尽意，度得个取经人来，叮咛让他救你性命，你怎么不来谢我活命之恩，反来与我嚷闹？你前日在海上迎着我，伤了我几句，让我来尽心竭力，伏侍唐僧就罢了，你怎么送他一顶花帽，哄我戴在头上受苦？",
        "菩萨叫揭谛说：你去涧边叫一声敖闰龙王玉龙三太子，你出来，有南海菩萨在此。那小龙翻波跳浪，跳出水来，变作一个人像，踏了云头，到空中对菩萨礼拜说：向蒙菩萨解脱活命之恩，在此久等，更不闻取经人的音信。菩萨指着悟空说：这不是取经人的大徒弟？小龙见了说：菩萨，这是我的对头。悟空说：你又没有问我姓甚名谁，我怎么就说？小龙说：我没有问你是哪里来的泼魔？你嚷说：管什么哪里不哪里，只还我马来。菩萨说：那猴头专倚自强，那肯称赞别人？若问时，先提起取经的字来，却也不用劳心，自然拱伏。菩萨上前，把那小龙的项下明珠摘了，将杨柳枝蘸出甘露，往他身上拂了一拂，吹口仙气，喝声叫：变！",
        "悟空说：菩萨此时已到南海，不耐烦矣。悟空喝退了山神、土地，吩咐了揭谛、功曹，却请师父上马。唐僧说：那无鞍辔的马，怎生骑得？悟空见了，用手招呼说：那老渔，你来，你来。唐僧教悟空解开包袱，拿出大唐的几文钱钞，送与老渔。老渔把子一篙撑开说：不要钱，不要钱。悟空说：师父休致意了，你不认得他？只如今免打就勾了他的，怎敢要钱！那师父也似信不信，只得又跨着产马，随着悟空，径投大路，奔西而去。唐僧在马上遥观，忽见路旁边一座庄院。悟空抬头看见说：师父，不是人家庄院。悟空说：人家庄院，却没飞鱼稳兽之脊，这断是个庙宇庵院。",
        "唐僧下了马，只见那门上有三个大字，原来里社祠，于是入门里。唐僧慌忙答礼，上殿去参拜了圣像。茶罢，唐僧问老者说：此庙何为里社？每遇春耕、夏耘、秋收、冬藏之日，各办三牲花果，来此祭社，以保四时清吉、五谷丰登、六畜茂盛故也。唐僧说：贫僧是东土大唐国，奉旨意，上西天拜佛求经的。悟空的眼乖，见他房檐下有一条搭衣的绳子，走将去，一把扯断，将马脚系住。悟空怒说：你那老头子，说话不知高低。老人家笑说：不是偷的，怎么没有鞍辔缰绳，却来扯断我晒衣的索子？唐僧陪礼说：这个顽皮，只是性燥。──你要拴马，好生问老人家讨条绳子，怎么就扯断他的衣索？",
        "只听得半空中有人言语说：圣僧，多简慢你。我是落伽山山神、土地，蒙菩萨差送鞍辔与你们的。慌忙个唐僧滚鞍下马，望空礼拜说：弟子肉眼凡胎，不识尊神尊面，望乞恕罪。路旁边活活的笑倒个孙悟空，孜孜的喜坏个美猴王，上过来扯住唐僧说：师父，你起来罢，他已去得远了，听不见你祷祝，看不见你磕头，只管拜怎么？唐僧说：徒弟呀，我这等磕头，你也就不拜他一拜，且站在旁边，只管哂笑，是何道理？悟空说：你哪里知道，像他这个藏头露尾的，本该打他一顿；只为看菩萨面上，饶他打，尽勾了，他还敢受我之拜？唐僧说：不敢当子，不要说这空头话。"
      ],
      "16": [
        "唐僧见了，侍立门旁边，道个行礼问候。唐僧说：我弟子原来东土钦差，上雷音寺拜佛求经。那和尚忽见悟空相貌，有些害怕，就问：那牵马的是个什么东西？他的性急，若听见你说是什么东西，他就恼了。那和尚打了个寒噤，咬着指头说：这般一个丑头怪脑的，好招他做徒弟？唐僧说：你看不出来哩，丑自丑，甚是有用。那和尚只得同唐僧与悟空进了山门。唐僧又大喜说：弟子屡感菩萨圣恩，未及叩谢。今遇禅院，就如见菩萨一般，甚好拜谢。那和尚听完，就命道人开了殿门，请唐僧朝拜。那悟空拴了马，丢了行李，同唐僧上殿。唐僧展背舒身，铺胸纳地，望金像磕头。",
        "唐僧躬身施礼迎接说：老院主，弟子拜揖。老僧说：适间小妖们说，东土唐朝来的老爷，我才出来奉见。唐僧说：轻造宝山，不知好歹，恕罪，恕罪。因问：老爷，东土到此，有多少路程？唐僧说：出长安边界，有五千余里。悟空听见说：这还是我万代孙儿哩。唐僧瞅了他一眼说：谨言，不要不识高低，冲撞人。那和尚就问：老爷，你有多少年纪了？有一个小幸童，拿出一个羊脂玉的盘儿，有三个法蓝镶金的茶钟。唐僧见了，夸爱不尽说：好物件，好物件，真是美食美器。唐僧说：可怜，我那东土无甚宝贝；悟空在旁边说：师父，我前日在包袱里，曾见那领袈裟，不是件宝贝？",
        "悟空一一观之，都是些穿花纳锦，刺绣销金之物，笑说：好，好，好。唐僧把悟空扯住，悄悄的说：徒弟，不要与人斗富。悟空说：放心，放心，都在我身上。去了纸，拿出袈裟，抖开时，红光满室，彩气盈庭。那老和尚见了这般宝贝，果然动了奸心，走上前，对唐僧跪下，眼中垂泪说：我弟子真是没缘。他说：老爷这件宝贝才展开，天色晚了，奈何眼目昏花，不能看得明白，岂不是无缘？老僧说：老爷若是宽恩放心，教弟子拿到后房，细细的看一夜，明早送还老爷西去，不知意思何如？唐僧听说，吃了一惊，埋怨悟空说：都是你，都是你。那唐僧阻当不住，他把袈裟递与老僧说：凭你看去。",
        "老僧说：我虽是坐家自在，乐乎晚景，却不得他这袈裟穿穿。老僧说：纵然留他住了年载，也只穿得年载，到底也不得气长。正说话处，有一个小和尚，名唤广智，出头说：公公要得长远，也容易。老僧听完，就欢喜起来说：我儿，你有什么高见？广智说：那唐僧两个是走路的人，辛苦之甚，如今已睡着了。老和尚见说，心里高兴极了，却才揩了眼泪说：好，好，好，此计绝妙。内中又有一个小和尚，名唤广谋，就是那广智的师弟，上过来说：此计不妙。广谋说：依小孙之见，如今唤聚东山大小房头，每人要干柴一束，舍了那三间禅堂，放起火来，让他欲走无门，连马一火焚之。",
        "他就一骨鲁跳起，欲要开门出看，又恐惊醒师父。你看他弄个精神，摇身一变，变做一个蜜蜂儿。穿花度柳飞如箭，粘絮寻香似落星。悟空暗笑说：果依我师父之言，他要害我们性命，谋我的袈裟，故起这等毒心。我待要拿棍打他呵，可怜又不禁打，一顿棍都打死了，师父又怪我行凶。吓得个庞、刘、苟、毕躬身，马、赵、温、关控背，一起说：不好了，不好了！说不了，却遇天王早到，迎着悟空说：久阔，久阔。前听见观音菩萨来见玉帝，借了四值功曹、六丁六甲并揭谛等，保护唐僧往西天取经去，说你与他做了徒弟，今日怎么得闲到此？唐僧路遇歹人，放火烧他，事在万分紧急，特来寻你借辟火罩儿，救他一救。",
        "再说悟空取了辟火罩，一筋斗送上南天门，交与广目天王说：谢借，谢借。天王说：许久不面，请到宫少坐一时，何如？悟空说：我比在前不同，烂板凳，高谈阔论了；径来到禅堂前，摇身一变，变做个蜜蜂儿，飞将进去，现了本像看时，那师父还沉睡哩。悟空叫说：师父，天亮了，起来罢。悟空说：你还做梦哩，今夜走了火的。悟空说：是我护了禅堂，见师父浓睡，没有惊动。唐僧说：你有本事护了禅堂，怎么就不救别房之火？悟空笑说：好教师父得知：果然依你昨日之言，他爱上我们的袈裟，算计要烧杀我们。唐僧听完，害怕说：是他们放的火么？",
        "唐僧才牵着马，悟空挑了担，出了禅堂，径往后方丈去。再说那些和尚正悲切间，忽的看见他师徒牵马挑担而来，吓得一个个魂飞魄散说：冤魂索命来了。和尚们一齐跪倒，磕头说：爷爷呀，冤有冤家，债有债主。要索命不干我们事，都是广谋与老和尚定计害你的，不要问我们讨命。悟空咄的一声说：我把你这些该死的畜生，那个问你讨什么命。其间有两个胆量大的和尚说：老爷，你们在禅堂里已烧死了，如今又来讨袈裟，端的还是人，是鬼？悟空笑说：这伙孽畜，哪里有什么火来？众人悚惧，才认得唐僧是种神僧，悟空是尊护法。一齐上前磕头说：我们有眼无珠，不识真人下界。",
        "唐僧心中烦恼，懊恨悟空不尽，却坐在上面念动那咒。悟空扑的跌倒在地，抱着头，十分难禁，只吩咐：不要念，不要念，管寻还了袈裟。那和尚们见了，一个个战兢兢的，上前跪下劝解，唐僧才合口不念。悟空一骨鲁跳起来，耳朵里抽出出铁棒，要打那些和尚，被唐僧喝住说：这猴头，你头痛还不怕，还要无礼？休动手，且不要伤人，再与我审问一问。和尚们们磕头礼拜，哀告唐僧说：老爷饶命。他昨晚看着你的袈裟，只哭到更深时候，看也没有敢看，思量要图长久，做个传家之宝，设计定策，要烧杀老爷。自火起之候，狂风大作，各人只顾救火，搬抢物件，更不知袈裟去向。"
      ],
      "17": [
        "话说悟空一筋斗跳将起去，吓得那观音院大小和尚并头陀、幸童、道人等一个个朝天礼拜说：爷爷呀，原来是腾云驾雾的神圣下界，怪道火不能伤。这去寻着袈裟，万事皆休；但恐找寻不着，我那徒弟性子有些不好，你们性命不知怎么，恐一人不能脱也。和尚们听见此言，一个个提心吊胆，告天许愿，只要寻得袈裟，各全性命暂且不说。再说孙悟空到空中，把腰儿扭了一扭，早来到黑风山上。那悟空正观山景，忽听得芳草坡前，有人言语。正说中间，那黑汉笑说：后日是我母难之日，二公可光顾光顾。白衣秀士说：年年与大王上寿，今年岂有不来之理？",
        "小妖急急跑到里面，报说：大王，佛衣会做不成了，门外有一个毛脸雷公嘴的和尚来讨袈裟哩。那黑汉被悟空在芳草坡前赶将来，却才关了门，坐还未稳，又听得那话，心中暗想说：这个家伙不知是哪里来的，这般无礼，他敢嚷上我的门来。悟空暗笑说：这个家伙真个如烧的一般，筑煤的无二，想必是在这里刷炭为生，怎么这等一身乌黑？那妖怪大声说：你是个什么和尚，敢在我这里大胆？悟空执铁棒，撞至面前，大一声说：不要闲讲，快还你老外公的袈裟来。悟空说：我的袈裟在直北观音院后方丈里放着，只因那院里失了火，你这个家伙趁哄掳掠，盗了来，要做佛衣会庆寿，怎敢抵赖？",
        "刀砍锤敲不得坏，又教雷打火来烧。日满开炉我跳出，手持铁棒遶天跑。整整压该五百载，幸逢唐僧出唐朝。你去乾坤四海问一问，我是历代驰名第一妖。那妖怪听完笑说：你原来是那闹天宫的弼马温么？悟空最恼的是人叫他弼马温，听见这一声，心中大怒，骂说：你这贼怪！那黑汉侧身躲过，绰长枪，劈手来迎。那妖怪与悟空斗了十数回合，不分胜负，渐渐红日当午。那黑汉举枪架住铁棒说：悟空，咱两个且收兵，等我进了膳来，再与你赌斗。不要推故，休走，还我袈裟来，方让你去吃饭。再说悟空攻门不开，也只得回观音院。",
        "唐僧说：自你去了这半日，我已吃过了三次茶汤，两餐斋供了，他具没有敢慢我。悟空说：不要忙，既有下落，管情抓住这个家伙，还你原物。悟空度他匣内必有什么柬札，举起棒，劈头一下，可怜不禁打，就打得似个肉饼一般。夜观回禄之难，有失救护，谅仙机必无他害。悟空见了，呵呵大笑说：那个老剥皮，死得他一毫儿也不亏，他原来与妖精结党。我还记得他的模样，等我就变做那和尚，往他洞里走走，看我那袈裟放在哪里。好悟空，念动咒语，迎着风一变，果然就像那老和尚一般。那小妖开了门，见是这般模样，急转身报说：大王，金池唐僧来了。",
        "悟空说：正来进拜，不期路遇华翰，见有佛衣雅会，故此急急奔来，愿求见见。这袈裟本是唐僧的，他在你处住锡，你岂没有看见，反来就我看看？悟空说：贫僧借来，因夜晚还没有展看，不期被大王取来。那唐僧的徒弟又有些骁勇，乱忙中，四下里都寻觅不见。正讲处，只见有一个巡山的小妖来报说：大王，祸事了，下请书的小校被悟空打死在大路旁边，他绰着经儿，变化做金池唐僧，来骗佛衣也。那妖怪听完，暗说：我说那唐僧怎么今日就来，又来得迅速，果然是他。好杀：那猴王胆大充和尚，这黑汉心灵隐佛衣。语去言来机会巧，随机应变不差池。",
        "悟空却无计策奈何，只得也回观音院里，按落云头，道声：师父。那唐僧眼儿巴巴的正望他哩，忽见到了面前，甚喜；又见他手里没有袈裟，又惧。悟空袖中拿出个简帖儿来，递与唐僧说：师父，那妖怪物与这死的老剥皮原是朋友。是我就把那小妖打死，变做那老和尚，进他洞去，骗了一钟茶吃。正坐间，忽被一个什么巡山的走了风信，他就与我打将起来。悟空说：我也硬不多儿，只战个手平。唐僧才看了简帖，又递与那院主说：你师父敢不要也是妖精么？那院主慌忙跪下说：老爷，我师父是人。悟空说：这伙和尚没甚妖气，他一个个头圆顶天，足方履地，但比我肥胖长大一些，非妖精也。",
        "这悟空观不尽那异景非常，一直按云头，到竹林之下。早有诸天迎接说：菩萨前者对众言悟空归善，甚是宣扬。悟空说：我师父路遇你的禅院，你受了人间香火，容一个黑熊精在哪里邻住，着他偷了我师父袈裟，屡次取讨不与，今特来问你要的。既是熊精偷了你的袈裟，你怎来问我取讨？都是你这个孽猴大胆，将宝贝卖弄，拿与小人看见，你却又行凶，唤风发火，烧了我的留云下院，反来我处放刁。悟空见菩萨说出这话，知他晓得过去未来之事，慌忙礼拜说：菩萨，乞恕弟子之罪，果是这般这等。但恨那妖怪物不肯与我袈裟，师父又要念那话儿咒语，我忍不得头疼，故此来拜烦菩萨。",
        "菩萨认定，拿了那个玻璃盘儿，径到妖洞门口看时，果然是：崖深岫险，云生岭上；柏苍松翠，风飒林间。菩萨看了，心中暗喜说：这孽畜占了这座山洞，却是也有些道分。走到洞口，只见守洞小妖都有些认得说：凌虚仙长来了。那妖早已迎出门说：凌虚，有劳仙驾珍顾，蓬荜有辉。菩萨说：小道敬献一粒仙丹，敢称千寿。菩萨不答，连忙拿丹盘说：大王，且见小道鄙意。觑定一粒大的，推与那妖说：愿大王千寿。那妖亦推一粒，递与菩萨说：愿与凌虚子同之。菩萨又怕那妖无礼，却把一个箍儿丢在那妖头上。那妖起来，提枪要刺，悟空、菩萨早已起在空中，将真言念起。"
      ],
      "18": [
        "悟空辞了菩萨，按落云头，将袈裟挂在香柟树上，抽出出棒来，打入黑风洞里，那洞里那得一个小妖。原来是他见菩萨出现，降得那老怪就地打滚，急急都散走了。悟空一发行凶，将他那几层门上都积了干柴，前前后后，一齐发火，把个黑风洞烧做个红风洞，却拿了袈裟，驾祥光，转回直北。话说那唐僧望悟空急忙不来，心甚疑惑：不知是请菩萨不至，不知是悟空托故而逃。正在那胡猜乱想之中，只见半空中彩雾灿灿，悟空忽坠阶前跪说：师父，袈裟来了。和尚们亦无不欢悦说：好了，好了，我们性命今日才得全了。唐僧接了袈裟说：悟空，你早间去时，原约到饭罢晌午，怎么此时日西方回？悟空将那请菩萨施变化降妖的事情，备陈了一遍。",
        "悟空看完说：师父请行，定是一村好人家，正可借宿。我问你一个信儿：这里是什么地方？那个人只管苦挣，口里嚷说：我庄上没人，只是我好问信？那人挣不脱手，气得乱跳说：蹭蹬，蹭蹬。悟空说：你有本事，劈开我的手，你就就去了也罢。气得他丢了包袱，撇了伞，两只手雨点似来抓悟空。悟空把一只手扶着行李，一只手抵住那人，凭他怎么支我，只是不能抓着。你再问那人就是，只管扯住他怎么？悟空笑说：师父不知，若是问了别人没趣，须是问他，才有买卖。那人被悟空扯住不放，只得说出说：这里原来是乌斯藏国界之地，唤做高老庄。悟空又说：你这样行装，不是个走近路的。",
        "我太公不悦，说说：女儿招了妖精，不是长法：一则败坏家门，二则没个亲家来往。我太公与了我几两银子，让我寻访法师，拿那妖怪。不期撞着你这个纥刺星扯住，误了我走路，故此里外受气，我无奈，才与你叫喊。不想你又有些拿法，我挣不过你，所以说此实情。悟空说：你的好运气，我有营生，这才是凑四合六的勾当。我们不是那不济的和尚，脓包的道士，其实有些手段，惯会拿妖。烦你回去上覆你那家主，说我们是东土驾下差来的唐僧圣僧，往西天拜佛求经者，善能降妖缚怪。我是一肚子气的人，你错哄了我，没甚手段，拿不住那妖精，却不又带累我来受气？",
        "那人也无计奈何，真个提着包袱，拿了伞，转步回身，领他师徒到于门首说：二位唐僧，你且在马台上略坐坐，等我进去报主人知道。悟空才放了手，落担牵马，师徒们坐立门旁边等候。高才放下包、伞说：上告主人公得知：小人才行出街口，忽撞见两个和尚：一个骑马，一个挑担。他却十分欢喜，要与我们拿那妖怪哩。高才说：他说是东土驾下差来的唐僧圣僧，前往西天拜佛求经的。太公说：既是远来的和尚，怕不真有些手段。那太公就忙换了衣服，与高才出来迎接，叫声：唐僧。唐僧听见，急转身，早已到了面前。那老者戴一顶乌绫巾，穿一领葱白蜀锦衣，踏一双糙米皮的犊子靴，系一条黑绿绦子，出来笑语相迎，就叫：二位唐僧，作揖了。",
        "这悟空见请，才牵了白马，教高才挑着行李，与唐僧进去。那高老说：这个小唐僧，倒也家怀。悟空说：你若肯留我住得半年，还家怀哩。坐好，高老问：适间小价说，二位唐僧是东土来的？高老说：二位原是借宿的，怎么说会拿怪？悟空说：因是借宿，顺就拿几个妖怪儿耍耍的。还吃得有多少哩，只这一个妖怪女婿，已被他磨慌了。悟空说：你把那妖怪的始末，有多大手段，从头儿说说我听，我好替你拿他。高老说：我们这庄上，自古至今，也不晓得有什么鬼祟魍魉，邪魔作耗。高老说：初来时是一条黑胖汉，后来就变做一个长嘴大耳朵的八戒，脑后又有一溜鬃毛，身体粗糙怕人，头脸就像个猪的模样。",
        "因此知他是个妖怪，要请个法师与他去退去退。高老大喜说：我为招了他不打紧，坏了我多少清名，疏了我多少亲眷。老人家说：二位只是那根锡杖，锡杖怎么打得那个妖精？悟空随于耳内拿出一个绣花针来，捻在手中，迎风幌了一幌，就是碗来粗细的一根金箍铁棒，对着高老说：你看这条棍子，比你家兵器怎么？悟空说：我不用人，只是要几个年高有德的老人家，陪我师父清坐闲叙，我好撇他而去。等我把那妖精拿来，对众取供，替你除了根罢。一时都到，相见已毕，悟空说：师父，你放心稳坐，我去也。你看他揝着铁棒，扯着高老说：你引我去后宅子里妖精的住处看看。",
        "悟空说：老高，你去叫你女儿一声，看他可在里面？那女儿认得是他父亲的声音，才少气无力的应了一声说：爹爹，我在这里哩。悟空闪金睛，向黑影里仔细看时，你道他怎生模样？多时，一阵风来，真个是走石飞砂。悟空忽然叹口气，道声：好运气低了。我得到了你家，虽是吃了些茶饭，却也没有白吃你的：我也曾替你家扫地通沟 、搬砖运瓦、筑土打墙、耕田耙地、种麦插秧、创家立业。如今你身上穿的锦，戴的金，四时有花果享用，八节有蔬菜烹煎，你还有那一些不趁心处，这般短叹长吁，说什么好运气低了？今日我的父母隔着墙，丢砖料瓦的，甚是打我骂我哩。",
        "他若再来问你，你就以此话与他说就了。悟空暗喜说：那妖怪却也老实，不用动刑，就供得这等明白。那妖怪笑说：睡着，睡着，不要睬他。我有天罡数的变化，九齿的钉钯，怕什么法师、和尚、道士？就是你老子有虔心，请下九天荡魔祖师下界，我也曾与他做过相识，他也不敢怎么我。悟空说：他说请一个五百年前大闹天宫姓孙的齐天悟空，要来拿你哩。那妖怪听见这个名头，就有三分害怕说：既是这样看来，我去了罢，两口子做不成了。那妖怪说：你不知道，那闹天宫的弼马温有些本事，只恐我弄他不过，低了名头，不像模样。被悟空一把扯住，将自己脸上抹了一抹，现出原身，喝说：好妖怪，哪里走！"
      ],
      "19": [
        "再说那妖怪的火光前走，这悟空的彩霞随后。正行处，忽见一座高山，那妖怪把红光结聚，现了本相，撞入洞内，拿出一柄九齿钉钯来战。那妖怪说：是你也不知我的手段，上过来站稳着，我说与你听。功圆行满却飞升，天仙对对来迎接。",
        "再三再四不依从，东躲西藏心不悦。押赴灵霄见玉皇，依律问成该处决。悟空听完说：你这个家伙原来是天蓬水神下界，怪道知我名号。悟空怎肯容情，举起棒，当头就打。好杀：悟空金睛似闪电，妖魔环眼似银花。金箍棒，九齿钯，两个英雄实可夸：一个是悟空临凡世，一个是元帅降天涯。",
        "悟空在这洞门外看有一座石碑，上书云栈洞三字。见那妖怪不出，天又大明，心却思量：恐师父等候，且回去见他一见，再来捉此怪不迟。再说唐僧与那诸老谈今论古，一夜无眠。正想悟空不来，只见天井里忽然站下悟空。慌忙那诸老一齐下拜，谢说：多劳，多劳。唐僧问：悟空，你去这一夜，拿得妖精在哪里？悟空说：师父，那妖不是凡间的邪祟，也不是山间的怪兽。是我从后宅里抽出棒就打，他化一阵狂风走了。被我着风一棒，他就化道火光，径转他那本山洞里，拿出一柄九齿钉钯，与我战了一夜。我还要打开那门，与他见个好歹，恐师父在此疑虑盼望，故先来回个信息。",
        "唐僧说：悟空，你既是与他做了一场，一发与他做个结局，才见始终。此去一定拿来与你们看，且不要忧愁。说声去，就无形无影的，跳到他那山上，来到洞口，一顿铁棍，把两扇门打得粉碎。口里骂说：那糠的夯货，快出来与我打么。那妖怪正喘嘘嘘的睡在洞内，听见打得门响，又听见骂糠的夯货，他却恼怒难禁，只得拖着钯，抖擞精神，跑将出来，厉声骂说：你这个弼马温，着实惫懒。你且去看看律条，打进大门而入，该个杂犯死罪哩。像你强占人家女子，又没个三媒六证，又无些茶红酒礼，该问个真犯斩罪哩。那妖怪说：且休闲讲，看八戒这钯。",
        "悟空听完，收了铁棒说：八戒不要说嘴，我把这头伸在哪里，你且筑一下儿，看可能魂消气泄？那妖怪真个举起钯，着气力筑将来，扑的一下，钻起钯的火光焰焰，更没有筑动一一些头皮。又被那太上老君拿了我去，放在八卦炉中，将神火锻炼，炼做个火眼金睛，铜头铁臂。那妖怪说：你这猴子，我记得你闹天宫时，家住在东胜神洲傲来国花果山水帘洞里，到如今久不闻名，你怎么来到这里，上门子欺我？因是我改邪归正，弃道从僧，保护一个东土大唐驾下唐僧，叫做唐僧法师，往西天拜佛求经，路过高庄借宿，那高老人家因话说起，就请我救他女儿，拿你这糠的夯货。那妖怪一闻此言，丢了钉钯，唱个大喏说：那取经人在哪里？",
        "却又揪着耳朵，拉着他，叫：快走，快走。那妖怪说：轻着一些，你的手重，揪得我耳根子疼。悟空拑着他的钯，揪着他的耳说：你看那厅堂上端坐的是谁？那妖怪走上前，双膝跪下，背着手，对唐僧磕头，高叫说：师父，弟子没有远迎。唐僧说：悟空，你怎么降得他来拜我？悟空才放了手，拿钉钯柄儿打着，喝说：八戒，你说么。那妖怪把菩萨劝善事情，细陈了一遍。师徒们宴罢，老高将一红漆丹盘，拿出二百两散碎金银，奉三位唐僧为途中之费；悟空近前，抡开手抓了一把，叫：高才，昨日累你引我师父，今日招了一个徒弟，无物谢你，把这些碎金碎银，权作带领钱，拿了去买草鞋穿。",
        "老高又说：师父们既不受金银，望将这粗衣笑纳，聊表寸心。唐僧又说：我出家人，若受了一丝之贿，千劫难修。八戒在旁边说：师父、师兄，你们不要就罢，我与他家做了这几年女婿，就是挂脚粮也该三石哩。那八戒摇摇摆摆，对高老唱个喏说：上覆丈母、 大姨、二姨并姨夫、姑舅诸亲：我今日去做和尚了，不及面辞，休怪。八戒说：不是胡说，只恐一时间有一些差池，却不是和尚误了做，老婆误了娶，两下里都耽搁了？唐僧说：少题闲话，我们赶早儿去来。于是此收拾了一担行李，八戒担着；唐僧停鞭勒马说：悟空、悟能，前面山高，须索仔细仔细。",
        "禅师惊问：你是福陵山猪刚鬣，怎么有此大缘，得与圣僧同行？八戒说：前年蒙观音菩萨劝善，愿随他做个徒弟。悟空笑说：这老禅怎么认得他，倒不认得我？唐僧再拜：请问西天大雷音寺还在哪里？唐僧殷勤致意，再问：路途果然有多远？禅师说：路途虽远，终须有到之日，却只是魔瘴难消。唐僧拜伏于地恳求，那禅师于是口诵传之。经云：摩诃般若波罗蜜多心经》：观自在菩萨，行深般若波罗蜜多，时照见五蕴皆空，度一切苦厄。是故空中无色，无受想行识，无眼耳鼻舌身意，无色声香味触法，无眼界，原来至无意识界，无无明，亦无无明尽。故说般若波罗蜜多咒，就说咒说：揭谛揭谛，波罗揭谛，波罗僧揭谛，菩提萨婆诃！"
      ],
      "20": [
        "唐僧说：悟空，你看那日落西山藏火镜，月升东海现冰轮。八戒说：说得是，我八戒也有些饿了，且到人家化些斋吃，有力气，好挑行李。悟空说：这个恋家鬼，你离了家几日，就生报怨。八戒说：哥呵，比不得你这喝风呵烟的人。唐僧听见这话说：悟能，你若是在家心重呵，不是个出家的了，你还回去罢。那八戒慌忙跪下说：师父，你不要听师兄之言，他有些赃埋人。师父呵，我受了菩萨的戒行，又承师父怜悯，情愿要伏侍师父往西天去，誓无退悔。那八戒纵身跳起，口里絮絮叨叨的，挑着担子，只得死心塌地，跟着过来。唐僧下马，悟空接了缰绳，八戒歇了行李，都伫立绿荫之下。",
        "十分你家窄狭，没处睡时，我们在树底下，好道也坐一夜，不打搅你。那老者扯住唐僧说：师父，你倒不言语，你那个徒弟，那般拐子脸别颏腮，雷公嘴，红眼睛，一个痨病魔鬼，怎么反冲撞我这年老之人？悟空笑说：你这个老人家，忒也没眼色。悟空说：不敢夸言，也将就看得过。悟空说：我祖贯东胜神洲海东傲来国花果山水帘洞居住。倘若家里有什么丢砖打瓦、锅叫门开，我就能安镇。那老人家听得这篇言语，哈哈笑说：原来是个撞头化缘的熟嘴儿和尚。那老人家说：若是你不辛苦，不懒说话，好道活活的聒杀我。悟空指着说：这老人家眼花，那绿荫下站的不是？",
        "慌忙那唐僧满口招呼说：不要怕，不要怕。那老人家才出了门，搀着妈妈说：婆婆起来，少要惊恐。唐僧却坐在他门楼里竹床之上，埋怨说：徒弟呀，你两个相貌既丑，言语又粗，把这一家儿吓得七损八伤，都替我身造罪哩。八戒说：不瞒师父说，八戒自从跟了你，这些时俊了许多哩。悟空笑说：八戒不要乱说，把那丑也收拾起些。唐僧说：你看悟空说的话，相貌是生成的，你让他怎么收拾？悟空说：把那个耙子嘴揣在怀里，不要拿出来；把那蒲扇耳贴在后面，不要摇动：这就是收拾了。那八戒真个把嘴揣了，把耳贴了，拱着头，立于左右。悟空将行李拿入门里，将白马拴在桩上。",
        "悟空说：这个糠的，好道撞着饿鬼了。那老王倒也知趣，见他吃得快，说：这个唐僧，想着实饿了，快添饭来。那八戒真个食肠大，看他不抬头，一连就吃有十数碗。老王说：仓卒无殽，不敢苦劝，请再进一箸。八戒说：老人家滴答甚么，谁和你发课，说什么五爻六爻？八戒一顿，把他一家子饭都吃得罄尽，还只说才得半饱。次日天晓，悟空去背马，八戒去整担。老者说：此去倘路间有甚不虞，是必还来茅舍。唐僧马到临崖，斜挑宝观看，果然那：高的是山，峻的是岭；陟的是崖，深的是壑；响的是泉，鲜的是花。草里飞禽扑轳轳起，林中走兽掬行。",
        "八戒上前一把扯住悟空说：师兄，十分风大，我们且躲一躲儿干净。风大时就躲，倘或亲面撞见妖精，怎么是好？八戒说：哥呵，你没有听见避色如避仇，避风如避箭哩？悟空说：且不要言语，等我把这风抓一把来闻一闻看。八戒笑说：师兄又扯空头谎了，风又好抓得过来闻？悟空说：兄弟，你不知道我有个抓风之法。好悟空，让过风头，把那风尾抓过来闻了一闻，有些腥气。说：果然不是好风，这风的味道不是虎风，定是怪风，断乎有些蹊跷。说不了，只见那山坡下剪尾跑蹄，跳出一只斑斓猛虎。慌忙那唐僧坐不稳雕鞍，翻根头跌下白马，斜倚在路旁边，真个是魂飞魄散。",
        "那妖怪见他赶得至近，却又抠着胸膛，剥下皮来，苫盖在那卧虎石上，脱真身，化一阵狂风，直接回到路口。可怜那唐僧呵，江流注定多磨折，寂灭门中功行难。那妖怪把唐僧擒来洞口，按住狂风，对把门的说：你去报大王说，前路虎先锋拿了一个和尚，在门外听令。那虎先锋腰插着两口赤铜刀，双手捧着唐僧，上前跪下说：大王，小将不才，蒙钧令差往山上巡逻，忽遇一个和尚，他是东土大唐驾下唐僧唐僧法师，上西方拜佛求经，被我擒来奉上，聊具一馔。那洞主听见此言，吃了一惊说：我听见前者有人传说：唐僧法师原来大唐奉旨意取经的神僧；他手下有一个徒弟，名唤悟空，神通广大，智力高强。",
        "等我去他门首与他赌斗，必须抓住妖精，才救得师父。悟空整一整直裰，束一束虎裙，抽出了棒，撞至那门前，只见那门上有六个大字，原来黄风岭黄风洞。却就丁字脚站定,执着棒,高叫说：妖怪，趁早儿送我师父出来，省得掀翻了你窝巢，屣平了你住处。那小怪听完，一个个害怕，战兢兢的跑入里面报说：大王，祸事了。小妖说：洞门外来了一个雷公嘴毛脸的和尚，手持着一根许大粗的铁棒，要他师父哩。那洞主惊张，就唤虎先锋说：我让你去巡山，只该拿些山牛、野彘、 肥鹿、胡羊，怎么拿那唐僧来，却惹他那徒弟来此闹吵，怎生区处？先锋说：大王放心稳就，高枕勿忧。",
        "悟空听完，心中大怒，扢迸迸钢牙错啮，滴流流火眼睁圆，抽出铁棒喝说：你多大手段，敢说这等大话？这一场果然不善，他两个各显威能，好杀：那妖怪是个真鹅卵，悟空是个鹅卵石。赤铜刀架美猴王，浑如垒卵来击石。那妖怪喷风灰满山，悟空吐雾云迷日。转身败了要逃生，却被悟空抵死逼。那八戒一脚屣住他的脊背，两手抡钯又筑。他领了几十个小妖，敢与我赌斗，被我打败了，他转不往洞跑，却跑来这里寻死。八戒说：你可曾问他师父的下落么？悟空说：这怪把师父拿在洞里，要与他什么鸟大王做下饭。若是打败了这老妖，还赶将这里来，等八戒截住杀他。好悟空，一只手提着铁棒，一只手拖着死虎，径至他洞口。"
      ],
      "21": [
        "我倒没有吃他师父，他转打杀我家先锋，可恨！我也只听见讲什么悟空，等我出去，看是个什么九头八尾的和尚，拿他进来，与我虎先锋对命。老妖结束齐整，绰一杆三股钢叉，帅群妖跳出本洞。那悟空停立门外，见那妖走将出来，着实骁勇。那老妖出得门来，大声说：那个是悟空？这悟空脚屣着虎怪的皮囊，手执着如意的铁棒，答说：你孙外公在此。那妖怪仔细观看，见悟空身躯鄙猥，面容羸瘦，不满四尺。悟空笑说：你这个儿子，忒没眼色。你外公虽是小小的，你若肯照头打一叉柄，就长六尺。慌忙那妖把钢叉按住，喝说：悟空，你怎么把这护身的变化法儿，拿来我门前使出？",
        "手段：把毫毛揪下一把，用口嚼得粉碎，望上一喷，叫声：变！那妖怪使出这阵狂风，就把孙悟空毫毛变的小悟空刮得在那半空中却似纺车儿一般乱转，不要想抡得棒，怎么拢得身？又被那妖怪劈脸喷了一口黄风，把两只火眼金睛刮得紧紧闭合，不要能睁开。再说猪八戒见那黄风大作，天地无光，牵着马，守着担，伏在山凹之间，也不敢睁眼，不敢抬头，口里不住的念佛许愿；又不知悟空胜负何如，师父死活何如。八戒又不敢上他门，又没人看守马匹、行李，果是进退两难，怆惶不已。忧虑间，只听得孙悟空从西边吆喝而来，他才欠身迎着说：哥哥，好大风呵！把他围打，他甚着急，故弄出这阵风来。",
        "悟空说：要宿处不难，我料着那妖精还不敢伤我师父，我们且找上大路，寻个人家住下，过此一宵，明日天光，再来降妖罢。哪里有一老者，带几个年幼的农夫，叉钯扫帚齐来，问：什么人？悟空躬身说：我们是东土大唐圣僧的徒弟。因往西方拜佛求经，路过此山，被黄风大王拿了我师父去了，我们还未曾救得。那老者答礼说：没有远迎，没有远迎。这里原来云多人少之处，却才听见叫门，恐怕是妖狐、老虎及山中强盗等类，故此小介愚顽，多有冲撞，不知是二位唐僧。悟空说：不睡还可，敢问善人，贵地可有卖眼药的？悟空说：不瞒你老人家说，我们出家人自来无病，从不晓得害眼。",
        "悟空说：我们今日在黄风洞口救我师父，不期被那妖怪将一口风喷来，吹得我眼珠酸痛，今有些眼泪汪汪，故此要寻眼药。你这个唐僧，小小的年纪，怎么说谎？……八戒说：想必是夹脑风、羊耳风、 大麻风、偏正头风？老者说：那风能吹天地暗，善刮鬼神愁，裂石崩崖恶，吹人命就休。那老者说：既如此说，也是个有来头的人。悟空听完，低头唱喏说：愿求一些，点试点试。那老者应承，就走进去，拿出一个玛瑙石的小罐儿来，拔开塞口，用玉簪儿蘸出少许，与悟空点上，让他不得睁开，宁心睡觉，明早就好。八戒解包袱，展开铺盖，请悟空安置。",
        "这护教伽蓝、六丁六甲、五方揭谛、四值功曹奉菩萨的法旨，暗保我师父者。八戒说：哥哥，他既奉法旨暗保师父，所以不能现身明显，故此点化仙庄。等我去洞里打听打听，看师父下落怎么，再与他争战。只见那把门的小妖正打鼾睡，悟空往他脸上叮了一口，那小妖翻身醒了，说：我爷哑！悟空嘤嘤的飞将进去，只见那老妖吩咐各门上谨慎，一那边收拾兵器：只怕昨日那阵风没有刮死悟空，他今日必定还来，来时定让他一命休矣。悟空漫门缝儿钻将进去，原来是个大空园子，那那边定风桩上绳缠索绑着唐僧哩。那师父纷纷泪落，心心只念着悟空、悟能，不知都在哪里。",
        "只是老妖的风势利害，料着只在今日，管取拿他。又见那洞前有一个小妖精，把个令字旗磨一磨，撞上厅来报说：大王，小的巡山，才出门，见一个长嘴大耳朵的和尚坐在林里，若不是我跑得快些，几乎被他捉住。老妖说：悟空不在，想必是风吹死也；再不就去哪里求救兵去了。妖怪们说：大王，若果吹杀了他，是我们的好运气；只恐吹不死他，他去请些神兵来，却怎生是好？若还定得我的风势，只除了灵吉菩萨来是，其余何足惧也？悟空在屋梁上，只听得他这一句言语，非常欢喜。就抽身飞出，现本相，来至林中，叫声：兄弟。刚才一个打令字旗的妖精，被我赶了去也。",
        "八戒说：晓得，晓得，你只管快快过去。八戒学得个乌龟法，得缩头时且缩头。孙悟空跳在空中，纵筋斗云，径往直南上去，果然速快，他点头经过三千里，扭腰八百有余程。那道人躬身答礼说：哪里来的老爷？悟空说：这可是灵吉菩萨讲经处么？悟空说：累烦你老人家与我传答传答：我是东土大唐驾下唐僧唐僧法师的徒弟齐天悟空孙悟空悟空，今有一事，要见菩萨。道人笑说：老爷字多话多，我不能全记。悟空说：你只说是唐僧徒弟孙悟空来了。这悟空才举步入门，往里观看，只见那：满堂锦绣，一屋威严。辉煌宝烛，条条金焰射虹霓；馥郁真香，道道玉烟飞彩雾。",
        "举棒对面相还战不数合，那妖怪吊回头，望巽地上，才待要张口呼风，只见那半空里，灵吉菩萨将飞龙宝杖丢将下来，不知念了些什么咒语，却是一条八爪金龙，拨喇的抡开两爪，一把抓住妖精，提着头，两三捽，捽在山石崖边，现了本相，却是一个黄毛貂鼠。悟空追上，举棒就打，被菩萨拦住说：悟空，不要伤他命我还要带他去见如来。又对悟空说：他本是灵山脚下的得道老鼠，因为偷了琉璃盏内的清油，灯火昏暗，恐怕金刚拿他，故此走了，却在这里成精作怪。如来照见了他，不该死罪，故着我辖押，但他伤生造孽，拿上灵山。今又冲撞悟空，陷害唐僧，我拿他去见如来，明正其罪，才算这场功绩哩。"
      ],
      "22": [
        "话说唐僧师徒三众脱难过来，不一日行过了黄风岭，进西却是一脉平阳之地。唐僧在马上忙呼说：徒弟，你看那前边水势宽阔，怎不见船只行走，我们从哪里过去？八戒见了说：果是狂澜，无舟可渡。那悟空跳在空中，用手搭凉篷而看，他也心惊说：师父呵，真个是难，真个是难。唐僧说：我这里一望无边，端的有多少宽阔？八戒说：哥哥怎么定得个远近之数？悟空说：不瞒贤弟说，我这双眼，白日里常看得千里路上的吉凶。唐僧忧嗟烦恼，兜回马，忽见岸上有一通石碑。三众齐来看时，见上有三个篆字，原来流沙河；腹上有小小的四行真字云：八百流沙界，三千弱水深。",
        "见八戒与那妖怪交战，就恨得咬牙切齿，擦掌磨拳，忍不住要去打他，抽出出棒来说：师父，你坐着，不要怕。原来那妖怪与八戒正战到好处，难解难分。被悟空抡起铁棒，望那妖怪着头一下，那妖怪急转身，慌忙躲过，径钻入流沙河里。气得个八戒乱跳说：哥呵，谁着你来的？那妖怪渐渐手慢，难架我钯，再不上三五合，我就擒住他了。悟空笑说：兄弟，实不瞒你说，自从降了黄风怪，下山来，这个把月没有耍棍，我见你和他战的甜美，我就忍不住脚痒，故就跳将来耍耍的。他两个搀着手，说说笑笑，转回见了唐僧。悟空说：那妖怪不奈战，败回钻入水去也。",
        "架住说：你是个什么妖精，敢在这里挡路？八戒说：你既不是妖魔鬼怪，却怎生在我八戒还掐出水沫儿来哩，你怎敢说我粗糙，要剁鲊酱？那妖怪见钯来，使一个凤点头躲过。两个在水中打出水面，各人踏浪登波。这一个赤心凛凛保唐僧，那一个犯罪滔滔为水怪。钯抓一下九条痕，杖打之时魂魄败。再说那悟空保着唐僧，立于左右，眼巴巴的望着他两个在水上争持，只是他不好动手。只见那八戒虚幌一钯，佯输诈败，转回头往东岸上走。八戒嚷说：你这弼马温，彻是个急猴子！",
        "师父见他来得甚快，就叫：悟空，我们去化斋的人家，求问他一个过河之策，不强似与这怪争持？悟空笑说：这家子远得狠哩，相去有五七千里之路，他哪里得知水性？八戒说：哥哥又来扯谎了，五七千里路，你怎么这等去来得快？悟空说：你哪里晓得，我的筋斗云，一纵有十万八千里。八戒说：哥呵，既是这般容易，你把师父背着，只消点点头，躬躬腰，跳过去罢了，何必苦苦的与这怪厮战？八戒说：师父的凡胎肉骨，重似泰山，我这驾云的，怎称得起？悟空说：我的筋斗，好道也是驾云，只是去的有远近一些。自古说：遣泰山轻如芥子，携凡夫难脱红尘。",
        "悟空说：没甚区处，还须八戒下水。八戒说：哥哥，你要图干净，只作成我下水。悟空说：贤弟，这番我再不急性了，只让你引他上来，我拦住河沿，不让他回去，务要将他擒了。当头阻住，喝说：慢来，慢来，看杖。那妖怪说：你这个家伙甚不晓得哩。八戒笑说：我把你少打的泼物，且不要管什么筑菜，只怕荡了一下儿，让你没处贴膏药，九个眼子一齐流血。那妖怪丢开架手，在那水底下，与八戒依然打出水面。气昂昂，劳碌碌，多因唐僧朝西域。八戒骂说：我把你这个泼怪，你上来，这高处，脚踏实地好打。那妖骂说：你这个家伙哄我上去，又教那帮手来哩。",
        "过了一会儿，坠下筋斗，到紫竹林外，又只见那二十四路诸天上前迎着说：悟空何来？悟空说：我师有难，特来谒见菩萨。那轮日的诸天径至潮音洞口报说：孙悟空有事朝见。菩萨正与捧珠龙女在宝莲池畔扶栏看花，闻报，就转云岩，开门唤入。菩萨问：你怎么不保唐僧，为甚事又来见我？悟空启上说：菩萨，我师父前在高老庄，又收了一个徒弟，唤名猪八戒，多蒙菩萨又赐法讳悟能。才行过黄风岭，今至八百里流沙河，原来是弱水三千，师父已是难渡；河中又有个妖怪，武艺高强，甚亏了悟能与他水面上大战三次，只是不能取胜，被他拦阻，不能渡河。因此，特告菩萨，望垂怜悯，济渡他一济渡。",
        "悟空说：我们只是要抓住他，让他送我师父渡河。只是悟能寻着他窝巢，与他打话，想是没有说出取经的勾当。菩萨说：那流沙河的妖怪，原来是卷帘大将临凡，也是我劝化的善信，让他保护取经之辈。悟空说：那妖怪如今怯战，不肯上崖，只在水里潜踪，怎么得他归顺？菩萨就唤惠岸，袖中拿出一个红葫芦儿，吩咐说：你可将此葫芦，同孙悟空到流沙河水面上，只叫沙僧，他就出来了。然后把他那九个骷髅穿在一处，按九宫布列，却把这葫芦安在当中，就是法船一只，能渡唐僧过流沙河界。猪八戒认得是木叉悟空，引师父上前迎接。那木叉与唐僧礼毕，又与八戒相见。",
        "沙僧看见了八戒说：他不知是哪里来的个泼物，与我整斗了这两日，何曾言着一个取经的字儿？又看见悟空，说：这个主子，是他的帮手，好不利害，我不去了。木叉说：那是猪八戒，这是悟空，具是唐僧的徒弟，具是菩萨劝化的，怕他怎么？那沙僧才收了宝杖，整一整黄锦直裰，跳上岸来，对唐僧双膝跪下说：师父，弟子有眼无珠，不认得师父的尊容，多有冲撞，还请恕罪。八戒说：你这脓包，怎么早不皈依，只管要与我打？悟空笑说：兄弟，你不要怪他，还是我们没有说出取经的事情与姓名耳。沙僧说：弟子向蒙菩萨教化，指沙为姓，与我起个法名，唤做沙僧，岂有不从师父之理？"
      ],
      "23": [
        "悟空说：八戒，你这般言语，似有报怨之心。八戒说：哥哥，你看这担行李多重？悟空说：兄弟，自从有了你与沙僧，我又没有挑着，那知多重？八戒说：哥呵，你看看数儿么：四片黄藤蔑，长短八条绳。铜镶铁打九环杖，篾丝藤缠大斗篷。似这般许多行李，难为八戒一个逐日家担着走，偏你跟师父做徒弟，拿我做长工。我只管师父好歹，你与沙僧专管行李、马匹。八戒说：哥呵，不要说打，打就是以力欺人。悟空说：你说他是马哩，他不是凡马，本是西海龙王敖闰之子，唤名龙马三太子。只因纵火烧了殿上明珠，被他父亲告了忤逆，身犯天条，多亏观音菩萨救了他的性命。",
        "他在那鹰愁陡涧久等师父，又幸得菩萨亲临，却将他退鳞去角，摘了项下珠，才变做这匹马，愿驮师父往西天拜佛。那沙僧听完说：哥哥，真个是龙么？八戒说：哥呵，我听见古人云：龙能喷云嗳雾，播土扬沙；有巴山岭的手段，有翻江搅海的神通。悟空说：你要他快走，我让他快走个儿你看。好悟空，把金箍棒揝一揝，万道彩云生。那马看见拿棒，恐怕打来，慌忙四只蹄疾如飞电，飕的跑将去了。那师父正按辔徐观，又见悟空兄弟方到。唐僧骂说：悟空这泼猴，他把马儿惊了，早是我还骑得住哩。悟空陪笑说：师父不要骂我，都是猪八戒说马行迟，故此着他快些。",
        "悟空正然偷看处，忽听得后门内有脚步之声，走出一个半老不老的妇人来，娇声问：是什么人，擅入我寡妇之门？慌忙个悟空喏喏连声说：小僧是东土大唐来的，奉旨向西方拜佛求经。那妇人笑语相迎说：唐僧，那三位在哪里？唐僧才与八戒、沙僧牵马挑担而入，只见那妇人出厅迎接。八戒饧眼偷看，你道他怎生打扮：穿一件织锦官绿纻丝袄，上罩着浅红比甲；系一条结彩鹅黄锦绣裙，下映着高底花鞋。云鬓半苍飞凤翅，耳环双坠宝珠排。适承唐僧下降，想是师徒师徒四人，小妇娘女四人，想要坐山招夫，四位恰好。",
        "虽然居住山庄，也不是那十分粗俗之类，料想也配得过大家唐僧。唐僧坐在上面，好就似雷惊的孩子，雨淋的虾蟆：只是呆呆挣挣，翻白眼儿打仰。那八戒听见这般富贵，这般美色，他却心痒难挠；坐在那椅子上，一似针戳屁股，左扭右扭的，忍耐不住。走上前，扯了师父一把说：师父，这娘子告诵你话，你怎么佯佯不睬？那师父猛抬头，咄的一声，喝退了八戒说：你这个孽畜！那妇人说：唐僧请坐，等我把在家人好处说与你听。唐僧说：女菩萨，你在家人享荣华，受富贵，有可穿，有可吃，儿女团圆，果那妇人听完，大怒说：这泼和尚无礼！唐僧见他发怒，只得者者谦谦，叫说：悟空，你在这里罢。",
        "悟空说：沙僧，你且陪师父坐这里，等我跟他去，看他往哪里放马。唐僧说：悟空，你看就去看他，但只不可只管嘲他了。这悟空走出厅房，摇身一变，变作个红蜻蜓儿，飞出前门，追上八戒。那八戒拉着马，有草处且不教吃草，嗒嗒嗤嗤的赶着马，转到后门首去。他娘女们看见八戒来时，三个女儿闪将进去。那妇人伫立门首说：小唐僧哪里去？这八戒丢了缰绳，上前唱个喏，道声娘，我来放马的。八戒笑说：他们是奉了唐王的旨意，不敢有违君命，不肯干这件事。那妇人说：我也不嫌，只是家下无个家长，招一个倒也罢了，但恐小女儿有一些嫌丑。",
        "想我那唐僧，人才虽俊，其实不合用。八戒说：我：虽然人物丑，勤紧有些功。那妇人说：既然干得家事，你再去与你师父商量商量看，不尴尬，就招你罢。八戒说：不用商量，他又不是我的生身父母，干与不干，都在于我。妇人说：也罢，也罢，等我与小女说。怎知孙悟空已一一尽知，他转翅飞来，现了本相，先见唐僧说：师父，悟能牵马来了。唐僧说：马若不牵，恐怕撒欢走了。悟空笑将起来，把那妇人与八戒说的勾当，从头说了一遍，唐僧也似信不信的。悟空说：没处放马，可有处牵马么？八戒听见此言，情知走了消息，也就垂头扭颈，努嘴皱眉，半晌不言。",
        "师父做个男亲家，这婆儿做个女亲家，等我做个保亲，沙僧做个媒人。八戒说：弄不成，弄不成，哪里好干这个勾当？悟空说：八戒，不要者嚣，你那口里娘也不知叫了多少，又是什么弄不成。他一只手揪着八戒，一只手扯住妇人说：亲家母，带你女婿进去。再说那八戒跟着丈母，行入里面，一层层也不知多少房舍，磕磕撞撞，尽都是门槛绊脚。八戒说：娘，慢一些走，我这里边路生，你带我带儿。那妇人说：这都是仓房、库房、碾房各房，还没有到那厨房边哩。那妇人说：女婿，你师兄说今朝是天恩上吉日，就让你招进来了。满堂中银烛辉煌，这八戒朝上礼拜。",
        "八戒说：好，好，好，把三件儿都拿来我穿了看，若都穿得，就教都招了罢。那妇人转进房里，止拿出一件来，递与八戒。那八戒脱下青锦布直裰，取过衫儿，就穿在身上。那八戒疼痛难禁，这些人早已不见了。再说唐僧、悟空、沙僧一觉睡醒，不觉的东方发白。沙僧说：哥哥，罢了，罢了，我们遇着鬼了。孙悟空心中明白，微微的笑说：怎么说？悟空笑说：昨日这家子娘女们，不知是哪里菩萨，在此显化我们，想是半夜里去了，只苦了猪八戒受罪。沙僧急去取来与师父看时，却是八句颂子云：黎山老母不思凡，南海菩萨请下山。圣僧有德还无俗，八戒无禅更有凡。"
      ],
      "24": [
        "再说那三人穿林入里，只见那八戒绷在树上，声声叫喊，痛苦难禁。悟空上前笑说：好女婿呀，这早晚还不起来谢亲，又不到师父处报喜，还在这里卖解儿耍子哩。那八戒见他来抢白着羞，咬着牙，忍着疼，不敢叫喊。八戒对他们只是磕头礼拜，其实羞耻难当。八戒说：我已此晕倒昏迷，眼花撩乱，那认得是谁？沙僧笑说：二哥有这般好处哩，感得四位菩萨来与你做亲。八戒说：兄弟再不要题起，不敢当子了。行勾多时，忽见有高山挡路，唐僧勒马停鞭说：徒弟，前面一山，必须仔细，恐有妖魔作耗，侵害我党。悟空说：马前但有我们三人，怕甚妖魔？",
        "沙僧说：师兄，我们到雷音有多少远？悟空说：十万八千里，十停中还没有走了一停哩。悟空说：这些路，若论二位贤弟，就十来日也可到；若论我走，一日也好走五十遭，还见日色；若论师父走，不要想，不要想。唐僧说：悟空，你说得几时方可到？悟空说：你自小时走到老，老了再小，老小千番也还难；只要你见性志诚，念念回首处，就是灵山。沙僧说：师兄，这里虽不是雷音，观此景致，必有个好人居止。镇元子吩咐二童说：不可违了大天尊的简帖，要往弥罗宫听讲，你两个在家仔细。可将我人参果打两个与他吃，权表旧日之情。大仙说：他是东土大唐驾下的圣僧，道号唐僧，今往西天拜佛求经的和尚。",
        "那大仙临行，又叮咛嘱咐说：我那果子有数，只许与他两个，不得多费。清风说：开园时，大众共吃了两个，还有二十八个在树，不敢多费。大仙说：唐僧虽是故人，须要防备他手下人罗唣，不可惊动他知。二童领命讫，那大仙承众徒弟飞升，竟朝天界。再说唐僧师徒四人在山游玩，忽抬头，见那松篁一簇，楼阁数层。唐僧说：悟空，你看哪里是什么地方？悟空看了说：那所在不是观宇，定是寺院。唐僧离鞍下马，又见那山门左边有一通碑，碑上有十个大字，原来是万寿山福地，五庄观洞天。沙僧说：师父，观此景鲜明，观里必有好人居住。八戒说：且不要管他，进去，进去，或者这道士有些德行，未可知也。",
        "你去山门前放马，沙僧看守行李，教八戒解包袱，取些米粮，借他锅灶，做顿饭吃，待临行，送他几文柴钱，就罢了。那明月、清风暗自夸称不尽说：好和尚，真个是西方爱圣临凡，真元不昧。师父命我们接待唐僧，将人参果与他吃，以表故旧之情；又教防着他手下人罗唣。清风说：兄弟，还不知那和尚可是师父的故人。二童子又上前说：启问老师可是大唐往西天取经的唐僧？童子说：我师临行，曾吩咐教弟子远接。那明月急转本房，取一杯香茶，献与唐僧。茶毕，清风说：兄弟，不可违了师命，我和你去取果子来。二童别了唐僧，同到房中，一个拿了金击子，一个拿了丹盘，又多将绿帕垫着盘底，径到人参园内。",
        "八戒正在厨房里做饭，先前听见说取金击子，拿丹盘，他已在心；又听见他说唐僧不认得是人参果，就拿在房里自吃。口里忍不住流涎说：怎得一个儿尝新？自家身子又狼犺，不能勾得动，只等悟空来，与他计较。不多时，见悟空牵将马来，拴在槐树上，径往后走。那八戒用手乱招说：这里来，这里来。悟空转身，到于厨房门首，说：八戒，你嚷甚的？八戒笑说：说与你，你没有见；拿与你，你不认得。但只常听见人说，人参果原来是草还丹，人吃了极能延寿。那童子拿两个与师父吃，那老和尚不认得，道是三朝未满的孩儿，没有敢吃。那童子老大惫懒，师父既不吃，就该让我们，他就瞒着我们，才自在这隔壁房里，一家一个，嘓啅嘓啅的吃了出去。",
        "悟空说：这个容易，我去，手到擒来。急抽身，往前就走，八戒一把扯住说：哥呵，我听得他在这房里说，要拿什么金击子去打哩。那悟空使一个隐身法，闪进道房看时，原来那两个道童吃了果子，上殿与唐僧说话，不在房里。悟空四下里观看，看有什么金击子，但只见窗棂上挂着一条赤金，有二尺长短，有指头粗细；底下是一个蒜疙疸的头子；上边有眼，系着一根绿绒绳儿。他却取下来，出了道房，直接走进后边去，推开两扇门，抬头观看，呀！那悟空观看不尽，又见一层门，推开看处，却是一座菜园：布种四时蔬菜，菠芹莙荙姜苔。悟空笑说：他也是个自种自吃的道士。",
        "他就捻着诀，念一口唵字咒，拘得那花园土地过来，对悟空施礼说：悟空呼唤小神，有何吩咐？悟空说：你不知我是盖天下有名的贼头，我当年偷蟠桃、盗御酒、窃灵丹，也没有有人敢与我分用。这宝贝原来是地仙之物，小神是个鬼仙，怎么敢拿去？悟空说：你既没有拿去，怎么打下来就不见了？土地说：悟空只知这宝贝延寿，更不知他的出处哩。土地说：这宝贝三千年一开花，三千年一结果，再三千年方得成熟。打下来，却将盘儿用丝帕衬垫方可。遇土而入者，悟空才打落地上，他就钻下土去了。悟空不信时，可把这地下打打儿看。悟空就抽出金箍棒筑了一下，响一声，迸起棒来，土上更无痕迹。",
        "不期那两个道童复进房来取茶去献，只听得八戒还嚷什么人参果吃得不快活，再得一个儿吃吃才好。清风听见，心疑说：明月，你听那长嘴和尚讲：人参果还要个吃吃。明月回头说：哥耶，不好了，不好了，金击子怎么落在地下？清风说：这门是我关的，怎么开了？明月说：果子原是三十个，师父开园，分吃了两个，还有二十八个；适才打两个与唐僧吃，还有二十六个；如今止剩得二十二个，却不少了四个？不消讲，不消讲，定是那伙恶人偷了，我们只骂唐僧去来。唐僧听不过说：仙童呵，你闹的是什么？明月说：才拿来与你吃，你说像孩童的不是？"
      ],
      "25": [
        "是八戒隔壁听见那两个道童吃什么人参果，他想一个儿尝新，着我去打了三个，我兄弟各人吃了一个。明月说：偷了我四个，这和尚还说不是贼哩。既是偷了四个，怎么只拿出三个来分，预先就打起一个偏手？就恨得个悟空钢牙咬响，火眼睁圆，把条金箍棒揝了又揝，忍了又忍说：这童子只说当面打人也罢，受他些气儿。好悟空，把脑后的毫毛拔了一根，吹口仙气，叫：变！变做个假悟空，跟定唐僧，陪着悟能、沙僧，忍受着道童嚷骂。他的真身出一个神，纵云头，跳将起去，径到人参园里，抽出金箍棒，往树上乒乓一下，又使个推山移岭的神力，把树一推推倒。",
        "明月说：师兄不要嚷，我们且整了衣冠，不要惊张了这几个和尚。若是与他分说，那个家伙毕竟抵赖，定要与他相争；争起来，就要交手相打，你想我们两个怎么敌得过他四个？他一家拿着一个碗，你却站在门左，我却站在门右，扑的把门关倒，把锁锁住，将这几层门都锁了，不要放他，待师父来家，凭他怎么处置。他两个强打精神，勉生欢喜，从后园中径来殿上，对唐僧控背躬身说：师父，适间言语粗俗，多有冲撞，不要怪，不要怪。清风说：果子不少，只因树叶高密，没有看得明白。那八戒就趁脚儿跷说：你这个童儿，年幼不知事体，就来乱骂，白口咀咒，枉赖了我们也，不敢当子。",
        "沙僧说：哥呵，几层门都上了锁，闭得甚紧，怎么走么？悟空笑说：不要管，不要管，我自有法儿。八戒说：愁你没有法儿哩，你一个变，什么虫蛭儿，瞒格子眼里就飞将出去。只苦了我们不会变的，就在此顶缸受罪哩。唐僧说：他若干出这个勾当，不同你我出去呵，我就念起旧话经儿，他却怎生消受？八戒听完，又愁又笑说：师父，你说的什么话？我只听得佛教中有卷《楞严经》、《法华经》、《孔雀经》、《观音经》、《金刚经》，没有听见个甚那旧话儿经呵。我顶上戴的这个箍儿，是观音菩萨赐与我师父的，师父哄我戴了，就如生根的一般，不要想拿得下来，叫做紧箍儿咒，又叫做紧箍儿经。",
        "众仙到他房门首看处，真个关着房门，鼾鼾沉睡；任外边打门乱叫，哪里叫得醒来。大仙笑说：好仙童呵，成仙的人，神满再不思睡，却怎么这般困倦？慌忙那清风顿首，明月磕头说：师父呵，你的故人原是东来的和尚，一伙强盗，十分凶狠。大仙笑说：不要惊恐，慢慢的说来。清风说：师父呵，当日别后不久，果然有个东土唐僧，一行有四个和尚，连马五口。弟子不敢违了师命，问及来因，将人参果取了两个奉上。那唐僧俗眼愚心，不识我们仙家的宝贝。不期他那手下有三个徒弟，有一个姓孙的，名悟空悟空，先偷四个果子吃了。明月说：没有打，只是把我们人参树打倒了。",
        "你道他怎生打扮：穿一领百衲袍，系一条吕公绦。一直来到树下，对唐僧高叫说：唐僧，贫道有礼了了。唐僧说：贫僧原来东土大唐差往西天取经者，路过这里，权为一歇。大仙佯讶说：唐僧东来，可曾在荒山经过？大仙说：万寿山五庄观，就是贫道栖止处。悟空听完，他心中有物的人，忙答说：没有，没有，我们是打上路来的。那大仙指定笑说：我把你这个泼猴！你倒在我观里，把我人参果树打倒，你连夜走在这里，还不招认，遮饰什么？大仙侧身躲过，踏祥光，径到空中。大仙在半空现了本相，你看他怎生打扮：头戴紫金冠，无忧鹤氅穿。相迎悟空无兵器，止将玉麈手中捻。",
        "又说：徒弟，这和尚是出家人，不可用刀枪，不可加鈇钺。且与我拿出皮鞭来，打他一顿，与我人参果出气。众仙就忙拿出一条鞭，──不是什么牛皮、羊皮、麂皮、犊皮的，原来是龙皮做的七星鞭，着水浸在哪里。令一个有力量的小仙，把鞭执定说：师父，先打那个？悟空听完，心中暗说：我那老和尚不禁打，假若一顿鞭打坏了呵，却不是我造的孽？偷果子是我，吃果子是我，推倒树也是我，怎么不先打我，打他做甚？悟空恐仙家法大，睁圆眼瞅定，看他打哪里。原来打腿，悟空就把腰扭一扭，叫声：变！那小仙一下一下的打了三十，天早向午了。",
        "悟空见了，叫说：师父不济，出家人怎么这般辛苦？且下马来，不要教走路的人看见笑你，权在山坡下藏风聚气处歇歇再走。那小仙抡着鞭，望唐僧说：打你哩。及打到悟空，那悟空在路，偶然打个寒噤说：不好了！悟空说：我将四颗柳树变作我师徒师徒四人，我只说他昨日打了我两顿，今日想不打了，却又打我的化身，所以我真身打噤。你看那些道童害怕，丢了皮鞭，报说：师父呵，为头打的是大唐和尚，这一会打的都是柳树之根。大仙听完，呵呵冷笑，夸不尽说：悟空，真是一个好猴王。曾闻他大闹天宫，布地网天罗，拿他不住，果然有此理。大仙低落云头，叫声：悟空，往哪里走？",
        "悟空笑说：八戒，这先生好意思，拿出布来与我们做中袖哩。大仙说：把唐僧、猪八戒、沙僧都使布裹了。悟空笑说：好，好，好，夹活儿就大殓了。八戒说：先生，上头倒不打紧，只是下面还留孔儿，我们好出恭。悟空笑说：八戒，好运气，抬出锅来，想是煮饭我们吃哩。八戒说：也罢了，让我们吃些饭儿，做个饱死的鬼也好看。大仙叫架起干柴，发起烈火，吩咐：把清油拗上一锅，烧得滚了，将悟空下油锅扎他一扎，与我人参树报仇。悟空听完，暗喜说：正可我之意，这一向没有洗澡，有一些皮肤燥痒，好歹烫烫，足感盛情。悟空却又留心，恐他仙法难参，油锅里难做手脚，急回头四顾，只见那台下东边是一座日规台，西边是一个石狮子。"
      ],
      "26": [
        "再说那镇元大仙用手搀着悟空说：我也知道你的本事，我也听见你的英名，只是你今番越理欺心，纵有腾那，脱不得我手。悟空笑说：你这先生，好小家子样。悟空说：你解了我师父，我还你一棵活树怎么？大仙说：你若有此神通，医得树活，我与你八拜为交，结为兄弟。悟空说：不打紧，放了他们，我管教还你活树。大仙谅他走不脱，就命解放了唐僧、八戒、沙僧。沙僧说：师父呵，不知师兄捣得是什么鬼哩。八戒说：什么鬼，这叫做当面人情鬼。于是叫说：悟空，你怎么哄了仙长，解放我们？悟空说：我是真言实语，怎么哄他？唐僧说：既如此，就依你说，与你三日之限。",
        "悟空说：实不瞒大家说，我因往西方，行在半路，有一些阻滞，特来小事欲干，不知肯否？悟空说：因路过万寿山五庄观有阻。三老惊讶说：五庄观是镇元大仙的仙宫，你不要不是把他人参果偷吃了？悟空说：灵根，灵根，我已弄了他个断根哩。悟空说：我们前日在他观里，那大仙不在家，只有两个小童接待了我师父，却将两个人参果奉与我师。那童子就拿去吃了，没有让得我们。是我恼了，把他树打了一棍，推倒在地，树上果子全无，丫开叶落，根出枝伤，已枯死了。次日清辰，那先生回家赶来，问答间，语言不和，于是与他赌斗，被他闪一闪，把袍袖展开，一袖子都笼去了。",
        "只是我那唐僧法严量窄，止与了我三日期限；三日以外不到，他就要念那紧箍儿咒哩。三星笑说：好，好，好，若不是这个法儿拘束你，你又钻天了。一则久别，没有拜望；二来是悟空的人情：如今我三人同去望他一望，就与你道达此情，教那唐和尚不要念紧箍儿咒，休说三日五日，只等你求得方来，我们才别。那仙童看见，就忙报说：师父，海上三星来了。镇元子正与唐僧师弟闲叙，闻报，就降阶奉迎。那八戒见了寿星，近前扯住，笑说：你这肉头老人家，许久不见，还是这般脱洒，帽儿也不带个来。于是把自家一个僧帽，扑的套在他头上，扑着手呵呵大笑说：好，好，好，真是加冠进禄也。",
        "那寿星将帽子掼了，骂说：你这个夯货，老大不知高低。八戒说：我不是夯货，你们真是奴才。福星说：你倒是个夯货，反敢骂人是奴才？八戒又笑说：既不是人家奴才，好道叫做添寿、添福 、添禄？那唐僧喝退了八戒，急整衣拜了三星。坐好，禄星说：我们一向久阔尊颜。有失恭敬，今因孙悟空搅扰仙山，特来相见。寿星说：是，因为伤了大仙的丹树，他来我处求方医治。唐僧听完，连声应说：不敢念，不敢念。正说处，八戒又跑进来，扯住福星，要讨果子吃。八戒说：不是没规矩，此叫做番番是福。那八戒出门，瞅着福星，眼不转睛的发狠。福星说：夯货，我哪里恼了你来，你这等恨我？",
        "悟空见了，笑说：这个小贼在这里哩。东方朔朝上进礼，答说：老贼，你来这里怎么？帝君叫说：曼倩休乱言，看茶来也。饮讫，悟空说：我此来，有一事奉干，未知允否？悟空说：近因保唐僧西行，路过万寿山五庄观，因他那小童无状，是我一时发怒，把他人参果树推倒，一时阻滞，唐僧不得脱身，特来尊处求赐一方医治，还请慨然。帝君说：你这猴子，不管一二，到处里闯祸。他那人参果树原来草还丹，你偷吃了，尚说有罪；却又连树推倒，他肯干休？我们走脱了，被他追上，把我们就当汗巾儿一般，一袖子都笼去了，所以阁气。帝君说：我有一粒九转太乙还丹，但能治世间生灵，却不能医树。",
        "这悟空大声说：带我耍耍儿就怎么？悟空认得是九老，笑说：老兄弟们自在哩。九老说：悟空当年若存正，不闹天宫，比我们还自在哩。悟空将那医树求方之事，具陈了一遍。九老也大惊说：你也忒惹祸，惹祸！那菩萨早已看见悟空来到，就命守山大神去迎。那大神出林来，叫声：孙悟空，哪里去？悟空抬头喝说：你这个熊罴，悟空可是你叫的？那黑熊真个得了正果，在菩萨处镇守普陀，称为大神，是也亏了悟空。他只得陪笑说：悟空，古人云：君子不念旧恶。这悟空就站端正尊诚，与大神到了紫竹林里，参拜菩萨。菩萨说：那万寿山有座五庄观，镇元大仙你曾会他么？",
        "那童子知觉，骂我们无已，是弟子发怒，于是将他树推倒。他次日回来追上，将我们一袖子笼去，绳绑鞭抽，拷打了一日。我们当夜走脱，又被他追上，依然笼了。菩萨说：你怎么不早来见我，却往岛上去寻找？悟空听见此言，心中暗喜说：好运气了，好运气了，菩萨一定有方也。菩萨说：我这净瓶底的甘露水，善治得仙树灵苗。菩萨说：当年太上老君曾与我赌胜：他把我的杨柳枝拔了去，放在炼丹炉里，炙得焦干，送来还我。是我拿了插在瓶中，一昼夜，复得青枝绿叶，与旧相同。悟空笑说：真好运气了，真好运气了。烘焦了的尚能医活，况此推倒的，有何难哉？",
        "唐僧师徒与本观众仙都到园内观看时，那棵树倒在地下，土开根现，叶落枝枯。菩萨将杨柳枝蘸出瓶中甘露，把悟空手心里画了一道起死回生的符字，让他放在树根之下，但看水出为度。那悟空捏着拳头，往那树根底下揣着，过了一会儿，有清泉一汪。菩萨说：那个水不许犯五行之器，须用玉瓢舀出，扶起树来，从头浇下，自然根皮相合，叶长芽生，枝青果出。镇元子说：贫道荒山没有玉瓢，只有玉茶盏、玉酒杯，可用得么？菩萨说：但是玉器，可舀得水的就罢，取将来看。大仙就命小童子拿出有二三十个茶盏、四五十个酒盏，却将那根下清泉舀出。"
      ],
      "27": [
        "再说唐僧师徒次日天明收拾前进，那镇元子与悟空结为兄弟，两人情投意合，决不肯放，又安排管待，一连住了五六日。那唐僧自服了草还丹，真似脱胎换骨，神爽体健。唐僧说：徒弟，前面有山险峻，恐马不能前，大家须仔细仔细。悟空说：师父放心，我们自然理会。师徒们入此山，正行到嵯峨之处，唐僧说：悟空，我这一日，肚中饥了，你去哪里化些斋吃。唐僧心中不快，口里骂说：你这猴子！想你在两界山，被如来压在石匣之内，口能言，足不能行，也亏我救你性命，摩顶受戒，做了我的徒弟。悟空说：弟子亦颇殷勤，什么时候懒惰？唐僧说：你既殷勤，为什么不化给我找饭吃？",
        "唐僧见了，叫：八戒、沙僧，悟空才说这里旷野无人，你看哪里不走出一个人来了？八戒说：师父，你与沙僧坐着，等八戒去看看来。唐僧一见，连忙跳起身来，合掌当胸说：女菩萨，你家里在哪里住？那妖精见唐僧问他来历，他立地就起个假装可怜，编出一番话，来赚哄说：师父，此山叫做蛇回兽怕的白虎岭，正西下面是我家。唐僧听完说：女菩萨，你语言差了。那女子笑吟吟，忙陪俏语说：师父，我丈夫在山北凹里，带几个客子锄田。那女子见唐僧不肯吃，却又满面春生说：师父呵，我父母给和尚饭吃，还是小可；我丈夫更是个善人，一生好的是修桥补路，爱老怜贫。",
        "出家人时时常要方就，念念不离善心，扫地恐伤蝼蚁命，爱惜飞蛾纱罩灯。你怎么步步行凶，打死这个无故平人，取将经来何用？悟空说：你不要我做徒弟，只怕你西天路去不成。唐僧说：我命在天，该那个妖精蒸了吃，就是煮了，也算不过。悟空说：师父，我回去就也罢了，只是没有报得你的恩哩。那悟空听完，连忙跪下磕头说：我因大闹天宫，致下了伤身之难，被我佛压在两界山。幸观音菩萨与我受了戒行，幸师父救脱我身。原来这唐僧是个慈悯的圣僧，他见悟空哀告，却也回心转意说：既如此说，且饶你这一次，再休无礼。悟空说：三十遍也由你，只是我不打人了。却才伏侍唐僧上马，又将摘来桃子奉上。",
        "唐僧在马上也吃了几个，权且填填肚子。再说那妖精脱命升空，原来悟空那一棒没有打杀妖精，妖精出神去了。他在那云端里咬牙切齿，暗恨悟空说：几年只听见讲他手段，今日果然话不虚传。不期被他走来，弄破我这勾当，又几乎被他打了一棒。好妖精，按落阴云，在那前山坡下摇身一变，变作个老妇人，年满八旬，手拄着一根弯头竹杖，一步一声的哭着走来。八戒见了，大惊说：师父，不好了，那妈妈儿来寻人了。八戒说：师兄打杀的定是他女儿，这个定是他娘寻将来了。悟空说：兄弟不要胡说，那女子十八岁，这老妇有八十岁，怎么六十多岁还生产？",
        "八戒说：师父，他要和你分行李哩。悟空听完，气得暴跳说：我把你这个尖嘴的夯货！唐僧说：你既不嫉妒贪恋，如为什么不去？悟空说：实不瞒师父说，我五百年前，居花果山水帘洞大展英雄之际，收降七十二洞邪魔，手下有四万七千小怪，头戴的是紫金冠，身穿的是赭黄袍，腰系的是蓝田带，足踏的是步云履，手执的是如意金箍棒，着实也曾为人。自从涅槃罪度，削发秉正沙门，跟你做了徒弟，把这个金箍儿勒在我头上，若回去，却也难见故乡人。师父果若不要我，把那个松箍儿咒念一念，退下这个箍子，交付与你，套在别人头上，我就快活相应了，也是跟你一场。",
        "八戒说：师兄打杀他的女儿，又打杀他的婆子，这个正是他的老人家寻将来了。我们若撞在他的怀里呵，师父，你就偿命，该个死罪；把八戒为从，问个充军；沙僧喝令，问个摆站。悟空听见说：这个呆根，这等胡说，可不吓了师父？那妖精错认了定盘星，把孙悟空也当做个等闲的，于是答说：唐僧呵，我老汉祖居此地，一生好善给和尚饭吃，看经念佛。悟空笑说：我是个做虎的祖宗，你怎么袖子里笼了个鬼儿来哄我？悟空抽出出棒来，自忖说：若要不打他，显得他倒弄个风儿；若要打他，又怕师父念那话儿咒语。又思量说：不打杀他，他一时间抄空儿把师父捞了去，却不又费心劳力去救他？",
        "唐僧正要念咒，悟空急到马前叫说：师父不要念，不要念，你且来看看他的模样。唐僧大惊说：悟空，这个人才死了，怎么就化作一堆骷髅？悟空说：他是个潜灵作怪的僵尸，在此迷人败本，被我打杀，他就现了本相。怎禁那八戒旁边唆嘴说：师父，他的手重棍凶，把人打死，只怕你念那话儿，故意变化这个模样，掩你的眼目哩。悟空禁不得疼痛，跪于路旁边，只叫：不要念，不要念，有话快说了罢。你在这荒郊野外，一连打死三人，还是无人检举，没有对头；倘到城市之中，人烟凑集之所，你拿了那哭丧棒，一时不知好歹，乱打起人来，撞出大祸，让我怎么脱身？",
        "唐僧见他言言语语，越添恼怒，滚鞍下马来，叫沙僧包袱内拿出纸笔，就于涧下取水，石上磨墨，写了一纸贬书，递于悟空说：猴头，执此为照，再不要你做徒弟了；如再与你相见，我就堕了阿鼻地狱。悟空连忙接了贬书说：师父，不消发誓，我去罢。他将书折了，留在袖内，却又软款唐僧说：师父，我也是跟你一场，又蒙菩萨指教，今日半涂而废，没有成得功果，你请坐，受我一拜，我也去得放心。唐僧转回身不睬，口里唧唧哝哝的说：我是个好和尚，不受你歹人的礼。悟空见他不睬，又使个身外法，把脑后毫毛拔了三根，吹口仙气，叫：变！就变了三个悟空，连本身四个，四面围住师父下拜。"
      ],
      "28": [
        "再说那悟空虽被唐僧逐赶，然犹思念感叹不已，早望见东洋大海，说：我不那悟空正当悲切，只听得那芳草坡前，曼荆凹内，响一声，跳出七八个小猴，一拥上前，围住磕头。美猴王说：你们因为什么不耍不顽，一个个都潜踪隐迹？群猴听说，一个个垂泪告说：自悟空擒拿上界，我们被猎人之苦，着实难捱。悟空说：我当时共有四万七千群妖，如今都往哪里去了？群猴说：自从爷爷去后，这山被二郎菩萨点上火，烧杀了大半。这两年，又被些打猎的抢了一半去也。他把我们中箭着枪的，中毒打死的，拿了去剥皮剔骨，酱煮醋蒸，油煎盐炒，当做下饭食用。",
        "悟空坐在中间，群怪围上来行礼于前，启说：悟空爷爷，近听见你得了性命，保唐僧往西天取经，如为什么不走西方，却回本山？悟空说：小妖们，你不知道，那唐僧不识贤愚：我为他一路上捉怪擒魔，使尽了平生的手段，几番家打杀妖精；他说我行凶作恶，不要我做徒弟，把我逐赶回来，写立贬书为照，永不听用了。众猴鼓掌大笑说：好运气，好运气。悟空说：且不要饮酒，我问你那打猎的人，几时来我山上一度？马、流说：悟空，不论什么时度，他逐日家在这里缠扰。悟空吩咐：小妖们，都出去把那山上烧酥了的碎石头与我搬将起来堆着。或二三十个一推，或五六十个一堆堆着，我有用处。",
        "悟空说：你们去南山下，把那打死的猎户衣服剥得来家，洗净血迹，穿了遮寒；把死人的倒下的人都推在那万丈深潭内；把死倒的马拖将来，剥了皮，做靴穿，将肉腌着，慢慢的食用；把那些弓箭枪刀，与你们操演武艺；将那杂色旗号，收来我用。那悟空把旗拆洗，总斗做一面杂彩花旗，上写着重修花果山，复整水帘洞，齐天悟空十四字。他的人情又大，手段又高，就去四海龙王借些甘霖仙水，把山洗青了。八戒前边开路，沙僧挑着行李西行。唐僧叫说：徒弟呀，山路崎岖，甚是难走，却又松林丛簇，树木森罗，切须仔细，恐有妖邪妖兽。你看那八戒抖擞精神，叫沙僧带着马，他使钉钯开路，领唐僧直接走进松林之内。",
        "沙僧说：不打紧，师父，你且坐在这里，等我去寻他来。沙僧绰了宝杖，径出松林来找八戒。唐僧独坐林中，十分闷倦，只得强打精神，跳将起来，把行李攒在一处，将马拴在树上。那唐僧看遍了野草山花，听不得归巢鸟噪。他一来也是要散散闷，二来也是要寻八戒、 沙僧。不期他两个走的是直西路，唐僧转了一会，却走向南边去了。",
        "洞门外，有一来一往的走兽成行；树林里，有或出或入的飞禽作队。这所在分明是恶境，那唐僧晦气撞将来。那唐僧举步进前，才来到塔门之下，只见一个斑竹帘儿挂在里面。拿的一口刀，精光耀映；眠的一块石，细润无瑕。小小洞门，虽到不得那阿鼻地狱；楞楞妖怪，却就是一个牛头夜叉。那唐僧看见他这般模样，吓得打了一个倒退，遍体酥麻，两腿酸软，就忙的抽身就走。刚刚转了一个身，那妖魔他的灵性着实是强，大撑开着一双金睛鬼眼，叫声：小妖们，你看门外是什么人？一个小妖就伸头望门外一看，看见是个光头的唐僧，连忙跑将进去报说：大王，外面是个和尚哩。",
        "那妖听完，呵声笑说：这叫做个蛇头上苍蝇，自来的衣食。你众小妖们，疾忙追上去，与我拿将来，我这里重重有赏。唐僧见了，虽则是一心忙似箭，两脚走如飞，终是心惊胆颤，腿软脚麻；况且是山路崎岖，林深日暮，步儿哪里移得动：被那些小妖平抬将去。纵然好事多磨障，谁象唐僧西向时？你看那众小妖抬得唐僧，放在那竹帘儿外，欢欢喜喜报声说：大王，拿得和尚进来了。那老妖他也偷眼瞧一瞧，只见唐僧头直上，貌堂堂，果然好一个和尚。他就心中想说：这等好和尚，必是上方人物，不当小可的。妖怪们们大家响响的答应了一声：是！唐僧说：我本是唐朝僧人，奉大唐皇帝敕命，前往西方访求经偈，经过贵山，特来塔下谒圣，不期惊动威严，望乞恕罪。",
        "他却站在高埠上正然观看，只听得草中有人言语，急使杖拨开深草看时，原来是八戒在里面说梦话哩。那八戒冒冒失失的醒来说：兄弟，有甚时候了？沙僧说：快起来，师父说有斋没斋也罢，让你我哪里寻下住处哩。八戒懵懵懂懂的托着钵盂，拑着钉钯，与沙僧一直回来。沙僧埋怨说：都是你这八戒化斋不来，必有妖精拿师父也。他两个寻一会不见，忽见那正南下有金光闪灼，八戒说：兄弟呵，有福的只是有福，你看师父往他家去了。我们还不走动些，也追上去吃些斋儿。沙僧说：哥呵，定不得吉凶哩，我们且去看来。沙僧说：哥呵，这不是什么寺院，是一座妖精洞府也。",
        "再说那八戒、沙僧在门前正等，只见妖魔来得凶险。你道他怎生打扮：青脸红须赤发飘，黄金铠甲亮光饶。一双蓝靛焦觔手，执定追魂取命刀。那黄袍老怪出得门来，就问：你是那方和尚，在我门首吆喝？那妖怪笑说：是是是，有一个唐僧在我家，我也没有怠慢他，安排些人肉包儿与他吃哩。沙僧一把扯住说：哥呵，他哄你哩，你几时又害人哩？八戒却才省悟，抽出钉钯，望妖怪劈脸就筑；那妖怪物侧身躲过，使钢刀急架相迎。两个都显神通，纵云头，跳在空中厮杀。沙僧撇了行李、白马，举宝杖，急急帮攻。"
      ],
      "29": [
        "我已是该死的，走进你家门来也，要吃就吃了罢，又问怎么？我是那国王的第三个公主，乳名叫做百花羞。只因十三年前八月十五日夜，玩月中间，被这妖魔一阵狂风摄将来，与他做了十三年夫妻，在此生儿育女，杳无音信回朝。唐僧说：贫僧原来是差往西天取经者，不期闲步，误撞在此。那公主陪笑说：唐僧宽心，你既是取经的，我救得你。唐僧点头说：女菩萨，若还救得贫僧命，愿做捎书寄信人。唐僧得解脱，捧书在手说：女菩萨，多谢你活命之恩。贫僧这一去，过贵处，定送国王处。公主说：不妨，我父王无子，止生我三个姐妹，若见此书，必有相看之意。",
        "原来是八戒、沙僧与那妖怪在半空里厮杀哩。那妖王听得公主叫唤，就丢了八戒、沙僧，按落云头，揪了钢刀，搀着公主说：浑家，有甚话说？公主说：郎君呵，我才时睡在罗帏之内，梦魂中，忽见个金甲神人。公主说：是我幼时在宫内，对人暗许下一桩心愿：若得招个贤郎驸马，上名山，拜仙府，给和尚饭吃布施。那妖怪说：浑家，你却多心呐，什么打紧之事。公主说：郎君，放他从后门里去罢。妖魔说：奈烦哩，放他去就罢，又管他什么后门前门哩。他于是绰了钢刀，高叫说：那猪八戒，你过来。那八戒与沙僧听见此言，就如鬼门关上放回来的一般，就忙牵马挑担，鼠撺而行。",
        "你看他两个哜哜嘈嘈，埋埋怨怨，唐僧只是解和。也有那太极殿、华盖殿、烧香殿、观文殿、宣政殿、延英殿，一殿殿的玉陛金阶，摆列著文冠武弁；也有那大明宫、昭阳宫、长乐宫、华清宫、建章宫、未央宫，一宫宫的钟鼓管籥，撒抹了闺怨春愁。取经的唐僧，回首大唐肝胆裂；伴师的徒弟，息肩小驿梦魂消。唐僧步行至朝门外，对阁门大使说：有唐朝僧人，特来面驾，倒换文牒，乞为转奏转奏。那黄门奏事官连忙走至白玉阶前奏说：万岁，唐朝有个高僧，欲求见驾，倒换文牒。那国王闻知是唐朝大国，且又说是个方上圣僧，心中甚喜，就时准奏。",
        "唐僧谢了恩，收了文牒，又奏说：贫僧一来倒换文牒，二来与陛下寄有家书。唐僧说：陛下第三位公主娘娘，被碗子山波月洞黄袍妖摄将去，贫僧偶尔相遇，故寄书来也。国王听完，满眼垂泪说：自十三年前不见了公主，两班文武官也不知贬退了多少，宫内宫外大小婢子、太监也不知打死了多少；只说是走出皇宫，迷失路径，无处找寻。上写着：不孝女百花羞顿首百拜大德父王万岁龙凤殿前，暨三宫母后昭阳宫下，及举朝文武贤卿台次：拙女幸托坤宫，感激劬劳万种。正欢娱之间，不觉一阵香风，闪出个金睛蓝面青发魔王，将女擒住，驾祥光，直带至半野山中无人处，难分难辨，被妖倚强，霸占为妻。",
        "国王哭之许久，就问两班文武：那个敢兴兵领将，与我捉获妖魔，救我百花公主？只见那多官齐俯伏奏说：陛下且休烦恼。那妖精原来云来雾去之辈，不得与他觌面相见，何以征救？自古说：来说是非者，就是是非人。可就请这唐僧降妖邪，救公主，庶为万全之策。那国王听完，急回头，就请唐僧说：唐僧若有手段，放法力，捉了妖魔，救我孩儿回朝，也不须上西方拜佛，长发留头，朕与你结为兄弟，同坐龙床，共享富贵怎么？唐僧慌忙启上说：贫僧粗知念佛，其实不会降妖。国王说：你既不会降妖，怎么敢上西天拜佛？那唐僧瞒不过，说出两个徒弟来了。奏说：陛下，贫僧一人，实难到此。",
        "第二个徒弟姓沙，法名沙僧和尚，他生得身长丈二，臂阔三停，脸如蓝靛，口似血盆，眼光闪灼，牙齿排钉。国王说：你既这等样说了一遍，我怕他怎么？那八戒听见来请，对沙僧说：兄弟，你还不教下书哩，这才见了下书的好处。想是师父下了书，国王道，捎书人不可怠慢，一定整治筵宴待他；他的食肠不济，有你我之心，举出名来，故此着金牌来请。沙僧说：哥呵，知道是甚缘故，我们且去来？都说说：这两个和尚貌丑也罢，只是粗俗太甚，怎么见我王更不下拜，喏毕平身，挺然而立？八戒听见说：大家，不要议论，我们是这般：乍看果然有些丑，只是看下些时来，却也耐看。",
        "时有镇殿将军问：唐僧，似这等变得身高，必定长到什么地方，才有止极？那国王大惊说：收了神通罢，晓得是这般变化了。八戒把身一矬，依然现了本相，侍立阶前。国王又问：唐僧此去，有何兵器与他交战？八戒腰里抽出出钯来说：八戒使的是钉钯。我这里有的是鞭、简、瓜、锤，刀、 枪、钺、斧，剑、戟、矛、镰，随你选称手的拿一件去。就命九嫔妃子：将朕亲用的御酒整瓶取来，权与唐僧送行。于是满斟一爵，奉与八戒说：唐僧，这杯酒，聊引奉劳之意。待捉得妖魔，救回小女，自有大宴相酬，千金重谢。那八戒接杯在手，人物虽是粗鲁，行事倒有斯文，对唐僧唱个大喏说：师父，这酒本该从你饮起；但君王赐我，不敢违背，让八戒先吃了，助助兴头，好捉妖怪。",
        "我饶了他师父，怎么又敢复来打我的门？小妖说：想是忘了什么物件，来取的。老怪咄的一声说：胡缠，忘了物件，就敢打上门来？急整束了披挂，绰了钢刀，走出来问：那和尚，我既饶了你师父，你怎么又敢来打上我门？八戒说：你把宝象国三公主骗来洞内，倚强霸占为妻，住了一十三载，也该还他了。你快快进去，自家把绳子绑缚出来，还免得八戒动手。八戒侧身躲过，使钉钯劈面迎来；随后又有沙僧举宝杖追上前齐打。这魔王大钢刀，着头就砍；那八戒九齿钯，对面来迎。他们在那山坡前战经八九个回合，八戒渐渐不济将来，钉钯难举，气力不加。"
      ],
      "30": [
        "再说那妖怪把沙僧捆住，也不来杀他，也没有打他，骂也没有骂他一句。绰起钢刀，心中暗想说：唐僧原来上邦人物，必知礼义，终不然我饶了他性命，又着他徒弟拿我不成？那公主还陪笑脸迎说：郎君有何事这等烦恼？那妖怪咄的一声骂说：你这狗心贱妇，全没人伦。那公主闻说，吓得跪倒在地说：郎君呵，你怎么今日说起这分离的话？那妖怪说：不知是我分离，是你分离哩。我把那唐僧拿来，算计要他受用，你怎么不先告过我，就放了他？原来是你暗地里修了书信，让他替你传寄；不然，怎么这两个和尚又来打上我门，教还你回去？公主说：郎君，你差怪我了，我什么时候有甚书去？",
        "公主说：我父王不是马挣力战的江山，他本是祖宗遗留的社稷。老妖说：既如此说，我变个俊的儿去就罢。按落云头，行至朝门之外，对阁门大使说：三驸马特来见驾，乞为转奏转奏。那黄门奏事官来至白玉阶前奏说：万岁，有三驸马来见驾，现在朝门外听宣。那国王正与唐僧叙话，忽听得三驸马，就问多官说：我只有两个驸马，怎么又有个三驸马？那唐僧心惊说：陛下，妖精呵，不精者不灵。那国王见他耸壑昂霄，以为济世之梁栋，就问他：驸马，你家在哪里居住？那老妖磕头说：陛下，臣是城东碗子山波月洞人家。国王说：三百里路，我公主怎么得到哪里，与你匹配？",
        "其不杀之故，有几句言词，道得甚好，说说：托天托地成夫妇，无媒无证配婚姻。臣听见昔年也有几次取经的，都说是大唐来的唐僧。想是这虎害了唐僧，得了他文引，变作那取经的模样，今在朝中哄骗陛下。说：贤驸马，你怎么认得这和尚是驮公主的老虎？那妖说：陛下，臣在山中，吃的是老虎，穿的也是老虎，与他同眠同起，怎么不认得？国王说：你既认得，可让他现出本相来看。怪物说：借半盏净水，臣就让他现了本相。那妖怪接水在手，纵起身来，走上前，使个黑眼定身法。念了咒语，将一口水望唐僧喷去，叫声：变！那唐僧的真身，隐在殿上，真个变作一只斑斓猛虎。",
        "你看他受用饮酒，至二更时分，醉将上来，忍不住胡为：跳起身，大笑一声，现了本相，陡发凶心，伸开簸箕大手，把一个弹琵琶的女子抓将过来，扢咋的把头咬了一口。吓得那十七个宫娥，没命的前后乱跑乱藏。宫娥悚惧，一似雨打芙蓉笼夜雨；彩女忙惊，就如风吹芍药舞春风。再说那妖怪物坐在上面，自斟自酌。他在里面受用，外面人尽传说：唐僧是个虎精。忽闻人讲唐僧是个虎精，他也心中暗想说：我师父分明是个好人，必然被怪把他变做虎精，害了师父。大师兄去得久了，八戒、沙僧又无音信。他只捱到二更时分，却才跳将起来说：我今若不救唐僧，这功果休矣，休矣！小龙王在半空里，只见银安殿内灯烛辉煌。且等我去戏他一戏，若得手，抓住妖精，再救师父不迟。",
        "那妖魔赶来寻他不见，执了宝刀，拿了满堂红，回上银安殿，照旧吃酒睡觉暂且不说。再说那小龙潜于水底，半个时辰听不见声息，才咬着牙，忍着腿疼跳将起去。踏着乌云，径转馆驿，还变作依旧马匹，伏于槽下。再说那猪八戒从离了沙僧，一头藏在草科里，拱了一个猪浑塘。他见那星移斗转，约不要有三更时分，心中想说：我要回救沙僧，诚然是单丝不线，孤掌难鸣。罢罢罢，我且进城去见了师父，奏准当今，再选些骁勇人马，助着八戒明日来救沙僧罢。那白马认得是八戒，忽然口吐人言，叫声：师兄。这八戒吓了一跌，扒起来，往外要走。被白马探探身，一口咬住皂衣，说：哥呵，你不要怕我。",
        "把我师父变作一个斑斓猛虎，见被众臣捉住，锁在朝房铁笼里面。你两日又不在不知，恐一时伤了性命，只得化龙身去救，不期到朝里，又寻不见师父。及到银安殿外，遇见妖精，我又变做个宫娥模样，哄那妖怪物。那妖怪叫我舞刀他看，于是尔留心，砍他一刀。我又飞刀砍去，他又把刀接了，捽下满堂红，把我后腿上着了一下。八戒说：你挣得动，就挣下海去罢。把行李等八戒挑去高老庄上，回炉做女婿去呀。小龙闻说，一口咬住他直裰子，哪里肯放，止不住眼中滴泪说：师兄呵，你千万休生懒惰。小龙沉吟半晌，又滴泪说：师兄呵，不要说散火的话。小龙说：你趁早儿驾云回上花果山，请大师兄悟空来。",
        "他坐在一块石头崖上，面前有一千二百多猴子，分序排班，口称：万岁，悟空爷爷。八戒说：且是好受用，且是好受用，怪道他不肯做和尚，只要来家哩，原来有这些好处，许大的家业，又有这多的小猴伏侍。若是八戒有这一座山场，也不做什么和尚了。那八戒有些怕他，又不敢明明的见他，却往草崖边溜阿溜的，溜在那一千二三百猴子当中挤着，也跟那些猴子磕头。不知孙悟空坐得高，眼又乖滑，看得他明白，就问：猴群中乱拜的是个夷人，是哪里来的？说不了，那些小猴一窝蜂，把个八戒推将上来，按倒在地。悟空说：我这悟空部下的群猴，都是一般模样。八戒低着头，拱着嘴说：不羞，就拿出这副嘴脸来了。",
        "八戒观之不尽，心里高兴极了说：哥呵，好地方，果然是天下第一名山。八戒笑说：你看师兄说的话，宝山原来洞天福地之处，怎么说度日之言也？只见路旁边有几个小猴，捧着紫巍巍的葡萄，香喷喷的梨枣，黄森森的枇杷，红艳艳的杨梅，跪在路旁边，叫说：悟空爷爷，请进早膳。悟空笑说：我猪弟食肠大，却不是以果子作膳的。八戒说：我虽食肠大，却也随乡入乡是。那八戒恐怕误了救唐僧，只管催促说：哥哥，师父在哪里盼望我和你哩。悟空说：贤弟，请你往水帘洞里去耍耍。八戒坚辞说：多感老兄盛意，奈何师父久等，不劳进洞罢。悟空说：既如此，不敢久留，请就这里奉别。"
      ],
      "31": [
        "再说那八戒被一窝猴子捉住了，扛抬扯拉，把一件直裰子揪破。口里劳劳叨叨的，自家念诵说：罢了，罢了，这一去有个打杀的情了。那悟空坐在石崖之上，骂说：你这囊糠的夯货！八戒跪在地下说：哥呵，我没有骂你；若骂你，就嚼了舌头根。八戒说：哥呵，我晓得你贼头鼠脑的，一定又变作个什么东西儿，跟着我听的。悟空叫：小妖们，选大棍来，先打二十个见面孤拐，再打二十个背花，然后等我使铁棒与他送行。八戒慌忙磕头说：哥哥，千万看师父面上，饶了我罢。八戒又说：哥哥，不看师父呵，请看海上菩萨之面，饶了我罢。悟空见说起菩萨，却有三分儿转意说：兄弟，既这样看来，我且不打你。",
        "八戒又思量说：请将不如激将，等我激他一激。说：哥呵，不说你还好哩，只为说你，他一发无状。八戒说：我说：妖精，你不要无礼，不要害我师父。我还有个大师兄，叫做悟空，他神通广大，善能降妖，他来时让你死无葬身之地。那妖怪听完，越加忿怒，骂说：是个什么悟空，我可怕他？悟空听完，就气得抓耳挠腮，暴躁乱跳说：是那个敢这等骂我？八戒说：哥哥息怒，是那黄袍怪这等骂来，我故学与你听也。我五百年前大闹天宫，普天的神将看见我，一个个控背躬身，口口称呼悟空。你只去拿了妖精，报了你仇，那时来与不来，任从意思。慌忙那群猴拦住说：悟空爷爷，你往哪里去？",
        "公主听完，忙忙走出洞门来，只见悟空提着两个孩子，站在那高崖之上，想要往下掼。慌忙那公主大声说：那汉子，我与你没甚相干，怎么把我儿子拿去？我有个师弟沙僧在你洞里，你去放他出来，我把这两个孩儿还你。那公主听完，急往里面，喝退那几个把门的小妖，亲动手，把沙僧解了。沙僧说：公主，你不要解我，恐你那妖怪来家，问你要人，带累你受气。公主说：唐僧呵，你是我的恩人，你替我折辩了家书，救了我一命，我也留心放你。不期洞门之外，你有个大师兄孙悟空来了，叫我放你哩。那沙僧一闻孙悟空的三个字，好就似醍醐灌顶，甘露滋心；一面天生喜，满腔都是春；也不似听见个人来，就如拾着一方金玉一般。",
        "八戒笑说：哥哥，你但干事，就左我们。八戒说：这两个孩子被你抓来，已此吓破胆了，这一会声都哭哑，再一会必死无疑。我们拿他往下一掼，掼做个肉子，那妖怪追上肯放？悟空说：他若扯你，你两个就与他打将这里来。这里有战场宽阔，我在此等候打他。那公主说：你这和尚，全无信义：你说放了你师弟，就与我孩儿，怎么你师弟放去，把我孩儿又留，反来我门首做甚？悟空笑说：公主呵，为人生在天地之间，怎么就是得罪？公主说：我自幼在宫，曾受父母教训。只因这妖精将我摄骗在此，他的法令又谨，我的步履又难，路远山遥，无人可传音信。",
        "那妖魔气得乱跳说：罢了，罢了，我儿被他掼杀了，已是不可活也。只好拿那和尚来与我儿子偿命报仇罢，浑家，你且不要哭。悟空说：我不怎么，只是舍不得孩儿，哭得我有些心疼。妖魔说：不打紧，你请起来，我这里有件宝贝，只在你那疼上摸一摸儿，就不疼了。悟空听完，心中暗笑说：这泼怪，倒也老实，不动刑法，就自家供了。等他拿出宝贝来，我试弹他一弹，看他是个什么妖怪。那妖怪携着悟空，一直行到洞里深远密闭之处。这件物不知打了多少坐工，炼了几年磨难，配了几转雌雄，炼成这颗内丹舍利。那猴子拿将过来，哪里有什么疼处，特故意摸了一摸，一指头弹将去。",
        "那妖怪说：我虽见你眼熟，一时间却想不起姓名，你果是谁？我是唐僧的大徒弟，叫做孙悟空悟空。我抓住唐僧时，止知他有两个徒弟，叫做猪八戒、 沙僧，何曾见有人说个姓孙的？你不知是哪里来的个怪物，到此骗我。悟空说：我没有同他二人来，是我师父因我惯打妖怪，杀伤甚多，他是个慈悲好善之人，将我逐回，故没有同他一路行走。那妖怪说：你好不丈夫呵，既受了师父赶逐，却有什么嘴脸又来见人？悟空说：你这个泼怪，岂知一日为师，终身为父？那个猪八戒尖着嘴，有些会说老婆舌头，你怎听他？快快将头伸过来，等我打一棍儿当茶。",
        "一个惯行手段为魔主，一个广施法力保唐僧。猛烈的猴王添猛烈，英豪的怪物长英豪。死生不顾空中打，都为唐僧拜佛遥。悟空心中暗喜说：这个泼怪，他那口刀倒也抵得住我的这根棒。好猴王，双手举棍，使一个高探马的势子。悟空大惊说：我儿呵，不禁打，就打得不见了。果是打死，好道也有些脓血，怎么没一毫踪影？急纵身跳在云端里看处，四边更无动静。我晓得了，那妖怪说有一些认得我，想必不是凡间的怪，多是天上来的精。慌忙那庞、 刘、苟、毕，张、陶、邓、辛等众，两边躬身控背，不敢拦阻，让他打入天门，直至通明殿下。早有张、葛、许、丘四大天师问：悟空何来？",
        "只听得半空中八戒、沙僧大声说：师兄，有妖精，留几个儿我们打耶。沙僧说：既把妖精打绝，无甚挂碍，将公主引入朝中去罢。那公主只听见耳内风响，霎时间直接回到城里，他三人将公主带上金銮殿上。那公主才启奏说：多亏孙唐僧法力无边，降了黄袍怪，救奴回国。悟空说：陛下的驸马是上界的奎星，令爱原来侍香的玉女，因思凡降落人间。那妖怪被我上天宫启奏玉帝，玉帝查得他四卯不到，下界十三日，就是十三年了。那国王谢了悟空的恩德，就吩咐：看你师父去来。悟空笑说：师父呵，你是个好和尚，怎么弄出这般个恶模样来也？八戒说：哥呵，救他救儿罢，不要只管揭挑他了。"
      ],
      "32": [
        "话说唐僧复得了悟空，师徒们一心同体，共诣西方。自宝象国救了宫主，承君臣送出城西。唐僧说：徒弟们仔细，前遇山高，恐有虎狼阻挡。悟空说：师父，出家人不要说在家话。唐僧勒回马说：我当年奉旨出长安，只忆西来拜佛颜。悟空闻说，笑呵呵说：师要身闲，有何难事？巅峰岭上，采药人寻思怕走；削壁崖前，打柴夫寸步难行。唐僧勒马观山，正在难行之处，只见那绿莎坡上，伫立着一个樵夫。你道他怎生打扮：头戴一顶老蓝毡笠，身穿一领毛皂衲衣。",
        "那樵子：正在坡前伐朽柴，忽逢唐僧自东来。对唐僧大声说：那西进的唐僧，暂停片时，我有一言奉告：此山有一伙毒魔狠怪，专吃你东来西去的人哩。唐僧听完，魂飞魄散，战兢兢坐不稳雕鞍，急回头，忙呼徒弟说：你听那樵夫报说：此山有毒魔狠怪。悟空说：师父放心，等我去问他一个端的。好悟空，拽开步，径上山来，对樵子叫声大哥，道个行礼问候。樵夫答礼说：唐僧呵，你们有甚缘故来此？悟空说：不瞒大哥说，我们是东土差来西天取经的。适蒙见教，说有什么毒魔狠怪，故此我来奉问一声：那魔是几年之魔，怪是几年之怪？樵子听完，仰天大笑说：你原来是个风和尚。",
        "他却暗想：我若把功曹的言语实实告诉师父，师父他不济事，必就哭了；假若不与他实说，梦着头，带着他走，常言说：乍入芦圩，不知深浅。且等我照顾八戒一照顾，先着他出头与那妖怪打一仗看。若是打得过他，就算他一功；若是没手段，被怪拿去，等我再去救他不迟，却好显我本事出名。正自家计较，以心问心说：只恐八戒躲懒，就不肯出头，师父又有些护短。好悟空，你看他弄个虚头，把眼揉了一揉，揉出些泪来。八戒看见，连忙叫：沙僧，歇下担子，拿出行李来，我两个分了罢。八戒说：分了罢，你往流沙河还做妖怪，八戒往高老庄上盼盼浑家。",
        "唐僧说：你且休胡谈，待我问他一声，看是怎么说话。问：悟空，有甚话当面计较，你怎么自家烦恼？悟空说：师父呵，刚才那个报信的是日值功曹，他说妖精凶狠，这里难行，果然的山高路峻，不能前进，改日再去罢。唐僧听完，恐惶悚惧，扯住他虎皮裙子说：徒弟哑，我们三停路已走了停半，为什么说退悔之言？悟空说：我没个不尽心的，但只恐魔多力弱，行势孤单。唐僧说：徒弟呵，你也说得是，果然一个人也难。我这里还有八戒、沙僧，都是徒弟，凭你调度使用，或为护将帮手，协力同心，扫清山径，领我过山，却不都还了正果？那悟空这一场扭捏，只逗出唐僧这几句话来。",
        "那八戒慌忙爬将起来，口里乱嚷说：有妖怪，有妖怪，把我戳了一枪去了，嘴上好不疼呀。他说：蹭蹬呵，我又没甚喜事，怎么嘴上挂了红耶？忽抬头往上看时，原来是个啄木虫，在半空中飞哩。八戒咬牙骂说：这个亡人，弼马温欺负我罢了，你也来欺负我。他一定不认我是个人，只把我嘴当一段黑朽枯烂的树，内中生了虫，寻虫儿吃的，将我啄了这一下也。悟空又飞来，着耳根后又啄了一下。八戒慌忙爬起来说：这个亡人，却打搅得我狠。悟空说：这夯货大睁着两个眼，连自家人也认不得。好悟空，摇身又一变，还变做个蟭蟟虫，钉在他耳朵后面，不离他身上。",
        "那八戒入深山，又行有四五里，只见山凹中有桌面大的四四方方三块青石头。悟空暗笑说：这八戒，石头又不是人，又不会说话，又不会还礼的，唱他喏怎么，可不是个瞎帐？原来那八戒把石头当着唐僧、沙僧、悟空三人，朝着他演习哩。他说：我这回去，见了师父，若问有妖怪，就说有妖怪。他问什么山，我若说是泥捏的、土做的、锡打的、铜铸的、面蒸的、 纸糊的、笔画的，他们见说我呆哩，若讲这话，一发说呆了。他问什么门，再说是钉钉的铁叶门。他问里边有多远，只说入内有三层。十分再搜寻，问门上钉子多少，只说八戒心忙记不真。那八戒捏合了，拖着钯，直接回到本路。",
        "悟空说：朝着石头唱喏，当做我三人，对他一问一答，可是么？又说：等我编得谎儿停当，哄那弼马温去。那八戒连忙只是磕头说：师兄，我去巡山，你不要成跟我去听的？八戒慌了说：那个哭丧棒重，擦一擦儿皮塌，挽一挽儿筋伤；若打五下，就是死了。八戒说：哥哥哑，只是这一遭儿，以后再不敢了。八戒说：爷爷哑，半棍儿也禁不得。八戒没有别的办法，扯住师父说：你替我说个方就儿。但如今过山少人使唤，悟空，你且饶他，待过了山。悟空说：古人云：顺父母言情，呼为大孝。你看他奔上大路，疑心生暗鬼，步步只疑是悟空变化了跟住他，故见一物，就疑是悟空。",
        "金角说：兄弟，你有些性急，且不要忙着。你若走出门，不管好歹，但是和尚就拿将来，假如不是唐僧，却也不敢当子。你可拿去，但遇着和尚，以此照验照验。再说八戒运拙，正行处，可可的撞见群魔，当面挡住说：那来的什么人？八戒才抬起头来，掀着耳朵，看见是些妖魔，他就慌了，心中暗说：我若说是取经的和尚，他就捞了去。旁边有听着指点说话的说：大王，这个和尚，像这图中猪八戒模样。八戒看见，大惊说：怪道这些时没精神哩，原来是他把我的影神传将来也。小妖用枪挑着，银角用手指说：这骑白马的是唐僧，这毛脸的是悟空。……八戒听见说：城隍，没我就也罢了，猪头三牲，清醮二十四分。"
      ],
      "33": [
        "再说那妖怪将八戒拿进洞去，说：哥哥呵，拿将一个来了。老魔说：兄弟，错拿了，这个和尚没用。八戒就绰经说说：大王，没用的和尚，放他出去罢。虽然没用，也是唐僧一起的，叫做猪八戒。八戒听言说：蹭蹬呵，撞着个贩腌腊的妖怪了。那小妖把八戒抬进去，抛在水里暂且不说。悟空说：师父呵，此山若是有怪，他半步难行，一定虚张声势，跑将回来报我。唐僧说：假若真个去了，却在哪里相会？你把马打动一些，我们定追上他，一同去罢。真个唐僧上马，沙僧挑担，悟空前面引路上山。再说那老怪又唤二魔说：兄弟，你既拿了八戒，一定就有唐僧。",
        "众怪上前说：大王，怎么长他人之志气，灭自己之威风？二魔说：悟空神通广大，那唐僧吃他不成。众怪说：大王，你没手段，等我们着几个去报大大王，教点起本洞大小兵来，摆开阵势，合力齐心，怕他走了哪里去？二魔说：你们没有见他那条铁棒，有万夫不当之勇。妖怪们说：这样看来，唐僧吃不成，却不把猪八戒错拿了？二魔说：拿就也没有错拿，送就也不好轻送。唐僧终是要吃，只是眼下还尚不能。我看见那唐僧只可善图，不可恶取。妖怪们说：大王如定计拿他，可用我们？二魔说：你们都各回本寨，但不许报与大王知道；若是惊动了他，必然走了风汛，败了我计策。",
        "唐僧说：也罢，也罢，我还走得路，将马让与你骑一程，到你上宫，还我马去罢。那妖怪说：师父，感蒙厚情，只是腿胯跌伤，不能骑马。叫沙僧：你把行李捎在我马上，你驮他一程罢。那妖怪急回头，抹了他一眼，说：师父呵，我被那猛虎吓怕了，见这晦气色脸的师父，愈加惊怕，不敢要他驮。那妖就认定了悟空，顺顺的要他驮，再不言语。悟空听了，口中笑说：你这个泼魔，怎么敢来惹我？你这般鬼话儿，只好瞒唐僧，又好来瞒我？那魔听见悟空口中念诵，说：师父，我是好人家儿孙，做了道士。今日不幸，遇着虎狼之厄，我不是妖怪。悟空说：你既怕虎狼，怎么不念北斗经？",
        "这悟空慌忙把头偏一偏，压在左肩臂上，笑说：我的儿，你使什么重身法来压我哩？悟空又把头偏一偏，压在右肩臂上。看他挑着两座大山，飞星来赶师父。那魔头看见，就吓得浑身是汗，遍体生津说：他却会担山。又整性情，把真言念动，将一座泰山遣在空中，劈头压住悟空。那悟空力软觔麻，遭逢他这泰山下顶之法，只压得三尸神咋，七窍喷红。好妖魔，使神通压倒悟空，却疾驾长风，去赶唐僧，就于云端里伸下手来，马上挝人。慌忙个沙僧丢了行李，抽出出降妖棒，当头挡住。那妖怪山前大显能，一心要捉唐僧。那魔十分凶猛，使口宝剑，流星的解数滚来，把个沙僧战得软弱难搪，回头要走。",
        "但悟空虽是有山压住，也须要作个法，怎么拿他来凑蒸，才好哩。若要拿悟空，不消我们动身，只教两个小妖，拿两件宝贝，把他装将来罢。二魔说：拿我的紫金红葫芦，你的羊脂玉净瓶。二魔说：差精细鬼、伶俐虫二人去。吩咐说：你两个拿着这宝贝，径至高山绝顶，将底儿朝天，口儿朝地，叫一声：悟空。二小妖磕头，将宝贝领出去拿悟空暂且不说。再说那悟空被魔使法压住在山根之下，遇苦思唐僧，逢灾念圣僧。厉声叫说：师父呵，想当时你到两界山，揭了压帖，我脱了大难，秉教沙门。感菩萨赐与法旨，我和你同住同修，同缘同相，同见同知。",
        "就如官府发放一般，那神仙们念动真言咒语，把山仍遣归本位，放起悟空。悟空跳将起来，抖抖土，束束裙，耳后抽出出棒来，叫山神、土地：都伸过孤拐来，每人先打两下，与我散散闷。神仙们大惊说：刚才悟空已吩咐，恕我们之罪，怎么出来就变了言语要打？悟空说：好土地，好山神，你道不怕我，却怕妖怪？土地说：那魔神通广大，法术高强，念动真言咒语，拘唤我们在他洞里，一日一个轮流当值哩。仰面朝天，高声大叫说：苍天，苍天！那悟空正感叹间，又见那山凹里霞光焰焰而来。悟空说：山神、土地，你既在这洞中当值，那放光的是甚物件？",
        "我二大王有些法术，遣了三座大山，把他压在山下，寸步难移，让我两个拿宝贝来装他的。精细鬼说：我的是红葫芦，他的是玉净瓶。悟空见说，心中暗惊说：利害，利害！悟空笑说：二位，你把宝贝借我看看。那小妖那知什么诀窍，就于袖中拿出两件宝贝，双手递与悟空。悟空见了，心中暗喜说：好东西，好东西。我若把尾子一抉，飕的跳起走了，只当是送我。复递与他去说：你还没有见我的宝贝哩。好悟空，伸下手，把尾上毫毛拔了一根，捻一捻，叫：变！就变做一个一尺七寸长的大紫金红葫芦，自腰里拿将出来说：你看我的葫芦么？那伶俐虫接在手，看了说：师父，你这葫芦长大，有样范，好看，却只是不合用。",
        "那精细鬼交了葫芦，伶俐虫拿出净瓶，一齐儿递与悟空。既换了宝贝，却又干事找绝：脐下拔一根毫毛，吹口仙气，变作一个铜钱。叫说：小童，你拿这个钱去买张纸来。你将这两件装人的宝贝换了我一件装天的宝贝，恐人心不平，向后去日久年深，有甚反悔不就，故写此各执为照。小妖说：这里又无笔墨，写甚文书？小妖说：我两件装人之宝，贴换你一件装天之宝，若有反悔，一年四季遭瘟。悟空笑说：我是决不反悔；如有反悔，也照你四季遭瘟。说了誓，将身一纵，把尾子趬了一趬，跳在南天门前，谢了哪咤太子麾旗相助之功。这悟空伫立霄汉之间，观看那个小妖。"
      ],
      "34": [
        "再说那两个小妖将假葫芦拿在手中，争看一会，忽抬头不见了悟空。伶俐虫说：哥呵，神仙也会打诳语。精细鬼说：我们相应就宜的多哩，他敢去得成？拿过葫芦来，等我装装天，也试演试演看。不要是悟空假变神仙，将假葫芦换了我们的真的去耶？精细鬼说：不要胡说，悟空是那三座山压住了，怎生得出？拿过来，等我念他那几句咒儿装了看。这怪也把葫芦儿望空丢起，口中念说：若有半声不肯，就上灵霄殿上，动起刀兵。两妖说：不装，不装，一定是个假的。正嚷处，孙悟空在半空里听得明白，看得真实，恐怕他弄得时辰多了，紧要处走了风汛，将身一抖，把那变葫芦的毫毛收上身来，弄得那两个妖四手皆空。",
        "他问我们哪里去，我们答说：拿悟空去。那神仙听见说悟空，他也恼他，要与我们帮工。是我们没有叫他帮工，却将拿宝贝装人的情由，与他说了。老魔听说，暴躁如雷说：罢了，罢了，这就是悟空假妆神仙骗哄去了。那猴头神通广大，处处人熟，不知那个毛神放他出来，骗去宝贝。叵耐那猴头着然无礼，既有手段，就走了也罢，怎么又骗宝贝？我若没本事拿他，永不在西方路上为怪。二魔说：还有七星剑与芭蕉扇在我身边，那一条幌金绳，在压龙山压龙洞老母亲哪里收着哩。如今差两个小妖去请母亲来吃唐僧肉，就让他带幌金绳来拿悟空。二人说：好运气，好运气，打也没有打，骂也没有骂，却就饶了。",
        "孙悟空见了，不敢进去，只在二门外仵着脸，脱脱的哭起来，你道他哭怎么，不要成是怕他？就怕也就不哭，况先哄了他的宝贝，又打死他的小妖，却为什么而哭？只为想起唐僧取经的苦恼，他就泪出痛肠，放眼就哭。心却想说：我既显手段，变做小妖，来请这老怪，没有个直直的站了说话之理，一定见他磕头才是。我为人做了一场好汉，止拜了三个人：西天拜佛祖；南海拜观音；两界山师父救了我，我拜了他四拜。到此际也没及奈何，撞将进去，朝上跪下说：奶奶磕头。悟空说：平顶山莲花洞，蒙二位大王有令，差来请奶奶去吃唐僧肉，教带幌金绳，要拿悟空哩。",
        "悟空连忙答应说：他叫做巴山虎，我叫做倚海龙。悟空暗想说：可是晦气，经倒没有取得，且来替他做皂隶。好猴王，把他那幌金绳搜出来，笼在袖里，欢喜说：那泼魔纵有手段，已此三件儿宝贝姓孙了。却又拔两根毫毛变做个巴山虎、倚海龙；又拔两根变做两个抬轿的；他却变做老奶奶模样，坐在轿里。不多时，到了莲花洞口，那毫毛变的小妖具在前说：开门！内有把门的小妖开了门说：巴山虎、倚海龙来了？悟空听得，暗喜说：好运气，也轮到我为人了。我先变小妖，去请老怪，磕了他一个头；这番来，我变老怪，是他母亲，定行四拜之礼，虽不怎么，好道也赚他两个头儿。",
        "那八戒听见慌了说：遭瘟的，你来为割我耳朵的，我喊出来不好听呵。吓得个老魔头魂飞魄散，众群精噬指摇头。老魔说：兄弟，把唐僧与沙僧、八戒、白马、行李都送还那悟空，闭了是非之门罢。如今似你这等怕惧悟空的诡谲，就具送去还他，真所谓畏刀避剑之人，岂大丈夫之所为也？我闻你说悟空神通广大，我虽与他相会一场，却没有与他比试。假若他三战胜我不过，唐僧还是我们之食；如三战我不能胜他，那时再送唐僧与他未迟。妖怪们抬出披挂，二魔结束齐整，执宝剑，出门外，叫声：悟空，你往哪里走此时悟空已在云端里，听见叫他名字，急回头观看，原来是那二魔。",
        "好悟空，一只手使棒，架住他的宝贝；一只手把那绳执起，刷喇的扣了魔头。他认得是自家的宝贝，就念松绳咒，把绳松动，就脱出来，反望悟空抛将去，却早扣住了悟空。悟空正要使瘦身法，想要脱身，却被那魔念动紧绳咒，紧紧扣住，怎能得脱？那妖怪将绳一扯，扯将下来，照光头上砍了七八宝剑。那魔说：这猴子，你这等头硬，我不砍你；且带你回去，再打你。悟空说：我拿你什么宝贝，你问我要？又把绳子牵着，带至洞里说：兄长，拿将来了。老魔一见，认得是悟空，满面喜笑说：是他，是他。真个把悟空拴住，两个魔头却进后面堂里饮酒。那悟空在柱根下爬蹉，忽惊动八戒。",
        "悟空已变做小妖，上前说：猪八戒撺道悟空教变化走了罢，他不肯走，在哪里吆喝哩。二魔说：还说猪八戒老实，原来这等不老实，该打二十多嘴棍。八戒说：你打轻一些；若重了一些，我又喊起，我认得你。悟空说：我变化，也只为你们，你怎么倒走了风息？八戒说：你虽变了头脸，还没有变得屁股，那屁股上两块红不是？悟空随往后面，演到厨中，锅底上摸了一把，将两臀擦黑，行至前边。八戒看见，又笑说：那个猴子去哪里混了这一会，弄做个黑屁股来了。真个甚有见识：走上厅，对那妖怪扯个腿子说：大王，你看那悟空拴在柱上，左右爬蹉，磨坏那根金绳，得一根粗壮些的绳子换将下来才好。",
        "真身却变做个蟭蟟虫儿，钉在那葫芦口边。只见那二魔揭起帖子看时，悟空早已飞出。倚海龙却是原去请老奶奶的那个小妖，他变了，站在旁边。那老魔扳着葫芦口张了一张，见是个半截身子动耽，他也不认真假，慌忙叫：兄弟，盖上，盖上，还没有化得了哩。悟空在旁边暗笑说：不知我已在此矣。那老魔拿了壶，满满的斟了一杯酒，近前双手递与二魔说：贤弟，我与你递个钟儿。二魔说：兄长，我们已吃了这半会酒，又递甚钟？老魔说：你抓住唐僧、八戒、沙僧犹可，又索了悟空，装了者行孙，如此功劳，该与你多递几钟。二魔见哥哥恭敬，怎敢不接，但一只手托着葫芦，一只手不敢去接，却把葫芦递与倚海龙，双手去接杯。"
      ],
      "35": [
        "老魔大惊说：贤弟，不好了，惹动他一窝风了。幌金绳现拴着悟空，葫芦里现装著者行孙，怎么又有个什么悟空孙？我这葫芦装下一千人哩，我才装了者行孙一个，又怕那什么悟空孙？你看那二魔拿着个假葫芦，还像前番，雄纠纠，气昂昂，走出门高呼说：你是那魔说：你且过来，我不与你相打，但我叫你一声，你敢应么？悟空笑说：你叫我，我就应了；我若叫你，你可应么？那魔说：我叫你，是我有个宝贝葫芦，可以装人；你叫我，却有何物？悟空就于袖中拿出葫芦说：泼魔，你看。那魔见了，大惊说：他葫芦是哪里来的？他就正色叫说：悟空孙，你那葫芦是哪里来的？",
        "那妖怪说：不要说雌雄，但只装得人的，就是好宝贝。悟空说：你也说得是，我就让你先装。那妖怪甚喜，急纵身跳将起去，到空中，执着葫芦，叫一声：悟空孙。悟空听得，却就不歇气，连应了八九声，只是不能装去。那魔坠将下来，跌脚捶胸说：天那！悟空笑说：你且收起，轮到我该叫你哩。急纵筋斗，跳起去，将葫芦底儿朝天，口儿朝地，照定妖魔，叫声：银角大王。倏的装在里面，被悟空贴上太上老君急急如律令奉敕的帖子。心中暗喜说：我的儿，你今日也来试试新了。那山上都是些洼踏不平之路，况他又是个圈盘腿，拐呀拐的走着，摇的那葫芦里漷漷索索，响声不绝。",
        "正嚷处，只见前门外一个小妖报说：悟空孙又骂上门来了。那老魔又大惊说：这个家伙轻我无人。叫：小妖们，且把猪八戒照旧吊起，查一查还有几件宝贝。管家的小妖说：洞中还有三件宝贝哩。管家的说：还有七星剑、芭蕉扇与净瓶。老魔说：那瓶子不合用：原是叫人，人应了就装得，转把个口诀儿教了那悟空，倒把自家兄弟装去了。老魔将芭蕉扇插在后项衣领，把七星剑提在手中，又点起大小群妖有三百多名，都教一个个拈枪弄棒，理索抡刀。那老魔急令小妖摆开阵势，骂说：你这猴子，十分无礼。悟空骂说：你这讨死的怪物，你一个妖精的性命舍不得。",
        "那三百余精一齐拥上，把悟空围在垓心。那小妖都有手段，越打越上，一似绵絮缠身，搂腰扯腿，不要肯退后。悟空慌了，就使个身外身法，将左胁下毫毛拔了一把，嚼碎喷去，喝声叫：变！你看他长的使棒，短的抡拳，再小的没处下手，抱着孤拐啃觔，把那小妖都打得星落云散，齐声喊说：大王呵，事不谐矣，难矣乎哉！被这身外法把群妖打退，止撇得老魔围困中间，赶得东奔西走，出路无门。那魔慌了，将左手擎着宝剑，右手伸于项后，拿出芭蕉扇子，望东南丙丁火，正对离宫，唿喇的一扇子扇将下来只见那就地上，火光焰焰。那妖怪物着实无情，一连扇了七八扇子，熯天炽地，烈火飞腾。",
        "悟空见此恶火，却也心惊胆颤，道声：不好了，我本身可处，毫毛不济，一落这火中，岂不真如燎毛之易？他的真身，捻着避火诀，纵筋斗，跳将起去，脱离了大火之中，径奔他莲花洞里，想着要救师父。原来都是他分身法打伤了的，都在这里声声唤唤，忍疼而立。悟空见了，按不住恶性凶顽，抡起铁棒，一路打将进去。又见那内面有火光焰焰，吓得他手慌脚忙说：罢了，罢了，这火从后门口烧起来，我却难救师父也。他正了性，往里视之，原来羊脂玉净瓶放光，却自心中欢喜说：好宝贝耶！那瓶子曾是那小妖拿在山上放光，我得了，不想那妖怪又复搜去。你看他窃了这瓶子，喜喜欢欢，且不救师父，急抽身往洞外而走。",
        "那悟空早已跳出门前，将扇子撒在腰间，双手抡开铁棒，与那魔抵敌。悟空喝妖魔：你好不知趣，徒弟要与我争，累卵焉能击石碎？致令金火不相投，五行拨乱伤和气；扬威耀武显神通，走石飞沙弄本事。这悟空才按落云头，闯入莲花洞里，解下唐僧与八戒、沙僧来。他三人脱得灾危，谢了悟空，却问：妖魔哪里去了？悟空说：二魔已装在葫芦里，想是这会子已化了。概洞小妖，被我分身法打死一半；还有些败残回的，又被我杀绝。唐僧谢之不尽说：徒弟呵，多亏你受了劳苦。猪八戒说：师兄，你把那葫芦儿拿出来与我们看看。悟空先将净瓶解下，又将金绳与扇子拿出，然后把葫芦儿拿在手说：不要看，不要看。",
        "我身边还有这口七星剑，欲会你们女兵，都去压龙山后，会借外家亲戚，断要抓住那悟空报仇。说不了，有门外小妖报说：大王，山后老舅爷帅领若干兵卒来也。因听见哨山的妖兵报道，他姐姐被悟空打死，假变姐形，盗了外甥宝贝，连日在平顶山拒敌，他就帅本洞妖兵二百余名，特来助阵，故此先拢姐家问信。这悟空却教沙僧整顿早斋，吃了走路。悟空大惊，急抽身，忙呼八戒说：兄弟，妖精又请救兵来也。唐僧听完，惊恐失色说：徒弟，似此怎么？悟空将葫芦、净瓶系在腰间，金绳笼于袖内，芭蕉扇插在肩后，双手抡着铁棒。那妖怪物摆开阵势，只见当头的是阿七大王。",
        "正赌斗间，沙僧撞近过来，举杖就打。那妖怪只道是自家败残的小妖呼叫，就回头应了一声。飕的装将进去，被悟空贴上太上老君急急如律令奉敕的帖子。只见那七星剑坠落尘埃，也归了悟空。八戒迎着说：哥哥，宝剑你得了，精怪何在？悟空笑说：了了，已装在我这瓶儿里也。当时通扫净诸邪，回至洞里，与唐僧报喜说：山已净，妖已无矣，请师父上马走路。正行处，猛见路旁边闪出一个瞽者，走上前，扯住唐僧马说：和尚，哪里去？八戒大惊说：罢了，这是老妖来讨宝贝了。悟空仔细观看，原来是太上李老君，慌忙近前施礼说：老官儿，哪里去？"
      ],
      "36": [
        "再说悟空按落云头，对师父备言菩萨借童子，老君收去宝贝之事。唐僧在那马上高叫：徒弟呵，你看哪里山势崔巍，须是要仔细堤防，恐又有魔障侵身也。悟空说：师父不要胡思乱想，只要定性存神，自然无事。唐僧说：徒弟呀，西天怎么这等难行？悟空听完，呵呵笑说：早哩，早哩，还没有出大门哩。悟空说：兄弟，我们还在堂屋里转哩。悟空说：兄弟，若依我看时，把这青天为屋瓦，日月作窗棂，四山五岳为梁柱，天地犹如一敞厅。八戒听说说：罢了，罢了，我们只当转些时回去罢。悟空说：不必乱谈，只管跟着我走路。好悟空，横担了铁棒，领定了唐僧，剖开山路，一直前进。",
        "孙悟空听完，呵呵冷笑说：师父不必挂念，少要心焦，且自放心前进，还你个那唐僧在马上遥观，只见那山凹里有楼台叠叠，殿阁重重。悟空跳在空中，仔细观看，果然是座山门。孙悟空按下云头，报与唐僧说：师父，果然是一座寺院，却好借宿，我们去来。这唐僧放开马，一直过来，径到了山门之外。唐僧说：我的马蹄才然停住，脚尖还未出镫，就问我是什么寺，好没分晓。悟空说：你老人家自幼为僧，须曾讲过儒书，才去演经法，文理皆通，然后受唐王的恩宥。我才面西催马，被那太阳影射，奈何门虽有字，又被尘垢朦胧，所以未曾看见。悟空听完，把腰儿躬一躬，长了二丈余高，用手展去灰尘，说：师父，请看。",
        "唐僧见了，点头长叹说：我那东土，若有人也将泥胎塑这等大菩萨，烧香供养呵，我弟子也不去西天去矣。那壁上都是良工巧匠装塑的那些虾、鱼、蟹、鳖，出头露尾，跳海水波潮耍子。唐僧又点头三五度，感叹万千声说：可怜呵！那道人忽见唐僧相貌稀奇，丰姿非俗，急趋步上前施礼说：师父哪里来的？唐僧说：弟子是东土大唐驾下差来，上西天拜佛求经的。那道人说：师父不要怪，我做不得主，我是这里扫地、撞钟、打勤劳的道人。那道人急到方丈报说：老爷，外面有个人来了。那僧官就起身，换了衣服，按一按毘卢帽，披上袈裟，急开门迎接，问道人：哪里人来？",
        "常言说：既在佛会下，都是有缘人。好悟空，按一按顶上金箍，束一束腰间裙子，执着铁棒，径到大雄宝殿上，指着那三尊佛像说：你本是泥塑金装假像，内里岂无感应？我保领大唐圣僧往西天拜佛求取真经，今晚特来这里投宿，趁早与我报名；假若不留我们，就一顿棍打碎金身，让你还现本相泥土。这悟空正在前边发狠，捣叉子乱说，只见一个烧晚香的道人点了几枝香，来佛前炉里插。被悟空咄的一声，吓了一跌；爬起来看见脸，又是一跌；吓得滚滚蹡蹡，跑入方丈里，报说：老爷，外面有个和尚来了。道人说：老爷，这个和尚比那个和尚不同：生得恶躁，没脊骨。",
        "道人说：是个圆眼睛，查耳朵，满面毛，雷公嘴。手执一根棍子，咬牙狠狠的，要寻人打哩。悟空追上，扑的打破门扇，说：赶早将干净房子打扫一千间，我睡觉。僧官躲在房里，对道人说：怪他生得丑么，原来是说大话折作的这般嘴脸。我这里连方丈、佛殿、钟鼓楼、两廊，共总也不上三百间，他却要一千间睡觉，却打哪里来？道人说：师父，我也是吓破胆的人了，凭你怎么答应他罢。那僧官战索索的高叫说：那借宿的唐僧，我这小荒山不方就，不敢奉留，往别处去宿罢。悟空将棍子变得盆来粗细，直壁壁的竖在天井里，说：和尚，不方就，你就搬出去。",
        "忽抬头，只见方丈门外有一个石狮子，却就举起棍来，乒乓一下，打得粉乱麻碎。那和尚在窗眼儿里看见，就吓得骨软觔麻，慌忙往床下拱；道人就往锅门里钻，口中不住叫：爷爷，棍重，棍重，禁不得，方就，方就！僧官战索索的说：前后是二百八十五房头，共有五百个有度牒的和尚。悟空说：你快去把那五百个和尚都点得齐齐整整，穿了长衣服出去，把我那唐朝的师父接进来，就不打你了。僧官说：爷爷，若是不打，就抬也抬进来。僧官大声说人：你不要说吓破了胆，就是吓破了心，就也去与我叫这些人来，接唐僧老爷爷来。钟鼓一齐响处，惊动了两廊大小僧众，上殿问：这早还不晚哩，撞钟打鼓做甚？",
        "僧官说：老爷是上国钦差，小和尚有没有远迎接。僧官说：徒弟，这个爷爷好的吃荤。悟空说：我们也吃素，都是胎里素。那和尚说：爷爷呀，这等凶汉也吃素？有一个胆量大的和尚，近前又问：老爷既然吃素，煮多少米的饭方彀吃？唐僧称谢说：老院主，打搅宝山了。僧官说：老爷不要忙，小和尚自有区处。僧官吩咐说：你们着两个去安排草料，与唐老爷喂马。着几个去前面把那三间禅堂，打扫干净铺设床帐，快请老爷安歇。悟空见了，唤那办草料的道人，将草料抬来，放在禅堂里面，拴下白马，教道人都出去。唐僧欠身说：大家请回，贫僧好自在安寝也。",
        "唐僧说：就此就是安置了，都就请回。唐僧举步出门小解，只见明月当天，叫：徒弟。悟空听完，近前答说：师父呵，你只知月色光华，心怀故里，更不知月家之意，原来先天法象之规绳也。月至三十日，阳魂之金散尽，阴魄之水盈轮，故纯黑而无光，原来说：晦。至十六日一阴生，二十二日二阴生，此时魂中魄半，其平如绳，故说：下弦。沙僧在旁边笑说：师兄此言虽当，只说的是弦前属阳，弦后属阴，阴中阳半，得水之金；更不说：水火相搀各有缘，全凭土母配如然。八戒上前扯住唐僧说：师父，不要听乱讲，误了睡觉。吃饭嫌我肚子大，拿碗又说有黏涎。"
      ],
      "37": [
        "淅淅潇潇飞落叶，飘飘荡荡卷浮云。纯时松竹敲清韵，猛处江湖波浪浑；刮得那山鸟难栖声哽哽，海鱼不定跳喷喷；东西馆阁门窗脱，前后廊房神鬼瞋；佛殿花瓶吹堕地，琉璃摇落慧灯昏；香炉攲倒香灰迸，烛架歪斜烛焰烟。那唐僧昏梦中听着风声一时过处，又听见禅堂外隐隐的叫一声师父！唐僧欠身说：你不要是魍魉妖魅、神怪邪魔，至夜深时，来此戏我？那人倚定禅堂说：师父，我不是妖魔鬼怪，亦不是魍魉邪神。唐僧说：你既不是此类，却深夜来此何为？只见他：头戴一顶冲天冠，腰束一条碧玉带，身穿一领飞龙舞凤赭黄袍，足踏一双云头绣口无忧履，手执一柄列斗罗星白玉珪。",
