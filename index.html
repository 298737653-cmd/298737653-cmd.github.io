    for (const lecture of journeyLectures) {
      const details = journeyExpansionDetails[lecture.no];
      if (!details || details.length !== lecture.paragraphs.length) continue;
      lecture.paragraphs = lecture.paragraphs.flatMap((paragraph, index) => [paragraph, details[index]]);
    }
    /* JOURNEY_DATA_END */

    const libraries = {
      pokemon: {
        key: "pokemon",
        title: "宝可梦逐集剧情",
        subtitle: "无印篇 · 关都篇＋橘子群岛篇 · 第1—116集",
        unit: "集",
        items: episodes,
        searchPlaceholder: "搜索标题、地点、人物或宝可梦",
        storage: {
          episode: "pokemonEpisodeGuide.currentEpisode",
          paragraph: "pokemonEpisodeGuide.currentParagraph",
          completed: "pokemonEpisodeGuide.completed"
        },
        kicker: item => `${item.no <= 80 ? "关都地区" : "橘子群岛篇"} · 第${item.no}集`,
        metaLeft: "地点路线",
        metaRight: "主要人物与宝可梦",
        metaRightValue: item => `${item.people}；${item.pokemon}`,
        source: `剧情按电视动画原始集序整理；技能名称以动画明确表现及常用中文译名为准。参考：<a href="https://www.tv-tokyo.co.jp/anime/pokemon/poke_en/epi_en/enepi/" target="_blank" rel="noopener">东京电视台动画档案</a>。`
      },
      journey: {
        key: "journey",
        title: "西游记亲子故事",
        subtitle: "依照原著一百回 · 完整100讲",
        unit: "讲",
        items: journeyLectures,
        searchPlaceholder: "搜索标题、地点或人物",
        storage: {
          episode: "journeyStory.currentLecture",
          paragraph: "journeyStory.currentParagraph",
          completed: "journeyStory.completed"
        },
        kicker: item => `《西游记》原著第${item.no}回 · 第${item.no}讲`,
        metaLeft: "故事地点",
        metaRight: "主要人物",
        metaRightValue: item => item.people,
        source: `故事依照吴承恩《西游记》原著一百回的顺序，为低龄亲子共读改写；保留主要人物与事件，并降低部分惊吓和暴力描写。原著参考：<a href="https://zh.wikisource.org/wiki/西游記" target="_blank" rel="noopener">维基文库《西游记》</a>。`
      }
    };

    function loadCompleted(storageKey) {
      try {
        return new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));
      } catch {
        return new Set();
      }
    }

    let activeLibraryKey = localStorage.getItem("storyShelf.activeLibrary") || "pokemon";
    if (!libraries[activeLibraryKey]) activeLibraryKey = "pokemon";

    const states = Object.fromEntries(Object.values(libraries).map(library => [library.key, {
      episode: Math.min(library.items.length, Math.max(1, Number(localStorage.getItem(library.storage.episode) || 1))),
      paragraph: Math.max(0, Number(localStorage.getItem(library.storage.paragraph) || 0)),
      completed: loadCompleted(library.storage.completed),
      query: ""
    }]));

    const episodeList = document.getElementById("episodeList");
    const reader = document.getElementById("reader");
    const search = document.getElementById("search");

    function currentLibrary() {
      return libraries[activeLibraryKey];
    }

    function currentState() {
      return states[activeLibraryKey];
    }

    function save() {
      const library = currentLibrary();
      const state = currentState();
      localStorage.setItem(library.storage.episode, String(state.episode));
      localStorage.setItem(library.storage.paragraph, String(state.paragraph));
      localStorage.setItem(library.storage.completed, JSON.stringify([...state.completed]));
    }

    function currentEpisode() {
      const library = currentLibrary();
      const state = currentState();
      return library.items.find(item => item.no === state.episode) || library.items[0];
    }

    function renderLibraryChrome() {
      const library = currentLibrary();
      const state = currentState();
      document.body.dataset.library = library.key;
      document.title = `${library.title}｜亲子故事书架`;
      document.getElementById("libraryTitle").textContent = library.title;
      document.getElementById("librarySubtitle").textContent = library.subtitle;
      search.placeholder = library.searchPlaceholder;
      search.value = state.query;
      document.getElementById("storyMark").className = `storyMark ${library.key === "pokemon" ? "ball" : "journeyMark"}`;
      document.querySelectorAll("[data-library]").forEach(button => {
        button.classList.toggle("active", button.dataset.library === library.key);
        button.setAttribute("aria-pressed", String(button.dataset.library === library.key));
      });
    }

    function renderProgress() {
      const library = currentLibrary();
      const state = currentState();
      const count = state.completed.size;
      document.getElementById("progressTitle").textContent = count ? `已读完 ${count} ${library.unit}` : "准备出发";
      document.getElementById("progressCount").textContent = `${count}/${library.items.length}`;
      document.getElementById("progressMeter").style.width = `${Math.round(count / library.items.length * 100)}%`;
      document.getElementById("continueBtn").textContent = `继续第${state.episode}${library.unit} · 第${state.paragraph + 1}段`;
    }

    function renderList() {
      const library = currentLibrary();
      const state = currentState();
      const query = state.query.trim().toLowerCase();
      const matches = library.items.filter(item => !query || [item.title, item.original, item.locations, item.people, item.pokemon, item.summary].filter(Boolean).join(" ").toLowerCase().includes(query));
      episodeList.innerHTML = matches.map(item => `
        <button class="episodeCard ${item.no === state.episode ? "active" : ""} ${state.completed.has(item.no) ? "done" : ""}" data-episode="${item.no}">
          <span class="episodeNo">${item.no}</span>
          <span>
            <span class="episodeTitle">第${item.no}${library.unit} ${item.title}</span>
            <span class="episodeSummary">${item.summary}</span>
          </span>
        </button>
      `).join("") || `<div class="empty">没有找到相关内容</div>`;

      episodeList.querySelectorAll("[data-episode]").forEach(button => {
        button.addEventListener("click", () => openEpisode(Number(button.dataset.episode), true));
      });
    }

    function renderReader() {
      const library = currentLibrary();
      const state = currentState();
      const item = currentEpisode();
      state.paragraph = Math.min(state.paragraph, item.paragraphs.length - 1);
      reader.innerHTML = `
        <button class="mobileBack" id="mobileBack" aria-label="返回目录">←</button>
        <p class="kicker">${library.kicker(item)}</p>
        <h2 class="readerTitle">${item.title}</h2>
        ${item.original ? `<p class="originalTitle">原著回目：${item.original}</p>` : ""}
        <p class="readerSummary">${item.summary}</p>
        <div class="metaRow">
          <div class="meta"><strong>${library.metaLeft}</strong><span>${item.locations}</span></div>
          <div class="meta"><strong>${library.metaRight}</strong><span>${library.metaRightValue(item)}</span></div>
        </div>
        <div class="story">
          ${item.paragraphs.map((paragraph, index) => `
            <article class="paragraph ${index === state.paragraph ? "current" : ""}" id="p${index}" data-paragraph="${index}">
              <span class="paraNo">${index + 1}</span>
              <p>${paragraph}</p>
              <button class="markBtn" data-mark="${index}">记住这里</button>
            </article>
          `).join("")}
        </div>
        <div class="navRow">
          <button class="navBtn" id="prevEpisode">上一${library.unit}</button>
          <button class="navBtn primary" id="finishEpisode">读完本${library.unit}</button>
          <button class="navBtn" id="nextEpisode">下一${library.unit}</button>
        </div>
        <p class="sourceNote">${library.source}</p>
      `;

      document.getElementById("mobileBack").addEventListener("click", closeReader);
      document.getElementById("prevEpisode").addEventListener("click", () => openEpisode(Math.max(1, item.no - 1), true));
      document.getElementById("nextEpisode").addEventListener("click", () => openEpisode(Math.min(library.items.length, item.no + 1), true));
      document.getElementById("finishEpisode").addEventListener("click", finishEpisode);
      reader.querySelectorAll("[data-mark]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        markParagraph(Number(button.dataset.mark));
      }));
      reader.querySelectorAll("[data-paragraph]").forEach(block => block.addEventListener("click", () => markParagraph(Number(block.dataset.paragraph))));
    }

    function openEpisode(number, resetParagraph) {
      const state = currentState();
      state.episode = number;
      if (resetParagraph) state.paragraph = 0;
      save();
      renderList();
      renderProgress();
      renderReader();
      document.body.classList.add("reading");
      requestAnimationFrame(() => {
        const target = document.getElementById(`p${state.paragraph}`);
        if (target) target.scrollIntoView({ block: "center" });
      });
    }

    function closeReader() {
      document.body.classList.remove("reading");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function markParagraph(index) {
      const state = currentState();
      state.paragraph = index;
      save();
      renderProgress();
      renderReader();
      const target = document.getElementById(`p${index}`);
      if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
    }

    function finishEpisode() {
      const library = currentLibrary();
      const state = currentState();
      state.completed.add(state.episode);
      if (state.episode < library.items.length) {
        state.episode += 1;
        state.paragraph = 0;
      }
      save();
      renderList();
      renderProgress();
      renderReader();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    search.addEventListener("input", event => {
      const state = currentState();
      state.query = event.target.value;
      renderList();
    });
    document.getElementById("continueBtn").addEventListener("click", () => openEpisode(currentState().episode, false));
    document.querySelectorAll("[data-library]").forEach(button => {
      button.addEventListener("click", () => {
        const nextKey = button.dataset.library;
        if (!libraries[nextKey] || nextKey === activeLibraryKey) return;
        activeLibraryKey = nextKey;
        localStorage.setItem("storyShelf.activeLibrary", activeLibraryKey);
        document.body.classList.remove("reading");
        renderLibraryChrome();
        renderList();
        renderProgress();
        renderReader();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
    window.addEventListener("popstate", closeReader);

    renderLibraryChrome();
    renderList();
    renderProgress();
    renderReader();
  </script>
</body>
