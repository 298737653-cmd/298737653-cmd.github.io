        "妇人说：那个家伙毒药最狠：药倒人，三日之间，骨髓具烂。女子说：你既会走路，听我说：这里到哪里有千里之遥。追到空中谢说：老姆从何来指让我也？老姆说：我才自龙华会上回来，见你师父有难，假做孝妇，借夫丧之名，免他一死。悟空止不住脚，近前叫说：毘蓝婆菩萨，行礼问候了。那菩萨就下榻，合掌回礼说：悟空，没有远迎了。毘蓝婆说：你当年大闹天宫时，普地里传了你的形像，谁人不知，那个不识？悟空说：近能脱命，保师父唐僧上西天取经，师父遇黄花观道士，将毒药茶药倒。悟空说：我是个地里鬼，不管哪里，自家都会访着。",
        "悟空忍不住说：老姆误了我，早知是绣花针，不须劳你，就问我要一担也是有的。毘蓝说：你那绣花针，无非是钢铁金针，用不得。早望见金光艳艳，就回向毘蓝说：金光处就是黄花观也。毘蓝随于衣领里拿出一个绣花针，似眉毛粗细，有五六分长短，拈在手，望空抛去。悟空却同按下云头，走入观里，只见那道士合了眼，不能举步。毘蓝扯住说：悟空不要打，且看你师父去。悟空径至后面客位里看时，他三人都睡在地上吐痰吐沫哩。那菩萨袖中拿出一个破纸包儿，内将三粒红丸子递与悟空，教放入口里。悟空把药扳开他们牙关，每人揌了一丸。八戒发狠说：这个家伙既与蜘蛛为姐妹，定是妖精。"
      ],
      "74": [
        "唐僧正然行处，忽见一座高山，峰插碧空，真个是摩星碍日。唐僧心中害怕，叫悟空说：你看前面这山十分高耸，但不知有路通行否？悟空笑说：师父说什么话，自古说：山高自有客行路，水深自有渡船人。唐僧听完，喜笑花生，扬鞭策马而进，径上高岩。远远的站在那山坡上高呼：西进的唐僧，且暂住骅骝，紧兜玉勒。悟空近前搀起说：不要怕，不要怕，有我哩。唐僧说：你听那高岩上老者报道这山上有伙妖魔，吃尽阎浮世上人，谁敢去问他一个真实端的？唐僧说：你的相貌丑陋，言语粗俗，怕冲撞了他，问不出个实信。悟空笑说：我变个俊一些的去问他。",
        "悟空笑说：据你之言，似有护他之意，必定与他有亲，或是紧邻契友；公公说：那妖精一封书到灵山，五百阿罗都来迎接；悟空听完，忍不住呵呵大笑，用手扯着老者说：不要说，不要说。公公说：你这小和尚胡说，不敢当子。悟空笑说：实不瞒你说，我小和尚祖居傲来国花果山水帘洞，姓孙，名悟空。一时怒发，将金箍棒打伤鬼判，吓倒阎王，几乎掀翻了森罗殿。吓得那掌案的判官拿纸，十阎王签名画字，让我饶他打，情愿与我做后生小厮。悟空说：官儿，似我这般大也勾了。我把旧嘴脸拿出来你看看，你却不要怪。悟空说：我小和尚果然有七十二副嘴脸哩。",
        "若论赌变化，使促掐，捉弄人，我们三五个也不如师兄；八戒说：他不知怎么钻过头不顾尾的问了两声，不尴不尬的就跑回来了。好八戒，把钉钯撒在腰里，整一整皂直裰，扭扭捏捏，奔上山坡，对老者叫说：公公，唱喏了。那老人家见悟空回去，方拄着杖挣得起来，战战兢兢的要走，忽见八戒，愈觉惊怕说：爷爷呀！八戒笑说：你这老公公不藏兴，有一些好褒贬人。那老者见他说出人话来，只得开言问他：你是哪里来的？八戒说：我是唐僧第二个徒弟，法名叫做悟能八戒。才自先问的，叫做悟空悟空，是我师兄。师父怪他冲撞了公公，没有问得实信，所以特着我来拜问。",
        "悟空说：这个呆根，我问信偏不惊恐，你去问就这等慌张失智。八戒说：这老人家说：此山叫做八百里狮驼山。唐僧听完，战兢兢，毛骨悚然说：悟空，怎么是好？我比你不同，我问的是实，决无虚谬之言。若论满山满谷之魔，只消我一路棒，半夜打个罄尽。八戒说：不羞，不羞，不要说大话。那些妖精点卯也得七八日，怎么就打得罄尽？八戒说：凭你抓倒，捆倒，使定身法定倒，也没有这等快的。悟空笑说：不用什么抓、 拿、捆缚。八戒说：哥哥，若是这等赶面打，或者二更时也都了了。沙僧在旁边笑说：师父，有大师兄恁样神通，怕他怎么？唐僧见他们讲论手段，没奈何，只得宽心上马而走。",
        "忽失声说：错了，错了，不该放这金星老人家去了．他原来恐吓我。他就出来跳风玩耍，必定拈枪弄棒，操演武艺，怎么没有一个？悟空暗笑说：他必是个铺兵，想是送公文下报帖的。好悟空，捻着诀，念个咒，摇身一变，变做个苍蝇儿，轻轻飞在他帽子上，侧耳听之。只见那小妖走上大路，敲着梆，摇着铃，口里作念说：我们巡山的，各人要谨慎堤防悟空，他会变苍蝇。悟空听完，暗自惊疑说：这个家伙看见我了？若未看见，怎么就知我的名字，又知我会变苍蝇？悟空不知，反疑他看见，就要拿出棒来打他，却又停住，暗想说：曾记得八戒问金星时，他说老妖三个，小妖有四万七八千名。",
        "就说：你且放下衣走过，等我拿牌儿你看。就转身，插下手，将尾巴梢儿的小毫毛拔下一根，捻他把，叫：变！就变做个金漆牌儿，也穿上个绿绒绳儿，上书三个真字，原来总钻风。小妖大惊说：我们都叫做个小钻风，偏你又叫做个什么总钻风。悟空干事找绝，说话合宜，就说：你实不知。那妖听完，就忙唱喏说：长官，长官，新点出来的，实是面生，言语冲撞，不要怪。悟空还着礼笑说：怪就不怪你，只是一件：见面钱却要哩，每人拿出五两来罢。小妖说：长官不要忙，待我向南岭头会了我这一班的人，一总打发罢。悟空到边前，把尾巴掬一掬，跳上去，坐在峰尖儿上。",
        "那些小钻风在下面躬身说：长官，伺候。悟空说：你可知大王点我出来之故？悟空说：大王要吃唐僧，只怕悟空神通广大，说他会变化，只恐他变作小钻风，来这里屣着路径，打探消息，把我升作总钻风，来查勘你们这一班可有假的？小钻风连声应说：长官，我们具是真的。悟空说：你既是真的，大王有甚本事，你可晓得？若说差了一一些，就是假的，我定拿去见大王处治。那小钻风见他坐在高处，弄獐弄智，呼呼喝喝的，没奈何，只得实说说：我大王神通广大，本事高强，一口曾吞了十万天兵。悟空闻说，吐出一声说：你是假的。小钻风慌了说：长官老爷，我是真的，怎么说是假的？",
        "好悟空，想着：那老魔没有与我会面，就知我的名头，我且倚着我的这个名头，仗着威风，说些大话，吓他一吓看。心问口，口问心，思量此计，敲着梆，摇着铃，一直闯到狮驼洞口。早被前营上小妖挡住说：小钻风来了？走至二层营里，又被小妖扯住说：小钻风来了？妖怪们说：你今早巡风去，可曾撞见什么悟空么？悟空说：撞见的，正在哪里磨杠子哩。悟空说：他蹲在那涧边，还似个开路神；手里拿着一条铁棒，就似碗来粗细的一根大杠子，在那石崖上抄一把水，磨一磨，口里又念着：杠子呵，这一向没有拿你出来显显神通，这一去就有十万妖精，也都替我打死，等我杀了那三个魔头祭你。"
      ],
      "75": [
        "他就着那涧崖石上，抄一把水，磨一磨，口里又念一声，说他那杠子到此还没有显个神通，他要磨明，就来打大王。那老魔闻此言，浑身是汗，吓得战呵呵的说：兄弟，我说不要惹唐僧。他徒弟神通广大，预先作了准备，磨棍打我们，却怎生是好？妖怪们乒乓把前后门尽皆牢拴紧闭。悟空自心惊说：这一关了门，他再问我家长里短的事，我对不来，却不弄走了风，被他抓住？且再吓他一吓，让他开着门，好跑。悟空说：他说拿大大王剥皮，二大王剐骨，三大王抽筋。我这洞里，递年家没个苍蝇，但是有苍蝇进来，就是悟空。悟空暗笑说：就变个苍蝇吓他一吓，好开门。",
        "干净他不宜笑，这一笑笑出原嘴脸来了。却被那第三个老妖魔跳上前，一把扯住说：哥哥，险一些被他瞒了。三怪说：刚才这个回话的小妖不是小钻风，他就是悟空。必定撞见小钻风，不知是他怎么打杀了，却变化来哄我们哩。就把手摸摸，对老怪说：我怎么是悟空？老怪一发认实说：兄弟，不要屈了他。他才子闪着身笑了一声，我见他就露出个雷公嘴来。见我扯住时，他又变作个这等模样。三怪把悟空扳翻倒，四马攒蹄捆住。原来悟空有七十二般变化，若是变飞禽、走兽、花木、器皿、昆虫之类，却就连身子滚去了；但变人物，却只是头脸变了，身子变不过来。",
        "正此凄怆，忽想起：菩萨当年在蛇盘山曾赐我三根救命毫毛，不知有无，且等我寻一寻看。忽喜说：身上毛都如彼软熟，只此三根如此硬枪，必然是救我命的。就咬着牙，忍着疼，拔下毛，吹口仙气，叫：变！一根就变作金钢钻，一根变作竹片，一根变作绵绳。喜说：好运气，好运气，却好出去也。好悟空，收了毫毛，将身一小，就变做个蟭蟟虫儿，十分轻巧，细如须发，长似眉毛，自孔中钻出且还不走，径飞在老魔头上钉着。那老魔正饮酒，猛然放下杯儿说：三弟，悟空这回化了么？老魔喝说：胡说，宝贝原来阴阳二气之全功，怎么轻了？内中有一个勉强的小妖，把瓶提上来说：你看这不轻了？",
        "悟空在他头上，也忍不住道一声我的儿呵，飕者走也。那悟空将身一抖，收了剥去的衣服，现本相，跳出洞外，回头骂说：妖精不要无礼。瓶子钻破，装不得人了，只好拿来出恭。那唐僧正在哪里撮土为香，望空祷祝。那唐僧合掌朝天说：祈请云霞众位仙，六丁六甲与诸天。悟空笑说：师父，才这一去，一则是东土众生有缘有分，二来是师父功德无量无边，三也亏弟子法力。唐僧感谢不尽说：你这番没有与妖精赌斗么？悟空是个好胜的人，叫喊说：我怎么保你过山不得？唐僧说：没有与他见个胜负，只这般含糊，我怎敢前进。唐僧说：寡不敌众，是你一人也难处。",
        "悟空说：有风方起浪，无潮水自平。老魔说：你这等雄纠纠的嚷上我门，不要不是要打么？悟空听完，叫：猪八戒走过，看他把我怎么？老魔说：你过来，先与我做个桩儿，让我尽力气着光头砍上三刀，就让你唐僧过去；假若禁不得，快送你唐僧来，与我做一顿下饭。悟空听完笑说：妖怪，你洞里若有纸笔，拿出来，与你立个合同。唐僧还恐不坚固，预先又上紫金箍。老魔说：猴儿不要说嘴，看我这二刀来，决不容你性命。悟空笑说：这妖精没眼色，把我认做个瓢头哩。那老魔举刀又砍，悟空把头迎一迎，乒乓的劈做两半个。猪八戒远远望见，笑说：老魔好砍两刀的，却不是四个人了？",
        "好悟空，就把身搂上来，打个滚，依然一个身子，抽出棒劈头就打。那老魔举刀架住说：泼猴无礼，什么样个哭丧棒，敢上门打人？悟空喝说：你若问我这条棍，天上地下都有名声。他说：棒是九转镔铁炼，老君亲手炉中。成形变化要飞腾，飘飖五色霞光现。粗如南岳细如针，长短随我心意变。轻轻举动彩云生，亮亮飞腾如闪电。曾将此棍闹天宫，威风打散蟠桃宴。棍打诸神没躲藏，天兵十万都逃窜。雷霆众将护灵霄，飞身打上通明殿。整整挨排五百年，亏了南海菩萨劝。",
        "八戒害怕，急抽身往草里一钻，也管不得荆针棘刺，也顾不得刮破头疼，战兢兢的在草里听着梆声。随后悟空赶到，那妖怪也张口来吞，却中了他的机关，收了铁棒，迎将上去，被老魔一口吞之。吓得个八戒在草里囊囊咄咄的埋怨说：这个弼马温，不识进退。那妖怪来吃你，你如为什么不走，反去迎他！那魔得胜而去，这八戒才钻出草来，溜回旧路。再说唐僧在那山坡下正与沙僧盼望，只见八戒喘呵呵的跑来。唐僧大惊说：八戒，你怎么这等狼狈？八戒哭哭起来啼说：师兄被妖精一口吞下肚去了。唐僧听言，吓倒在地，半晌间跌脚拳胸说：徒弟呀，只说你善会降妖，领我西天见佛，怎知今日死于此怪之手。",
        "我保唐僧取经，从广里过，带了个折叠锅儿，进来煮杂碎吃。那二魔大惊说：哥呵，这猴子他干得出来。三魔说：哥呵，吃了杂碎也罢，不知在哪里支锅？悟空笑说：没事，等我把金箍棒往顶门里一搠，搠个窟窿：一则当天窗，二来当烟洞。把我那药酒拿来，等我吃几钟下去，把猴儿药杀了罢。悟空暗笑说：我五百年前大闹天宫时，吃老君丹、玉皇酒、王母桃及凤髓龙肝，那样东西我没有吃过？老魔接在手中，悟空在肚里就听见酒香，说：不要与他吃。好悟空，把头一扭，变做个喇叭口子，张在他喉咙之下。那妖怪嘓的咽下，被悟空嘓的接吃了。第二钟咽下，被悟空嘓的又接吃了。"
      ],
      "76": [
        "话表孙悟空在老魔肚里支我一会，那魔头倒在尘埃，无声无气，若不言语，想是死了，却又把手放放。魔头回过气来，叫一声：大慈大悲齐天悟空菩萨。悟空听见说：儿子，不要废工夫，省几个字儿，只叫孙外公罢。还请悟空慈悲，可怜蝼蚁贪生之意，饶了我命，愿送你师父过山也。他见妖魔哀告，好奉承的人，也就回了善念，叫说：妖怪，我饶你，你怎么送我师父？老魔说：我这里也没什么金银、 珠翠、玛瑙、珊瑚、琉璃、琥珀、玳瑁珍奇之宝相送。悟空笑说：既是抬轿相送，强如要宝。那三魔走近前，悄悄的对老魔说：大哥，等他出来时，把口往下一咬，将猴儿嚼碎，咽下肚，却不得磨害你了。",
        "他却跳出营外，去那空阔山头上，落下云，双手把绳尽力一扯，老魔心里才疼。他害疼，往上一挣，悟空复往下一扯。众小妖远远看见，齐声高叫说：大王，不要惹他，让他去罢。慌忙那二怪、三怪一齐按下云头，上前扯住绳儿，跪在坡下，哀告说：悟空呵，只说你是个宽洪海量之仙，谁知是个鼠腹蜗肠之辈。悟空笑说：你这伙泼魔，十分无礼。那妖怪一齐磕头说：悟空慈悲，饶我性命，愿送老师父过山。悟空笑说：你要性命，只消拿刀把绳子割断罢了。老魔说：爷爷哑，割断外边的，这里边的拴在心上，喉咙里又的恶心，怎生是好？悟空说：既如此，张开口，等我再进去解出绳来。",
        "这是孙悟空掩样的法儿，使毫毛拴着他的心，收了毫毛，所以就不害疼也。三个妖纵身而起，谢说：悟空请回，上覆唐僧，收拾下行李，我们就抬轿来送。悟空收绳子，径转山东，远远的看见唐僧睡在地下打滚痛哭，猪八戒与沙僧解了包袱，将行李搭分儿，在哪里分哩。悟空暗暗嗟叹说：不消讲了，这定是八戒对师父说我被妖精吃了，师父舍不得我，痛哭；沙僧听见，报怨八戒说：你是个棺材座子──专一害人。八戒说：我分明看见他被妖精一口吞了。悟空到跟前，一把挝住八戒脸，一个巴掌打了个踉跄说：夯货！八戒侮着脸说：哥哥，你实是那妖怪吃了，你、你怎么又活了？",
        "那蓝旗手急报说：大王，有一个长嘴大耳朵的和尚来了。他两个在山坡前搭上手，斗不上七八回合，八戒手软，架不得妖魔，急回头叫：师兄，不好了，扯扯救命索，扯扯救命索。这那边悟空听完，转把绳子放松了，抛将去。被妖精追上，捽开鼻子，就如蛟龙一般，把八戒一鼻子卷住，得胜回洞。这坡下唐僧看见，又恼悟空说：悟空，怪不得悟能咒你死哩，原来你兄弟全无相亲相爱之意，专怀相嫉相妒之心。他那般说，让你扯扯救命索，你怎么不扯，还将索子丢去？悟空笑说：师父也忒护短，忒偏心。罢了，像我拿去时，你略不挂念，左右是舍命之材；",
        "死是一定死，只等一日，这妖精连我师父们都拿来，会一会，就都了帐也。悟空暗笑说：也罢，我这批上有三十个人，都在这中前后，等我拘将来就你，就有一日耽阁。八戒说：可怜呵，出家人哪里有什么盘缠？悟空说：若无盘缠，索了去，跟着我走。我晓得你这绳儿叫做追命绳，索上就要断气。八戒说：可怜，可怜，我自做了和尚，到如今，有些善信的人家给和尚饭吃，见我食肠大，衬钱比他们略多一些，我拿了攒在这里，零零碎碎有五钱银子。悟空暗笑说：这八戒裤子也没得穿，却藏在哪里？八戒说：在我左耳朵眼儿里揌着哩。悟空听完，就伸手在耳朵窍中摸出，真个是块马鞍儿银子，足有四钱五六分重。",
        "拿在手里，忍不住哈哈的一声大笑。那八戒认是悟空声音，在水里乱骂说：天杀的弼马温，到这们苦处，还来打诈财物哩。悟空又笑说：我把你这糟的，我保师父，不知受了多少苦难，你到攒下私房。八戒骂说：买命钱让与你罢，好道也救我出去是。悟空说：后门里走，可是个长进的？好悟空，把铁棒一路丢开解数，打将出去。只看见二门下靠着的是他的钉钯，走上前，推开小妖，捞过来往前乱筑，与悟空打出三四层门，不知打杀了多少小妖。那老魔听见，对二魔说：拿得好人，拿得好人。你看悟空劫了猪八戒，门上打伤小妖也。他两个在洞门外，这一场好杀：黄牙老变人形，义结狮王为弟兄。",
        "真个八戒举钯柄，走一步，打一下；悟空牵着鼻子：就似两个象奴，牵至坡下。只见唐僧凝睛盼望，见他两个嚷嚷闹闹而来，就唤：沙僧，你看悟空牵的是什么？沙僧见了，笑说：师父，大师兄把妖精揪着鼻子拉来，真爱杀人也。你且问他：他若喜喜欢欢送我们过山，可饶了他，不要伤他性命。沙僧急纵前迎着，高声叫说：师父说：那妖怪果送师父过山，教不要伤他命哩。那妖怪闻说，连忙跪下，口里呜呜的答应。原来被悟空揪着鼻子，捏了，就如重伤风一般。叫说：唐老爷，若肯饶命，就抬轿相送。悟空说：我师徒具是善胜之人，依你言，且饶你命。",
        "急回头观看，原来是三魔双手举一柄画杆方天戟，往悟空头上打来；悟空急翻身爬起，使金箍棒劈面相迎。他两个各怀恼怒，气呼呼，更不打话；又见那老魔头传号令，举钢刀就砍八戒；八戒慌忙丢了马，抡着钯，向前乱筑。那十六个小妖却遵号令，各各效能：抢了白马、行囊，把唐僧一拥，抬着轿子，径至城边，高叫说：大王爷爷定计，已拿得唐僧来了。那城上大小妖精，一个个跑下，将城门大开。吩咐各营卷旗息鼓，不许呐喊筛锣。说：大王原有令在前，不许吓了唐僧。唐僧禁不得恐吓，一吓就肉酸，不合吃了。妖怪们都欢天喜地邀唐僧，控背躬身接主僧。"
      ],
      "77": [
        "当时如悟空闹天宫，十万天兵也拿他不住者，以他会驾筋斗云，一去有十万八千里路，所以诸神不能追上。所以被他一把挝住，拿在手中，左右挣挫不得。就使变化法遁法，又往来难行：变大一些，他就放松了挝住；复拿了直接回到城内，放了手，捽下尘埃，吩咐群妖，也照八戒、沙僧捆在一处。这一番倒不是捆住悟空，分明是与他送行。此时有二更时候，众怪一齐相见毕，把唐僧推下殿来。那唐僧于灯光前，忽见三个徒弟都捆在地下，老师父伏于悟空身边，哭说：徒弟呵，常时逢难，你却在外运用神通，到哪里取救降魔；八戒、沙僧听见师父这般苦楚，就也一齐放声痛哭。",
        "悟空微微笑说：师父放心，兄弟不要哭，凭他怎么，决然无伤。悟空笑说：不要说是麻绳捆的，就是碗粗的棕缆，只也当秋风过耳，何足罕哉？师徒们正说处，只听见那老魔说：三贤弟有力量，有智谋，果成妙计，拿将唐僧来了。八戒听见，战兢兢的说：哥哥，你听，那妖精计较要蒸我们吃哩。悟空说：不要怕，等我看他是雏儿妖精，是把势妖精。说不了，又听得二怪说：猪八戒不好蒸。八戒慌了，厉声喊说：不要剥皮，粗自粗，汤响就烂了。老怪说：不好蒸的，安在底下一格。悟空笑说：八戒不要怕，是雏儿，不是把势。悟空说：大凡蒸东西，都从上边起。",
        "只见那云端里一朵乌云，应声高叫说：北海小龙敖顺磕头。将有三更尽时，只听见老魔发放说：手下的，我们用计劳形，拿了唐僧师徒四人；悟空在云端里明明听着这等吩咐，却低下云头，不听见笼里人声。好悟空，踏着云，摇身一变，变作一个黑苍蝇儿，钉在铁笼格外听时，只听见八戒在里面说：晦气，晦气，不知是闷气蒸，又不知是出气蒸哩。沙僧说：二哥，怎么叫做闷气、出气？八戒说：闷气蒸是盖了笼头，出气蒸不盖。唐僧在浮上一层应声说：徒弟，没有盖。八戒说：好运气，今夜还不得死，这是出气蒸了。悟空听得他三人都说话，未曾伤命，就就飞了去，把个铁笼盖轻轻儿盖上。",
        "悟空笑说：八戒不要嚷，我来救你。八戒说：哥呵，救就要脱根救，不要又要复蒸笼。悟空却揭开笼头，解了师父，将假变的毫毛抖了一抖，收上身来；却又念声咒语，发放了龙神，才对八戒说：我们这去到西天，还有高山峻岭。悟空曾养过马，授弼马温之官，又是自家一伙，所以不跳不叫。我们西去还有国王，须要关文，才去得；唐僧说：我记得进门时，众怪将行李放在金殿左手下，担儿也在那一边。就抽身跳在宝殿寻时，忽见光彩飘飖。以唐僧的锦襴袈裟上有夜明珠，故此放光。急到前，见担儿原封未动，连忙拿了去，付与沙僧挑着。八戒牵着马，他引了路，径奔正阳门。",
        "慌忙众怪一齐呐喊，都叫：快拿唐僧！这一片喊声振起，把些前前后后、大大小小妖精，都惊起来，刀枪簇拥，至正阳门下。问外边巡夜的说：唐僧从哪里走了？急追到后宰门，封锁、 梆铃，一如前门。那唐僧吓得脚软觔麻，跌下墙来，被老魔抓住。二魔捉了沙僧，三魔擒倒八戒，妖怪们抢了行李、白马，只是走了悟空。那八戒口里嘓嘓哝哝的报怨悟空说：天杀的，我说要救就脱根救，如今却又复笼蒸了。二怪吩咐把八戒绑在殿前檐柱上，三怪吩咐把沙僧绑在殿后檐柱上；此物比不得那愚夫俗子，拿了可以当饭；此是上邦稀奇之物，必须待天阴闲暇之时，拿他出来，整制精洁，猜枚行令，细吹细打的吃方可。",
        "忽见沙僧绑在后檐柱上，就近前摸着他胸脯子叫说：沙僧。沙僧也识得声音，说：师兄，你变化进来了？悟空说：救你容易，你可知师父在哪里？沙僧滴泪说：哥呵，师父被妖精等不得蒸，就夹生儿吃了。悟空凄凄惨惨的自思自忖，以心问心说：这都是我佛如来坐在那极乐之境，没得事干，弄了那唐僧之经。若不肯与我，让他把松箍儿咒念念，退下这个箍子，交还与他，我还归本洞，称王道寡，耍子儿去罢。好悟空，急翻身，驾起筋斗云，径投天竺，哪里消一个时辰，早望见灵山不远。忽抬头，见四大金刚挡住说：哪里走？当头又有昆仑山金霞岭不坏尊王永住金刚喝说：这猢狲甚是粗狂。",
        "悟空跪在下面，捶着胸膛说：不瞒如来说，弟子当年闹天宫，称悟空，自为人以来，没有吃亏，今番却遭这毒魔之手。如来听完说：你且休恨，那妖精我认得他。悟空猛然失声说：如来，我听见人讲说，那妖精与你有亲哩。如来说：这个刁猢狲，怎么个妖精与我有亲？悟空笑说：不与你有亲，怎么认得？万物有走兽飞禽，走兽以麒麟为之长，飞禽以凤凰为之长。故此留他在灵山会上，封他做佛母孔雀大明王菩萨。悟空听完笑说：如来，若这般比论，你还是妖精的外甥哩。如来说：那妖怪须是我去，方可收得。悟空磕头，启上如来：千还请挪玉一降。如来说：菩萨之兽，下山多少时了？",
        "妖精说：你哪里持斋把素，极贫极苦；如来说：我管四大部洲，无数众生瞻仰，凡做好事，我让他先祭你口。悟空才转出，向如来磕头说：佛爷，你今收了妖精，除了大害，只是没了我师父也。悟空却按落云头，直入城里，那城里一个小妖儿也没有了。悟空才解救了八戒、 沙僧，寻着行李、马匹，与他二人说：师父没有吃，都跟我来。引他两个直接走进内院，找着锦香亭，打开门看，内有一个铁柜，只听得唐僧有啼哭之声。沙僧使降妖杖打开铁锁，揭开柜盖，叫声：师父。唐僧见了，放声大哭说：徒弟呵，怎生降得妖魔？悟空把上项事从头至尾，细说了一遍。"
      ],
      "78": [
        "管教跳出樊笼套，行满飞升上大罗。唐僧问：悟空，那厢又是什么所在？唐僧下马，一行师徒四人，进了月城。悟空近前，摇他一下，叫声：长官。那老军猛然惊觉，麻麻糊糊的睁开眼，看见悟空，连忙跪下磕头，叫：爷爷。适才到此，不知地名，问你一声的。那老军听完，却才正了心，打个呵欠，爬起来，伸伸腰说：唐僧，唐僧，恕小人之罪。悟空却转身对唐僧说：师父，这里原是比丘国，今改小子城，但不知改名之意何故也。唐僧疑惑说：既云比丘，又何云小子？八戒说：想是比丘王崩了，新立王位的是个小子，故名小子城。",
        "唐僧说：徒弟呵，这里人家都将鹅笼放在门首，何也？八戒笑说：师父，今日想是黄道良辰，宜结婚姻会友，都行礼哩。悟空说：胡谈，哪里就家家都行礼？唐僧扯住说：你不要去，你嘴脸丑陋，怕人怪你。好悟空，捻着诀，念声咒语，摇身一变，变作一个蜜蜂儿，展开翅，飞近边前，钻进幔里观看，原来里面坐的是个小孩儿。悟空看完，现原身，回报唐僧说：那笼里是些小孩子，大者不满七岁，小者只有五岁，不知何故。唐僧喜说：徒弟，我们且进这驿里去：一则问他地方，二则撒和马匹，三则天晚投宿。唐僧言：贫僧东土大唐差往西天取经者，今到贵处，有关文理当照验，权借高衙一歇。",
        "驿丞附耳低言说：唐僧不要管他，不要问他，也不要理他，说他。唐僧听完，一把扯住驿丞，定要问个明白。唐僧一发不放，执死定要问个详细。独在灯光之下，悄悄而言说：适所问鹅笼之事，原来是当今国主无道之事。驿丞说：此国原是比丘国，近有民谣，改作小子城。三年前，有一老人，打扮做道人模样，携一小女子，年方一十六岁。唐僧明早到朝：只去倒换关文，不得言及此事。吓得个唐僧骨软筋麻，止不住腮边泪堕。八戒近前说：师父，你是怎么起哩？",
        "悟空抖擞神威，就起身，吩咐八戒、沙僧：同师父坐着，等我施为，你看但有阴风刮动，就是小儿出城了。他三人一齐具念：南无救生药师佛！这悟空出得门外，打个哨，起在半空，捻了诀，念动真言，叫一声唵净法界，拘得那城隍、土地、社令、真官，并五方揭谛、四值功曹、六丁六甲与护教伽蓝等众，都到空中，对他施礼说：悟空，夜唤我们，有何急事？悟空说：今因路过比丘国，那国王无道，听信妖邪，要取小儿性命做药引子，指望长生。故我特请大家，各使神通，与我把这城中各街坊人家鹅笼里的小儿，连笼都摄出城外山凹中，或树林深处，收藏一二日，与他些果子食用，不得饿损；",
        "悟空按下祥光，径至驿庭上，只听得他三人还念南无救生药师佛哩。悟空说：已一一救他出去，待我们起身时送还。至天晓，唐僧醒来，于是结束齐备说：悟空，我趁早朝，倒换关文去也。悟空说：师父，你自家去，恐不济事，待我和你同去，看那国丈邪正怎么。唐僧说：你去却不肯行礼，恐国王见怪。悟空说：我不现身，暗中跟随你，就当保护。唐僧甚喜，吩咐八戒、沙僧看守行李、马匹，却才举步。这驿丞又来相见，看这唐僧打扮起来，比昨日又甚不同。九环锡杖手中拿，胸藏一点神光妙。及到朝门外，见有黄门官，就施礼说：贫僧原来东土大唐差往西天取经者。",
        "唐僧将文牒献上，那国王眼目昏朦，看了又看，才取宝印，用了花押，递与唐僧。那国王正要问取经原因，只听得当驾官奏说：国丈爷爷来矣。国王欠身说：国丈仙踪，今喜早降。用手指定唐僧说：呵呵呵，你这和尚满口胡柴。满朝官都喝采说：好个惟道独称尊，惟道独称尊。国王又叫光禄寺安排素斋，待那远来之僧出城西去。才下殿，往外正走，悟空飞下帽顶儿，来在耳边叫说：师父，这国丈是个妖邪，国王受了妖气。看那悟空，一翅飞在金銮殿翡翠屏中钉下，只见猴群中闪出五城兵马官奏说：我主，今夜一阵冷风，将各坊各家鹅笼里小儿，连笼都刮去了，更无踪迹。国王听完禀报，又惊又恼，对国丈说：此事原来天灭朕也。",
        "连月病重，御医无效，幸国丈赐仙方，专待今日午时开刀，取此小儿性命作引，何期被冷风刮去，非天欲灭朕而何？国王说：见把笼中之儿刮去，何以返说天送长生？国丈说：我才入朝来，见了一个绝妙的药引，强似那一千一百一十一个小儿之心。国王漠然不知是何药引，请问再三，国丈才说：那东土差去取经的和尚，我看他器宇清净，容颜齐整，原来是个十世修行的真体，自幼为僧，元阳未泄，比那小儿更强万倍。那昏君听完，十分听信，对国丈说：为什么不早说？如今急传旨，将各门紧闭，点兵围了金亭馆驿，将那和尚拿来，必以礼求其心。如果相从，就时剖而拿出，于是御葬其尸，还与他立庙享祭；",
        "国王方恼，他却转教喜欢，说：这是天送长生与你。八戒笑说：行的好慈悯，救的好小儿，刮的好阴风，今番却撞出祸来了。唐僧战兢兢的爬起来，扯着悟空，哀告说：贤徒呵，此事怎么是好？悟空说：若要全命，师作徒，徒作师，方可保全。唐僧说：你若救得我命，情愿与你做徒子、徒孙也。又不敢外面去取水，后就掳起衣服撒溺，和了一团臊泥，递与悟空。悟空没奈何，将泥扑作一片，往自家脸上一安，做下个猴像的脸子。脱了他的衣服，以悟空的衣服穿上。悟空却将师父的衣服穿了，捻着诀，念个咒语，摇身变作唐僧的嘴脸。又见一个锦衣官走进驿庭问：东土唐朝唐僧在哪里？"
      ],
      "79": [
        "再说那锦衣官把假唐僧扯出馆驿，与羽林军围围绕绕，直至朝门外，对黄门官言：我们已请唐僧到此，烦为转奏。众官都在阶下跪拜，惟假唐僧挺立阶心，口中高叫：比丘王，请我贫僧何说？君王笑说：朕得一疾，缠绵日久不愈。若得病愈，与唐僧修建祠堂，四时奉祭，永为传国之香火。假唐僧说：我原来出家人，只身至此，不知陛下问国丈要甚东西作引？假唐僧说：不瞒陛下说，心就有几个儿，不知要的什么色样？那国丈在旁边指定说：那和尚，要你的黑心。国丈在殿上见了说：这是个多心的和尚。假僧将那些心，血淋淋的一个个捡开与众观看，却都是些红心、白心、黄心、悭贪心、利名心、嫉妒心、计较心、好胜心、望高心、侮慢心、杀害心、狠毒心、恐怖心、谨慎心、邪妄心、无名隐暗之心、种种不善之心，更无一个黑心。",
        "那妖精与悟空苦战二十余合，蟠龙拐抵不住金箍棒，虚幌了一拐，将身化作一道寒光，落入皇宫内院，把进贡的妖后带出宫门，并化寒光，不知去向。悟空按落云头，到了宫殿下，对多官说：你们的好国丈呵！悟空说：且休拜，且去看你那昏主何在？多官说：我主见争战时，惊恐潜藏，不知向那座宫中去也。悟空就命：快寻，不要被美后拐去。多官听言，不分内外，同悟空先奔美后宫，漠然无踪，连美后也通不见了。正宫、东宫、西宫、六院，概众后妃，都来拜谢悟空。众臣俯伏在地，齐声启奏说：陛下，陛下，感得神僧到此，辨明真假。国王听完，就请悟空出皇宫，到宝殿，拜谢了，说：唐僧，你早间来的模样那般俊伟，这时怎么就改了形容？",
        "八戒说：没奈何，我们且去见了师兄，自有解释。真个那唐僧无计，只得跟着八戒、沙僧，挑着担，牵着马，同去驿庭之上。那太宰见了，害怕说：爷爷呀，这都像似妖头怪脑之类。沙僧说：朝士休怪丑陋，我们原来是生成的遗体。悟空看见，就转身下殿，迎着面，把师父的泥脸子抓下，吹口仙气，叫：变！那唐僧就时复了原身，精神愈觉爽利。悟空说：陛下可知那妖怪来自何方？听见悟空说剪除后患，也不避内外男女之嫌，一齐出来拜告说：还请神僧老佛大施法力，斩草除根，把他剪除尽绝，诚为不要大之恩，自当重报。悟空忙忙答礼，只教国王说他住居。",
        "国王含羞告说：三年前他到时，朕曾问他。他说：我有仙方，止用小儿心煎汤为引。悟空笑说：实不相瞒，笼中小儿，是我师慈悲，着我藏了。你且休题什么资财相谢，待我捉了妖怪，是我的功行。八戒尽饱一餐，抖擞精神，随悟空驾云而起。吓得那国王、妃后并文武多官，一个个朝空礼拜，都说：是真仙真佛降临凡也。那悟空携着八戒，径到南方七十里之地，住下风云，找寻妖处。孙悟空寻觅不着，就捻诀，念一声唵字真言，拘出一个当方土地，战兢兢近前跪下叫说：悟空，柳林坡土地磕头。我问你：柳林坡有个清华庄，在于何方？土地说：这里有个清华洞，没有有个清华庄。",
        "悟空吩咐八戒：你且远远的站定，待我叫开门，寻着那妖怪，赶将出来，你却接应。八戒闻命，就离树有半里远近立下。这悟空依土地之言，绕树根，左转三转，右转三转，双手齐扑其树，叫：开门，开门。正当喊杀之际，又听见鸾鹤声鸣，祥光缥缈。那老人把寒光罩住，叫说：悟空慢来，天蓬休赶，老道在此施礼哩。悟空就答礼说：寿星兄弟，哪里来？八戒笑说：肉头老人家罩住寒光，必定捉住妖怪了。悟空说：老怪不与老弟相干，为什么来说人情？寿星笑说：他是我的一副脚力，不意走将来，成此妖怪。悟空说：既是老弟之物，只让他现出本相来看看。",
        "被悟空一把扯住说：老弟，且慢走，还有两件事未完哩。悟空说：还有美人未获，不知是个什么怪物；悟空说：老弟略等等儿，我们去了就来。那八戒抖擞精神，随悟空直接走进清华仙府，呐声喊，叫：拿妖精，拿妖精！那美人战战兢兢，正自难逃，又听得喊声大振，就转石屏之内，又没个后门出头。可怜把那个倾城倾国千般笑，化作毛团狐狸形。悟空叫说：不要打烂他，且留他此身去见昏君。那八戒不嫌秽污，一把揪住尾子，拖拖扯扯，跟随悟空出得门来。只见那寿星老人家手摸着鹿头骂说：好孽畜呵，你怎么背主逃去，在此成精？八戒将个死狐狸掼在鹿的面前说：这可是你的女儿么？",
        "悟空又念声唵字真言，依然拘出当方土地，叫：寻些枯柴，点起烈火，与你这方消除妖患，以免欺凌。悟空叫：八戒，不必筑树，但得此物填塞洞里，放起火来，烧得个干净。火一起，果然把一座清华妖怪宅，烧作火池坑。这里才喝退土地，同寿星牵着鹿，拖着狐狸，一齐回到殿前，对国王说：这是你的美后，与他耍子儿么？悟空近前，搀住国王，笑说：且休拜我。那国王羞愧无地，只说：感谢神僧救我一国小儿，真天恩也。就传旨，教光禄寺安排素宴，大开东阁，请南极老人与唐僧师徒四人，共坐谢恩。都问：白鹿既是老寿星之物，怎么得到这里为害？",
        "那八戒不分好歹，一齐乱上，但来的吃个精空。那国王又近前跪拜寿星，求祛病延年之法。八戒看见，就叫说：老寿，有火枣，送我几个吃吃。寿星说：未曾带得，待改日我送你几斤。于是出了东阁，道了谢意，将白鹿一声喝起，飞跨背上，踏云而去。悟空说：陛下，从此色欲少贪，阴功多积，凡百事将长补短，自足以祛病延年，就是教也。于是拿出两盘散金碎银，奉为路费。国王无已，命摆銮驾，请唐僧端坐凤辇龙车，王与嫔后，具推轮转毂，方送出朝。忽听得半空中一声风响，路两边落下一千一百一十一个鹅笼，内有小儿啼哭，暗中有原护的城隍、土地、社令、真官、五方揭谛、四值功曹、六丁六甲、护教伽蓝等众，应声高叫说：悟空，我们前蒙吩咐，摄去小儿鹅笼，今知悟空功成起行，一一送来也。"
      ],
      "80": [
        "再说比丘国君臣黎庶送唐僧师徒四人出城，有二十里之远，还不肯舍。唐僧勉强下辇，乘马辞别而行，目送者直至望不见踪影方回。唐僧心惊，问：徒弟，前面高山有路无路？悟空笑说：师父这话，也不像走长路的，却似个公子王孙，坐井观天之类。唐僧说：虽然是山不碍路，但恐崄峻之间生怪物，密丛深处出妖精。悟空拿出金箍棒，走上石崖，叫说：师父，这里原来转山的路儿，忒好走。沙僧吩咐：二哥，你把担子挑一肩儿。真个八戒接了担子挑上，沙僧拢着缰绳，老师父稳坐雕鞍，随悟空都奔山崖上大路。老师父缓观山景，忽闻啼鸟之声，又起思乡之念，兜马叫说：徒弟！",
        "唐僧害怕，又叫说：悟空，我们才过了那崎岖山路，怎么又遇这个深黑松林？孙悟空公然不惧，使铁棒上前劈开大路，引唐僧直接走进深林。唐僧叫说：徒弟，一向西来，无数的山林崎崄，幸得这里清雅，一路太平。悟空说：师父请下马，我化斋去来。那唐僧果然下了马，八戒将马拴在树上。悟空说：师父稳坐，不要惊怕，我去了就来。唐僧端坐松阴之下，八戒、沙僧却去寻花觅果闲耍。再说悟空纵筋斗，到了半空，定云光，回头观看，只见松林中祥云缥缈，瑞霭氤氲。原来夸奖唐僧，说他是金蝉唐僧转世，十世修行的好人，所以有此祥瑞罩头。手下有四万七千群怪，都称我做悟空爷爷，着实为人。",
        "悟空大惊说：那黑气里必定有邪了。再说唐僧坐在林中，明心见性，讽念那《摩诃般若波罗密多心经》，忽听得嘤嘤的叫声救人。那唐僧起身挪步，穿过千年柏，隔起万年松，附葛攀藤，近前观之。唐僧立定脚，问他一句说：女菩萨，你有甚事，绑在这里？分明这个家伙是个妖怪，唐僧肉眼凡胎，却不能认得。唐僧实不敢近前，又开口问：女菩萨，你端的有何罪过？那妖精巧语花言，虚情假意，忙忙的答应说：师父，我家住在贫婆国，离此有二百余里。至茔前，摆开祭祀，刚烧化纸马，只听见锣鸣鼓响，跑出一伙强人，持刀弄杖，喊杀过来，慌忙我们魂飞魄散。",
        "唐僧用手指定那树上，叫：八戒，解下那女菩萨来，救他一命。再说那悟空在半空中，又见那黑气浓厚，把祥光尽情盖了，道声：不好，不好！却返云头，按落林里，只见八戒乱解绳儿。悟空上前一把揪住耳朵，扑的捽了一跌。八戒抬头看见，爬起来说说：师父让我救人，你怎么恃你有力，将我掼这一跌？你这泼猴，又来胡说了，怎么这等一个女子，就认得他是个妖怪？悟空说：师父原来不知，这都是我干过的买卖，想人肉吃的法儿，你哪里认得？八戒唝着嘴说：师父，不要信这弼马温哄你，这女子原来是这里人家。他打发我们丢了过去，他却翻筋斗，弄神法转来和他干巧事儿，倒踏门也。",
        "沙僧说：我挑担前走，没有在心，也没有听见。说说：活人性命还不救，昧心拜佛取何经？悟空笑说：师父要善将起来，就没药医。你想你离了东土，一路西来，却也过了几重山场，遇着许多妖怪，常把你拿将进洞。我来救你，使铁棒，常打死千千万万。今日一个妖精的性命，舍不得，要去救他？唐僧说：徒弟呀，古人云：勿以善小而不为，勿以恶小而为之。悟空说：师父既然如此，只是这个担儿，我却担不起。你要救他，我也不敢苦劝：我劝一会，你又恼了。猴头不要多话，你坐着，等我和八戒救他去。唐僧回至林里，教八戒解了上半截绳子，用钯筑出下半截身子。",
        "唐僧说：徒弟，哪里必定是座庵观寺院，就此借宿了，明日早行。悟空说：师父说得是，各各走动些。霎时到了门首，吩咐说：你们略站远些，等我先去借宿，若有方就处，着人来叫你。众人具站在柳荫之下，惟悟空拿铁棒，辖着那女子。唐僧拽步近前，只见那门东倒西歪，零零落落。推开看时，忍不住心中凄惨：长廊寂静，古刹萧疏；唐僧用手摸着钟，高叫说：钟呵，你也曾悬挂高楼吼，也曾鸣远彩梁声。唐僧高声赞叹，不觉的惊动寺里之人。哪里边有一个侍奉香火的道人，他听见人语，扒起来，拾一块断砖，照钟上打将去，那钟当的响了一声。把个唐僧吓了一跌，挣起身要走，又绊着树根，扑的又是一跌。",
        "唐僧抬头见他的模样丑黑，说：你不要是魍魉妖邪？却才听见老爷善言相赞，就欲出来迎接；恐怕是个邪鬼敲门，故此拾一块断砖，把钟打一下压惊，方敢出来。那唐僧方然正性说：住持，险一些吓杀我也。那道人引定唐僧，直至三层门里看处，比外边甚是不同。文殊殿结采飞云，轮藏堂描花堆翠。唐僧见了，不敢进去，叫：道人，你这前边十分狼狈，后边这等齐整，何也？道人笑说：老爷，这山中多有妖邪强寇，天色清明，沿山打劫，天阴就来寺里藏身，被他把佛像推倒垫坐，木植搬来烧火。本寺僧人软弱，不敢与他讲论，因此把这前边破房都舍与那些强人安歇，从新另化了些施主，盖得那一所寺院。",
        "那和尚笑说：不敢当子，不敢当子。和尚说：那东土到西天，有多少路程？那和尚慌了说：师父，你不知我这里有虎狼、妖贼、 鬼怪伤人。有两个小喇嘛儿跑出外去，看见悟空，吓了一跌；扒起来往后飞跑，说：爷爷，好运气低了，你的徒弟不见，只有三四个妖怪站在那门首也。小和尚说：一个雷公嘴，一个碓挺嘴，一个青脸獠牙。那一个女子，是我打松林里救命来的。那喇嘛说：爷爷呀，这们好俊师父，怎么寻这般丑徒弟？你快请他进来，若再迟了一些，那雷公嘴的有些闯祸，不是个人生父母养的，他就打进来也。那小和尚就忙跑出，战兢兢的跪下说：大家老爷，唐老爷请哩。"
      ],
      "81": [
        "那僧谢说：既老师宽厚，请他到天王殿里，就在天王爷爷身后，安排个草铺，让他睡罢。唐僧就在方丈中，请众院主自在，于是各散去。唐僧吩咐悟空：辛苦了，早睡早起。及天明了，悟空起来，教八戒、沙僧收拾行囊、马匹，却请师父走路。那师父把头抬了一抬，又没有答应得出。唐僧呻吟说：我怎么这般头悬眼胀，浑身皮骨皆疼？八戒听说，伸手去摸摸身上，有些发热。八戒笑说：我晓得了，这是昨晚见没钱的饭，多吃了几碗，倒沁着头睡，伤食了。唐僧说：我半夜之间起来解手，没有戴得帽子，想是风吹了。唐僧说：我如今起坐不得，怎么上马？又说说：养儿不用阿金溺银，只是见景生情就好。",
        "那一日，师父欠身起来叫说：悟空，这两日病体沉疴，没有问得你：那个脱命的女菩萨，可曾有人送些饭与他吃？你且扶我起来，拿出我的纸、笔、墨，寺里借个砚台来使使。唐僧说：我要修一封书，并关文封在一处，你替我送上长安驾下，见太宗皇帝一面。唐僧滴泪说：我写着：臣僧稽首三顿首，万岁山呼拜圣君；悟空听得此言，忍不住呵呵大笑说：师父，你忒不济，略有些些病儿，就起这个意念。若恼了我，我拿出那大闹天宫之性子，又一路棍，打入幽冥，捉住十代阎王，一个个抽了他的筋，还不饶他哩。唐僧说：徒弟呀，我病重了，切不要说这大话。",
        "和尚们说：老爷，我这荒山，大大小小也有百十众和尚，每一人养老爷一日，也养得起百十日。悟空说：既不计较，你却为什么啼哭？和尚们说：老爷，不知是那山里来的妖邪在这寺里。我们晚夜间着两个小和尚去撞钟打鼓，只听得钟鼓响罢，再不见人回。悟空听完，又惊又喜说：不消说了，必定是妖魔在此伤人也。若还拿他不住呵，却有好一些不就处。那和尚们说：直不相瞒老爷说，我这荒山虽有百十众和尚，却都只是自小儿出家的：发长寻刀削，衣单破衲缝。举头看见佛，莲九品，三乘，慈航共法云，愿见祇园释世尊；低头看见心，受五戒，度大千，生生万法中，愿悟顽空与色空。",
        "一赶追上去，跑的跑，颤的颤，躲的躲，慌的慌；众和尚，我拿这妖精与你看看，你才认得我。和尚们听着，暗点头说：这贼秃开大口，说大话，想是有些来历。你老师父贵恙，你拿这妖精不至紧。唐僧正当烦渴之时，就抬起头来，捧着水，只是一吸。悟空见唐僧精神渐爽，眉目舒开，就问：师父，可吃些汤饭么？唐僧说：这凉水就是灵丹一般，这病儿减了一半，有汤饭也吃得些。悟空连声高高叫说：我师父好了，要汤饭吃哩。唐僧只吃得半碗儿米汤，悟空、沙僧止用了一席，其余的都是八戒一肚餐之。悟空说：师父，也算不得路程，明日去罢。悟空说：既是明日要去，且让我今晚捉了妖精看。",
        "二更时分，残月才升，只听见呼呼的一阵风响。九曜星官皆闭户，四海龙王尽掩门；地府阎罗寻马面，判官乱跑赶头巾。那风才然过处，猛听见兰麝香熏，环珮声响。那女子走近前，一把搂住说：小唐僧，念的什么经？女子说：别人都自在睡觉，你还念经怎么？女子搂住，与他亲个嘴说：我与你到后面耍耍去。悟空故意的扭过头去说：你有些不晓事。悟空说：我相你有一些偷生熟，被公婆赶出来的。悟空听完，暗点头说：那几个愚僧，都被色欲引诱，所以伤了性命。就随口答应说：娘子，我出家人年纪尚幼，却不知什么交欢之事。悟空暗笑说：也罢，我跟他去，看他怎生摆布。",
        "那妖怪把悟空使个绊子腿，跌倒在地。却被悟空接住他手，使个小坐跌法，把那妖怪一辘轳掀翻在地上。那妖怪口里还叫说：性命哥哥，你倒会跌你的娘哩。悟空暗算说：不趁此时下手他，还到几时？就把手一叉，腰一躬，一跳跳起来，现出原身法像，抡起金箍铁棒，劈头就打。他心想说：这个小和尚，这等利害。打开眼一看，原来是那唐僧的徒弟姓孙的。那孙悟空精神抖擞，棍儿没半点差池。等悟空赶到紧急之时，就将左脚上花鞋脱下来，吹口仙气，念个咒语，叫一声：变！",
        "再说悟空斗得心焦性燥，闪一个空，一棍把那妖精打落下来，原来是一只花鞋。悟空晓得中了他计，连忙转身来看师父，那有个师父。只见那八戒和沙僧口里呜哩呜哪说什么。悟空怒气填胸，也不管好歹，捞起棍来一片打，连声叫说：打死你们，打死你们。沙僧却是个灵山大将，见得事多，就软款温柔，近前跪下说：兄长，我知道了，想你要打杀我两个，也不去救师父，径自回家去哩。悟空说：我打杀你两个，我自去救他。自古说：打虎还得亲兄弟，上阵须教父子兵。望兄长且饶打，待天明和你同心戮力，寻师去也。悟空虽是神通广大，却也明理识时。",
        "二人叹服说：好好好，真是粗中有细。林内更无妖怪影，不知唐僧在何端。悟空心焦，抽出出棒来，摇身一变，变作大闹天宫的本相：三头六臂，六只手，理着三根棒，在林里辟哩拨喇的乱打。八戒见了说：沙僧，师兄着了恼，寻不着师父，弄做个气心风了。原来悟空打了一路，打出两个老头儿来：一个是山神，一个是土地，上前跪下说：悟空，山神、土地来见。八戒说：好灵根呵，打了一路，打出两个山神、土地；悟空问：山神、土地，你们这般无礼，在这里专一结伙强盗。强盗得了手，买些猪羊祭赛你，又与妖精结掳，打伙儿把我师父摄来。土地说：那妖精摄你师父去，在那正南下，离此有千里之遥。"
      ],
      "82": [
        "依路前行，有五六里远近，忽见二个女怪，在那井上打水。那妖怪听完大怒，两人互相说说：这和尚惫懒，我们又不与他相识，平时又没有调得嘴惯，他怎么叫我们做妖怪？那妖怪恼了，抡起抬水的杠子，劈头就打。这八戒手无兵器，遮架不得，被他捞了几下，侮着头跑上山来说：哥呵，回去罢，妖怪凶。八戒说：山凹内两个女妖精在井上打水，我只叫了他一声，就被他打了我三四杠子。悟空说：温柔天下去得，刚强寸步难移。你就去叫他做妖怪，他不打你，打我？悟空说：你自幼在山中害人，你晓得有两样木么？悟空说：一样是杨木，一样是檀木。",
        "那八戒闻此言，急抽身跑上山，叫：沙僧，快拿将行李来，我们分了罢。八戒说：分了，就你还去流沙河害人，我去高老庄探亲，哥哥去花果山称圣，白龙马归大海成龙。才那两个抬水的妖精说，安排素筵席与唐僧吃了成亲哩。悟空说：那妖精把师父困在洞里，师父眼巴巴的望我们去救，你却在此说这样话。悟空说：你两个牵着马，挑着担，我们跟着那两个女怪，做个引子，引到那门前，一齐下手。悟空远远的标着那两怪，渐入深山，有一二十里远近，忽然不见。悟空说：你好眼力，怎么就看出他本相来？八戒说：那两个怪正抬着水走，忽然不见，却不是个日里鬼？",
        "悟空伏在洞边上，仔细往下看处，咦！八戒说：你就回去罢，师父救不得耶。若师父果在里面，我将铁棒把妖精从里打出，跑至门口，你两个却在外面挡住：这是里应外合。悟空却将身一纵，跳入洞中，足下彩云生万道，身边瑞气护千层。摇身捻诀，就变做个苍蝇儿，轻轻的飞在门楼上听听。只见那妖怪高坐在草亭内，他那模样，比在松林里救他，寺里拿他，就是不同，越发打扮得俊了：发盘云髻似堆鸦，身着绿绒花比甲。少时，绽破樱桃，喜孜孜的叫说：小妖们，快排素筵席来，我与唐僧哥哥吃了成亲。等我且飞进去寻寻，看师父在哪里。",
        "他师徒两个商量未了，早是那妖精安排停当，走近东廊外，开了门锁，叫声：唐僧。正自狐疑，那妖怪又叫一声：唐僧。唐僧没奈何，应他一声说：娘子，有。那唐僧应出这一句言来，真是肉落千斤。人都说唐僧是个真心的和尚，往西天拜佛求经，怎么与这女妖精答话？妖精见唐僧应了一声，他推开门，把唐僧搀起来，和他携手挨背，交头接耳。悟空暗中笑说：我师父被他这般哄诱，只怕一时动心。含笑与师携手处，香飘兰麝满袈裟。悟空见事不谐，料难入他腹，就变做个饿老鹰。飞起来，抡开玉爪，响一声，掀翻桌席，把些素果素菜，盘碟壶爵，尽皆捽碎，撇却唐僧，飞将出去。",
        "吓得妖精心胆皆裂，唐僧亦骨肉通酥。妖精战战兢兢，搂住唐僧说：唐僧哥哥，此物是哪里来的？妖怪说：我费了许多心，安排这个素宴与你耍耍，却不知这个扁毛畜生从哪里飞来，把我的家火打碎。众小妖说：夫人，打碎家火犹可，将些素品都泼散在地，秽了怎用？唐僧分明晓得是悟空弄法，他哪里敢说。那妖精说：小妖们，我知道了：想必是我把唐僧困住，天地不容，故降此物。你们将碎家火拾出去，另安排些酒肴，不拘荤素，我指天为媒，指地作订，然后再与唐僧成亲。依然把唐僧送在东廊里坐下暂且不说。悟空跳出，八戒上前扯住说：可有妖精？",
        "那妖精十分欢喜说：妙人哥哥倒有些兴趣，我和你去花园里耍耍。叫：小妖们，拿钥匙来开了园门，打扫路迳。若不是这铁打的心肠朝佛去，第二个酒色凡夫也取不得经。一行都到了花园之外，那妖精俏语低声，叫说：妙人哥哥，这里耍耍，真可散心释闷。更看那凝香阁、青蛾阁、解酲阁、相思阁，层层卷映，朱帘上钩控须，又见那养酸亭、披素亭、画眉亭、四雨亭，个个峥嵘，华扁上字书鸟篆。唐僧携着那妖怪，步赏花园，看不尽的奇葩异卉。",
        "悟空把师父头上一掐，那唐僧就知。悟空飞在桃树枝儿上，摇身一变，变作个红桃儿，其实红得可爱。唐僧对妖精说：娘子，你这苑内花香，枝头果熟。唐僧说：谢娘子指教，其实贫僧不知。唐僧躬身将红桃捧与妖怪说：娘子，你爱色，请吃这个红桃，拿青的来我吃。妖精真个换了，且暗喜说：好和尚呵，果是个真人，一日夫妻未做，却就有这般恩爱也。启朱唇，露银牙，未曾下口，原来悟空十分性急，毂辘一个跟头，翻入他咽喉之下，径到肚腹之中。妖精害怕，对唐僧说：唐僧呵，这个果子利害：怎么不容咬破，就滚下去了？唐僧说：娘子，新开园的果子爱吃，所以去得快了。",
        "唐僧说：在你肚里哩，却才吃的那个红桃子不是？悟空，你千方百计的钻在我肚里怎么？悟空在里边恨说：也不怎么，只是吃了你的六叶连肝肺，三毛七孔心，五脏都淘净，弄做个梆子精。妖精听说，吓得魂飞魄散，战战兢兢的把唐僧抱住说：唐僧呵，我只说：夙世前缘系赤绳，鱼水相和两意浓。悟空在他肚里听见说时，只怕唐僧慈心，又被他哄了，就就抡拳跳脚，支架子，理四平，几乎把个皮袋儿捣破了。悟空见不言语，想是死了，却把手略松一松。原来那些小妖自进园门来，各人知趣，都不在一处，各自去采花斗草，任意随心耍子，让那妖精与唐僧两个自在叙情儿。"
      ],
      "83": [
        "再说唐僧着妖精送出洞外，沙僧近前问：师父出来，师兄何在？八戒说：他有算计，必定贴换师父出来也。唐僧用手指着妖精说：你师兄在他肚里哩。悟空在里边叫说：张开口，等我出来。悟空变得小小的，在咽喉之内，正欲出来，又恐他无理来咬，就将铁棒拿出，吹口仙气，叫：变！那妖精也随手拿出两口宝剑，叮当架住。两个在山头上这场好杀：双舞剑飞当面架，金箍棒起照头来。因唐僧，拜如来，恨苦相争显大才。八戒见他们赌斗，口里絮絮叨叨，返恨悟空，转身对沙僧说：兄弟，师兄胡缠。却也亏了师兄深洞中救出师父，返又与妖精厮战。且请师父自家坐着，我和你各持兵器，助助大哥，打倒妖精去来。",
        "那妖精见他们赶得紧，就将右脚上花鞋脱下来，吹口仙气，念个咒语，叫：变！就变作本身模样，使两口剑舞将来；也是唐僧灾星未退，他到洞门前牌楼下，却见唐僧在哪里独坐，他就近前一把抱住，抢了行李，咬断缰绳，连人和马，复又摄将进去暂且不说。且说八戒闪个空，一钯把妖精打落地，原来是一只花鞋。悟空看见说：你这两个八戒，看着师父罢了，谁要你来帮什么功？这猴子好的有些夹脑风，我们替他降了妖怪，返落得他生报怨。那妖怪昨日与我战时，使了一个遗鞋计哄了。慌忙个八戒两头乱跑，沙僧前后跟寻，孙悟空亦心焦性燥。他一把拿起，止不住眼中流泪，放声叫说：师父呵，我去时辞别人和马，回来只见这些绳。",
        "恼得这悟空跌脚捶胸，放声高叫说：师父呵，你是个晦气转成的唐僧，灾殃铸就的取经僧。正自吆喝爆燥之间，忽听见一阵香风扑鼻，他回了性说：这香烟是从后面飘出，想是在后头哩。悟空见了，心里高兴极了，也不去搜妖怪，找唐僧，把铁棒捻作个绣花针儿，揌在耳朵里，抡开手，把那牌子并香炉拿将起来，返云光，径出门去。八戒、沙僧听见，抽出放洞口，迎着悟空说：哥哥这等欢喜，想是救出师父也？悟空笑说：不消我们救，只问这牌子要人。八戒说：哥呵，这牌子不是妖精，又不会说话，怎么问他要人？沙僧近前看时，上写着尊父李天王之位、尊兄哪咤三太子位。",
        "八戒、沙僧闻其言，十分欢喜说：哥呵，告的有理，必得上风。悟空说：我快，我快，多时饭熟，少时茶滚就回。好悟空，执着这牌位、香炉，将身一纵，驾祥云，直至南天门外。时有把天门的大力天王与护国天王见了悟空，一个个都控背躬身，不敢拦阻，让他进去。直至通明殿下，有张、葛、许、丘四大天师迎面作礼说：悟空何来？悟空说：有纸状儿，要告两个人哩。天师吃惊说：这个赖皮，不知要告那个？悟空将牌位、香炉放下，朝上礼毕，将状子呈上。玉帝从头看了，见这等这等，就将原状批作圣旨，宣西方长庚太白金星领旨，到云楼宫宣托塔李天王见驾。",
        "那庭下摆列着巨灵神、鱼肚将、药叉雄帅，一拥上前，把悟空捆了。天王说：金星呵，似他这等诈伪告扰，怎该容他？金星见他取刀，心惊胆战，对悟空说：你干事差了。悟空全然不惧，笑吟吟的说：老官儿放心，一些没事。说不了，天王抡过刀来，望悟空劈头就砍。早有那三太子追上前，将斩妖剑架住，叫说：父王息怒。这太子三朝儿就下海净身闯祸，踏倒水晶宫，捉住蛟龙要抽筋为绦子。佛正与众菩萨讲经，只听见幢幡宝盖有人叫说：救命！却就回手，向塔座上取了黄金宝塔，托在手间，问哪咤说：孩儿，你以剑架住我刀，有何话说？哪咤弃剑磕头说：父王，是有女儿在下界哩。",
        "天王听完，悚然惊讶说：孩儿，我实忘了。太子说：他有三个名字：他的本身出处，唤做金鼻白毛老鼠精；天王却才省悟，放下宝塔，就亲手来解悟空。那悟空打滚撒赖，只要天王去见驾。天王说：老星怎说个方就，就没罪了。金星说：我也要和解你们，却只是无情可说。天王说：你把那奏招安授官衔的事，说说他也罢了。真个金星上前，将手摸着悟空说：悟空，看我薄面，解了绳好去见驾。悟空说：老官儿，不用解，我会滚法，一路滚就滚到也。你吃了玉帝仙酒，后又招安，也是老身力奏，封你做齐天悟空。悟空说：古人说得好：死了不要与老头儿同墓。",
        "这一年之间，那妖精把你师父陷在洞中，不要说成亲，若有个喜花下儿子，也生了一个小和尚儿，却不误了大事？悟空低头想说：是呵，我离八戒、沙僧，只说多时饭熟、少时茶滚就回，今已弄了这半会，却不迟了？金星说：教李天王点兵，同你下去降妖，我去回旨。金星说：我只说原告脱逃，被告免提。悟空笑说：好呵，我倒看你面情罢了，你倒说我脱逃。天王害怕说：他这一去，若有言语，是臣背君也。金星与悟空回见玉帝说：陷唐僧者，原来金鼻白毛老鼠成精，假设天王父子牌位。悟空就返云光，到南天门外，见天王、太子布列天兵等候。那些神将风滚滚，雾腾腾，接住悟空，一齐坠下云头，早到了陷空山上。",
        "天王说：不须啰噪，但依我分摆：孙悟空和太子同领着兵将下去，我们三人在口上把守，做个里应外合，让他上天无路，入地无门，才显些些手段。都只说：这孽畜一定是早出了这洞，远远去哩。只说悟空再也找不着，谁知他命合该休。中间有个大胆些的，伸起颈来，望洞外略看一看，一头撞着个天兵，一声嚷说：在这里！那悟空恼起性来，捻着金箍棒，一下闯将进去。三太子纵起天兵，一齐拥上，一个个哪里去躲？太子说：这是玉旨来拿你，不当小可。天王抽出开洞口，迎着悟空说：今番却见你师父也。沙僧、八戒只是要碎剐那老精，天王说：他是奉玉旨拿的，轻易不得，我们还要去回旨哩。一边悟空拥着唐僧，沙僧收拾行李，八戒拢马，请唐僧骑马，齐上大路。"
      ],
      "84": [
        "师徒师徒四人，耽炎受热，正行处，忽见那路旁边有两行高柳，柳阴中走出一个老母，右手下搀着一个小孩儿，对唐僧高叫说：和尚，不要走了，快早儿拨马东回，进西去都是死路。吓得个唐僧跳下马来，打个行礼问候说：老菩萨，古人云：海阔从鱼跃，天空任鸟飞。那老母用手朝西指说：哪里去有五六里远近，原来是灭法国。那国王前生那世里结下冤仇，今世里无端造罪。这两年陆陆续续，杀勾了九千九百九十六个无名和尚，只要等四个有名的和尚，凑成一万，好做圆满哩。你们去，若到城中，都是送命王菩萨。唐僧听完，心中害怕，战兢兢的说：老菩萨，深感盛情，感谢不尽。",
        "悟空说：兄弟，你两个好生保守师父，待我变化了，去那城中看看，寻一条僻路，连夜去也。唐僧叮嘱说：徒弟呵，不要当小可，王法不容，你须仔细。好悟空，话毕，将身一纵，哨的跳在空中。他想着：我要下去，到街坊打看路迳，这般个嘴脸，撞见人，必定说是和尚。捻着诀，念动真言，摇身一变，变做个扑灯蛾儿：形细翼硗轻巧，灭灯扑烛投明。他说：这人家过元宵哩，怎么挨排儿都点灯笼？又伸头打一看，看见有八九个人，都吃了晚饭，宽了衣服，卸了头巾，洗了脚手，各各上床睡了。有这般不于是意的事：正思忖处，只见那小二走向前，吩咐：大家官人，仔细些，我这里君子小人不同，各人的衣物、行李都要小心着。",
        "悟空说：师父，他这城池，我已看了，虽是国王无道杀僧，却倒是个真天子，城上有祥光喜气。却才在饭店内借了这几件衣服、头巾，我们且扮作俗人，进城去借了宿，至四更天就起来，教店家安排了斋吃。沙僧说：师兄处的最当，且依他行。八戒的头大，戴不得巾儿，被悟空取了些针线，把头巾扯开两顶，缝做一顶，与他搭在头上；然后自家也换上一套说：大家，这一去，把师父、徒弟四个字儿且收起。悟空说：都要做弟兄称呼：师父叫做唐大官儿，你叫做朱三官儿，沙僧叫做沙四官儿，我叫做孙二官儿。但到店中，你们切休言语，只让我一个开口答话。等他问什么买卖，只说是贩马的客人，把这白马做个样子。",
        "师徒四人忙忙的牵马挑担，跑过那边。悟空只推不知，引着他们，往斜对门一家安歇。那家子还未收灯笼，就近门叫说：店家，可有闲房儿，我们安歇？哪里边有个妇人答应说：有有有，请官人们上楼。说不了，就有一个汉子来牵马，悟空把马儿递与牵进去。只见有人点上灯来，悟空拦门，一口吹息说：这般月亮不用灯。那人才下去，又一个丫鬟拿四碗清茶，悟空接住。悟空说：我们是北方来的，有几匹粗马贩卖。悟空说：这一位是唐大官，这一位是朱三官，这一位是沙四官，我学生是孙二官。悟空说：正是异姓同居：我们共有十个弟兄，我四个先来赁店房打火；",
        "上样者，五果五菜的筵席，狮仙斗糖桌面，二位一张，请小娘儿来陪唱陪歇，每位该银五钱，连房钱在内。悟空笑说：相应呵，我哪里五钱银子还不勾请小娘儿哩。寡妇又说：中样者，合盘桌儿，只是水果、热酒，筛来凭自家猜枚行令，不用小娘儿，每位只该二钱银子。悟空说：也说说无妨，我们好拣相应的干。妇人说：下样者，没人伏侍，锅里有方就的饭，凭他怎么吃；吃饱了，拿个草儿，打个地铺，方就处睡觉。唐僧在楼上听见说：孙二官，怎好？去那楼门边跌跌脚说：赵妈妈，你上来。悟空说：今日且不要杀生，我们今日斋戒。寡妇惊讶说：官人们是长斋，是月斋？",
        "悟空说：止唐大官不用，我们也吃几杯。悟空说：妈妈，底下倒了什么家火了？寡妇说：不是，是我小庄上几个客子送租米来晚了，让他在底下睡。悟空说：早是说哩，快不要去请：一则斋戒日期，二则兄弟们未到。寡妇说：好人，好人，又不失了和气，又养了精神。唐僧在悟空耳根边悄悄的说：哪里睡？我们都辛辛苦苦的，倘或睡着，这家子一时再有人来收拾，见我们或滚了帽子，露出光头，认得是和尚，嚷将起来，却怎么好？又去楼前跌跌脚，寡妇又上来说：孙官人又有甚吩咐？我这朱三官儿有些寒湿气，沙四官儿有些漏肩风，唐大哥只要在黑处睡，我也有一些羞明，这里不是睡处。",
        "那贼得了手，不往西去，倒抬向城东，杀了守门的军，打开城门出去。众官军没有拿得半个强盗，只是夺下柜，捉住马，得胜而回。总兵官把自家马儿不骑，就骑上这个白马，帅军兵进城，把柜子抬在总府，同兵马写个封皮封了，令人巡守到天明启奏，请旨定夺。再说唐僧在柜里埋怨悟空说：你这个猴头，害杀我也。若在外边，被人抓住，送与灭法国王，还好折辨；如今锁在柜里，被贼劫去，又被官军夺来，明日见了国王，现现成成的开刀请杀，却不凑了他一万之数？悟空说：外面有人打开柜，拿出来，不是捆着，就是吊着。明日见那昏君，我自有登答，管你一毫儿也不伤。",
        "又将金箍棒取在手中，掂一掂，幌一幌，叫声：宝贝，变！他拿一把，吩咐小悟空各拿一把，都去皇宫内院、五府六部、各衙门里剃头。忙移灯到龙床下看处，锦被窝中，睡着一个和尚，皇后忍不住言语出来，惊醒国王。那国王急睁睛，见皇后的头光，他连忙爬起来说：梓童，你怎么这等？那皇帝摸摸头，吓得三尸呻咋，七魄飞空，说：朕当怎么来耶？正慌忙处，只见那六院嫔妃、宫娥彩女、大小太监，皆光着头跪下说：陛下，我们做了和尚耶。国王见了，眼中流泪说：想是我杀害和尚……就传旨吩咐：你们不得说出落发之事，恐文武群臣褒贬国家不正。"
      ],
      "85": [
        "君臣们都各汪汪滴泪说：从此后，再不敢杀戮和尚也。王又说：有事出班来奏，无事卷帘散朝。只见那武班中闪出巡城总兵官，文班中走出东城兵马使，当阶磕头说：臣蒙圣旨巡城，夜来获得贼脏一柜、白马一匹。唐僧在内，魂不附体说：徒弟们，这一到国王前，怎么理说？悟空笑说：不要嚷，我已打点停当了，开柜时，他就拜我们为师哩。八戒说：但只免杀，就是很大的福气，还敢争竞哩。方揭了盖，猪八戒就忍不住往外一跳，吓得那多官胆战，口不能言。又见悟空搀出唐僧，沙僧搬出行李。八戒见总兵官牵着马，走上前，咄的一声说：马是我的，拿过来。",
        "八戒听言，呵呵大笑说：既要拜为门徒，有何贽见之礼？国王说：师若肯从，愿将国中财宝献上。悟空说：不要说财宝，我和尚是有道之僧。那国王听说，就着光禄寺大排筵宴。悟空说：陛下法国之名甚好，但只灭字不通。摆整朝銮驾，送唐僧师徒四人出城西去。再说唐僧辞别了钦法国王，在马上欣然说：悟空，此一法甚善，大有功也。沙僧说：哥呵，是哪里寻这许多整容匠，连夜剃这许多头？悟空把那施变化弄神通的事说了一遍。唐僧勒马说：徒弟们，你看这面前山势崔巍，切须仔细。悟空笑说：放心，放心，保你无事。我看那山峰挺立，远远的有些凶气，暴云飞出，渐觉惊惶，满身麻木，神思不安。",
        "唐僧说：这风来得甚急，决然不是天风。悟空说：自古来，风从地起，云自山出，怎么得个天风？唐僧一发心惊说：悟空，风还未定，怎么又这般雾起？悟空说：且不要忙，请师父下马，你兄弟二个在此保守，等我去看看是何吉凶。悟空暗笑说：我师父也有一些先兆，他说不是天风，果然此风是个妖精在这里弄喧儿哩。若我使铁棒往下就打，这叫做捣蒜打，打就打死了，只是坏了我的名头。那悟空一生豪杰，再不晓得暗算计人。他说：我且回去，照顾猪八戒照顾，让他来先与这妖精见一仗。若是八戒有本事，打倒这妖，算了好运气；若无手段，被这妖拿去，等我再去救他，才好出名。",
        "我只说风雾之中恐有妖怪，原来不是。悟空说：前面不远，原来是一庄村。悟空说：吃不多儿，因那菜蔬太咸了些，不喜多吃。八戒笑说：你若不言语，我就去了。悟空说：我不言语，看你怎么得去？那八戒吃嘴的见识偏有，走上前，唱个大喏说：师父，适才师兄说，前村里有人家给和尚饭吃。你看这马，有些要打搅人家，就要草要料，却不费事？唐僧欢喜说：好呵，你今日却怎肯这等勤谨？悟空追上扯住说：兄弟，他哪里给和尚饭吃，只斋俊的，不斋丑的。好八戒，他也有三十六般变化，走到山凹里，捻着诀，念动咒语，摇身一变，变做个矮瘦和尚。",
        "那八戒被他扯急了，就现出原身，腰间抽出钉钯，一顿乱筑，筑退那些小妖。小妖急跑去报与老妖说：大王，祸事了。小妖说：山过来了一个和尚，且是生得干净。我说拿家来蒸他吃，若吃不了，留一些防天阴。双手抡一根钉钯，没头没脸的乱筑，吓得我们跑回来报大王也。抡着一条铁杵，走近前看时，见那八戒果然丑恶。笑说：我的儿，你是也不认得你猪祖宗哩。铁脚天蓬本姓猪，法名唤作猪八戒。那妖精听完，喝说：你原来是唐僧的徒弟。我一向听见唐僧的肉好吃，正要拿你哩，你却撞得来，我肯饶你？八戒说：孽畜，你原来是个染博士出身。八戒说：不是染博士，怎么会使棒槌？钯丢解数滚狂风，杵运机谋飞骤雨。",
        "再说悟空在唐僧背后，忽失声冷笑。悟空说：猪八戒真个呆呀，听见说给和尚饭吃，就被我哄去了。这早晚还不见回来：若是一顿钯打退妖精，你看他得胜而回，争嚷功果；若战他不过，被他拿去，却是我的晦气，背前面后，不知骂了多少弼马温哩。好悟空，他也不使唐僧知道，悄悄的脑后拔了一根毫毛，吹口仙气，叫：变！悟空忍不住，按落云头，大声说：八戒不要忙，我来了。那八戒听得是悟空声音，仗着势，愈长威风，一顿钯，向前乱筑。那妖精抵敌不住，说：这和尚先前不济，这会子怎么又发起狠来？八戒说：我的儿，不可欺负我，我家里人来也。",
        "──八戒，你过来，一发照顾你照顾。悟空说：你做个开路将军，在前剖路。那妖精不来就罢，若来时，你与他赌斗，打倒妖精，算你的功果。八戒量着那妖精手段与他差不多，再说：我就死在他手内也罢，等我先走。悟空笑说：这八戒先说晦气话，怎么得长进？八戒说：哥哥，你知说：公子登筵，不醉就饱；悟空欢喜，就忙背了马，请师父骑上，沙僧挑着行李，相随八戒，一路入山暂且不说。正都在悚惧之际，又一个小妖上前说：大王不要恼，不要怕。若是要吃唐僧，等我定个计策拿他。小妖说：如今把洞口大小群妖点将起来，千中选百，百中选十，十中只选三个。",
        "悟空说：师父，不好了，八戒的眼拙，放那妖精来拿你，且等我打他去。两个在草坡下一撞一冲，正相持处，又听得山背后呼的风响，又跳出个妖精来，径奔唐僧。沙僧见了，大惊说：师父，大哥与二哥的眼都花了，把妖精放将来拿你了。这和尚也不分好歹，就抽出杖，对面挡住那妖精铁杵，恨苦相持，吆吆喝喝，乱嚷乱斗，渐渐的调远。那老怪在半空中见唐僧独坐马上，伸下五爪钢钩，把唐僧一把挝住。你看那唐僧苦捱着绳缠索绑，紧缚牢拴，止不住腮边流泪，叫说：徒弟呀，你们在那山中擒怪，甚路里赶妖？正自两泪交流，只见对面树上有人叫说：唐僧，你也进来了？"
      ],
      "86": [
        "话说孙悟空牵着马，挑着担，满山头寻叫师父，忽见猪八戒气呼呼的跑将来说：哥哥，你喊怎么？悟空说：师父不见了，你可曾看见？八戒说：我原来只跟唐僧做和尚的，你又捉弄我，教做什么将军。师父是你与沙僧看着的，反来问我？你不知怎么眼花了，把妖精放回来拿师父。我去打那妖精，教沙僧看着师父的，如今连沙僧也不见了。八戒笑说：想是沙僧带师父哪里出恭去了。沙僧说：你两个眼都昏了，把妖精放将来拿师父。老沙去打那妖精的，师父自家在马上坐来。悟空气得暴跳说：中他计了，中他计了。悟空说：这是分瓣梅花计，把我弟兄们调开，他劈心里捞了师父去了。",
        "我记得悟空是个宽洪海量的猴头，虽则他神通广大，却好奉承。我们拿个假人头出去哄他一哄，奉承他几句，只说他师父是我们吃了。若还哄得他去了，唐僧还是我们受用；好妖怪，将一把钢刀斧，把柳树根砍做个人头模样，喷上些人血，糊糊涂涂的，着一个小怪，使漆盘儿拿至门下，叫说：悟空爷爷，息怒容禀。悟空果好奉承，听见叫声悟空爷爷，就就止住八戒：且不要动手，看他有甚话说。拿盘的小怪说：你师父被我大王拿进洞来，洞里小妖村顽，不识好歹，这个来吞，那个来啃，抓的抓，咬的咬，把你师父吃了，只剩了一个头在这里也。悟空说：既吃了就罢，只拿出人头来，我看是真是假。",
        "才叫沙僧：你与哥哥哭着，等我去寻些什么供养供养。八戒说：这柳枝权为松柏，与师父遮遮坟顶；悟空喝说：夯货，人已死了，还将石子儿供他。八戒说：表表生人意，权为孝道心。教沙僧在此：一则庐墓，二则看守行李、马匹。好八戒，就脱了皂锦直裰，束一束着体小衣，举钯随着悟空，二人努力向前，不容分辨，径自把他石门打破，喊声振天，叫说：还我活唐僧来耶！那洞里大小群妖，一个个魂飞魄散，都报怨先锋的不是。老妖问先锋说：这些和尚打进门来，却怎处治？先锋说：古人说得好：手插鱼篮，避不得腥。这悟空与八戒急退几步，到那山场平处，抵住群妖，喝说：那个是出名的头",
        "那先锋不能变化，早被悟空一棒打倒，现出本相，原来是个铁背苍狼怪。八戒上前扯着脚，翻过来看了说：这个家伙从小儿也不知偷了人家多少猪牙子、羊羔儿吃了。悟空将身一抖，收上毫毛说：八戒，不可迟慢，快赶老怪，讨师父的命去来。八戒回头，就不见那些小悟空，说：哥哥的法相儿都去了。这悟空引八戒，追到门首吆喝，内无人答应。悟空知之，说：八戒，不要费气力，他把门已堵了。悟空说：且回上墓前，看看沙僧去。八戒越发伤悲，丢了钯，伏在坟上，手扑着土哭说：苦命的师父呵！八戒滴泪说：哥呵，仔细着，不要连你也捞去了，我们不好哭得：哭一声师父，哭一声师兄，就要哭得乱了。",
        "好悟空，收了棒，束束裙，拽开步，转过山坡，忽听得潺潺水响。若要是原嘴脸，恐有小妖开门看见认得，等我变作个水蛇儿过去。且住，变水蛇恐师父的阴灵儿知道，怪我出家人变蛇缠长。就变做一个水老鼠，飕的一声撺过去，从那出水的沟中，钻至里面天井中。探着头儿观看，只见那向阳处有个小妖，拿些人肉巴子，一块块的理着晒哩。悟空说：我的儿呵，那想是师父的肉吃不了，晒干巴子防天阴的。我要现本相，追上前，一棍子打杀，显得我有勇无谋。跳出沟，摇身一变，变做个有翅的蚂蚁儿。真个是：力微身小号玄驹，日久藏修有翅飞。他展开翅，无声无影，一直飞入中堂。",
        "悟空说：师父不要只管叫名字：面前有人，怕走了风汛。那妖怪只说已将你吃了，拿个假人头哄我，我们与他恨苦相持。师父放心，且再熬熬儿，等我把那妖精弄倒，方好来解救。悟空念声咒语，却又摇身还变做个蚂蚁儿，复入中堂，丁在正梁之上。内中忽跳出一个小妖，告说：大王，他们见堵了门，攻打不开，死心塌地，舍了唐僧，将假人头弄做个坟墓。打听得他们散了呵，把唐僧拿出来，碎劖碎剁，把些大料煎了，香喷喷的大家吃一块儿，也得个延年长寿。又一个小妖拍着手说：不要说，不要说，还是蒸了吃的有味。又一个说：他本是个稀奇之物，还着些盐儿腌腌，吃得长久。",
        "唐僧立定身，叫：悟空，那个人也解他一解。他是个樵子，说有母亲年老，甚是思想，倒是个尽孝的，一发连他都救了罢。悟空依言，也解了绳索，一同带出后门，上石崖，过了陡涧。唐僧谢说：贤徒，亏你救了他与我命。那八戒哭得昏头昏脑的，揩揩鼻涕眼泪说：沙僧，师父回家来显魂哩，在哪里叫我们不是？悟空上前，喝了一声说：夯货，显什么魂？那沙僧抬头见了，忙忙跪在面前说：师父，你受了多少苦呵！八戒听完，咬牙恨齿，忍不住举起钯把那坟冢一顿筑倒，掘出那人头，一顿筑得稀烂。八戒说：师父呵，不知他是那家的亡人，让我朝着他哭。",
        "这樵子看见自家母亲，丢了唐僧，急忙忙先跑到柴扉前，跪下叫说：母亲，儿来也。老妪一把抱住说：儿呵，你这几日不来家，我只说是山主拿你去，害了性命，是我心疼难忍。樵子磕头说：母亲，儿已被山主拿去，绑在树上，实是难得性命，幸亏这几位老爷。他那三位徒弟老爷神通广大，把山主一顿打死。概众小妖，具尽烧死，却将那老老爷解下救出，连孩儿都解救出来。那老妪听言，一步一拜，拜接唐僧师徒四人，都入柴扉茅舍中坐下。八戒说：樵哥，我知你家里也寒薄，只可将就一饭，切不要费心大摆布。樵子说：不瞒老爷说，我这山间实是寒薄，没什么香蕈、蘑菰、川椒、大料，只是几品野菜奉献老爷，权表寸心。"
      ],
      "87": [
        "悟空摇手说：不是，不是﹗如来处虽称极乐，却没有城池，原来是一座大山，山中有楼台殿阁，唤做灵山大雷音寺。唐僧下马，入到三层门里，见那民事荒凉，街衢冷落。猪八戒村愚，把长嘴掬一掬，叫说：让路，让路！那些人猛抬头，看见模样，一个个骨软筋麻，跌跌，都说：妖精来了﹗妖精来了！吓得那檐下冠带者，战兢兢躬身问：那方来者？唐僧恐他们闯祸，一力当先，对众说：贫僧原来东土大唐驾下拜天竺国大雷音寺佛祖求经者。那官人却才施礼说：这里原来天竺外郡，地名凤仙郡。连年干旱，郡侯差我们在此出榜，招求法师祈雨救民也。众官说：榜文在此，适间才打扫廊檐，还未张挂。",
        "众官听说，着两个急去郡中报说：老爷，万千之喜至也！那郡侯正焚香默祝，听得报声喜至，就问：何喜？那官说：今日领榜，方至市口张挂，就有四个和尚，称是东土大唐差往天竺国大雷音拜佛求经者，见榜就道能祈甘雨，特来报知。那郡侯一见唐僧，不怕他徒弟丑恶，当街心倒身下拜说：下官原来凤仙郡郡侯上官氏，熏沐拜请老师祈雨救民。郡侯说：\"老师同到小衙，自有洁净之处。悟空听说，满面喜生，呵呵的笑说：不要说，不要说﹗若说千金为谢，半点甘雨全无。那郡侯原来十分清正贤良，爱民心重，就请悟空上坐，低头下拜说：老师果舍慈悲，下官必不敢悖德。",
        "那敖广收了云脚，化作人形，走向前，对悟空躬身施礼说：悟空唤小龙来，那方使用？这里原来凤仙郡，连年干旱，问你如为什么不来下雨？老龙说：启上悟空得知，我虽能行雨，原来上天遣用之辈。悟空说：我因路过此方，见久旱民苦，特着你来此施雨救济，怎么推托？龙王说：岂敢推托﹖但悟空念真言呼唤，不敢不来。一则未奉上天御旨，二则未曾带得行雨神将，怎么动得雨部﹖悟空既有拔济之心，容小龙回海点兵，烦悟空到天宫奏准，请一道降雨的圣旨，请水官放出龙来，我却好照旨意数目下雨。悟空见他说出理来，只得发放老龙回海。他就跳出罡斗，对唐僧备言龙王之事。",
        "玉帝说：那三年前十二月二十五日，朕出行监观万天，浮游三界，驾至他方，见那上官正不仁，将斋天素供，推倒喂狗，口出秽言，造有冒犯之罪，朕就立以三事，在于披香殿内。四天师就引悟空至披香殿里看时，见有一座米山，约有十丈高下；左边悬一座铁架子，架上挂一把金锁，约有一尺三四寸长短，锁梃有指头粗细，下面有一盏明灯，灯焰儿燎着那锁梃。悟空不知其意，回头问天师说：此何意也？天师说：那触犯了上天，玉帝立此三事，直等鸡促了米尽，狗呆得面尽，灯焰燎断锁梃，那才该下雨哩。悟空听完，大惊失色，再不敢启奏。四大天师笑说：悟空不必烦恼，这事只宜作善可解。",
        "悟空说：披香殿立一座米山，约有十丈高下；左边又一座铁架子，架上挂一把黄金大锁，锁梃儿有指头粗细，下面有一盏明灯，灯焰儿燎着那锁梃。八戒笑说：不打紧，不打紧﹗哥肯带我去，变出法身来，一顿把他的米面都吃了，锁梃弄断了，管取下雨。悟空说：八戒不要胡说﹗此原来上天所设之计，你怎么得见？那郡侯拜伏在地，哀告说：但凭老师指教，下官一一皈依也。悟空说：你若回心向善，趁早儿念佛看经，我还替你作为；一那边又出飞报，教城里城外大家小户，不论男女人等，都要烧香念佛。对八戒、沙僧说：你两个好生护持师父，等我再与他去去来。",
        "那符使见了悟空，施礼说：此意原来悟空劝善之功。符使说：直送至通明殿上，与天师传递到玉皇大天尊前。悟空说：如此，你先行，我当随后而去。护国天王说：悟空，不消见玉帝了。真个悟空依言，入天门里，不上灵霄殿求请旨意，转云步，径往九天应元府，见那雷门使者、纠录典者、廉访典者都来迎着，施礼说：悟空何来？相见礼毕，悟空说：有一事特来奉求。悟空说：我因保唐僧，至凤仙郡，见那干旱之甚，已许他求雨，特来告借贵部官将到彼声雷。天尊说：我知那郡侯冒犯上天，立有三事，不知可该下雨哩。我愁难得倒断，天师让我劝化郡侯等众作善，以为‘人有善念，天必从之\"，庶几可以回天心，解灾难也。",
        "正说处，忽有披香殿看管的将官报说：所立米面山具倒了。奏未毕，又有当驾天官引凤仙郡土地、城隍、社令等神齐来拜奏说：本郡郡主并满城大小黎庶之家，无一家一人不皈依善果，礼佛敬天。玉帝听完大喜，就传旨：着风部、云部、雨部，各遵号令，去下方，按凤仙郡界，就于今日今时，声雷布云，降雨三尺零四十二点。悟空正与邓、辛、张、陶，令闪电娘子在空中调弄，只见神仙们都到，合会一天。全亏悟空施元运，万里江山处处阴。孙悟空大声说：那四部神仙们，且暂停云从，待我去叫郡侯拜谢大家。早见唐僧、八戒、沙僧，都来迎接。郡侯随传飞报，召众同酬，都一个个拈香朝拜。",
        "悟空又起在云端，对众作礼说：有劳，有劳﹗请大家各归本部。再说悟空坠落云头，与唐僧说：事毕民安，可收拾走路矣。那郡侯听完，急忙行礼说：孙老爷说什么话﹗今此一场，原来无量无边之恩德。下官这里差人办备小宴，奉答厚恩。唐僧说：大人之言虽当，但我们原来西方挂搭行脚之僧，不敢久住。唐僧惊讶说：功程浩大，何成之如此速耶？悟空笑说：果是贤才能干的好贤侯也！唐僧说：有，留名当唤做‘甘霖普济寺’。又起盖雷神、龙神等庙，以答神功。"
      ],
      "88": [
        "话说唐僧喜喜欢欢别了郡侯，在马上向悟空说：贤徒，这一场善果，真胜似比丘国搭救儿童，皆尔之功也。沙僧说：比丘国只救得一千一百一十一个小儿，怎似这场大雨滂沱浸润，活勾者万万千千性命？八戒笑说：哥的恩也有，善也有，却只是外施仁义，内包祸心。唐僧听完，喝说：这个八戒，怎么只思量掳嘴？八戒不敢言，掬掬嘴，挑着行囊，打着哈哈，师徒们奔上大路。唐僧举鞭遥指叫：悟空，你看哪里又有一座城池，却不知是甚地方？悟空说：你我具未曾到，何以知之？慌忙唐僧滚鞍下马，上前道个行礼问候。那老者扶杖还礼说：唐僧那方来的？",
        "那八戒低了头，沙僧掩着脸，惟悟空搀着师父。两边人都来争看，齐声叫说：我这里只有降龙伏虎的高僧，没有见降猪伏猴的和尚。八戒忍不住，把嘴一掬说：你们可曾看见降猪王的和尚？悟空笑说：八戒，快藏了嘴，不要装扮，仔细脚下过桥。唐僧心中暗喜说：人言西域诸番，更没有到此。唐僧说：徒弟，这里是府，等我进去朝王，验牒而行。八戒说：师父进去，我们可好在衙门前站立？唐僧说：你不看这门上是待客馆三字？悟空说：师父放心过去，我自当理会。馆中有看馆的人役，见他们面貌丑陋，也不敢问他，也不敢让他出去，只得让他坐下暂且不说。",
        "唐僧：启上殿下：贫僧有三个小徒在外等候，不敢领斋，但恐迟误行程。王子吩咐：当殿官，快去请唐僧三位徒弟，进府同斋。当殿官随出外相请，都说：未曾见，未曾见。有跟随的人说：待客馆中坐着三个丑貌和尚，想必是也。当殿官同众至馆中，就问看馆的说：那个是大唐取经僧的高徒？八戒正坐打盹，听见一个斋字，忍不住跳起身来答说：我们是，我们是。当殿官一见了，魂飞魄丧，都战战的说：是个猪魈，猪魈。悟空听见，一把扯住八戒说：兄弟，放斯文些，不要撒村野。那众官见了悟空，又说：是个猴精，猴精。悟空就教八戒牵马，沙僧挑担，同众入玉华王府。",
        "小王子不分好歹，闯将进去，喝说：你们是人是怪？吓得唐僧面容失色，丢下饭碗，躬着身说：贫僧原来唐朝来取经者，人也，非怪也。小王子说：你就还像个人，那三个丑的一定是怪。沙僧与悟空欠身说：我们具是人，面虽丑而心良，身虽夯而性善。旁边有典膳等官说：三位是我王之子小殿下。八戒丢了碗说：小殿下，各拿兵器怎么？二王子抽出开步，双手舞钯，就要打八戒。八戒嘻嘻笑说：你那钯只好与我这钯做孙子罢了。就揭衣，腰间拿出钯来，幌一幌，金光万道。悟空见大的个使一条齐眉棍，跳阿跳的，就耳朵里拿出金箍棒来，幌一幌，碗来粗细，有丈二三长短。",
        "第三个撒起莽性，使乌油棒就来打。被沙僧一手劈开，拿出降妖宝杖，捻一捻，艳艳光生，纷纷霞亮。三个小王子一齐下拜说：神师，神师，我们凡人不识，还请施展一番，我们好拜授也。悟空走近前，轻轻的把棒拿将起来说：这里窄狭，不好展手。好悟空，哨一声，将筋斗一抖，两只脚踏着五色祥云，起在半空，离地约有三百步高下。八戒在底下喝声采，也忍不住手脚，厉声喊说：等八戒也去耍耍来。好八戒，驾起风头，也到半空，丢开钯，上三下四，左五右六，前七后八，满身解数，只听得呼呼风响。正使到热闹处，沙僧对唐僧说：师父，也等老沙去操演操演。",
        "老王起身说：唐老师父，孤有一事奉求，不知三位高徒可能容否？唐僧说：但凭千岁吩咐，小徒不敢不从。老王说：孤先见大家时，只以为唐朝远来行脚僧，其实肉眼凡胎，多致轻亵。悟空听完，忍不住呵呵笑说：你这殿下，好不会事。这唐僧昨日相见还是王礼，今日就行师礼。那三个小王子对悟空、八戒、沙僧当面磕头，拜问：尊师之兵器，还借出来与弟子们看看。八戒听完，欣然拿出钉钯，抛在地下。二王子与三王子跳起去就拿，就如蜻蜓撼石柱，一个个挣得红头赤脸，不要想拿动半分毫。大王子见了，叫说：兄弟，不要费力了。",
        "八戒笑说：我的钯也没多重，只有一藏之数，连柄五千零四十八斤。悟空去耳朵里拿出一个针儿来，迎风幌一幌，就有碗来粗细，直直的竖立面前。三个小王子礼拜说：猪师、沙师之兵，具随身带在衣下，就可取之。孙师为什么自耳中拿出，见风就长，何也？悟空笑说：你不知我这棒不是凡间等闲可有者。王子说：愿使棍的就学棍，惯使钯的就学钯，爱用杖的就学杖。悟空笑说：教就也容易，只是你们无力量，使不得我们的兵器，恐学之不精，如画虎不成反类狗也。古人云：训教不严师之惰，学问无成子之罪。",
        "悟空转下身来，对唐僧行礼说：告尊师，恕弟子之罪。自当年在两界山蒙师父大德救脱弟子，秉教沙门，一向西来，虽没有重报师恩，却也曾渡水登山，竭尽心力。八戒、沙僧见悟空行礼，也就转身朝唐僧磕头说：师父，我们愚鲁，拙口钝腮，不会说话。运遍了子午周天，那三个小王子才甦醒，一齐爬将起来，抹抹脸，精神抖擞，一个个骨壮筋强：大王子就拿得金箍棒，二王子就抡得九齿钯，三王子就举得降妖杖。虽然打几个转身，丢几般解数，此等终是凡夫，有些着力：走一路，就喘气嘘嘘，不能耐久。盖他那兵器都有变化，其进退攻扬，随消随长，皆有自然之妙，此等终是凡夫，岂能以遽及也？"
      ],
      "89": [
        "快拿出来，略迟了一些，就都打死，打死。那铁匠慌忙磕头滴泪说：爷爷，我们连日辛苦，夜间睡着，原来至天明起来，于是不见了。悟空无语，暗恨说：还是我们的不是，既然看了式样，就该收在身边，怎么却丢放在此？定是铁匠欺心，他见我们的兵器光彩，认得是三件宝贝，连夜走出王府，伙些人来，抬的抬，拉的拉，偷出去了。正嚷处，只见老王子出来，问及前事，却也面无人色，沉吟半晌说：神师兵器，本不同凡，就有百十余人也禁挫不动。悟空笑说：不用再思，也不须苦赖铁匠。我问殿下：你这州城四面，可有什么山林妖怪？往往人言洞内有仙，又言有虎狼，又言有妖怪。",
        "悟空笑说：不消讲了，定是那方歹人，知道具是宝贝，一夜偷将去了。叫：八戒、 沙僧，你都在此保着师父，护着城池，等我寻访去来。好猴王，辞了唐僧，哨一声，形影不见，早跨到豹头山上。山鸦山鹊乱飞鸣，野鹤野猴皆啸唳。悟空正然看时，忽听得山背后有人言语。急回头视之，原来两个狼头妖怪，朗朗的说着话，向西北上走。悟空揣说：这定是巡山的怪物，等我跟他去听听，看他说些甚的。捻着诀，念个咒，摇身一变，变做个蝴蝶儿，展开翅，翩翩翻翻，径自追上。果然变得有样范：一双粉翅，两道银须。那妖猛的叫说：二哥，我大王连日侥幸：前月里得了一个美人儿，在洞内盘桓，十分快乐；",
        "那妖怪看看走到身边，被他一口法唾喷将去，念一声唵吽咤唎，就使个定身法，把两个狼头精定住。又将他扳翻倒，揭衣搜检，果是有二十两银子，着一条搭包儿打在腰间裙带上；好悟空，取了他银子，解了他牌儿，返跨步回至州城。到王府中，见了王子、 唐僧并大小官员、匠作人等，具言前事。八戒笑说：想是八戒的宝贝霞彩光明，所以买猪羊，治筵席庆贺哩。八戒，你变做刁钻古怪，我变做古怪刁钻，沙僧装做个贩猪羊的客人，走进那虎口洞里，得就处，各人拿了兵器，打绝那妖邪，回来却收拾走路。沙僧笑说：妙妙妙，不宜迟，快走。八戒说：哥哥，我未曾看见那刁钻古怪，怎生变得他模样？",
        "那妖怪左胁下挟着一个彩漆的请书匣儿，迎着悟空叫说：古怪刁钻，你两个来了？那妖怪说：我往竹节山去请老大王明早赴会。悟空绰他的口气儿，就问：共请多少人？那妖怪说：请老大王坐首席，连本山大王共头目等众，约有四十多位。正说处，八戒说：去罢，去罢，猪羊都四散走了。悟空说：你去邀着，等我讨他帖儿看看。那妖怪见自家人，就揭开拿出，递与悟空。悟空展开看时，上写着：明辰敬治肴酌，庆钉钯嘉会，屈尊过山一叙。那妖怪放在匣内，径往东南上去了。沙僧问：哥哥，帖儿上是什么话头？沙僧笑说：黄狮想必是个金毛狮子成精。",
        "那妖怪王随后跟着说：客人，那中间放光亮的就是钉钯，你看就看，只是出去，千万不要与人说。那八戒一生是个鲁夯的人，他见了钉钯，哪里与他叙什么情节，跑上去，拿下来，抡在手中，现了本相，丢了解数，望妖精劈脸就筑。这悟空、沙僧也奔至两山头各拿器械，现了原身，三兄弟一齐乱打。慌忙那妖怪王急抽身闪过，转入后边，取一柄四明铲，杆长鐏利，赶到天井中，支住他三般兵器，厉声喝说：你是甚人，敢弄虚头，骗我宝贝？因至玉华州倒换关文，蒙贤王让他三个王子拜我们为师，学习武艺，将我们宝贝作样，打造如式兵器。因放在院中，被你这贼毛团夤夜入城偷来，倒说我弄虚头骗你宝贝。",
        "沙僧就拿出干柴放起火来、八戒使两个耳朵扇风，把一个巢穴一时烧得干净。老王父子与唐僧具在暴纱亭盼望，只见他们扑哩扑剌的丢下一院子死兽、猪羊及细软物件。一齐叫说：师父，我们已得胜回来也。三个小王子跪拜于地，沙僧搀起说：且不要谢，都近前看看那物件。悟空笑说：那虎狼彪豹、马鹿山羊，都是成精的妖怪。我们没有赶他，却扫除他归路，打杀这些群妖，搜寻他这些物件，带将来的。悟空说：殿下放心，我已虑之熟，处之当矣。我午间去时，撞见一个青脸红毛的小妖送请书，我看他帖子上写着：明辰敬治肴酌，庆钉钯嘉会，屈尊过山一叙。",
        "三人就各抢去一件，现出原身：一个是毛脸雷公嘴的和尚，一个是长嘴大耳朵的和尚，一个是晦气色脸的和尚。是小孙急取四明铲赶出与他相持，问是什么人敢弄虚头。他道是东土大唐差往西天去的唐僧之徒弟，因过州城，倒换关文，被王子留住，习学武艺，将他这三件兵器作样子打造，放在院内，被我偷来，于是此不忿相持。望拔刀相助，拿那和尚报仇，庶见我祖爱孙之意也。老妖听完，默想片时，笑说：原来是他。老妖说：那长嘴大耳者，原来猪八戒；晦气色脸者，原来沙僧：这两个犹可。这个人其实神通广大：五百年前曾大闹天宫，十万天兵也没有拿得住。",
        "昨日这早晚领了银子去买猪羊，走至山西边大路之上，见一个毛脸雷公嘴的和尚，他啐了我们一口，我们就脚软口强，不能言语，不能移步。老妖叫猱狮扯他过来说：贤孙，事已至此，徒恼无益。且养全锐气，到州城里拿那和尚去。那妖精犹不肯住哭，说：老爷，我那们个山场，非一日治的，今被这秃厮尽毁，我却要此命做甚的？那王子唐僧等正在暴纱亭吃早斋，听得人报祸事，却出门来问。众人说：一群妖精，飞沙走石、喷雾掀风的来近城了。那王子果传令把四门闭了，点起人夫上城，他父子并唐僧在城楼上点劄，旌旗蔽日，炮火连天。悟空三人，却半云半雾，出城迎敌。"
      ],
      "90": [
        "两个才交手还未见高低，那猱狮精抡一根铁蒺藜，雪狮精使一条三楞简，径来奔打。你看这那边，沙僧急抽出降妖杖，近前相助。七狮七器甚锋芒，围战三僧齐呐喊。悟空金箍铁棒凶，沙僧宝杖人间罕。八戒颠风骋势雄，钉钯晃亮光华惨。被那雪狮、猱狮二精喝说：哪里走？八戒躲闪不及，被他照脊梁上打了一简，睡在地下，只叫：罢了，罢了。两个精把八戒采鬃拖尾，扛将去见那九头狮子，报说：祖爷，我们拿了一个来也。说不了，沙僧、悟空也都战败，妖怪们精一齐赶来。被悟空拔一把毫毛，嚼碎喷将去，叫声：变！就变做百十个小悟空，围围绕绕，将那白泽、狻猊、抟象、伏狸并金毛狮怪围裹在中。",
        "老怪见失了二狮，吩咐：把猪八戒捆了，不可伤他性命。他若无知，坏了我二狮，就将八戒杀了对命。再说孙悟空把两个狮子精抬近城边，老王见了，就传令开门，差二三十个校尉，拿绳赶出门，绑了狮精，扛入城里。孙悟空收了法毛，同沙僧径至城楼上，见了唐僧。悟空说：没事，我们把这两个妖精拿了，他哪里断不敢伤。且将二精牢拴紧缚，待明早抵换八戒也。三个小王子对悟空磕头说：师父先前赌斗，只见一身；悟空笑说：我身上有八万四千毫毛，以一化十，以十化百，百千万亿之变化，皆身外身之法也。老怪就唤黄狮精定计说：你们今日用心拿那悟空、沙僧；",
        "当时拖倒猱狮，活捉了雪狮，抓住了抟象狮，扛翻了伏狸狮，将黄狮打死，烘烘的嚷到州城之下。那城上官看见，却又开门，将绳把五个狮精又捆了，抬进城去。还未发落，只见那王妃哭哭起来啼，对悟空礼拜说：神师呵，我殿下父子并你师父，性命休矣。悟空收了法毛，对王妃作礼说：贤后不要愁。只因我拿他七个狮精，那老妖弄摄法，定将我师父与殿下父子摄去，料必无伤。那王妃一簇女眷听见此言，都对悟空下拜说：愿求殿下父子全生，皇图坚固。悟空吩咐各官：将打死的黄狮精，剥了皮；至次日，悟空领沙僧驾起祥云，不多时，到于竹节山头。他两个正在山头上看景，忽见那青脸儿手拿一条短棍，径跑出崖谷之间。",
        "他就大开了洞门，不答话，径奔悟空。那老妖把头摇一摇，左右八个头，一齐张开口，把悟空、沙僧轻轻的又啣于洞内。那刁钻古怪、古怪刁钻与青脸儿是昨夜逃生而回者，就拿两条绳，把他二人着实捆了。老妖问：你这泼猴，把我那七个儿孙捉了；小妖们，选荆条柳棍来，且打这猴头一顿，与我黄狮孙报报冤仇。悟空本是熬炼过的身体，那些些柳棍儿，只好与他拂痒，他哪里做声，凭他怎么捶打，略不介意。八戒、唐僧与王子见了，一个个毛骨悚然。沙僧见打得多了，甚不过意说：我替他打百十下罢。老妖说：你且不要忙，明日就打到你了。八戒着忙说：后日就打到我八戒也。",
        "点着火，前后赶看，只见沙僧还背贴在廊下站哩。也不去追赶，将破门补的补，遮的遮，固守家业暂且不说。再说孙悟空出了那九曲盘桓洞，跨祥云，径转玉华州。城隍说：小神等知悟空下降玉华州，因有贤王款留，故不敢见。悟空正在嗔怪处，又见金头揭谛、六甲六丁神将押着一尊土地，跪在面前说：悟空，我们捉得这个地里鬼来也。悟空喝说：你们不在竹节山护我师父，却怎么嚷到这里？丁甲神说：悟空，那妖精自你逃时，复捉住卷帘大将，依然捆了。他知那妖精的根由，乞悟空问他一问，就好处治，以救圣僧、贤王之苦。那土地战兢兢磕头说：那老妖前年下降竹节山。",
        "天王说：那厢因你欲为人师，所以惹出这一窝狮子来也。悟空进了东天门，不多时，到妙岩宫前。那宫门立着一个穿霓帔的仙童，忽见孙悟空，就入宫报说：爷爷，外面是闹天宫的齐天悟空来了。太乙救苦天尊听得，就唤侍卫众仙迎接。天尊答礼说：悟空，这几年不见，前听见你弃道归佛，保唐僧西天取经，想是功行完了？但如今因保唐僧到玉华州，蒙王子遣三子拜我们为师，习学武艺，把我们三件神兵照样打造，不期夜间被贼偷去。我用计拿出，那精就伙了若干狮精与我大闹。内有一个九头狮子，神通广大，将我师父与八戒并王父子四人都啣去，到一竹节山九曲盘桓洞。",
        "叫狮奴说：你且起来，饶你死罪，跟我与悟空下方去收他来。天尊于是与悟空、狮奴，踏云径至竹节山。悟空说：你们护祐，可曾伤着我师？神仙们说：妖精着了恼睡了，更没有动甚刑罚。天尊说：我那元圣儿也是一个久修得道的真灵：他喊一声，上通三圣，下彻九泉，等闲也就不伤生。悟空听言，果抽出棒跳近洞口，高骂说：泼妖精，还我人来也。连叫了数声，那老妖睡着了，无人答应。悟空性急起来，抡铁棒，往内打进，口中不住的喊骂。妖精赶到外边，骂说：贼猴，哪里走？悟空站在高崖上笑说：你还敢这等大胆无礼，你死活也不知哩，这不是你老爷陛下在此？",
        "把五个都剁做一二两重的块子，差校尉散给州城内外军民人等，各吃些须：一则尝尝滋味，二则押押惊恐。又见那铁匠人等造成了三般兵器，对悟空磕头说：爷爷，小妖们工都完了。铁匠说：金箍棒有千斤，九齿钯与降妖杖各有八百斤。三子对老王说：父王，今日兵器完矣。老王说：为此兵器，几乎伤了我父子之命。小王子说：幸蒙神师施法，救出我们，却又扫荡妖邪，除了后患。唐僧又教悟空等快传武艺，不要误行程。一则那诸王子心坚，二则亏孙悟空先授了神力，此所以那千斤之棒，八百斤之钯、杖，具能举能运；八戒在旁边说：金银实不敢受，奈何我这件衣服被那些狮子精扯拉破了，但与我们换件衣服，足为爱也。"
      ],
      "91": [
        "话表唐僧师徒师徒四人离了玉华城，一路平稳，诚所谓极乐之乡。但城上有杆无旗，不知地方，俟近前再问。街衢中有几个无事闲游的浪子，见猪八戒嘴长，沙僧脸黑，悟空眼红，都拥拥簇簇的争看，只是不敢近前而问。唐僧说：这里略进去歇歇马，打一个斋怎么？师徒四人正看时，又见廊下走出一个和尚，对唐僧作礼说：老师何来？慌忙唐僧搀起说：院主何为行此大礼？那和尚合掌说：我这里向善的人，看经念佛，都指望修到你中华地托生。那和尚领唐僧入正殿，拜了佛像，唐僧才招呼徒弟进来。原来悟空三人自见那和尚与师父讲话，他都背着脸，牵着马，守着担，站在一处，和尚没有在心。",
        "唐僧言：我奉唐王圣旨，向灵山拜佛求经。适过宝方，特奔上刹，一则求问地方，二则打顿斋食就行。这先进去的又叫说：你们都来看看中华人物。和尚们说：我这里原来天竺国外郡，金平府是也。唐僧说：贵府至灵山还有许多远近？斋罢，唐僧要行，却被和尚们并斋主款留说：老师宽住一二日，过了元宵，耍耍去不妨。唐僧惊问：弟子在路，只知有山有水，怕的是逢怪逢魔，把光阴都错过了，不知几时是元宵佳节？和尚们笑说：老师拜佛与悟禅心重，故不以此为念。唐僧等都出方丈来看了灯，各自归寝。芍药花、牡丹花、紫薇花、含笑花，天机方醒；",
        "次日，唐僧对和尚们说：弟子原有扫塔之愿，趁今日上元佳节，请院主开了塔门，让弟子了此愿心。到了一层，就披了袈裟，拜佛祷祝毕，就将笤帚扫了一层，卸了袈裟，付与沙僧。和尚们说：老师父，我们前晚只在荒山与关厢看灯，今晚正节，进城看看金灯怎么？唐僧欣然从之，同悟空三人及本寺多僧进城看灯。那月如冯夷推上烂银盘，这灯似仙女织成铺地锦。绿水桥边，闹吵吵，锦簇簇，醉醺醺，笑呵呵，对对游人戏彩。有那跳舞的，屣跷的，装鬼的，骑象的，东一攒，西一簇，看之不尽。却才到金灯桥上，唐僧与和尚们近前看处，原来是三盏金灯。",
        "悟空说：这许多油，三夜何以就点得尽？和尚们说：这缸里每缸有四十九个大灯马，都是灯草札的把，裹了丝绵，有鸡子粗细。八戒在旁边笑说：想是佛爷连油都收去了。那些和尚也立不住脚说：老师父，回去罢。唐僧说：我弟子原是思佛念佛拜佛的人，今逢佳景，果然有诸佛降临，就此拜拜，多少是好。悟空急忙扯起说：师父，不是好人，必定是妖邪也。说不了，见灯光昏暗，呼的一声，把唐僧抱起，驾风而去。不知是那山那洞真妖怪，积年假佛看金灯。吓得那八戒两边寻找，沙僧左右招呼。悟空笑说：原来你这伙凡人累年不识，故被妖邪惑了，只说是真佛降祥，受此灯供。",
        "悟空闪火眼金睛，仔细观看，认得是年、月、日、时四值功曹使者，隐像化形而来。悟空就抽出出铁棒，幌一幌，碗来粗细，有丈二长短。跳下崖来，喝说：你都藏头缩颈的哪里走？四值功曹见他说出风息，慌忙喝散三羊，现了本相，闪下路旁边施礼说：悟空恕罪，恕罪。悟空说：这一向也没有用着你们，你们见我宽慢，都一个个弄懈怠了，见也不来见我一见，是怎么说？功曹说：你师父宽了禅性，在于金平府慈云寺贪欢，所以泰极生否，乐盛成悲，今被妖邪捕获。我们知悟空连夜追寻，恐悟空不识山林，特来传报。悟空说：你既传报，怎么隐姓埋名，赶着三个羊儿，吆吆喝喝作甚？",
        "唐僧说：贫僧俗名陈玄奘，自幼在金山寺为僧。又因魏征丞相梦斩泾河老龙，唐王游地府，回生阳世，开设水陆大会，超度阴魂，蒙唐王又选赐贫僧为坛主，大阐都纲。幸观世音菩萨出现，指化贫僧，说西天大雷音寺有唐僧真经，可以超度亡者升天，差贫僧来取，因赐号唐僧，就倚唐为姓，所以人都呼我为唐僧。第一个姓孙，名悟空悟空，原来齐天悟空归正。群妖听见此名，着了一惊说：这个齐天悟空，可是五百年前大闹天宫的？第二个姓猪，名悟能八戒，原来天蓬大元帅转世。第三个姓沙，名沙僧和尚，原来卷帘大将临凡。三个妖王听说，个个心惊说：早是没有吃他。",
        "悟空闪在石崖上，仔细观看，那妖精生得：彩面环睛，二角峥嵘。第二个，身挂轻纱飞烈焰，四蹄花莹玉玲玲；悟空看了一会，忍耐不得，上前高叫说：泼贼怪！那妖喝说：你是那闹天宫的孙悟空？悟空大怒，骂说：我把你这个偷灯油的贼，油嘴妖怪，不要胡谈，快还我师父来。这一场在山凹中好杀：钺斧钢刀扢挞藤，猴王一棒敢来迎。辟寒辟暑辟尘怪，认得齐天悟空名。棒起致令神鬼怕，斧来刀砍乱飞腾。乒乓只听刀斧响，劈朴只听见棒有声。悟空一条棒与那三个妖魔斗经百五十合，天色将晚，胜负未分。只见那辟尘大王把扢挞藤闪一闪，跳过阵前，将旗摇了一摇。",
        "也叫小妖送一碗与唐僧，只待抓住悟空等才要整治。再说悟空驾云回至慈云寺内，叫声：师弟。那八戒、沙僧正自盼望商量，听得叫时，一齐出接说：哥哥，怎么去这一日方回？悟空笑说：昨夜闻风而赶，至天晓，到一山，不见。幸四值功曹传信说：那山叫做青龙山，山中有一玄英洞。原来积年在此偷油，假变佛像，哄了金平府官员人等。八戒说：哪里想是酆都城鬼王弄喧？沙僧说：你怎么就猜道是酆都城鬼王弄喧？八戒笑说：哥哥说是牛头鬼怪，故知之耳。若论我看那妖怪，是三只犀牛成的精。正说处，和尚们说：孙老爷可吃晚斋？和尚们说：老爷征战这一日，岂不饥了？"
      ],
      "92": [
        "再说孙悟空挟同二弟滚着风，驾着云，向东北艮地上，转眼间至青龙山玄英洞口，按落云头，八戒就欲筑门。悟空说：且消停，待我进去看看师父生死怎么，再好与他争持。好悟空，收了棒，捻着诀，念声咒语，叫：变！贤徒追袭施威武，但愿英雄展大权。悟空听完，心里高兴极了，展开翅，飞近师前。悟空忍不住，叫声：师父，我来了。唐僧喜说：悟空，我说正月间怎得萤火？悟空就现了本相说：师父呵，为你不识真假，误了多少路程，费了多少心力。我当吩咐八戒、沙僧回寺看守，我就闻风追至这里，不识地名。我恐夜深不就交战，又不知师父下落，所以变化进来，打听打听。",
        "八戒、沙僧正举着钯、杖等待，说：哥哥，怎么了？悟空将变化入里解放师父，正走，被妖惊觉，顾不得师父，打出来的事，讲说一遍暂且不说。那妖王把唐僧捉住，依然使铁索锁了。执着刀，抡着斧，灯火齐明，问：你这个家伙怎样开锁？慌忙那唐僧战战兢兢的跪说：大王爷爷，我徒弟孙悟空，他会七十二般变化。三个妖王呵呵大笑说：早是惊觉，未曾走了。沙僧说：闭门不諠哗，想是暗弄我师父。那八戒卖弄神通，举钯尽力筑去，把那石门筑得粉碎，却又厉声喊骂说：偷油的贼怪！吓得那门内小妖滚将进去，报说：大王，不好了，不好了，前门被和尚打破了。",
        "众精各执兵刃齐来，早把个八戒绊倒在地，被几个水牛精揪揪扯扯，拖入洞里捆了。沙僧见没了八戒，只见那群牛发喊声。又被群精一拥而来，拉一个躘踵，急挣不起，也被捉去捆了。唐僧见了，满眼垂泪说：可怜你二人也遭了毒手。沙僧说：师兄见捉住我们，他就走了。唐僧说：他既走了，必然哪里去求救。再说悟空驾筋斗云复至慈云寺，寺僧接着，来问：唐老爷救得否？那妖精神通广大，我弟兄三个与他三人斗了多时，被他呼小妖先捉了八戒，后捉了沙僧，我幸走脱了。和尚们害怕说：爷爷这般会腾云驾雾，还捉获不得，想老师父被倾害也。只是那妖精有本事，你们可好看马匹、行李，等我上天去求救兵来。",
        "后又同八戒、沙僧苦战，复被他将二人也捉去捆了。金星呵呵冷笑说：悟空既与妖怪相持，岂看不出他的出处？悟空说：认得，认得，是一伙牛精。他因有天文之象，累年修悟成真，亦能飞云步雾。若要拿他，只是四木禽星见面就伏。金星笑说：此星在斗牛宫外，罗布乾坤。悟空拱拱手称谢，直接走进天门里去。悟空说：近行至金平府地方，因我师宽放禅性，元夜观灯，遇妖魔摄去。悟空奏说：我才到西天门，遇长庚星说：那妖怪是犀牛成精，惟四木禽星可以降伏。玉帝就差许天师同悟空去斗牛宫点四木禽星下界收降。天师说：我奉圣旨，教点四木禽星与孙悟空下界降妖。",
        "倘一时一位拿他不住，却不又费事了？四木说：悟空不必迟疑，你先去索战，引他出来，我们随后动手。原来那门被八戒筑破，几个小妖弄了几块板儿搪住。在里边听得骂詈，急跑进报说：大王，孙和尚在外面骂哩。辟尘儿说：他败阵去了，这一日怎么又来？那伙精不知死活，一个个各执枪刀，摇旗擂鼓，走出洞来，对悟空喝说：你个不怕打的猢狲儿，你又来了。悟空最恼得是这猢狲二字，咬牙发狠，举铁棒就打。三个妖王调小妖，跑个圈子阵，把悟空圈在垓心。那那边四木禽星一个个各抡兵刃说：孽畜！那三个妖王看他四星，自然害怕，一起说：不好了，不好了，他寻将降手儿来了。",
        "直到西洋大海，远望见孙悟空在海上吆喝。他两个按落云头说：悟空，妖怪哪里去了？斗木獬说：我见悟空与井、角二星战败妖魔追赶，料必擒拿。我二人却就扫荡群精，入玄英洞救出你师父、师弟。多时不见车驾回转，故又追寻到此也。悟空听完，才喜谢说：如此，却是有功，多累，多累。当有井、角二星紧紧追拿，让我在岸边抵挡。好悟空，抡着棒，捻着诀，辟开水迳，直入波涛深处，只见那三个妖魔在水底下与井木犴、角木蛟舍死忘生苦斗哩。那妖精抵住二星官，措手不及，正在危难之处，忽听得悟空叫喊，顾残生，拨转头往海心里飞跑。原来这怪头上角极能分水，只听见花花花，冲开明路。",
        "井木犴走近前，一把揪住耳朵，夺了他的刀，叫说：不杀你，不杀你，拿与孙悟空发落去来。当就倒干戈，复至水晶宫外，报说：都捉来也。一个被井木犴揪着耳朵，推跪在地。近前仔细看了说：这头不是兵刀伤的呵。摩昂笑说：不是我喊得紧，连身子都着井星官吃了。悟空说：既是如此，也罢，取锯子来，锯下他的这两只角，剥了皮带去。辟暑儿也穿了鼻，教井木犴牵着：带他上金平府见那刺史官，明究其由，问他个积年假佛害民，然后的决。大家遵言，辞龙王父子，都出西海。悟空足踏祥光，半空中叫说：金平府刺史、各佐贰郎官并府城内外军民人等听着：我原来东土大唐差往西天取经的圣僧。",
        "唐僧吩咐：悟空，将余剩的宝物尽送慈云寺僧，以为酬礼。那八戒吃了自在酒饭，睡得梦梦乍说：这早备马怎么？八戒抹抹脸说：又是这唐僧没正经。二百四十家大户都请，才吃了有三十几顿饱斋，怎么又弄八戒忍饿？唐僧听言骂说：糟的夯货，不要胡说，快早起来；那八戒听见说打，慌了手脚说：师父今番变了：常时疼我爱我，念我蠢夯护我，哥要打时，他又劝解；悟空说：师父怪你为嘴，误了路程。那八戒真个怕打，跳起来穿了衣服，吆喝沙僧：快起来，打将来了。唐僧摇手说：寂寂悄悄的，不要惊动寺僧。这一去，正所谓：暗放玉笼飞彩凤，私开金锁走蛟龙。"
      ],
      "93": [
        "悟空笑说：这边路上将近佛地，断乎无甚妖邪，师父放怀勿虑。唐僧说：徒弟，虽然佛地不远，但前日那寺僧说，到天竺国都下有二千里，还不知是有多少路哩。悟空说：师父，你好是又把乌巢禅师《心经》忘记了也。唐僧说：《般若心经》是我随身衣钵，自那乌巢禅师教后，那一日不念？悟空说：师父只是念得，没有求那师父解得。唐僧说：猴头，怎又说我没有解得？旁边笑倒一个八戒，喜坏一个沙僧，说说：嘴巴，替我一般的做妖精出身，又不是哪里禅和子听过讲经，哪里应佛僧也曾见过说法。悟空解得是无言语文字，原来是真解。悟空看得是布金禅寺，八戒也道是布金禅寺。",
        "唐僧在马上沉思说：布金……布金……这不要不是舍卫国界了么？这园说是给孤独长者问太子买了，请佛讲经。太子说：我这园不卖，他若要买我的时，除非黄金满布园地。八戒笑说：好运气，若是就是这个故事，我们也去摸他块把砖儿送人。大家又笑了一会，唐僧才下得马来。进得山门，只见山门下挑担的，背包的，推车的，整车坐下：也有睡的去睡，讲的去讲。唐僧生怕惹事，口中不住只叫：斯文，斯文。唐僧说：弟子陈玄奘，奉东土大唐皇帝之旨，差往西天拜佛求经。那僧说：荒山十方常住，都可随喜；况唐僧东土神僧，但得供养，幸甚。话说这时寺中听说到了东土大唐取经僧人，寺中若大若小，不问长住、挂榻、唐僧、行童，一一都来参见。",
        "寺僧问起东土来因，唐僧说到古迹，才问布金寺名之由。那僧答说：这寺原是舍卫国给孤独园寺，又名祇园。又问：才进宝山，见门下两廊有许多骡马车担的行商，为什么在此歇宿？师徒们正说处，又见拿上斋来，却与唐僧等吃毕。唐僧与悟空步月闲行，又见个道人来报说：我们老师爷要见见中华人物。唐僧急转身，见一个老和尚，手持竹杖，向前作礼说：此位就是中华来的师父？老僧说：师家貌古神清，况月夜眼花，急看不出来。唐僧说：才说给孤园基址，果在哪里？唐僧合掌叹说：忆昔檀那须达多，曾将金宝济贫疴。行近后门外，至台上，又坐了一坐，忽听见有啼哭之声。",
        "老僧说：旧年今日，弟子正明性月之时，忽闻一阵风响，就有悲怨之声。那女子说：我是天竺国国王的公主，因为月下观花，被风刮来的。当日与和尚们传说：是个妖邪，被我捆了。我几番家进城来去打探公主之事，全然无损。今幸老师来国，还请到了国中，广施法力，辨明辨明：一则救拔良善，二则昭显神通也。八戒与沙僧在方丈中，突突哝哝的说：明日要鸡鸣走路，此时还不来睡。八戒说：睡了罢，这等夜深，还看什么景致？这唐僧也唤醒八戒、沙僧，扣马收拾，悟空叫点灯来。八戒欢喜，吃了一盘，把行李、马匹牵出。老僧又向悟空说：悲切之事，在心，在心。",
        "国王有道衣冠胜，五谷丰登显俊豪。他师徒们进城，正走处，有一个会同馆驿，唐僧等直接走进驿内。那驿内管事的就报驿丞说：外面有四个异样的和尚，牵一匹白马进来了。唐僧施礼说：贫僧是东土唐朝钦差灵山大雷音见佛求经的，随身有关文，入朝照验。驿丞答礼说：此衙门原设待使客之处，理当款迓。那驿丞看见嘴脸丑陋，暗自心惊，不知是人是鬼，战兢兢的，只得看茶摆斋。唐僧见他惊怕，说：大人勿惊，我们三个徒弟，相貌虽丑，心地具良。驿丞听完，才定了心性，问：国师，唐朝在于何方？唐僧说：贞观十三年，今已历过十四载，苦经了些万水千山，方到这里。",
        "那楼八窗玲珑，公主转睛观看，见唐僧来得至近，将绣球取过来，亲手抛在唐僧头上。唐僧着了一惊，把个毘卢帽子打歪，双手忙扶着那球。那楼上齐声发喊说：打着个和尚了，打着个和尚了。被悟空喝一声，把牙傞一傞，把腰躬一躬，长了有三丈高的个神威，弄出丑脸。那楼上绣女宫娥并大小太监，都来对唐僧下拜说：贵人，贵人，请入朝堂贺喜。唐僧急还礼，扶起众人，回头埋怨悟空说：你这猴头，又是撮弄我也。悟空笑说：绣球儿打在你头上，滚在你袖里，干我何事？悟空说：师父，你且放心，就入朝见驾，我回驿报与八戒、沙僧等候。如必欲招你，你对国王说：召我徒弟来，我要吩咐他一声。",
        "早有黄门官先奏说：万岁，公主娘娘搀着一个和尚，想是绣球打着，现在午门外候旨。礼毕，又宣至殿上，开言问：僧人何来，遇朕女抛球得中？唐僧俯伏奏说：贫僧原来南赡部洲大唐皇帝差往西天大雷音寺拜佛求经的。路过十字街彩楼之下，不期公主娘娘抛绣球，打在贫僧头上。还请赦贫僧死罪，倒换关文，打发早赴灵山，见佛求经，回我国土，永注陛下之天恩也。那公主磕头说：父王，常言嫁鸡逐鸡，嫁犬逐犬。女有誓愿在先，结了这球，告奏天地神明，撞天婚抛打。今日打着圣僧，就是前世之缘，于是得今生之遇，岂敢更移？国王方喜，就宣钦天监正台官选择日期。",
        "再说悟空自彩楼下别了唐僧，走两步，笑两声，喜喜欢欢的回驿。八戒、沙僧迎着说：哥哥，你怎么那般喜笑？八戒说：还未到地头，又没有见佛取得经回，是何来之喜？悟空笑说：我与师父只走至十字街彩楼之下，可可的被当朝公主抛绣球打中了师父，师父被些宫娥、彩女、太监推拥至楼前，同公主坐辇入朝，招为驸马，此非喜而何？八戒听说，跌脚捶胸说：早知我去好来，都是那沙僧惫懒。你不阻我呵，我径奔彩楼之下，一绣球打着我八戒，那公主招了我，却不美哉妙哉？沙僧上前，把他脸上一抹说：不羞，不羞，好个嘴巴骨子。要是一绣球打着你，就连夜烧退送纸也还道迟了，敢惹你这晦气进门？"
      ],
      "94": [
        "国王问：那三位是圣僧驸马之高徒？旁边有护驾的喝说：不要走，有甚话，立下奏来。悟空笑说：我们出家人，得一步就进一步。唐僧恐他村鲁惊驾，就起身叫说：徒弟呵，陛下问你来因，你就奏上。悟空见他那师父在旁边侍立，忍不住大叫一声说：陛下轻人轻己。国王听说，大惊失色，欲退殿，恐失了观瞻。只得硬着胆，教近侍的取绣墩来，请唐僧坐了。悟空才奏说：我祖居东胜神洲傲来国花果山水帘洞。国王听见这般名重，慌忙下了龙床，走将来，以御手挽定唐僧说：驸马，也是朕之天缘，得遇你这仙姻仙眷。八戒掬嘴扬威说：八戒先世为人，贪欢爱懒。",
        "这八戒越弄精神，摇着头，掬着嘴，撑起耳朵，呵呵大笑。唐僧又怕惊驾，就叱说：八戒收敛！沙僧合掌说：老沙原系凡夫，因怕轮回访道。也为蟠桃会上，失手打破玻璃盏，贬在流沙河，改头换面，造孽伤生。幸喜菩萨远游东土，劝我皈依，等候唐朝佛子，往西天求经果正。国王见说，多惊多喜：喜的是女儿招了活佛，惊的是三个实原来妖神。正在惊喜之间，忽有正台阴阳官奏说：婚期已定本年本月十二日壬子辰良，周堂通利，宜配婚姻。国王大喜，就着当驾官打扫御花园馆阁楼亭，且请驸马同三位高徒安歇，待后安排合巹佳筵，着公主匹配。大家钦遵，国王退朝，多官皆散暂且不说。",
        "悟空陪笑说：师父说：先母也是抛打绣球，遇旧缘，成其夫妇。又想着那个给孤布金寺唐僧之言，就此检视真假。沙僧与八戒笑说：哥哥近日又学得会相面了。悟空说：相面之士，当我孙子罢了。悟空说：且到十二日会喜之时，必定那公主出来参拜父母，等我在旁边观看。唐僧听完，越生嗔怒，骂说：好猢狲！悟空听说念咒，慌忙跪在面前说：不要念，不要念。",
        "八戒说：师父，夜深了，有事明早再议，且睡，且睡。八戒听见，应声说：陛下，我师徒自相会，更无一刻相离。那国王见他丑陋，说话粗俗，又见他扭头捏颈，掬嘴巴，摇耳朵，就像有些风气，犹恐搅破亲事，只得依从。那八戒才朝上唱个喏，叫声：多谢。将有巳时前后，那国王排驾，请唐僧都到御花园内观看。",
        "含笑花、凤仙花、玉簪花，战战巍巍。那国王见唐僧恣意看诗，就说：驸马喜玩诗中之味，必定善于吟哦。唐僧是个对景忘情，明心见性之意。和前韵，他不觉忽咏一句说：日暖冰消大地钧。国王见和大喜，称唱说：好个袖手高歌倚翠栏！悟空三人在留春亭亦尽受用，各饮了几杯，也都有些酣意。正欲去寻唐僧，只见唐僧已同国王在一阁。八戒呆性发作，应声叫说：好快活，好自在，今日也受用这一下了。",
        "八戒说：你哪里知道，俗语云：吃了饭儿不挺尸，肚里没板脂哩。唐僧与国王相别，至亭内，嗔责八戒说：这夯货，越发村了。倘或恼着国王，却不被他伤害性命？常言说：打不断的亲，骂不断的邻。唐僧叱道，教拿过八戒来，打他二十禅杖。八戒喊叫说：驸马爷爷，饶罪，饶罪。八戒爬将起来，突突囔囔的说：好贵人，好驸马，亲还未成，就行起王法来了。有光禄寺三部各官回奏说：臣等自八日奉喜，欲请驸马赴席，忽有内宫官对御前启奏说：万岁，正宫娘娘有请。再说国王驾到，那后妃引着公主，并彩女、宫娥，都来迎接。后妃等朝拜毕，国王说：公主贤女，自初八日结彩抛球，幸遇圣僧，想是心愿已足。",
        "那公主走近前，倒身下拜，奏说：父王，乞赦小女万千之罪，有一言启奏：这几日听见宫官传说，唐圣僧有三个徒弟，他生得十分丑恶。国王就出驾上殿，传旨请驸马共他三位。原来那唐僧捏指头儿算日子，熬至十二日，天未明，就与他三人计较说：今日却是十二了，这事怎么区处？悟空说：那国王我已识得他有些晦气，还未沾身，不为大害。八戒说：送行必定有千百两黄金白银，我们也好买些人事回去。沙僧说：二哥钳着口，休乱说，只凭大哥主张。国王见了，教请悟空三位近前说：你们将关文拿上来，朕当用宝、花押，交付你们，外多备盘缠，送你三位早去灵山见佛。",
        "慌忙个唐僧一毂辘爬起，扯住悟空，咬响牙根说：你们都不顾我就去了？悟空把手捏着唐僧手掌，丢个眼色说：你在这里宽怀欢会，我们取了经，回来看你。早见国王又请驸马上殿，着多官送三位出城。悟空三人同众出了朝门，各自相别。悟空对八戒、沙僧说：你两个只在此，切不要出头。但驿丞问什么事情，且含糊答应，不要与我说话。好悟空，拔一根毫毛，吹口仙气，叫：变！就变作本身模样，与八戒、沙僧同在驿内。真身却幌的跳在半空，变作一个蜜蜂儿。你看他轻轻的飞入朝中，远见那唐僧在国王左边绣墩上坐着，愁眉不展，心存焦燥。径飞至他毘卢帽上，悄悄的爬及耳边，叫说：师父，我来了，切不要忧虑。"
      ],
      "95": [
        "再说那唐僧忧忧愁愁，随着国王至后宫。只听得鼓乐喧天，随听见异香扑鼻。悟空暗里欣然，丁在那毘卢帽顶上，运神光，睁火眼金睛观看。云髻高盘飞彩凤，蛾眉微显远山低。悟空见师父全不动念，暗自里咂嘴夸称说：好和尚，好和尚。慌的个唐僧战战兢兢，不要知所措。悟空早已知识，见那公主头顶上微露出一点妖氛，却也不十分凶恶。就忙爬近耳朵叫说：师父，公主是个假的。唐僧说：是假的，却怎么放他现相？唐僧说：不可，不可，恐惊了主驾。唐僧一发慌了手脚，战兢兢抱住国王，只叫：陛下，不要怕，不要怕，此是我顽徒使法力，辨真假也。",
        "那些妃子有胆大的，把那衣服、钗环拿与皇后看了，说：这是公主穿的戴的，今都丢下，精着身子，与那和尚在天上争打，必定是个妖邪。此时国王、后妃人等才正了性，望空仰视暂且不说。再说那妖精与悟空斗经半日，不分胜败。悟空念声咒语，将铁棒收做一根，纵祥光一直赶来。将近西天门，望见那旌旗闪灼，悟空大声说：把天门的，挡住妖精，不要放他走了。妖邪不能前进，急回头，使短棍，又与悟空相持。那妖邪咬着牙说：你也不知我这兵器，听我说：广寒宫里捣药杵，打人一下命归泉。悟空闻说，呵呵冷笑说：好孽畜呵！那妖怪说：我认得你是五百年前大闹天宫的弼马温，理当让你。",
        "那国王正扯着唐僧，战战兢兢，只叫：圣僧救我。那些嫔妃、皇后也正怆惶，只见悟空自云端里落将下来，叫说：师父，我来也。唐僧说：悟空立住，不可惊了圣躬。悟空立于鳷鹊宫外，叉手当胸说：假公主是个妖邪。初时与他打了半日，他战不过我，化道清风，径往天门上跑，是我吆喝天神挡住。我急追至山，无处寻觅，恐怕他来此害你，特地回顾也。国王听说，扯着唐僧问：既然假公主是个妖邪，我真公主在于哪里？悟空应声说：待我抓住假公主，你那真公主自然来也。那后妃等听见此言，都解了恐惧，一个个上前拜告说：望圣僧救得我真公主来，分了明暗，必当重谢。",
        "悟空说：这里不是我们说话处，请陛下与我师出宫上殿，娘娘等各转回宫，召我师弟八戒、沙僧来保护师父，我却好去降妖。一那边教备素膳，一那边召八戒、沙僧。悟空备言前事，让他两个用心护持。少时，二神至了，磕头说：不知，不知，知当远接，还请恕罪。二神告说：悟空，此山唤做毛颖山。悟空要寻妖精，还是西天路上去有。悟空说：我到了西天天竺国，那国王有个公主被个妖精摄去，抛在荒野。他就变做公主模样，戏哄国王，结彩楼，抛绣球，欲招驸马。我保唐僧至其楼下，被他有心打着唐僧，欲为配偶，诱取元阳。二神听说，就引悟空去那三窟中寻找。",
        "但只是你收了玉兔儿，恐那国王不信，敢烦太阴君同众仙妹将玉兔儿拿到那厢，对国王明证明证：一则显我之手段，二来说那素娥下降之因由，然后着那国王取素娥公主之身，以见显报之意也。太阴君信其言，用手指定妖邪，喝说：那孽畜还不归正同来。团身一块毛如玉，展足千山蹄若飞。那悟空见了，非常欣喜，踏云光，向前引导。那国王与唐僧尚在殿内，八戒、沙僧与多官都在阶前，方议退朝，只见正南上一片彩霞，光明如昼。众抬头看处，又听见孙悟空大声说：天竺陛下，请出你那皇后、嫔妃看者：这宝幢下原来月宫太阴星君，两边的仙妹是月里嫦娥。",
        "那国王急召皇后、嫔妃与宫娥、彩女等众朝天礼拜，他和唐僧及多官亦具望空拜谢。正此观看处，猪八戒动了欲心，忍不住，跳在空中，把霓裳仙子抱住说：姐姐，我与你是旧相识，我和你耍子儿去也。这国王在殿上谢了悟空，又问前因说：多感神僧大法力捉了假公主。悟空说：你那真公主也不是凡胎，就是月宫里素娥仙子。因十八年前，他将玉兔儿打了一掌，就思凡下界，投胎在你正宫腹内，生下身来。那玉兔儿怀恨前仇，所以于旧年间偷开玉关金锁走下来，把素娥摄抛荒野，他却变形哄你。国王闻说，又心意惭惶，止不住腮边流泪说：孩儿，我自幼登基，虽城门也没有出去，却让我哪里去寻你也？",
        "当晚斋罢，步月闲行，行至布金旧园，观看基址，忽闻悲声入耳，询问其由。本寺一老僧，年已百岁之外，他屏退左右，细细的对我说了一遍说：悲声者，原来旧年春深时，那老僧正明性月，忽然一阵风生，见一女子掷之于地，那僧问之，那女子说：我是天竺国国王公主，因为夜间玩月观花，被风刮至于此。那老僧也曾来国打听几番，见公主在宫无恙，所以不敢声言举奏。不期他原是蟾宫玉兔为妖，假合真形，变作公主模样，他却又有心要破我元阳。早惊动三宫六院，都来问及前因，无一人不痛哭者。良久，国王又问：布金寺离城多远？国王于是传旨：着东西二宫守殿，掌朝太师卫国。",
        "国王到于山门之外，只见那和尚们齐齐整整，俯伏接拜；悟空笑说：我把腰略扭一扭儿，就到了。唐僧引驾，到于后面房边，那公主还装风胡说。老僧跪指说：此房内就是旧年风吹来的公主娘娘。悟空又对国王拱手说：我还有一事奉上。国王答礼说：神僧有事吩咐，朕就从之。国王君臣亦共喜，饮宴一宵暂且不说。次早，国王传旨，召丹青图下圣僧师徒四人喜容，供养在华夷楼上。又请公主新妆重整，出殿谢唐僧师徒四人救苦之恩。那国王哪里肯放，大设佳宴，一连吃了五六日，着实好了八戒，尽力放开肚量受用。国王见他们拜佛心重，苦留不住，于是取金银二百锭、宝贝各一盘奉谢。"
      ],
      "96": [
        "还如果熟自然红，不要问怎么修种。话表唐僧师众，使法力阻住那布金寺僧。八戒笑说：这路是你行过的，怎说不知？却是又有一些跷蹊，故意推不认得，捉弄我们哩。唐僧下马，过吊桥，直接走进门里长街上，只见廊下坐着两个老人家叙话。唐僧叫：徒弟，你们在那街心里站住，低着头，不要放肆。唐僧近前合掌，叫声：老施主，贫僧行礼问候了。那二老正在哪里闲讲闲论，说什么兴衰得失，谁圣谁贤，当时的英雄事业，而今安在，诚可谓大叹息。忽听得道声行礼问候，随答礼说：唐僧有何话说？唐僧说：贫僧原来远方来拜佛祖的，适到宝方，不知是甚地名。",
        "沙僧说：大哥说得有理，恐一时不分内外，惹施主烦恼。过了一会儿，有个苍头出来，提着一把秤、一只篮儿，猛然看见，慌的丢了，倒跑进去报说：陛下，外面有四个异样僧家来也！转过一条巷子，员外引路，至一座房里，说说：此上手房宇，原来管待老爷们的佛堂、经堂、斋堂。唐僧净了手，拈了香，磕头拜毕，却转回与员外行礼。唐僧到此，正欲行礼，那员外又搀住说：请宽佛衣。又叫把马喂了，行李安在廊下，方问起居。唐僧说：贫僧是东土大唐钦差诣宝方谒灵山见佛祖求真经者。",
        "员外面生喜色，笑吟吟的说：弟子贱名寇洪，字大宽，虚度六十四岁。唐僧听完，十分欢喜，都就权且应承暂且不说。他那几个大小家僮，往宅里搬柴打水，取米面蔬菜，整治斋供，忽惊动员外妈妈，问：是哪里来的僧，这等上紧？僮仆说：才有四位高僧，爹爹问他起居，他说是东土大唐皇帝差来的，往灵山拜佛爷爷。僮仆说：奶奶，只一位看得，那三位看不得，形容丑得很哩。老妪说：你们不知，但形容丑陋，古怪清奇，必是天人下界。那僮仆跑至经堂，对员外说：奶奶来了，要拜见东土老爷哩。转面见悟空三人模样非凡，虽知他是天人下界，却也有几分悚惧，朝上跪拜。",
        "员外上前扯住说：这是我两个小儿，唤名寇梁、寇栋，在书房里读书方回，来吃午饭，知老师下降，故来拜也。二秀才启上父亲说：这老爷是哪里来的？员外笑说：来路远哩，南赡部洲东土大唐皇帝钦差到灵山拜佛祖爷爷取经的。秀才说：我看《事林广记》上，盖天下只有四大部洲。唐僧笑说：贫僧在路，耽阁的日子多，行的日子少。秀才听完，称奖不尽说：真是神僧！说未毕，又有个小的来请说：斋筵已摆，请老爷进斋。这猪八戒一口一碗，就是风卷残云。唐僧起身，对员外谢了斋，就欲走路。那员外拦住说：老师，放心住几日儿。",
        "员外说：老师辞别甚急，想是连日佛事冗忙，多致简慢，有见怪之意？唐僧说：深扰尊府，不知何以为报，怎敢言怪？但只当时圣君送我出关，问几时可回，我就误答三年可回。八戒忍不住，高叫说：师父忒也不从人愿，不近人情。老员外大家巨富，许下这等给和尚饭吃之愿，今已圆满，又况留得至诚，须住年把，也不妨事，只管要去怎么？悟空见师父变了脸，就揪住八戒，着头打一顿拳，骂说：八戒不知好歹，惹得师父连我们都怪了。那八戒气呼呼的站在旁边，再不敢言。员外见他师徒们生恼，只得满面陪笑说：老师不要焦燥，今日且少宽容。正讲处，那老妪又出来说：老师父，既蒙到舍，不必苦辞。",
        "说不了，寇栋兄弟又出来说：四位老爷，家父给和尚饭吃二十余年，更没有遇着好人。学生年幼，不知因果，常听见有云：公修公得，婆修婆得，不修不得。唐僧说：令堂老菩萨盛情，已不敢领，怎么又承贤昆玉厚爱？那老妪与二子见他执一不住，就生起恼来说：好意留他，他这等固执要去。八戒忍不住口，又对唐僧说：师父，不要拿过了班儿。唐僧又咄了一声，那八戒就自家把嘴打了两下说：啐啐啐！慌忙个悟空跪下说：师父，我没有笑，我没有笑。一那边又叫管办的做二十对彩旗，觅一班吹鼓手乐人，南来寺里请一班和尚，东岳观里请一班道士，限明日巳时具要整齐。",
        "悟空将九环杖递在师父手里，他将通关文牒的引袋儿挂在胸前，只是一齐要走。唐僧正与员外作礼，只见家僮来报：客具到了。却是那请来的左邻右舍、妻弟姨兄、姐夫妹丈，又有那些同道的斋公，念佛的善友，一齐都向唐僧礼拜。这一席盛宴，八戒留心，对沙僧说：兄弟，放怀放量吃一些，离了寇家，再没这好丰盛的东西了。沙僧笑说：二哥说哪里话，常言说：珍馐百味，一饱就休。悟空听见说：八戒，不要胀破了肚子，如今要走路哩。八戒慌了，拿过添饭来，一口一碗，又丢勾有五六碗，把那馒头、儿、饼子、烧果，没好没歹的满满笼了两袖，才跟师父起身。唐僧谢了员外，又谢了众人，一同出门。",
        "大家让出道路，抬轿的抬轿，骑马的骑马，步行的步行，都让唐僧师徒四人前行。那员外犹不忍舍，含着眼泪说：老师取经回来，是必到舍再住几日，以了我寇洪之心。唐僧感之不尽，谢之无已说：我若到灵山，得见佛祖，首表员外之大德。说说话儿，不觉的又有二三里路，唐僧恳切拜辞。八戒挑着担，努着嘴说：放了现成茶饭不吃，清凉瓦屋不住，却要走什么路，像抢丧撞魂的。常言说：长安虽好，不是久恋之家。待我们有缘拜了佛祖，取得真经，那时回转大唐，奏过陛下，将那御厨里饭，凭你吃上几年，胀死你这孽畜，让你做个饱鬼。悟空举目遥观，只见大路旁边有几间房宇，急请师父说：哪里安歇，哪里安歇。"
      ],
      "97": [
        "他四人在我家住了半月，将我家门户墙垣、窗棂巷道，具看熟了，财动人心，所以乘此夜雨，复到我家，既劫去财物，又害了父亲，此情何毒！沙僧劫出金银去，悟空打死我父亲。这寇梁兄弟抱牌而入，跪倒高叫说：爷爷，小妖们是告强盗得财，杀伤人命重情事。刺史接上状去，看了这般这的，如此如彼，就问：昨日有人传说，你家给和尚饭吃圆满，斋得师徒四人高僧，原来东土唐朝的罗汉，花扑扑的满街鼓乐送行，怎么却有这般事情？寇梁等磕头说：爷爷，小的父亲寇洪，给和尚饭吃二十四年。当日送出，当晚复回，乘黑夜风雨，于是明火执杖，杀进房来，劫去金银财宝、衣服首饰，又将父打死在地。",
        "可可的那些强盗当夜打劫了寇家，系出城外，也向西方大路上，行经天晓，走过华光院西去，有二十里远近，藏于山凹中，分拨金银等物。分还未了，忽见唐僧师徒四人顺路而来，众贼心犹不歇，指定唐僧说：那不是昨日送行的和尚来了？我们也是干这般没天理的买卖，这些和尚缘路来，又在寇家许久，不知身边有多少东西，我们索性去截住他，夺了盘缠，抢了白马凑分，却不是于是心满意之事？吓得唐僧在马上乱战，沙僧与八戒心慌，对悟空说：怎么了？悟空笑说：师父不要怕，兄弟勿忧，等我去问他一问。好悟空，束一束虎皮裙，抖一抖锦布直裰，走近前，叉手当胸说：大家是做甚么的？贼徒喝说：这个家伙不知死活，敢来问我。悟空听完，满面陪笑说：你原来是剪径的强盗。",
        "访知铜台府城中寇员外家赀财豪富，昨日合伙，当晚乘夜雨昏黑，就去打劫。劫的有些金银服饰，在这路北下山凹里正自分赃，忽见老爷们来，内中有认得是寇员外送行的，必定身边有物；又见行李沉重，白马快走；唐僧听说是寇家劫的财物，猛然吃了一惊，慌忙站起说：悟空，寇老员外十分好善，怎么招此灾厄？悟空笑说：只为送我们起身，那等彩帐花幢，盛张鼓乐，惊动了人眼目，所以这伙光棍就去下手他家。就与八戒、沙僧，去山凹里取将那些赃物，收拾了，驮在马上。又教八戒挑了一担金银，沙僧挑着自己行李。悟空欲将这伙强盗一棍尽情打死，又恐唐僧怪他伤人性命，只得将身一抖，收上毫毛。",
        "只见那：唐僧，战战兢兢，滴泪难言；猪八戒，絮絮叨叨，心中报怨。沙僧，囊突突，意下踌躇；悟空，笑嘻嘻，要施手段。众官兵攒拥扛抬，过了一会儿，拿到城里，径自解上黄堂报说：老爷，民快人等，捕获强盗来了。却将唐僧等提近厅前，问：你这起和尚，口称是东土远来，向西天拜佛，却原来是些设法屣看门路，打家劫舍之贼。唐僧说：大人容告：贫僧实不是贼，决不敢假，随身现有通关文牒可照。只因寇员外家给我找饭们半月，情意深重，我们路遇强盗，夺转打劫寇家的财物，因送还寇家报恩，不期民快人等捉获，以为是贼，实不是贼。刺史说：你这个家伙见官兵捕获，却巧言报恩。",
        "禁子们跪说：老爹，才子提审，送下四个和尚，原来是大伙强盗。他见我们打了他几下，把这两个包袱与我。我们打开看时，见有此物，无可处置：若众人扯破分之，其实可惜；若独归一人，众人无利。又打开袋内关文一看，见有各国的宝印花押，说：早是我来看呀，不然，你们都撞出事来了。捱至四更三点，悟空见他们都不呻吟，尽皆睡着，他暗想说：师父该有这一夜牢狱之灾。如今四更将尽，灾将满矣，我须去打点打点，天明好出牢门。摇身一变，变做个蜢虫儿，从房檐瓦缝里飞出。他认了方向，径飞向寇家门首，只见那街西下一家儿灯火明亮。",
        "悟空就钉在他材头上，咳嗽了一声。吓得那两个媳妇查手舞脚的往外跑；寇梁兄弟伏在地下不敢动只叫：爹爹！嚛嚛嚛……那妈妈子胆大，把材头扑了一把说：老员外，你活了？悟空学着那员外的声音说：我没有活。嚛嚛嚛……妈妈子硬着胆，又问：员外，你没有活，怎么说话？悟空说：我是阎王差鬼使押将来家与你们讲话的。那妈妈子听见叫他小名，慌忙跪倒磕头说：好老人家呵！悟空喝说：有个什么‘唐僧点着火，八戒叫杀人。沙僧劫出金银去，悟空打死你父亲’。阎王转差鬼使押解我来家，让你们趁早解放他去；不然，让我在家搅闹一月，将合家老幼并鸡狗之类，一个也不存留。",
        "那刺史、知县并府县大小官员一见，都下来迎接说：圣僧昨日来时，一则接上司忙迫，二则又见了所获之赃，未及细问端的。唐僧合掌躬身，又将前情细陈了一遍。众官满口认称，都说：错了，错了。悟空近前努目睁看，大声说：我的白马是堂上人得了，行李是狱中人得了，快快还我。今日却该我拷较你们了：枉拿平人做贼，你们该个甚罪？唐僧劝解了说：徒弟，是也不得明白。我们且到寇家去，一则吊问，二来与他对证对证，看是谁见我做贼？等我把那死的叫起来，看是哪个打他？悟空叫说：那打诳语栽害平人的妈妈子且不要哭，等我叫你老公来，看他说是哪个打死的，羞他一羞。悟空说：大家大人，略陪我师父坐坐。",
        "悟空说：你被强盗踢死，此原来地府地藏王菩萨之处。既蒙菩萨放回，又延你阳寿一纪，待十二年之后，你再来也。悟空谢辞了菩萨，将他吹化为气，掉于衣袖之间，同去幽府，复返阳间。驾云头，到了寇家，就唤八戒捎开材盖，把他魂灵儿推付本身。那员外爬出材来，对唐僧师徒四人磕头说：师父，师父，寇洪死于非命，蒙师父至地府救活，原来再造之恩。及回头，见各官罗列，就又磕头说：大家老爹都怎么在舍？那刺史说：你儿子始初递失状，坐名告了圣僧，我就差人捕获。那员外跪说：老爹，其实枉了这四位圣僧。至次日，再挂给和尚饭吃牌，又款留唐僧。"
      ],
      "98": [
        "再说唐僧师徒四人上了大路，果然西方佛地，与他处不同：见了些琪花瑶草，古柏苍松；所过地方，家家向善，户户给和尚饭吃；每逢山下人修行，又见林间客诵经。唐僧举鞭遥指说：悟空，好地方耶。悟空说：师父，你在那假境界，假佛像处，倒强要下拜；今日到了这真境界，真佛像处，倒还不下马，是怎么说？唐僧听完，慌忙翻身跳下来，已到了那楼阁门首。只见一个道童斜站在山门之前，应声叫说：那来者不要非东土取经人么？孙悟空认得他，就叫：师父，此原来是灵山脚下玉真观金顶大仙，他来接我们哩。大仙笑说：圣僧今年才到，我被观音菩萨哄了。唐僧合掌说：有劳大仙盛意，感激，感激。",
        "大仙指着灵山说：圣僧，你看那半天中有祥光五色、瑞蔼千重的，就是灵鹫高峰，佛祖之圣境也。大仙说：圣僧，你与悟空、天蓬、卷帘四位已到福地，望见灵山，我回去也。不上五六里，见了一道活水，响潺潺滚浪飞流，约有八九里宽阔，四无人迹。唐僧心惊说：悟空，这路来得差了，敢不要大仙错指了？悟空笑说：不差，你看那那边不是一座大桥？唐僧等又近前看时，桥边有一块匾额，扁上有凌云渡三字，原来是一根独木桥。唐僧心惊胆战说：悟空，这桥不是人走的，我们别寻路径去来。悟空说：你都站下，等我走个儿你看。好悟空，拽开步，跳上独木桥，摇摇摆摆，过了一会儿跑将过去，在那边招呼说：过来，过来。",
        "八戒说：哥呵，佛做不成也罢，实是走不得。他两个在那桥边扯扯拉拉的争论，沙僧走去劝解，才撒脱了手。唐僧回头，忽见那下溜中有一人撑一只船来，叫说：上渡，上渡。他三个跳起来站定，同眼观看，那船儿来得至近，原来是一只无底的船儿。悟空火眼金睛，早已认得是接引佛祖，又称为南无宝幢光王佛。悟空却暂且不说破，只管叫：这里来，划过来。唐僧见了，又心惊说：你这无底的破船儿怎么渡人？佛祖说：我这船：鸿濛初判有声名，幸我撑来不变更。孙悟空合掌称谢说：承盛意，接引我师。唐僧还自惊疑，悟空扠着膊子，往上一推。师父还整理湿衣服和鞋子，抱怨悟空。",
        "唐僧就就施礼，慌忙那优婆塞、优婆夷、比丘僧、比丘尼合掌说：圣僧且休行礼，待见了牟尼，却来相叙。悟空笑说：早哩，早哩，且去拜上位者。那唐僧手舞足蹈，随着悟空，直至雷音寺山门之外。那厢有四大金刚迎住说：圣僧来耶？那金刚着一个转山门报与二门上四大金刚，说唐僧到了；二门上又传入三门上，说唐僧到了。三山门内原是打供的神僧，听见唐僧到时，急至大雄殿下，报与如来至尊释迦牟尼文佛说：唐朝圣僧，到于宝山，取经来了。就召聚八菩萨、四金刚、五百阿罗、三千揭谛、 十一大曜、十八伽蓝，两行排列。这唐僧循规蹈矩，同悟空、悟能、沙僧，牵马挑担，直接走进山门。挑禅远步三千水，飞锡长行万里崖。",

        "那白雄尊者，见悟空赶得将近，恐他棒头上没眼，一时间不分好歹，打伤身体，就将经包捽碎，抛落尘埃。悟空见经包破落，又被香风吹得飘零，却就按下云头顾经，不去追赶。八戒去追赶，见经本落下，于是与悟空收拾，背着来见唐僧。唐僧满眼垂泪说：徒弟呀，这个极乐世界，也还有凶魔欺害。慌忙递与唐僧说：师父，这一卷没字。唐僧短叹长吁的说：我东土人果是没福，似这般无字的空本，取去何用？悟空早已知之，对唐僧说：师父，不消说了，这就是阿傩、伽叶那个家伙问我要人事，没有，故将此白纸本子与我们来了。快回去告在如来之前，问他掯财作弊之罪。",

        subtitle: "无印篇 · 关都篇＋橘子群岛篇 · 第1—116集",
        unit: "集",
        items: episodes,
        searchPlaceholder: "搜索标题、地点、人物或宝可梦",
        storage: {
          episode: "pokemonEpisodeGuide.currentEpisode",
          paragraph: "pokemonEpisodeGuide.currentParagraph",
          completed: "pokemonEpisodeGuide.completed"
        },
        kicker: item => `${item.no <= 80 ? "关都地区" : "橘子群岛篇"} · 第${item.no}集`,
        metaLeft: "地点路线",
        metaRight: "主要人物与宝可梦",
        metaRightValue: item => `${item.people}；${item.pokemon}`,
        source: `剧情按电视动画原始集序整理；技能名称以动画明确表现及常用中文译名为准。参考：<a href="https://www.tv-tokyo.co.jp/anime/pokemon/poke_en/epi_en/enepi/" target="_blank" rel="noopener">东京电视台动画档案</a>。`
      },
      journey: {
        key: "journey",
        title: "西游记亲子故事",
        subtitle: "依照原著一百回 · 每讲约15—20分钟 · 完整100讲",
        unit: "讲",
        items: journeyLectures,
        searchPlaceholder: "搜索标题、地点或人物",
        storage: {
          episode: "journeyStory.currentLecture",
          paragraph: "journeyStory.currentParagraph",
          completed: "journeyStory.completed"
        },
        kicker: item => `《西游记》原著第${item.no}回 · 第${item.no}讲`,
        metaLeft: "故事地点",
        metaRight: "主要人物",
        metaRightValue: item => item.people,
        source: `故事依照吴承恩《西游记》原著一百回的顺序，为低龄亲子共读改写；保留主要人物与事件，并降低部分惊吓和暴力描写。原著参考：<a href="https://zh.wikisource.org/wiki/西游記" target="_blank" rel="noopener">维基文库《西游记》</a>、<a href="https://www.gutenberg.org/ebooks/23962" target="_blank" rel="noopener">Project Gutenberg 公版原文</a>。`
      }
    };

    function loadCompleted(storageKey) {
      try {
        return new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));
      } catch {
        return new Set();
      }
    }

    let activeLibraryKey = localStorage.getItem("storyShelf.activeLibrary") || "pokemon";
    if (!libraries[activeLibraryKey]) activeLibraryKey = "pokemon";

    const states = Object.fromEntries(Object.values(libraries).map(library => [library.key, {
      episode: Math.min(library.items.length, Math.max(1, Number(localStorage.getItem(library.storage.episode) || 1))),
      paragraph: Math.max(0, Number(localStorage.getItem(library.storage.paragraph) || 0)),
      completed: loadCompleted(library.storage.completed),
      query: ""
    }]));

    const episodeList = document.getElementById("episodeList");
    const reader = document.getElementById("reader");
    const search = document.getElementById("search");

    function currentLibrary() {
      return libraries[activeLibraryKey];
    }

    function currentState() {
      return states[activeLibraryKey];
    }

    function save() {
      const library = currentLibrary();
      const state = currentState();
      localStorage.setItem(library.storage.episode, String(state.episode));
      localStorage.setItem(library.storage.paragraph, String(state.paragraph));
      localStorage.setItem(library.storage.completed, JSON.stringify([...state.completed]));
    }

    function currentEpisode() {
      const library = currentLibrary();
      const state = currentState();
      return library.items.find(item => item.no === state.episode) || library.items[0];
    }

    function renderLibraryChrome() {
      const library = currentLibrary();
      const state = currentState();
      document.body.dataset.library = library.key;
      document.title = `${library.title}｜亲子故事书架`;
      document.getElementById("libraryTitle").textContent = library.title;
      document.getElementById("librarySubtitle").textContent = library.subtitle;
      search.placeholder = library.searchPlaceholder;
      search.value = state.query;
      document.getElementById("storyMark").className = `storyMark ${library.key === "pokemon" ? "ball" : "journeyMark"}`;
      document.querySelectorAll("[data-library]").forEach(button => {
        button.classList.toggle("active", button.dataset.library === library.key);
        button.setAttribute("aria-pressed", String(button.dataset.library === library.key));
      });
    }

    function renderProgress() {
      const library = currentLibrary();
      const state = currentState();
      const count = state.completed.size;
      document.getElementById("progressTitle").textContent = count ? `已读完 ${count} ${library.unit}` : "准备出发";
      document.getElementById("progressCount").textContent = `${count}/${library.items.length}`;
      document.getElementById("progressMeter").style.width = `${Math.round(count / library.items.length * 100)}%`;
      document.getElementById("continueBtn").textContent = `继续第${state.episode}${library.unit} · 第${state.paragraph + 1}段`;
    }

    function renderList() {
      const library = currentLibrary();
      const state = currentState();
      const query = state.query.trim().toLowerCase();
      const matches = library.items.filter(item => !query || [item.title, item.original, item.locations, item.people, item.pokemon, item.summary].filter(Boolean).join(" ").toLowerCase().includes(query));
      episodeList.innerHTML = matches.map(item => `
        <button class="episodeCard ${item.no === state.episode ? "active" : ""} ${state.completed.has(item.no) ? "done" : ""}" data-episode="${item.no}">
          <span class="episodeNo">${item.no}</span>
          <span>
            <span class="episodeTitle">第${item.no}${library.unit} ${item.title}</span>
            <span class="episodeSummary">${item.summary}</span>
          </span>
        </button>
      `).join("") || `<div class="empty">没有找到相关内容</div>`;

      episodeList.querySelectorAll("[data-episode]").forEach(button => {
        button.addEventListener("click", () => openEpisode(Number(button.dataset.episode), true));
      });
    }

    function renderReader() {
      const library = currentLibrary();
      const state = currentState();
      const item = currentEpisode();
      state.paragraph = Math.min(state.paragraph, item.paragraphs.length - 1);
      reader.innerHTML = `
        <button class="mobileBack" id="mobileBack" aria-label="返回目录">←</button>
        <p class="kicker">${library.kicker(item)}</p>
        <h2 class="readerTitle">${item.title}</h2>
        ${item.original ? `<p class="originalTitle">原著回目：${item.original}</p>` : ""}
        <p class="readerSummary">${item.summary}${library.key === "journey" ? ` · 全文约${item.paragraphs.join("").length}字，预计讲述15—20分钟` : ""}</p>
        <div class="metaRow">
          <div class="meta"><strong>${library.metaLeft}</strong><span>${item.locations}</span></div>
          <div class="meta"><strong>${library.metaRight}</strong><span>${library.metaRightValue(item)}</span></div>
        </div>
        <div class="story">
          ${item.paragraphs.map((paragraph, index) => `
            <article class="paragraph ${index === state.paragraph ? "current" : ""}" id="p${index}" data-paragraph="${index}">
              <span class="paraNo">${index + 1}</span>
              <p>${paragraph}</p>
              <button class="markBtn" data-mark="${index}">记住这里</button>
            </article>
          `).join("")}
        </div>
        <div class="navRow">
          <button class="navBtn" id="prevEpisode">上一${library.unit}</button>
          <button class="navBtn primary" id="finishEpisode">读完本${library.unit}</button>
          <button class="navBtn" id="nextEpisode">下一${library.unit}</button>
        </div>
        <p class="sourceNote">${library.source}</p>
      `;

      document.getElementById("mobileBack").addEventListener("click", closeReader);
      document.getElementById("prevEpisode").addEventListener("click", () => openEpisode(Math.max(1, item.no - 1), true));
      document.getElementById("nextEpisode").addEventListener("click", () => openEpisode(Math.min(library.items.length, item.no + 1), true));
      document.getElementById("finishEpisode").addEventListener("click", finishEpisode);
      reader.querySelectorAll("[data-mark]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        markParagraph(Number(button.dataset.mark));
      }));
      reader.querySelectorAll("[data-paragraph]").forEach(block => block.addEventListener("click", () => markParagraph(Number(block.dataset.paragraph))));
    }

    function openEpisode(number, resetParagraph) {
      const state = currentState();
      state.episode = number;
      if (resetParagraph) state.paragraph = 0;
      save();
      renderList();
      renderProgress();
      renderReader();
      document.body.classList.add("reading");
      requestAnimationFrame(() => {
        const target = document.getElementById(`p${state.paragraph}`);
        if (target) target.scrollIntoView({ block: "center" });
      });
    }

    function closeReader() {
      document.body.classList.remove("reading");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function markParagraph(index) {
      const state = currentState();
      state.paragraph = index;
      save();
      renderProgress();
      renderReader();
      const target = document.getElementById(`p${index}`);
      if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
    }

    function finishEpisode() {
      const library = currentLibrary();
      const state = currentState();
      state.completed.add(state.episode);
      if (state.episode < library.items.length) {
        state.episode += 1;
        state.paragraph = 0;
      }
      save();
      renderList();
      renderProgress();
      renderReader();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    search.addEventListener("input", event => {
      const state = currentState();
      state.query = event.target.value;
      renderList();
    });
    document.getElementById("continueBtn").addEventListener("click", () => openEpisode(currentState().episode, false));
    document.querySelectorAll("[data-library]").forEach(button => {
      button.addEventListener("click", () => {
        const nextKey = button.dataset.library;
        if (!libraries[nextKey] || nextKey === activeLibraryKey) return;
        activeLibraryKey = nextKey;
        localStorage.setItem("storyShelf.activeLibrary", activeLibraryKey);
        document.body.classList.remove("reading");
        renderLibraryChrome();
        renderList();
        renderProgress();
        renderReader();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
    window.addEventListener("popstate", closeReader);

    renderLibraryChrome();
    renderList();
    renderProgress();
    renderReader();
  </script>
</body>
</html>
