<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e53b3b">
  <title>宝可梦无印篇逐集剧情资料</title>
  <style>
    :root {
      --red: #e53b3b;
      --red-deep: #b8202e;
      --blue: #2f72c8;
      --yellow: #ffd84d;
      --green: #38a96b;
      --ink: #172033;
      --muted: #667085;
      --paper: #fffdf7;
      --card: #fff;
      --line: rgba(23, 32, 51, .14);
      --shadow: 0 16px 40px rgba(23, 32, 51, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      letter-spacing: 0;
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 370px minmax(0, 1fr);
    }

    .catalog {
      height: 100vh;
      overflow: auto;
      padding: 20px 16px 28px;
      background: rgba(255, 255, 255, .94);
      border-right: 1px solid var(--line);
    }

    .brand {
      display: grid;
      grid-template-columns: 56px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .ball {
      width: 56px;
      aspect-ratio: 1;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle, #fff 0 17%, var(--ink) 18% 25%, transparent 26%),
        linear-gradient(to bottom, var(--red) 0 45%, var(--ink) 46% 55%, #fff 56% 100%);
      box-shadow: 0 7px 0 rgba(23, 32, 51, .08);
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.16;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .search {
      width: 100%;
      height: 44px;
      margin-bottom: 10px;
      padding: 0 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
    }
    .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47, 114, 200, .12); }

    .progress {
      padding: 13px;
      margin-bottom: 12px;
      color: #fff;
      background: var(--ink);
      border-radius: 8px;
    }
    .progressTop { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .progress strong { font-size: 14px; }
    .progress span { color: rgba(255,255,255,.72); font-size: 12px; }
    .meter { height: 7px; margin-top: 10px; overflow: hidden; background: rgba(255,255,255,.18); border-radius: 999px; }
    .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--yellow), #61dc8d); }

    .continueBtn {
      width: 100%;
      min-height: 43px;
      margin-bottom: 12px;
      padding: 9px 13px;
      color: #fff;
      font-weight: 800;
      background: var(--red);
      border: 0;
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(229, 59, 59, .2);
    }

    .episodeList { display: grid; gap: 8px; }
    .episodeCard {
      width: 100%;
      display: grid;
      grid-template-columns: 43px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 11px;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .episodeCard.active { border-color: var(--red); box-shadow: 0 8px 20px rgba(23, 32, 51, .08); }
    .episodeCard.done .episodeNo { color: #fff; background: var(--green); }
    .episodeNo {
      width: 43px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 900;
      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 50%;
    }
    .episodeTitle { display: block; font-size: 15px; font-weight: 850; line-height: 1.35; }
    .episodeSummary {
      display: -webkit-box;
      margin-top: 4px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; }

    .readerPane {
      min-width: 0;
      min-height: 100vh;
      padding: 28px clamp(20px, 5vw, 70px) 52px;
      background:
        linear-gradient(90deg, rgba(47,114,200,.06) 1px, transparent 1px),
        linear-gradient(rgba(47,114,200,.06) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
    }

    .reader { width: min(860px, 100%); margin: 0 auto; }
    .mobileBack {
      display: none;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      padding: 0;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 50%;
      font-size: 22px;
    }
    .kicker { margin: 0 0 8px; color: var(--red-deep); font-size: 13px; font-weight: 900; }
    .readerTitle { margin: 0; font-size: clamp(27px, 4vw, 42px); line-height: 1.18; }
    .readerSummary { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }

    .metaRow {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0 24px;
    }
    .meta {
      padding: 12px 14px;
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .meta strong { display: block; margin-bottom: 4px; font-size: 12px; color: var(--blue); }
    .meta span { font-size: 14px; line-height: 1.55; }

    .story { display: grid; gap: 12px; }
    .paragraph {
      position: relative;
      padding: 19px 18px 18px 54px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(23,32,51,.045);
    }
    .paragraph.current { border-color: var(--red); box-shadow: 0 0 0 3px rgba(229,59,59,.1); }
    .paraNo {
      position: absolute;
      top: 18px;
      left: 16px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--blue);
      border-radius: 50%;
      font-size: 12px;
      font-weight: 900;
    }
    .paragraph p { margin: 0; font-family: "Songti SC", "STSong", serif; font-size: 18px; line-height: 1.95; }
    .markBtn {
      margin-top: 12px;
      padding: 6px 0;
      color: var(--red-deep);
      background: transparent;
      border: 0;
      font-size: 13px;
      font-weight: 800;
    }

    .navRow { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-top: 20px; }
    .navBtn {
      min-height: 44px;
      padding: 9px 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 800;
    }
    .navBtn.primary { color: #fff; background: var(--red); border-color: var(--red); }
    .sourceNote { margin: 22px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .sourceNote a { color: var(--blue); }

    @media (max-width: 760px) {
      .app { display: block; }
      .catalog { height: auto; min-height: 100vh; border-right: 0; }
      .readerPane { display: none; min-height: 100vh; padding: 18px 14px 40px; }
      body.reading .catalog { display: none; }
      body.reading .readerPane { display: block; }
      .mobileBack { display: grid; place-items: center; }
      .readerTitle { font-size: 30px; }
      .metaRow { grid-template-columns: 1fr; }
      .paragraph { padding: 17px 14px 16px 46px; }
      .paraNo { top: 17px; left: 12px; }
      .paragraph p { font-size: 18px; line-height: 1.9; }
      .navRow { grid-template-columns: 1fr 1fr; }
      .navRow .primary { grid-column: 1 / -1; grid-row: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="catalog">
      <header class="brand">
        <div class="ball" aria-hidden="true"></div>
        <div>
          <h1>宝可梦逐集剧情</h1>
          <p class="subtitle">无印篇 · 关都篇＋橘子群岛篇 · 第1—116集</p>
        </div>
      </header>
      <input class="search" id="search" type="search" placeholder="搜索标题、地点、人物或宝可梦" aria-label="搜索">
      <section class="progress" aria-label="阅读进度">
        <div class="progressTop"><strong id="progressTitle">准备出发</strong><span id="progressCount">0/80</span></div>
        <div class="meter"><i id="progressMeter"></i></div>
      </section>
      <button class="continueBtn" id="continueBtn">继续上次看到的位置</button>
      <div class="episodeList" id="episodeList"></div>
    </aside>

    <main class="readerPane">
      <div class="reader" id="reader"></div>
    </main>
  </div>

  <script>
    const episodes = [
      {
        no: 1,
        title: "宝可梦！就决定是你了！",
        locations: "真新镇、大木研究所、真新镇郊外、常磐市郊外",
        people: "小智、花子、大木博士、小茂、小霞",
        pokemon: "皮卡丘、波波、小拉达、烈雀、凤王",
        summary: "小智得到不肯听话的皮卡丘，在烈雀群的追击中第一次用行动赢得伙伴的信任。",
        paragraphs: [
          "小智到了可以领取初始宝可梦、独自外出旅行的年纪。出发前一晚，他正在电视里观看一场宝可梦比赛。赛场上，耿鬼迎战尼多力诺。尼多力诺低下头，用头顶的尖角发动角撞，耿鬼灵活地闪到一旁，随后使用催眠术，让尼多力诺陷入沉睡。训练家只好收回尼多力诺，换上体型巨大的大岩蛇。看到这里，小智更加期待自己的旅程，想象着有一天自己也能站在这样的赛场上，成为宝可梦大师。",
          "可是第二天早晨，小智睡过了头。他匆匆赶到大木研究所时，妙蛙种子、小火龙和杰尼龟都已经被其他新人训练家领走。大木博士只好把一只不太愿意亲近人、也不喜欢进入精灵球的皮卡丘交给他，同时给了他宝可梦图鉴和精灵球。",
          "小智很喜欢皮卡丘，刚见面就兴奋地把它抱了起来。皮卡丘却并不信任这个冒失的新主人，立刻释放电击，把小智和大木博士电得浑身发麻。离开研究所后，小智希望皮卡丘进入精灵球，皮卡丘一次次把球拍开，坚持走在外面。小智只好戴上橡胶手套，用绳子拉着不肯配合的皮卡丘上路。",
          "来到真新镇郊外，小智遇见了一只波波。他没有先让宝可梦削弱波波的体力，就直接扔出精灵球，因此捕捉失败。小智请求皮卡丘出战，皮卡丘却坐在一旁，完全不听指挥。途中还有一只小拉达钻进小智的背包寻找食物，让小智第一次意识到，野外旅行远没有自己想象中轻松。",
          "捕捉波波失败后，小智不小心用石头击中了一只烈雀。烈雀受到攻击后立刻俯冲下来，用尖嘴连续袭击小智和皮卡丘。皮卡丘被惹怒了，释放电击，把这只烈雀从空中击落。受伤的烈雀随即呼唤同伴，大群烈雀从天空追来。皮卡丘在围攻中不断受伤，已经没有力气再次释放电击。",
          "小智抱着皮卡丘跳进河里，随后被正在钓鱼的小霞拉上岸。小霞看到皮卡丘伤势严重，告诉小智附近的常磐市有宝可梦中心。烈雀群再次出现后，小智骑走小霞的自行车，载着皮卡丘向常磐市逃去，并答应以后归还。",
          "天空下起暴雨，道路很快变得泥泞不堪。自行车最终失去平衡，小智和皮卡丘一起摔在地上。小智拿出精灵球，请虚弱的皮卡丘先躲进去，但皮卡丘仍然不愿进入精灵球。面对逼近的烈雀群，小智不再逃跑，而是站到皮卡丘前面，张开双臂保护它。",
          "皮卡丘第一次真正感受到，小智虽然冒失，却愿意在危险时挡在自己前面。就在烈雀群即将扑来时，皮卡丘跳上小智的肩膀，又迎着暴雨跃向空中。一道闪电落下，强大的电流汇聚在皮卡丘身上。皮卡丘随即释放出威力巨大的电击，将烈雀群全部击退，也把小霞的自行车烧坏了。",
          "雨停以后，小智和皮卡丘从地上醒来。经过这场危险，他们之间终于建立起最初的信任。此时，一只金色的神秘宝可梦从彩虹前飞过，小智的图鉴无法识别它；这只宝可梦后来被确认是凤王。远方已经能够看见常磐市，小智抱起受伤的皮卡丘，继续向宝可梦中心前进。"
        ]
      },
      {
        no: 2,
        title: "宝可梦中心大对决",
        locations: "常磐市、常磐市宝可梦中心、常磐森林入口",
        people: "小智、小霞、君莎、乔伊、武藏、小次郎",
        pokemon: "皮卡丘、角金鱼、阿柏蛇、瓦斯弹、喵喵、绿毛虫",
        summary: "小智把皮卡丘送进宝可梦中心，并第一次正面遭遇火箭队三人组。",
        paragraphs: [
          "小智抱着重伤的皮卡丘赶到常磐市。由于城里正在警戒偷盗宝可梦的可疑人物，君莎起初把衣服破烂、又带着受伤宝可梦的小智当成嫌疑人。小智出示大木博士交给他的图鉴，身份得到确认后，君莎驾驶摩托车把他送到宝可梦中心。",
          "乔伊立刻把皮卡丘推进治疗室。小智只能在门外等待，这时小霞也追到了宝可梦中心。她本来是来追究自行车被毁的事情，看见皮卡丘还在抢救后，暂时放下了责备。小智也第一次认真意识到，自己的莽撞差一点让伙伴付出很大的代价。",
          "宝可梦中心突然响起警报。火箭队的武藏、小次郎和会说人话的喵喵从屋顶闯入，准备抢走中心里正在治疗的宝可梦。武藏派出阿柏蛇，小次郎派出瓦斯弹；瓦斯弹首先释放浓烟遮住视线，阿柏蛇则在烟雾中向储存精灵球的区域逼近。乔伊启动传送设备，把能够转移的宝可梦送往尼比市。",
          "小智身边没有能够正常战斗的伙伴，只能接连扔出中心里的精灵球。出现的波波和小拉达都不是他的宝可梦，自然不会听从指挥。小霞派出角金鱼，但这里没有足够的水，角金鱼落在地面上无法行动，只能被立刻收回。阿柏蛇和瓦斯弹继续破坏大门，局面越来越危险。",
          "治疗尚未完全结束的皮卡丘在混乱中醒来。中心里其他皮卡丘围到它身边，把电力传给它。小智又踩动小霞那辆已经烧焦的自行车，让车灯的发电装置继续补充电能。皮卡丘吸收电力后使用强力电击，电流与瓦斯弹散布的气体接触，引发巨大爆炸，把武藏、小次郎和喵喵一起炸飞出去。",
          "火箭队虽然失败，却认定这只皮卡丘拥有不同寻常的力量，从此把捕捉它当成长期目标。第二天，恢复精神的皮卡丘与小智离开常磐市，小霞则以要求赔偿自行车为理由跟了上来。三人进入常磐森林不久，小智发现了一只绿毛虫，并拿出精灵球准备进行旅程中的第一次正式收服。"
        ]
      },
      {
        no: 3,
        title: "终于捉到宝可梦了",
        locations: "常磐森林",
        people: "小智、小霞、武藏、小次郎",
        pokemon: "皮卡丘、绿毛虫、比比鸟、阿柏蛇、瓦斯弹、喵喵、铁甲蛹",
        summary: "小智收服绿毛虫和比比鸟；最不起眼的绿毛虫在火箭队面前完成逆转。",
        paragraphs: [
          "小智在常磐森林里直接向绿毛虫投出精灵球，成功完成旅程中的第一次收服。小智十分兴奋，小霞却非常害怕虫系宝可梦。绿毛虫想靠近小霞表示友好，小霞不断后退，这让绿毛虫很失落。皮卡丘主动陪在绿毛虫身边，两个宝可梦很快成为朋友。",
          "夜里，小智和小霞睡着后，绿毛虫向皮卡丘表达了自己的愿望：它希望有一天能够进化成巴大蝶，在天空中自由飞翔。第二天早晨，小智发现野生的比比鸟，又想立刻收服。小霞提醒他，比比鸟是飞行系宝可梦，绿毛虫面对它非常不利。",
          "小智还是先派出绿毛虫。比比鸟发动攻击后，绿毛虫很快陷入危险，小智只好把它收回，改派皮卡丘。皮卡丘使用电击击中比比鸟，削弱它的体力，小智趁机投出精灵球，成功把比比鸟收进队伍。",
          "火箭队随后出现，目标依然是皮卡丘。武藏派出阿柏蛇，小次郎派出瓦斯弹，两只宝可梦同时进攻。瓦斯弹先使用污泥遮住皮卡丘的视线，使皮卡丘暂时失去战斗能力。小智换上刚收服的比比鸟；比比鸟用电光一闪发动冲击，又扇动翅膀使出烈暴风，但阿柏蛇钻入地下避开攻击，瓦斯弹再用烟幕和污泥连续压制，比比鸟最终也败下阵来。",
          "小智只剩下绿毛虫可以出战。面对阿柏蛇和瓦斯弹，绿毛虫起初非常害怕，但在小智鼓励下使用吐丝。坚韧的丝先把瓦斯弹整个缠住，又封住阿柏蛇的行动。绿毛虫随后使用撞击，把瓦斯弹撞向阿柏蛇，两只宝可梦一起失去战斗能力；准备上前帮忙的喵喵也被吐丝捆住。",
          "火箭队狼狈撤退后，小霞第一次主动肯定绿毛虫的勇气。绿毛虫随即从口中吐出大量丝线，把自己的身体完全包住，进化成铁甲蛹。它离成为巴大蝶的梦想，又接近了一步。"
        ]
      },
      {
        no: 4,
        title: "武士少年的挑战",
        locations: "常磐森林深处、独角虫栖息地、大针蜂巢穴",
        people: "小智、小霞、武士少年、武藏、小次郎",
        pokemon: "铁甲蛹、比比鸟、凯罗斯、独角虫、铁壳蛹、大针蜂、巴大蝶",

    const STORAGE = {
      episode: "pokemonEpisodeGuide.currentEpisode",
      paragraph: "pokemonEpisodeGuide.currentParagraph",
      completed: "pokemonEpisodeGuide.completed"
    };

    const state = {
      episode: Math.min(episodes.length, Math.max(1, Number(localStorage.getItem(STORAGE.episode) || 1))),
      paragraph: Math.max(0, Number(localStorage.getItem(STORAGE.paragraph) || 0)),
      completed: new Set(JSON.parse(localStorage.getItem(STORAGE.completed) || "[]")),
      query: ""
    };

    const episodeList = document.getElementById("episodeList");
    const reader = document.getElementById("reader");
    const search = document.getElementById("search");

    function save() {
      localStorage.setItem(STORAGE.episode, String(state.episode));
      localStorage.setItem(STORAGE.paragraph, String(state.paragraph));
      localStorage.setItem(STORAGE.completed, JSON.stringify([...state.completed]));
    }

    function currentEpisode() {
      return episodes.find(item => item.no === state.episode) || episodes[0];
    }

    function renderProgress() {
      const count = state.completed.size;
      document.getElementById("progressTitle").textContent = count ? `已读完 ${count} 集` : "准备出发";
      document.getElementById("progressCount").textContent = `${count}/${episodes.length}`;
      document.getElementById("progressMeter").style.width = `${Math.round(count / episodes.length * 100)}%`;
      document.getElementById("continueBtn").textContent = `继续第${state.episode}集 · 第${state.paragraph + 1}段`;
    }

    function renderList() {
      const query = state.query.trim().toLowerCase();
      const matches = episodes.filter(item => !query || [item.title, item.locations, item.people, item.pokemon, item.summary].join(" ").toLowerCase().includes(query));
      episodeList.innerHTML = matches.map(item => `
        <button class="episodeCard ${item.no === state.episode ? "active" : ""} ${state.completed.has(item.no) ? "done" : ""}" data-episode="${item.no}">
          <span class="episodeNo">${item.no}</span>
          <span>
            <span class="episodeTitle">第${item.no}集 ${item.title}</span>
            <span class="episodeSummary">${item.summary}</span>
          </span>
        </button>
      `).join("") || `<div class="empty">没有找到相关集数</div>`;

      episodeList.querySelectorAll("[data-episode]").forEach(button => {
        button.addEventListener("click", () => openEpisode(Number(button.dataset.episode), true));
      });
    }

    function renderReader() {
      const item = currentEpisode();
      state.paragraph = Math.min(state.paragraph, item.paragraphs.length - 1);
      reader.innerHTML = `
        <button class="mobileBack" id="mobileBack" aria-label="返回目录">←</button>
        <p class="kicker">${item.no <= 80 ? "关都地区" : "橘子群岛篇"} · 第${item.no}集</p>
        <h2 class="readerTitle">${item.title}</h2>
        <p class="readerSummary">${item.summary}</p>
        <div class="metaRow">
          <div class="meta"><strong>地点路线</strong><span>${item.locations}</span></div>
          <div class="meta"><strong>主要人物与宝可梦</strong><span>${item.people}；${item.pokemon}</span></div>
        </div>
        <div class="story">
          ${item.paragraphs.map((paragraph, index) => `
            <article class="paragraph ${index === state.paragraph ? "current" : ""}" id="p${index}" data-paragraph="${index}">
              <span class="paraNo">${index + 1}</span>
              <p>${paragraph}</p>
              <button class="markBtn" data-mark="${index}">记住这里</button>
            </article>
          `).join("")}
        </div>
        <div class="navRow">
          <button class="navBtn" id="prevEpisode">上一集</button>
          <button class="navBtn primary" id="finishEpisode">读完本集</button>
          <button class="navBtn" id="nextEpisode">下一集</button>
        </div>
        <p class="sourceNote">剧情按电视动画原始集序整理；技能名称以动画明确表现及常用中文译名为准。参考：<a href="https://www.tv-tokyo.co.jp/anime/pokemon/poke_en/epi_en/enepi/" target="_blank" rel="noopener">东京电视台动画档案</a>。</p>
      `;

      document.getElementById("mobileBack").addEventListener("click", closeReader);
      document.getElementById("prevEpisode").addEventListener("click", () => openEpisode(Math.max(1, item.no - 1), true));
      document.getElementById("nextEpisode").addEventListener("click", () => openEpisode(Math.min(episodes.length, item.no + 1), true));
      document.getElementById("finishEpisode").addEventListener("click", finishEpisode);
      reader.querySelectorAll("[data-mark]").forEach(button => button.addEventListener("click", event => {
        event.stopPropagation();
        markParagraph(Number(button.dataset.mark));
      }));
      reader.querySelectorAll("[data-paragraph]").forEach(block => block.addEventListener("click", () => markParagraph(Number(block.dataset.paragraph))));
    }

    function openEpisode(number, resetParagraph) {
      state.episode = number;
      if (resetParagraph) state.paragraph = 0;
      save();
      renderList();
      renderProgress();
      renderReader();
      document.body.classList.add("reading");
      requestAnimationFrame(() => {
        const target = document.getElementById(`p${state.paragraph}`);
        if (target) target.scrollIntoView({ block: "center" });
      });
    }

    function closeReader() {
      document.body.classList.remove("reading");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function markParagraph(index) {
      state.paragraph = index;
      save();
      renderProgress();
      renderReader();
      const target = document.getElementById(`p${index}`);
      if (target) target.scrollIntoView({ block: "center", behavior: "smooth" });
    }

    function finishEpisode() {
      state.completed.add(state.episode);
      if (state.episode < episodes.length) {
        state.episode += 1;
        state.paragraph = 0;
      }
      save();
      renderList();
      renderProgress();
      renderReader();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    search.addEventListener("input", event => {
      state.query = event.target.value;
      renderList();
    });
    document.getElementById("continueBtn").addEventListener("click", () => openEpisode(state.episode, false));
    window.addEventListener("popstate", closeReader);

    renderList();
    renderProgress();
    renderReader();
  </script>
</body>
</html>
